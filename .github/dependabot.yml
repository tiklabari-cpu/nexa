# Dependency update PRs (tm 456 · F38). Small on purpose: a few open PRs at a time,
# so the weekly batch stays reviewable. Each one runs the normal CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # Patch and minor bumps arrive as one PR; a major bump is always its own.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
