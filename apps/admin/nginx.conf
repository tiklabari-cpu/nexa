# SiyahTuş admin (root / platform panel) — static SPA + reverse proxy (tm 389.6).
# Rendered from a template at container start (`${VAR}` tokens only; nginx's own request
# variables below are unbraced `$var` and untouched by that step — see the Dockerfile).
#
# Same profile as apps/web/nginx.conf with three deliberate differences:
#   - `/platform/` is proxied to the platform-api process (`PLATFORM_UPSTREAM`), not `/api/`;
#   - there is no WebSocket and no second origin, so `connect-src` is `'self'` and nothing else;
#   - there is nothing to embed this panel in, ever: `frame-ancestors 'none'` + `X-Frame-Options: DENY`.

# HSTS, only where it means anything: browsers ignore it over plain HTTP, so the value is
# empty (and nginx skips an `add_header` whose value is empty) unless the TLS terminator in
# front says the request arrived over HTTPS. A year with `includeSubDomains`, deliberately
# no `preload`: that is a one-way door owned by whoever runs the domain.
map $http_x_forwarded_proto $siyahtus_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# The panel's Content-Security-Policy, written once (nginx has no constants; a `map` off an
# always-present variable is the idiom). Each source list is what the built app needs:
#
#   script-src   `index.html` carries one inline script — the theme boot — pinned by hash
#                rather than 'unsafe-inline'. `test/nginx-security.test.ts` recomputes the
#                hash from the file and fails if the two disagree. The digest is over the
#                script with LF newlines: the HTML parser normalises CRLF before CSP sees it.
#   style-src    Components set inline `style` attributes at runtime (popper positioning,
#                scroll locking); there is no hash for a stylesheet written while running.
#   connect-src  Same-origin REST (`/platform/v1`, proxied below) and nothing else.
#   img-src      `data:` for inlined icons; no remote images — an operator panel loads none.
map $host $siyahtus_csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-4hibBeoWYMXmhmu1zlejSeQ1zr9kLd0RQNwolpci+yo='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # `proxy_pass` to a bare hostname resolves it once, at config load — if the platform-api
    # service is not up yet nginx refuses to start. Routing through a variable defers
    # resolution to request time via Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s;

    # The security profile is repeated in each block that serves a file rather than declared
    # once at server level, because nginx drops *every* inherited `add_header` in a block that
    # declares one of its own (the two below declare `Cache-Control`). `always` so an error
    # response carries it too.
    location / {
        add_header Content-Security-Policy $siyahtus_csp always;
        add_header Strict-Transport-Security $siyahtus_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }

    # `index.html` names its bundle by content hash, so a new image only helps if the shell is
    # refetched.
    location = /index.html {
        add_header Content-Security-Policy $siyahtus_csp always;
        add_header Strict-Transport-Security $siyahtus_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Content-Security-Policy $siyahtus_csp always;
        add_header Strict-Transport-Security $siyahtus_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same-origin platform API: the SPA calls relative `/platform/v1/...`, forwarded over the
    # compose network. No URI after the upstream in `proxy_pass` means the full incoming path
    # reaches platform-api unchanged, matching how it mounts its routes. No security headers
    # here on purpose: the API sets its own through helmet, and a second CSP on one response is
    # intersected with the first.
    #
    # The `X-Forwarded-For` line is why platform-api's `PLATFORM_IP_ALLOWLIST` and the sign-in
    # bucket see the caller: this container is one hop, anything terminating TLS in front is
    # another (`TRUST_PROXY_HOPS`). No WebSocket upgrade — the platform surface has none.
    location /platform/ {
        set $platform_upstream ${PLATFORM_UPSTREAM};
        proxy_pass $platform_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
