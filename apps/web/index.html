<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>SiyahTuş</title>
    <!--
      Theme boot (NFR-I18N2). Inline and synchronous because `data-theme` has to
      be on <html> before the first paint and the bundle that owns the theme
      store is a deferred module — set it there and a light-theme agent gets a
      dark frame first. This attribute used to be hard-coded `dark`, which made
      the light ramp in `tokens.css` unreachable for everyone; it is now the
      agent's remembered choice, defaulting to light (dark until 2026-10-12).

      Kept in step with `src/lib/theme.ts` (same key, same default) by
      `src/lib/theme.test.ts`, which reads this file.
    -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('siyahtus.theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
      // The panel font preset the last load was given (src/lib/font.ts), so
      // the first paint is not Inter while the profile request is in flight.
      try {
        var font = localStorage.getItem('siyahtus.font');
        if (['plus-jakarta', 'manrope-dm-sans', 'nunito', 'figtree'].indexOf(font) !== -1) {
          document.documentElement.dataset.font = font;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
