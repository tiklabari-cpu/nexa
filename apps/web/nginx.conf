# SiyahTuş web (agent app) — static SPA + reverse proxy (tm 140.2, M-CONTAINER-b).
# Rendered from a template at container start (`${VAR}` tokens only; nginx's
# own request variables below are unbraced `$var` and untouched by that step
# — see the Dockerfile's COPY comment for `envsubst`'s scoping).

# HSTS, only where it means anything (M-PROD-CFG-b).
#
# The header is ignored by browsers over plain HTTP, and there is no TLS in this
# repository (CLAUDE.md) — TLS is terminated by whatever sits in front of this
# container. So the profile carries HSTS but emits it only when that terminator
# says the request arrived over HTTPS, which leaves the local http stack working
# unchanged: nothing sets `X-Forwarded-Proto` there, the value is empty, and
# nginx skips an `add_header` whose value is empty.
#
# A year with `includeSubDomains`, and deliberately no `preload`: preloading is
# a one-way door owned by whoever runs the domain, not by an image default.
map $http_x_forwarded_proto $siyahtus_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# The panel's Content-Security-Policy, written once (M-PROD-CFG-b).
#
# nginx has no way to declare a constant, so a `map` off an always-present
# variable is the idiom — the policy is repeated in three locations below and
# must not drift between them.
#
# Each source list is what the built app actually needs, measured rather than
# guessed (`apps/web/test/nginx-security.test.ts` re-measures it on every run):
#
#   script-src   `index.html` carries one inline script — the theme boot, which
#                has to run before first paint or a light-theme agent gets a
#                dark frame. It is pinned by hash rather than opened up with
#                'unsafe-inline'; a browser that understands the hash ignores
#                'unsafe-inline' anyway, so there is no fallback to add. The
#                test computes the hash from `index.html` and fails if the two
#                disagree, so editing that script cannot silently blank the app.
#                The hash is over the script with LF newlines, not over the bytes
#                on the wire: the HTML parser normalises CRLF before CSP ever
#                sees the text, so a Windows checkout and a Linux one produce the
#                same digest. Measured, not assumed — Chromium rejected the
#                CRLF-based digest and named the LF one.
#   style-src    Radix/shadcn set inline `style` attributes and inject <style>
#                elements at runtime (scroll locking, popper positioning). There
#                is no hash for a stylesheet a component writes while running.
#   img-src      Agent avatars are arbitrary workspace-supplied URLs, and
#                attachments render from object URLs (`Attachment.tsx`).
#                `https:` and not `http:`: a panel served over TLS could not
#                load a plain-http image anyway (mixed content), so allowing it
#                would only widen the policy for the demo stack.
#   connect-src  Same-origin REST (`/api/v1`, proxied below) plus the RTM
#                WebSocket, which cannot be same-origin because a WebSocket URL
#                needs a ws/wss scheme up front — its address is baked into the
#                bundle at build time (VITE_RTM_URL), so the policy has to be
#                told the same one. `CSP_CONNECT_EXTRA` defaults in the
#                Dockerfile to the published RTM port that build arg names.
#   frame-src    Custom panels (KN-05 · owner decision K29 · tm 379): an
#                operator's own back-office page framed in the Inbox's Details
#                pane. `https:` and nothing narrower, because the policy is
#                one header for every workspace — the panel is served as the
#                same `index.html` to all of them, and which workspace (and so
#                which panel origins) is only known after sign-in. A header per
#                tenant would need a sub-domain per workspace or HTML served by
#                the API, and either breaks the Cloudflare Tunnel / Caddy
#                deployment. So the CSP is broad and the gate is on the server,
#                the widget's `frame-ancestors *` pattern turned around: only an
#                admin-saved `https://` address is ever framed (the
#                `custom_panels_url_check` CHECK, audited), always
#                `sandbox="allow-scripts allow-forms allow-popups"` with no
#                `allow-same-origin`, messages are acted on only from that
#                frame's window with its nonce, and the conversation travels
#                as a five-minute signed token by postMessage, never in an
#                address. `http:` stays closed (mixed content, and K29 opens
#                none). `frame-ancestors 'none'` and `X-Frame-Options: DENY`
#                are unchanged: the panel frames others, nobody frames it.
#
# No `upgrade-insecure-requests`: this stack is reachable over plain http on
# purpose, and the directive would make the browser rewrite its own requests.
map $host $siyahtus_csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-WbzjrVxW455iAj977j6syHOwM9BgoW5g69ofEXD75hM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; frame-src https:; connect-src 'self' ${CSP_CONNECT_EXTRA}";
}

server {
    listen 8080;
    server_name _;

    # Do not announce the nginx version, in the `Server` header or on error pages (tm 404).
    server_tokens off;
    root /usr/share/nginx/html;

    # `proxy_pass` to a bare hostname resolves it once, at config load —
    # if the api/rtm service isn't up yet (or isn't running at all, as when
    # this image is smoke-tested standalone) nginx refuses to start at all
    # (measured: `host not found in upstream "api"` is fatal, not a per-request
    # 502). Routing through a variable defers resolution to request time via
    # Docker's embedded DNS (127.0.0.11 on any compose/user-defined network),
    # so a missing upstream fails only the requests that hit it.
    resolver 127.0.0.11 valid=10s;

    # SPA fallback: any path the client-side router owns (not a real file,
    # e.g. `/app/inbox`) resolves to the same document; React Router takes it
    # from there. Real files (JS/CSS/config) are served as-is.
    #
    # The security profile is repeated in this and the next two blocks rather
    # than declared once at server level, because nginx drops *every* inherited
    # `add_header` in a block that declares one of its own — and the two blocks
    # below declare `Cache-Control`. A server-level copy would therefore be
    # silently missing from `/index.html`, the one document the whole policy is
    # about. `always` so an error response carries it too.
    location / {
        add_header Content-Security-Policy $siyahtus_csp always;
        add_header Strict-Transport-Security $siyahtus_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }

    # `index.html` names its bundle by content hash (Vite), so a new image
    # only helps if the *shell* is refetched — caching it would keep serving
    # stale references to assets a new deploy already replaced.
    location = /index.html {
        add_header Content-Security-Policy $siyahtus_csp always;
        add_header Strict-Transport-Security $siyahtus_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }

    # The public API documentation (KN-04 · tm 376): a second page of the same
    # build (`developers/docs/index.html`) plus the published `openapi.json` that
    # sits beside it. No sign-in — the SPA fallback above would answer a directory
    # URL with the panel's shell, which is why this needs a location of its own.
    # It runs under the panel's policy unchanged: its script and stylesheet are
    # same-origin files, it builds every node from text, and it fetches only the
    # JSON next to it (`connect-src 'self'`).
    location = /developers/docs {
        add_header Content-Security-Policy $siyahtus_csp always;
        add_header Strict-Transport-Security $siyahtus_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Relative, so the redirect keeps whatever host and scheme the proxy in
        # front presented (nginx would otherwise rebuild it from its own :8080).
        absolute_redirect off;
        return 301 /developers/docs/;
    }

    location /developers/docs/ {
        add_header Content-Security-Policy $siyahtus_csp always;
        add_header Strict-Transport-Security $siyahtus_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # The page and the document change with a deploy under the same URL.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Vite's hashed chunks/assets never change content under the same URL.
    location /assets/ {
        add_header Content-Security-Policy $siyahtus_csp always;
        add_header Strict-Transport-Security $siyahtus_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same-origin API: `ApiClient` defaults to relative `/api/v1/...`
    # (apps/web/src/lib/api-client.ts) so the browser never needs the api
    # container's address — forwarded here over the compose network. No URI
    # component after the upstream in `proxy_pass` means the full incoming
    # path (`/api/v1/...`) reaches the api service unchanged, matching how it
    # mounts its own routes.
    #
    # No security headers here on purpose: the API sets its own through helmet
    # (`server.ts`), and a second `Content-Security-Policy` on the same response
    # is intersected with the first rather than replacing it.
    #
    # The `X-Forwarded-For` line below is why the API needs TRUST_PROXY_HOPS:
    # this location appends the caller to whatever the caller sent, so this
    # container is one hop — and anything terminating TLS in front of it is
    # another. The pilot's Caddyfile (infra/pilot/Caddyfile.example) sends the
    # panel's `/api/*` to the api directly and never reaches this block, so the
    # panel and the widget arrive with the same single hop (tm 256.5).
    #
    # The body ceiling (tm 439). nginx refuses anything over 1 MiB by default,
    # with an HTML 413 of its own, before the api sees a byte — so through this
    # block (docker-compose.full.yml, Helm) a 3 MiB PDF attachment or a 5 MiB
    # knowledge file never arrived. The largest body the panel sends is an
    # upload PUT, which the api caps at `HARD_CEILING`
    # (apps/api/src/routes/uploads.ts, 25 MiB). This sits one MiB above it on
    # purpose: a file over the api's limit is then refused by the api, with the
    # error that names the limit, and not by nginx with a page the panel cannot
    # read. nginx-security.test.ts derives this value from that constant.
    location /api/ {
        client_max_body_size 26m;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RTM WebSocket — normally unused: the built bundle's default (the
    # Dockerfile's VITE_RTM_URL build arg) dials the rtm container's
    # published host port directly. This location is the documented
    # alternative: rebuild with VITE_RTM_URL pointing at this container's own
    # published host:port and RTM traffic routes through nginx instead.
    #
    # It appends the caller to `X-Forwarded-For` exactly as `/api/` does, so
    # this container is one hop for rtm as it is for the api: rtm counts its
    # pre-login cap per client address under the same TRUST_PROXY_HOPS (tm 405),
    # and without this line every browser routed this way would arrive as this
    # container's own address and share one cap.
    location /v1/agent/rtm/ws {
        set $rtm_upstream ${RTM_UPSTREAM};
        proxy_pass $rtm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
