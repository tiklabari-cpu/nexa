# Nexa web (agent app) — static SPA + reverse proxy (tm 140.2, M-CONTAINER-b).
# Rendered from a template at container start (`${VAR}` tokens only; nginx's
# own request variables below are unbraced `$var` and untouched by that step
# — see the Dockerfile's COPY comment for `envsubst`'s scoping).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # `proxy_pass` to a bare hostname resolves it once, at config load —
    # if the api/rtm service isn't up yet (or isn't running at all, as when
    # this image is smoke-tested standalone) nginx refuses to start at all
    # (measured: `host not found in upstream "api"` is fatal, not a per-request
    # 502). Routing through a variable defers resolution to request time via
    # Docker's embedded DNS (127.0.0.11 on any compose/user-defined network),
    # so a missing upstream fails only the requests that hit it.
    resolver 127.0.0.11 valid=10s;

    # SPA fallback: any path the client-side router owns (not a real file,
    # e.g. `/app/inbox`) resolves to the same document; React Router takes it
    # from there. Real files (JS/CSS/config) are served as-is.
    location / {
        try_files $uri /index.html;
    }

    # `index.html` names its bundle by content hash (Vite), so a new image
    # only helps if the *shell* is refetched — caching it would keep serving
    # stale references to assets a new deploy already replaced.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed chunks/assets never change content under the same URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same-origin API: `ApiClient` defaults to relative `/api/v1/...`
    # (apps/web/src/lib/api-client.ts) so the browser never needs the api
    # container's address — forwarded here over the compose network. No URI
    # component after the upstream in `proxy_pass` means the full incoming
    # path (`/api/v1/...`) reaches the api service unchanged, matching how it
    # mounts its own routes.
    location /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RTM WebSocket — normally unused: the built bundle's default (the
    # Dockerfile's VITE_RTM_URL build arg) dials the rtm container's
    # published host port directly. This location is the documented
    # alternative: rebuild with VITE_RTM_URL pointing at this container's own
    # published host:port and RTM traffic routes through nginx instead.
    location /v1/agent/rtm/ws {
        set $rtm_upstream ${RTM_UPSTREAM};
        proxy_pass $rtm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
