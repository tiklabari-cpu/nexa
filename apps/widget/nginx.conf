# Nexa widget — static file serving only, no proxying (tm 140.2, M-CONTAINER-b).
# Rendered from a template at container start since M-PROD-CFG-b: the security
# profile below has to name the API origin this deployment's widget talks to,
# and that address is not knowable when the image is built. Only `${VAR}` tokens
# are substituted — nginx's own `$uri` and friends are untouched (see the web
# Dockerfile's COPY comment for `envsubst`'s scoping).

# HSTS, only where it means anything (M-PROD-CFG-b). Same reasoning as
# apps/web/nginx.conf: no TLS in this repository, so the header is emitted only
# when the terminator in front says the request arrived over HTTPS, and the
# local http stack is unaffected because nginx skips an empty `add_header`.
map $http_x_forwarded_proto $nexa_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# The widget's Content-Security-Policy, written once (M-PROD-CFG-b).
#
# Tighter than the panel's in the one direction that matters — this document
# runs on customer sites, so it is the piece of Nexa most exposed to a page we
# do not control — and deliberately *open* in the other:
#
#   frame-ancestors *   The whole point of the widget is being embedded in
#                       someone else's page, and there is no list of allowed
#                       embedders to write here: it is per-workspace, it lives
#                       in the database, and it is already enforced where it can
#                       be — the API checks the embedding origin against the
#                       organization's trusted domains before minting a customer
#                       token. Locking it down here would break every install
#                       and protect nothing that is not already protected.
#                       For the same reason there is no `X-Frame-Options` header
#                       anywhere in this file: the legacy header has no "allow
#                       anyone" value, so any value at all would kill the embed.
#   script-src 'self'   No inline script in `widget.html`/`chat.html`, so no
#                       hash and no 'unsafe-inline' — unlike the panel, which
#                       needs its theme boot before first paint.
#   style-src           `widget.html`/`chat.html` each carry an inline <style>
#                       (first-paint framing), and `widget.ts` creates a <style>
#                       element at runtime for the themed shadow DOM.
#   img-src             Agent avatars are arbitrary workspace-supplied URLs and
#                       attachment previews render from object URLs.
#   connect-src         The widget's REST calls go to the API on another origin
#                       — it has no same-origin backend at all — so `'self'`
#                       alone would break every install. `CSP_CONNECT_EXTRA`
#                       defaults in the Dockerfile to `widget.ts`'s own default
#                       API base; a deployment sets it to its real API origin.
map $host $nexa_csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors *; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' ${CSP_CONNECT_EXTRA}";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The security profile is repeated in all three locations rather than
    # declared once at server level, because nginx drops *every* inherited
    # `add_header` in a block that declares one of its own — and two of the
    # three declare `Cache-Control`.
    #
    # `loader.js`, `widget.html` and `chat.html` carry no content hash — they
    # are the fixed URLs a customer's `<script src>` and the loader's iframe
    # src target forever (apps/widget/src/loader.ts buildFrameUrl), so a new
    # image has to reach them without a long-lived cache in the way.
    location ~ ^/(loader\.js|widget\.html|chat\.html)$ {
        add_header Content-Security-Policy $nexa_csp always;
        add_header Strict-Transport-Security $nexa_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed chunks/assets never change content under the same URL.
    location /assets/ {
        add_header Content-Security-Policy $nexa_csp always;
        add_header Strict-Transport-Security $nexa_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # No client-side router here (three independent documents, not an SPA) —
    # a path that isn't a real file is a genuine 404, not a fallback case.
    location / {
        add_header Content-Security-Policy $nexa_csp always;
        add_header Strict-Transport-Security $nexa_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}
