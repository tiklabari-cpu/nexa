name: nexa

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: nexa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_dev_password
      POSTGRES_DB: nexa
      # Deterministic ordering for tests
      LANG: C
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - '5433:5432'
    volumes:
      - nexa_pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexa -d nexa']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: nexa-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '']
    ports:
      - '6380:6379'
    volumes:
      - nexa_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s

  # Opt-in S3-compatible object store for exercising `STORAGE_PROVIDER=s3`
  # locally (M-STORE, NFR-R1). Not started by a plain `docker compose up` /
  # `make dev` — `STORAGE_PROVIDER=local` stays the default either way, this
  # is only reachable behind the `storage` profile:
  #   docker compose --profile storage up -d
  # Ports 9000 (S3 API) / 9001 (console) are free in this repo — db/redis
  # already claim the offset 5433/6380 pair, not these.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: nexa-minio
    restart: unless-stopped
    profiles: ['storage']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - nexa_miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-shot: creates the bucket `STORAGE_S3_BUCKET` (`.env.example`) expects,
  # then exits. MinIO does not create buckets by itself — every `s3-store.ts`
  # call would 404/NoSuchBucket without this having run first.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: nexa-minio-init
    restart: 'no'
    profiles: ['storage']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/nexa-uploads',
      ]

volumes:
  nexa_pgdata:
  nexa_redisdata:
  nexa_miniodata:
