{{- if .Values.backup.enabled }}
# Durable landing spot for templates/backup-cronjob.yaml's dumps. A CronJob
# pod's own filesystem is ephemeral and gone the moment the pod exits, so a
# PVC is the minimal "somewhere that survives the Job" answer this chart can
# give without inventing an object-storage integration it doesn't have (see
# values.yaml's backup block for that gap, stated there rather than here).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-backups
  labels:
    app.kubernetes.io/name: backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: nexa
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backup.pvcSize }}
{{- end }}
