apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/part-of: nexa
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Computed, not a static values.yaml entry: the in-cluster DNS name of the
  # api/rtm Services depends on the release name, which isn't known until
  # install time. nginx.conf (apps/web/Dockerfile) reads both at container
  # start via envsubst; the Dockerfile's own baked-in defaults
  # (`http://api:4000` / `http://rtm:4001`) only resolve on the compose
  # network this chart replaces, so they must be overridden here.
  API_UPSTREAM: http://{{ .Release.Name }}-api:{{ .Values.apps.api.port }}
  RTM_UPSTREAM: http://{{ .Release.Name }}-rtm:{{ .Values.apps.rtm.port }}
