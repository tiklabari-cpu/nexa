# Secret TEMPLATE — key names only, no real values (CLAUDE.md: gerçek secret
# YOK). `.Values.secrets` ships the same `dev-only-…`/`CHANGE_ME` placeholders
# as .env.example; see values.yaml's comment on why they stay placeholders
# rather than being blanked. A real deployment either overrides every
# `.Values.secrets.*` key at install time (`--set-string` / a values file kept
# out of git / `--set-file`) or points its own externally-managed Secret at
# the same name and skips this template entirely (`--set secrets.enabled=false`
# below leaves the name free for that).
#
# THIS LIST IS FIXED, NOT A `range` OVER `.Values.secrets` — adding a key under
# `secrets:` in values.yaml does NOTHING until it is also named below. That is a
# real trap and it has already cost something: values.production.example.yaml
# documents two production-relevant keys (INBOUND_EMAIL_SECRET,
# DATABASE_REPLICA_URL) that are unreachable through this template for exactly
# this reason, and tm 242's two STORAGE_S3_* keys were added here at the same
# time as they were added to values.yaml precisely so they would not become a
# third. apps/api/src/config/chart-storage.test.ts now checks the two files
# against each other so the next key cannot be half-added in silence.
#
# It stays fixed rather than becoming a `range`: a Secret whose keys are
# whatever a values file happens to contain would ship whatever a typo produced,
# and `envFrom` would hand it to the process as an env var nobody declared.
#
# `if .Values.secrets.enabled` on its own, NOT `| default true` (tm 164.4,
# found while documenting that exact `--set secrets.enabled=false` path):
# Sprig's `default` treats the boolean `false` itself as an empty value, so
# `.Values.secrets.enabled | default true` silently coerced an explicit
# `false` back to `true` — the override this comment describes was
# unreachable. values.yaml already sets `secrets.enabled: true` as a real
# default, so the bare value needs no fallback here.
{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/part-of: nexa
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  JWT_SIGNING_KEY: {{ .Values.secrets.JWT_SIGNING_KEY | quote }}
  WEBHOOK_HMAC_SEED: {{ .Values.secrets.WEBHOOK_HMAC_SEED | quote }}
  CUSTOMER_TOKEN_SECRET: {{ .Values.secrets.CUSTOMER_TOKEN_SECRET | quote }}
  UPLOAD_SIGNING_KEY: {{ .Values.secrets.UPLOAD_SIGNING_KEY | quote }}
  AUDIT_CHAIN_SECRET: {{ .Values.secrets.AUDIT_CHAIN_SECRET | quote }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  DATABASE_APP_URL: {{ .Values.secrets.DATABASE_APP_URL | quote }}
  REDIS_URL: {{ .Values.secrets.REDIS_URL | quote }}
  STORAGE_S3_ACCESS_KEY_ID: {{ .Values.secrets.STORAGE_S3_ACCESS_KEY_ID | quote }}
  STORAGE_S3_SECRET_ACCESS_KEY: {{ .Values.secrets.STORAGE_S3_SECRET_ACCESS_KEY | quote }}
{{- end }}
