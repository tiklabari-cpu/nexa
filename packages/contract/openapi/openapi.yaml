components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.1 access token or customer token.
    basicPat:
      type: http
      scheme: basic
      description: "Personal Access Token — `base64(account_id:pat)`."

  schemas:
    NotificationPreferences:
      type: object
      description: |
        Every channel the product can reach one person through, for one
        workspace (FR-MOD-13.8, FR-MOD-08.2).

        `enabled` is a master switch over the *interruptive* channels — `sound`,
        `desktop`, `push` — and deliberately not over `email`. Those three
        announce something now; e-mail is the fallback for somebody who is not
        at a screen at all, and "stop interrupting me" was never a request to
        stop the fallback as well.

        All five default to on. The failure this product cannot afford is an
        agent who never learns a visitor is waiting, so a new member is
        reachable and opts out rather than in.
      required: [enabled, sound, desktop, push, email]
      properties:
        enabled: { type: boolean }
        sound: { type: boolean }
        desktop: { type: boolean }
        push: { type: boolean }
        email: { type: boolean }
    Health:
      type: object
      required: [status, service, version, region, uptime_s, dependencies, scheduler, providers]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
          examples: [api]
        version:
          type: string
        region:
          type: string
          enum: [eu]
        uptime_s:
          type: number
        dependencies:
          type: object
          required: [database, redis]
          properties:
            database: { $ref: "#/components/schemas/DependencyHealth" }
            redis: { $ref: "#/components/schemas/DependencyHealth" }
        scheduler: { $ref: "#/components/schemas/SchedulerHealth" }
        providers: { $ref: "#/components/schemas/HealthProviders" }

    DependencyHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        latency_ms:
          type: number
        error:
          type: string

    SchedulerHealth:
      type: object
      description: |
        The in-process background scheduler (M-SCHED · §D113/K1) — idle-chat
        auto-close, SLA breach marking, the SIEM export, scheduled reports and
        retention. `enabled` false means this process runs none of them (every
        job below is still listed, each `disabled`); a deployment that would
        rather drive the sweeps from a host cron leaves it off and uses each
        job's own `pnpm --filter @nexa/api <job>:run` script instead.
      required: [enabled, jobs]
      properties:
        enabled:
          type: boolean
        jobs:
          type: array
          items: { $ref: "#/components/schemas/SchedulerJob" }

    SchedulerJob:
      type: object
      required: [name, interval_ms, enabled, last_run_at, last_status]
      properties:
        name:
          type: string
          examples: [chat_timeout, sla, siem, scheduled_reports, retention]
        interval_ms:
          type: integer
        enabled:
          type: boolean
          description: |
            False for a job registered but switched off from the moment it was
            registered — today only `retention`, gated by `RETENTION_ENABLED`
            because unlike the other four it hard-deletes data.
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: When the job last ticked, whatever came of it. Null before its first pass.
        last_status:
          type: string
          nullable: true
          enum: [ok, skipped, error, disabled]
        last_error_class:
          type: string
          description: The error's class, never its message — driver messages can carry connection strings.

    HealthProviders:
      type: object
      description: |
        Which implementation each mockable dependency (M-ENV-b · §D113/K3)
        currently runs, read straight off the validated environment — so an
        operator can tell "mail is really SMTP" from "mail writes to disk"
        without reading `.env` on the box. Every dependency here is mocked or
        file-backed by default (MASTER-PROMPT "dış servisler mock'lanır");
        none of these becoming a real provider changes this endpoint's shape.
      required: [mail, push, storage, payment, siem, llm, virus_scanner]
      properties:
        mail:
          type: string
          examples: [file]
        push:
          type: string
          examples: [file]
        storage:
          type: string
          examples: [local]
        payment:
          type: string
          examples: [mock]
        siem:
          type: string
          examples: [file]
        llm:
          type: string
          examples: [mock]
        virus_scanner:
          type: string
          examples: [mock]

    TokenGrant:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope, account_id, license_id]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          description: Seconds. Capped at 3600 — the source platform used 28800.
        refresh_token:
          type: string
          description: Rotates on every use; the previous value stops working.
        scope: { type: string, description: Comma-separated. }
        account_id: { type: string, format: uuid }
        license_id: { type: string }
        organization_id: { type: string, format: uuid }

    Chat:
      type: object
      required: [id, license_id, customer_id, active, created_at, access, users]
      properties:
        id: { type: string, description: "Short base32 token, e.g. TJ1H8CFKRV." }
        license_id: { type: string }
        customer_id: { type: string, format: uuid }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        access:
          type: object
          properties:
            group_ids:
              type: array
              items: { type: integer, format: int64 }
        users:
          type: array
          items: { $ref: "#/components/schemas/ChatUser" }
        thread: { $ref: "#/components/schemas/Thread" }
        visitor:
          description: |
            The customer's most recent visit for this license, projected onto
            the chat so the Details panel can show where the visitor came from
            without a second call (FR-MOD-02.4). Null when nothing was recorded,
            and omitted entirely on the customer's own view — the IP in
            particular is personal data the widget never receives (NFR-S9).
          allOf:
            - $ref: "#/components/schemas/ChatVisitor"
          nullable: true

    ChatSummary:
      type: object
      required: [id, customer_id, active, created_at]
      properties:
        id: { type: string }
        customer_id: { type: string, format: uuid }
        customer_name: { type: string, nullable: true }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        thread_id: { type: string, nullable: true }
        assignee_id: { type: string, format: uuid, nullable: true }
        queue_position: { type: integer, nullable: true }
        unread_count: { type: integer }
        last_event:
          allOf:
            - $ref: "#/components/schemas/Event"
          nullable: true
        tags:
          type: array
          items: { type: string }

    ChatUser:
      type: object
      required: [user_id, user_type, present]
      properties:
        user_id: { type: string }
        user_type: { type: string, enum: [agent, customer] }
        present: { type: boolean }
        seen_up_to: { type: string, format: date-time, nullable: true }
        name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }

    Thread:
      type: object
      required: [id, chat_id, active, created_at]
      properties:
        id: { type: string }
        chat_id: { type: string }
        active: { type: boolean }
        assignee_id: { type: string, format: uuid, nullable: true }
        queue_position: { type: integer, nullable: true }
        summary: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        tags:
          type: array
          items: { type: string }

    ChatVisitor:
      type: object
      required: [visited_pages, visit_info]
      description: |
        A visit projected onto the chat surface (FR-MOD-02.4.1-.6): the pages the
        visitor saw and a short summary of the session.
      properties:
        visited_pages:
          type: array
          description: Pages seen during the visit, in order.
          items:
            type: object
            required: [url]
            properties:
              url: { type: string }
              at: { type: string, format: date-time }
        visit_info:
          type: object
          required: [device, referrer, duration_seconds, ip]
          properties:
            device:
              type: string
              nullable: true
              description: Browser and operating system, e.g. "Chrome on macOS".
            referrer:
              type: string
              nullable: true
              description: Referring URL, when the browser sent one.
            duration_seconds:
              type: integer
              nullable: true
              description: Elapsed time of the visit in seconds; null if unknown.
            ip:
              type: string
              nullable: true
              description: Visitor IP (NFR-S9 personal data; agents only).

    ChatSupervision:
      type: object
      required: [chat_id, agent_id, started_at, last_seen_at]
      description: |
        One agent watching one conversation they do not own (FR-MOD-13.2).
        `started_at` is when they began and survives every heartbeat;
        `last_seen_at` is the heartbeat itself, and once it falls outside the
        liveness window the row is treated as a closed tab rather than a watcher.
      properties:
        chat_id: { type: string }
        agent_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    Event:
      type: object
      required: [id, chat_id, thread_id, type, author_type, recipients, created_at]
      properties:
        id:
          type: string
          description: "`<thread_id>_<sequence>` — ordering is decidable from the id alone."
        chat_id: { type: string }
        thread_id: { type: string }
        type:
          type: string
          enum: [message, system_message, rich_message, file, filled_form]
        text: { type: string, nullable: true }
        author_id: { type: string, nullable: true }
        author_type: { type: string, enum: [agent, customer, bot, system] }
        recipients:
          type: string
          enum: [all, agents]
          description: "`agents` is an internal note and never reaches the customer."
        attachment_url: { type: string, nullable: true }
        properties:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    NewEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [message, system_message, rich_message, file, filled_form]
          default: message
        text: { type: string, maxLength: 10000 }
        recipients:
          type: string
          enum: [all, agents]
          default: all
        attachment_url: { type: string, format: uri }
        properties:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
          maxLength: 128
          description: Retrying with the same key returns the original event.

    PersonalAccessToken:
      type: object
      required: [id, name, scopes, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        kind: { type: string, enum: [pat, oauth, bot] }
        scopes:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }

    AiAgent:
      type: object
      required: [id, name, kind, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [ai_agent, copilot] }
        tone: { type: string, nullable: true }
        avatar_url:
          { type: string, nullable: true, description: The face shown next to the persona. }
        languages:
          type: array
          description: Locale codes the persona answers in (FR-MOD-06.4).
          items: { type: string }
        answer_length:
          type: string
          nullable: true
          enum: [short, medium, long, null]
          description: How long an answer the persona aims for.
        active: { type: boolean }
        skills_count: { type: integer }

    SkillStep:
      type: object
      required: [type]
      description: |
        A discriminated union on `type`. Steps are validated before they are
        stored, so a step the engine cannot run is refused at save time rather
        than skipped silently when a customer is waiting.
      properties:
        type:
          type: string
          enum: [detect_intent, request_info, tag, summarize, send_message, transfer_to_team]
        intent: { type: string, description: "detect_intent: the intent name." }
        phrases:
          type: array
          items: { type: string }
          description: "detect_intent: phrases to look for."
        field: { type: string, description: "request_info: what to collect." }
        prompt: { type: string, description: "request_info: what to ask." }
        tag: { type: string, description: "tag: the tag to apply." }
        source:
          type: string
          enum: [text, knowledge]
          description: "send_message: a fixed reply, or one retrieved from knowledge."
        text: { type: string, description: "send_message with source=text." }
        group: { type: string, description: "transfer_to_team: the team name." }

    Skill:
      type: object
      required: [id, name, kind, steps, active, runs_count]
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        kind: { type: string, enum: [ai_agent, workspace] }
        instruction: { type: string, nullable: true }
        steps:
          type: array
          items: { $ref: "#/components/schemas/SkillStep" }
        active: { type: boolean }
        runs_count: { type: integer }
        updated_at: { type: string, format: date-time }

    SkillPreview:
      type: object
      required: [outcome, log, errors]
      properties:
        outcome:
          type: string
          enum: [answered, handed_off, skipped]
          description: |
            `skipped` means the intent did not match, or nothing produced a
            reply — in which case a human takes the conversation.
        reply: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        transfer_to: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        log:
          type: array
          items: { $ref: "#/components/schemas/SkillLogEntry" }
        errors:
          type: array
          description: Reasons the step list could not be run at all.
          items: { type: string }

    SkillLogEntry:
      type: object
      required: [step, detail, ok]
      properties:
        step: { type: string }
        detail: { type: string }
        ok: { type: boolean }

    SkillRun:
      type: object
      required: [id, status, ran_at, log]
      properties:
        id: { type: string, format: uuid }
        chat_id: { type: string, nullable: true }
        status:
          type: string
          enum: [succeeded, failed, aborted]
          description: Whether the run completed — not what it did to the chat.
        outcome:
          type: string
          nullable: true
          enum: [answered, handed_off, skipped, null]
        ran_at: { type: string, format: date-time }
        log:
          type: array
          items: { $ref: "#/components/schemas/SkillLogEntry" }

    KnowledgeSource:
      type: object
      required: [id, name, type, status, chunk_count]
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [website, file, article, faq] }
        status: { type: string }
        source_url:
          { type: string, nullable: true, description: The crawled URL, for website sources. }
        chunk_count: { type: integer }
        updated_at: { type: string, format: date-time }

    KnowledgeBulkRowResult:
      type: object
      description: |
        One CSV data row's verdict. `line` is the row's 1-based position among
        data rows, not a physical line in the file — a quoted cell may span
        several lines, which makes a file line number ambiguous.
      required: [line, name, type, status, id, chunk_count, error]
      properties:
        line: { type: integer, minimum: 1 }
        name:
          type: string
          nullable: true
          description: |
            The row's title. For a skipped row this echoes the raw cell
            (truncated) so the admin can find the row in their spreadsheet;
            null when the row has no name cell to echo.
        type:
          type: string
          nullable: true
          description: The row's `type` cell — the validated value when it parsed, the raw cell otherwise.
        status:
          type: string
          enum: [imported, skipped]
          description: |
            In a dry run `imported` means "would be imported" — nothing was
            written. `dry_run` on the envelope is what distinguishes the two.
        id:
          type: string
          format: uuid
          nullable: true
          description: The created source. Null for a skipped row and for every row of a dry run.
        chunk_count:
          type: integer
          nullable: true
          description: Chunks indexed from this row. Null for a skipped row and for every row of a dry run.
        error:
          type: string
          nullable: true
          description: |
            Why the row was skipped, naming the field at fault. Null for an
            imported row.

            A `website` row is the one exception to "naming the reason": every
            refused URL — malformed, loopback, link-local, credentialled, or
            simply past the import's shared crawl budget — comes back under
            `source_url` with one of three fixed sentences, none of which names
            a host, an address or a network. Told apart across 200 rows, a
            precise reason would be a free scan of everything the server can
            reach; the precise reason is in the server log instead.

    KnowledgeBulkResult:
      type: object
      required: [imported, failed, dry_run, results]
      properties:
        imported:
          { type: integer, description: Rows written (or, in a dry run, rows that would be). }
        failed: { type: integer }
        dry_run: { type: boolean, description: True when nothing was written. }
        results:
          type: array
          description: One entry per data row, in file order.
          items: { $ref: "#/components/schemas/KnowledgeBulkRowResult" }

    TrustedDomain:
      type: object
      required: [id, domain, include_subdomains, created_at]
      properties:
        id: { type: string, format: uuid }
        domain:
          type: string
          description: Hostname only — lowercased, no scheme, port or path.
        include_subdomains: { type: boolean }
        created_at: { type: string, format: date-time }

    IpAllowlistEntry:
      type: object
      description: |
        A single source permitted to reach the agent/admin panel
        (FR-MOD-08.9.6). The allow-side counterpart to a security setting's
        `banned_customer_ips` (a deny-list on the customer/widget surface): here
        a license lists the sources it trusts for its own staff. Tenant-scoped
        and closed by row level security.

        Managed through `/settings/ip-allowlist` (list, add, remove). `entry` is
        stored in canonical form, so a bare address round-trips as itself and a
        CIDR range keeps only its network bits.
      required: [id, entry, label, created_at]
      properties:
        id: { type: string, format: uuid }
        entry:
          type: string
          description: >-
            A single IPv4/IPv6 address or a CIDR range, in canonical form. A
            bare address behaves like a /32 (or /128) range.
        label:
          type: string
          nullable: true
          description: Optional human label for the entry, e.g. `Office VPN`.
        created_at: { type: string, format: date-time }

    SsoAttributeMapping:
      type: object
      description: |
        Which assertion attribute carries which account field, e.g.
        `{"email": "urn:oid:0.9.2342.19200300.100.1.3"}`.

        The set of account fields an assertion may fill is fixed — an assertion
        is signed by a party outside this system, so the columns it can reach
        are bounded here rather than inferred from whatever attribute names an
        IdP sends. An unset key is not a default: it means the connection did
        not say, and the resolver decides what to fall back to.
      additionalProperties: false
      properties:
        email: { type: string }
        name: { type: string }

    PublicSsoConnection:
      type: object
      description: |
        The anonymous face of an SSO connection (NFR-S11 · S11-i) — the two
        things a browser needs to start a login it did not choose, and nothing
        else. No certificate, no IdP URL, no entity id: those describe the trust
        anchor and belong to the authenticated admin view (`SsoConnection`).
      required: [id, organization_name, client_id]
      properties:
        id: { type: string, format: uuid }
        organization_name:
          type: string
          nullable: true
          description: The workspace this connection signs in to, so a screen can name it.
        client_id:
          type: string
          nullable: true
          description: |
            The OAuth client to start the login with. `null` when the workspace
            registers none or more than one — the caller must then be told which
            to use rather than have one guessed for it.

    SsoConnection:
      type: object
      description: |
        One SAML 2.0 identity provider a workspace federates sign-in to
        (NFR-S11). Tenant-scoped and closed by row level security.

        Configuration only at this stage: the row records who the IdP is and how
        to reach it. Nothing consumes it to authenticate anyone yet — no
        assertion is accepted and no session is minted from one.

        `idp_certificate_pem` is returned in full on purpose. It is the IdP's
        *public* signing certificate — what an admin compares against their IdP
        console to confirm a rotation landed — so redacting it would hide the one
        field a misconfiguration is diagnosed from while protecting nothing.
      required:
        [
          id,
          name,
          idp_entity_id,
          idp_sso_url,
          idp_certificate_pem,
          previous_certificate_pem,
          previous_certificate_expires_at,
          attribute_mapping,
          allow_idp_initiated,
          enabled,
          enforced,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: Human label for the connection, e.g. `Okta (corp)`.
        idp_entity_id:
          type: string
          description: The IdP's SAML EntityID — what an assertion's `Issuer` must equal.
        idp_sso_url:
          type: string
          format: uri
          description: Absolute `http(s)` URL an AuthnRequest is sent to (HTTP-Redirect binding).
        idp_certificate_pem:
          type: string
          description: The IdP's public signing certificate, PEM-encoded. Not a secret.
        previous_certificate_pem:
          type: string
          nullable: true
          description: >-
            The certificate this connection was rotated away from, still trusted
            until `previous_certificate_expires_at`. Null unless the rotation
            asked to bridge an IdP key roll — replacing a certificate revokes the
            old one at once by default, because the rotation that matters most is
            the one answering a compromise. Reported only while the window is
            open: a lapsed overlap reads as no overlap.
        previous_certificate_expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the overlap stops being trusted. Null when there is none.
        attribute_mapping: { $ref: "#/components/schemas/SsoAttributeMapping" }
        allow_idp_initiated:
          type: boolean
          description: >-
            Whether an assertion the IdP sends unsolicited is accepted. False by
            default — an IdP-initiated flow gives up the `InResponseTo` binding
            that makes replay detectable, so it is a choice, never inherited.
        enabled:
          type: boolean
          description: Whether sign-in through this connection is live.
        enforced:
          type: boolean
          description: >-
            Whether this connection is the *only* way into the workspace:
            password sign-in is refused for the license while this and `enabled`
            are both true. Reported as stored, so a connection that is required
            but switched off is visible as exactly that — and it enforces
            nothing, which is how a workspace whose IdP has broken gets its
            password door back. The workspace's owners keep theirs regardless,
            and every such sign-in is marked in the audit trail.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScimToken:
      type: object
      description: |
        A bearer credential a workspace pastes into its identity provider's
        SCIM provisioning connector (NFR-S11). Stored only as a SHA-256 digest;
        the plaintext exists once, in the response that creates it.
      required: [id, name, created_at, last_used_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          nullable: true
          description: Human label, e.g. `Okta (corp) provisioning`.
        created_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the connector last presented this token. The one operational
            signal that a provisioning integration is still running — and the one
            that says a token nobody remembers is safe to revoke.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Null when the token does not expire.

    ScimTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ScimToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: >-
                The plaintext credential. Returned exactly once and never
                recoverable — only its digest is stored.

    ScimError:
      type: object
      description: |
        RFC 7644 §3.12. **The `/scim/v2` endpoints do not use the ADR-06 error
        envelope** — this is the one deliberate exception in the API, recorded in
        PLAN §D. The callers of those endpoints are closed-source provisioning
        connectors (Okta, Entra, OneLogin) that parse exactly this shape, and
        `scimType` in particular is how a connector tells "this user already
        exists, adopt it" from "your request was malformed, stop retrying".

        The error *taxonomy* is unchanged: the same internal error types produce
        the same HTTP statuses as everywhere else. Only the rendering differs.
      required: [schemas, status, detail]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:Error"]
        status:
          type: string
          description: The HTTP status, as a string — RFC 7644 specifies it that way.
          example: "409"
        scimType:
          type: string
          enum:
            [
              invalidFilter,
              invalidPath,
              invalidSyntax,
              invalidValue,
              mutability,
              noTarget,
              tooMany,
              uniqueness,
            ]
        detail: { type: string }

    ScimUser:
      type: object
      description: |
        A member of this workspace, as SCIM sees them (RFC 7643 §4.1).

        `id` is the account's uuid. The writable surface is deliberately narrow:
        **`active` and `externalId` only**. Everything else a SCIM User names —
        the address, the display name — lives on the global `accounts` row, which
        a person may share with another workspace, so one workspace's directory
        must not be able to rewrite it. Attributes sent on a create are used only
        when the account does not exist yet.

        `meta.lastModified` and `meta.version` are omitted rather than invented:
        the membership records when somebody joined, not when their row last
        changed, and a `lastModified` that quietly answered `created` would make
        a client's incremental sync skip real updates.
      required: [schemas, id, userName, active, meta]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        id:
          type: string
          format: uuid
          description: The account uuid — stable for as long as the membership exists.
        externalId:
          type: string
          description: The identity provider's own id for this member. Absent when unset.
        userName:
          type: string
          description: The member's e-mail address. Not writable over SCIM.
        name:
          type: object
          properties:
            formatted: { type: string }
        displayName: { type: string }
        emails:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              type: { type: string, example: work }
              primary: { type: boolean }
        active:
          type: boolean
          description: >-
            False means the membership is suspended: the person can neither sign
            in to this workspace nor be routed work. Setting it false is what a
            directory's "disable user" does, and `DELETE` does the same thing.
        meta:
          type: object
          required: [resourceType, created, location]
          properties:
            resourceType: { type: string, example: User }
            created: { type: string, format: date-time }
            location: { type: string, format: uri }

    ScimGroup:
      type: object
      description: |
        A team of this workspace (RFC 7643 §4.2), read-only.

        A directory may see which teams exist and who is in them, but team
        membership drives chat routing here, so letting an external system
        rewrite the routing topology is a much larger claim than "keep the user
        list in step". Group-to-role mapping is out of scope for the same reason.
      required: [schemas, id, displayName, members, meta]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:schemas:core:2.0:Group"]
        id:
          type: string
          description: The team's per-license integer id, as text (PRD §8.4).
        displayName: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              value: { type: string, format: uuid }
              display: { type: string }
              $ref: { type: string, format: uri }
        meta:
          type: object
          required: [resourceType, created, location]
          properties:
            resourceType: { type: string, example: Group }
            created: { type: string, format: date-time }
            location: { type: string, format: uri }

    ScimListResponse:
      type: object
      description: RFC 7644 §3.4.2 — the envelope every SCIM query answers in.
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults:
          type: integer
          description: Matches across every page, not just this one.
        startIndex: { type: integer, description: 1-based, as SCIM counts. }
        itemsPerPage: { type: integer }
        Resources:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/ScimUser"
              - $ref: "#/components/schemas/ScimGroup"

    Brand:
      type: object
      description: |
        One brand of a license (Multibrand, PRD §5.3). A license may run several
        brands under a single subscription; each has its own channels, websites
        and widget/security/inbox settings, selected via the `X-Nexa-Brand`
        header on those resources. Every license has exactly one default brand —
        the `Default` it is created with — which cannot be deleted.
      required: [id, name, slug, logo_url, is_default, created_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: Display name, as shown in the brand switcher.
        slug:
          type: string
          description: URL-safe identifier, unique within the license.
        logo_url:
          type: string
          nullable: true
          description: Brand logo reference, or null when none is set.
        is_default:
          type: boolean
          description: |
            The license's default brand — the one a request with no
            `X-Nexa-Brand` header resolves to. Exactly one per license; it
            cannot be deleted.
        created_at: { type: string, format: date-time }

    Website:
      type: object
      description: |
        A site a workspace has connected the widget to (FR-MOD-08.5.2). Distinct
        from a trusted domain (FR-MOD-08.9.1): a website is the customer-facing
        install record — where the snippet was pasted — while a trusted domain is
        the security allowlist that decides whether the widget may mint a token
        there. Adding a website does not authorise its origin; the domain must
        also be a trusted domain for the widget to work.
      required: [id, domain, setup, status, connected_at, created_at, snippet]
      properties:
        id: { type: string, format: uuid }
        brand_id:
          type: string
          format: uuid
          description: The brand this site belongs to (Multibrand, PRD §5.3).
        domain:
          type: string
          description: Hostname only — lowercased, no scheme, port or path.
        setup:
          type: string
          enum: [manual, platform]
          description: |
            `platform` for a hosted integration (Shopify/WordPress/GTM),
            `manual` for a pasted snippet. Per PRD §8.4; the specific platform
            icon the UI shows is a presentation mapping, not stored here.
        status:
          type: string
          enum: [pending, connected, error]
          description: |
            `connected` once the widget has completed its first handshake from
            this domain; `pending` until then. `error` is reserved for a failed
            verification signal (FR-MOD-08.5.2), written by the widgets screen.
        connected_at:
          type: string
          format: date-time
          nullable: true
          description: When the first handshake was seen, or null while pending.
        created_at: { type: string, format: date-time }
        snippet:
          type: string
          description: |
            The code to paste before `</body>`. Sets `window.__nexa` and loads
            the async widget loader. Identical across a workspace's sites — the
            embedding origin is resolved at runtime — so "get code" per row shows
            this same value.

    ChannelType:
      type: string
      description: |
        A connected omnichannel adapter (FR-MOD-08.5.4-.8). SMS is `twilio`, its
        provider. `instagram` is DM-only (FR-MOD-08.5.7). `telegram` is a bot
        (FR-MOD-08.5.8). The Website widget and e-mail forwarding are not
        adapters and are not listed here.
      enum: [messenger, twilio, whatsapp, instagram, telegram]

    ConnectedChannel:
      type: object
      description: A channel the workspace has connected through an adapter.
      required: [type, status, connected, created_at]
      properties:
        type: { $ref: "#/components/schemas/ChannelType" }
        brand_id:
          type: string
          format: uuid
          description: The brand this channel belongs to (Multibrand, PRD §5.3).
        status:
          type: string
          description: "`connected` while on, `off` once disconnected."
          enum: [connected, off, soon]
        address:
          type: string
          nullable: true
          description: The workspace's channel address (page id / phone number) while on.
        connected:
          type: boolean
          description: Whether inbound and outbound currently flow for this channel.
        created_at: { type: string, format: date-time }

    ChannelSendResult:
      type: object
      description: The record of a mock outbound send (FR-MOD-08.5.4-.6).
      required: [provider_message_id, external_id]
      properties:
        provider_message_id:
          type: string
          description: The (mocked) provider id for the sent message.
        external_id:
          type: string
          description: The recipient channel identity the message was addressed to.
        chat_id:
          type: string
          nullable: true
          description: The chat the reply belonged to, when addressed by chat.

    WebhookAction:
      type: string
      description: |
        The workspace event that triggers a delivery. A closed vocabulary so a
        typo is rejected at registration rather than silently never firing.
      enum:
        - chat_started
        - chat_deactivated
        - chat_transferred
        - event_created
        - ticket_created

    Webhook:
      type: object
      description: |
        A registered outbound webhook (FR-MOD-08.8.4). The signing secret is
        deliberately absent — it is returned only once, by the register call
        (see `WebhookRegistration`).
      required: [id, url, action, type, enabled, created_at]
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          format: uri
          description: The public http(s) endpoint deliveries are POSTed to.
        action: { $ref: "#/components/schemas/WebhookAction" }
        type:
          type: string
          enum: [license, bot]
          description: Workspace-wide (`license`) or scoped to one bot client (`bot`).
        enabled:
          type: boolean
          description: Whether deliveries currently fire for this webhook.
        created_at: { type: string, format: date-time }

    WebhookRegistration:
      description: |
        The register response. Carries the signing `secret` in addition to the
        webhook fields — the **only** time it is ever returned.
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: |
                The HMAC signing key. Store it now; it is never shown again.
                Deliveries are signed
                `HMAC-SHA256(secret, "{timestamp}.{nonce}.{body}")`.

    IntegrationTrigger:
      type: object
      description: |
        One workspace event a webhook (and so a Zapier/Make trigger) can
        subscribe to (FR-MOD-09.4) — the `action` is a `WebhookAction` value,
        the same one `POST /webhooks` accepts.
      required: [action, label, description, sample_payload]
      properties:
        action: { $ref: "#/components/schemas/WebhookAction" }
        label: { type: string }
        description: { type: string }
        sample_payload:
          type: object
          additionalProperties: true
          description: An example delivery body, shaped `{action, data}`.

    IntegrationAction:
      type: object
      description: |
        One existing write endpoint an automation platform's "action" step may
        call (FR-MOD-09.4). No new endpoint or scope — `required_scopes`
        mirrors that route's own `config.scopes`.
      required: [id, method, path, label, required_scopes]
      properties:
        id: { type: string }
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        path:
          type: string
          description: Contract-style path, e.g. `/chats/{chatId}/events`.
        label: { type: string }
        required_scopes:
          type: array
          items: { type: string }
          description: At least one of these scopes must be granted.

    IntegrationManifest:
      type: object
      description: |
        What `GET /integrations/manifest` returns (FR-MOD-09.4): the trigger +
        action catalogue a Zapier/Make app definition is built from, plus where
        to subscribe/unsubscribe. Identical for every caller — no tenant data.
      required: [triggers, actions, subscribe, unsubscribe]
      properties:
        triggers:
          type: array
          items: { $ref: "#/components/schemas/IntegrationTrigger" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/IntegrationAction" }
        subscribe:
          type: object
          required: [method, path]
          properties:
            method: { type: string, enum: [POST] }
            path: { type: string }
          description: Where a trigger subscription is registered — `POST /webhooks`.
        unsubscribe:
          type: object
          required: [method, path]
          properties:
            method: { type: string, enum: [DELETE] }
            path: { type: string }
          description: Where a trigger subscription is removed — `DELETE /webhooks/{webhookId}`.

    PartnerAppClientType:
      type: string
      description: |
        `confidential` — a server-side app that can keep a secret, and so
        authenticates with `client_secret` at the token endpoint.
        `public` — a browser or mobile app, where no secret stays secret; it
        authenticates with PKCE alone, which OAuth 2.1 requires of every client
        regardless.
      enum: [public, confidential]

    PartnerApp:
      type: object
      description: |
        A registered OAuth 2.1 client owned by the caller's organization
        (FR-MOD-09.4). The client secret is deliberately absent — it is returned
        only once, by the register call (see `PartnerAppRegistration`).
      required: [client_id, display_name, client_type, redirect_uris, scopes, created_at]
      properties:
        client_id:
          type: string
          description: |
            Identifies the app to `POST /auth/authorize` and `POST /auth/token`.
            Randomly generated, so it carries no organization identifier.
        display_name: { type: string }
        client_type: { $ref: "#/components/schemas/PartnerAppClientType" }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
          description: |
            The allowlist the authorization endpoint matches against, by exact
            string. Stored verbatim — never normalised.
        scopes:
          type: array
          items: { type: string }
          description: |
            The ceiling on what a token issued to this app may carry. Never
            empty: an empty list means "no ceiling" to the authorization
            endpoint, so registration requires at least one scope.
        created_at: { type: string, format: date-time }

    PartnerAppRegistrationRequest:
      type: object
      required: [display_name, redirect_uris, scopes]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        client_type:
          allOf: [{ $ref: "#/components/schemas/PartnerAppClientType" }]
          default: public
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: uri, maxLength: 2048 }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: Must be a subset of what the registering session holds.

    PartnerAppPatch:
      type: object
      minProperties: 1
      description: |
        At least one field. `client_type` is absent by design — it is immutable
        after registration.
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: uri, maxLength: 2048 }
        scopes:
          type: array
          minItems: 1
          items: { type: string }

    PartnerAppRegistration:
      description: |
        The register response. For a confidential client it carries the
        `client_secret` in addition to the app fields — the **only** time it is
        ever returned.
      allOf:
        - $ref: "#/components/schemas/PartnerApp"
        - type: object
          properties:
            client_secret:
              type: string
              description: |
                Present only for `client_type: confidential`. Store it now; only
                a one-way hash is kept, so it is never shown again — a lost
                secret must be rotated.

    PartnerAppSecretRotation:
      description: |
        The rotate response. Always carries a `client_secret` — rotation applies
        only to a confidential client — and, like registration, carries it
        exactly once. The previous secret is already invalid by the time this
        response is written.
      allOf:
        - $ref: "#/components/schemas/PartnerApp"
        - type: object
          required: [client_secret]
          properties:
            client_secret: { type: string }

    McpToolDescriptor:
      type: object
      description: |
        One MCP tool as advertised by the manifest (FR-MOD-08.8.3) — enough for a
        client to render it and build a valid call. `input_schema` is JSON Schema
        for the tool's argument object; `required_scopes` lists the scopes any one
        of which authorises a call — the same check the tool-call surface enforces
        at call time (08.8.3-c) — so a client can predict which tools its token may
        use before trying them.
      required: [name, title, description, input_schema, required_scopes]
      properties:
        name:
          type: string
          description: Stable tool identifier, used as the `{tool}` path segment on a call.
        title:
          type: string
          description: Human-readable label.
        description:
          type: string
          description: What the tool does, for the client to show or reason over.
        input_schema:
          type: object
          additionalProperties: true
          description: JSON Schema describing the tool's argument object.
        required_scopes:
          type: array
          items: { type: string }
          description: A caller holding at least one of these may invoke the tool.

    McpManifest:
      type: object
      description: |
        What an MCP client discovers at `GET /mcp/manifest` (FR-MOD-08.8.3): the
        base URL to call, the protocol revision this server targets, and the static
        catalogue of tools. Identical for every caller — it carries no license or
        organization identifier (NFR-S4/NFR-S5).
      required: [protocol_version, server, tools]
      properties:
        protocol_version:
          type: string
          description: The MCP protocol revision this server targets.
        server:
          type: object
          required: [name, url, version]
          properties:
            name: { type: string }
            url:
              type: string
              format: uri
              description: Base URL an MCP client points at; tool calls are POSTed beneath it.
            version: { type: string }
        tools:
          type: array
          items: { $ref: "#/components/schemas/McpToolDescriptor" }

    McpToolCallRequest:
      type: object
      description: |
        The body of a `POST /mcp/tools/{tool}` call (FR-MOD-08.8.3). `arguments`
        is the tool's argument object, validated against the tool's `input_schema`
        from the manifest. A tool whose arguments are all optional may be called
        with no body at all; `arguments` then defaults to an empty object.
      properties:
        arguments:
          type: object
          additionalProperties: true
          description: The tool's arguments, matching its `input_schema`.

    McpToolCallResult:
      type: object
      description: |
        The result of an MCP tool call. `result` is the tool's output — its shape
        depends on the tool (a ticket page for `search_tickets`, a report for
        `get_report`, …). Carries no license or organization identifier
        (NFR-S4/NFR-S5).
      required: [tool, result]
      properties:
        tool:
          type: string
          description: The tool that ran, echoed back for correlation.
        result:
          type: object
          additionalProperties: true
          description: The tool's output.

    UploadGrant:
      type: object
      description: |
        Permission to store one file, issued by `POST /uploads` once the
        licence's file-sharing rules have accepted the declared type and size.
      required: [upload_url, file_url, expires_at]
      properties:
        upload_url:
          type: string
          description: |
            Signed, single-use, and bound to the declared type and length. Send
            the bytes here with `PUT` before `expires_at`.
        file_url:
          type: string
          description: |
            Where the file will be readable, and the value that belongs on an
            event's `attachment_url`. Does not expire — it is authorised by
            session, and by the licence embedded in the key.
        expires_at:
          type: string
          format: date-time
          description: When `upload_url` stops being accepted.

    SecuritySettings:
      type: object
      description: |
        Per-license security configuration (PRD §8.4 `security_settings`).

        `file_sharing_enabled`, `allowed_file_types` and `max_file_size_bytes`
        are the rules FR-MOD-08.9.4 enforces on every upload — both the agent
        composer's attachments and anything a customer sends.

        `ip_allowlist_enforced`, `session_idle_timeout_seconds` and
        `max_concurrent_sessions` are the session policy fields
        (FR-MOD-08.9.6). `PATCH` validates and stores them, but nothing
        enforces them yet — idle-timeout and concurrent-session enforcement is
        FR-MOD-08.9.6-g. A workspace that has never saved them reads the same
        defaults — `false`, and null for both limits, meaning the existing
        `MAX_ACTIVE_TOKENS_PER_OWNER` constant (25) still governs concurrent
        sessions.
      required:
        [
          banned_customer_ips,
          file_sharing_enabled,
          allowed_file_types,
          max_file_size_bytes,
          spam_filter_enabled,
          require_two_factor,
          ip_allowlist_enforced,
          session_idle_timeout_seconds,
          max_concurrent_sessions,
        ]
      properties:
        brand_id:
          type: string
          format: uuid
          description: The brand these settings belong to (Multibrand, PRD §5.3).
        banned_customer_ips:
          type: array
          description: >-
            Visitor IPs refused a widget token and blocked from starting a chat
            (FR-MOD-08.9.2). Stored in canonical form; an IPv4-mapped IPv6
            address matches its bare IPv4 form.
          items: { type: string }
        file_sharing_enabled:
          type: boolean
          description: When false, no attachment is accepted from either side.
        allowed_file_types:
          type: array
          description: Allowed MIME types. An empty list blocks every upload.
          items: { type: string }
        max_file_size_bytes:
          type: integer
          format: int32
          minimum: 1
          maximum: 104857600
          description: Per-file ceiling. 100 MiB is the hard maximum.
        spam_filter_enabled: { type: boolean }
        require_two_factor: { type: boolean }
        ip_allowlist_enforced:
          type: boolean
          description: >-
            Whether `ip_allowlist_entries` (the allowlist model, FR-MOD-08.9.6)
            is enforced. Defaults to false; nothing enforces this yet.
        session_idle_timeout_seconds:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 2592000
          description: >-
            Seconds of inactivity before a session is force-expired, or null
            when the policy is off (the default — nothing enforces this yet).
        max_concurrent_sessions:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 25
          description: >-
            Per-owner cap on simultaneous active sessions, or null to fall
            back to the fixed `MAX_ACTIVE_TOKENS_PER_OWNER` limit (25).
        updated_at: { type: string, format: date-time, nullable: true }

    ComplianceSettings:
      type: object
      description: |
        What NFR-C4 makes HIPAA cover conditional on: US hosting and a signed
        Business Associate Agreement. Both halves are reported together because
        neither is meaningful alone — a signed BAA in `eu` would be a claim
        about data that does not live there, which is why it cannot be created.
      required: [region, baa_available, hipaa_baa_signed_at]
      properties:
        region:
          type: string
          enum: [eu, us]
          description: >-
            Where this workspace keeps its data — chosen at signup and never
            changeable (ADR-12 · C4-a).
        baa_available:
          type: boolean
          description: >-
            Whether a BAA may be accepted here at all. True only in `us`.
        hipaa_baa_signed_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the owner accepted the BAA, or null if never. Set once, on
            the first acceptance, and not moved by a later one.

    ChatTimeoutSettings:
      type: object
      description: |
        Per-license idle-chat auto-close window (FR-MOD-08.7.3, `inbox_settings`).

        `chat_timeout_seconds` is null when auto-close is off — which is also
        what a workspace that has never saved it reads, since no row exists yet.
        A stored value is always a positive integer.
      required: [chat_timeout_seconds, updated_at]
      properties:
        brand_id:
          type: string
          format: uuid
          description: The brand these settings belong to (Multibrand, PRD §5.3).
        chat_timeout_seconds:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: Seconds of inactivity before auto-close, or null when disabled.
        updated_at: { type: string, format: date-time, nullable: true }

    WidgetSettings:
      type: object
      description: |
        Per-license widget appearance (FR-MOD-11.7, `widget_settings`). A
        workspace that has never customised it reads the shipped defaults; the
        values are baked into the install snippet and applied by the widget.
      required: [primary_color, position, theme, mobile_fullscreen, powered_by, updated_at]
      properties:
        brand_id:
          type: string
          format: uuid
          description: The brand this appearance belongs to (Multibrand, PRD §5.3).
        primary_color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Brand colour of the launcher, header and send button, a hex.
        position:
          type: string
          enum: [bottom-right, bottom-left]
          description: Corner the launcher sits in.
        theme:
          type: string
          enum: [auto, light, dark]
          description: auto follows the visitor's device; light/dark force it.
        mobile_fullscreen:
          type: boolean
          description: Open the panel edge-to-edge on phones rather than as a card.
        powered_by:
          type: boolean
          description: The removable "Powered by Nexa" footer (FR-MOD-11.5).
        updated_at: { type: string, format: date-time, nullable: true }

    SalesTrackerSettings:
      type: object
      description: |
        Per-license sales tracker configuration (FR-MOD-13.5,
        `sales_tracker_settings`). A workspace that has never configured it
        reads the shipped defaults — tracking off, USD, a 7-day attribution
        window — since no row exists until the first save.

        License-scoped, not brand-scoped: FR-MOD-13.5 gives no indication
        tracking should differ per brand, so there is one configuration per
        workspace.
      required: [enabled, currency, attribution_window_days, updated_at]
      properties:
        enabled:
          type: boolean
          description: Whether orders reported by the widget snippet are tracked at all.
        currency:
          $ref: "#/components/schemas/SalesTrackerCurrency"
        attribution_window_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 90
          description: >-
            Days after a chat during which a sale still counts as attributed to
            it. A zero or negative window could never attribute anything.
        updated_at: { type: string, format: date-time, nullable: true }

    SalesTrackerCurrency:
      type: string
      description: >-
        ISO 4217 alpha-3 code the tracked revenue is recorded in. A whitelist
        rather than any three letters: the code is stored on every order and
        summed in the Ecommerce report, so a typo would produce a report
        denominated in a currency that does not exist.
      enum:
        [
          AED,
          AUD,
          BRL,
          CAD,
          CHF,
          CNY,
          DKK,
          EUR,
          GBP,
          INR,
          JPY,
          MXN,
          NOK,
          NZD,
          PLN,
          SAR,
          SEK,
          SGD,
          TRY,
          USD,
          ZAR,
        ]

    UpdateSalesTrackerSettings:
      type: object
      description: |
        A partial change to the sales tracker configuration. Every field is
        optional so the settings screen can save one control at a time, but a
        body with none is rejected — empty is a mistake, not "reset to
        defaults" — and so is any field not listed here, so a mistyped name
        cannot be dropped silently while the screen reports a successful save.
      minProperties: 1
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        currency:
          $ref: "#/components/schemas/SalesTrackerCurrency"
        attribution_window_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 90

    OnboardingState:
      type: object
      description: |
        First-run setup state (FR-MOD-00.4). `completed` is a per-license fact —
        the workspace is set up — set once the owner finishes or skips the wizard.
      required: [completed, completed_at, demo_seeded, demo_seeded_at]
      properties:
        completed: { type: boolean }
        completed_at: { type: string, format: date-time, nullable: true }
        demo_seeded:
          type: boolean
          description: Whether the sample data has been laid down.
        demo_seeded_at: { type: string, format: date-time, nullable: true }

    OnboardingSeedResult:
      type: object
      required: [seeded, counts, state]
      properties:
        seeded:
          type: boolean
          description: |
            False when the demo was already present — the call is idempotent, so
            the counts below are all zero in that case.
        counts:
          type: object
          required: [canned_responses, tags, customers, chats]
          properties:
            canned_responses: { type: integer }
            tags: { type: integer }
            customers: { type: integer }
            chats: { type: integer }
        state: { $ref: "#/components/schemas/OnboardingState" }

    CannedResponse:
      type: object
      required: [id, shortcut, text, scope, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        shortcut: { type: string }
        text: { type: string }
        scope: { type: string, enum: [chat, ticket] }
        group_id: { type: integer, format: int64, nullable: true }
        updated_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Tag:
      type: object
      description: |
        A label from the workspace's central tag library (FR-MOD-08.7.1).

        Tagging a conversation draws from this library — the same `tags` row a
        thread points at is the one the library manages here — which is what
        keeps a workspace's vocabulary consistent instead of a scatter of
        one-off typos. Applying a name that is not yet in the library still
        works (it is created on demand), but curating the library is how a team
        agrees on the words before they are used.
      required: [id, name, group_ids, usage_count, created_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: Lowercased and trimmed; unique within the workspace.
        group_ids:
          type: array
          description: |
            Teams this tag is scoped to. Empty means the whole workspace may
            use it.
          items: { type: integer, format: int64 }
        author_id:
          type: string
          nullable: true
          description: The account that first created the tag, if known.
        usage_count:
          type: integer
          description: How many conversations currently carry this tag.
        created_at: { type: string, format: date-time }

    RoutingRule:
      type: object
      required: [id, kind, conditions, priority, is_fallback, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        kind: { type: string, enum: [chat, ticket] }
        conditions:
          type: object
          description: |
            All must match for the rule to win. Empty on the fallback rule,
            which is why it catches everything. `expertise_ids` is not a match
            condition — a rule carrying only it still matches every conversation;
            it narrows the eligible agent pool to those holding *every* listed
            area of expertise (FR-MOD-08.6.3), and is never relaxed.
          additionalProperties: true
          properties:
            expertise_ids:
              type: array
              description: Agent must hold every listed expertise area to be eligible.
              items: { type: integer, format: int64 }
        target_group_id: { type: integer, format: int64, nullable: true }
        target_group_name: { type: string, nullable: true }
        priority: { type: integer }
        is_fallback: { type: boolean }
        enabled: { type: boolean }

    CustomerSummary:
      type: object
      required: [id, name, email, is_lead, banned, chats_count, tickets_count]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          nullable: true
          description: Null for a visitor who never introduced themselves.
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        country_code: { type: string, nullable: true, minLength: 2, maxLength: 2 }
        country: { type: string, nullable: true }
        is_lead:
          type: boolean
          description: Left an email address.
        banned: { type: boolean }
        chats_count:
          type: integer
          description: Counted from conversations, not read from a stored total.
        tickets_count: { type: integer }
        last_activity_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AuditLogEntry:
      type: object
      description: |
        One append-only entry in the workspace's security trail (NFR-S12). The
        `metadata` is deliberately PII-minimal — field names, counts and roles,
        never values or secrets — so the trail can be retained safely.
      required: [id, action, actor_type, created_at]
      properties:
        id: { type: string, format: uuid }
        action:
          type: string
          description: The security-relevant action, e.g. `auth.login`, `member.suspended`.
        actor_id:
          type: string
          nullable: true
          description: The acting account/bot/customer id, or null when unknown.
        actor_type:
          type: string
          enum: [agent, bot, customer, system]
        target:
          type: string
          nullable: true
          description: The object acted on, as `<kind>:<id>` (e.g. `token:…`).
        metadata:
          type: object
          additionalProperties: true
          description: Non-sensitive detail — field names, counts, roles.
        ip:
          type: string
          nullable: true
          description: Source address when recorded; null when deliberately omitted.
        created_at: { type: string, format: date-time }

    AuditLogExportRecord:
      type: object
      description: |
        One line of the SIEM export (NFR-C6). The read surface's entry plus
        `license_id`: a SIEM indexes several workspaces side by side and needs
        the discriminator on the evidence itself, not on whatever the ingest
        pipeline happened to file it under.
      required: [id, license_id, action, actor_type, created_at]
      properties:
        id: { type: string, format: uuid }
        license_id:
          type: string
          description: >-
            The workspace this entry belongs to. A string because the id is a
            64-bit integer and JSON numbers are doubles.
        action:
          type: string
          description: The security-relevant action, e.g. `auth.login`, `member.suspended`.
        actor_id:
          type: string
          nullable: true
          description: The acting account/bot/customer id, or null when unknown.
        actor_type:
          type: string
          enum: [agent, bot, customer, system]
        target:
          type: string
          nullable: true
          description: The object acted on, as `<kind>:<id>` (e.g. `token:…`).
        metadata:
          type: object
          additionalProperties: true
          description: >-
            Non-sensitive detail — field names, counts, roles. Exported exactly
            as stored; it was stripped of anything credential-shaped on the way
            in, and filtering again here would let the exported copy and the
            entry an admin reads on screen disagree about what happened.
        ip:
          type: string
          nullable: true
          description: Source address when recorded; null when deliberately omitted.
        created_at: { type: string, format: date-time }

    SiemExportSettings:
      type: object
      description: |
        Where a workspace ships its audit trail (NFR-C6 · C6-b), and whether it
        is shipping.
      required: [enabled, target]
      properties:
        enabled:
          type: boolean
          description: Whether the scheduled export delivers to the destination.
        target:
          type: string
          nullable: true
          enum: [file, null]
          description: >-
            The destination, or null when the workspace has never configured
            one. `file` writes NDJSON under `.data/siem`.

    SlaPolicy:
      type: object
      description: |
        How long a customer may wait before the case counts as a miss
        (FR-MOD-11.5, PRD §5.4 "Kurumsal").

        Measured and marked, never enforced (§C-A27): a breach writes a row and
        raises a notification, and changes nothing about routing or priority.

        This is *not* NFR-U5's contractual uptime commitment with its billing
        credit — that is a contract term, not something this repo can promise,
        and nothing here touches an invoice.
      required:
        [first_response_minutes, resolution_minutes, business_hours_only, active, updated_at]
      properties:
        first_response_minutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 129600
          description: >-
            Minutes a customer may wait for the first agent reply, or null for
            no target. Null and zero are different answers, so the field is
            nullable rather than 0-as-off.
        resolution_minutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 129600
          description: >-
            Minutes a case may stay open before it counts as a miss, or null
            for no target.
        business_hours_only:
          type: boolean
          description: >-
            Count only the hours the workspace is open, taken from the agents'
            saved work schedules (`PUT /agents/{agentId}/work-schedule`). A
            workspace where nobody has saved one has no calendar to subtract
            from, so its clocks run continuously.
        active:
          type: boolean
          description: >-
            Whether these targets are being measured today. False when the
            licence does not hold the `sla` entitlement — the numbers are still
            stored, because a downgrade must not destroy configuration a
            re-upgrade should restore — and false when both targets are null.
            Lets a screen tell "not bought" apart from "not set".
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: When the targets were last saved, or null if never.

    Sandbox:
      type: object
      description: |
        A workspace's sandbox, as its owner sees it (FR-MOD-11.5 · 11.5-f).

        Deliberately thin. Every field is read from the sandbox's own licence
        row — the one row a production workspace can see across the boundary —
        and nothing is read from its organization, its members or its data.

        There is no name: a workspace is opened by choosing it at sign-in, where
        `POST /auth/login` already lists it with its organization's name.
      required: [license_id, region, created_at, reset_at]
      properties:
        license_id:
          type: string
          description: >-
            The sandbox's licence id — what a client passes as `license_id` to
            `POST /auth/authorize` to sign in to it.
        region:
          type: string
          enum: [eu, us]
          description: >-
            Where the sandbox keeps its data. Inherited from the parent
            workspace and immutable (C4-a), so it always equals the caller's own
            region; reported anyway because "my test data went somewhere else"
            is the fear this answers.
        created_at:
          type: string
          format: date-time
        reset_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the sandbox was last emptied, or null if never. Recorded on the
            licence row rather than in the audit trail, because a reset destroys
            the sandbox's own trail and writing into the parent's would be a
            cross-licence write.

    SandboxView:
      type: object
      description: |
        Where the caller stands in relation to a sandbox (FR-MOD-11.5 · 11.5-f).

        Three states a screen has to tell apart, which is why `entitled` is here
        beside `sandbox` rather than inferred from it: a workspace that has not
        bought the capability, one that has bought it and not used it, and one
        that already has a sandbox.

        Read with a credential for the sandbox itself, `is_sandbox` is the only
        field that is true. It reports nothing about the parent — not its id,
        not its plan, not that it exists.
      required: [is_sandbox, entitled, sandbox]
      properties:
        is_sandbox:
          type: boolean
          description: True when the caller's own licence is a sandbox.
        entitled:
          type: boolean
          description: >-
            Whether this licence's plan includes a sandbox at all. Always false
            inside a sandbox, which holds no subscription and so reads as the
            self-serve tier.
        sandbox:
          allOf:
            - $ref: "#/components/schemas/Sandbox"
          nullable: true
          description: >-
            This licence's sandbox, or null when it has none. Always null when
            `is_sandbox` is true — a sandbox cannot have one.

    SiemExportStatus:
      allOf:
        - $ref: "#/components/schemas/SiemExportSettings"
        - type: object
          description: The export's configuration plus how the feed is doing.
          required:
            [last_run_at, last_exported_at, exported_count, pending_count, chain_gap_detected]
          properties:
            last_run_at:
              type: string
              format: date-time
              nullable: true
              description: >-
                When a delivery last completed, or null if one never has. A
                stale value means the export is not running at all — which is
                a different problem from it running and falling behind.
            last_exported_at:
              type: string
              format: date-time
              nullable: true
              description: >-
                The timestamp of the last entry delivered — the position, not
                the run. Far behind `last_run_at` simply means nothing new has
                happened since.
            exported_count:
              type: integer
              description: >-
                Entries delivered to this destination, ever. Survives retention
                pruning the entries it counted.
            pending_count:
              type: integer
              description: >-
                Exportable entries not yet delivered — the backlog. Counted only
                up to the export horizon, so zero means genuinely caught up
                rather than "nothing has settled yet".
            chain_gap_detected:
              type: boolean
              nullable: true
              description: >-
                Whether anything is missing from the workspace's audit trail.
                Answered from the integrity chain: positions are handed out
                gaplessly, so an absent one is an absent entry. All four cuts
                are checked — a hole in the middle, a trail starting later than
                retention pruned to, entries removed from the newest end, and an
                entry written after the chain began that carries no chain at
                all. `null` while the workspace has never written a chained
                entry, and deliberately not `false` there: a log with no chain
                cannot demonstrate its own completeness, and reporting "no gaps
                detected" from a system that cannot detect gaps is the false
                assurance the control exists to prevent.

    TrafficRespondent:
      type: object
      description: |
        Who a visitor is currently talking to (FR-MOD-03.1.3 "Chatting with").
        `kind` is the human/AI distinction the table draws — a person on the
        other end reads very differently from a persona answering first.
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [human, ai]
          description: A human agent, or the customer-facing AI persona.
        name:
          type: string
          description: The agent's name, or the persona's (e.g. "Hazal").
        avatar_url: { type: string, nullable: true }

    TrafficVisitor:
      type: object
      description: |
        One live visitor row (FR-MOD-03.1.3). Keyed by the customer, since a
        person browsing without a conversation still belongs in the table.
      required: [customer_id, name, email, activity, chat_id, chatting_with]
      properties:
        customer_id: { type: string, format: uuid }
        name:
          type: string
          nullable: true
          description: Null for a visitor who never introduced themselves.
        email: { type: string, nullable: true }
        activity:
          type: string
          enum: [browsing, queued, waiting, chatting, supervised, invited]
          description: Where the visitor is in the funnel — see `listTraffic`.
        chat_id:
          type: string
          nullable: true
          description: The active conversation, when there is one; null while browsing.
        chatting_with:
          description: Who is answering, or null while nobody is.
          allOf:
            - $ref: "#/components/schemas/TrafficRespondent"
          nullable: true
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: Most recent signal from this visitor — the table's sort key.

    CampaignConditions:
      type: object
      description: |
        The trigger predicate (FR-MOD-03.3.2). Every key set must hold for a
        visitor to match. `url_contains` — the one condition v1 ships — targets
        the page they are on; an empty predicate matches nobody, so a campaign
        with no trigger is rejected rather than sent to everyone.
      properties:
        url_contains:
          type: string
          maxLength: 2048
          description: Case-insensitive substring the visitor's current page URL must contain.

    CampaignContent:
      type: object
      description: What the campaign delivers to a matching visitor.
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }

    CampaignPerformance:
      type: object
      description: The campaign card's numbers (FR-MOD-03.3.3), counted from its sends.
      required: [displayed, chats, conversion]
      properties:
        displayed:
          type: integer
          description: Visitors the message was delivered to.
        chats:
          type: integer
          description: Of those, how many opened a conversation.
        conversion:
          type: integer
          description: Of those, how many reached a goal.

    Campaign:
      type: object
      description: A proactive, targeted message (FR-MOD-03.3).
      required:
        [
          id,
          name,
          status,
          conditions,
          content,
          starts_at,
          ends_at,
          recurring,
          created_at,
          performance,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [ongoing, scheduled, inactive]
          description: |
            Lifecycle state the status tabs filter by (FR-MOD-03.3.1), resolved
            from the on/off intent and the schedule at save time: `ongoing`
            (running now), `scheduled` (active, not started yet), or `inactive`
            (off, or past its end).
        conditions: { $ref: "#/components/schemas/CampaignConditions" }
        content: { $ref: "#/components/schemas/CampaignContent" }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        recurring: { type: boolean }
        created_at: { type: string, format: date-time }
        performance: { $ref: "#/components/schemas/CampaignPerformance" }

    GoalDefinition:
      type: object
      description: |
        A goal's trigger predicate (FR-MOD-13.3) — same vocabulary as
        `CampaignConditions`. `url_contains` — the one condition v1 ships —
        targets the page a visitor is on; the shape stays an open object so
        geo/event conditions slot in later without a contract change.
      properties:
        url_contains:
          type: string
          maxLength: 2048
          description: Case-insensitive substring the visitor's current page URL must contain.

    Goal:
      type: object
      description: A tracked conversion target (FR-MOD-13.3).
      required: [id, name, definition, active, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        definition: { $ref: "#/components/schemas/GoalDefinition" }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    GoalFunnel:
      type: object
      description: |
        The visitor→chat→conversion funnel for a goal, or goals in aggregate
        (FR-MOD-13.3). The stages are nested — each is a subset of the one
        before it — so `visitors >= chats >= conversions` always holds.
      required: [visitors, chats, conversions, conversion_rate]
      properties:
        visitors:
          type: integer
          description: |
            Distinct visitors with a visit in the window, workspace wide. Not
            per goal: nothing records which visitors a goal was eligible to
            catch, so a per-goal denominator would be invented, not measured.
        chats:
          type: integer
          description: Of those, how many also opened a conversation in the window.
        conversions:
          type: integer
          description: |
            Of those, how many reached at least one goal in the window. A
            visitor who reached three goals counts once — this stage counts
            people through the funnel, not goal hits (see `by_goal` for those).
        conversion_rate:
          type: number
          nullable: true
          description: "`conversions / chats`; null — never 0 — when there are no chats to divide by."

    GoalsReport:
      type: object
      description: |
        The `/reports/goals` payload (FR-MOD-13.3) — the aggregate funnel, a
        per-goal breakdown, and the prior window for comparison.
      required: [range, funnel, by_goal, previous_period]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        funnel: { $ref: "#/components/schemas/GoalFunnel" }
        by_goal:
          type: array
          description: |
            One row per goal the workspace has defined — active or not, and
            including goals with `conversions: 0`: a goal nobody reached is a
            reportable result, and a retired goal keeps the conversions it
            already earned. Ordered by conversions, most first.

            Deliberately *not* filtered through the funnel: `conversions` here
            counts every achievement in the window, so these sum to the
            Overview's `totals.achieved_goals` rather than to
            `funnel.conversions`. The two differ whenever a visitor converts
            without ever chatting, or reaches more than one goal.
          items:
            type: object
            required: [goal_id, name, conversions]
            properties:
              goal_id: { type: string, format: uuid }
              name: { type: string }
              conversions: { type: integer }
        previous_period:
          description: |
            The same funnel measured over the benchmark window, through the
            same license-scoped queries — so the comparison is this workspace's
            own past, never a pooled or cross-license figure.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - $ref: "#/components/schemas/GoalFunnel"

    TicketRuleConditions:
      type: object
      description: |
        A ticket rule's trigger (FR-MOD-08.6.2). Every key set must hold (AND).
        An empty predicate matches nothing, so a rule with no condition is
        rejected rather than saved to fire at every ticket.
      properties:
        subject_contains:
          type: string
          maxLength: 2048
          description: Case-insensitive substring the ticket subject must contain.
        source:
          type: string
          enum: [chat, email]
          description: Restrict to tickets opened from a chat, or forwarded by email.

    TicketRuleActions:
      type: object
      description: |
        What a matching rule does (FR-MOD-08.6.2): assign, prioritise, tag — or
        any combination. At least one action must be set; a rule that does
        nothing is rejected rather than saved inert.
      properties:
        assign_agent_id:
          type: string
          format: uuid
          description: Assign the ticket to this agent.
        assign_group_id:
          type: integer
          description: Assign the ticket to this team.
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          description: Set the ticket's queue priority (higher is more urgent).
        add_tag:
          type: string
          minLength: 1
          maxLength: 64
          description: Apply this tag (created in the tag library if new).

    TicketRule:
      type: object
      description: Condition + action automation over tickets (FR-MOD-08.6.2).
      required: [id, name, conditions, actions, enabled, position, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        conditions: { $ref: "#/components/schemas/TicketRuleConditions" }
        actions: { $ref: "#/components/schemas/TicketRuleActions" }
        enabled:
          type: boolean
          description: Whether the rule fires. Off keeps it configured without acting.
        position:
          type: integer
          description: Evaluation order; lower runs first, so a later rule's assignment wins.
        created_at: { type: string, format: date-time }

    TicketEmailTemplate:
      type: object
      description: |
        A branded, variabled ticket e-mail template (FR-MOD-08.7.5). The subject
        and body may carry `{{ group.field }}` placeholders from the fixed
        variable catalogue; both are validated on save, so a stored template can
        never name a variable the product cannot fill.
      required: [id, name, subject, body, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subject: { type: string }
        body: { type: string }
        enabled:
          type: boolean
          description: Whether agents may pick the template. Off keeps it authored but hidden.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KbCategory:
      type: object
      description: |
        A public KB category (PRD §5.3) — the reader-facing taxonomy an article
        can be filed under. `slug` is unique within the workspace; `position`
        orders the categories for display.
      required: [id, slug, name, position, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        position: { type: integer }
        created_at: { type: string, format: date-time }

    KbArticle:
      type: object
      description: |
        A public KB article (PRD §5.3). `seo_title`/`seo_description` carry the
        "SEO'lu" half of the requirement; `status` the "public" half — an article
        is a draft until an explicit publish, and only `published` articles are
        ever served by the anonymous read path (PUBKB-c). `body` is stored raw
        here; its safe rendering is a later slice (PUBKB-d).
      required:
        [
          id,
          category_id,
          slug,
          title,
          body,
          excerpt,
          seo_title,
          seo_description,
          status,
          published_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        slug: { type: string }
        title: { type: string }
        body: { type: string }
        excerpt: { type: string, nullable: true }
        seo_title: { type: string, nullable: true }
        seo_description: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, published]
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KbSettings:
      type: object
      description: |
        The per-workspace KB switch and public address (PRD §5.3). `enabled`
        gates whether the public KB is served at all; `public_slug` is the path
        segment on the shared public host, globally unique across workspaces.
        Both are null/false until an administrator configures them — this is the
        control that first exposes published articles to an anonymous audience.
      required: [enabled, public_slug, site_title, updated_at]
      properties:
        enabled: { type: boolean }
        public_slug: { type: string, nullable: true }
        site_title: { type: string, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    PublicKbArticleSummary:
      type: object
      description: |
        A published KB article as an anonymous reader sees it in a list
        (PUBKB-c). Reader-facing fields only — no `license_id`, no `created_by`,
        no `status` (everything here is published) and no `body` (that is on the
        detail response). `published_at`/`updated_at` are the timestamps a
        sitemap and a reader both use.
      required:
        [
          id,
          category_id,
          slug,
          title,
          excerpt,
          seo_title,
          seo_description,
          published_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        seo_title: { type: string, nullable: true }
        seo_description: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }

    PublicKbArticle:
      description: |
        A published KB article in full (PUBKB-c) — the summary plus its raw
        `body`, which PUBKB-d renders safely. Never carries agent/account
        identity or internal columns.
      allOf:
        - $ref: "#/components/schemas/PublicKbArticleSummary"
        - type: object
          required: [body]
          properties:
            body: { type: string }

    PublicKbCategory:
      type: object
      description: |
        A KB category as an anonymous reader sees it (PUBKB-c) — the reader-facing
        taxonomy, without the `license_id`/`created_at` an admin sees.
      required: [id, slug, name, position]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        position: { type: integer }

    CustomFieldDefinition:
      type: object
      description: |
        A custom field a workspace has defined on tickets or contacts
        (FR-MOD-08.7.6) — an extra field the product does not ship with. The
        two properties that carry the requirement are `type` (how a value is
        validated) and `required` (whether it may be blank).
      required: [id, entity, label, type, required, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        entity:
          type: string
          enum: [ticket, contact]
          description: What the field hangs off.
        label: { type: string }
        type:
          type: string
          enum: [text, number, boolean, date]
          description: How a value is validated. Immutable once set.
        required:
          type: boolean
          description: When true, a value may not be left blank.
        form_placement:
          type: string
          enum: [pre_chat, post_chat]
          nullable: true
          description: |
            Where this field is also asked as a widget form (FR-MOD-08.7.7):
            `pre_chat` before the conversation starts, `post_chat` once it ends,
            or null for a CRM-only field. Only a `contact` field may carry one.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WidgetFormField:
      type: object
      description: |
        One row of a widget form (FR-MOD-08.7.7) as the widget needs to render
        it: the label to prompt with, the `type` that picks the input and
        validates the answer, whether it is required, and the definition id the
        answer is written back under. The same shape for both placements.
      required: [definition_id, label, type, required]
      properties:
        definition_id: { type: string, format: uuid }
        label: { type: string }
        type:
          type: string
          enum: [text, number, boolean, date]
        required: { type: boolean }

    CustomFieldValue:
      type: object
      description: |
        A custom field as it appears on one entity (FR-MOD-08.7.6): the
        definition's metadata joined with the stored value, or null when nothing
        is set. One entry per definition, so a defined-but-empty field still
        shows.
      required: [definition_id, label, type, required, value]
      properties:
        definition_id: { type: string, format: uuid }
        label: { type: string }
        type:
          type: string
          enum: [text, number, boolean, date]
        required: { type: boolean }
        value:
          type: string
          nullable: true
          description: The stored value in canonical form, or null when unset.

    CustomFieldValuesInput:
      type: object
      description: |
        A map of custom field definition id → value, where null clears a field.
        Each value is validated against its definition (type + required); a
        wrong type or a blank on a required field is a 400.
      required: [values]
      properties:
        values:
          type: object
          additionalProperties:
            type: string
            nullable: true

    AppInstallation:
      type: object
      description: A connected marketplace app (FR-MOD-09.1), as stored for a workspace.
      required: [app_id, status, external_account, scopes, connected_at]
      properties:
        app_id: { type: string }
        status: { type: string, enum: [connected] }
        external_account:
          type: string
          description: The account label the (mock) OAuth grant returned.
        scopes:
          type: array
          items: { type: string }
          description: Permissions granted — the app's requested scopes.
        connected_at: { type: string, format: date-time }

    AppListItem:
      type: object
      description: |
        A marketplace card (FR-MOD-09.1 / 09.2) joined with whether this
        workspace has connected it. `installation` carries the connected account
        when `installed` is true, and is null otherwise. `channel` is set for a
        channel-typed app managed in Settings → Channels (09.2), which is set up
        there rather than connected here — for those, `installed` is always false.
      required:
        [id, name, category, provider, icon, description, scopes, channel, installed, installation]
      properties:
        id: { type: string }
        name: { type: string }
        category:
          type: string
          enum: [crm, support, ecommerce, payments, marketing, productivity, analytics, channels]
        provider:
          type: string
          enum: [oauth, api_key]
        icon: { type: string }
        description: { type: string }
        scopes:
          type: array
          items: { type: string }
          description: Permissions the app asks for, shown on the consent step.
        channel:
          description: |
            The channel this app is managed as in Settings → Channels, or null
            for a data app connected in the marketplace (09.2).
          oneOf:
            - type: string
              enum:
                [website_widget, email, messenger, twilio, whatsapp, instagram, telegram, chat_page]
            - type: "null"
        installed: { type: boolean }
        installation:
          oneOf:
            - { $ref: "#/components/schemas/AppInstallation" }
            - { type: "null" }

    AppOAuthStart:
      type: object
      description: The result of starting the (mock) OAuth flow (FR-MOD-09.1).
      required: [authorize_url, state]
      properties:
        authorize_url:
          type: string
          description: Where to send the user to grant permission (mocked).
        state:
          type: string
          description: Opaque value echoed back on the callback to bind the two steps.

    AppChatData:
      type: object
      description: |
        A connected app's (mock) data for one conversation's customer
        (FR-MOD-09.1) — what the agent reads in the Details pane.
      required: [app_id, app_name, icon, data_label, fields]
      properties:
        app_id: { type: string }
        app_name: { type: string }
        icon: { type: string }
        data_label: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }

    Session:
      type: object
      description: |
        The account and the workspaces it may sign in to. Deliberately carries
        no tokens: the caller picks a workspace and continues through
        `/auth/authorize`, so one code path issues credentials rather than
        three.
      required: [account, memberships]
      properties:
        account:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            name: { type: string }
        memberships:
          type: array
          items:
            type: object
            required: [license_id, organization_id, organization_name, role]
            properties:
              license_id: { type: string }
              organization_id: { type: string, format: uuid }
              organization_name: { type: string }
              role: { type: string, enum: [owner, viceowner, admin, agent] }
              license_status: { type: string }
              client_id:
                type: string
                nullable: true
                description: |
                  The workspace's OAuth client. Returned so the agent app does
                  not have to derive one from the organisation name — which had
                  no answer for a workspace created through signup, and
                  collided for two organisations sharing a first word.

    Invitation:
      type: object
      required: [id, email, role, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [admin, agent] }
        invited_by_name: { type: string, nullable: true }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        accept_url:
          type: string
          nullable: true
          description: |
            The shareable link, returned **only** in the response that creates
            the invitation. Listing invitations later does not re-expose it: the
            token is stored as a hash, so there is nothing to re-expose, and a
            list endpoint that handed out working links would turn read access
            to the team page into workspace access.

    Ticket:
      type: object
      required: [id, subject, status, priority, created_at]
      properties:
        id: { type: string, maxLength: 12 }
        subject: { type: string }
        status:
          type: string
          enum: [open, pending, solved, closed, spam]
        priority:
          type: integer
          description: |
            Queue priority (FR-MOD-13.6). Higher is more urgent; 0 is the
            default. Bounded to [-100, 100].
        assignee_id: { type: string, format: uuid, nullable: true }
        assignee_name: { type: string, nullable: true }
        group_id: { type: integer, format: int64, nullable: true }
        customer_id: { type: string, format: uuid, nullable: true }
        customer_name:
          type: string
          nullable: true
          description: Null for a visitor who never introduced themselves.
        customer_email: { type: string, nullable: true }
        source_chat_id:
          type: string
          nullable: true
          maxLength: 12
          description: The conversation this followed on from, if any.
        merged_into_id:
          type: string
          nullable: true
          maxLength: 12
          description: |
            The primary ticket this one is folded into (FR-MOD-13.6), or null
            when it stands alone. A merged ticket is hidden from the lists.
        last_message_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [followers, merged_ticket_ids, tags, custom_fields]
          properties:
            source_chat:
              nullable: true
              description: |
                A snapshot of the conversation the ticket came from, so an agent
                picking the ticket up has the context without hunting for it.
              type: object
              required: [id, active]
              properties:
                id: { type: string, maxLength: 12 }
                active: { type: boolean }
                created_at: { type: string, format: date-time }
            followers:
              type: array
              description: Agents watching this ticket without owning it (FR-MOD-13.6).
              items:
                type: object
                required: [account_id]
                properties:
                  account_id: { type: string, format: uuid }
                  name: { type: string, nullable: true }
            merged_ticket_ids:
              type: array
              description: Ids of the tickets merged into this one (empty unless it is a primary).
              items: { type: string, maxLength: 12 }
            tags:
              type: array
              description: Tag names on the ticket — what a ticket rule's "add tag" writes (FR-MOD-08.6.2).
              items: { type: string }
            custom_fields:
              type: array
              description: Custom fields defined for tickets, with this ticket's values (FR-MOD-08.7.6).
              items: { $ref: "#/components/schemas/CustomFieldValue" }

    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/CustomerSummary"
        - type: object
          required: [visits, chats, custom_fields, visits_count, groups]
          properties:
            banned_at: { type: string, format: date-time, nullable: true }
            custom_fields:
              type: array
              description: Custom fields defined for contacts, with this contact's values (FR-MOD-08.7.6).
              items: { $ref: "#/components/schemas/CustomFieldValue" }
            visits_count:
              type: integer
              description: |
                The true total, unlike `visits` below which is capped at the
                most recent entries — a returning visitor's real count cannot
                be read from the truncated array (FR-MOD-13.2).
            groups:
              type: array
              description: |
                Teams this visitor's conversations have been routed to
                (FR-MOD-13.2), deduplicated. Empty for a visitor with no chats.
              items:
                type: object
                required: [id, name]
                properties:
                  id: { type: integer, format: int64 }
                  name: { type: string }
            visits:
              type: array
              description: Most recent first.
              items: { $ref: "#/components/schemas/Visit" }
            chats:
              type: array
              items:
                type: object
                required: [id, active, created_at]
                properties:
                  id: { type: string }
                  active: { type: boolean }
                  created_at: { type: string, format: date-time }
                  last_event_at: { type: string, format: date-time, nullable: true }

    Visit:
      type: object
      required: [id, started_at, pages]
      properties:
        id: { type: string, format: uuid }
        came_from:
          type: string
          nullable: true
          description: Referring URL, when the browser sent one.
        pages:
          type: array
          description: Pages seen during the visit, in order.
          items:
            type: object
            properties:
              url: { type: string }
              at: { type: string, format: date-time }
        os: { type: string, nullable: true }
        browser: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }

    Agent:
      type: object
      required: [id, name, email, role, routing_status, concurrent_chats_limit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        avatar_url: { type: string, nullable: true }
        role: { type: string, enum: [owner, viceowner, admin, agent] }
        routing_status:
          type: string
          enum: [accepting_chats, not_accepting_chats, offline]
        concurrent_chats_limit:
          type: integer
          description: Routing never assigns past this. Over-limit means queued.
        two_factor_enabled: { type: boolean }
        suspended:
          type: boolean
          description: |
            A suspended agent is reachable through this list (with
            `status=suspended` or `status=all`) but cannot be assigned work and
            does not occupy a billed seat (FR-MOD-04.6).
        expertise:
          type: array
          description: |
            The expertise areas assigned to this agent (FR-MOD-08.6.3 —
            skill-based routing), ordered by name. Empty when none are set. Set
            wholesale through `PUT /agents/{agentId}/expertise`.
          items: { $ref: "#/components/schemas/Expertise" }

    Expertise:
      type: object
      description: |
        An area of expertise a licence defines for skill-based routing
        (FR-MOD-08.6.3). Called "expertise" at the data layer because "skills" is
        the AI-automation concept; the product surface may still label it a skill.
      required: [id, name, slug]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug:
          type: string
          description: Derived from the name, unique within the licence.

    Group:
      type: object
      required: [id, name, language_code, agents]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        language_code: { type: string }
        agents:
          type: array
          items:
            type: object
            required: [agent_id, priority]
            properties:
              agent_id: { type: string, format: uuid }
              priority:
                type: string
                enum: [primary, first, normal, last]
                description: |
                  Assignment preference within the team (ADR-08). A full tier is
                  skipped rather than queued behind.

    WorkSchedule:
      type: object
      description: |
        An agent's declared weekly availability (PRD §5.3-Vardiya). One slot per
        weekday it lists, in `@nexa/types` `WORK_SCHEDULE_DAYS` order; a day with
        no slot is unscheduled. `enabled` distinguishes a day that is off from a
        day whose hours have simply not been set. `@nexa/types`
        `normalizeWorkSchedule` is the single validation gate both
        `GET`/`PUT /agents/{agentId}/work-schedule` and the settings form defer
        to, so the endpoint and the form can never disagree about what a valid
        week is. An agent with no stored plan reads back the default week.
      required: [timezone, schedule]
      properties:
        timezone:
          type: string
          description: IANA zone, e.g. "Europe/Istanbul".
        schedule:
          type: array
          items: { $ref: "#/components/schemas/WorkScheduleSlot" }

    WorkScheduleSlot:
      type: object
      required: [day, start, end, enabled]
      properties:
        day:
          type: string
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        start:
          type: string
          description: 24h `HH:MM`.
          example: "09:00"
        end:
          type: string
          description: 24h `HH:MM`.
          example: "18:00"
        enabled:
          type: boolean
          description: False marks the day off without deleting its configured hours.

    UsageSummary:
      type: object
      required: [period, ai_resolutions, api_calls]
      properties:
        period: { type: string, description: "`yyyymm`." }
        ai_resolutions:
          type: object
          required: [used, included, overage, overage_cents, overage_unit, overage_unit_price_cents]
          properties:
            used:
              type: integer
              description: |
                Threads that closed with no agent-authored event (ADR-09). The
                same query backs the "automated" figure in reports.
            included: { type: integer }
            overage: { type: integer }
            overage_cents: { type: integer }
            overage_unit:
              type: integer
              description: |
                Pack size the overage is priced in — the "aşım paketi"
                (PRD §10.1.4). A pricing bundle, not a billing quantum: the
                invoice still meters per resolution via `overage_cents`.
            overage_unit_price_cents:
              type: integer
              description: Price of one AI resolution beyond the allowance, in cents.
        api_calls:
          type: object
          required: [used, included, overage, overage_cents, overage_unit, overage_unit_price_cents]
          properties:
            used:
              type: integer
              description: Billed API calls this period (FR-MOD-10.1.5) — one per PAT-authenticated request.
            included: { type: integer }
            overage: { type: integer, description: Calls beyond the included allowance. }
            overage_cents:
              type: integer
              description: |
                Overage charge for the period. Billed by the block, not the call:
                any part of a 100,000 block over the allowance costs one block, so
                this is `ceil(overage / overage_unit) * overage_unit_price_cents`.
            overage_unit:
              type: integer
              description: |
                Block size the overage is billed in — the "$29.50 per 100,000
                extra" block (PRD §10.1.5). Unlike AI resolutions (metered per
                unit), API calls bill by the whole block.
            overage_unit_price_cents:
              type: integer
              description: Price of one 100,000-call block beyond the allowance, in cents.

    SubscriptionView:
      type: object
      required:
        [
          plan,
          status,
          access,
          seats,
          min_seats,
          unit_price_cents,
          billing_cycle,
          usage,
          estimated_total_cents,
          provider,
          pricing,
        ]
      properties:
        plan: { type: string }
        pricing:
          type: string
          enum: [listed, quoted]
          description: |
            Whether `unit_price_cents` is a price this product quotes (`listed`,
            the self-serve tier) or a figure agreed in a contract the product
            never sees (`quoted`, Enterprise — the PRD states its capabilities
            and no price). Show the number for `listed`; show "contact sales"
            for `quoted`. The amounts are still returned either way, because the
            mocked invoice is built from them.
        billing_cycle: { type: string, enum: [monthly, annual] }
        status:
          type: string
          enum: [trialing, active, past_due, read_only, canceled]
        access:
          type: string
          enum: [trialing, active, read_only]
          description: What the workspace may do right now.
        trial:
          type: object
          properties:
            ends_at: { type: string, format: date-time, nullable: true }
            days_remaining: { type: integer, nullable: true }
        seats:
          type: integer
          description: Purchased seats — what the seat charge is based on.
        min_seats:
          type: integer
          description: Floor for the seats stepper — the count of non-suspended agents.
        unit_price_cents: { type: integer }
        usage: { $ref: "#/components/schemas/UsageSummary" }
        estimated_total_cents:
          type: integer
          description: Charge for the current cycle — the monthly figure, or the annual total when annual.
        annual_savings_cents:
          type: integer
          description: What annual billing saves versus twelve monthly charges. 0 on monthly.
        provider: { type: string, enum: [mock] }

    Entitlement:
      type: string
      description: |
        A capability a commercial tier unlocks (FR-MOD-11.5). Closed
        vocabulary — the plan catalogue, this endpoint and the screens all speak
        it, so a capability cannot be spelled two ways and enforced in one place.

        `sla` is the first-response/resolution target of PRD §5.4, not the
        uptime commitment of NFR-U5: that is a contract term with a billing
        credit, which no code in this repo can promise.
      enum: [white_label, sandbox, sla, sso, hipaa, siem_export]

    EntitlementsView:
      type: object
      description: |
        What the caller's workspace may switch on, and what each tier grants.
      required: [plan, entitlements, plans]
      properties:
        plan:
          type: string
          description: The caller's plan. A workspace with no subscription is on trial and reads as the self-serve tier.
        entitlements:
          type: object
          description: |
            Every entitlement with a yes/no answer. Total by construction: a key
            is never absent, so "missing" can never be read as an implicit yes.
          required: [white_label, sandbox, sla, sso, hipaa, siem_export]
          additionalProperties: false
          properties:
            white_label: { type: boolean, description: Widget served without Nexa branding. }
            sandbox:
              { type: boolean, description: A second, non-billable workspace to test against. }
            sla:
              { type: boolean, description: First-response/resolution targets with breach marking. }
            sso:
              { type: boolean, description: SAML 2.0/OIDC sign-in and SCIM provisioning (NFR-S11). }
            hipaa: { type: boolean, description: Signed-BAA path and US-only hosting (NFR-C4). }
            siem_export:
              { type: boolean, description: Audit trail shipped to an external SIEM (NFR-S12). }
        plans:
          type: array
          description: |
            The tier catalogue — static and identical for every workspace, so a
            screen can name the tier that unlocks a control rather than saying
            "upgrade" with nowhere to point.
          items:
            type: object
            required: [id, pricing, unit_price_cents, ai_resolutions_included, entitlements]
            properties:
              id: { type: string }
              pricing: { type: string, enum: [listed, quoted] }
              unit_price_cents:
                type: integer
                nullable: true
                description: List price per seat per month. Null on a quoted tier — the PRD gives Enterprise no price, and inventing one is not this repo's call.
              ai_resolutions_included:
                type: integer
                nullable: true
                description: Included AI resolutions per month. Null when the contract sets it.
              entitlements:
                type: array
                items: { $ref: "#/components/schemas/Entitlement" }

    Invoice:
      type: object
      required:
        [
          number,
          period,
          period_label,
          issued_at,
          status,
          currency,
          line_items,
          subtotal_cents,
          total_cents,
        ]
      properties:
        number: { type: string, description: "Invoice number, `NEXA-<yyyymm>`." }
        period: { type: string, description: "Billing period as `yyyymm`." }
        period_label: { type: string, description: "Friendly period label, e.g. `July 2026`." }
        issued_at: { type: string, format: date-time }
        status:
          type: string
          enum: [paid, open, trial]
          description: |
            `paid` for a settled past period, `open` for the current one still
            accruing, `trial` while the workspace owes nothing.
        currency: { type: string, enum: [usd] }
        line_items:
          type: array
          items:
            type: object
            required: [description, amount_cents]
            properties:
              description: { type: string }
              amount_cents: { type: integer }
        subtotal_cents: { type: integer }
        total_cents: { type: integer }

    PaymentMethod:
      type: object
      description: |
        A masked payment method. Billing is mocked (ADR-13) and real card entry
        is out of scope (PRD §11.1/1) — never a full card number.
      required: [brand, last4, exp_month, exp_year, holder_name, updated_at]
      properties:
        brand: { type: string, enum: [visa, mastercard, amex, discover] }
        last4: { type: string, description: "Last four digits — the only card fragment stored." }
        exp_month: { type: integer, minimum: 1, maximum: 12 }
        exp_year: { type: integer }
        holder_name: { type: string }
        updated_at: { type: string, format: date-time }

    ApiPackage:
      type: object
      description: |
        A named, purchasable block of API calls (FR-MOD-09.3). The catalogue is
        static and global — the same three packages for every workspace, never
        filtered or repriced per tenant — so a price change is a code change
        (ADR-13 keeps billing mocked, so there is no provider-side catalogue to
        sync with).

        Distinct from the automatic overage in `UsageSummary.api_calls`: that is
        what a workspace is charged for going past its allowance, this is what it
        buys *before* it does.
      required: [id, name, api_calls, price_cents]
      properties:
        id: { type: string, description: "Catalogue id — `essential`, `pro`, `pro-plus`." }
        name: { type: string }
        api_calls: { type: integer, description: The calls this package adds. }
        price_cents: { type: integer }

    ApiPackagePurchase:
      type: object
      description: |
        One recorded API-package purchase (FR-MOD-09.3). The quota and price are
        the catalogue's values *at the time of sale*, stored on the row rather
        than looked up, so a later price change never rewrites what a workspace
        was charged. `name` is joined from the catalogue for display; a purchase
        of a package that has since left the catalogue still reports its
        `package_id`.
      required: [id, package_id, name, api_calls, price_cents, period, purchased_at]
      properties:
        id: { type: string, format: uuid }
        package_id: { type: string }
        name:
          type: string
          nullable: true
          description: Catalogue name, or null if the package is no longer offered.
        api_calls: { type: integer, description: Calls this purchase added. }
        price_cents: { type: integer }
        period: { type: string, description: "The `yyyymm` period the quota was added to." }
        purchased_at: { type: string, format: date-time }

    ApiPackagePurchaseResult:
      type: object
      description: |
        What a purchase produced: the receipt, and the period's usage as it
        stands after the calls were credited (FR-MOD-09.3).

        `usage` is returned rather than left to a follow-up `GET /billing/usage`
        because the whole point of the purchase is the raised allowance — a
        client that has to ask again can render the old number in between, and
        the two reads can disagree if anything is metered between them. This one
        is read inside the same transaction that credited the quota.
      required: [purchase, usage]
      properties:
        purchase: { $ref: "#/components/schemas/ApiPackagePurchase" }
        usage: { $ref: "#/components/schemas/UsageSummary" }

    PaymentMethodInput:
      type: object
      description: |
        The masked fields a processor returns after tokenising a card. There is
        deliberately no full-card-number field — the out-of-scope data cannot be
        submitted.
      required: [brand, last4, exp_month, exp_year, holder_name]
      properties:
        brand: { type: string, enum: [visa, mastercard, amex, discover] }
        last4: { type: string, pattern: "^[0-9]{4}$" }
        exp_month: { type: integer, minimum: 1, maximum: 12 }
        exp_year: { type: integer, minimum: 2000, maximum: 2100 }
        holder_name: { type: string, minLength: 1, maxLength: 120 }

    BenchmarkWindow:
      type: object
      description: |
        The window a report is benchmarked against (FR-MOD-07.7). Always another
        window of the **same** license — see the `baseline` query parameter for
        why a cross-license benchmark is refused rather than unimplemented.

        `baseline` names which comparison produced the block, because the same
        `previous_period` key carries a different window depending on the
        request and a client rendering "vs previous" must not have to guess
        which one it received. Each report adds its own comparable figures
        alongside; the figures are sent rather than a pre-computed delta, so a
        client can show the change *and* the baseline, and a rounding choice
        stays on one side of the wire.
      required: [baseline, range]
      properties:
        baseline: { type: string, enum: [previous_period, previous_year] }
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }

    ReportsOverview:
      type: object
      required:
        [
          range,
          previous_period,
          totals,
          chats,
          response_times,
          satisfaction,
          by_agent,
          top_tags,
          sla,
        ]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            The benchmark window's headline figures, so every KPI card can carry
            a vs-baseline delta (FR-MOD-07.3.1). No by-agent or by-tag depth —
            nothing on a KPI card needs it.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required:
                [
                  chats,
                  tickets,
                  total_cases,
                  closed,
                  manual,
                  assisted,
                  automated,
                  achieved_goals,
                  sla_breaches,
                ]
              properties:
                chats: { type: integer }
                tickets: { type: integer }
                total_cases: { type: integer }
                closed: { type: integer }
                manual: { type: integer }
                assisted: { type: integer }
                automated: { type: integer }
                avg_first_response_seconds: { type: integer, nullable: true }
                avg_duration_seconds: { type: integer, nullable: true }
                satisfaction_score:
                  type: number
                  nullable: true
                  description: Null when nobody rated the baseline window.
                achieved_goals:
                  type: integer
                  description: Goals reached in the baseline window (FR-MOD-13.3).
                sla_breaches:
                  type: integer
                  description: SLA misses detected in the baseline window (FR-MOD-11.5).
        totals:
          type: object
          required:
            [
              chats,
              tickets,
              total_cases,
              closed,
              manual,
              assisted,
              automated,
              queued_now,
              achieved_goals,
            ]
          properties:
            chats: { type: integer }
            tickets:
              type: integer
              description: Tickets created in the range.
            total_cases:
              type: integer
              description: |
                Chats plus tickets (PRD §3.3). Sent rather than left for the
                client to add up, so every surface quoting "total cases" quotes
                the same number.
            closed: { type: integer }
            # PRD 07.3.2 splits every *closed* case three ways, and the three
            # always sum back to `closed` — so a client can trust the parts
            # against the whole:
            #   manual    — an agent replied and no skill ran.
            #   assisted  — an agent replied *and* a skill ran on the chat.
            #   automated — no agent-authored event at all (ADR-09). This is the
            #     same definition the invoice's AI-resolution counter uses, so
            #     the two never drift.
            manual: { type: integer }
            assisted: { type: integer }
            automated: { type: integer }
            manual_rate:
              type: number
              nullable: true
              description: Share of *closed* chats an agent resolved unaided. Null when nothing closed.
            assisted_rate:
              type: number
              nullable: true
              description: Share of *closed* chats an agent resolved with a skill. Null when nothing closed.
            automated_rate:
              type: number
              nullable: true
              description: Share of *closed* chats. Null when nothing closed.
            queued_now: { type: integer }
            achieved_goals:
              type: integer
              description: Goals reached in the range (FR-MOD-13.3) — the funnel's converted stage.
        chats:
          type: object
          description: |
            Operational chat metrics for the Chats section cards (FR-MOD-07.3.3):
            how fast the AI is clearing conversations and how long they run.
          required: [automated_per_hour, total_duration_seconds]
          properties:
            automated_per_hour:
              type: number
              description: Automated resolutions per hour across the window (0 for an empty window).
            automated_avg_duration_seconds:
              type: integer
              nullable: true
              description: Average open-to-close time of automated chats. Null when none closed automated.
            total_duration_seconds:
              type: integer
              description: Summed open-to-close time of every closed chat.
        response_times:
          type: object
          properties:
            avg_first_response_seconds: { type: integer, nullable: true }
            avg_duration_seconds: { type: integer, nullable: true }
        satisfaction:
          type: object
          required: [good, bad, responses]
          properties:
            good: { type: integer }
            bad: { type: integer }
            score:
              type: number
              nullable: true
              description: Null when nobody rated — unknown, not zero.
            responses: { type: integer }
        by_agent:
          type: array
          items:
            type: object
            required: [agent_id, chats]
            properties:
              agent_id: { type: string, format: uuid }
              name: { type: string, nullable: true }
              chats: { type: integer }
        top_tags:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer }
        sla:
          type: object
          description: |
            SLA breaches in the window (FR-MOD-11.5 · 11.5-e). Its own block
            rather than folded into `totals`: unlike every figure there, a
            breach count means nothing without `active` alongside it — a
            workspace that has never configured targets has zero breaches for
            the same reason it has zero of anything nobody asked to measure,
            and showing that "0" bare would read as a clean record rather than
            as SLA never having been switched on.
          required: [active, breaches, low_confidence]
          properties:
            active:
              type: boolean
              description: |
                Whether SLA targets are in force today — the same "bought it
                and asked for something" rule `GET /settings/sla`'s `active`
                field applies.
            breaches:
              type: integer
              description: SLA misses detected in the range.
            low_confidence:
              type: boolean
              description: |
                Too few cases in the window to read much into the count — a
                single slow reply can be the whole story in a two-case window.

    ReportsBreakdown:
      type: object
      description: |
        The Overview's resolution split (manual / assisted / automated,
        FR-MOD-07.3.2) resolved over up to four dimensions — each UTC day in the
        window, each assigned agent, each hour of day, each team and each
        channel — for the Metrics breakdown tab (FR-MOD-07.5).
        `manual + assisted + automated === closed` holds inside every row, the
        same invariant the Overview cards rely on.

        `by_day` and `by_agent` are always present. `by_hour`, `by_team` and
        `by_channel` are optional — a client that only knows the original two
        dimensions keeps working unchanged.
      required: [range, previous_period, by_day, by_agent]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            The benchmark window's resolution split — the whole license, not a
            baseline copy of the five dimensions. A dimension's buckets are
            derived from the window (which days it holds, which teams were
            active), so a per-bucket baseline would pair rows that are not
            counterparts; the split itself is what the two windows share.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [chats, closed, manual, assisted, automated]
              properties:
                chats: { type: integer }
                closed: { type: integer }
                manual: { type: integer }
                assisted: { type: integer }
                automated: { type: integer }
        by_day:
          type: array
          items:
            type: object
            required: [date, chats, closed, manual, assisted, automated]
            properties:
              date: { type: string, description: "UTC day as `YYYY-MM-DD`." }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }
        by_agent:
          type: array
          items:
            type: object
            required: [agent_id, chats, closed, manual, assisted, automated]
            properties:
              agent_id: { type: string, format: uuid }
              name: { type: string, nullable: true }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }
        by_hour:
          type: array
          description: |
            One row per hour of day (0-23, UTC), ascending. Optional — absent
            until FR-MOD-07.5's hour dimension is wired up.
          items:
            type: object
            required: [hour, chats, closed, manual, assisted, automated]
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }
        by_team:
          type: array
          description: |
            One row per team. `team_id`/`name` are null for chats not assigned
            to any team. Optional — absent until FR-MOD-07.5's team dimension is
            wired up. A chat may be visible to more than one team, so rows can
            overlap; see `overlapping`.
          items:
            type: object
            required: [team_id, name, chats, closed, manual, assisted, automated]
            properties:
              team_id: { type: integer, nullable: true }
              name: { type: string, nullable: true }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }
        overlapping:
          type: boolean
          description: |
            True when `by_team` rows can double-count a chat (a chat reachable
            by more than one team), so the sum of `by_team.chats` may exceed the
            window's total chats. Only meaningful alongside `by_team`.
        by_channel:
          type: array
          description: |
            One row per channel (`website` is the fallback for chats with no
            inbound channel message). Optional — absent until FR-MOD-07.5's
            channel dimension is wired up.
          items:
            type: object
            required: [channel, chats, closed, manual, assisted, automated]
            properties:
              channel: { type: string }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }

    ReportsAiAgent:
      type: object
      description: |
        AI Agent performance for its own report tab (FR-MOD-07.4). `resolutions`
        is ADR-09's figure — the same one the invoice's AI-resolution counter
        uses — so this surface never disagrees with the bill.
      required: [range, previous_period, resolutions, transfers, skill_runs]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            The benchmark window's AI counters, so the tab can show each against
            what it was. `avg_automated_duration_seconds` is not repeated here —
            a duration average is not a figure the tab tracks a delta on.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [resolutions, transfers, skill_runs]
              properties:
                resolutions: { type: integer }
                resolution_rate:
                  type: number
                  nullable: true
                  description: Null when nothing closed in the baseline window.
                transfers: { type: integer }
                skill_runs: { type: integer }
        resolutions:
          type: integer
          description: Chats closed with no agent-authored event (ADR-09).
        resolution_rate:
          type: number
          nullable: true
          description: Share of *closed* chats the AI resolved. Null when nothing closed.
        transfers:
          type: integer
          description: AI→human hand-offs in the window (transfer events).
        transfer_rate:
          type: number
          nullable: true
          description: |
            Share of AI-finished chats handed to a human — transfers over
            transfers plus resolutions. Null when the AI finished none either way.
        skill_runs:
          type: integer
          description: Skills that ran in the window.
        avg_automated_duration_seconds:
          type: integer
          nullable: true
          description: Average open-to-close time of automated chats. Null when none.

    ReportsReviews:
      type: object
      description: |
        The Reviews / Ratings report (FR-MOD-07.8): CSAT read back from the
        ratings the widget writes. `csat` feeds the donut, `by_day` the daily bar,
        and `previous_period` the two-period comparison. Every `score` is `null`
        (not `0`) for an unrated span — the same rule the Overview's satisfaction
        follows. `ecommerce` carries the tracked-sales figures (FR-MOD-13.5) when
        the workspace has sales tracking switched on, and an honest "not set up"
        block when it has not.
      required: [range, previous_period, csat, by_day, ecommerce]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        csat:
          $ref: "#/components/schemas/CsatSummary"
        previous_period:
          description: |
            CSAT for the benchmark window, so the tab can show a vs-baseline
            delta (the PRD's "67% vs 57%").
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - $ref: "#/components/schemas/CsatSummary"
        by_day:
          type: array
          description: One row per UTC day with at least one rating, ascending by date.
          items:
            allOf:
              - type: object
                required: [date]
                properties:
                  date: { type: string, description: "UTC day as `YYYY-MM-DD`." }
              - $ref: "#/components/schemas/CsatSummary"
        ecommerce:
          type: object
          description: |
            Sales the workspace's tracking snippet reported, credited to the
            conversations that supported them (FR-MOD-13.5).

            Two states, and the difference matters. Until Settings → Sales
            tracker is switched on, `configured` is `false` and every figure is
            `null` — an honest "not set up" placeholder, never a fabricated
            zero. Once it is on, the figures are real, and a window with no
            attributed order reports `0` rather than `null`: that zero is a
            known answer, not an unknown one.

            Only orders the attribution window tied to a chat are counted, so
            this is revenue live chat can take credit for, not the workspace's
            turnover.
          required: [configured, tracked_sales, attributed_revenue_cents, currency]
          properties:
            configured:
              type: boolean
              description: Whether sales tracking is switched on for this workspace.
            tracked_sales:
              type: integer
              nullable: true
              description: Attributed orders in the window; 0 if none. Null while unconfigured.
            attributed_revenue_cents:
              type: integer
              nullable: true
              description: |
                Revenue attributed to supported conversations, in minor units of
                `currency`; 0 if none. Null while unconfigured.
            currency:
              type: string
              nullable: true
              description: |
                ISO 4217 code the revenue figure is denominated in, as configured
                in Settings → Sales tracker. Null while unconfigured.

    ReportsTopics:
      type: object
      description: |
        The Chat topics report (FR-MOD-07.6): conversations in the window grouped
        into topics by deterministic, on-the-fly clustering (`@nexa/ai-mock`, no
        real LLM), each with volume, share and a vs-previous trend. Nothing is
        persisted — the clustering is recomputed per request.

        Below `min_conversations` clusterable chats the report is
        `sufficient_data: false` with an empty `topics` — an honest "not enough
        conversations yet" state, never a single fabricated topic, and always a
        200 rather than an error.
      required: [range, previous_period, min_conversations, analyzed, sufficient_data, topics]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            The benchmark window. Each topic's `previous_volume` — and so its
            `trend` — is read here, which is why `baseline` moves the comparison
            itself rather than only labelling it. No window-level figure rides
            along: a topic's baseline volume belongs on the topic's own row,
            where it can be matched to the cluster it describes.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
        min_conversations:
          type: integer
          description: |
            The floor of clusterable conversations the window needs before topics
            are computed. Below it, `sufficient_data` is false and `topics` is
            empty — surfaced so a client can tell the user how many more
            conversations are needed.
        analyzed:
          type: integer
          description: |
            How many clusterable conversations the window held. A conversation is
            clusterable once it has text to cluster — an AI summary, or failing
            that a customer message. 0 for an empty window.
        sufficient_data:
          type: boolean
          description: |
            False when `analyzed` is below `min_conversations`; `topics` is then
            empty. "Not enough conversations yet" is a state, not an error.
        topics:
          type: array
          description: |
            The clustered topics, most voluminous first. Empty while
            `sufficient_data` is false.
          items:
            type: object
            required: [id, label, keywords, volume, share, previous_volume, trend]
            properties:
              id:
                type: string
                description: Stable within one response, for keying a list row.
              label:
                type: string
                description: Human-readable topic name derived from the cluster's terms.
              keywords:
                type: array
                items: { type: string }
                description: The terms the label was derived from.
              volume:
                type: integer
                description: Conversations in this topic within the window.
              share:
                type: number
                nullable: true
                description: |
                  Share of `analyzed` conversations in this topic. Null when
                  nothing was analyzed — unknown, not zero.
              previous_volume:
                type: integer
                description: This topic's volume in `previous_period` (0 when it did not appear).
              trend:
                type: number
                nullable: true
                description: |
                  Change ratio vs `previous_volume`. Null — not a 100% rise — when
                  `previous_volume` is 0: a topic that is new has an unknown
                  trend, not an infinite one.

    ReportsCases:
      type: object
      description: |
        The Cases report (FR-MOD-07.7, v2 payload): tickets (FR-MOD-02.6)
        counted by day of creation, current status and stored queue priority
        (FR-MOD-13.6). Aggregate counts only — no ticket subject or customer
        identity is in this report. A merged ticket (`merged_into_id` set) is
        excluded from every bucket.
      required: [range, previous_period, by_day, by_status, by_priority]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            Ticket counts for the benchmark window, split the same way `by_day`
            splits them and with the same merged-ticket exclusion — a benchmark
            counted differently from the series beside it would be a number
            nobody could reconcile.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [open, closed, total]
              properties:
                open: { type: integer }
                closed: { type: integer }
                total: { type: integer }
        by_day:
          type: array
          description: |
            One row per UTC day with at least one ticket created, ascending by
            date. `open`/`closed` split by the ticket's *current* status
            (`solved`/`closed` count as closed); `total` is `open + closed`.
          items:
            type: object
            required: [date, open, closed, total]
            properties:
              date: { type: string, description: "UTC day as `YYYY-MM-DD`." }
              open: { type: integer }
              closed: { type: integer }
              total: { type: integer }
        by_status:
          type: array
          description: Tickets in the window grouped by current status.
          items:
            type: object
            required: [status, count]
            properties:
              status:
                type: string
                description: "One of `open`, `pending`, `solved`, `closed`, `spam`."
              count: { type: integer }
        by_priority:
          type: array
          description: |
            Tickets in the window grouped by their stored queue priority
            (FR-MOD-13.6) — the raw signed integer, highest first; not the four
            named levels the Inbox pane snaps to for display.
          items:
            type: object
            required: [priority, count]
            properties:
              priority: { type: integer }
              count: { type: integer }

    ReportsLeads:
      type: object
      description: |
        The Leads report (FR-MOD-07.7, v2 payload): customers flagged as leads
        (`is_lead`) counted by UTC day of their first contact with this license.
        Aggregate counts only — no lead name, email or phone is in this report.

        ISOLATION (NFR-S4): `customers` is organization-scoped and carries no
        `license_id`, and one organization may hold several licenses, so a lead
        is bound to this license only when it has touched the license through a
        chat or a ticket. The organization-wide `is_lead` count is deliberately
        not used — it would leak a sibling license's leads into this report.
      required: [range, previous_period, by_day, totals]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            New leads in the benchmark window, counted through the same
            first-touch binding as `totals.leads` — so the benchmark stays
            inside this license exactly as the window's own figure does.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [leads]
              properties:
                leads: { type: integer }
        by_day:
          type: array
          description: |
            One row per UTC day on which at least one lead first touched this
            license, ascending by date. `count` is the number of leads whose
            first contact with the license fell on that day.
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string, description: "UTC day as `YYYY-MM-DD`." }
              count: { type: integer }
        totals:
          type: object
          description: |
            Window totals. `leads` is the distinct leads whose first contact
            with this license fell inside the window — equal to the sum of the
            `by_day` counts.
          required: [leads]
          properties:
            leads: { type: integer }

    ReportsTeamPerformance:
      type: object
      description: |
        Team performance (FR-MOD-07.7, v2 payload): the Breakdown tab's
        by-agent chat split (`chats`/`closed`/`manual`/`assisted`/`automated`),
        extended per agent with average first-response and conversation
        duration, CSAT and AI→human transfer hand-offs.

        CSAT and transfers are windowed by their own timestamp (the rating's
        or the transfer event's `created_at`) — the same convention the
        Reviews report and the AI Agent report's `transfers` figure follow —
        not by the thread's creation date. Which agents appear, their order
        and the `LIMIT 20` all come from the chat-split query alone (the same
        one `ReportsBreakdown.by_agent` uses): an agent needs at least one
        thread *created* in the window to appear here, even if a rating or
        transfer landed inside the window on an older thread of theirs.
      required: [range, previous_period, agents]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            The license's resolution split in the benchmark window — not a
            baseline copy of the agent table. Which agents `agents` holds is
            derived from the window (the `LIMIT 20` over agents with a thread
            created in it), so the two windows would list different people and a
            row-by-row comparison would silently pair an agent with someone
            else, or with a blank where they did not make the earlier cut. A
            per-agent history is a different report, not this one's baseline.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [chats, closed, manual, assisted, automated]
              properties:
                chats: { type: integer }
                closed: { type: integer }
                manual: { type: integer }
                assisted: { type: integer }
                automated: { type: integer }
        agents:
          type: array
          description: |
            One row per agent with at least one thread created in the window,
            most chats first, capped at 20 — the same set, order and limit
            `ReportsBreakdown.by_agent` uses.
          items:
            type: object
            required:
              - agent_id
              - chats
              - closed
              - manual
              - assisted
              - automated
              - avg_first_response_seconds
              - avg_duration_seconds
              - csat
              - transfers
            properties:
              agent_id: { type: string, format: uuid }
              name: { type: string, nullable: true }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }
              avg_first_response_seconds: { type: integer, nullable: true }
              avg_duration_seconds: { type: integer, nullable: true }
              csat:
                type: object
                required: [good, bad, responses, score]
                properties:
                  good: { type: integer }
                  bad: { type: integer }
                  responses: { type: integer }
                  score:
                    type: number
                    nullable: true
                    description: Null when nobody rated this agent in the window.
              transfers:
                type: integer
                description: |
                  AI→human hand-offs (chat_transferred events) landing on a
                  thread this agent currently holds.

    ReportsSales:
      type: object
      description: |
        The Sales report (FR-MOD-07.7, v2 payload; FR-MOD-13.5 dependency): the
        same tracked-sales skeleton as the Reviews report's `ecommerce` block,
        as a report of its own. No sales/order source exists yet, so
        `configured` is `false` and every figure `null` — an honest "not set
        up" state, never a fabricated zero, until FR-MOD-13.5's Sales tracker
        wires a real source.
      required:
        [
          range,
          previous_period,
          configured,
          tracked_sales,
          attributed_revenue_cents,
          currency,
          conversions,
        ]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            The benchmark window, as honest as the report itself: with no sales
            source there is nothing to have been better or worse than, so every
            figure is `null` here too. Zeros would let a surface render a
            "0 → 0, no change" badge that reads as a measurement.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [configured, tracked_sales, attributed_revenue_cents, currency, conversions]
              properties:
                configured: { type: boolean }
                tracked_sales: { type: integer, nullable: true }
                attributed_revenue_cents: { type: integer, nullable: true }
                currency: { type: string, nullable: true }
                conversions: { type: integer, nullable: true }
        configured:
          type: boolean
          description: Whether a sales-tracking source is wired. Always false in v1.
        tracked_sales:
          type: integer
          nullable: true
          description: Attributed orders. Null until configured.
        attributed_revenue_cents:
          type: integer
          nullable: true
          description: Revenue attributed to supported conversations. Null until configured.
        currency:
          type: string
          nullable: true
          description: ISO 4217 code for the revenue figure. Null until configured.
        conversions:
          type: integer
          nullable: true
          description: Conversions attributed to supported conversations. Null until configured.

    StaffingForecast:
      type: object
      description: |
        The work-scheduler forecast (PRD §5.3-Vardiya): a fixed 7 × 24 grid of
        `required` / `scheduled` / `rostered` agents per UTC weekday-hour,
        derived deterministically from the observed window — historical chat
        volume, the presence event log and the stored work schedules. Nothing is
        persisted; the grid is recomputed per request.

        Read `null` as "not known", never as zero — see the operation
        description for each of the four unknowns and why a fabricated zero
        would be worse than an absent number in every one of them.
      required: [range, inputs, coverage_known, roster_known, low_confidence, cells]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        inputs:
          type: object
          description: |
            The figures every cell was derived from, echoed so a recommendation
            can be argued with rather than only believed.
          required: [concurrent_chats_limit, average_chat_minutes, minimum_sample_chats, agents]
          properties:
            concurrent_chats_limit:
              type: number
              nullable: true
              description: |
                Mean `concurrent_chats_limit` across the workspace's active
                (non-suspended) agents — how many chats one agent holds at
                once. Null when the workspace has no active agent, which leaves
                every `required_agents` null.
            average_chat_minutes:
              type: number
              nullable: true
              description: |
                Mean handling time of a conversation closed in the window, in
                minutes — the same duration `GET /reports/overview` reports in
                seconds. Null when nothing closed in the window, which leaves
                every `required_agents` null.
            minimum_sample_chats:
              type: integer
              description: |
                How many chats a cell must have observed before it reports a
                number instead of `null`.
            agents:
              type: integer
              description: Active agents the `concurrent_chats_limit` mean was taken over.
        coverage_known:
          type: boolean
          description: |
            False when the presence log says nothing about this window: every
            `scheduled_agents` and `gap` is null.
        roster_known:
          type: boolean
          description: |
            False when no agent in the workspace has a saved work schedule:
            every `rostered_agents` is null.
        low_confidence:
          type: boolean
          description: |
            True when *no* cell cleared `inputs.minimum_sample_chats` — the
            window forecasts nothing, and the whole grid is advisory at best.
        cells:
          type: array
          description: |
            Exactly 168 cells (7 × 24), ordered `day_of_week` 0-6 then `hour`
            0-23. Dense by construction: a week always has every hour.
          items:
            type: object
            required:
              [
                day_of_week,
                hour,
                observed_chats,
                required_agents,
                scheduled_agents,
                rostered_agents,
                gap,
                low_confidence,
              ]
            properties:
              day_of_week:
                type: integer
                minimum: 0
                maximum: 6
                description: "UTC weekday, 0 = Sunday … 6 = Saturday."
              hour: { type: integer, minimum: 0, maximum: 23, description: "UTC hour of day." }
              observed_chats:
                type: integer
                description: |
                  Chats that started in this cell across every occurrence of it
                  in the window — the evidence the verdict rests on, and the
                  same count `GET /reports/breakdown` gives per hour (ADR-09).
              required_agents:
                type: integer
                nullable: true
                description: |
                  Whole agents this hour's mean load needs. Null when the cell
                  has too little history, or when an input the model divides by
                  is unknown (see `inputs`).
              scheduled_agents:
                type: number
                nullable: true
                description: |
                  Mean agents actually online (`accepting_chats`) during this
                  hour, from the presence log. Null when `coverage_known` is
                  false.
              rostered_agents:
                type: number
                nullable: true
                description: |
                  Mean agents whose saved work schedule plans them onto this
                  hour, over a standing week. Fractional when a shift starts or
                  ends mid-hour. Null when `roster_known` is false.
              gap:
                type: number
                nullable: true
                description: |
                  `required_agents − scheduled_agents`: positive is a shortfall,
                  negative is spare capacity. Null when either side is null —
                  the plan is compared against what happened, never against an
                  assumed zero.
              low_confidence:
                type: boolean
                description: True exactly when `required_agents` is null.

    ReportGroups:
      type: object
      description: |
        The report groups a caller may see (FR-MOD-07.7 permission-based
        visibility) — filtered to the groups this token's scopes satisfy, so the
        list may be empty. Each id doubles as the `group` query the export
        endpoint accepts and the tab the web client renders.
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
                description: "Group id: `overview`, `breakdown`, `ai-agent` or `reviews`."
              label: { type: string, description: Human-readable tab name. }

    AccessReviewReport:
      type: object
      description: |
        Access review evidence for SOC 2 CC6.1 (NFR-C6 · C6-e) — a point-in-time
        snapshot of who and what can reach this workspace.

        The report **produces evidence and makes no judgement** (§C-A23): there
        is no risk score, no staleness flag and no recommendation, because
        "is this access appropriate" is the human control the report exists to
        feed. Every field is read off a row or derived by a rule stated here.
      required: [generated_at, audit_trail_starts_at, members, credentials]
      properties:
        generated_at:
          type: string
          format: date-time
          description: The instant the snapshot was taken.
        audit_trail_starts_at:
          type: string
          format: date-time
          nullable: true
          description: |
            The oldest entry still in this workspace's audit trail, or null when
            the trail is empty. A member's `last_login_at` of null means "nothing
            recorded since this instant", **not** "never signed in" — the trail is
            pruned on retention, so absence past this point carries no
            information.
        members:
          type: array
          description: Every membership of the workspace, oldest grant first.
          items:
            type: object
            required:
              [
                account_id,
                name,
                email,
                role,
                status,
                suspended,
                awaiting_approval,
                two_factor_enabled,
                provisioned_via,
                member_since,
                last_login_at,
                last_login_method,
              ]
            properties:
              account_id: { type: string, format: uuid }
              name: { type: string }
              email: { type: string }
              role:
                type: string
                enum: [owner, viceowner, admin, agent]
              status:
                type: string
                enum: [active, awaiting_approval, suspended]
                description: |
                  The two flags below collapsed into one value, `suspended`
                  winning — a suspended member cannot get in whatever else is
                  true of them. Both raw flags travel alongside, so nothing is
                  lost in the collapse.
              suspended: { type: boolean }
              awaiting_approval: { type: boolean }
              two_factor_enabled: { type: boolean }
              provisioned_via:
                type: string
                enum: [manual, scim]
                description: |
                  Whether an admin invited this member or the workspace's
                  directory provisioned them over SCIM. CC6.1 asks how access is
                  removed as well as granted, and the two answers differ: a
                  directory-managed member is deprovisioned by the IdP.
              member_since:
                type: string
                format: date-time
                description: When the membership was created — when access was granted.
              last_login_at:
                type: string
                format: date-time
                nullable: true
                description: |
                  The newest `auth.login` / `auth.sso_login` for this person **in
                  this workspace**, from the audit trail. Per-licence on purpose:
                  the same person may sign into another workspace daily and this
                  one never. Read together with `audit_trail_starts_at`.
              last_login_method:
                type: string
                enum: [password, sso]
                nullable: true
                description: |
                  How that sign-in was made. Separated because after an incident
                  the two imply different containment: `password` means a secret
                  Nexa holds was known, `sso` means an external system vouched.
        credentials:
          type: array
          description: |
            Every bearer credential that can open this workspace's door **today**
            — personal access tokens, OAuth access tokens, SCIM provisioning
            tokens and bot tokens. Revoked and expired rows are omitted: the
            claim is present-tense. Bot tokens are included even though the item
            names only the other three, because an inventory that omits a kind of
            credential is not an inventory.

            No token value and no digest is ever returned. This names
            credentials; it does not help anyone present one.
          items:
            type: object
            required:
              [
                id,
                kind,
                name,
                scopes,
                owner_id,
                owner_name,
                owner_email,
                owner_is_member,
                created_at,
                last_used_at,
                expires_at,
              ]
            properties:
              id: { type: string, format: uuid }
              kind:
                type: string
                enum: [pat, oauth, bot, scim]
              name: { type: string, nullable: true }
              scopes:
                type: array
                items: { type: string }
                description: |
                  Empty for a SCIM token by construction — its authority comes
                  from the route's principal list, not from a scope list.
              owner_id:
                type: string
                description: |
                  The owner reference as stored: an account uuid for
                  `pat`/`oauth`/`scim`, a bot id for `bot`, or the `system:scim`
                  sentinel for a provisioning token minted by something that was
                  not a person.
              owner_name: { type: string, nullable: true }
              owner_email:
                type: string
                nullable: true
                description: Resolved only when `owner_id` is a current member of this workspace.
              owner_is_member:
                type: boolean
                description: |
                  False for a bot or system credential — and, more interestingly,
                  for a token whose human owner is no longer a member. Revoking a
                  membership does not revoke that person's personal access token,
                  and that orphan is exactly what CC6.1 asks after, so it is a
                  column rather than a join the reader has to make.
              created_at: { type: string, format: date-time }
              last_used_at: { type: string, format: date-time, nullable: true }
              expires_at: { type: string, format: date-time, nullable: true }

    ScheduledExportFrequency:
      type: string
      enum: [daily, weekly, monthly]
      description: |
        How often a scheduled export runs. Not cosmetic: the scheduler derives
        the period key it deduplicates deliveries on *from* this value
        (`2026-07-31` daily, `2026-W31` weekly, `2026-07` monthly), so an unknown
        frequency would mean an undefined period and no "already delivered"
        answer.

    ScheduledExport:
      type: object
      description: |
        A standing instruction to mail one report group on a schedule
        (PRD §5.3-Reports) — the definition only; each delivery attempt is a run,
        read separately.
      required: [id, group, frequency, format, recipients, enabled, created_at, last_run_at]
      properties:
        id: { type: string, format: uuid }
        group:
          type: string
          description: A report group id — the same vocabulary `GET /reports/export?group=` uses.
        frequency: { $ref: "#/components/schemas/ScheduledExportFrequency" }
        format:
          type: string
          enum: [csv]
          description: The shape each delivery is rendered in.
        recipients:
          type: array
          items: { type: string, format: email }
          description: |
            Mailboxes each run is delivered to. Always agents of this same
            license — the destination list is bounded by the team roster, never
            free text.
        enabled:
          type: boolean
          description: Whether the scheduler picks this definition up.
        created_at: { type: string, format: date-time }
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: Last successful delivery, or `null` while none has happened.

    ScheduledExportRun:
      type: object
      description: |
        One delivery attempt of a scheduled export (PRD §5.3-Reports). The
        period is claimed before anything is mailed, so every attempt leaves one
        of these behind — failures included, with their reason.

        No recipient addresses, deliberately: `recipient_count` is how many
        mailboxes the run reached. The addresses belong to the definition, read
        under the stricter `reports_manage`.
      required:
        - id
        - period_key
        - period_from
        - period_to
        - status
        - row_count
        - recipient_count
        - error
        - created_at
      properties:
        id: { type: string, format: uuid }
        period_key:
          type: string
          description: |
            The period covered, as the deterministic label the single-delivery
            claim is keyed on: `2026-07-31` (daily), `2026-W31` (weekly),
            `2026-07` (monthly).
        period_from: { type: string, format: date-time }
        period_to: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, delivered, failed]
          description: |
            `pending` is a claimed period not yet resolved — normally a flash,
            but a process killed mid-delivery leaves one, and the history says
            so rather than pretending the run never happened. `failed` keeps its
            period: an unrecallable e-mail is not re-sent on the guess that the
            first one never left.
        row_count:
          type: integer
          description: Data rows in the CSV that was sent, excluding the header.
        recipient_count:
          type: integer
          description: Mailboxes the run actually reached — not the number configured.
        error:
          type: string
          nullable: true
          description: "Why the delivery failed: one bounded, sanitised line, or `null`."
        created_at:
          type: string
          format: date-time
          description: When the period was claimed — i.e. when the attempt started.

    CsatSummary:
      type: object
      description: |
        A satisfaction tally over some span: the donut's `good` / `bad` counts,
        their total `responses`, and `score` = good / responses. `score` is `null`
        (not `0`) when `responses` is 0 — an unrated span is unknown, not a zero.
      required: [good, bad, responses, score]
      properties:
        good: { type: integer }
        bad: { type: integer }
        responses:
          type: integer
          description: good + bad — how many ratings the span had.
        score:
          type: number
          nullable: true
          description: good / responses, rounded to three decimals. Null when unrated.

    CustomerChatState:
      type: object
      required: [online, customer, chat, events]
      properties:
        online:
          type: boolean
          description: Whether any agent is currently accepting chats.
        customer:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            email: { type: string, nullable: true }
        agent:
          type: object
          nullable: true
          description: |
            Who the visitor is talking to, for the widget header (FR-MOD-11.3): a
            human assignee if there is one, otherwise the active AI persona. Null
            until either exists.
          required: [name]
          properties:
            name: { type: string }
            avatar_url: { type: string, nullable: true }
        agent_typing:
          type: boolean
          description: |
            Whether an agent is currently typing a reply (FR-MOD-02.9). The widget
            polls rather than holding a socket, so this is how the agent's live
            typing reaches the visitor. Reflects a short-lived flag the RTM gateway
            refreshes on each keystroke; false once it lapses.
        chat:
          type: object
          nullable: true
          required: [id]
          properties:
            id: { type: string }
            thread_id: { type: string, nullable: true }
            queue_position: { type: integer, nullable: true }
        events:
          type: array
          description: Customer-visible events only. Internal notes never appear.
          items: { $ref: "#/components/schemas/Event" }

    TrackSaleRequest:
      type: object
      description: |
        One completed order, as the widget snippet reports it (FR-MOD-13.5).

        Deliberately three fields. Everything else the record needs — which
        workspace, which visitor, which conversation — is derived server-side
        from the customer token, because the caller is a page in the visitor's
        browser and anything it can name it can also forge.

        Unknown properties are ignored rather than rejected, which is what makes
        a `license_id` sent by a hostile page a no-op instead of an error worth
        probing. A typo in one of the three fields below is still a 400: all
        three are required, so a mistyped name leaves a required field missing.
      required: [external_order_id, amount_cents, currency]
      properties:
        external_order_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:#/-]+$"
          description: >-
            The merchant's own order reference. The idempotency key: reporting
            the same one twice records one sale, not two.
        amount_cents:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000000
          description: >-
            Order total in minor units (cents). An integer so no rounding
            happens between the shop and the report. Zero is allowed — a fully
            discounted order is still a conversion.
        currency:
          $ref: "#/components/schemas/SalesTrackerCurrency"

    TrackedSale:
      type: object
      description: |
        A recorded order (`tracked_sales`). `attributed` is the field the report
        divides on: an unattributed sale still counts toward total revenue, but
        only an attributed one is revenue chat can be credited for.
      required: [id, external_order_id, amount_cents, currency, attributed, chat_id, created_at]
      properties:
        id: { type: string, format: uuid }
        external_order_id: { type: string }
        amount_cents: { type: integer, format: int32 }
        currency:
          $ref: "#/components/schemas/SalesTrackerCurrency"
        attributed:
          type: boolean
          description: >-
            Whether the visitor had a conversation inside the workspace's
            attribution window before this order.
        chat_id:
          type: string
          nullable: true
          description: The conversation credited with the sale, or null when there is none.
        created_at: { type: string, format: date-time }

    CustomerMessageResult:
      type: object
      required: [chat_id]
      properties:
        chat_id: { type: string }
        queue_position: { type: integer, nullable: true }
        event:
          oneOf:
            - $ref: "#/components/schemas/Event"
            - type: "null"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message, request_id]
          properties:
            type:
              $ref: "#/components/schemas/ErrorType"
            message:
              type: string
              description: Human-readable; never contains secrets or raw SQL.
            request_id:
              type: string
              description: Correlates with server logs and traces.
            details:
              type: object
              additionalProperties: true

    ErrorType:
      type: string
      description: Machine-readable error category (v2-03 §1.8).
      enum:
        - authentication
        - authorization
        - brand_exists
        - brand_not_found
        - chat_anonymized
        - chat_inactive
        - customer_banned
        - greeting_not_found
        - group_not_found
        - group_offline
        - group_unavailable
        - groups_offline
        - internal
        - license_expired
        - limit_reached
        - message_rejected
        - misdirected_request
        - not_allowed
        - not_found
        - pending_requests_limit_reached
        - request_timeout
        - service_unavailable
        - takeover_conflict
        - too_many_requests
        - unsupported_version
        - users_limit_reached
        - validation
        - website_exists
        - wrong_product_version

  responses:
    BadRequest:
      description: Malformed or failing validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed or expired credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but lacking the required scope or role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        Resource does not exist, or exists in another tenant. Both cases return
        404 so IDs cannot be enumerated (NFR-S5).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with current resource state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MisdirectedRequest:
      description: |
        This deployment does not serve the region the workspace lives in
        (NFR-C4). Nothing is wrong with the credential and no permission is
        missing; `error.details.region` names the region to retry against.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PaymentRequired:
      description: |
        The trial has expired and the workspace is read-only (ADR-10). Reads
        still succeed and nothing has been deleted; writes resume on subscribing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the caller may retry.
          schema: { type: integer }
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          description: Unix timestamp (seconds) when the window resets.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  parameters:
    PageId:
      name: page_id
      in: query
      required: false
      description: Opaque keyset cursor from the previous page.
      schema: { type: string }
    ChatId:
      name: chatId
      in: path
      required: true
      description: Short base32 chat token.
      schema: { type: string, minLength: 10, maxLength: 12 }
    ChannelTypePath:
      name: type
      in: path
      required: true
      description: The adapter channel.
      schema: { $ref: "#/components/schemas/ChannelType" }
    BrandHeader:
      name: X-Nexa-Brand
      in: header
      required: false
      description: |
        Scope the request to one brand of the caller's license (Multibrand,
        PRD §5.3 · NFR-S4). Omitted means every brand of the license — the
        single-brand default, so a workspace that never uses Multibrand is
        unaffected. A brand id that is not one of the caller's own is answered
        404, never 403, so brand ids stay un-enumerable across licenses (NFR-S5).
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    BenchmarkBaseline:
      name: baseline
      in: query
      required: false
      description: |
        Which of **this license's own** past windows the report is benchmarked
        against (FR-MOD-07.7 "benchmark comparison"). Defaults to
        `previous_period`, the comparison the Overview and Reviews reports made
        before this parameter existed, so omitting it changes nothing.

        - `previous_period` — the equal-length window immediately before the
          requested one, ending a millisecond short of `from` so no instant
          falls in both.
        - `previous_year` — the same window shifted back 365 days: the
          comparison for a seasonal figure, where the period immediately before
          is the wrong yardstick. A fixed 365 days rather than calendar-year
          arithmetic, so a leap day cannot make the two windows different
          lengths.

        There is deliberately **no** cross-license baseline — no industry
        average, peer cohort or anonymised pool. Every report figure comes from
        a license-scoped query under RLS (NFR-S4); a benchmark against other
        licenses would have to read rows this tenant may not see, and
        aggregation does not make that safe when the cohort can be narrowed to
        one. An unrecognised value is a 400, not a silent fallback, so
        `baseline=industry` fails loudly rather than appearing supported.
      schema: { type: string, enum: [previous_period, previous_year] }
    ReportRangeFrom:
      name: from
      in: query
      required: false
      description: |
        Start of the reporting window. Defaults to 30 days before `to`.

        **A report covers at most 366 days.** A wider `from`/`to` span is a 400,
        not a slow request (NFR-P7): the "heavy reports" answer the PRD gives is
        a read replica or a column-store analytics warehouse, neither of which
        this deployment has, so the window a single query may scan is bounded
        instead. 366 rather than 365 so a twelve-month window that spans a leap
        day is not the one that fails. The limit applies to the group endpoints
        and to `/reports/export` alike — both run the same aggregation, so
        capping only the download would leave the identical scan one query
        string away.
      schema: { type: string, format: date-time }
    ReportRangeTo:
      name: to
      in: query
      required: false
      description: |
        End of the reporting window. Defaults to now. The 366-day span limit
        described on `from` is measured across this pair.
      schema: { type: string, format: date-time }

security:
  - bearerAuth: []
  - basicPat: []
