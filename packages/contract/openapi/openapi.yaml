        ]
      properties:
        ai_agent_id: { type: string, format: uuid }
        draft_revision: { type: integer, minimum: 0 }
        active: { type: boolean, description: False — the agent is paused. }
        published:
          allOf: [{ $ref: "#/components/schemas/AiConfigVersion" }]
          nullable: true
        open:
          allOf: [{ $ref: "#/components/schemas/AiConfigVersion" }]
          nullable: true
          description: The version awaiting review or its time, if there is one.
        ok: { type: boolean, description: The draft compiles and holds. }
        problems:
          type: array
          items: { $ref: "#/components/schemas/AiConfigFinding" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/AiConfigFinding" }
        diff:
          allOf: [{ $ref: "#/components/schemas/AiConfigDiffSummary" }]
          nullable: true
          description: Against the published version; null when the draft does not compile.
        compliance_gate: { $ref: "#/components/schemas/AiComplianceGate" }
        submittable: { type: boolean }

    AiConfigSubmitRequest:
      type: object
      additionalProperties: false
      required: [ai_agent_id]
      properties:
        ai_agent_id: { type: string, format: uuid }
        note: { type: string, maxLength: 2000 }

    AiConfigSubmission:
      type: object
      required: [version, warnings, replaced_version_ids]
      properties:
        version: { $ref: "#/components/schemas/AiConfigVersion" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/AiConfigFinding" }
        replaced_version_ids:
          type: array
          items: { type: string, format: uuid }
          description: The open version the submission rejected, if there was one.

    AiConfigApproveRequest:
      type: object
      additionalProperties: false
      properties:
        publish_at:
          type: string
          format: date-time
          description: Publish then — in the future, at most 30 days ahead; absent, now.
        note: { type: string, maxLength: 2000 }

    AiConfigNoteRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 2000 }

    AiPauseRequest:
      type: object
      additionalProperties: false
      required: [ai_agent_id]
      properties:
        ai_agent_id: { type: string, format: uuid }
        note: { type: string, maxLength: 2000 }

    AiPauseState:
      type: object
      required: [ai_agent_id, active]
      properties:
        ai_agent_id: { type: string, format: uuid }
        active: { type: boolean }

    AiUnresolvedSettings:
      type: object
      required: [spike_threshold, default_threshold, window_minutes, min_threshold, max_threshold]
      properties:
        spike_threshold: { type: integer }
        default_threshold: { type: integer }
        window_minutes: { type: integer }
        min_threshold: { type: integer }
        max_threshold: { type: integer }

    AiUnresolvedSettingsInput:
      type: object
      additionalProperties: false
      required: [spike_threshold]
      properties:
        spike_threshold: { type: integer, minimum: 5, maximum: 1000 }

    SkillLogEntry:
      type: object
      required: [step, detail, ok]
      properties:
        step: { type: string }
        detail: { type: string }
        ok: { type: boolean }

    SkillRun:
      type: object
      required: [id, status, ran_at, log]
      properties:
        id: { type: string, format: uuid }
        chat_id:
          type: string
          nullable: true
          description: "The member's day that set the run off. Panelde: Thread ID (günlük)."
        thread_id:
          type: string
          nullable: true
          maxLength: 12
          description: |
            The connection inside that day (`skill_runs.thread_id`, tm 288). Null for
            a run recorded before it was kept. Panelde: Chat ID (bağlantı).
        status:
          type: string
          enum: [succeeded, failed, aborted]
          description: Whether the run completed — not what it did to the chat.
        outcome:
          type: string
          nullable: true
          enum: [answered, handed_off, skipped, null]
        ran_at: { type: string, format: date-time }
        log:
          type: array
          items: { $ref: "#/components/schemas/SkillLogEntry" }

    KnowledgeAudience:
      type: string
      enum: [ai_agent, copilot]
      description: |
        Who may use a piece of knowledge (tm 309 · AI-14, `@siyahtus/types`
        `KNOWLEDGE_AUDIENCES`): `ai_agent` — every answer the AI agent gives a
        player, previews included — and `copilot`, the agents' assistant.
        Copilot uses whatever either audience names; knowledge for `copilot`
        alone is for agents only and never reaches a player.

    KnowledgeSource:
      type: object
      description: |
        A source in the workspace's knowledge store — one store for what the
        AI agent answers players from and what Copilot drafts replies from
        (tm 309 · AI-14, owner decision K11; `docs/adr/single-knowledge-store.md`).
        "Copilot's own knowledge" (FR-MOD-12.2) is the store's sources that are
        for agents only; none of them ever reaches a player.

        Who a source is for is its `audiences`, `ai_agent_ids`, `brand_ids`
        and `valid_until` (tm 309.2): the AI agent answers a player only from
        a source whose audiences name `ai_agent`, that is for its agent (or
        every agent) and for the conversation's brand (or every brand) — a
        conversation whose brand is not known reads the every-brand sources
        only — and that has not ended. Copilot drafts from every audience,
        narrowed by the conversation's brand the same way.
      required: [id, name, type, status, chunk_count]
      properties:
        id: { type: string, format: uuid }
        ai_agent_id:
          type: string
          format: uuid
          description: |
            The agent record the source is filed under — kept for the apps
            that read it. Since tm 309.2 it follows the source's scope rather
            than deciding it: a source for agents only is filed under the
            Copilot record, any other under its first AI agent (or the
            workspace's oldest). Who uses the source is `audiences` and
            `ai_agent_ids`.
        name: { type: string }
        type: { type: string, enum: [website, file, article, faq] }
        status:
          type: string
          description: |
            `ready` — indexed; `empty` — indexed to nothing; `indexing` —
            text waiting to be indexed; `crawling` — a website's crawl job
            is under way (`job_id`); `partial` — the last crawl finished
            with pages that failed (its pages list says which); `processing`
            — a PDF or Word document's `document` job is reading it
            (`job_id`); `failed`.
        source_url:
          { type: string, nullable: true, description: The crawled URL, for website sources. }
        crawl_scope:
          allOf: [{ $ref: "#/components/schemas/CrawlScope" }]
          nullable: true
          description: |
            How far the website is crawled (tm 312 · AI-17); null for the
            other types.
        page_limit:
          type: integer
          nullable: true
          minimum: 1
          maximum: 200
          description: The most pages one crawl keeps; null for the other types.
        include_paths:
          type: array
          items: { type: string }
          description: Path prefixes the crawl keeps to; empty — every path.
        exclude_paths:
          type: array
          items: { type: string }
          description: Path prefixes the crawl leaves out.
        last_crawled_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the last crawl job finished, whatever came of it; null until
            one has (a website crawled in the request before tm 312.3 has
            none).
        page_count:
          type: integer
          minimum: 0
          description: |
            Pages the last crawl left in the store (`ok` + `unchanged`); a
            PDF or Word document's page count once read (0 until then); 0 for
            the other types.
        file_mime:
          allOf: [{ $ref: "#/components/schemas/KnowledgeDocumentMimeType" }]
          nullable: true
          description: |
            A PDF or Word document source's type, as read from its bytes
            (tm 313 · AI-18); null for every other source — a text file
            uploaded through `POST /knowledge-sources/file` keeps no
            original. Its original is `GET /knowledge-sources/{sourceId}/file`.
        file_size:
          type: integer
          nullable: true
          minimum: 1
          description: The original's length in bytes; null when there is none.
        file_sha256:
          type: string
          nullable: true
          pattern: "^[0-9a-f]{64}$"
          description: |
            The original's sha256, hex; null when there is none. A workspace
            holds one source per file (`knowledge_source_exists`).
        job_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The source's job under way (`queued`, `running` or
            `waiting_budget`) — follow it at `GET /knowledge-jobs/{jobId}`;
            null when there is none.
        chunk_count: { type: integer }
        updated_at: { type: string, format: date-time }
        added_by_name:
          type: string
          nullable: true
          description: |
            The account name of whoever added this source, resolved server-side
            from the soft `added_by` reference — never a raw account id. Null
            for a source with no known author (bot/seed-created, or the
            authoring account was later deleted). Not present on
            `/copilot/knowledge`, the older, narrower view of the agents-only
            sources (see its `deprecated` note).
        language:
          type: string
          nullable: true
          pattern: "^[a-z]{2,3}$"
          description: |
            The language the source is written in, as a primary language
            subtag (`tr`, `en`); null when nobody said (tm 309.1). A label for
            now — retrieval does not filter on it. Not present on
            `/copilot/knowledge`, like every field below.
        owner_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The member who keeps this source true — the person a due review
            falls to (AI-14). Null for an unowned source, which the panel shows
            as such. A meta field: it changes nothing the AI says.
        owner_name:
          type: string
          nullable: true
          description: |
            `owner_id`'s account name, resolved like `added_by_name`. Null when
            there is no owner or the account is no longer a member.
        reviewed_at:
          type: string
          format: date-time
          description: |
            When a person last confirmed the source is still right (AI-14-S3;
            `POST /knowledge-sources/{sourceId}/review`). A new source is
            reviewed when it is added; a source older than the review step
            counts its last edit. An automatic re-crawl is not a review.
        review_interval_days:
          type: integer
          minimum: 1
          maximum: 365
          description: How many days a review holds before the source is due another (default 90).
        review_due_at:
          type: string
          format: date-time
          description: |
            `reviewed_at` plus `review_interval_days` whole days. Past it the
            source needs a review — the panel warns, and `?stale=true` lists it.
            A source due a review still answers; it is not taken out of
            retrieval for it.
        refresh_after_days:
          type: integer
          nullable: true
          description: |
            How often, in days, this source should be automatically re-crawled
            (FR-MOD-06.3.3). Only meaningful for a `website` source — always
            null for the other three types, since there is nothing to re-fetch.
            Null means automatic refresh is off, which is every source's
            behaviour before this field existed.
        next_refresh_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the freshness sweep will next attempt this source. Null
            whenever `refresh_after_days` is null. Recomputed from `now` every
            time the source is actually refreshed — an edit, a manual reindex,
            or the sweep itself — so it is a forecast, not a deadline the sweep
            must hit exactly.
        last_refresh_error:
          type: string
          nullable: true
          description: |
            Why the most recent refresh attempt failed, if it did — set by the
            freshness sweep, cleared on its next success. A failed refresh
            never changes `content` or `chunk_count`: the stale answer is kept
            rather than replaced with none, so this field is a status to read,
            not a sign that anything was lost. A KB article's source
            (`kb_article_id`) is the exception, for the article has already
            changed: its new text that could not be indexed yet leaves it
            `indexing` with no chunks, and this says why, until the hourly
            sweep indexes it (tm 309.2). A PDF or Word document's source
            (`file_mime`) says why its `document` job could not read it
            (tm 313.3): one of `encrypted`, `no_text_layer`, `too_many_pages`,
            `too_many_characters`, `parse_timeout`, `parse_failed`,
            `unsupported_type`, `file_too_large`, or the residency sentence a
            crawl refused for the same reason gets; a source that already had
            chunks keeps them (`partial`).
        audiences:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/KnowledgeAudience" }
          description: |
            Who may use the source (tm 309 · AI-14): `ai_agent` — the AI
            agent's answers to players — and/or `copilot`. `[copilot]` alone
            is for agents only and never reaches a player. Kept in
            `[ai_agent, copilot]` order without repeats; never empty.
        ai_agent_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            The AI agents the source is for; empty — every one. Read only by
            the AI agent's search; Copilot is never narrowed by it.
        brand_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            The brands whose conversations may use the source; empty — every
            brand. A conversation whose brand is not known uses the
            every-brand sources only, so a brand's own rule never reaches
            another brand's player.
        valid_until:
          type: string
          format: date-time
          nullable: true
          description: |
            Past this moment the source answers nothing — the one date that
            takes a source out of retrieval (a due review only warns). Null —
            no end.
        kb_article_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The published KB article this source mirrors (AI-14-S2): its title,
            text and audiences are the article's, for every AI agent and brand
            with no end, and it goes when the article is unpublished, its AI
            audiences are switched off or it is deleted. Edit those through
            the article; only the meta fields are edited here. Null for every
            other source.

    CrawlScope:
      type: string
      enum: [single, all, sitemap]
      description: |
        How far a website source's crawl reaches (tm 312 · AI-17,
        `@siyahtus/types` `CRAWL_SCOPES`): `single` — the URL given and
        nothing else; `all` — every page under it, from its sitemap or, with
        none, by following links (depth 3); `sitemap` — the pages its sitemap
        lists. Always the same host and below the URL's path, within
        `include_paths`/`exclude_paths`, robots.txt and `page_limit`.

    KnowledgePageStatus:
      type: string
      enum: [ok, unchanged, skipped_scope, robots_disallowed, blocked, needs_js, error, removed]
      description: |
        What became of one crawled page (`KNOWLEDGE_PAGE_STATUSES`): `ok` —
        fetched and indexed; `unchanged` — same text as the last crawl, not
        embedded again; `skipped_scope` — outside the scope or path lists;
        `robots_disallowed` — robots.txt forbids it, never fetched; `blocked`
        — a bot wall; `needs_js` — its text is drawn by JavaScript, which the
        crawler does not run; `error` — the fetch failed (`error` says why);
        `removed` — gone (two 404/410 in a row) or out of scope since, its
        chunks deleted. Only `ok` and `unchanged` pages answer.

    KnowledgePage:
      type: object
      description: One page of a website source's crawl (tm 312 · AI-17).
      required: [id, url, status, chunk_count]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, description: The page's URL in its normalised spelling. }
        title: { type: string, nullable: true }
        lang:
          type: string
          nullable: true
          pattern: "^[a-z]{2,3}$"
          description: The page's `<html lang>`, as a primary subtag.
        status: { $ref: "#/components/schemas/KnowledgePageStatus" }
        http_status: { type: integer, nullable: true }
        error:
          type: string
          nullable: true
          description: |
            A snake_case code saying why the page is `error` or `blocked`
            (`fetch_timeout`, `too_large`, `ssrf_refused`…) — the panel words it.
        depth: { type: integer, minimum: 0, description: Links from the start URL. }
        chunk_count: { type: integer, minimum: 0 }
        fetched_at: { type: string, format: date-time, nullable: true }
        changed_at:
          type: string
          format: date-time
          nullable: true
          description: When the page's text last changed — the "review what changed" list.

    KnowledgeJobKind:
      type: string
      enum: [crawl, refresh, document]
      description: |
        `crawl` — a website's first or a manual crawl; `refresh` — the
        freshness sweep's re-crawl; `document` — a large document's parse and
        index (AI-18).

    KnowledgeJobStatus:
      type: string
      enum: [queued, running, waiting_budget, done, failed, cancelled]
      description: |
        `queued` → `running` → `done` | `failed`; `waiting_budget` — the
        day's AI allowance ran out mid-job, it resumes after UTC midnight from
        where it stopped, the pages indexed so far already answering;
        `cancelled` by a person. A source has at most one job under way
        (`queued`, `running`, `waiting_budget`).

    KnowledgeJob:
      type: object
      description: |
        A knowledge job (tm 312 · AI-17), worked through in the background —
        the panel polls it for a crawl's progress.
      required: [id, source_id, kind, status, pages, created_at]
      properties:
        id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/KnowledgeJobKind" }
        status: { $ref: "#/components/schemas/KnowledgeJobStatus" }
        pages:
          type: object
          description: |
            Progress. `discovered` grows as the crawl finds pages;
            `done` = `ok` + `unchanged` + `skipped` + `failed` + `removed`.
          required: [discovered, done, ok, unchanged, skipped, failed, removed]
          properties:
            discovered: { type: integer, minimum: 0 }
            done: { type: integer, minimum: 0 }
            ok: { type: integer, minimum: 0 }
            unchanged: { type: integer, minimum: 0 }
            skipped:
              type: integer
              minimum: 0
              description: "`skipped_scope` and `robots_disallowed` pages."
            failed:
              type: integer
              minimum: 0
              description: "`error`, `blocked` and `needs_js` pages."
            removed: { type: integer, minimum: 0 }
        error:
          type: string
          nullable: true
          description: |
            A snake_case code — why the job failed or stopped. A `document`
            job's are `KnowledgeDocumentError`'s.
        available_at:
          type: string
          format: date-time
          description: A `waiting_budget` job resumes at this moment (UTC midnight).
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    KnowledgeDocumentMimeType:
      type: string
      enum:
        - application/pdf
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      description: |
        The types a knowledge document may be (tm 313 · AI-18,
        `@siyahtus/types` `KNOWLEDGE_DOCUMENT_MIME_TYPES`): PDF and DOCX. A
        `.docm` (a Word document with a macro project) is not one.

    KnowledgeDocumentError:
      type: string
      enum:
        - unsupported_type
        - file_too_large
        - virus_detected
        - encrypted
        - no_text_layer
        - too_many_pages
        - too_many_characters
        - parse_timeout
        - parse_failed
      description: |
        Why a PDF or Word document was refused (`KNOWLEDGE_DOCUMENT_ERRORS`).
        `unsupported_type` (the bytes are not a PDF or a DOCX, or not the
        type declared), `file_too_large` (past 20 MiB) and `virus_detected`
        refuse the upload or the source with a 400 (`details.reason`),
        nothing stored. The rest end its `document` job (`KnowledgeJob.error`)
        with nothing written to the knowledge base: `encrypted` — a
        password-protected PDF; `no_text_layer` — no text to read, most likely
        a scanned document (there is no OCR); `too_many_pages` (past 300),
        `too_many_characters` (past 1,000,000); `parse_timeout` — reading it
        took longer than 30 seconds or more than 256 MB; `parse_failed` — the
        file is damaged.

    KnowledgeFileLink:
      type: object
      description: |
        A short-lived link to a document source's original (tm 313 ·
        AI-18-S2). `url` needs no session and stops working at `expires_at`.
      required: [url, expires_at, filename, content_type, size_bytes]
      properties:
        url:
          type: string
          description: The signed `GET /knowledge-files/{key}` link, relative to the API's origin.
        expires_at: { type: string, format: date-time }
        filename: { type: string, description: The name the file is saved as. }
        content_type: { $ref: "#/components/schemas/KnowledgeDocumentMimeType" }
        size_bytes: { type: integer, minimum: 1 }

    KnowledgeBulkRowResult:
      type: object
      description: |
        One CSV data row's verdict. `line` is the row's 1-based position among
        data rows, not a physical line in the file — a quoted cell may span
        several lines, which makes a file line number ambiguous.
      required: [line, name, type, status, id, chunk_count, error, added_by_name]
      properties:
        line: { type: integer, minimum: 1 }
        name:
          type: string
          nullable: true
          description: |
            The row's title. For a skipped row this echoes the raw cell
            (truncated) so the admin can find the row in their spreadsheet;
            null when the row has no name cell to echo.
        type:
          type: string
          nullable: true
          description: The row's `type` cell — the validated value when it parsed, the raw cell otherwise.
        status:
          type: string
          enum: [imported, skipped]
          description: |
            In a dry run `imported` means "would be imported" — nothing was
            written. `dry_run` on the envelope is what distinguishes the two.
        id:
          type: string
          format: uuid
          nullable: true
          description: The created source. Null for a skipped row and for every row of a dry run.
        chunk_count:
          type: integer
          nullable: true
          description: Chunks indexed from this row. Null for a skipped row and for every row of a dry run.
        error:
          type: string
          nullable: true
          description: |
            Why the row was skipped, naming the field at fault. Null for an
            imported row.

            A `website` row is the one exception to "naming the reason": every
            refused URL — malformed, loopback, link-local, credentialled, or
            simply past the import's shared crawl budget — comes back under
            `source_url` with one of three fixed sentences, none of which names
            a host, an address or a network. Told apart across 200 rows, a
            precise reason would be a free scan of everything the server can
            reach; the precise reason is in the server log instead.
        added_by_name:
          type: string
          nullable: true
          description: |
            The account name of whoever ran this import, resolved the same way
            `KnowledgeSource.added_by_name` is — never a raw account id. Null
            for a skipped row and for every row of a dry run, mirroring `id`
            and `chunk_count`: it names the source that was actually created,
            not the row that asked for one.

    KnowledgeBulkResult:
      type: object
      required: [imported, failed, dry_run, results]
      properties:
        imported:
          { type: integer, description: Rows written (or, in a dry run, rows that would be). }
        failed: { type: integer }
        dry_run: { type: boolean, description: True when nothing was written. }
        results:
          type: array
          description: One entry per data row, in file order.
          items: { $ref: "#/components/schemas/KnowledgeBulkRowResult" }

    # ---------------------------------------------------------------------
    # Structured knowledge tables + access information (tm 310 · AI-13, K13)
    # ---------------------------------------------------------------------
    # The vocabulary is `@siyahtus/types` `knowledge-tables.ts`;
    # `knowledge-tables-schema.test.ts` reads these enums back against it.

    KnowledgeTableSegment:
      type: string
      description: |
        Which structured table (AI-13-S1: four fixed tables), as its URL
        segment (`KNOWLEDGE_TABLE_PATH_SEGMENTS`): payment methods, bonuses,
        KYC documents, limits and rules.
      enum: [payment-methods, bonuses, kyc-documents, rules]

    KnowledgeTableRowSource:
      type: string
      description: |
        Who filled the row: a person, an integration (F2) — whose rows are
        not edited by hand — or a template pack (`sample`, AI-15): an "örnek
        — doğrulayın" row the AI does not use until a person edits or reviews
        it, which makes it `manual`.
      enum: [manual, integration, sample]

    KnowledgeTableProblem:
      type: object
      description: |
        One refused field of a row (`validateKnowledgeTableRow`). `field` is a
        path (`aliases[2]`, `working_hours.windows[0].end`); `taken` — another
        row of an overlapping brand scope (and, for a payment method, the same
        direction) already answers to the name.
      required: [field, code]
      properties:
        field: { type: string }
        code:
          type: string
          enum:
            [
              required,
              invalid,
              too_long,
              too_many,
              out_of_range,
              repeated,
              min_above_max,
              delay_below_expected,
              window_overlap,
              wagering_base_required,
              promo_code_required,
              active_to_before_from,
              value_required,
              taken,
            ]

    KnowledgeTableRowMeta:
      type: object
      description: |
        What every structured-table row carries besides its fields. A row is
        due a review `review_interval_days` after `reviewed_at` (payment
        methods 14, bonuses 30 and at `active_to`, KYC and rules 90 —
        AI-13-S2); a stale row is warned about and still used. These are meta
        fields: changing them does not change what the AI says (ADR-14b §2.2).
      required:
        [
          id,
          brand_ids,
          owner_id,
          reviewed_at,
          review_interval_days,
          review_due_at,
          stale,
          source,
          created_by,
          updated_by,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        brand_ids:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
          description: |
            The brands the row is for; empty for every brand. A brand's own
            row beats the every-brand row with the same name (AI-13 §5); a
            conversation whose brand is not known reads every-brand rows only.
        owner_id: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time }
        review_interval_days: { type: integer, minimum: 1, maximum: 365 }
        review_due_at:
          type: string
          format: date-time
          description: When the row falls due — for a bonus, its campaign end if that is sooner.
        stale: { type: boolean, description: Past `review_due_at`. }
        source: { $ref: "#/components/schemas/KnowledgeTableRowSource" }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KnowledgeTableRowMetaWrite:
      type: object
      description: The meta fields a row is written with; the rest are the server's.
      properties:
        brand_ids:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        owner_id: { type: string, format: uuid, nullable: true }
        review_interval_days:
          type: integer
          minimum: 1
          maximum: 365
          description: Defaults to the table's (14 · 30 · 90 · 90).

    PaymentWorkingWindow:
      type: object
      required: [day, start, end]
      properties:
        day:
          type: string
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        start: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        end:
          type: string
          pattern: "^(([01]\\d|2[0-3]):[0-5]\\d|24:00)$"
          description: After `start`; `24:00` is the end of the day.

    PaymentWorkingHours:
      type: object
      description: |
        When a method processes transactions: weekly windows in an IANA time
        zone — several a day, never overlapping — and whether it stops on bank
        holidays. Null on the row: around the clock.
      required: [timezone, windows, closed_on_bank_holidays]
      properties:
        timezone: { type: string, example: Europe/Istanbul }
        windows:
          type: array
          minItems: 1
          maxItems: 21
          items: { $ref: "#/components/schemas/PaymentWorkingWindow" }
        closed_on_bank_holidays: { type: boolean }

    PaymentCommonError:
      type: object
      required: [code, title, customer_text, agent_hint]
      properties:
        code: { type: string, pattern: "^[A-Za-z0-9_.-]{1,40}$" }
        title: { type: string, maxLength: 80 }
        customer_text: { type: string, maxLength: 1000 }
        agent_hint:
          type: string
          maxLength: 1000
          nullable: true
          description: For agents only — never part of the row's text the AI answers from.

    KbPaymentMethodFields:
      type: object
      description: |
        A payment method's fields (AI-13): what "my deposit has not arrived"
        is judged against. `min_amount ≤ max_amount`, `delay_threshold_minutes
        ≥ expected_minutes` (AI-13 §6); the reference format is chosen from a
        fixed list, never a pattern the workspace types (ReDoS).
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 60 }
          description: Other names players use ("PPR").
        direction: { type: string, enum: [deposit, withdrawal] }
        currency: { type: string, pattern: "^[A-Z]{3}$", default: TRY }
        min_amount: { type: number, minimum: 0, nullable: true }
        max_amount: { type: number, minimum: 0, nullable: true }
        expected_minutes: { type: integer, minimum: 0, maximum: 43200, nullable: true }
        delay_threshold_minutes:
          type: integer
          minimum: 0
          maximum: 43200
          nullable: true
          description: Past this many minutes a transaction counts as delayed.
        working_hours:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PaymentWorkingHours"
        requires_site_request: { type: boolean, default: false }
        reference_instructions: { type: string, maxLength: 1000, nullable: true }
        reference_format:
          type: string
          enum: [none, username, digits, alphanumeric, txid_trc20, txid_evm, phone, email]
          default: none
        receipt_required: { type: boolean, default: false }
        third_party_allowed: { type: boolean, default: false }
        networks:
          type: array
          maxItems: 10
          items: { type: string, pattern: "^[A-Za-z0-9_-]{1,20}$" }
        common_errors:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/PaymentCommonError" }
        customer_notes: { type: string, maxLength: 2000, nullable: true }
        active: { type: boolean, default: true }

    KbPaymentMethod:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMeta"
        - $ref: "#/components/schemas/KbPaymentMethodFields"
      required:
        [
          name,
          aliases,
          direction,
          currency,
          min_amount,
          max_amount,
          expected_minutes,
          delay_threshold_minutes,
          working_hours,
          requires_site_request,
          reference_instructions,
          reference_format,
          receipt_required,
          third_party_allowed,
          networks,
          common_errors,
          customer_notes,
          active,
        ]

    KbPaymentMethodCreate:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMetaWrite"
        - $ref: "#/components/schemas/KbPaymentMethodFields"
      required: [name, direction]

    KbPaymentMethodUpdate:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMetaWrite"
        - $ref: "#/components/schemas/KbPaymentMethodFields"
      minProperties: 1

    BonusContribution:
      type: object
      required: [category, percent]
      properties:
        category: { type: string, minLength: 1, maxLength: 40 }
        percent: { type: integer, minimum: 0, maximum: 100 }

    KbBonusFields:
      type: object
      description: |
        A bonus's terms (AI-13). A wagering base comes with a multiplier and
        only then; `claim_method: code` names its `promo_code`. The AI explains
        wagering with a general worked example only, never "your remaining
        wagering".
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 60 }
        type:
          type: string
          enum:
            [welcome, deposit, reload, cashback, free_spins, free_bet, loss_bonus, loyalty, other]
          default: other
        min_deposit: { type: number, minimum: 0, nullable: true }
        wagering_multiplier:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
          nullable: true
          description: Null — no wagering.
        wagering_base:
          type: string
          enum: [bonus, bonus_plus_deposit]
          nullable: true
        contributing:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/BonusContribution" }
        min_odds: { type: number, minimum: 1, nullable: true }
        max_bet: { type: number, exclusiveMinimum: 0, nullable: true }
        max_cashout: { type: number, exclusiveMinimum: 0, nullable: true }
        validity_days: { type: integer, minimum: 1, maximum: 3650, nullable: true }
        claim_method:
          type: string
          enum: [auto, live_support, code]
          default: auto
        promo_code: { type: string, pattern: "^[A-Za-z0-9_-]{1,40}$", nullable: true }
        excluded_method_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
          description: Payment methods whose deposits do not qualify.
        active_from: { type: string, format: date-time, nullable: true }
        active_to:
          type: string
          format: date-time
          nullable: true
          description: The campaign's end; the row falls due for review then too.
        terms_text: { type: string, maxLength: 10000, nullable: true }

    KbBonus:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMeta"
        - $ref: "#/components/schemas/KbBonusFields"
      required:
        [
          name,
          aliases,
          type,
          min_deposit,
          wagering_multiplier,
          wagering_base,
          contributing,
          min_odds,
          max_bet,
          max_cashout,
          validity_days,
          claim_method,
          promo_code,
          excluded_method_ids,
          active_from,
          active_to,
          terms_text,
        ]

    KbBonusCreate:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMetaWrite"
        - $ref: "#/components/schemas/KbBonusFields"
      required: [name]

    KbBonusUpdate:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMetaWrite"
        - $ref: "#/components/schemas/KbBonusFields"
      minProperties: 1

    KbKycDocumentFields:
      type: object
      description: A KYC document the workspace asks for (AI-13).
      properties:
        doc_type:
          type: string
          minLength: 1
          maxLength: 80
          description: The document's name ("Kimlik kartı").
        acceptance_criteria:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 200 }
        when_required: { type: string, maxLength: 1000, nullable: true }
        review_hours: { type: integer, minimum: 0, maximum: 720, nullable: true }
        upload_path_text: { type: string, maxLength: 1000, nullable: true }
        chat_upload_allowed: { type: boolean, default: false }

    KbKycDocument:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMeta"
        - $ref: "#/components/schemas/KbKycDocumentFields"
      required:
        [
          doc_type,
          acceptance_criteria,
          when_required,
          review_hours,
          upload_path_text,
          chat_upload_allowed,
        ]

    KbKycDocumentCreate:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMetaWrite"
        - $ref: "#/components/schemas/KbKycDocumentFields"
      required: [doc_type]

    KbKycDocumentUpdate:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMetaWrite"
        - $ref: "#/components/schemas/KbKycDocumentFields"
      minProperties: 1

    KbRuleFields:
      type: object
      description: |
        One keyed limit or rule (AI-13). It says something: `value_text`,
        `numeric_value`, or both.
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        category:
          type: string
          enum: [limits, account, betting, withdrawal, other]
          default: other
        title: { type: string, minLength: 1, maxLength: 120 }
        value_text: { type: string, maxLength: 2000, nullable: true }
        numeric_value: { type: number, nullable: true }
        unit: { type: string, maxLength: 20, nullable: true }
        description: { type: string, maxLength: 2000, nullable: true }

    KbRule:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMeta"
        - $ref: "#/components/schemas/KbRuleFields"
      required: [key, category, title, value_text, numeric_value, unit, description]

    KbRuleCreate:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMetaWrite"
        - $ref: "#/components/schemas/KbRuleFields"
      required: [key, title]

    KbRuleUpdate:
      allOf:
        - $ref: "#/components/schemas/KnowledgeTableRowMetaWrite"
        - $ref: "#/components/schemas/KbRuleFields"
      minProperties: 1

    KnowledgeTableRow:
      description: A row of whichever table the path names.
      oneOf:
        - $ref: "#/components/schemas/KbPaymentMethod"
        - $ref: "#/components/schemas/KbBonus"
        - $ref: "#/components/schemas/KbKycDocument"
        - $ref: "#/components/schemas/KbRule"

    KnowledgeTableImportRowResult:
      type: object
      description: |
        One CSV data row's verdict (the `KnowledgeBulkRowResult` pattern):
        `line` is the 1-based position among data rows.
      required: [line, status, id, label, problems]
      properties:
        line: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [imported, skipped]
          description: In a dry run `imported` means "would be imported".
        id:
          type: string
          format: uuid
          nullable: true
          description: The created row; null when skipped and in a dry run.
        label:
          type: string
          nullable: true
          description: The row's name, document or key as the file gave it, to find it in the spreadsheet.
        problems:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeTableProblem" }
          description: Why the row was skipped; empty for an imported row.

    KnowledgeTableImportResult:
      type: object
      description: |
        A CSV import's report (AI-13 §8): valid rows are taken, invalid ones
        skipped with their problems, row by row.
      required: [imported, failed, dry_run, results]
      properties:
        imported: { type: integer }
        failed: { type: integer }
        dry_run: { type: boolean }
        results:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeTableImportRowResult" }

    AiAccessInfoSourceType:
      type: string
      description: |
        Where the access answer comes from (K13): `kb_row` — a knowledge
        source (a table row's included); `dynamic_url` — a URL fetched when
        asked, cached briefly, its last value used when a fetch fails and a
        hand-over when there is none; `fixed_link` — one link, said as it is.
      enum: [kb_row, dynamic_url, fixed_link]

    AiAccessInfo:
      type: object
      description: |
        What the AI says when a player cannot reach the site or asks for its
        current address (K13 · AI-08 G14) — only what the workspace entered;
        the workspace is responsible for it. One setting for every brand
        (`brand_id` null) and at most one per brand; a brand's own beats the
        every-brand one. Changes are kept in the AI change history (AI-21).
      required:
        [
          id,
          brand_id,
          source_type,
          kb_source_id,
          url,
          cache_seconds,
          fixed_text,
          last_value,
          last_fetched_at,
          created_by,
          updated_by,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid, nullable: true }
        source_type: { $ref: "#/components/schemas/AiAccessInfoSourceType" }
        kb_source_id:
          type: string
          format: uuid
          nullable: true
          description: The knowledge source a `kb_row` answer comes from.
        url:
          type: string
          maxLength: 2048
          nullable: true
          description: The URL a `dynamic_url` fetches (https), or the `fixed_link` itself (http or https).
        cache_seconds: { type: integer, minimum: 30, maximum: 86400 }
        fixed_text:
          type: string
          maxLength: 1000
          nullable: true
          description: What the AI says with a fixed link.
        last_value:
          type: string
          nullable: true
          description: The last value a `dynamic_url` fetch returned.
        last_fetched_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AiAccessInfoUpdate:
      type: object
      description: |
        The setting for one brand, or for every brand (`brand_id` null or
        omitted), replaced whole. `kb_row` needs `kb_source_id`; `dynamic_url`
        and `fixed_link` need `url`.
      required: [source_type]
      properties:
        brand_id: { type: string, format: uuid, nullable: true }
        source_type: { $ref: "#/components/schemas/AiAccessInfoSourceType" }
        kb_source_id: { type: string, format: uuid, nullable: true }
        url:
          type: string
          maxLength: 2048
          nullable: true
          description: https for a `dynamic_url`; http or https for a `fixed_link`.
        cache_seconds: { type: integer, minimum: 30, maximum: 86400, default: 300 }
        fixed_text: { type: string, maxLength: 1000, nullable: true }

    TrustedDomain:
      type: object
      required: [id, domain, include_subdomains, created_at]
      properties:
        id: { type: string, format: uuid }
        domain:
          type: string
          description: Hostname only — lowercased, no scheme, port or path.
        include_subdomains: { type: boolean }
        created_at: { type: string, format: date-time }

    IpAllowlistEntry:
      type: object
      description: |
        A single source permitted to reach the agent/admin panel
        (FR-MOD-08.9.6). The allow-side counterpart to a security setting's
        `banned_customer_ips` (a deny-list on the customer/widget surface): here
        a license lists the sources it trusts for its own staff. Tenant-scoped
        and closed by row level security.

        Managed through `/settings/ip-allowlist` (list, add, remove). `entry` is
        stored in canonical form, so a bare address round-trips as itself and a
        CIDR range keeps only its network bits.
      required: [id, entry, label, created_at]
      properties:
        id: { type: string, format: uuid }
        entry:
          type: string
          description: >-
            A single IPv4/IPv6 address or a CIDR range, in canonical form. A
            bare address behaves like a /32 (or /128) range.
        label:
          type: string
          nullable: true
          description: Optional human label for the entry, e.g. `Office VPN`.
        created_at: { type: string, format: date-time }

    SsoAttributeMapping:
      type: object
      description: |
        Which assertion attribute carries which account field, e.g.
        `{"email": "urn:oid:0.9.2342.19200300.100.1.3"}`.

        The set of account fields an assertion may fill is fixed — an assertion
        is signed by a party outside this system, so the columns it can reach
        are bounded here rather than inferred from whatever attribute names an
        IdP sends. An unset key is not a default: it means the connection did
        not say, and the resolver decides what to fall back to.
      additionalProperties: false
      properties:
        email: { type: string }
        name: { type: string }

    PublicSsoConnection:
      type: object
      description: |
        The anonymous face of an SSO connection (NFR-S11 · S11-i) — the two
        things a browser needs to start a login it did not choose, and nothing
        else. No certificate, no IdP URL, no entity id: those describe the trust
        anchor and belong to the authenticated admin view (`SsoConnection`).
      required: [id, organization_name, client_id]
      properties:
        id: { type: string, format: uuid }
        organization_name:
          type: string
          nullable: true
          description: The workspace this connection signs in to, so a screen can name it.
        client_id:
          type: string
          nullable: true
          description: |
            The OAuth client to start the login with. `null` when the workspace
            registers none or more than one — the caller must then be told which
            to use rather than have one guessed for it.

    SsoConnection:
      type: object
      description: |
        One SAML 2.0 identity provider a workspace federates sign-in to
        (NFR-S11). Tenant-scoped and closed by row level security.

        Configuration only at this stage: the row records who the IdP is and how
        to reach it. Nothing consumes it to authenticate anyone yet — no
        assertion is accepted and no session is minted from one.

        `idp_certificate_pem` is returned in full on purpose. It is the IdP's
        *public* signing certificate — what an admin compares against their IdP
        console to confirm a rotation landed — so redacting it would hide the one
        field a misconfiguration is diagnosed from while protecting nothing.
      required:
        [
          id,
          name,
          idp_entity_id,
          idp_sso_url,
          idp_certificate_pem,
          previous_certificate_pem,
          previous_certificate_expires_at,
          verified_domains,
          domains,
          attribute_mapping,
          allow_idp_initiated,
          enabled,
          enforced,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: Human label for the connection, e.g. `Okta (corp)`.
        idp_entity_id:
          type: string
          description: The IdP's SAML EntityID — what an assertion's `Issuer` must equal.
        idp_sso_url:
          type: string
          format: uri
          description: Absolute `http(s)` URL an AuthnRequest is sent to (HTTP-Redirect binding).
        idp_certificate_pem:
          type: string
          description: The IdP's public signing certificate, PEM-encoded. Not a secret.
        previous_certificate_pem:
          type: string
          nullable: true
          description: >-
            The certificate this connection was rotated away from, still trusted
            until `previous_certificate_expires_at`. Null unless the rotation
            asked to bridge an IdP key roll — replacing a certificate revokes the
            old one at once by default, because the rotation that matters most is
            the one answering a compromise. Reported only while the window is
            open: a lapsed overlap reads as no overlap.
        previous_certificate_expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the overlap stops being trusted. Null when there is none.
        verified_domains:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 253 }
          description: >-
            The domains this connection may actually provision from: the subset
            of `domains` whose ownership has been proved. Just-in-time
            provisioning — SAML sign-in and the workspace's SCIM connector alike
            — may only create an account or a membership for an address inside
            them, so a workspace's own IdP cannot adopt a stranger's account or
            occupy the address of somebody who never signed up. Stored lowercase
            and matched exactly, never by suffix: proving `acme.test` says
            nothing about `mail.acme.test`. An empty list provisions nobody.


            A domain a workspace has merely *claimed* is not here. That is the
            whole of PLAN §D134: the claim list is written by the workspace about
            itself, so on its own it is an assertion rather than a fact.
        domains:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/SsoDomain" }
          description: >-
            Every domain claimed by this connection, proved or not, in the order
            the workspace wrote them. Writing `verified_domains` on `POST`/`PATCH`
            replaces this list; a domain added here starts unproved and one
            removed loses its proof.
        attribute_mapping: { $ref: "#/components/schemas/SsoAttributeMapping" }
        allow_idp_initiated:
          type: boolean
          description: >-
            Whether an assertion the IdP sends unsolicited is accepted. False by
            default — an IdP-initiated flow gives up the `InResponseTo` binding
            that makes replay detectable, so it is a choice, never inherited.
        enabled:
          type: boolean
          description: Whether sign-in through this connection is live.
        enforced:
          type: boolean
          description: >-
            Whether this connection is the *only* way into the workspace:
            password sign-in is refused for the license while this and `enabled`
            are both true. Reported as stored, so a connection that is required
            but switched off is visible as exactly that — and it enforces
            nothing, which is how a workspace whose IdP has broken gets its
            password door back. The workspace's owners keep theirs regardless,
            and every such sign-in is marked in the audit trail.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SsoDomain:
      type: object
      description: |
        One domain an SSO connection claims, and how far its ownership proof has
        got (NFR-S11 · PLAN §D134).

        Claiming a domain and proving it are two acts. The claim is written with
        the connection; the proof is a token mailed to a reserved mailbox at the
        domain itself — `postmaster@`, `admin@`, `administrator@`, `hostmaster@`
        or `webmaster@` — and returned through
        `POST /settings/sso/{connectionId}/domains/{domain}/verify`. Until it
        comes back the domain is inert: it appears here, it does not appear in
        `verified_domains`, and just-in-time provisioning ignores it.

        The token itself is never in a response. It exists in the message and as
        a digest on the row, and the digest is discarded the moment it is spent.
      required: [domain, verified, verified_at, challenge_mailbox, challenge_sent_at]
      properties:
        domain:
          type: string
          maxLength: 253
          description: Lowercase, no trailing dot — the form it is matched in.
        verified:
          type: boolean
          description: >-
            Whether ownership has been proved. The one field that decides whether
            this domain provisions anybody.
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: When the challenge token came back. Null while unproved.
        challenge_mailbox:
          type: string
          nullable: true
          description: >-
            The address the outstanding (or last) challenge was sent to, so the
            screen can say where to look for it. Null when none has been sent.
        challenge_sent_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When that challenge was sent. The token stops being answerable 72
            hours later, and another may be sent a minute after this.

    ScimToken:
      type: object
      description: |
        A bearer credential a workspace pastes into its identity provider's
        SCIM provisioning connector (NFR-S11). Stored only as a SHA-256 digest;
        the plaintext exists once, in the response that creates it.
      required: [id, name, created_at, last_used_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          nullable: true
          description: Human label, e.g. `Okta (corp) provisioning`.
        created_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the connector last presented this token. The one operational
            signal that a provisioning integration is still running — and the one
            that says a token nobody remembers is safe to revoke.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Null when the token does not expire.

    ScimTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ScimToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: >-
                The plaintext credential. Returned exactly once and never
                recoverable — only its digest is stored.

    ScimError:
      type: object
      description: |
        RFC 7644 §3.12. **The `/scim/v2` endpoints do not use the ADR-06 error
        envelope** — this is the one deliberate exception in the API, recorded in
        PLAN §D. The callers of those endpoints are closed-source provisioning
        connectors (Okta, Entra, OneLogin) that parse exactly this shape, and
        `scimType` in particular is how a connector tells "this user already
        exists, adopt it" from "your request was malformed, stop retrying".

        The error *taxonomy* is unchanged: the same internal error types produce
        the same HTTP statuses as everywhere else. Only the rendering differs.
      required: [schemas, status, detail]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:Error"]
        status:
          type: string
          description: The HTTP status, as a string — RFC 7644 specifies it that way.
          example: "409"
        scimType:
          type: string
          enum:
            [
              invalidFilter,
              invalidPath,
              invalidSyntax,
              invalidValue,
              mutability,
              noTarget,
              tooMany,
              uniqueness,
            ]
        detail: { type: string }

    ScimUser:
      type: object
      description: |
        A member of this workspace, as SCIM sees them (RFC 7643 §4.1).

        `id` is the account's uuid. The writable surface is deliberately narrow:
        **`active` and `externalId` only**. Everything else a SCIM User names —
        the address, the display name — lives on the global `accounts` row, which
        a person may share with another workspace, so one workspace's directory
        must not be able to rewrite it. Attributes sent on a create are used only
        when the account does not exist yet.

        `meta.lastModified` and `meta.version` are omitted rather than invented:
        the membership records when somebody joined, not when their row last
        changed, and a `lastModified` that quietly answered `created` would make
        a client's incremental sync skip real updates.
      required: [schemas, id, userName, active, meta]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        id:
          type: string
          format: uuid
          description: The account uuid — stable for as long as the membership exists.
        externalId:
          type: string
          description: The identity provider's own id for this member. Absent when unset.
        userName:
          type: string
          description: The member's e-mail address. Not writable over SCIM.
        name:
          type: object
          properties:
            formatted: { type: string }
        displayName: { type: string }
        emails:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              type: { type: string, example: work }
              primary: { type: boolean }
        active:
          type: boolean
          description: >-
            False means the membership is suspended: the person can neither sign
            in to this workspace nor be routed work. Setting it false is what a
            directory's "disable user" does, and `DELETE` does the same thing.
        meta:
          type: object
          required: [resourceType, created, location]
          properties:
            resourceType: { type: string, example: User }
            created: { type: string, format: date-time }
            location: { type: string, format: uri }

    ScimGroup:
      type: object
      description: |
        A team of this workspace (RFC 7643 §4.2).

        Used in both directions, as SCIM's resource schemas are. On the way out
        every property is present. On the way in only `displayName` is required —
        `id`, `meta` and each member's `display`/`$ref` are server-owned and
        ignored if sent, and `externalId` is accepted without being stored
        (a team has no column for a directory's own identifier).

        Team membership drives chat routing here (ADR-08 step 2) and decides
        which conversations an agent can see, so the write paths are held to the
        console's rules rather than to a looser set of their own — see
        `paths/scim.yaml`. Group-to-role mapping stays out of scope: a connector
        able to grant `admin` by adding somebody to a directory group would hold
        a power the admin who minted its token does not.
      required: [displayName]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:schemas:core:2.0:Group"]
        id:
          type: string
          description: |
            The team's per-license integer id, as text (PRD §8.4). Server-owned;
            the path names the team on a write.
        externalId:
          type: string
          description: Accepted and not stored — re-match on `id`.
        displayName: { type: string, minLength: 1, maxLength: 120 }
        members:
          type: array
          maxItems: 200
          description: |
            On a write, only `value` is read: the id of somebody already
            provisioned in this workspace. An unknown id refuses the whole
            request rather than being skipped.
          items:
            type: object
            properties:
              value: { type: string, format: uuid }
              display: { type: string }
              $ref: { type: string, format: uri }
        meta:
          type: object
          required: [resourceType, created, location]
          properties:
            resourceType: { type: string, example: Group }
            created: { type: string, format: date-time }
            location: { type: string, format: uri }

    ScimListResponse:
      type: object
      description: RFC 7644 §3.4.2 — the envelope every SCIM query answers in.
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults:
          type: integer
          description: Matches across every page, not just this one.
        startIndex: { type: integer, description: 1-based, as SCIM counts. }
        itemsPerPage: { type: integer }
        Resources:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/ScimUser"
              - $ref: "#/components/schemas/ScimGroup"

    Brand:
      type: object
      description: |
        One brand of a license (Multibrand, PRD §5.3). A license may run several
        brands under a single subscription; each has its own channels, websites
        and widget/security/inbox settings, selected via the `X-SiyahTus-Brand`
        header on those resources. Every license has exactly one default brand —
        the `Default` it is created with — which cannot be deleted.
      required: [id, name, slug, logo_url, is_default, created_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: Display name, as shown in the brand switcher.
        slug:
          type: string
          description: URL-safe identifier, unique within the license.
        logo_url:
          type: string
          nullable: true
          description: Brand logo reference, or null when none is set.
        is_default:
          type: boolean
          description: |
            The license's default brand — the one a request with no
            `X-SiyahTus-Brand` header resolves to. Exactly one per license; it
            cannot be deleted.
        created_at: { type: string, format: date-time }

    Website:
      type: object
      description: |
        A site a workspace has connected the widget to (FR-MOD-08.5.2). Distinct
        from a trusted domain (FR-MOD-08.9.1): a website is the customer-facing
        install record — where the snippet was pasted — while a trusted domain is
        the security allowlist that decides whether the widget may mint a token
        there. Adding a website does not authorise its origin; the domain must
        also be a trusted domain for the widget to work.
      required: [id, domain, setup, status, connected_at, created_at, snippet]
      properties:
        id: { type: string, format: uuid }
        brand_id:
          type: string
          format: uuid
          description: The brand this site belongs to (Multibrand, PRD §5.3).
        domain:
          type: string
          description: Hostname only — lowercased, no scheme, port or path.
        setup:
          type: string
          enum: [manual, platform]
          description: |
            `platform` for a hosted integration (Shopify/WordPress/GTM),
            `manual` for a pasted snippet. Per PRD §8.4; the specific platform
            icon the UI shows is a presentation mapping, not stored here.
        status:
          type: string
          enum: [pending, connected, error]
          description: |
            `connected` once the widget has completed its first handshake from
            this domain; `pending` until then. `error` is reserved for a failed
            verification signal (FR-MOD-08.5.2), written by the widgets screen.
        connected_at:
          type: string
          format: date-time
          nullable: true
          description: When the first handshake was seen, or null while pending.
        created_at: { type: string, format: date-time }
        snippet:
          type: string
          description: |
            The code to paste before `</body>`. Sets `window.__siyahtus` and loads
            the async widget loader. Identical across a workspace's sites — the
            embedding origin is resolved at runtime — so "get code" per row shows
            this same value.

    ChannelType:
      type: string
      description: |
        A connected omnichannel adapter (FR-MOD-08.5.4-.8). SMS is `twilio`, its
        provider. `instagram` is DM-only (FR-MOD-08.5.7). `telegram` is a bot
        (FR-MOD-08.5.8). The Website widget and e-mail forwarding are not
        adapters and are not listed here.
      enum: [messenger, twilio, whatsapp, instagram, telegram]

    ConnectedChannel:
      type: object
      description: A channel the workspace has connected through an adapter.
      required: [type, status, connected, created_at]
      properties:
        type: { $ref: "#/components/schemas/ChannelType" }
        brand_id:
          type: string
          format: uuid
          description: The brand this channel belongs to (Multibrand, PRD §5.3).
        status:
          type: string
          description: "`connected` while on, `off` once disconnected."
          enum: [connected, off, soon]
        address:
          type: string
          nullable: true
          description: The workspace's channel address (page id / phone number) while on.
        connected:
          type: boolean
          description: Whether inbound and outbound currently flow for this channel.
        created_at: { type: string, format: date-time }
        live:
          type: boolean
          description: |
            Connected to the real provider (tm 263 — a live Telegram bot, whose
            token is held encrypted); false for every mock channel.

    InboundEmailAddress:
      type: object
      description: |
        A forwarding address the workspace's support mail arrives at
        (FR-MOD-08.5.3). `address` is the whole thing — the local part is
        `<organization_id>` for the default address and
        `<organization_id>+<label>` for any other, so no two workspaces can be
        handed the same address.
      required: [id, label, address, is_default, ticket_count, last_received_at, created_at]
      properties:
        id: { type: string, format: uuid }
        label:
          type: string
          nullable: true
          description: The part after the `+`; null for the default address.
        address:
          type: string
          description: The full address, ready to paste into a forwarding rule.
        is_default:
          type: boolean
          description: Whether this is the workspace's original, unlabelled address.
        ticket_count:
          type: integer
          description: How many tickets have arrived at this address.
        last_received_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the most recent message arrived, or null while the address has
            received nothing. Together with `ticket_count` this is the address's
            verification signal — the proof that forwarding to it really works.
        created_at: { type: string, format: date-time }

    ChannelSendResult:
      type: object
      description: The record of a mock outbound send (FR-MOD-08.5.4-.6).
      required: [provider_message_id, external_id]
      properties:
        provider_message_id:
          type: string
          description: The (mocked) provider id for the sent message.
        external_id:
          type: string
          description: The recipient channel identity the message was addressed to.
        chat_id:
          type: string
          nullable: true
          description: The chat the reply belonged to, when addressed by chat.

    ChannelMessageDirection:
      type: string
      description: |
        Which way the message crossed the adapter. `inbound` is what the
        customer sent in through the provider; `outbound` is what left for
        them — an agent's console reply, or an admin send.
      enum: [inbound, outbound]

    ChannelMessage:
      type: object
      description: |
        One row of a channel's message log (FR-MOD-08.5.4-.8) — the record the
        adapter writes whenever something crosses it in either direction.

        `text` carries customer content, which is why the read surface is gated
        on `channels--all:ro` rather than being folded into the channel list.
        It is stored already masked (FR-MOD-08.9.5): a card number a customer
        typed never reached the column, so nothing is unmasked here either.
      required: [id, direction, external_id, created_at]
      properties:
        id: { type: string, format: uuid }
        direction: { $ref: "#/components/schemas/ChannelMessageDirection" }
        external_id:
          type: string
          description: |
            The customer's identity on this channel — the sender for an inbound
            message, the recipient for an outbound one.
        chat_id:
          type: string
          nullable: true
          description: |
            The chat the message belongs to. Null only for an outbound message
            addressed straight to an `external_id`, which belongs to no chat.
        text:
          type: string
          nullable: true
          description: The message body, as stored (already card-masked).
        provider_message_id:
          type: string
          nullable: true
          description: |
            The provider's own id for the message. Present on outbound (the
            mock provider mints it) and the proof a send actually left; null
            on inbound.
        created_at: { type: string, format: date-time }

    WebhookAction:
      type: string
      description: |
        The workspace event that triggers a delivery. A closed vocabulary so a
        typo is rejected at registration rather than silently never firing.

        `chat_started` announces a new chat together with its first connection
        (`thread_id`); `thread_started` announces a further connection opening
        under a chat that already exists — the member back the same day
        (`reason: same_day_return`, ID-02). One opening is announced by one of
        the two, never both. `chat_deactivated` names the connection that
        closed (`thread_id`).

        `risk_flag_raised` / `risk_flag_cleared` (AI-27-S4) carry what the flag
        is, the chat and the member key — never a word anyone wrote.
      enum:
        - chat_started
        - chat_deactivated
        - chat_transferred
        - event_created
        - ticket_created
        - thread_started
        - risk_flag_raised
        - risk_flag_cleared

    Webhook:
      type: object
      description: |
        A registered outbound webhook (FR-MOD-08.8.4). The signing secret is
        deliberately absent — it is returned only once, by the register call
        (see `WebhookRegistration`).

        Delivery payloads keep the code names: `chat_id` is the panel's
        "Thread ID (günlük)", `thread_id` the panel's "Chat ID (bağlantı)".
      required: [id, url, action, type, enabled, created_at, app_id]
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          format: uri
          description: The public http(s) endpoint deliveries are POSTed to.
        action: { $ref: "#/components/schemas/WebhookAction" }
        type:
          type: string
          enum: [license, bot]
          description: Workspace-wide (`license`) or scoped to one bot client (`bot`).
        enabled:
          type: boolean
          description: Whether deliveries currently fire for this webhook.
        created_at: { type: string, format: date-time }
        app_id:
          description: |
            The automation card this subscription belongs to (FR-MOD-09.4) —
            `zapier` or `make` — or null for a hand-registered webhook. A
            subscription with an `app_id` exists only while that card is
            connected: registering one requires the connection, and
            disconnecting the card removes it.
          oneOf:
            - type: string
            - type: "null"

    WebhookRegistration:
      description: |
        The register response. Carries the signing `secret` in addition to the
        webhook fields — the **only** time it is ever returned.
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: |
                The HMAC signing key. Store it now; it is never shown again.
                Deliveries are signed
                `HMAC-SHA256(secret, "{timestamp}.{nonce}.{body}")`.

    IntegrationTrigger:
      type: object
      description: |
        One workspace event a webhook (and so a Zapier/Make trigger) can
        subscribe to (FR-MOD-09.4) — the `action` is a `WebhookAction` value,
        the same one `POST /webhooks` accepts.
      required: [action, label, description, sample_payload]
      properties:
        action: { $ref: "#/components/schemas/WebhookAction" }
        label: { type: string }
        description: { type: string }
        sample_payload:
          type: object
          additionalProperties: true
          description: An example delivery body, shaped `{action, data}`.

    IntegrationAction:
      type: object
      description: |
        One existing write endpoint an automation platform's "action" step may
        call (FR-MOD-09.4). No new endpoint or scope — `required_scopes`
        mirrors that route's own `config.scopes`.
      required: [id, method, path, label, required_scopes]
      properties:
        id: { type: string }
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        path:
          type: string
          description: Contract-style path, e.g. `/chats/{chatId}/events`.
        label: { type: string }
        required_scopes:
          type: array
          items: { type: string }
          description: At least one of these scopes must be granted.

    IntegrationManifest:
      type: object
      description: |
        What `GET /integrations/manifest` returns (FR-MOD-09.4): the trigger +
        action catalogue a Zapier/Make app definition is built from, plus where
        to subscribe/unsubscribe. Identical for every caller — no tenant data.
      required: [triggers, actions, subscribe, unsubscribe]
      properties:
        triggers:
          type: array
          items: { $ref: "#/components/schemas/IntegrationTrigger" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/IntegrationAction" }
        subscribe:
          type: object
          required: [method, path]
          properties:
            method: { type: string, enum: [POST] }
            path: { type: string }
          description: Where a trigger subscription is registered — `POST /webhooks`.
        unsubscribe:
          type: object
          required: [method, path]
          properties:
            method: { type: string, enum: [DELETE] }
            path: { type: string }
          description: Where a trigger subscription is removed — `DELETE /webhooks/{webhookId}`.

    PartnerAppClientType:
      type: string
      description: |
        `confidential` — a server-side app that can keep a secret, and so
        authenticates with `client_secret` at the token endpoint.
        `public` — a browser or mobile app, where no secret stays secret; it
        authenticates with PKCE alone, which OAuth 2.1 requires of every client
        regardless.
      enum: [public, confidential]

    PartnerApp:
      type: object
      description: |
        A registered OAuth 2.1 client owned by the caller's organization
        (FR-MOD-09.4). The client secret is deliberately absent — it is returned
        only once, by the register call (see `PartnerAppRegistration`).
      required:
        [client_id, display_name, client_type, redirect_uris, scopes, created_at, first_party]
      properties:
        client_id:
          type: string
          description: |
            Identifies the app to `POST /auth/authorize` and `POST /auth/token`.
            Randomly generated, so it carries no organization identifier.
        display_name: { type: string }
        client_type: { $ref: "#/components/schemas/PartnerAppClientType" }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
          description: |
            The allowlist the authorization endpoint matches against, by exact
            string. Stored verbatim — never normalised.
        scopes:
          type: array
          items: { type: string }
          description: |
            The ceiling on what a token issued to this app may carry. Never
            empty: an empty list means "no ceiling" to the authorization
            endpoint, so registration requires at least one scope.
        created_at: { type: string, format: date-time }
        first_party:
          type: boolean
          description: |
            `true` for the workspace's own sign-in client (the oldest client of
            the organization, which the agent app signs in through). The server
            refuses to edit, delete or re-key it, so a UI should show it as
            built in rather than offer those actions. Always `false` on a
            register or rotate response.

    PartnerAppRegistrationRequest:
      type: object
      required: [display_name, redirect_uris, scopes]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        client_type:
          allOf: [{ $ref: "#/components/schemas/PartnerAppClientType" }]
          default: public
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: uri, maxLength: 2048 }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: Must be a subset of what the registering session holds.

    PartnerAppPatch:
      type: object
      minProperties: 1
      description: |
        At least one field. `client_type` is absent by design — it is immutable
        after registration.
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: uri, maxLength: 2048 }
        scopes:
          type: array
          minItems: 1
          items: { type: string }

    PartnerAppRegistration:
      description: |
        The register response. For a confidential client it carries the
        `client_secret` in addition to the app fields — the **only** time it is
        ever returned.
      allOf:
        - $ref: "#/components/schemas/PartnerApp"
        - type: object
          properties:
            client_secret:
              type: string
              description: |
                Present only for `client_type: confidential`. Store it now; only
                a one-way hash is kept, so it is never shown again — a lost
                secret must be rotated.

    PartnerAppSecretRotation:
      description: |
        The rotate response. Always carries a `client_secret` — rotation applies
        only to a confidential client — and, like registration, carries it
        exactly once. The previous secret is already invalid by the time this
        response is written.
      allOf:
        - $ref: "#/components/schemas/PartnerApp"
        - type: object
          required: [client_secret]
          properties:
            client_secret: { type: string }

    McpToolDescriptor:
      type: object
      description: |
        One MCP tool as advertised by the manifest (FR-MOD-08.8.3) — enough for a
        client to render it and build a valid call. `input_schema` is JSON Schema
        for the tool's argument object; `required_scopes` lists the scopes any one
        of which authorises a call — the same check the tool-call surface enforces
        at call time (08.8.3-c) — so a client can predict which tools its token may
        use before trying them.
      required: [name, title, description, input_schema, required_scopes]
      properties:
        name:
          type: string
          description: Stable tool identifier, used as the `{tool}` path segment on a call.
        title:
          type: string
          description: Human-readable label.
        description:
          type: string
          description: What the tool does, for the client to show or reason over.
        input_schema:
          type: object
          additionalProperties: true
          description: JSON Schema describing the tool's argument object.
        required_scopes:
          type: array
          items: { type: string }
          description: A caller holding at least one of these may invoke the tool.

    McpManifest:
      type: object
      description: |
        What an MCP client discovers at `GET /mcp/manifest` (FR-MOD-08.8.3): the
        base URL to call, the protocol revision this server targets, and the static
        catalogue of tools. Identical for every caller — it carries no license or
        organization identifier (NFR-S4/NFR-S5).
      required: [protocol_version, server, tools]
      properties:
        protocol_version:
          type: string
          description: The MCP protocol revision this server targets.
        server:
          type: object
          required: [name, url, version]
          properties:
            name: { type: string }
            url:
              type: string
              format: uri
              description: Base URL an MCP client points at; tool calls are POSTed beneath it.
            version: { type: string }
        tools:
          type: array
          items: { $ref: "#/components/schemas/McpToolDescriptor" }

    McpToolCallRequest:
      type: object
      description: |
        The body of a `POST /mcp/tools/{tool}` call (FR-MOD-08.8.3). `arguments`
        is the tool's argument object, validated against the tool's `input_schema`
        from the manifest. A tool whose arguments are all optional may be called
        with no body at all; `arguments` then defaults to an empty object.
      properties:
        arguments:
          type: object
          additionalProperties: true
          description: The tool's arguments, matching its `input_schema`.

    McpToolCallResult:
      type: object
      description: |
        The result of an MCP tool call. `result` is the tool's output — its shape
        depends on the tool (a ticket page for `search_tickets`, a report for
        `get_report`, …). Carries no license or organization identifier
        (NFR-S4/NFR-S5).
      required: [tool, result]
      properties:
        tool:
          type: string
          description: The tool that ran, echoed back for correlation.
        result:
          type: object
          additionalProperties: true
          description: The tool's output.

    UploadGrant:
      type: object
      description: |
        Permission to store one file, issued by `POST /uploads` once the
        licence's file-sharing rules have accepted the declared type and size
        — or, for `purpose: knowledge_document`, once the document rules have
        (tm 313 · AI-18).
      required: [upload_url, upload_id, expires_at]
      properties:
        upload_url:
          type: string
          description: |
            Signed, single-use, and bound to the declared type and length. Send
            the bytes here with `PUT` before `expires_at`.
        upload_id:
          type: string
          description: |
            The key the file is stored under. What `POST
            /knowledge-sources/document` takes for a `knowledge_document`.
        file_url:
          type: string
          description: |
            Where the file will be readable, and the value that belongs on an
            event's `attachment_url`. Does not expire — it is authorised by
            session, and by the licence embedded in the key. Absent for a
            `knowledge_document`, which `GET /uploads/{key}` never serves.
        expires_at:
          type: string
          format: date-time
          description: When `upload_url` stops being accepted.

    SecuritySettings:
      type: object
      description: |
        Per-license security configuration (PRD §8.4 `security_settings`).

        `file_sharing_enabled`, `allowed_file_types` and `max_file_size_bytes`
        are the rules FR-MOD-08.9.4 enforces on every upload — both the agent
        composer's attachments and anything a customer sends.

        `ip_allowlist_enforced`, `session_idle_timeout_seconds` and
        `max_concurrent_sessions` are the session policy fields
        (FR-MOD-08.9.6). `PATCH` validates and stores them, but nothing
        enforces them yet — idle-timeout and concurrent-session enforcement is
        FR-MOD-08.9.6-g. A workspace that has never saved them reads the same
        defaults — `false`, and null for both limits, meaning the existing
        `MAX_ACTIVE_TOKENS_PER_OWNER` constant (25) still governs concurrent
        sessions.

        `ai_turns_per_customer_day` is the per-member daily AI allowance
        (tm 339.1 · GV-01): how many AI turns one member may have answered on
        one conversation day (the workspace's day boundary) before the
        conversation goes to a person. 40 unless saved; 0 turns it off.

        `captcha_mode` is when the widget asks a visitor for a human check
        (tm 339.2 · GV-01): `off`, `risk` (the default — only when the risk
        signals fire) or `always_on_chat_start`. See `challenge_required` on
        `POST /customer/token` and `POST /customer/chat/events`.

        `inbound_attachments_sensitive` (tm 357 · HD-02) marks every file a
        player e-mails sensitive — opened only by a role holding
        `customers.documents.view`, and every opening audited. Off (the
        default), only a file whose name or the mail's subject names an ID
        document is.
      required:
        [
          banned_customer_ips,
          file_sharing_enabled,
          allowed_file_types,
          max_file_size_bytes,
          spam_filter_enabled,
          require_two_factor,
          ip_allowlist_enforced,
          session_idle_timeout_seconds,
          max_concurrent_sessions,
          ai_turns_per_customer_day,
          captcha_mode,
          inbound_attachments_sensitive,
        ]
      properties:
        brand_id:
          type: string
          format: uuid
          description: The brand these settings belong to (Multibrand, PRD §5.3).
        banned_customer_ips:
          type: array
          description: >-
            Visitor IPs refused a widget token and blocked from starting a chat
            (FR-MOD-08.9.2). Stored in canonical form; an IPv4-mapped IPv6
            address matches its bare IPv4 form.
          items: { type: string }
        file_sharing_enabled:
          type: boolean
          description: When false, no attachment is accepted from either side.
        allowed_file_types:
          type: array
          description: Allowed MIME types. An empty list blocks every upload.
          items: { type: string }
        max_file_size_bytes:
          type: integer
          format: int32
          minimum: 1
          maximum: 104857600
          description: Per-file ceiling. 100 MiB is the hard maximum.
        spam_filter_enabled: { type: boolean }
        require_two_factor: { type: boolean }
        ip_allowlist_enforced:
          type: boolean
          description: >-
            Whether `ip_allowlist_entries` (the allowlist model, FR-MOD-08.9.6)
            is enforced. Defaults to false; nothing enforces this yet.
        session_idle_timeout_seconds:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 2592000
          description: >-
            Seconds of inactivity before a session is force-expired, or null
            when the policy is off (the default — nothing enforces this yet).
        max_concurrent_sessions:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 25
          description: >-
            Per-owner cap on simultaneous active sessions, or null to fall
            back to the fixed `MAX_ACTIVE_TOKENS_PER_OWNER` limit (25).
        ai_turns_per_customer_day:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: >-
            AI turns one member may have answered per conversation day; the
            next one is left to a person, with a note for the agents. 0 = no
            per-member allowance. Defaults to 40.
        captcha_mode:
          $ref: "#/components/schemas/CaptchaMode"
        inbound_attachments_sensitive:
          type: boolean
          description: Treat every e-mailed file as sensitive. Defaults to false.
        updated_at: { type: string, format: date-time, nullable: true }

    # --- Member recognition (ID-03 · decision K4 · tm 287) ---------------------
    #
    # The shapes of Settings › Security › Member recognition and of a
    # customer's possible matches and links. The settings and the per-member
    # revocation are served since tm 287.2; the possible matches and links are
    # defined ahead of their paths, which `paths/customers.yaml` holds unmounted
    # until tm 287.4 serves them — `contract-parity.test.ts` refuses a
    # documented operation nothing serves (docs/adr/member-recognition.md §3).

    MemberTokenKeyInfo:
      type: object
      description: |
        The licence's member-token signing key, described — never the key
        itself, which no response carries (ID-03 · K4). `version` signs new
        tokens; a rotation keeps the key it replaced as `previous_version`
        until `previous_valid_until`, so the members it signed are still
        recognised, and re-signed under the new key, while that lasts.
      required: [version, created_at, previous_version, previous_valid_until]
      properties:
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        previous_version: { type: integer, minimum: 1, nullable: true }
        previous_valid_until: { type: string, format: date-time, nullable: true }

    MemberRecognitionSettings:
      type: object
      description: |
        Settings › Security › Member recognition (ID-03 · decision K4). One set
        per licence, not per brand: the member token and the key that signs it
        are the licence's, and a member is the same person on every brand's
        site. A workspace that never saved these reads the defaults (30 days,
        matches shown); reading creates nothing — not even a key.
      required:
        [token_ttl_seconds, possible_matches_enabled, key, tokens_revoked_before, updated_at]
      properties:
        token_ttl_seconds:
          type: integer
          minimum: 86400
          maximum: 31536000
          description: |
            How long a member token lives without a visit. Sliding — every
            visit re-signs it — so this is how long a member who stays away is
            still recognised. At least a day, so a member stays the same member
            for the rest of the day (ID-02); a year at most.
        possible_matches_enabled:
          type: boolean
          description: |
            Whether agents see possible matches: other customers of the
            organization with the same pre-chat username or e-mail, marked
            unverified. Off, the list comes back empty.
        key:
          allOf: [{ $ref: "#/components/schemas/MemberTokenKeyInfo" }]
          nullable: true
          description: Null until the widget first mints a member token, or an admin rotates.
        tokens_revoked_before:
          type: string
          format: date-time
          nullable: true
          description: |
            The latest bulk revocation: every member token this licence issued
            before it is refused, and its browser starts again as a new
            visitor. Null when there has been none.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Null when the settings were never saved.

    MemberRecognitionSettingsInput:
      type: object
      minProperties: 1
      description: Only the fields sent change.
      properties:
        token_ttl_seconds: { type: integer, minimum: 86400, maximum: 31536000 }
        possible_matches_enabled: { type: boolean }

    MemberKeyRotationInput:
      type: object
      properties:
        grace_period_seconds:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 604800
          description: |
            How long the replaced key is still accepted. A member who visits
            within it is re-signed under the new key and never notices; `0`
            retires the old key at once — the emergency rotation, after which
            every member starts again as a new visitor. Default 7 days.

    MemberTokenRevocation:
      type: object
      description: |
        A revocation (ID-03 · K4). Member tokens are signed, not stored, so a
        revocation refuses by issue time: every token this licence issued
        before `revoked_at` — for `customer_id`, or for every member when that
        is null — is refused, and that browser's next visit is a new anonymous
        customer. Not undone; a later visit simply earns a new token.
      required: [customer_id, revoked_at]
      properties:
        customer_id:
          type: string
          format: uuid
          nullable: true
          description: The member whose tokens are refused, or null for every member.
        revoked_at: { type: string, format: date-time }

    RetentionTier:
      type: string
      enum: ["30d", "60d", "365d", "unlimited"]
      description: >-
        One of the four windows NFR-C8 enumerates. A tier, not a day count, so
        `unlimited` cannot arrive as the number `0` — which is the one value the
        sweep's own guard refuses, because a zero window puts the cutoff at
        "now" and matches every row.

    RetentionSettings:
      type: object
      description: |
        This workspace's data retention windows (NFR-C8) — what it keeps, and
        for how long, before the sweep hard-deletes it.

        Three facts are reported together because none of them is usable alone:
        the **choice** (`*_window`, null when the workspace has made none), the
        **default** it falls back to when it has not chosen, and the
        **effective** window the sweep will actually apply — which is neither of
        the first two when a HIPAA ceiling cuts it back (NFR-C4 · C4-e). An
        admin asking "why did that conversation disappear a year early" has to
        be able to answer it from this response rather than from the
        deployment's environment file, which they cannot see.

        Audit-log and outgoing-mail windows are deliberately **not** here.
        NFR-S12 floors the audit trail at 30 days on every plan, and letting a
        workspace shorten the record of its own deletions is the "erişim ≠
        silme" tension the requirement exists to resolve; the mail spool is a
        deployment-local artifact with no workspace on it at all.
      required:
        [
          thread_window,
          visit_window,
          default_thread_days,
          default_visit_days,
          effective_thread_days,
          effective_visit_days,
          max_thread_days,
          max_visit_days,
          hipaa_scope,
        ]
      properties:
        thread_window:
          allOf: [{ $ref: "#/components/schemas/RetentionTier" }]
          nullable: true
          description: >-
            The window this workspace chose for closed conversations, or null
            when it has made no choice and inherits the deployment default.
            Distinct values on purpose: "we never configured this" and "we
            decided never to delete" are different facts.
        visit_window:
          allOf: [{ $ref: "#/components/schemas/RetentionTier" }]
          nullable: true
          description: The same, for visitor telemetry (`visits`).
        default_thread_days:
          type: integer
          description: >-
            The deployment default a null `thread_window` inherits
            (`RETENTION_THREAD_DAYS`). Reported so the screen can say what
            "inherit" means instead of showing an empty field.
        default_visit_days:
          type: integer
          description: The deployment default for `visit_window`.
        effective_thread_days:
          type: integer
          nullable: true
          description: >-
            What the sweep will actually use, after the choice, the default and
            any ceiling have all been applied. Null means unlimited — nothing is
            pruned.
        effective_visit_days:
          type: integer
          nullable: true
          description: The same, for visitor telemetry.
        max_thread_days:
          type: integer
          nullable: true
          description: >-
            The longest window this workspace may select, or null when nothing
            caps it. Non-null only under HIPAA scope (NFR-C4 · C4-e), where the
            ceiling also removes `unlimited` from the menu entirely. Returned
            rather than left for the caller to derive, the same reason
            `ComplianceSettings.baa_available` is — so a screen cannot offer a
            choice the endpoint will refuse.
        max_visit_days:
          type: integer
          nullable: true
          description: The same, for visitor telemetry.
        hipaa_scope:
          type: boolean
          description: >-
            Whether a Business Associate Agreement is in force for this
            workspace, which is what puts the ceilings above in force.

    RetentionSettingsInput:
      type: object
      description: |
        A retention choice. An absent key leaves that window alone; an explicit
        `null` clears the choice and returns the window to the deployment
        default. Both are needed: without the distinction, saving a conversation
        window would silently reset the telemetry one.

        At least one window. `reason` is not a window: a body carrying only a
        reason changes nothing and is refused (400).
      minProperties: 1
      properties:
        thread_window:
          allOf: [{ $ref: "#/components/schemas/RetentionTier" }]
          nullable: true
        visit_window:
          allOf: [{ $ref: "#/components/schemas/RetentionTier" }]
          nullable: true
        reason: { $ref: "#/components/schemas/HighRiskReason" }

    HighRiskReason:
      type: string
      minLength: 1
      maxLength: 500
      description: |
        Why a high-risk setting is being changed (GV-06-S1) — data retention,
        an AI compliance rule. The panel asks for it after showing the change
        and always sends it; the API files it with the change's audit entry
        (`metadata.reason`). Optional on the wire, so an integration written
        before it existed keeps working; a write without one is audited as
        before. Trimmed; blank is refused.

    ErasureReceipt:
      type: object
      description: |
        What a "right to erasure" request actually removed (GDPR Art. 17).

        A receipt rather than a bare 204, because the workspace answering the
        request has to be able to tell the person what was erased, and because
        the counts are the only evidence left once the rows are gone — the audit
        entry records the same figures, never the data.
      required:
        [customer_id, erased_at, chats, threads, events, visits, tickets, channel_identities]
      properties:
        customer_id:
          type: string
          format: uuid
          description: >-
            The subject that was erased. Still reported (and still written to
            the audit trail) after the row is gone: with the record deleted the
            id identifies nobody, and it is what proves the request was honoured.
        erased_at: { type: string, format: date-time }
        chats: { type: integer, description: Conversations deleted. }
        threads: { type: integer, description: Threads inside those conversations. }
        events:
          type: integer
          description: Messages and system events inside those threads.
        visits: { type: integer, description: Visit telemetry rows deleted. }
        tickets:
          type: integer
          description: >-
            Tickets deleted. Deleted rather than unlinked: a ticket keeps the
            subject's own words in its `subject` line and its custom field
            values, so leaving it with a null customer would call erased
            something that is still readable.
        channel_identities:
          type: integer
          description: >-
            External identities (phone number, Messenger id, …) the subject was
            reachable at.

    ComplianceSettings:
      type: object
      description: |
        What NFR-C4 makes HIPAA cover conditional on: US hosting and a signed
        Business Associate Agreement. Both halves are reported together because
        neither is meaningful alone — a signed BAA in `eu` would be a claim
        about data that does not live there, which is why it cannot be created.
      required: [region, baa_available, hipaa_baa_signed_at]
      properties:
        region:
          type: string
          enum: [eu, us]
          description: >-
            Where this workspace keeps its data — chosen at signup and never
            changeable (ADR-12 · C4-a).
        baa_available:
          type: boolean
          description: >-
            Whether a BAA may be accepted here at all. True only in `us`.
        hipaa_baa_signed_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the owner accepted the BAA, or null if never. Set once, on
            the first acceptance, and not moved by a later one.

    CompanyDetails:
      type: object
      description: |
        Company name, sector, address, timezone and size (FR-MOD-08.3 ·
        FR-MOD-00.4 · `organizations`), what PRD §8.4 calls the billing/brand/
        report basis. Organization-scoped, not license- or brand-scoped.
      required: [name, sector, address, timezone, company_size]
      properties:
        name: { type: string }
        sector:
          type: string
          nullable: true
          description: >-
            A closed list (a report grouping) rather than free text — `null`
            until a workspace sets one.
          enum:
            [
              ecommerce_retail,
              saas_technology,
              financial_services,
              healthcare,
              travel_hospitality,
              education,
              real_estate,
              telecommunications,
              media_entertainment,
              gaming_gambling,
              nonprofit_government,
              professional_services,
              manufacturing_logistics,
              other,
            ]
        address:
          type: string
          nullable: true
          description: Free text; null until a workspace sets one.
        timezone:
          type: string
          description: >-
            An IANA zone name, e.g. `Europe/Istanbul`. Defaults to `UTC` — the
            column is never null.
        company_size:
          type: string
          nullable: true
          description: >-
            Head-count bucket (FR-MOD-00.4's onboarding "şirket büyüklüğü"
            step writes here) — a closed list, not free text, `null` until a
            workspace sets one.
          enum: [1_10, 11_50, 51_200, 201_1000, 1000_plus]

    ChatTimeoutSettings:
      type: object
      description: |
        Per-license idle-chat auto-close window (FR-MOD-08.7.3, `inbox_settings`).

        `chat_timeout_seconds` is null when auto-close is off — which is also
        what a workspace that has never saved it reads, since no row exists yet.
        A stored value is always a positive integer and applies to every
        conversation. Off is not "never" for widget conversations: they still
        close after 30 minutes without activity (owner decision K2, ID-02), so
        a member back later the same day opens a new connection; conversations
        from messaging channels stay open.

        The same row carries the conversation **day boundary** (ID-04, decision
        K3): which calendar day a conversation belongs to is counted in
        `day_boundary_timezone`, with the day starting at `day_boundary_hour`
        local time. A workspace with no row reads the defaults — Europe/Istanbul,
        00:00. Changing it affects only connections that start afterwards; a chat
        already filed under a day keeps it. The AI daily quota and report day
        buckets stay on the UTC day.

        Two windows come before auto-close (WG-03 · tm 340), both null (off)
        until set: `unanswered_transfer_seconds` passes an assigned connection
        whose agent has not answered the player to someone else in the team,
        and `inactive_after_seconds` marks a quiet connection inactive, out of
        its agent's concurrent limit until the next message. When on, they keep
        transfer < inactive < auto-close. `pause_unresponsive_agents` (on unless
        turned off) also stops routing to an agent the transfer took a
        connection from: they go `not_accepting_chats` until they switch back.
        `ask_email_after_seconds` (off by default) comes before all of them: a
        connection that waited that long for a person's first reply asks the
        player for an e-mail, once; `ask_email_when_offline` asks at once while
        nobody is accepting chats (WG-08).
      required:
        [
          chat_timeout_seconds,
          day_boundary_timezone,
          day_boundary_hour,
          unanswered_transfer_seconds,
          inactive_after_seconds,
          pause_unresponsive_agents,
          ask_email_after_seconds,
          ask_email_when_offline,
          updated_at,
        ]
      properties:
        brand_id:
          type: string
          format: uuid
          description: The brand these settings belong to (Multibrand, PRD §5.3).
        chat_timeout_seconds:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: >-
            Seconds of inactivity before auto-close, or null when disabled —
            widget conversations then close after the 30-minute default (K2).
        day_boundary_timezone:
          type: string
          example: Europe/Istanbul
          description: >-
            IANA zone the conversation day is counted in. Defaults to
            `Europe/Istanbul` when never set.
        day_boundary_hour:
          type: integer
          format: int32
          minimum: 0
          maximum: 23
          description: >-
            The local hour a conversation day starts at (`0` = midnight, `6` =
            05:59 still belongs to the previous day). Defaults to `0`.
        unanswered_transfer_seconds:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: >-
            Seconds an assigned connection may wait for its agent's first reply
            before it goes to someone else in the team; null when off.
        inactive_after_seconds:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: >-
            Seconds without an event before a connection is inactive and stops
            counting against its agent's concurrent limit; null when off.
        pause_unresponsive_agents:
          type: boolean
          description: >-
            Whether an agent whose connection the unanswered transfer took is
            set to `not_accepting_chats` (and told why). True unless turned off.
        ask_email_after_seconds:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: >-
            Seconds a connection waits for a person's first reply before the
            player is asked for an e-mail; null when off.
        ask_email_when_offline:
          type: boolean
          description: >-
            Whether a connection waiting for a person while nobody is accepting
            chats asks the player for an e-mail at once. False unless turned on.
        ticket_reopen_window_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          description: >-
            How long a solved ticket waits for the player's answer by e-mail
            (HD-03): an answer within this many days of its last activity
            reopens it, a later one — or one to a closed ticket — opens a new
            ticket that names it (`related_ticket_id`). 30 unless set.
        transcript_allowed_domains:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 253, example: sirket.com }
          description: >-
            Domains a transcript may be mailed to besides the player's own
            address (AR-04-S3), lower-case, without the `@`; an address
            matches when its domain is exactly one of them. Empty unless set.
        transcript_forward_to:
          type: array
          maxItems: 5
          items: { type: string, format: email, maxLength: 254, example: arsiv@sirket.com }
          description: >-
            Addresses every closed connection is forwarded to (WG-06), each
            mailed on its own, as an internal mail (outside the external
            daily cap). A closing chat no longer mails the player (K26): the
            player asks for their copy from the widget. Empty unless set.
        transcript_forward_include_notes:
          type: boolean
          description: >-
            Whether the forwarded copy is the team's, internal notes marked,
            rather than the player's. Only addresses at the workspace's
            verified SSO domains may receive it. False unless turned on.
        updated_at: { type: string, format: date-time, nullable: true }

    WidgetSettings:
      type: object
      description: |
        Per-license widget appearance (FR-MOD-11.7, `widget_settings`). A
        workspace that has never customised it reads the shipped defaults; the
        values are baked into the install snippet and applied by the widget.
      required:
        [
          primary_color,
          position,
          theme,
          mobile_fullscreen,
          powered_by,
          welcome_title,
          welcome_text,
          language,
          fallback_language,
          availability_mode,
          launcher_visibility,
          show_logo,
          updated_at,
        ]
      properties:
        brand_id:
          type: string
          format: uuid
          description: The brand this appearance belongs to (Multibrand, PRD §5.3).
        primary_color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Brand colour of the launcher, header and send button, a hex.
        position:
          type: string
          enum: [bottom-right, bottom-left]
          description: Corner the launcher sits in.
        theme:
          type: string
          enum: [auto, light, dark]
          description: auto follows the visitor's device; light/dark force it.
        mobile_fullscreen:
          type: boolean
          description: Open the panel edge-to-edge on phones rather than as a card.
        powered_by:
          type: boolean
          description: The removable "Powered by SiyahTuş" footer (FR-MOD-11.5).
        welcome_title:
          type: string
          nullable: true
          maxLength: 120
          description: >-
            Bold first line of the welcome message the widget opens with, or
            null for none.
        welcome_text:
          type: string
          nullable: true
          maxLength: 500
          description: >-
            The workspace's own welcome message, shown as the team's first
            bubble when the panel opens; null keeps the widget's built-in line.
            `**bold**`, `*italic*` and `[label](https://…)` links render; any
            other text is shown as typed.
        language:
          type: string
          enum: [auto, en, tr, de, fr, es, it, pt, ar]
          description: >-
            The widget's language (WG-02): `auto` follows the visitor's
            browser, anything else pins it. A language in the install snippet
            still wins.
        fallback_language:
          type: string
          enum: [en, tr, de, fr, es, it, pt, ar]
          description: What `auto` falls back to when the browser speaks none of the eight.
        availability_mode:
          type: string
          enum: [always, agents_only]
          description: |
            When a visitor may start a chat (WG-09): `always` (default) or
            only while someone answers — `agents_only` offers the offline form
            when no AI would answer and nobody accepts chats. Server-side; the
            widget reads the outcome as `CustomerChatState.can_start_chat`.
        launcher_visibility:
          type: string
          enum: [always, until_opened, never]
          description: |
            When the chat bubble is drawn (WG-10): `always` (default);
            `until_opened` — hidden until the host page opens the panel with
            `siyahtus('open')`, shown from then on; `never` — no bubble, the
            panel opens only through the page's own button. Delivered with the
            token mint, never baked into the install snippet.
        show_logo:
          type: boolean
          description: >-
            Show the brand's logo (Settings › Brands) in the panel header
            (WG-10). Off by default; has no effect while the brand has no
            `https` logo address.
        updated_at: { type: string, format: date-time, nullable: true }

    PrechatFieldRule:
      type: object
      description: |
        One built-in pre-chat field (WG-01): whether the widget asks it, and
        whether it must be answered. `required` implies `visible`.
      required: [visible, required]
      properties:
        visible: { type: boolean }
        required: { type: boolean }

    PrechatConfig:
      type: object
      description: |
        The widget's built-in pre-chat form (WG-01): whether it opens before a
        first conversation, and how each of its four fixed fields behaves. The
        workspace's own questions (`pre_chat` custom fields) are separate and
        are not asked when `enabled` is false.
      required: [enabled, fields]
      properties:
        enabled: { type: boolean }
        fields:
          type: object
          required: [name, username, email, message]
          properties:
            name: { $ref: "#/components/schemas/PrechatFieldRule" }
            username: { $ref: "#/components/schemas/PrechatFieldRule" }
            email: { $ref: "#/components/schemas/PrechatFieldRule" }
            message: { $ref: "#/components/schemas/PrechatFieldRule" }

    PrechatSettings:
      allOf:
        - $ref: "#/components/schemas/PrechatConfig"
        - type: object
          required: [brand_id, configured]
          properties:
            brand_id:
              type: string
              format: uuid
              description: The brand this form belongs to (Multibrand, PRD §5.3).
            configured:
              type: boolean
              description: |
                Whether this brand has saved the form. False reads today's
                defaults; only a saved form is also enforced by the server on
                `/customer/chat/events`.

    WidgetPhraseMap:
      type: object
      description: |
        A brand's own wording for widget texts in one language (WG-05), keyed
        by `WIDGET_PHRASE_KEYS` (`@siyahtus/types`) — a closed list, each with
        a length limit and the placeholders it may use (`{n}` the queue
        position, `{minutes}` the estimated wait). Plain text: no HTML, no line
        breaks. A key that is absent shows the widget's own text for that
        language.
      additionalProperties: { type: string, minLength: 1, maxLength: 300 }

    WidgetPhrases:
      type: object
      required: [brand_id, locale, phrases, updated_at]
      properties:
        brand_id: { type: string, format: uuid }
        locale:
          type: string
          enum: [en, tr, de, fr, es, it, pt, ar]
        phrases: { $ref: "#/components/schemas/WidgetPhraseMap" }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: The newest change to this language's texts; null when none is saved.

    WidgetPhrasesUpdate:
      type: object
      required: [phrases]
      description: |
        Every custom text of the language, replacing what was saved: a key left
        out goes back to the widget's own text ("reset to default").
      properties:
        phrases: { $ref: "#/components/schemas/WidgetPhraseMap" }

    MintedWidgetPhrases:
      type: object
      description: |
        The brand's custom widget texts for the one language the widget will
        show (WG-05), chosen like the widget chooses: the snippet's language,
        the brand's pinned language, the browser's languages, the fallback.
        `phrases` is empty when that language has none. The widget uses them
        only when it settled on the same `locale`.
      required: [locale, phrases]
      properties:
        locale:
          type: string
          enum: [en, tr, de, fr, es, it, pt, ar]
        phrases: { $ref: "#/components/schemas/WidgetPhraseMap" }

    EstimatedWait:
      type: object
      nullable: true
      description: |
        Roughly how long the visitor will still wait in the queue (WG-05), as a
        range of whole minutes: the median and 80th percentile of the waits
        of the same team's queue over the last 7 days, times the queue position,
        over the agents of the team accepting chats now. Null outside the
        queue, with fewer than 20 finished waits to go on, or while nobody of
        the team accepts chats — the widget then shows the position alone.
      required: [min_minutes, max_minutes]
      properties:
        min_minutes: { type: integer, minimum: 1 }
        max_minutes: { type: integer, minimum: 1 }

    WidgetAppearance:
      type: object
      description: |
        The look the visitor's widget renders, as the token mint delivers it
        (FR-MOD-11.7 · FR-MOD-11.5). The five appearance fields are the
        workspace's `WidgetSettings` without the bookkeeping; the two links
        are facts about the deployment, not workspace settings.
      required:
        [
          primary_color,
          position,
          theme,
          mobile_fullscreen,
          powered_by,
          welcome_title,
          welcome_text,
          language,
          fallback_language,
          launcher_visibility,
          show_logo,
          privacy_policy_url,
          powered_by_url,
          logo_url,
          brand_name,
        ]
      properties:
        primary_color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Brand colour of the launcher, header and send button, a hex.
        position:
          type: string
          enum: [bottom-right, bottom-left]
        theme:
          type: string
          enum: [auto, light, dark]
        mobile_fullscreen:
          type: boolean
        powered_by:
          type: boolean
          description: >-
            Whether the "Powered by SiyahTuş" footer shows. Already ruled on by
            the white-label entitlement, so a workspace without it always reads
            true.
        welcome_title:
          type: string
          nullable: true
          description: Bold first line of the welcome message, or null.
        welcome_text:
          type: string
          nullable: true
          description: >-
            The workspace's welcome message (see `WidgetSettings`), or null for
            the widget's built-in line.
        language:
          type: string
          enum: [auto, en, tr, de, fr, es, it, pt, ar]
          description: >-
            The widget's language (WG-02): `auto` follows the visitor's
            browser, anything else pins it. A language in the install snippet
            still wins.
        fallback_language:
          type: string
          enum: [en, tr, de, fr, es, it, pt, ar]
          description: What `auto` falls back to when the browser speaks none of the eight.
        launcher_visibility:
          type: string
          enum: [always, until_opened, never]
          description: When the chat bubble is drawn (WG-10); see `WidgetSettings`.
        show_logo:
          type: boolean
          description: Whether the brand's logo heads the panel (WG-10).
        logo_url:
          type: string
          format: uri
          nullable: true
          description: >-
            The brand's logo for the panel header (WG-10), or null — none is
            set, `show_logo` is off, or the stored address is not an `https`
            URL the widget may load.
        brand_name:
          type: string
          nullable: true
          description: The brand's name, the logo's alternative text. Null with `logo_url`.
        privacy_policy_url:
          type: string
          format: uri
          nullable: true
          description: >-
            The deployment's privacy policy (`PRIVACY_POLICY_URL`). The widget
            links it from its footer; null when the deployment publishes none.
        powered_by_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Where the "Powered by SiyahTuş" text links to. Null in the public
            pilot (`PILOT_MODE`), where the widget shows the words without a
            link.

    SalesTrackerSettings:
      type: object
      description: |
        Per-license sales tracker configuration (FR-MOD-13.5,
        `sales_tracker_settings`). A workspace that has never configured it
        reads the shipped defaults — tracking off, USD, a 7-day attribution
        window — since no row exists until the first save.

        License-scoped, not brand-scoped: FR-MOD-13.5 gives no indication
        tracking should differ per brand, so there is one configuration per
        workspace.
      required: [enabled, currency, attribution_window_days, updated_at]
      properties:
        enabled:
          type: boolean
          description: Whether orders reported by the widget snippet are tracked at all.
        currency:
          $ref: "#/components/schemas/SalesTrackerCurrency"
        attribution_window_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 90
          description: >-
            Days after a chat during which a sale still counts as attributed to
            it. A zero or negative window could never attribute anything.
        updated_at: { type: string, format: date-time, nullable: true }

    SalesTrackerCurrency:
      type: string
      description: >-
        ISO 4217 alpha-3 code the tracked revenue is recorded in. A whitelist
        rather than any three letters: the code is stored on every order and
        summed in the Ecommerce report, so a typo would produce a report
        denominated in a currency that does not exist.
      enum:
        [
          AED,
          AUD,
          BRL,
          CAD,
          CHF,
          CNY,
          DKK,
          EUR,
          GBP,
          INR,
          JPY,
          MXN,
          NOK,
          NZD,
          PLN,
          SAR,
          SEK,
          SGD,
          TRY,
          USD,
          ZAR,
        ]

    UpdateSalesTrackerSettings:
      type: object
      description: |
        A partial change to the sales tracker configuration. Every field is
        optional so the settings screen can save one control at a time, but a
        body with none is rejected — empty is a mistake, not "reset to
        defaults" — and so is any field not listed here, so a mistyped name
        cannot be dropped silently while the screen reports a successful save.
      minProperties: 1
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        currency:
          $ref: "#/components/schemas/SalesTrackerCurrency"
        attribution_window_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 90

    OnboardingSurveyAnswer:
      type: string
      nullable: true
      description: |
        Choices for the one-time "What are you tracking?" survey popover
        (FR-MOD-07.2). `null` on the wire means the popover was dismissed
        without a choice — `other` is a submitted choice like the rest, just
        an uncategorised one.
      enum: [agent_performance, team_sharing, spotting_problems, revenue_impact, other]

    OnboardingState:
      type: object
      description: |
        First-run setup state (FR-MOD-00.4). `completed` is a per-license fact —
        the workspace is set up — set once the owner finishes or skips the wizard.
      required:
        [completed, completed_at, demo_seeded, demo_seeded_at, survey_answer, survey_answered_at]
      properties:
        completed: { type: boolean }
        completed_at: { type: string, format: date-time, nullable: true }
        demo_seeded:
          type: boolean
          description: Whether the sample data has been laid down.
        demo_seeded_at: { type: string, format: date-time, nullable: true }
        survey_answer:
          $ref: "#/components/schemas/OnboardingSurveyAnswer"
        survey_answered_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the survey popover was answered or skipped — either way, set
            once, so the popover is not shown again.

    OnboardingSeedResult:
      type: object
      required: [seeded, counts, state]
      properties:
        seeded:
          type: boolean
          description: |
            False when the demo was already present — the call is idempotent, so
            the counts below are all zero in that case.
        counts:
          type: object
          required: [canned_responses, tags, customers, chats]
          properties:
            canned_responses: { type: integer }
            tags: { type: integer }
            customers: { type: integer }
            chats: { type: integer }
        state: { $ref: "#/components/schemas/OnboardingState" }

    CannedResponse:
      type: object
      description: |
        A saved reply, offered in the composer behind `#` (FR-MOD-08.7.2).

        `visibility` and `group_id` are one decision spelled in two columns and
        they move together: `all` means the whole workspace may use the reply
        and carries no `group_id`; `group` means only members of `group_id` see
        it, and the id is then required. A reply labelled with a team but
        visible to everyone would be ownership metadata rather than a scope, and
        a team-only reply with no team would be one nobody could reach — the
        database refuses both pairings.
      required: [id, shortcut, text, scope, group_id, visibility, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        shortcut: { type: string }
        text: { type: string }
        scope: { type: string, enum: [chat, ticket] }
        group_id:
          type: integer
          format: int64
          nullable: true
          description: The team this reply is scoped to; null when `visibility` is `all`.
        visibility:
          type: string
          enum: [all, group]
          default: all
          description: |
            Who may see the reply. `all` — everyone in the workspace; `group` —
            members of `group_id` only. The list endpoint applies this
            server-side, so a reply a caller may not use never reaches them.
        updated_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Tag:
      type: object
      description: |
        A label from the workspace's central tag library (FR-MOD-08.7.1).

        Tagging a conversation draws from this library — the same `tags` row a
        thread points at is the one the library manages here — which is what
        keeps a workspace's vocabulary consistent instead of a scatter of
        one-off typos. Applying a name that is not yet in the library still
        works (it is created on demand), but curating the library is how a team
        agrees on the words before they are used.
      required: [id, name, group_ids, usage_count, created_at]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: Lowercased and trimmed; unique within the workspace.
        group_ids:
          type: array
          description: |
            Teams this tag is scoped to. Empty means the whole workspace may
            use it.
          items: { type: integer, format: int64 }
        author_id:
          type: string
          nullable: true
          description: The account that first created the tag, if known.
        usage_count:
          type: integer
          description: How many conversations currently carry this tag.
        created_at: { type: string, format: date-time }

    RoutingRule:
      type: object
      required: [id, kind, conditions, priority, is_fallback, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        kind: { type: string, enum: [chat, ticket] }
        conditions:
          type: object
          description: |
            All must match for the rule to win. Empty on the fallback rule,
            which is why it catches everything. `expertise_ids` is not a match
            condition — a rule carrying only it still matches every conversation;
            it narrows the eligible agent pool to those holding *every* listed
            area of expertise (FR-MOD-08.6.3), and is never relaxed.
          additionalProperties: true
          properties:
            expertise_ids:
              type: array
              description: Agent must hold every listed expertise area to be eligible.
              items: { type: integer, format: int64 }
        target_group_id: { type: integer, format: int64, nullable: true }
        target_group_name: { type: string, nullable: true }
        priority: { type: integer }
        is_fallback: { type: boolean }
        enabled: { type: boolean }

    RoutingRuleInput:
      type: object
      description: |
        A new routing rule. `target_group_id` is required unless `is_fallback`
        is true: a conditional rule that targets nothing can never route
        anything, and the database refuses it too
        (`routing_rules_target_check`).
      properties:
        name:
          type: string
          maxLength: 120
          description: Shown in the rules list. Optional — an unnamed rule is described by its conditions.
        kind:
          type: string
          enum: [chat, ticket]
          default: chat
        conditions:
          type: object
          description: |
            All match predicates must hold for the rule to win. Omit them
            entirely on the fallback, which is what makes it catch everything.
            `expertise_ids` is not a match predicate — see
            `RoutingRule.conditions`.
          additionalProperties: false
          properties:
            url_contains: { type: array, items: { type: string } }
            url_equals: { type: array, items: { type: string } }
            country_codes: { type: array, items: { type: string } }
            expertise_ids:
              type: array
              maxItems: 200
              items: { type: integer, format: int64 }
        target_group_id: { type: integer, format: int64, nullable: true }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        is_fallback:
          type: boolean
          default: false
          description: At most one per `kind`; a second is a 409.
        enabled: { type: boolean, default: true }

    CustomerSummary:
      type: object
      required:
        - id
        - name
        - email
        - username
        - is_lead
        - banned
        - chats_count
        - connections_count
        - tickets_count
        - table_custom_fields
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          nullable: true
          description: Null for a visitor who never introduced themselves.
        email:
          type: string
          nullable: true
          description: Null when the caller's role may not see a player's contact details (`customers.contact.view`).
        username:
          type: string
          nullable: true
          description: The username the visitor typed into the pre-chat form, unverified. Null when the caller's role may not see a player's contact details (`customers.contact.view`).
        phone: { type: string, nullable: true }
        country_code: { type: string, nullable: true, minLength: 2, maxLength: 2 }
        country: { type: string, nullable: true }
        is_lead:
          type: boolean
          description: Left an email address.
        banned: { type: boolean }
        chats_count:
          type: integer
          description: |
            The customer's conversation days in this workspace — chats, "Thread
            ID" in the panel (ID-02). A chat opened before the daily model spans
            several visits and counts once. Counted from conversations, not
            read from a stored total.
        connections_count:
          type: integer
          minimum: 0
          description: |
            The connections those days held — threads, "Chat ID" in the panel:
            one per visit, so a member who came back twice in one day counts one
            day and two connections. Reports, SLA, AI resolutions and ratings
            are all counted per connection, so this is the figure they agree
            with.
        tickets_count: { type: integer }
        last_activity_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        table_custom_fields:
          type: array
          description: |
            The contact custom fields flagged `show_in_table` (FR-MOD-03.2.3),
            with this customer's values — one entry per flagged definition, in
            authoring order, `value` null when unset. Empty when the workspace
            has flagged none. A subset of the full set `GET /customers/{id}`
            returns as `custom_fields`; this is only what the Contacts table
            renders as a column.
          items: { $ref: "#/components/schemas/CustomFieldValue" }

    PossibleMatchField:
      type: string
      enum: [username, email]
      description: |
        What a possible match shares with the customer being looked at: the
        pre-chat username (compared trimmed and case-folded) or the e-mail.
        Neither is proof — the visitor typed both (ID-03 · K4).

    CustomerMatchSummary:
      type: object
      description: |
        Just enough of another customer record to tell an agent who it is,
        for a possible match or a link (ID-03). The full record is
        `GET /customers/{customerId}`. `username` and `email` are null when the
        caller's role may not see a player's contact details
        (`customers.contact.view`); `matched_on` still names the field shared.
      required: [id, name, username, email, last_activity_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        username: { type: string, nullable: true }
        email: { type: string, nullable: true }
        last_activity_at: { type: string, format: date-time, nullable: true }

    PossibleMatch:
      type: object
      description: |
        Another customer of this organization who typed the same pre-chat
        username or e-mail (ID-03 · K4). **Unverified, and never joined on its
        own:** a username is whatever the visitor typed, so treating it as
        identity would hand one member's conversation to anyone who types
        their name. It is shown so an agent can ask, and link if satisfied.
      required: [customer, matched_on, linked]
      properties:
        customer: { $ref: "#/components/schemas/CustomerMatchSummary" }
        matched_on:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/PossibleMatchField" }
        linked:
          type: boolean
          description: An agent has already confirmed this record as the same person.

    PossibleMatchList:
      type: object
      required: [items, enabled]
      properties:
        items:
          type: array
          maxItems: 10
          description: Most recently active first, at most ten.
          items: { $ref: "#/components/schemas/PossibleMatch" }
        enabled:
          type: boolean
          description: |
            False when the workspace turned possible matches off (Settings ›
            Security › Member recognition); `items` is then empty.

    CustomerIdentityLink:
      type: object
      description: |
        An agent's confirmation that two customer records are the same person
        (ID-03 · K4) — how a member who arrived from another device, or from a
        browser that lost its member token, joins their earlier record. It
        joins the **agent's history view only**: the day's conversation
        (ID-02) and the AI's memory stay with each record's own customer
        number, so a linked record's conversations never reach the AI.
        Symmetric: the link reads the same from either record.
      required: [customer_id, linked_customer, linked_at, linked_by]
      properties:
        customer_id:
          type: string
          format: uuid
          description: The customer the request named.
        linked_customer: { $ref: "#/components/schemas/CustomerMatchSummary" }
        linked_at: { type: string, format: date-time }
        linked_by:
          type: string
          format: uuid
          description: The account that confirmed it (kept when the account is deleted).

    CustomerIdentityLinkInput:
      type: object
      required: [customer_id]
      properties:
        customer_id:
          type: string
          format: uuid
          description: The other record — a customer of the same organization.

    CustomerIdentityLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerIdentityLink" }

    AiUsageMeter:
      type: string
      enum: [llm, embedding, llm_test, embedding_test]
    AiUsage:
      type: object
      required:
        [
          day,
          time_zone,
          resets_at,
          window_days,
          meters,
          daily,
          surfaces,
          alerts,
          alert_recipients,
          per_member,
        ]
      properties:
        day:
          type: string
          format: date
          description: Today, as a UTC date.
        time_zone:
          type: string
          enum: [UTC]
          description: The zone every day here is counted in.
        resets_at:
          type: string
          format: date-time
          description: The next 00:00 UTC, when today's allowance renews.
        window_days:
          type: integer
          description: How many days `daily` covers, today included (30).
        meters:
          type: array
          description: One entry per meter, live meters first.
          items:
            type: object
            required: [meter, used, reserved, cap, percent]
            properties:
              meter: { $ref: "#/components/schemas/AiUsageMeter" }
              used: { type: integer, format: int64, minimum: 0 }
              reserved: { type: integer, format: int64, minimum: 0 }
              cap: { type: integer, format: int64, minimum: 1 }
              percent:
                type: number
                description: "`used` as a share of `cap`, in percent, to one decimal. May exceed 100."
              cost_usd:
                type: number
                description: Today's estimated cost; absent when this meter has no configured price.
        daily:
          type: array
          description: One entry per UTC day, oldest first; tokens settled on each meter.
          items:
            type: object
            required: [day, llm, embedding, llm_test, embedding_test]
            properties:
              day: { type: string, format: date }
              llm: { type: integer, format: int64 }
              embedding: { type: integer, format: int64 }
              llm_test: { type: integer, format: int64 }
              embedding_test: { type: integer, format: int64 }
        surfaces:
          type: array
          description: The window's tokens per feature and meter, largest first.
          items:
            type: object
            required: [surface, meter, input_tokens, output_tokens]
            properties:
              surface:
                type: string
                enum: [ai_agent, copilot, knowledge_index, simulation, qa, cluster]
              meter: { $ref: "#/components/schemas/AiUsageMeter" }
              input_tokens: { type: integer, format: int64 }
              output_tokens: { type: integer, format: int64 }
              cost_usd:
                type: number
                description: Estimated; absent when this meter has no configured price.
        pricing:
          type: object
          description: The unit prices the estimates use. Absent when none is configured.
          required: [currency, estimated]
          properties:
            currency: { type: string, enum: [USD] }
            estimated: { type: boolean, enum: [true] }
            llm_input_usd_per_mtok: { type: number }
            llm_output_usd_per_mtok: { type: number }
            embedding_usd_per_mtok: { type: number }
        alerts:
          type: array
          description: The alerts sent today, oldest first.
          items:
            type: object
            required: [meter, threshold, used, cap, created_at]
            properties:
              meter: { type: string, enum: [llm, embedding] }
              threshold: { type: integer, enum: [80, 100] }
              used: { type: integer, format: int64 }
              cap: { type: integer, format: int64 }
              created_at: { type: string, format: date-time }
        alert_recipients:
          type: array
          description: Account ids that receive the alerts besides the owner.
          items: { type: string, format: uuid }
        per_member:
          type: object
          description: >-
            Today's use of the per-member AI allowance (tm 339.3 · GV-01) —
            counts only, never a member or a word of a conversation. Counted on
            the workspace's conversation day (its day boundary), unlike the
            UTC-day token meters above.
          required: [day, cap, members_with_ai, members_at_cap]
          properties:
            day: { type: string, format: date }
            cap:
              type: integer
              format: int32
              nullable: true
              description: >-
                AI turns one member may have answered per day
                (`ai_turns_per_customer_day`); null when the workspace has no
                per-member allowance.
            members_with_ai:
              type: integer
              minimum: 0
              description: Members the AI has answered at least once today.
            members_at_cap:
              type: integer
              minimum: 0
              description: >-
                Of those, the members who have used the whole allowance — their
                next message goes to a person.
    AuditLogEntry:
      type: object
      description: |
        One append-only entry in the workspace's security trail (NFR-S12). The
        `metadata` is deliberately PII-minimal — field names, counts and roles,
        never values or secrets — so the trail can be retained safely.
      required: [id, action, actor_type, created_at]
      properties:
        id: { type: string, format: uuid }
        action:
          type: string
          description: The security-relevant action, e.g. `auth.login`, `member.suspended`.
        actor_id:
          type: string
          nullable: true
          description: The acting account/bot/customer id, or null when unknown.
        actor_type:
          type: string
          enum: [agent, bot, customer, system, platform]
          description: >-
            `platform` is SiyahTuş staff acting from the root panel: `actor_id` is
            the operator, never a member of this workspace.
        on_behalf_of:
          type: string
          description: >-
            Present only on `platform` entries written while an operator was
            signed in as a member (support impersonation): that member's account
            id. Absent everywhere else.
        target:
          type: string
          nullable: true
          description: The object acted on, as `<kind>:<id>` (e.g. `token:…`).
        metadata:
          type: object
          additionalProperties: true
          description: Non-sensitive detail — field names, counts, roles.
        ip:
          type: string
          nullable: true
          description: Source address when recorded; null when deliberately omitted.
        created_at: { type: string, format: date-time }

    AuditLogEntryDetail:
      description: |
        One entry read by id (`GET /audit-log/{entryId}`) — every field the list
        already returns, plus the entry's position in the workspace's
        tamper-evident chain.

        Nothing is redacted relative to the list. The read surfaces would only
        disagree with each other about what happened, and the field-level
        decision about what an event may keep was already made at write time,
        per action, with its reasoning recorded there.
      allOf:
        - $ref: "#/components/schemas/AuditLogEntry"
        - type: object
          properties:
            chain_seq:
              type: integer
              nullable: true
              description: |
                This entry's position in the workspace's audit chain (NFR-C6 ·
                C6-c). Positions are handed out gaplessly, so a missing number
                between two entries means one was deleted — which is the whole
                of what a reader can do with it, and why it is here while
                `prev_hash`/`hash` are not: those are the evidentiary half,
                gated on `audit_log--export:ro` + the `siem_export`
                entitlement, and unusable anyway without the workspace's
                derived key.

                `null` on entries written before the chain existed. Those
                cannot be back-computed, and saying so is the honest answer —
                claiming they are chained would forge the assurance.

    AuditLogExportRecord:
      type: object
      description: |
        One line of the SIEM export (NFR-C6). The read surface's entry plus
        `license_id`: a SIEM indexes several workspaces side by side and needs
        the discriminator on the evidence itself, not on whatever the ingest
        pipeline happened to file it under.
      required: [id, license_id, action, actor_type, created_at]
      properties:
        id: { type: string, format: uuid }
        license_id:
          type: string
          description: >-
            The workspace this entry belongs to. A string because the id is a
            64-bit integer and JSON numbers are doubles.
        action:
          type: string
          description: The security-relevant action, e.g. `auth.login`, `member.suspended`.
        actor_id:
          type: string
          nullable: true
          description: The acting account/bot/customer id, or null when unknown.
        actor_type:
          type: string
          enum: [agent, bot, customer, system, platform]
          description: >-
            `platform` is SiyahTuş staff acting from the root panel: `actor_id` is
            the operator, never a member of this workspace.
        on_behalf_of:
          type: string
          description: >-
            Present only on `platform` entries written while an operator was
            signed in as a member (support impersonation): that member's account
            id. Absent everywhere else.
        target:
          type: string
          nullable: true
          description: The object acted on, as `<kind>:<id>` (e.g. `token:…`).
        metadata:
          type: object
          additionalProperties: true
          description: >-
            Non-sensitive detail — field names, counts, roles. Exported exactly
            as stored; it was stripped of anything credential-shaped on the way
            in, and filtering again here would let the exported copy and the
            entry an admin reads on screen disagree about what happened.
        ip:
          type: string
          nullable: true
          description: Source address when recorded; null when deliberately omitted.
        created_at: { type: string, format: date-time }

    SiemExportSettings:
      type: object
      description: |
        Where a workspace ships its audit trail (NFR-C6 · C6-b), and whether it
        is shipping.
      required: [enabled, target]
      properties:
        enabled:
          type: boolean
          description: Whether the scheduled export delivers to the destination.
        target:
          type: string
          nullable: true
          enum: [file, null]
          description: >-
            The destination, or null when the workspace has never configured
            one. `file` writes NDJSON under `.data/siem`.

    SlaPolicy:
      type: object
      description: |
        How long a customer may wait before the case counts as a miss
        (FR-MOD-11.5, PRD §5.4 "Kurumsal").

        Measured and marked, never enforced (§C-A27): a breach writes a row and
        raises a notification, and changes nothing about routing or priority.

        This is *not* NFR-U5's contractual uptime commitment with its billing
        credit — that is a contract term, not something this repo can promise,
        and nothing here touches an invoice.
      required:
        [first_response_minutes, resolution_minutes, business_hours_only, active, updated_at]
      properties:
        first_response_minutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 129600
          description: >-
            Minutes a customer may wait for the first agent reply, or null for
            no target. Null and zero are different answers, so the field is
            nullable rather than 0-as-off.
        resolution_minutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 129600
          description: >-
            Minutes a case may stay open before it counts as a miss, or null
            for no target.
        business_hours_only:
          type: boolean
          description: >-
            Count only the hours the workspace is open, taken from the agents'
            saved work schedules (`PUT /agents/{agentId}/work-schedule`). A
            workspace where nobody has saved one has no calendar to subtract
            from, so its clocks run continuously.
        active:
          type: boolean
          description: >-
            Whether these targets are being measured today. False when the
            licence does not hold the `sla` entitlement — the numbers are still
            stored, because a downgrade must not destroy configuration a
            re-upgrade should restore — and false when both targets are null.
            Lets a screen tell "not bought" apart from "not set".
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: When the targets were last saved, or null if never.

    Sandbox:
      type: object
      description: |
        A workspace's sandbox, as its owner sees it (FR-MOD-11.5 · 11.5-f).

        Deliberately thin. Every field is read from the sandbox's own licence
        row — the one row a production workspace can see across the boundary —
        and nothing is read from its organization, its members or its data.

        There is no name: a workspace is opened by choosing it at sign-in, where
        `POST /auth/login` already lists it with its organization's name.
      required: [license_id, region, created_at, reset_at]
      properties:
        license_id:
          type: string
          description: >-
            The sandbox's licence id — what a client passes as `license_id` to
            `POST /auth/authorize` to sign in to it.
        region:
          type: string
          enum: [eu, us]
          description: >-
            Where the sandbox keeps its data. Inherited from the parent
            workspace and immutable (C4-a), so it always equals the caller's own
            region; reported anyway because "my test data went somewhere else"
            is the fear this answers.
        created_at:
          type: string
          format: date-time
        reset_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the sandbox was last emptied, or null if never. Recorded on the
            licence row rather than in the audit trail, because a reset destroys
            the sandbox's own trail and writing into the parent's would be a
            cross-licence write.

    SandboxView:
      type: object
      description: |
        Where the caller stands in relation to a sandbox (FR-MOD-11.5 · 11.5-f).

        Three states a screen has to tell apart, which is why `entitled` is here
        beside `sandbox` rather than inferred from it: a workspace that has not
        bought the capability, one that has bought it and not used it, and one
        that already has a sandbox.

        Read with a credential for the sandbox itself, `is_sandbox` is the only
        field that is true. It reports nothing about the parent — not its id,
        not its plan, not that it exists.
      required: [is_sandbox, entitled, sandbox]
      properties:
        is_sandbox:
          type: boolean
          description: True when the caller's own licence is a sandbox.
        entitled:
          type: boolean
          description: >-
            Whether this licence's plan includes a sandbox at all. Always false
            inside a sandbox, which holds no subscription and so reads as the
            self-serve tier.
        sandbox:
          allOf:
            - $ref: "#/components/schemas/Sandbox"
          nullable: true
          description: >-
            This licence's sandbox, or null when it has none. Always null when
            `is_sandbox` is true — a sandbox cannot have one.

    SiemExportStatus:
      allOf:
        - $ref: "#/components/schemas/SiemExportSettings"
        - type: object
          description: The export's configuration plus how the feed is doing.
          required:
            [last_run_at, last_exported_at, exported_count, pending_count, chain_gap_detected]
          properties:
            last_run_at:
              type: string
              format: date-time
              nullable: true
              description: >-
                When a delivery last completed, or null if one never has. A
                stale value means the export is not running at all — which is
                a different problem from it running and falling behind.
            last_exported_at:
              type: string
              format: date-time
              nullable: true
              description: >-
                The timestamp of the last entry delivered — the position, not
                the run. Far behind `last_run_at` simply means nothing new has
                happened since.
            exported_count:
              type: integer
              description: >-
                Entries delivered to this destination, ever. Survives retention
                pruning the entries it counted.
            pending_count:
              type: integer
              description: >-
                Exportable entries not yet delivered — the backlog. Counted only
                up to the export horizon, so zero means genuinely caught up
                rather than "nothing has settled yet".
            chain_gap_detected:
              type: boolean
              nullable: true
              description: >-
                Whether anything is missing from the workspace's audit trail.
                Answered from the integrity chain: positions are handed out
                gaplessly, so an absent one is an absent entry. All four cuts
                are checked — a hole in the middle, a trail starting later than
                retention pruned to, entries removed from the newest end, and an
                entry written after the chain began that carries no chain at
                all. `null` while the workspace has never written a chained
                entry, and deliberately not `false` there: a log with no chain
                cannot demonstrate its own completeness, and reporting "no gaps
                detected" from a system that cannot detect gaps is the false
                assurance the control exists to prevent.

    TrafficRespondent:
      type: object
      description: |
        Who a visitor is currently talking to (FR-MOD-03.1.3 "Chatting with").
        `kind` is the human/AI distinction the table draws — a person on the
        other end reads very differently from a persona answering first.
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [human, ai]
          description: A human agent, or the customer-facing AI persona.
        name:
          type: string
          description: The agent's name, or the persona's (e.g. "Hazal").
        avatar_url: { type: string, nullable: true }

    TrafficVisitor:
      type: object
      description: |
        One live visitor row (FR-MOD-03.1.3). Keyed by the customer, since a
        person browsing without a conversation still belongs in the table.
      required: [customer_id, name, email, activity, chat_id, chatting_with]
      properties:
        customer_id: { type: string, format: uuid }
        name:
          type: string
          nullable: true
          description: Null for a visitor who never introduced themselves.
        email:
          type: string
          nullable: true
          description: Null when the caller's role may not see a player's contact details (`customers.contact.view`).
        activity:
          type: string
          enum: [browsing, queued, waiting, chatting, supervised, invited]
          description: Where the visitor is in the funnel — see `listTraffic`.
        chat_id:
          type: string
          nullable: true
          description: The active conversation, when there is one; null while browsing.
        chatting_with:
          description: Who is answering, or null while nobody is.
          allOf:
            - $ref: "#/components/schemas/TrafficRespondent"
          nullable: true
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          description: Most recent signal from this visitor — the table's sort key.

    CampaignConditions:
      type: object
      description: |
        The trigger predicate (FR-MOD-03.3.2). Every key set must hold for a
        visitor to match. `url_contains` — the one condition v1 ships — targets
        the page they are on; an empty predicate matches nobody, so a campaign
        with no trigger is rejected rather than sent to everyone.
      properties:
        url_contains:
          type: string
          maxLength: 2048
          description: Case-insensitive substring the visitor's current page URL must contain.

    CampaignContent:
      type: object
      description: What the campaign delivers to a matching visitor.
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }

    CampaignPerformance:
      type: object
      description: The campaign card's numbers (FR-MOD-03.3.3), counted from its sends.
      required: [displayed, chats, conversion, suppressed]
      properties:
        displayed:
          type: integer
          description: Visitors the message was delivered to.
        chats:
          type: integer
          description: Of those, how many opened a conversation.
        conversion:
          type: integer
          description: Of those, how many reached a goal.
        suppressed:
          type: integer
          description: |
            Matched visitors never shown the message because a risk flag keeps
            them from promotions (EN-01) — the card's "Not shown due to risk".
            A suppressed send stays suppressed after the flag is cleared.

    Campaign:
      type: object
      description: A proactive, targeted message (FR-MOD-03.3).
      required:
        [
          id,
          name,
          status,
          conditions,
          content,
          starts_at,
          ends_at,
          recurring,
          created_at,
          performance,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [ongoing, scheduled, inactive]
          description: |
            Lifecycle state the status tabs filter by (FR-MOD-03.3.1), resolved
            from the on/off intent and the schedule: `ongoing` (running now),
            `scheduled` (active, not started yet), or `inactive` (off, or past
            its end).

            Re-evaluated against the clock on every read, so a campaign whose
            `starts_at` has arrived is reported — and filtered — as `ongoing`
            without anybody having saved it again.
        conditions: { $ref: "#/components/schemas/CampaignConditions" }
        content: { $ref: "#/components/schemas/CampaignContent" }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        recurring: { type: boolean }
        created_at: { type: string, format: date-time }
        performance: { $ref: "#/components/schemas/CampaignPerformance" }

    CampaignWriteResult:
      description: |
        A create/activate response (FR-MOD-03.3.1-.3): the saved campaign, plus
        `matched` — how many live visitors this write just targeted, regardless
        of delivery status.

        `performance.displayed` counts only *delivered* sends, and delivery
        happens later, off the widget's own poll — so at the instant a campaign
        is created or turned on, `displayed` is always `0` no matter how many
        visitors it just matched. `matched` is the number worth announcing in a
        "just reached N visitors" notification; `displayed` stays the card's
        own, separately-tracked metric and is not repurposed for this.
      allOf:
        - $ref: "#/components/schemas/Campaign"
        - type: object
          required: [matched]
          properties:
            matched:
              type: integer
              description: >
                Live visitors newly targeted by this write (a re-fire does not
                recount one already reached by an earlier fire).

    GoalDefinition:
      type: object
      description: |
        A goal's trigger predicate (FR-MOD-13.3) — same vocabulary as
        `CampaignConditions`.

        Every predicate that is *set* must hold (AND), and a definition with
        nothing set is a target nobody reaches — never "everyone converts".

        The set is exactly the funnel the PRD row names — the page a visitor
        reached, plus **sale / lead / resolution** — and deliberately no more:
        this is a conversion vocabulary, not a general rule engine. The three
        non-URL predicates are flags rather than filters because each names a
        fact about the visitor that either happened or did not; `false` and
        absent both mean "do not require it", so a goal cannot be defined by an
        absence.
      properties:
        url_contains:
          type: string
          maxLength: 2048
          description: Case-insensitive substring the visitor's current page URL must contain.
        sale_completed:
          type: boolean
          description: Require a tracked sale for this visitor (FR-MOD-13.5).
        lead_captured:
          type: boolean
          description: Require the visitor to have been captured as a lead (they gave an e-mail).
        chat_resolved:
          type: boolean
          description: Require a conversation with this visitor to have been archived.

    Goal:
      type: object
      description: A tracked conversion target (FR-MOD-13.3).
      required: [id, name, definition, active, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        definition: { $ref: "#/components/schemas/GoalDefinition" }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    GoalFunnel:
      type: object
      description: |
        The visitor→chat→conversion funnel for a goal, or goals in aggregate
        (FR-MOD-13.3). The stages are nested — each is a subset of the one
        before it — so `visitors >= chats >= conversions` always holds.
      required: [visitors, chats, conversions, conversion_rate]
      properties:
        visitors:
          type: integer
          description: |
            Distinct visitors with a visit in the window, workspace wide. Not
            per goal: nothing records which visitors a goal was eligible to
            catch, so a per-goal denominator would be invented, not measured.
        chats:
          type: integer
          description: Of those, how many also opened a conversation in the window.
        conversions:
          type: integer
          description: |
            Of those, how many reached at least one goal in the window. A
            visitor who reached three goals counts once — this stage counts
            people through the funnel, not goal hits (see `by_goal` for those).
        conversion_rate:
          type: number
          nullable: true
          description: "`conversions / chats`; null — never 0 — when there are no chats to divide by."

    GoalsReport:
      type: object
      description: |
        The `/reports/goals` payload (FR-MOD-13.3) — the aggregate funnel, a
        per-goal breakdown, and the prior window for comparison.
      required: [range, funnel, by_goal, previous_period]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        funnel: { $ref: "#/components/schemas/GoalFunnel" }
        by_goal:
          type: array
          description: |
            One row per goal the workspace has defined — active or not, and
            including goals with `conversions: 0`: a goal nobody reached is a
            reportable result, and a retired goal keeps the conversions it
            already earned. Ordered by conversions, most first.

            Deliberately *not* filtered through the funnel: `conversions` here
            counts every achievement in the window, so these sum to the
            Overview's `totals.achieved_goals` rather than to
            `funnel.conversions`. The two differ whenever a visitor converts
            without ever chatting, or reaches more than one goal.
          items:
            type: object
            required: [goal_id, name, conversions]
            properties:
              goal_id: { type: string, format: uuid }
              name: { type: string }
              conversions: { type: integer }
        previous_period:
          description: |
            The same funnel measured over the benchmark window, through the
            same license-scoped queries — so the comparison is this workspace's
            own past, never a pooled or cross-license figure.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - $ref: "#/components/schemas/GoalFunnel"

    TicketRuleConditions:
      type: object
      description: |
        A ticket rule's trigger (FR-MOD-08.6.2). Every key set must hold (AND).
        An empty predicate matches nothing, so a rule with no condition is
        rejected rather than saved to fire at every ticket.
      properties:
        subject_contains:
          type: string
          maxLength: 2048
          description: Case-insensitive substring the ticket subject must contain.
        source:
          type: string
          enum: [chat, email]
          description: Restrict to tickets opened from a chat, or forwarded by email.

    TicketRuleActions:
      type: object
      description: |
        What a matching rule does (FR-MOD-08.6.2): assign, prioritise, tag — or
        any combination. At least one action must be set; a rule that does
        nothing is rejected rather than saved inert.
      properties:
        assign_agent_id:
          type: string
          format: uuid
          description: Assign the ticket to this agent.
        assign_group_id:
          type: integer
          description: Assign the ticket to this team.
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          description: Set the ticket's queue priority (higher is more urgent).
        add_tag:
          type: string
          minLength: 1
          maxLength: 64
          description: Apply this tag (created in the tag library if new).

    TicketRule:
      type: object
      description: Condition + action automation over tickets (FR-MOD-08.6.2).
      required: [id, name, conditions, actions, enabled, position, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        conditions: { $ref: "#/components/schemas/TicketRuleConditions" }
        actions: { $ref: "#/components/schemas/TicketRuleActions" }
        enabled:
          type: boolean
          description: Whether the rule fires. Off keeps it configured without acting.
        position:
          type: integer
          description: Evaluation order; lower runs first, so a later rule's assignment wins.
        created_at: { type: string, format: date-time }

    RuleBotConditions:
      type: object
      description: |
        A rule bot's trigger (FR-MOD-06.6). Every key set must hold (AND). An
        empty predicate matches nothing, so a rule with no condition is rejected
        rather than saved to answer every message.

        There is no regular-expression condition, and that is a decision rather
        than an omission: the string a rule matches against is the visitor's own
        message, so a caller-supplied pattern is an unbounded matcher over
        attacker-influenced text.
      properties:
        message_equals:
          type: string
          maxLength: 2048
          description: The whole message, trimmed, compared case-insensitively.
        message_contains:
          type: string
          maxLength: 2048
          description: Case-insensitive substring of the message.
        message_word:
          type: string
          maxLength: 2048
          description: |
            Case-insensitive whole-word occurrence. `cancel` matches "cancel my
            order" and not "cancellation policy", which is what separates it
            from `message_contains`.
        page_url_contains:
          type: string
          maxLength: 2048
          description: |
            Case-insensitive substring of the page the visitor wrote from. A
            message that arrived without a page never matches.
        office_hours:
          type: string
          enum: [open, closed]
          description: |
            Only inside — or only outside — the workspace's business hours. The
            calendar is the union of the agents' saved work schedules, the same
            one the SLA clock uses. A workspace with no saved schedules has no
            calendar, and this condition then matches nothing.

    RuleBotActions:
      type: object
      description: |
        What a matching rule does (FR-MOD-06.6): reply, tag, transfer — or any
        combination. At least one action must be set; a rule that does nothing is
        rejected rather than saved inert.
      properties:
        send_message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Reply to the visitor, authored as the bot.
        add_tag:
          type: string
          minLength: 1
          maxLength: 64
          description: Tag the conversation (created in the tag library if new).
        transfer_to_group_id:
          type: integer
          description: Transfer the conversation to this team.

    RuleBotGroupAssignment:
      type: object
      description: |
        A bot's place in one team, and how eagerly it is tried there. `priority`
        is the same four-tier vocabulary an agent's team membership carries, so
        the word means one thing across the console.
      required: [group_id, priority]
      properties:
        group_id: { type: integer }
        priority:
          type: string
          enum: [primary, first, normal, last]

    RuleBotRule:
      type: object
      description: One condition + action pair belonging to a rule bot (FR-MOD-06.6).
      required: [id, name, conditions, actions, enabled, position, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        conditions: { $ref: "#/components/schemas/RuleBotConditions" }
        actions: { $ref: "#/components/schemas/RuleBotActions" }
        enabled:
          type: boolean
          description: Whether the rule fires. Off keeps it written down without acting.
        position:
          type: integer
          description: Evaluation order within the bot; lower is tried first, and the first match wins.
        created_at: { type: string, format: date-time }

    RuleBot:
      type: object
      description: |
        A deterministic, LLM-free chatbot (FR-MOD-06.6) — separate from the AI
        Agent, tried before it, and reaching no model, embedding or knowledge
        base on any path.
      required: [id, name, enabled, groups, rules, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled:
          type: boolean
          description: Off silences every rule the bot carries without deleting any of them.
        groups:
          type: array
          items: { $ref: "#/components/schemas/RuleBotGroupAssignment" }
        rules:
          type: array
          description: In evaluation order — `position` ascending, then oldest first.
          items: { $ref: "#/components/schemas/RuleBotRule" }
        created_at: { type: string, format: date-time }

    TicketEmailTemplate:
      type: object
      description: |
        A branded, variabled ticket e-mail template (FR-MOD-08.7.5). The subject
        and body may carry `{{ group.field }}` placeholders from the fixed
        variable catalogue; both are validated on save, so a stored template can
        never name a variable the product cannot fill.
      required: [id, name, subject, body, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subject: { type: string }
        body: { type: string }
        enabled:
          type: boolean
          description: Whether agents may pick the template. Off keeps it authored but hidden.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KbCategory:
      type: object
      description: |
        A public KB category (PRD §5.3) — the reader-facing taxonomy an article
        can be filed under. `slug` is unique within the workspace; `position`
        orders the categories for display.
      required: [id, slug, name, position, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        position: { type: integer }
        created_at: { type: string, format: date-time }

    KbArticle:
      type: object
      description: |
        A public KB article (PRD §5.3). `seo_title`/`seo_description` carry the
        "SEO'lu" half of the requirement; `status` the "public" half — an article
        is a draft until an explicit publish, and only `published` articles are
        ever served by the anonymous read path (PUBKB-c). `body` is stored raw
        here; its safe rendering is a later slice (PUBKB-d).
      required:
        [
          id,
          category_id,
          slug,
          title,
          body,
          excerpt,
          seo_title,
          seo_description,
          status,
          published_at,
          ai_audiences,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        slug: { type: string }
        title: { type: string }
        body: { type: string }
        excerpt: { type: string, nullable: true }
        seo_title: { type: string, nullable: true }
        seo_description: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, published]
        published_at: { type: string, format: date-time, nullable: true }
        ai_audiences:
          type: array
          items: { $ref: "#/components/schemas/KnowledgeAudience" }
          description: |
            Who besides the reader may use this article once it is published
            (tm 309 · AI-14-S2): `ai_agent` — the AI's answers to players —
            and `copilot`, the agents' assistant. Both unless switched off; an
            empty list keeps the article out of the AI's knowledge altogether.
            Kept in `[ai_agent, copilot]` order without repeats. A published
            article with audiences is a knowledge source of the store
            (`KnowledgeSource.kb_article_id`), brought to what the article
            says by every save (tm 309.2); unpublished or switched off it is
            no longer found.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KbSettings:
      type: object
      description: |
        The per-workspace KB switch and public address (PRD §5.3). `enabled`
        gates whether the public KB is served at all; `public_slug` is the path
        segment on the shared public host, globally unique across workspaces.
        Both are null/false until an administrator configures them — this is the
        control that first exposes published articles to an anonymous audience.
      required: [enabled, public_slug, site_title, updated_at]
      properties:
        enabled: { type: boolean }
        public_slug: { type: string, nullable: true }
        site_title: { type: string, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    PublicKbArticleSummary:
      type: object
      description: |
        A published KB article as an anonymous reader sees it in a list
        (PUBKB-c). Reader-facing fields only — no `license_id`, no `created_by`,
        no `status` (everything here is published) and no `body` (that is on the
        detail response). `published_at`/`updated_at` are the timestamps a
        sitemap and a reader both use.
      required:
        [
          id,
          category_id,
          slug,
          title,
          excerpt,
          seo_title,
          seo_description,
          published_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid, nullable: true }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string, nullable: true }
        seo_title: { type: string, nullable: true }
        seo_description: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }

    PublicKbArticle:
      description: |
        A published KB article in full (PUBKB-c) — the summary plus its raw
        `body`, which PUBKB-d renders safely. Never carries agent/account
        identity or internal columns.
      allOf:
        - $ref: "#/components/schemas/PublicKbArticleSummary"
        - type: object
          required: [body]
          properties:
            body: { type: string }

    PublicKbCategory:
      type: object
      description: |
        A KB category as an anonymous reader sees it (PUBKB-c) — the reader-facing
        taxonomy, without the `license_id`/`created_at` an admin sees.
      required: [id, slug, name, position]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        position: { type: integer }

    CustomFieldDefinition:
      type: object
      description: |
        A custom field a workspace has defined on tickets or contacts
        (FR-MOD-08.7.6) — an extra field the product does not ship with. The
        two properties that carry the requirement are `type` (how a value is
        validated) and `required` (whether it may be blank).
      required:
        [
          id,
          entity,
          label,
          type,
          required,
          show_in_table,
          options,
          position,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        entity:
          type: string
          enum: [ticket, contact]
          description: What the field hangs off.
        label: { type: string }
        type:
          type: string
          enum: [text, number, boolean, date, select, multiselect, topic]
          description: |
            How a value is validated. Immutable once set. `select`,
            `multiselect` and `topic` pick from `options` (WG-04); a `topic`
            is a pre-chat question whose choice may route the conversation to a
            team, at most one per workspace.
        required:
          type: boolean
          description: When true, a value may not be left blank.
        form_placement:
          type: string
          enum: [pre_chat, post_chat, ticket, prospect]
          nullable: true
          description: |
            Which of the widget's four forms also asks this field
            (FR-MOD-08.7.7), or null for a CRM-only field: `pre_chat` before the
            conversation starts, `post_chat` once it ends, and — on the offline
            "leave a message" screen — `prospect` about the person and `ticket`
            about the request.

            A placement implies the `entity`, and the two must agree: the three
            forms that ask a visitor about themselves are `contact` fields, and
            the `ticket` form is a `ticket` field, so its answers land on the
            ticket the message opens.
        show_in_table:
          type: boolean
          description: |
            When true, this field also renders as a row-inline column on the
            Contacts table (FR-MOD-03.2.3), rather than only in the
            Details/CRM panel. Only a `contact` field may set this; a
            `ticket` one is a 400. Defaults to false.
        options:
          type: array
          nullable: true
          maxItems: 50
          items: { $ref: "#/components/schemas/CustomFieldOption" }
          description: The choices of a choice type, in order; null for any other type.
        position:
          type: integer
          minimum: 0
          description: |
            Order within its form (or among the entity's CRM-only fields), 0
            first. Lists and the widget read fields in this order.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WidgetFormField:
      type: object
      description: |
        One row of a widget form (FR-MOD-08.7.7) as the widget needs to render
        it: the label to prompt with, the `type` that picks the input and
        validates the answer, whether it is required, and the definition id the
        answer is written back under. The same shape for both placements.
      required: [definition_id, label, type, required]
      properties:
        definition_id: { type: string, format: uuid }
        label: { type: string }
        type:
          type: string
          enum: [text, number, boolean, date, select, multiselect, topic]
        required: { type: boolean }
        options:
          type: array
          description: |
            The choices of a choice type, in order (WG-04). Never carries a
            topic's team: the visitor picks a topic, not a queue.
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }

    CustomFieldOption:
      type: object
      description: |
        One choice of a `select` / `multiselect` / `topic` field (WG-04).
        `value` is stored and stays put when the label is reworded; a
        multiselect answer is a JSON array of values.
      required: [value, label]
      properties:
        value: { type: string, minLength: 1, maxLength: 80 }
        label: { type: string, minLength: 1, maxLength: 80 }
        target_group_id:
          type: integer
          format: int64
          nullable: true
          description: |
            A topic's routing: the team a conversation opened with this choice
            goes to. Only on a `topic` field. A team deleted since is ignored
            and the routing rules decide.

    CustomFieldValue:
      type: object
      description: |
        A custom field as it appears on one entity (FR-MOD-08.7.6): the
        definition's metadata joined with the stored value, or null when nothing
        is set. One entry per definition, so a defined-but-empty field still
        shows.
      required: [definition_id, label, type, required, value, show_in_table]
      properties:
        definition_id: { type: string, format: uuid }
        label: { type: string }
        type:
          type: string
          enum: [text, number, boolean, date, select, multiselect, topic]
        options:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/CustomFieldOption" }
          description: The definition's choices, so a stored value can be shown by its label.
        required: { type: boolean }
        value:
          type: string
          nullable: true
          description: The stored value in canonical form, or null when unset.
        form_placement:
          type: string
          enum: [pre_chat, post_chat, ticket, prospect]
          nullable: true
          description: |
            Carried through from the definition (FR-MOD-13.2): lets a reader —
            the Traffic visitor 360° panel — tell a form answer apart from a
            plain CRM field without a second lookup. On a `ticket` field this is
            either `ticket`, a question the visitor answered when they left the
            message, or null for a field only an agent fills in.
        show_in_table:
          type: boolean
          description: |
            Carried through from the definition (FR-MOD-03.2.3): whether this
            field also renders as a row-inline column on the Contacts table.
            Always false on a `ticket` field.

    CustomFieldValuesInput:
      type: object
      description: |
        A map of custom field definition id → value, where null clears a field.
        Each value is validated against its definition (type + required); a
        wrong type or a blank on a required field is a 400.
      required: [values]
      properties:
        values:
          type: object
          additionalProperties:
            type: string
            nullable: true

    AppInstallation:
      type: object
      description: |
        A connected marketplace app (FR-MOD-09.1 / 09.2), as stored for a
        workspace. How it was connected shows in which of the two identity
        fields is meaningful: an OAuth install carries the account label the
        grant returned and a null `api_key_last_four`; an API-key install
        carries the masked key in both, because a pasted key names no account.
      required:
        [
          app_id,
          status,
          live,
          external_account,
          scopes,
          connected_at,
          api_key_last_four,
          automation,
        ]
      properties:
        app_id: { type: string }
        status:
          type: string
          enum: [connected, needs_reconnect]
          description: |
            `needs_reconnect` (tm 263): the card has since gone live and this
            installation predates it — it holds only a hash of the old key,
            which cannot be presented to the provider. Kept, not deleted; a new
            key replaces it.
        live:
          type: boolean
          description: |
            Verified against the real provider and holding an encrypted
            credential (tm 263); false for every mock install.
        external_account:
          type: string
          description: |
            The account label the (mock) OAuth grant returned, or the masked key
            (`••••abcd`) for an API-key install — what the card shows to say
            *which* connection this is.
        scopes:
          type: array
          items: { type: string }
          description: Permissions granted — the app's requested scopes.
        connected_at: { type: string, format: date-time }
        api_key_last_four:
          description: |
            The last four characters of the stored API key, or null for an OAuth
            install. The key itself is held only as a hash and is never returned
            by any endpoint — this is the whole of what a client may learn about
            it, so a rotated key is recognisable without being usable.
          oneOf:
            - type: string
              minLength: 4
              maxLength: 4
            - type: "null"
        automation:
          description: |
            Live figures for an automation card (FR-MOD-09.4) — Zapier and Make
            — and null for every other kind of app. `triggers` counts the
            enabled webhook subscriptions attached to this card; `last_run_at`
            is the newest **successful** delivery made through one of them, or
            null when none has been. The two are independent: a card can have
            triggers wired and nothing to report yet.
          oneOf:
            - $ref: "#/components/schemas/AppAutomationStats"
            - type: "null"

    AppAutomationStats:
      type: object
      required: [triggers, last_run_at]
      properties:
        triggers: { type: integer, minimum: 0 }
        last_run_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    AppListItem:
      type: object
      description: |
        A marketplace card (FR-MOD-09.1 / 09.2) joined with whether this
        workspace has connected it. `installation` carries the connected account
        when `installed` is true, and is null otherwise. `channel` is set for a
        channel-typed app managed in Settings → Channels (09.2), which is set up
        there rather than connected here — for those, `installed` is always false.
      required:
        [
          id,
          name,
          category,
          provider,
          icon,
          description,
          scopes,
          channel,
          collections,
          pricing,
          placement,
          installed,
          installation,
          live_available,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        category:
          type: string
          enum: [crm, support, ecommerce, payments, marketing, productivity, analytics, channels]
        provider:
          type: string
          enum: [oauth, api_key]
        icon: { type: string }
        description: { type: string }
        scopes:
          type: array
          items: { type: string }
          description: Permissions the app asks for, shown on the consent step.
        channel:
          description: |
            The channel this app is managed as in Settings → Channels, or null
            for a data app connected in the marketplace (09.2).
          oneOf:
            - type: string
              enum:
                [website_widget, email, messenger, twilio, whatsapp, instagram, telegram, chat_page]
            - type: "null"
        collections:
          type: array
          items:
            type: string
            enum: [by_text, ai_powered, new, staff_picks]
          description: The curated collection tabs this card belongs to (FR-MOD-09.1).
        pricing:
          type: string
          enum: [free, paid]
          description: The card's pricing model (FR-MOD-09.1).
        placement:
          type: string
          enum: [details, fullscreen, messagebox]
          description: Where the connected card's data is meant to surface (FR-MOD-09.1).
        installed: { type: boolean }
        installation:
          oneOf:
            - { $ref: "#/components/schemas/AppInstallation" }
            - { type: "null" }
        live_available:
          type: boolean
          description: |
            This deployment connects the card to its real provider (tm 263: it
            has a verifier and `APPS_LIVE_PROVIDERS` names it). False keeps the
            demo mock.

    AppOAuthStart:
      type: object
      description: The result of starting the (mock) OAuth flow (FR-MOD-09.1).
      required: [authorize_url, state]
      properties:
        authorize_url:
          type: string
          description: Where to send the user to grant permission (mocked).
        state:
          type: string
          description: Opaque value echoed back on the callback to bind the two steps.

    AppChatData:
      type: object
      description: |
        A connected app's (mock) data for one conversation's customer
        (FR-MOD-09.1) — what the agent reads in the Details pane.
      required: [app_id, app_name, icon, data_label, fields, live]
      properties:
        app_id: { type: string }
        app_name: { type: string }
        icon: { type: string }
        data_label: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
        live:
          type: boolean
          description: |
            True when `fields` came from the provider itself (tm 263); false for
            demo data.
        unavailable:
          type: boolean
          enum: [true]
          description: |
            Set on a live card whose provider could not be read just now;
            `fields` is then empty — never demo values.

    Session:
      type: object
      description: |
        The account and the workspaces it may sign in to. Deliberately carries
        no tokens: the caller picks a workspace and continues through
        `/auth/authorize`, so one code path issues credentials rather than
        three.
      required: [account, memberships]
      properties:
        account:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            name: { type: string }
        memberships:
          type: array
          items:
            type: object
            required: [license_id, organization_id, organization_name, role]
            properties:
              license_id: { type: string }
              organization_id: { type: string, format: uuid }
              organization_name: { type: string }
              role: { $ref: "#/components/schemas/AgentRole" }
              license_status: { type: string }
              client_id:
                type: string
                nullable: true
                description: |
                  The workspace's OAuth client. Returned so the agent app does
                  not have to derive one from the organisation name — which had
                  no answer for a workspace created through signup, and
                  collided for two organisations sharing a first word.

    NeutralMessage:
      type: object
      description: |
        An answer that is the same whatever happened behind it (tm 257.7) — a
        sign-up to a new or a taken address, a resend to an address with or
        without an account. What differs goes to the mailbox, after the answer.
      required: [message]
      properties:
        message:
          type: string
          example: Check your inbox to continue.

    AgentRole:
      type: string
      enum: [owner, viceowner, admin, team_lead, agent]
      description: |
        A member's role in the workspace, highest first (`@siyahtus/types`
        `AGENT_ROLES`, RL-01): `owner` (Kurucu, exactly one), `admin`
        (Yönetici), `team_lead` (Ekip Lideri), `agent` (Ekip Üyesi).
        `viceowner` is the old vice owner, which no new assignment offers (K6):
        its holders become `admin`. A `team_lead` ranks below `admin`, so
        nothing an admin-only endpoint guards is open to one.

    InvitationRole:
      type: string
      enum: [admin, team_lead, agent]
      description: |
        The roles an invitation may carry (`INVITATION_ROLES`): `owner` is not
        invitable — ownership transfers deliberately, not by an email someone
        can forward — and `viceowner` is offered to nobody new (K6).

    MatrixRole:
      type: string
      enum: [owner, admin, team_lead, agent]
      description: |
        A column of the permission matrix (`@siyahtus/types` `MATRIX_ROLES`,
        RL-02): Kurucu, Yönetici, Ekip Lideri, Ekip Üyesi. A `viceowner` reads
        the `admin` column until the role is retired; a role the matrix does
        not know reads `agent`.

    CapabilityValue:
      type: string
      enum: ["off", "on", none, own, team, all]
      description: |
        A matrix cell's value: a switch is `off`/`on`; a visibility row takes
        the levels its `values` list — nothing, the chats the person is
        assigned to or has joined, their teams', the whole workspace.

    CapabilityGroup:
      type: string
      enum: [chats, customers, ai, reports, team, settings, billing, logs]
      description: The matrix's row groups, in the order the screen draws them.

    CapabilityLock:
      type: string
      enum: [owner_column, owner_only, below_floor]
      description: |
        Why a cell cannot be changed: the Kurucu column is locked whole (the one
        person who changes the matrix cannot switch off their own way back
        into it), a Founder-only row is on for the Founder and off for everyone
        else, and a role below the row's `floor_role` holds its weakest value —
        platform safety, not a workspace choice.

    CapabilityValues:
      type: object
      additionalProperties: { $ref: "#/components/schemas/CapabilityValue" }
      description: |
        Every capability's resolved value, by key (`chats.view` → `team`). What
        a capability with no scope of its own — `chats.view`'s `own` level, or
        seeing a player's email and username (`customers.contact.view`) — is
        checked against.

    PermissionCell:
      type: object
      required: [role, value, default, lock]
      properties:
        role: { $ref: "#/components/schemas/MatrixRole" }
        value:
          allOf: [{ $ref: "#/components/schemas/CapabilityValue" }]
          description: What the role holds in this workspace.
        default:
          allOf: [{ $ref: "#/components/schemas/CapabilityValue" }]
          description: |
            What it holds in a workspace that never changed the cell. A value
            that differs from it is the workspace's choice; setting it back
            removes the choice, so a later change of default reaches the cell.
        lock:
          allOf: [{ $ref: "#/components/schemas/CapabilityLock" }]
          nullable: true

    PermissionCapability:
      type: object
      required: [key, group, values, floor_role, owner_only, cells]
      properties:
        key:
          type: string
          description: |
            The capability (`reports.view`). The web catalogue labels it
            `permissions.capability.<key>`.
        group: { $ref: "#/components/schemas/CapabilityGroup" }
        values:
          type: array
          items: { $ref: "#/components/schemas/CapabilityValue" }
          description: The values a cell may take, weakest first.
        floor_role:
          allOf: [{ $ref: "#/components/schemas/MatrixRole" }]
          description: The lowest role that may hold more than the weakest value.
        owner_only:
          type: boolean
          description: Founder only — the whole row is locked.
        cells:
          type: array
          items: { $ref: "#/components/schemas/PermissionCell" }
          description: One per matrix column, in `roles` order.

    PermissionMatrix:
      type: object
      required: [version, roles, capabilities]
      properties:
        version:
          type: integer
          description: |
            The matrix's revision: 0 until it is first changed, plus one for
            every change that moved a stored cell.
        roles:
          type: array
          items: { $ref: "#/components/schemas/MatrixRole" }
          description: The columns, in the order the screen draws them.
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/PermissionCapability" }
          description: The rows, grouped, in catalogue order.

    PermissionChange:
      type: object
      required: [role, capability, value]
      properties:
        role: { $ref: "#/components/schemas/MatrixRole" }
        capability: { type: string, maxLength: 64 }
        value: { $ref: "#/components/schemas/CapabilityValue" }

    PermissionMatrixUpdate:
      type: object
      required: [changes, reason]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/PermissionChange" }
          description: |
            The cells to set — each at most once. A cell set to its default
            stops being the workspace's choice; a locked cell accepts only the
            value it already holds (sending a whole row back is not an error).
        reason:
          allOf: [{ $ref: "#/components/schemas/HighRiskReason" }]
          description: |
            Why (RL-02-S5). **Required here**, unlike the older high-risk
            writes: this endpoint is new, so no integration predates it, and
            every change of who may do what is filed with its reason.

    InvitationGroup:
      type: object
      required: [group_id]
      properties:
        group_id: { type: integer, format: int64 }
        lead:
          type: boolean
          default: false
          description: Whether the invitee leads this team once they join (RL-04-S1).

    Invitation:
      type: object
      required: [id, email, role, groups, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/InvitationRole" }
        groups:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/InvitationGroup"
            required: [group_id, lead]
          description: |
            The teams the invitee joins on accepting, and which they lead
            (RL-04), in team id order. Empty: none — they join no team until
            someone adds them to one.
        invited_by_name: { type: string, nullable: true }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        accept_url:
          type: string
          nullable: true
          description: |
            The shareable link, returned **only** in the response that creates
            the invitation. Listing invitations later does not re-expose it: the
            token is stored as a hash, so there is nothing to re-expose, and a
            list endpoint that handed out working links would turn read access
            to the team page into workspace access.

    Ticket:
      type: object
      required: [id, subject, status, priority, created_at]
      properties:
        id: { type: string, maxLength: 12 }
        subject: { type: string }
        status:
          type: string
          enum: [open, pending, solved, closed, spam]
        priority:
          type: integer
          description: |
            Queue priority (FR-MOD-13.6). Higher is more urgent; 0 is the
            default. Bounded to [-100, 100].
        assignee_id: { type: string, format: uuid, nullable: true }
        assignee_name: { type: string, nullable: true }
        group_id: { type: integer, format: int64, nullable: true }
        customer_id: { type: string, format: uuid, nullable: true }
        customer_name:
          type: string
          nullable: true
          description: Null for a visitor who never introduced themselves.
        customer_email:
          type: string
          nullable: true
          description: Null when the caller's role may not see a player's contact details (`customers.contact.view`).
        customer_has_email:
          type: boolean
          description: |
            Whether the customer left an address — whether a status change can
            e-mail them (`email_template_id`). True also when `customer_email`
            is masked.
        source_chat_id:
          type: string
          nullable: true
          maxLength: 12
          description: The conversation this followed on from, if any.
        source_thread_id:
          type: string
          nullable: true
          maxLength: 12
          description: |
            The connection the ticket was opened from — the chat's newest when
            it was created (`source_chat_id` is the member's day, this is one
            connection inside it). Null off a chat, and on tickets created before
            it was recorded. Panelde: Chat ID (bağlantı); `source_chat_id` is
            Panelde: Thread ID (günlük).
        merged_into_id:
          type: string
          nullable: true
          maxLength: 12
          description: |
            The primary ticket this one is folded into (FR-MOD-13.6), or null
            when it stands alone. A merged ticket is hidden from the lists.
        related_ticket_id:
          type: string
          nullable: true
          maxLength: 12
          description: |
            The earlier ticket this one follows on from (HD-03 · tm 358): the
            player answered a ticket that was closed, or quiet longer than the
            workspace's reopen window (`ticket_reopen_window_days`), so the
            answer opened this one instead of reopening that one. Null otherwise.
        last_message_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [followers, merged_ticket_ids, tags, custom_fields]
          properties:
            source_chat:
              nullable: true
              description: |
                A snapshot of the conversation the ticket came from, so an agent
                picking the ticket up has the context without hunting for it.
              type: object
              required: [id, active]
              properties:
                id: { type: string, maxLength: 12 }
                active: { type: boolean }
                created_at: { type: string, format: date-time }
            followers:
              type: array
              description: Agents watching this ticket without owning it (FR-MOD-13.6).
              items:
                type: object
                required: [account_id]
                properties:
                  account_id: { type: string, format: uuid }
                  name: { type: string, nullable: true }
            merged_ticket_ids:
              type: array
              description: Ids of the tickets merged into this one (empty unless it is a primary).
              items: { type: string, maxLength: 12 }
            tags:
              type: array
              description: Tag names on the ticket — what a ticket rule's "add tag" writes (FR-MOD-08.6.2).
              items: { type: string }
            custom_fields:
              type: array
              description: Custom fields defined for tickets, with this ticket's values (FR-MOD-08.7.6).
              items: { $ref: "#/components/schemas/CustomFieldValue" }

    TicketMessageAttachment:
      type: object
      description: |
        One file on a ticket message (HD-01). `key` is the storage key — an
        upload's (`POST /uploads`) on a reply or note, a file the player
        e-mailed on their message (tm 357, served only through
        `GET /tickets/{ticketId}/messages/{messageId}/attachments/{attachmentKey}`).
        Only a `clean` file is offered for download or mailed. A `sensitive`
        file (an ID document, a bank statement) is drawn behind a click, and
        `locked` when the caller's role may not open it.
      required: [key, name, size, mime, scan_status, sensitive]
      properties:
        key: { type: string, maxLength: 512 }
        name: { type: string, maxLength: 255 }
        size: { type: integer, minimum: 0 }
        mime: { type: string, maxLength: 255 }
        scan_status:
          type: string
          enum: [pending, clean, infected]
        sensitive: { type: boolean }
        purged:
          type: boolean
          description: |
            The bytes were deleted under the workspace's conversation retention
            window — a sensitive file goes when the window does. The entry
            stays so the thread still says a file was there.
        locked:
          type: boolean
          description: |
            Set on a read, for this caller: the file is sensitive and their
            role does not hold `customers.documents.view`, so the download
            refuses it.

    InboundEmail:
      type: object
      description: |
        A received e-mail as the inbound webhook takes it (tm 357 · HD-02):
        provider-neutral, so a Postmark, Mailgun, SendGrid or SES parse hook is
        translated into it by an adapter rather than accepted raw. Only `to`,
        `from` and `subject` are required — a mail with no body still opens a
        ticket.
      required: [to, from, subject]
      properties:
        to:
          type: string
          maxLength: 320
          description: |
            The recipients the mail was addressed to — the workspace forwarding
            address, or the ticket reply address a reply went out with
            (`<organization_id>+t-<ticket>-<signature>@<inbound-domain>`, HD-03).
            Several may be listed, comma separated.
        cc:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 320 }
          description: |
            Other recipients. A ticket reply address here threads the mail
            like one in `to` (a player who answered "reply all").
        delivered_to:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 320 }
          description: |
            The envelope recipient(s) — `Delivered-To`, or the provider's
            "original recipient". The address this delivery is for, so it
            decides the workspace ahead of `to` and `cc`; the first
            workspace address among `delivered_to`, `to`, `cc` routes the mail.
        from:
          type: string
          maxLength: 320
          description: Sender, bare or `Name <addr>`. Matched to a customer by email.
        subject:
          type: string
          maxLength: 998
          description: Becomes the ticket subject.
        text:
          type: string
          maxLength: 2000000
          description: |
            The plain-text part. The quoted earlier mail and the signature are
            cut from what the thread shows; the whole text stays behind "show
            full message". Each is kept to 100 000 characters.
        html:
          type: string
          maxLength: 5000000
          description: |
            The HTML part, when the mail had one. Sanitised against an allow
            list before it is kept — no script, style, iframe, form or event
            handler, links only to http(s) and mailto, remote images parked
            under `data-src` — and the text is derived from it when `text` is
            absent.
        message_id:
          type: string
          maxLength: 998
          description: |
            The mail's `Message-ID`. One Message-ID is one message per
            workspace: a redelivery is answered `duplicate`.
        in_reply_to:
          type: string
          maxLength: 998
          description: |
            The mail's `In-Reply-To`. When it names a message of a ticket — a
            reply that went out, or the player's earlier mail — the mail is
            added to that ticket (HD-03), even with the reply address gone.
        references:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 998 }
          description: The mail's `References`, oldest first — looked up newest first after `in_reply_to`.
        headers:
          type: object
          description: |
            The auto-reply headers (HD-03 loop guard). `auto_submitted` other
            than `no`, any `x_autoreply`, `precedence` `bulk`, `junk` or
            `auto_reply`, or any `x_auto_response_suppress` marks the mail
            automated: on a ticket it is only a system line — no reopening, no
            new ticket, nothing is ever sent back to it.
          properties:
            auto_submitted: { type: string, maxLength: 200 }
            precedence: { type: string, maxLength: 200 }
            x_autoreply: { type: string, maxLength: 200 }
            x_auto_response_suppress: { type: string, maxLength: 200 }
        attachments:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/InboundEmailAttachment" }
        spam:
          type: boolean
          description: The provider's spam verdict, honoured when the workspace filter is on.

    InboundEmailAttachment:
      type: object
      description: |
        One file on an inbound mail, inline. Accepted: PNG, JPEG, GIF, WebP and
        PDF whose bytes match the type, up to 10 MiB each and 25 MiB a mail,
        that pass the virus scan. Anything else is not stored and the ticket
        says so in a system line.
      required: [filename, content_type, content_base64]
      properties:
        filename: { type: string, maxLength: 255 }
        content_type: { type: string, maxLength: 255 }
        size:
          type: integer
          minimum: 0
          description: The provider's count of the decoded bytes; the decoded length is what is checked.
        content_base64: { type: string, maxLength: 36000000 }

    TicketMessage:
      type: object
      description: |
        One entry in a ticket's conversation (HD-01 · tm 356), oldest first in
        `GET /tickets/{ticketId}/messages`.

        - `customer_message` — what the player wrote (an inbound e-mail, the
          ticket's opening text).
        - `agent_reply` — an agent's answer, sent to the player by e-mail;
          `delivery_status` says where that e-mail is.
        - `internal_note` — for the team only. Never e-mailed and never shown
          to the player; `delivery_status` is always null on it.
        - `system` — a line the product wrote (a merge, a reopening).

        `ticket_id` is the ticket the message was written on: a primary's
        thread also shows the messages of the tickets merged into it, and this
        says which one each came from.
      required:
        [
          id,
          ticket_id,
          kind,
          author_type,
          author_id,
          author_name,
          body_text,
          body_text_full,
          attachments,
          delivery_status,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, maxLength: 12 }
        kind:
          type: string
          enum: [customer_message, agent_reply, internal_note, system]
        author_type:
          type: string
          enum: [customer, agent, system, bot]
        author_id:
          type: string
          format: uuid
          nullable: true
          description: The agent's account for `agent`, the customer for `customer`; null for `system` and `bot`.
        author_name:
          type: string
          nullable: true
          description: The agent's or the player's name as it reads now; null when there is none.
        body_text:
          type: string
          description: |
            The text, with card numbers masked. A reply or note is at most
            20 000 characters. On an inbound e-mail it is what the player
            wrote this time — the quoted earlier mail and the signature cut —
            at most 100 000 characters.
        body_text_full:
          type: string
          nullable: true
          description: |
            Only on a `customer_message` from e-mail, and only when something
            was cut from `body_text`: the whole text as it arrived (masked
            alike), for "show full message" — cutting a quote is a guess, so
            the original is kept beside it.
        body_html:
          type: string
          nullable: true
          description: |
            Only on a `customer_message` that arrived as HTML, and only after
            sanitising at intake against an allow list. Still not markup to
            put in a page: the console draws `body_text`, and offers this as
            "formatted view" in a frame with an empty `sandbox` and a CSP that
            loads nothing.
        attachments:
          type: array
          items: { $ref: "#/components/schemas/TicketMessageAttachment" }
        delivery_status:
          type: string
          nullable: true
          enum: [queued, sent, failed, suppressed, null]
          description: |
            Only on an `agent_reply`. `queued` — saved, the e-mail goes after
            the commit · `sent` — the mail server took it · `failed` — it did
            not; the console offers "try again" · `suppressed` — this
            deployment keeps ticket e-mail off (K23), the reply is kept and the
            thread says it was not sent.
        sender_mismatch:
          type: boolean
          description: |
            Present, and true, on a `customer_message` that reached the ticket
            from an address other than its player's (HD-03): a reply address or
            a thread reference matched, the sender did not. The message is
            kept; the console warns before anyone acts on it.
        created_at: { type: string, format: date-time }

    TicketMessageInput:
      type: object
      description: |
        What the composer sends (HD-01). `kind: reply` goes to the player by
        e-mail; `kind: note` stays with the team and never reaches the mail
        path. `idempotency_key` makes a retried request one message: the same
        key on the same licence answers with the message already stored.
      required: [kind, text, idempotency_key]
      properties:
        kind:
          type: string
          enum: [reply, note]
        text: { type: string, minLength: 1, maxLength: 20000 }
        attachment_keys:
          type: array
          maxItems: 10
          description: Storage keys of files uploaded through `POST /uploads` for this licence.
          items: { type: string, maxLength: 512 }
        set_status:
          type: string
          enum: [pending, solved]
          description: |
            "Send and …": the status the ticket moves to in the same request.
            Without it a reply leaves the ticket `pending` (waiting on the
            player) and a note leaves the status as it was.
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }

    TicketBulkRowResult:
      type: object
      description: |
        One selected ticket's verdict, in request order. `reason` is null when
        the ticket changed and names the refusal otherwise — it is a closed
        vocabulary so a client can react to it rather than parse a sentence.
      required: [ticket_id, status, reason]
      properties:
        ticket_id: { type: string, maxLength: 12 }
        status:
          type: string
          enum: [updated, skipped]
        reason:
          type: string
          nullable: true
          enum: [not_found, merged, null]
          description: |
            `not_found` covers another workspace's ticket, one outside the
            caller's teams and one that never existed alike — telling them
            apart would confirm an id exists (NFR-S5). `merged` is a ticket
            folded under a primary, which `PATCH` refuses for the same reason.

    TicketBulkResult:
      type: object
      description: The report for one bulk action over the Tickets grid (FR-MOD-02.7.1).
      required: [updated, failed, results]
      properties:
        updated: { type: integer, description: Tickets actually written. }
        failed: { type: integer }
        results:
          type: array
          description: One entry per requested id, in request order.
          items: { $ref: "#/components/schemas/TicketBulkRowResult" }

    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/CustomerSummary"
        - type: object
          required: [visits, chats, custom_fields, visits_count, groups]
          properties:
            banned_at: { type: string, format: date-time, nullable: true }
            custom_fields:
              type: array
              description: Custom fields defined for contacts, with this contact's values (FR-MOD-08.7.6).
              items: { $ref: "#/components/schemas/CustomFieldValue" }
            visits_count:
              type: integer
              description: |
                The true total, unlike `visits` below which is capped at the
                most recent entries — a returning visitor's real count cannot
                be read from the truncated array (FR-MOD-13.2).
            groups:
              type: array
              description: |
                Teams this visitor's conversations have been routed to
                (FR-MOD-13.2), deduplicated. Empty for a visitor with no chats.
              items:
                type: object
                required: [id, name]
                properties:
                  id: { type: integer, format: int64 }
                  name: { type: string }
            visits:
              type: array
              description: Most recent first.
              items: { $ref: "#/components/schemas/Visit" }
            chats:
              type: array
              items:
                type: object
                required: [id, active, created_at]
                properties:
                  id: { type: string }
                  active: { type: boolean }
                  created_at: { type: string, format: date-time }
                  last_event_at: { type: string, format: date-time, nullable: true }
                  connections:
                    type: array
                    description: |
                      The day's connections (`threads`), oldest first, newest 20 at most —
                      the profile reads "day → connection" (ID-05). `id` above is the day
                      (Panelde: Thread ID, günlük); each connection's `id` here is
                      Panelde: Chat ID (bağlantı).
                    items:
                      type: object
                      required: [id, active, created_at]
                      properties:
                        id: { type: string, maxLength: 12 }
                        active: { type: boolean }
                        created_at: { type: string, format: date-time }

    Visit:
      type: object
      required: [id, started_at, pages]
      properties:
        id: { type: string, format: uuid }
        came_from:
          type: string
          nullable: true
          description: Referring URL, when the browser sent one.
        pages:
          type: array
          description: Pages seen during the visit, in order.
          items:
            type: object
            properties:
              url: { type: string }
              at: { type: string, format: date-time }
        os: { type: string, nullable: true }
        browser: { type: string, nullable: true }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }

    Agent:
      type: object
      required: [id, name, email, role, routing_status, concurrent_chats_limit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        public_name:
          type: string
          nullable: true
          description: |
            What visitors see in the widget instead of `name` (RL-06), set by
            the person on "My profile". `null` means `name` is shown.
        email: { type: string, format: email }
        avatar_url: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/AgentRole" }
        routing_status:
          type: string
          enum: [accepting_chats, not_accepting_chats, offline]
        concurrent_chats_limit:
          type: integer
          description: Routing never assigns past this. Over-limit means queued.
        two_factor_enabled: { type: boolean }
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When this person was last active anywhere in SiyahTuş, coarsened to the
            minute (FR-MOD-04.3.4). Account-wide by design — `accounts` is a
            person, not a membership, so someone who works two workspaces
            carries one timestamp across both. `null` means never seen since the
            column started being written.

            Not the same thing as presence: presence is a live socket and
            disappears when the tab closes, this is a durable stamp. And not the
            per-licence "last sign-in" the access-review report answers with
            (NFR-C6) — that one is read off the audit trail precisely because it
            has to be about *this* workspace.
        suspended:
          type: boolean
          description: |
            A suspended agent is reachable through this list (with
            `status=suspended` or `status=all`) but cannot be assigned work and
            does not occupy a billed seat (FR-MOD-04.6).
        expertise:
          type: array
          description: |
            The expertise areas assigned to this agent (FR-MOD-08.6.3 —
            skill-based routing), ordered by name. Empty when none are set. Set
            wholesale through `PUT /agents/{agentId}/expertise`.
          items: { $ref: "#/components/schemas/Expertise" }

    Expertise:
      type: object
      description: |
        An area of expertise a licence defines for skill-based routing
        (FR-MOD-08.6.3). Called "expertise" at the data layer because "skills" is
        the AI-automation concept; the product surface may still label it a skill.
      required: [id, name, slug]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug:
          type: string
          description: Derived from the name, unique within the licence.

    GroupWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: What an agent picks from a transfer menu, so it is trimmed and bounded.
        language_code:
          type: string
          pattern: "^[a-z]{2}(-[A-Z]{2})?$"
          default: en
          description: |
            Drives language-based routing. ISO 639-1, optionally with a region
            (`en`, `en-GB`) — the shape the column's CHECK constraint enforces,
            so anything else is a 400 rather than a failed write.
        topic_role:
          description: |
            The topic this team's queue is for (AU-01 · K14). At most one team
            per workspace holds a role — naming one another team holds is a 409
            `group_topic_role_taken` with `details.group_id`. `null` clears it.
            Omitted on create: no role. The `responsible_gambling` team keeps
            its role (clearing or changing it is a 409 `group_protected`), must
            require at least one area of expertise — its training — and every
            member must hold all of it (409 `group_expertise_missing` naming
            `details.agent_ids`).
          allOf:
            - $ref: "#/components/schemas/QueueTopicRole"
          nullable: true
        after_hours_mode:
          allOf:
            - $ref: "#/components/schemas/AfterHoursMode"
          default: queue
        assignment_mode:
          description: |
            How the team's conversations reach its agents (WG-07). Omitted on
            create: `auto`. The `responsible_gambling` team is never
            `manual` — naming it there, or giving the role to a manual team,
            is a 400 `validation` with `details.reason: assignment_mode`.
          allOf:
            - $ref: "#/components/schemas/GroupAssignmentMode"
          default: auto
        required_expertise_ids:
          type: array
          maxItems: 20
          items: { type: integer, format: int64 }
          description: |
            The complete set of expertise areas (`Expertise.id`) an agent must
            hold — every one of them — to be given this team's conversations
            and to join it (AU-01). Replaces the current set; `[]` clears it. An
            id that names no area on this licence is a 404. Omitted on create:
            none. The `responsible_gambling` team's set cannot be empty (409
            `group_protected`, `details.reason: required_expertise`).

    QueueTopicRole:
      type: string
      description: |
        A team queue's topic (AU-01 · K14 · `@siyahtus/types`
        `QUEUE_TOPIC_ROLES`). The AI's hand-over, the pre-chat topic and a
        hand-over rule's `{ topic }` target resolve the role, not the team's
        name, so a renamed team still receives its topic.
        `responsible_gambling` has rules of its own (ADR-08a): no fallback
        team, only trained agents, and the team cannot be deleted.
      enum: [finance, kyc_risk, bonus, responsible_gambling, technical, complaint]

    AfterHoursMode:
      type: string
      description: |
        What a team's queue does when nobody is on shift (AU-01;
        `@siyahtus/types` `AFTER_HOURS_MODES`): `queue` — the conversation
        waits for the next agent; `ticket` — it becomes a ticket the player
        is answered on by email (HD-01 / WG-08).
      enum: [queue, ticket]

    GroupAssignmentMode:
      type: string
      description: |
        How a team's conversations reach its agents (WG-07 · `@siyahtus/types`
        `GROUP_ASSIGNMENT_MODES`): `auto` — routing picks the agent (tier,
        load, longest idle); `manual` — routing picks nobody: the
        conversation waits in the team's queue, every member is told
        (`incoming_chat`), and the first to take it
        (`POST /chats/{chatId}/claim`) has it, within their concurrent limit.
        With the workspace's unanswered window set, a conversation nobody has
        taken for that long is reported to the team's leads
        (`chat_unanswered_alert`, reason `unclaimed`) instead of being
        passed on.
      enum: [auto, manual]

    ThreadPriority:
      type: string
      description: |
        How pressing a connection is (ADR-08a · AI-12; `@siyahtus/types`
        `THREAD_PRIORITIES`): `urgent` — self-harm, a suspected minor, a
        self-exclusion request; `high` — a repeat contact the same day, an
        angry player; `normal` — the rest. A team's queue serves the most
        pressing first, then the longest waiting. Stored as a rank
        (`threads.priority`), so it never sorts by spelling.
      enum: [urgent, high, normal]

    HandoffRouteMatchType:
      type: string
      description: |
        What a hand-over route matches (AI-12; `@siyahtus/types`
        `HANDOFF_ROUTE_MATCH_TYPES`): `topic` — a routing topic, one of the
        queue roles (`QueueTopicRole`); `reason` — the reason the AI handed
        the conversation over, a catalogue code (`guardrail_self_harm`,
        `repeat_same_day`, …; `HANDOFF_REASONS`).
      enum: [topic, reason]

    HandoffRoute:
      type: object
      description: |
        Which team a conversation goes to for a key (AI-12, shared with
        AU-01). The team is held by id, so renaming it keeps the route. A
        `topic` route refines the team holding that queue role
        (`Group.topic_role`): one brand's route first, then the every-brand
        route, then the role's team. Human routing reads the routes live;
        the AI's hand-over reads them from its published configuration
        (ADR-14b §2.12).
      required:
        [
          id,
          brand_id,
          match_type,
          match_key,
          group_id,
          required_expertise_id,
          default_priority,
          active,
          created_by,
          updated_by,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        brand_id:
          type: string
          format: uuid
          nullable: true
          description: The brand the route is for; null for every brand.
        match_type: { $ref: "#/components/schemas/HandoffRouteMatchType" }
        match_key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: A `QueueTopicRole` for `topic`, a hand-over reason code for `reason`.
        group_id:
          type: integer
          format: int64
          description: |
            The team. A team deleted later leaves the route in place; the
            hand-over skips it and the console shows it as missing.
        required_expertise_id:
          type: integer
          format: int64
          nullable: true
          description: |
            Only agents with this expertise take a conversation routed here;
            with none available it waits in the team's queue rather than
            reach an untrained agent (AI-12-S3). An expertise deleted later
            is met by nobody.
        default_priority:
          description: The priority a conversation routed here starts with.
          allOf:
            - $ref: "#/components/schemas/ThreadPriority"
        active: { type: boolean }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HandoffRouteCreate:
      type: object
      required: [match_type, match_key, group_id]
      additionalProperties: false
      properties:
        brand_id: { type: string, format: uuid, nullable: true }
        match_type: { $ref: "#/components/schemas/HandoffRouteMatchType" }
        match_key: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        group_id: { type: integer, format: int64, minimum: 1 }
        required_expertise_id: { type: integer, format: int64, minimum: 1, nullable: true }
        default_priority: { $ref: "#/components/schemas/ThreadPriority" }
        active: { type: boolean }

    HandoffRouteUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        group_id: { type: integer, format: int64, minimum: 1 }
        required_expertise_id: { type: integer, format: int64, minimum: 1, nullable: true }
        default_priority: { $ref: "#/components/schemas/ThreadPriority" }
        active: { type: boolean }

    Group:
      type: object
      required:
        [
          id,
          name,
          language_code,
          topic_role,
          after_hours_mode,
          assignment_mode,
          required_expertise_ids,
          accepting_count,
          agents,
        ]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        accepting_count:
          type: integer
          minimum: 0
          description: |
            How many of the team's members are accepting chats right now —
            not suspended, not awaiting approval — whatever their load (IN-04:
            "Finance · 2 online" in the hand-off menu).
        language_code: { type: string }
        topic_role:
          description: The topic this team's queue is for; null for an ordinary team.
          allOf:
            - $ref: "#/components/schemas/QueueTopicRole"
          nullable: true
        after_hours_mode: { $ref: "#/components/schemas/AfterHoursMode" }
        assignment_mode: { $ref: "#/components/schemas/GroupAssignmentMode" }
        required_expertise_ids:
          type: array
          items: { type: integer, format: int64 }
          description: |
            Expertise areas an agent must hold — all of them — to be given this
            team's conversations, in ascending id order. Empty: none.
        agents:
          type: array
          items:
            type: object
            required: [agent_id, priority, lead]
            properties:
              agent_id: { type: string, format: uuid }
              priority:
                type: string
                enum: [primary, first, normal, last]
                description: |
                  Assignment preference within the team (ADR-08). A full tier is
                  skipped rather than queued behind.
              lead:
                type: boolean
                description: |
                  Whether this member leads the team (RL-01,
                  `group_agents.is_lead`). A lead is a member too: they are
                  offered the team's chats like anyone in it.

    RoutingQueue:
      type: object
      description: |
        One topic role and the team whose queue serves it (AU-01 · K14 ·
        ADR-08a). The AI's hand-over, a hand-over rule's `{ topic }` target and
        the pre-chat topic resolve the role, never the team's name, so renaming
        a team does not move its topic. `group_id` is null — and so are the
        team's fields — while no team holds the role.
      required: [topic_role, group_id, group_name, after_hours_mode]
      properties:
        topic_role: { $ref: "#/components/schemas/QueueTopicRole" }
        group_id:
          type: integer
          format: int64
          nullable: true
        group_name:
          type: string
          nullable: true
        after_hours_mode:
          description: What the team's queue does when nobody is on shift; null with no team.
          allOf:
            - $ref: "#/components/schemas/AfterHoursMode"
          nullable: true

    WorkSchedule:
      type: object
      description: |
        An agent's declared weekly availability (PRD §5.3-Vardiya). One slot per
        weekday it lists, in `@siyahtus/types` `WORK_SCHEDULE_DAYS` order; a day with
        no slot is unscheduled. `enabled` distinguishes a day that is off from a
        day whose hours have simply not been set. `@siyahtus/types`
        `normalizeWorkSchedule` is the single validation gate both
        `GET`/`PUT /agents/{agentId}/work-schedule` and the settings form defer
        to, so the endpoint and the form can never disagree about what a valid
        week is. An agent with no stored plan reads back the default week.
      required: [timezone, schedule]
      properties:
        timezone:
          type: string
          description: IANA zone, e.g. "Europe/Istanbul".
        schedule:
          type: array
          items: { $ref: "#/components/schemas/WorkScheduleSlot" }

    WorkScheduleSlot:
      type: object
      required: [day, start, end, enabled]
      properties:
        day:
          type: string
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        start:
          type: string
          description: 24h `HH:MM`.
          example: "09:00"
        end:
          type: string
          description: 24h `HH:MM`.
          example: "18:00"
        enabled:
          type: boolean
          description: False marks the day off without deleting its configured hours.

    UsageSummary:
      type: object
      required: [period, ai_resolutions, api_calls]
      properties:
        period: { type: string, description: "`yyyymm`." }
        ai_resolutions:
          type: object
          required: [used, included, overage, overage_cents, overage_unit, overage_unit_price_cents]
          properties:
            used:
              type: integer
              description: |
                Threads that closed with no agent-authored event and, for
                threads closed from 2026-11-01 on, no automatic hand-off by the
                AI or a rule bot (ADR-09a). The same query backs the
                "automated" figure in reports.
            included: { type: integer }
            overage: { type: integer }
            overage_cents: { type: integer }
            overage_unit:
              type: integer
              description: |
                Pack size the overage is priced in — the "aşım paketi"
                (PRD §10.1.4). A pricing bundle, not a billing quantum: the
                invoice still meters per resolution via `overage_cents`.
            overage_unit_price_cents:
              type: integer
              description: Price of one AI resolution beyond the allowance, in cents.
        api_calls:
          type: object
          required: [used, included, overage, overage_cents, overage_unit, overage_unit_price_cents]
          properties:
            used:
              type: integer
              description: Billed API calls this period (FR-MOD-10.1.5) — one per PAT-authenticated request.
            included: { type: integer }
            overage: { type: integer, description: Calls beyond the included allowance. }
            overage_cents:
              type: integer
              description: |
                Overage charge for the period. Billed by the block, not the call:
                any part of a 100,000 block over the allowance costs one block, so
                this is `ceil(overage / overage_unit) * overage_unit_price_cents`.
            overage_unit:
              type: integer
              description: |
                Block size the overage is billed in — the "$29.50 per 100,000
                extra" block (PRD §10.1.5). Unlike AI resolutions (metered per
                unit), API calls bill by the whole block.
            overage_unit_price_cents:
              type: integer
              description: Price of one 100,000-call block beyond the allowance, in cents.

    SubscriptionView:
      type: object
      required:
        [
          plan,
          status,
          access,
          seats,
          min_seats,
          unit_price_cents,
          billing_cycle,
          usage,
          estimated_total_cents,
          provider,
          pricing,
        ]
      properties:
        plan: { type: string }
        pricing:
          type: string
          enum: [listed, quoted]
          description: |
            Whether `unit_price_cents` is a price this product quotes (`listed`,
            the self-serve tier) or a figure agreed in a contract the product
            never sees (`quoted`, Enterprise — the PRD states its capabilities
            and no price). Show the number for `listed`; show "contact sales"
            for `quoted`. The amounts are still returned either way, because the
            mocked invoice is built from them.
        billing_cycle: { type: string, enum: [monthly, annual] }
        status:
          type: string
          enum: [trialing, active, past_due, read_only, canceled, suspended]
        access:
          type: string
          enum: [trialing, active, read_only]
          description: What the workspace may do right now.
        trial:
          type: object
          properties:
            ends_at: { type: string, format: date-time, nullable: true }
            days_remaining: { type: integer, nullable: true }
        seats:
          type: integer
          description: Purchased seats — what the seat charge is based on.
        min_seats:
          type: integer
          description: Floor for the seats stepper — the count of non-suspended agents.
        unit_price_cents: { type: integer }
        usage: { $ref: "#/components/schemas/UsageSummary" }
        estimated_total_cents:
          type: integer
          description: Charge for the current cycle — the monthly figure, or the annual total when annual. 0 while trialing, and always 0 in the public pilot (`pilot_mode`), which sells nothing.
        annual_savings_cents:
          type: integer
          description: What annual billing saves versus twelve monthly charges. 0 on monthly, while trialing and in the public pilot.
        provider: { type: string, enum: [mock] }

    Entitlement:
      type: string
      description: |
        A capability a commercial tier unlocks (FR-MOD-11.5). Closed
        vocabulary — the plan catalogue, this endpoint and the screens all speak
        it, so a capability cannot be spelled two ways and enforced in one place.

        `sla` is the first-response/resolution target of PRD §5.4, not the
        uptime commitment of NFR-U5: that is a contract term with a billing
        credit, which no code in this repo can promise.
      enum: [white_label, sandbox, sla, sso, hipaa, siem_export]

    EntitlementsView:
      type: object
      description: |
        What the caller's workspace may switch on, and what each tier grants.
      required: [plan, entitlements, plans]
      properties:
        plan:
          type: string
          description: The caller's plan. A workspace with no subscription is on trial and reads as the self-serve tier.
        entitlements:
          type: object
          description: |
            Every entitlement with a yes/no answer. Total by construction: a key
            is never absent, so "missing" can never be read as an implicit yes.
          required: [white_label, sandbox, sla, sso, hipaa, siem_export]
          additionalProperties: false
          properties:
            white_label: { type: boolean, description: Widget served without SiyahTuş branding. }
            sandbox:
              { type: boolean, description: A second, non-billable workspace to test against. }
            sla:
              { type: boolean, description: First-response/resolution targets with breach marking. }
            sso:
              { type: boolean, description: SAML 2.0/OIDC sign-in and SCIM provisioning (NFR-S11). }
            hipaa: { type: boolean, description: Signed-BAA path and US-only hosting (NFR-C4). }
            siem_export:
              { type: boolean, description: Audit trail shipped to an external SIEM (NFR-S12). }
        plans:
          type: array
          description: |
            The tier catalogue — static and identical for every workspace, so a
            screen can name the tier that unlocks a control rather than saying
            "upgrade" with nowhere to point.
          items:
            type: object
            required: [id, pricing, unit_price_cents, ai_resolutions_included, entitlements]
            properties:
              id: { type: string }
              pricing: { type: string, enum: [listed, quoted] }
              unit_price_cents:
                type: integer
                nullable: true
                description: List price per seat per month. Null on a quoted tier — the PRD gives Enterprise no price, and inventing one is not this repo's call.
              ai_resolutions_included:
                type: integer
                nullable: true
                description: Included AI resolutions per month. Null when the contract sets it.
              entitlements:
                type: array
                items: { $ref: "#/components/schemas/Entitlement" }

    Invoice:
      type: object
      description: |
        One billing statement. A closed period is read back from the `invoices`
        table exactly as it was frozen — re-pricing it from today's subscription
        is what `origin` exists to make impossible to do silently. Only the
        current period is computed live, and it says so.
      required:
        [
          number,
          period,
          period_label,
          period_start,
          period_end,
          issued_at,
          origin,
          status,
          currency,
          line_items,
          subtotal_cents,
          total_cents,
        ]
      properties:
        number: { type: string, description: "Invoice number, `SIYAHTUS-<yyyymm>`." }
        period: { type: string, description: "Billing period as `yyyymm`." }
        period_label: { type: string, description: "Friendly period label, e.g. `July 2026`." }
        period_start:
          type: string
          format: date-time
          description: "First instant of the period, UTC."
        period_end:
          type: string
          format: date-time
          description: |
            Exclusive upper bound of the period — the first instant of the next
            month, UTC. Half-open so two consecutive periods cannot both claim
            the same moment.
        issued_at: { type: string, format: date-time }
        origin:
          type: string
          enum: [issued, reconstructed, estimate]
          description: |
            Where the figures come from, so a reader can tell a statement from
            an estimate.

            * `issued` — frozen by the period-close sweep in the period right
              after this one, from the subscription as it stood then. Never
              changes again.
            * `reconstructed` — frozen later, from the records that survive
              (usage rows and package receipts carry their own prices, so those
              lines are exact); the seat line is priced from the subscription as
              it stood when the row was written, because per-period seat history
              was never retained. Never changes again either.
            * `estimate` — the current period, still accruing and computed on
              read. It is not an invoice yet and its figures move with usage.
        status:
          type: string
          enum: [paid, open, trial]
          description: |
            `paid` for a settled past period, `open` for the current one still
            accruing, `trial` when the workspace owed nothing for that period.
            Frozen alongside the rest: a workspace leaving its trial does not
            turn its trial months into paid ones. Every period composed in the
            public pilot (`pilot_mode`) is `trial` — one $0 line, "<plan> plan —
            free during the pilot" — even on a licence activated by hand.
        currency: { type: string, enum: [usd] }
        line_items:
          type: array
          items:
            type: object
            required: [description, amount_cents]
            properties:
              description: { type: string }
              amount_cents: { type: integer }
        subtotal_cents: { type: integer }
        total_cents: { type: integer }

    PaymentMethod:
      type: object
      description: |
        A masked payment method. Billing is mocked (ADR-13) and real card entry
        is out of scope (PRD §11.1/1) — never a full card number.
      required: [brand, last4, exp_month, exp_year, holder_name, updated_at]
      properties:
        brand: { type: string, enum: [visa, mastercard, amex, discover] }
        last4: { type: string, description: "Last four digits — the only card fragment stored." }
        exp_month: { type: integer, minimum: 1, maximum: 12 }
        exp_year: { type: integer }
        holder_name: { type: string }
        updated_at: { type: string, format: date-time }

    ApiPackage:
      type: object
      description: |
        A named, purchasable block of API calls (FR-MOD-09.3). The catalogue is
        static and global — the same three packages for every workspace, never
        filtered or repriced per tenant — so a price change is a code change
        (ADR-13 keeps billing mocked, so there is no provider-side catalogue to
        sync with).

        Distinct from the automatic overage in `UsageSummary.api_calls`: that is
        what a workspace is charged for going past its allowance, this is what it
        buys *before* it does.
      required: [id, name, api_calls, price_cents]
      properties:
        id: { type: string, description: "Catalogue id — `essential`, `pro`, `pro-plus`." }
        name: { type: string }
        api_calls: { type: integer, description: The calls this package adds. }
        price_cents: { type: integer }

    ApiPackagePurchase:
      type: object
      description: |
        One recorded API-package purchase (FR-MOD-09.3). The quota and price are
        the catalogue's values *at the time of sale*, stored on the row rather
        than looked up, so a later price change never rewrites what a workspace
        was charged. `name` is joined from the catalogue for display; a purchase
        of a package that has since left the catalogue still reports its
        `package_id`.
      required: [id, package_id, name, api_calls, price_cents, period, purchased_at]
      properties:
        id: { type: string, format: uuid }
        package_id: { type: string }
        name:
          type: string
          nullable: true
          description: Catalogue name, or null if the package is no longer offered.
        api_calls: { type: integer, description: Calls this purchase added. }
        price_cents: { type: integer }
        period: { type: string, description: "The `yyyymm` period the quota was added to." }
        purchased_at: { type: string, format: date-time }

    ApiPackagePurchaseResult:
      type: object
      description: |
        What a purchase produced: the receipt, and the period's usage as it
        stands after the calls were credited (FR-MOD-09.3).

        `usage` is returned rather than left to a follow-up `GET /billing/usage`
        because the whole point of the purchase is the raised allowance — a
        client that has to ask again can render the old number in between, and
        the two reads can disagree if anything is metered between them. This one
        is read inside the same transaction that credited the quota.
      required: [purchase, usage]
      properties:
        purchase: { $ref: "#/components/schemas/ApiPackagePurchase" }
        usage: { $ref: "#/components/schemas/UsageSummary" }

    AiResolutionPackage:
      type: object
      description: |
        The AI-resolution overage pack on sale, and the terms a purchase must
        respect (FR-MOD-10.1.4, PRD §10.1.4's "aşım paketi").

        Not a catalogue of tiers like `ApiPackage`: the PRD sells AI overage as
        one pack bought in a quantity, which is why a purchase carries a count
        and the meter carries a stepper. `max_packs` is the ceiling the server
        enforces on one purchase — published so a client's stepper stops where
        the endpoint does instead of offering a quantity that 400s.

        The price is derived from the same per-resolution rate
        `UsageSummary.ai_resolutions.overage_unit_price_cents` quotes and the
        invoice bills overage at, so a pack can never be sold at a price the
        meter does not show (ADR-09 — one source).
      required: [resolutions_per_pack, unit_price_cents, pack_price_cents, max_packs]
      properties:
        resolutions_per_pack:
          type: integer
          description: Resolutions one pack adds to this period's allowance.
        unit_price_cents:
          type: integer
          description: Price of one resolution beyond the allowance.
        pack_price_cents:
          type: integer
          description: "`resolutions_per_pack` × `unit_price_cents`."
        max_packs:
          type: integer
          description: The most packs one purchase may buy.

    AiPackagePurchase:
      type: object
      description: |
        One recorded AI-pack purchase (FR-MOD-10.1.4). `resolutions` and
        `price_cents` are what was actually sold, stored on the row rather than
        recomputed, so a later change to the pack size or the overage rate never
        rewrites what a workspace was charged.
      required: [id, packs, resolutions, price_cents, period, purchased_at]
      properties:
        id: { type: string, format: uuid }
        packs: { type: integer }
        resolutions: { type: integer, description: Resolutions this purchase added. }
        price_cents: { type: integer }
        period: { type: string, description: "The `yyyymm` period the quota was added to." }
        purchased_at: { type: string, format: date-time }

    AiPackagePurchaseResult:
      type: object
      description: |
        What a purchase produced: the receipt, the period's usage as it stands
        after the resolutions were credited, and whether this request was the
        one that bought them (FR-MOD-10.1.4).

        `usage` is returned rather than left to a follow-up `GET /billing/usage`
        because the whole point of the purchase is the raised allowance — a
        client that has to ask again can render the old counter in between. It
        is read inside the same transaction that credited the quota.

        `replayed` is `true` when the `idempotency_key` had already been spent:
        the receipt is the earlier sale's, nothing was charged and no quota was
        added. A client that double-submits therefore gets a success carrying
        the truth, not a second purchase and not an error it has to interpret.
      required: [purchase, usage, replayed]
      properties:
        purchase: { $ref: "#/components/schemas/AiPackagePurchase" }
        usage: { $ref: "#/components/schemas/UsageSummary" }
        replayed:
          type: boolean
          description: True when this request replayed an earlier purchase and charged nothing.

    PaymentMethodInput:
      type: object
      description: |
        The masked fields a processor returns after tokenising a card. There is
        deliberately no full-card-number field — the out-of-scope data cannot be
        submitted.
      required: [brand, last4, exp_month, exp_year, holder_name]
      properties:
        brand: { type: string, enum: [visa, mastercard, amex, discover] }
        last4: { type: string, pattern: "^[0-9]{4}$" }
        exp_month: { type: integer, minimum: 1, maximum: 12 }
        exp_year: { type: integer, minimum: 2000, maximum: 2100 }
        holder_name: { type: string, minLength: 1, maxLength: 120 }

    BenchmarkWindow:
      type: object
      description: |
        The window a report is benchmarked against (FR-MOD-07.7). Always another
        window of the **same** license — see the `baseline` query parameter for
        why a cross-license benchmark is refused rather than unimplemented.

        `baseline` names which comparison produced the block, because the same
        `previous_period` key carries a different window depending on the
        request and a client rendering "vs previous" must not have to guess
        which one it received. Each report adds its own comparable figures
        alongside; the figures are sent rather than a pre-computed delta, so a
        client can show the change *and* the baseline, and a rounding choice
        stays on one side of the wire.
      required: [baseline, range]
      properties:
        baseline: { type: string, enum: [previous_period, previous_year] }
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }

    ReportsOverview:
      type: object
      required:
        [
          range,
          previous_period,
          totals,
          chats,
          response_times,
          satisfaction,
          by_agent,
          top_tags,
          sla,
        ]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            The benchmark window's headline figures, so every KPI card can carry
            a vs-baseline delta (FR-MOD-07.3.1). No by-agent or by-tag depth —
            nothing on a KPI card needs it.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required:
                [
                  chats,
                  tickets,
                  total_cases,
                  closed,
                  manual,
                  assisted,
                  automated,
                  achieved_goals,
                  sla_breaches,
                  automated_per_hour,
                  total_duration_seconds,
                ]
              properties:
                chats: { type: integer }
                tickets: { type: integer }
                total_cases: { type: integer }
                closed: { type: integer }
                manual: { type: integer }
                assisted: { type: integer }
                automated: { type: integer }
                avg_first_response_seconds: { type: integer, nullable: true }
                avg_duration_seconds: { type: integer, nullable: true }
                satisfaction_score:
                  type: number
                  nullable: true
                  description: Null when nobody rated the baseline window.
                achieved_goals:
                  type: integer
                  description: Goals reached in the baseline window (FR-MOD-13.3).
                sla_breaches:
                  type: integer
                  description: SLA misses detected in the baseline window (FR-MOD-11.5).
                automated_per_hour:
                  type: number
                  description: |
                    Automated resolutions per hour in the baseline window
                    (FR-MOD-07.3.3) — the Chats section's vs-previous badge.
                automated_avg_duration_seconds:
                  type: integer
                  nullable: true
                  description: Average open-to-close time of automated chats in the baseline window. Null when none closed automated.
                total_duration_seconds:
                  type: integer
                  description: Summed open-to-close time of every chat closed in the baseline window.
        totals:
          type: object
          required:
            [
              chats,
              tickets,
              total_cases,
              low_confidence,
              closed,
              manual,
              assisted,
              automated,
              split_low_confidence,
              queued_now,
              achieved_goals,
            ]
          properties:
            chats: { type: integer }
            tickets:
              type: integer
              description: Tickets created in the range.
            total_cases:
              type: integer
              description: |
                Chats plus tickets (PRD §3.3). Sent rather than left for the
                client to add up, so every surface quoting "total cases" quotes
                the same number.
            low_confidence:
              type: boolean
              description: |
                Too few cases in the window to read `total_cases` at face
                value (FR-MOD-07.3.2). The same flag and the same threshold as
                `sla.low_confidence` below — both count the exact same thing,
                every case in the window (`chats + tickets`).
            closed: { type: integer }
            # PRD 07.3.2 splits every *closed* case three ways, and the three
            # always sum back to `closed` — so a client can trust the parts
            # against the whole:
            #   manual    — not automated, and no skill ran on the chat.
            #   assisted  — not automated, and a skill ran on the chat.
            #   automated — no agent-authored event and no automatic hand-off
            #     (ADR-09a). This is the same definition the invoice's
            #     AI-resolution counter uses, so the two never drift.
            manual: { type: integer }
            assisted: { type: integer }
            automated: { type: integer }
            manual_rate:
              type: number
              nullable: true
              description: Share of *closed* chats an agent resolved unaided. Null when nothing closed.
            assisted_rate:
              type: number
              nullable: true
              description: Share of *closed* chats an agent resolved with a skill. Null when nothing closed.
            automated_rate:
              type: number
              nullable: true
              description: Share of *closed* chats. Null when nothing closed.
            split_low_confidence:
              type: boolean
              description: |
                Too few *closed* cases for the manual/assisted/automated
                shares above to mean much (FR-MOD-07.3.2). Independent from
                `low_confidence`: a window can hold plenty of cases and still
                have closed only a handful of them, and it is `closed` this
                flag is bound to.
            queued_now: { type: integer }
            achieved_goals:
              type: integer
              description: Goals reached in the range (FR-MOD-13.3) — the funnel's converted stage.
        chats:
          type: object
          description: |
            Operational chat metrics for the Chats section cards (FR-MOD-07.3.3):
            how fast the AI is clearing conversations and how long they run.
          required: [automated_per_hour, total_duration_seconds]
          properties:
            automated_per_hour:
              type: number
              description: Automated resolutions per hour across the window (0 for an empty window).
            automated_avg_duration_seconds:
              type: integer
              nullable: true
              description: Average open-to-close time of automated chats. Null when none closed automated.
            total_duration_seconds:
              type: integer
              description: Summed open-to-close time of every closed chat.
        response_times:
          type: object
          properties:
            avg_first_response_seconds: { type: integer, nullable: true }
            avg_duration_seconds: { type: integer, nullable: true }
        satisfaction:
          type: object
          required: [good, bad, responses]
          properties:
            good: { type: integer }
            bad: { type: integer }
            score:
              type: number
              nullable: true
              description: Null when nobody rated — unknown, not zero.
            responses: { type: integer }
        by_agent:
          type: array
          items:
            type: object
            required: [agent_id, chats]
            properties:
              agent_id: { type: string, format: uuid }
              name: { type: string, nullable: true }
              chats: { type: integer }
        top_tags:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name: { type: string }
              count: { type: integer }
        sla:
          type: object
          description: |
            SLA breaches in the window (FR-MOD-11.5 · 11.5-e). Its own block
            rather than folded into `totals`: unlike every figure there, a
            breach count means nothing without `active` alongside it — a
            workspace that has never configured targets has zero breaches for
            the same reason it has zero of anything nobody asked to measure,
            and showing that "0" bare would read as a clean record rather than
            as SLA never having been switched on.
          required: [active, breaches, low_confidence]
          properties:
            active:
              type: boolean
              description: |
                Whether SLA targets are in force today — the same "bought it
                and asked for something" rule `GET /settings/sla`'s `active`
                field applies.
            breaches:
              type: integer
              description: SLA misses detected in the range.
            low_confidence:
              type: boolean
              description: |
                Too few cases in the window to read much into the count — a
                single slow reply can be the whole story in a two-case window.

    ReportsBreakdown:
      type: object
      description: |
        The Overview's resolution split (manual / assisted / automated,
        FR-MOD-07.3.2) resolved over up to four dimensions — each UTC day in the
        window, each assigned agent, each hour of day, each team and each
        channel — for the Metrics breakdown tab (FR-MOD-07.5).
        `manual + assisted + automated === closed` holds inside every row, the
        same invariant the Overview cards rely on.

        `by_day` and `by_agent` are always present. `by_hour`, `by_team` and
        `by_channel` are optional — a client that only knows the original two
        dimensions keeps working unchanged.
      required: [range, previous_period, by_day, by_agent]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            The benchmark window's resolution split — the whole license, not a
            baseline copy of the five dimensions. A dimension's buckets are
            derived from the window (which days it holds, which teams were
            active), so a per-bucket baseline would pair rows that are not
            counterparts; the split itself is what the two windows share.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [chats, closed, manual, assisted, automated]
              properties:
                chats: { type: integer }
                closed: { type: integer }
                manual: { type: integer }
                assisted: { type: integer }
                automated: { type: integer }
        by_day:
          type: array
          items:
            type: object
            required: [date, chats, closed, manual, assisted, automated]
            properties:
              date: { type: string, description: "UTC day as `YYYY-MM-DD`." }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }
        by_agent:
          type: array
          items:
            type: object
            required: [agent_id, chats, closed, manual, assisted, automated]
            properties:
              agent_id: { type: string, format: uuid }
              name: { type: string, nullable: true }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }
        by_hour:
          type: array
          description: |
            One row per hour of day (0-23, UTC), ascending. Optional — absent
            until FR-MOD-07.5's hour dimension is wired up.
          items:
            type: object
            required: [hour, chats, closed, manual, assisted, automated]
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }
        by_team:
          type: array
          description: |
            One row per team. `team_id`/`name` are null for chats not assigned
            to any team. Optional — absent until FR-MOD-07.5's team dimension is
            wired up. A chat may be visible to more than one team, so rows can
            overlap; see `overlapping`.
          items:
            type: object
            required: [team_id, name, chats, closed, manual, assisted, automated]
            properties:
              team_id: { type: integer, nullable: true }
              name: { type: string, nullable: true }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }
        overlapping:
          type: boolean
          description: |
            True when `by_team` rows can double-count a chat (a chat reachable
            by more than one team), so the sum of `by_team.chats` may exceed the
            window's total chats. Only meaningful alongside `by_team`.
        by_channel:
          type: array
          description: |
            One row per channel (`website` is the fallback for chats with no
            inbound channel message). Optional — absent until FR-MOD-07.5's
            channel dimension is wired up.
          items:
            type: object
            required: [channel, chats, closed, manual, assisted, automated]
            properties:
              channel: { type: string }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }

    ReportsAiAgent:
      type: object
      description: |
        AI Agent performance for its own report tab (FR-MOD-07.4). `resolutions`
        is ADR-09a's figure — the same one the invoice's AI-resolution counter
        uses — so this surface never disagrees with the bill.
      required: [range, previous_period, resolutions, transfers, skill_runs, tokens, quality]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            The benchmark window's AI counters, so the tab can show each against
            what it was. `avg_automated_duration_seconds` is not repeated here —
            a duration average is not a figure the tab tracks a delta on.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [resolutions, transfers, skill_runs]
              properties:
                resolutions: { type: integer }
                resolution_rate:
                  type: number
                  nullable: true
                  description: Null when nothing closed in the baseline window.
                transfers: { type: integer }
                skill_runs: { type: integer }
        resolutions:
          type: integer
          description: |
            Chats closed with no agent-authored event and no automatic hand-off
            (ADR-09a) — a hand-off counts for threads closed from 2026-11-01 on.
        resolution_rate:
          type: number
          nullable: true
          description: Share of *closed* chats the AI resolved. Null when nothing closed.
        transfers:
          type: integer
          description: AI→human hand-offs in the window (transfer events).
        transfer_rate:
          type: number
          nullable: true
          description: |
            Share of AI-finished chats handed to a human — transfers over
            transfers plus resolutions. Null when the AI finished none either way.
        skill_runs:
          type: integer
          description: Skills that ran in the window.
        tokens:
          type: object
          description: |
            What `skill_runs` cost, in the providers' own unit — summed from the
            same runs, where the skill engine wrote each run's usage as the
            providers reported it. Chat-model input and output and the question
            embeddings are separate because they are priced separately. Tokens,
            not money: the price is the operator's contract with the provider. A
            stub provider bills nothing and reports 0.
          required: [llm_input, llm_output, embedding_input]
          properties:
            llm_input: { type: integer, minimum: 0 }
            llm_output: { type: integer, minimum: 0 }
            embedding_input: { type: integer, minimum: 0 }
        avg_automated_duration_seconds:
          type: integer
          nullable: true
          description: Average open-to-close time of automated chats. Null when none.
        quality:
          description: |
            The AI quality metrics (AI-25 · tm 320.2), beside — never instead of —
            the billed `resolutions` above (AI-25-S1, ADR-09a unchanged).
          allOf: [{ $ref: "#/components/schemas/AiQuality" }]

    AiMetricCounts:
      type: object
      description: |
        The additive counts the AI quality rates are built from (AI-25 · tm
        320.2 · `@siyahtus/types` `AiMetricCounts`, which defines each). The
        daily rollup keeps the same counts per day. `conversations` is N: the
        ended connections where the AI wrote at least one turn; `ended` is
        every ended one (the card, the mandatory hand-over and the CSAT read
        those).
      required:
        [
          ended,
          conversations,
          confirmed,
          assumed,
          false_resolved,
          unsettled,
          handed_off,
          abandoned,
          declined,
          false_in_settled,
          contained,
          card_sufficient,
          card_insufficient,
          reasked,
          reask_judged,
          mandatory_triggered,
          mandatory_compliant,
          mandatory_violations,
          mandatory_due,
          guardrail_confirmed,
          guardrail_suspected,
          bsat_good,
          bsat_bad,
          csat_good,
          csat_bad,
          clarification_turns,
          clarification_rows,
          repeat_any,
          repeat_same_intent,
          repeat_unmeasured,
        ]
      properties:
        ended: { type: integer, minimum: 0 }
        conversations: { type: integer, minimum: 0 }
        confirmed: { type: integer, minimum: 0 }
        assumed: { type: integer, minimum: 0 }
        false_resolved: { type: integer, minimum: 0 }
        unsettled: { type: integer, minimum: 0 }
        handed_off: { type: integer, minimum: 0 }
        abandoned: { type: integer, minimum: 0 }
        declined: { type: integer, minimum: 0 }
        false_in_settled: { type: integer, minimum: 0 }
        contained: { type: integer, minimum: 0 }
        card_sufficient: { type: integer, minimum: 0 }
        card_insufficient: { type: integer, minimum: 0 }
        reasked: { type: integer, minimum: 0 }
        reask_judged: { type: integer, minimum: 0 }
        mandatory_triggered: { type: integer, minimum: 0 }
        mandatory_compliant: { type: integer, minimum: 0 }
        mandatory_violations: { type: integer, minimum: 0 }
        mandatory_due: { type: integer, minimum: 0 }
        guardrail_confirmed: { type: integer, minimum: 0 }
        guardrail_suspected: { type: integer, minimum: 0 }
        bsat_good: { type: integer, minimum: 0 }
        bsat_bad: { type: integer, minimum: 0 }
        csat_good: { type: integer, minimum: 0 }
        csat_bad: { type: integer, minimum: 0 }
        clarification_turns: { type: integer, minimum: 0 }
        clarification_rows: { type: integer, minimum: 0 }
        repeat_any: { type: integer, minimum: 0 }
        repeat_same_intent: { type: integer, minimum: 0 }
        repeat_unmeasured: { type: integer, minimum: 0 }

    AiQualityRates:
      type: object
      description: |
        The AI quality rates (AI-25 "Kodlama mantığı"; the words and tooltips
        are `AI_METRIC_DEFINITIONS` in `@siyahtus/types`). Each share is 0–1,
        four places, and null over nothing — an empty window is unknown, not
        0%. `low_sample` is true below 20 conversations.
      required:
        [
          conversations,
          low_sample,
          confirmed_resolution,
          assumed_resolution,
          unsettled,
          false_resolution,
          containment,
          handoff_rate,
          handoff_quality,
          reask_rate,
          mandatory_handoff_compliance,
          guardrail_violation,
          guardrail_suspected,
          bsat,
          csat_after_handoff,
          clarification_efficiency,
          repeat_unmeasured,
          counts,
        ]
      properties:
        conversations: { type: integer, minimum: 0, description: "N." }
        low_sample: { type: boolean }
        confirmed_resolution:
          type: number
          nullable: true
          description: The player's Yes, over N.
        assumed_resolution:
          type: number
          nullable: true
          description: Settled `assumed_resolved`, over N.
        unsettled:
          type: integer
          minimum: 0
          description: Assumed-resolution candidates whose 72 hours have not passed yet.
        false_resolution:
          type: number
          nullable: true
          description: |
            Of the confirmed and assumed resolutions, the share that came back
            about the same topic within 72 hours or that QA found unsolved.
        containment:
          type: number
          nullable: true
          description: No person wrote, over N. Not a measure of success on its own.
        handoff_rate: { type: number, nullable: true }
        handoff_quality:
          type: number
          nullable: true
          description: Sufficient cards over judged cards.
        reask_rate: { type: number, nullable: true }
        mandatory_handoff_compliance:
          type: number
          nullable: true
          description: |
            Mandatory hand-overs made in time over those due (the rule fired,
            or QA said it should have). The target is 1.
        guardrail_violation:
          type: number
          nullable: true
          description: Confirmed by QA.
        guardrail_suspected:
          type: number
          nullable: true
          description: Flagged by the automatic checks.
        bsat:
          type: number
          nullable: true
          description: Good over rated, only where the AI was alone.
        csat_after_handoff: { type: number, nullable: true }
        clarification_efficiency:
          type: number
          nullable: true
          description: Average turns asking for required details, where all were collected.
        repeat_unmeasured:
          type: integer
          minimum: 0
          description: Rows with no member to follow.
        counts: { $ref: "#/components/schemas/AiMetricCounts" }

    AiWaitSummary:
      type: object
      required: [count, median_seconds, p90_seconds]
      properties:
        count: { type: integer, minimum: 0 }
        median_seconds: { type: integer, nullable: true }
        p90_seconds: { type: integer, nullable: true }

    AiQuality:
      description: |
        The AI quality block (AI-25 · tm 320.2): the rates and their counts,
        what the AI claimed beside what the player answered (K9), the
        hand-over reasons, the wait for a person after a hand-over (inside and
        outside business hours, null with no work schedule saved), consistency
        and the mandatory hand-over violations by id (newest 50).
      allOf:
        - $ref: "#/components/schemas/AiQualityRates"
        - type: object
          required: [claims, handoff_reasons, handoff_wait, consistency, mandatory_violations]
          properties:
            claims:
              type: object
              required: [ai_claimed_resolved, player_confirmed, player_denied, claimed_unanswered]
              properties:
                ai_claimed_resolved: { type: integer, minimum: 0 }
                player_confirmed: { type: integer, minimum: 0 }
                player_denied: { type: integer, minimum: 0 }
                claimed_unanswered: { type: integer, minimum: 0 }
            handoff_reasons:
              type: array
              items:
                type: object
                required: [reason, count]
                properties:
                  reason: { type: string, description: "`HANDOFF_REASONS`." }
                  count: { type: integer, minimum: 0 }
            handoff_wait:
              type: object
              required: [all, in_hours, out_of_hours]
              properties:
                all: { $ref: "#/components/schemas/AiWaitSummary" }
                in_hours:
                  nullable: true
                  allOf: [{ $ref: "#/components/schemas/AiWaitSummary" }]
                out_of_hours:
                  nullable: true
                  allOf: [{ $ref: "#/components/schemas/AiWaitSummary" }]
            consistency:
              type: number
              nullable: true
              description: Same-topic pairs the AI ended the same way, over all pairs.
            mandatory_violations:
              type: array
              items:
                type: object
                required: [thread_id, chat_id, ended_at, handoff_mandatory_rule]
                properties:
                  thread_id: { type: string }
                  chat_id: { type: string }
                  ended_at: { type: string, format: date-time }
                  handoff_mandatory_rule: { type: string, nullable: true }

    AiQualityBreakdown:
      type: object
      required: [range, by, total, rows]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        by: { type: string, enum: [intent, reason, version, language, brand, team] }
        total: { $ref: "#/components/schemas/AiQuality" }
        rows:
          type: array
          items:
            type: object
            required: [key, label, quality]
            properties:
              key:
                type: string
                nullable: true
                description: The group's value; null for "none" (no topic, no hand-over).
              label:
                type: string
                nullable: true
                description: A version's number (`v12`), a brand's or a team's name; the key otherwise.
              quality: { $ref: "#/components/schemas/AiQualityRates" }

    AiMetricConversations:
      type: object
      required: [range, metric, conversations, next_cursor]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        metric: { type: string }
        next_cursor: { type: string, nullable: true }
        conversations:
          type: array
          items:
            type: object
            required:
              [
                id,
                thread_id,
                chat_id,
                started_at,
                ended_at,
                outcome,
                intent,
                language,
                config_version_id,
                team_id,
                brand_id,
                ai_turns,
                ai_claimed_resolved,
                resolution_confirmation,
                handoff_reason,
                handoff_mandatory_rule,
                mandatory_handoff_violation,
                repeat_same_intent_72h,
                repeat_any_72h,
                qa_result,
                finalized_at,
              ]
            properties:
              id: { type: string, format: uuid }
              thread_id: { type: string, description: The connection (panel "Chat ID"). }
              chat_id: { type: string, description: The day container (panel "Thread ID"). }
              started_at: { type: string, format: date-time }
              ended_at: { type: string, format: date-time }
              outcome: { type: string, nullable: true }
              intent: { type: string, nullable: true }
              language: { type: string, nullable: true }
              config_version_id: { type: string, nullable: true }
              team_id: { type: string, nullable: true }
              brand_id: { type: string, nullable: true }
              ai_turns: { type: integer, minimum: 0 }
              ai_claimed_resolved: { type: boolean }
              resolution_confirmation: { type: string, nullable: true }
              handoff_reason: { type: string, nullable: true }
              handoff_mandatory_rule: { type: string, nullable: true }
              mandatory_handoff_violation: { type: boolean }
              repeat_same_intent_72h: { type: boolean, nullable: true }
              repeat_any_72h: { type: boolean, nullable: true }
              qa_result: { type: string, nullable: true }
              finalized_at: { type: string, format: date-time, nullable: true }

    ReportsReviews:
      type: object
      description: |
        The Reviews / Ratings report (FR-MOD-07.8): CSAT read back from the
        ratings the widget writes. `csat` feeds the donut, `by_day` the daily bar,
        and `previous_period` the two-period comparison. Every `score` is `null`
        (not `0`) for an unrated span — the same rule the Overview's satisfaction
        follows. `ecommerce` carries the tracked-sales figures (FR-MOD-13.5) when
        the workspace has sales tracking switched on, and an honest "not set up"
        block when it has not. `insights` is the PRD line's fourth item: the
        report's own reading of those figures, as identifiers rather than
        sentences.
      required: [range, previous_period, csat, by_day, ecommerce, insights]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        csat:
          $ref: "#/components/schemas/CsatSummary"
        previous_period:
          description: |
            CSAT for the benchmark window, so the tab can show a vs-baseline
            delta (the PRD's "67% vs 57%").
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - $ref: "#/components/schemas/CsatSummary"
        by_day:
          type: array
          description: One row per UTC day with at least one rating, ascending by date.
          items:
            allOf:
              - type: object
                required: [date]
                properties:
                  date: { type: string, description: "UTC day as `YYYY-MM-DD`." }
              - $ref: "#/components/schemas/CsatSummary"
        ecommerce:
          type: object
          description: |
            Sales the workspace's tracking snippet reported, credited to the
            conversations that supported them (FR-MOD-13.5).

            Two states, and the difference matters. Until Settings → Sales
            tracker is switched on, `configured` is `false` and every figure is
            `null` — an honest "not set up" placeholder, never a fabricated
            zero. Once it is on, the figures are real, and a window with no
            attributed order reports `0` rather than `null`: that zero is a
            known answer, not an unknown one.

            Only orders the attribution window tied to a chat are counted, so
            this is revenue live chat can take credit for, not the workspace's
            turnover.
          required: [configured, tracked_sales, attributed_revenue_cents, currency]
          properties:
            configured:
              type: boolean
              description: Whether sales tracking is switched on for this workspace.
            tracked_sales:
              type: integer
              nullable: true
              description: Attributed orders in the window; 0 if none. Null while unconfigured.
            attributed_revenue_cents:
              type: integer
              nullable: true
              description: |
                Revenue attributed to supported conversations, in minor units of
                `currency`; 0 if none. Null while unconfigured.
            currency:
              type: string
              nullable: true
              description: |
                ISO 4217 code the revenue figure is denominated in, as configured
                in Settings → Sales tracker. Null while unconfigured.
        insights:
          type: array
          description: |
            What the figures above say, as a short ordered list of statements
            (FR-MOD-07.8's "Insights").

            Every one is a deterministic rule over the tallies in this same
            payload — a threshold, a ratio, a difference. No model is called: the
            same window must read the same way twice, and a statement nobody can
            reproduce is not one a workspace can act on.

            The array carries `id` and figures, never a sentence. The wording is
            the client's, so an insight is as translated as the card it sits
            under, and a consumer that does not know an `id` can skip it rather
            than render English at a Turkish workspace.

            Evidence comes before reading. On a window with no ratings the list
            is exactly `no_ratings`; below the low-base bar it is exactly
            `low_base`, and no trend is offered — a 30-point swing over three
            ratings is arithmetic, not information.
          items:
            type: object
            required: [id, tone, values]
            properties:
              id:
                type: string
                description: |
                  Which statement this is. `no_ratings` nobody rated ·
                  `low_base` too few ratings to read · `csat_no_baseline` the
                  previous window is too thin to compare against ·
                  `csat_improved` / `csat_declined` / `csat_steady` the movement
                  against it · `all_positive` / `all_negative` every rating fell
                  one way · `bad_day_concentration` most of the window's negative
                  ratings landed on one UTC day.
                enum:
                  - no_ratings
                  - low_base
                  - csat_no_baseline
                  - csat_improved
                  - csat_declined
                  - csat_steady
                  - all_positive
                  - all_negative
                  - bad_day_concentration
              tone:
                type: string
                description: |
                  How to colour it. `warning` is a caveat about the evidence
                  itself; `negative` is a finding about the workspace.
                enum: [positive, negative, warning, neutral]
              values:
                type: object
                description: |
                  The figures the statement's sentence interpolates. Which keys
                  are present depends on `id`; a client renders the ones its
                  wording uses.
                properties:
                  responses:
                    type: integer
                    description: Ratings in this window.
                  previous_responses:
                    type: integer
                    description: Ratings in the baseline window.
                  delta_points:
                    type: integer
                    description: |
                      CSAT change against the baseline window, in whole
                      percentage points; negative when it fell.
                  date:
                    type: string
                    description: "UTC day the statement points at, as `YYYY-MM-DD`."
                  bad:
                    type: integer
                    description: Negative ratings the statement counts.
                  share:
                    type: number
                    description: A fraction (0–1) the surface formats as a percentage.

    ReportsTopics:
      type: object
      description: |
        The Chat topics report (FR-MOD-07.6): conversations in the window grouped
        into topics by deterministic, on-the-fly clustering (`@siyahtus/ai-mock`, no
        real LLM), each with volume, share and a vs-previous trend. Nothing is
        persisted — the clustering is recomputed per request.

        Below `min_conversations` clusterable chats the report is
        `sufficient_data: false` with an empty `topics` — an honest "not enough
        conversations yet" state, never a single fabricated topic, and always a
        200 rather than an error.
      required: [range, previous_period, min_conversations, analyzed, sufficient_data, topics]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            The benchmark window. Each topic's `previous_volume` — and so its
            `trend` — is read here, which is why `baseline` moves the comparison
            itself rather than only labelling it. No window-level figure rides
            along: a topic's baseline volume belongs on the topic's own row,
            where it can be matched to the cluster it describes.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
        min_conversations:
          type: integer
          description: |
            The floor of clusterable conversations the window needs before topics
            are computed. Below it, `sufficient_data` is false and `topics` is
            empty — surfaced so a client can tell the user how many more
            conversations are needed.
        analyzed:
          type: integer
          description: |
            How many clusterable conversations the window held. A conversation is
            clusterable once it has text to cluster — an AI summary, or failing
            that a customer message. 0 for an empty window.
        sufficient_data:
          type: boolean
          description: |
            False when `analyzed` is below `min_conversations`; `topics` is then
            empty. "Not enough conversations yet" is a state, not an error.
        topics:
          type: array
          description: |
            The clustered topics, most voluminous first. Empty while
            `sufficient_data` is false.
          items:
            type: object
            required: [id, label, keywords, volume, share, previous_volume, trend]
            properties:
              id:
                type: string
                description: Stable within one response, for keying a list row.
              label:
                type: string
                description: Human-readable topic name derived from the cluster's terms.
              keywords:
                type: array
                items: { type: string }
                description: The terms the label was derived from.
              volume:
                type: integer
                description: Conversations in this topic within the window.
              share:
                type: number
                nullable: true
                description: |
                  Share of `analyzed` conversations in this topic. Null when
                  nothing was analyzed — unknown, not zero.
              previous_volume:
                type: integer
                description: This topic's volume in `previous_period` (0 when it did not appear).
              trend:
                type: number
                nullable: true
                description: |
                  Change ratio vs `previous_volume`. Null — not a 100% rise — when
                  `previous_volume` is 0: a topic that is new has an unknown
                  trend, not an infinite one.

    ReportsCases:
      type: object
      description: |
        The Cases report (FR-MOD-07.7, v2 payload): tickets (FR-MOD-02.6)
        counted by day of creation, current status and stored queue priority
        (FR-MOD-13.6). Aggregate counts only — no ticket subject or customer
        identity is in this report. A merged ticket (`merged_into_id` set) is
        excluded from every bucket.
      required: [range, previous_period, by_day, by_status, by_priority]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            Ticket counts for the benchmark window, split the same way `by_day`
            splits them and with the same merged-ticket exclusion — a benchmark
            counted differently from the series beside it would be a number
            nobody could reconcile.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [open, closed, total]
              properties:
                open: { type: integer }
                closed: { type: integer }
                total: { type: integer }
        by_day:
          type: array
          description: |
            One row per UTC day with at least one ticket created, ascending by
            date. `open`/`closed` split by the ticket's *current* status
            (`solved`/`closed` count as closed); `total` is `open + closed`.
          items:
            type: object
            required: [date, open, closed, total]
            properties:
              date: { type: string, description: "UTC day as `YYYY-MM-DD`." }
              open: { type: integer }
              closed: { type: integer }
              total: { type: integer }
        by_status:
          type: array
          description: Tickets in the window grouped by current status.
          items:
            type: object
            required: [status, count]
            properties:
              status:
                type: string
                description: "One of `open`, `pending`, `solved`, `closed`, `spam`."
              count: { type: integer }
        by_priority:
          type: array
          description: |
            Tickets in the window grouped by their stored queue priority
            (FR-MOD-13.6) — the raw signed integer, highest first; not the four
            named levels the Inbox pane snaps to for display.
          items:
            type: object
            required: [priority, count]
            properties:
              priority: { type: integer }
              count: { type: integer }

    ReportsLeads:
      type: object
      description: |
        The Leads report (FR-MOD-07.7, v2 payload): customers flagged as leads
        (`is_lead`) counted by UTC day of their first contact with this license.
        Aggregate counts only — no lead name, email or phone is in this report.

        ISOLATION (NFR-S4): `customers` is organization-scoped and carries no
        `license_id`, and one organization may hold several licenses, so a lead
        is bound to this license only when it has touched the license through a
        chat or a ticket. The organization-wide `is_lead` count is deliberately
        not used — it would leak a sibling license's leads into this report.
      required: [range, previous_period, by_day, totals]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            New leads in the benchmark window, counted through the same
            first-touch binding as `totals.leads` — so the benchmark stays
            inside this license exactly as the window's own figure does.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [leads]
              properties:
                leads: { type: integer }
        by_day:
          type: array
          description: |
            One row per UTC day on which at least one lead first touched this
            license, ascending by date. `count` is the number of leads whose
            first contact with the license fell on that day.
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string, description: "UTC day as `YYYY-MM-DD`." }
              count: { type: integer }
        totals:
          type: object
          description: |
            Window totals. `leads` is the distinct leads whose first contact
            with this license fell inside the window — equal to the sum of the
            `by_day` counts.
          required: [leads]
          properties:
            leads: { type: integer }

    ReportsTeamPerformance:
      type: object
      description: |
        Team performance (FR-MOD-07.7, v2 payload): the Breakdown tab's
        by-agent chat split (`chats`/`closed`/`manual`/`assisted`/`automated`),
        extended per agent with average first-response and conversation
        duration, CSAT and AI→human transfer hand-offs.

        CSAT and transfers are windowed by their own timestamp (the rating's
        or the transfer event's `created_at`) — the same convention the
        Reviews report and the AI Agent report's `transfers` figure follow —
        not by the thread's creation date. Which agents appear, their order
        and the `LIMIT 20` all come from the chat-split query alone (the same
        one `ReportsBreakdown.by_agent` uses): an agent needs at least one
        thread *created* in the window to appear here, even if a rating or
        transfer landed inside the window on an older thread of theirs.
      required: [range, previous_period, totals, agents]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        totals:
          type: object
          description: |
            The license's resolution split over the REQUESTED window — the
            current-window counterpart of `previous_period`, measured by the
            same helper over the same license scope, so the two are comparable
            figure by figure. It is deliberately not the sum of `agents`: that
            table is capped at 20 rows and holds only assigned threads, so
            adding it up would understate the workspace and make the benchmark
            read as a fall that never happened.
          required: [chats, closed, manual, assisted, automated]
          properties:
            chats: { type: integer }
            closed: { type: integer }
            manual: { type: integer }
            assisted: { type: integer }
            automated: { type: integer }
        previous_period:
          description: |
            The license's resolution split in the benchmark window — not a
            baseline copy of the agent table. Which agents `agents` holds is
            derived from the window (the `LIMIT 20` over agents with a thread
            created in it), so the two windows would list different people and a
            row-by-row comparison would silently pair an agent with someone
            else, or with a blank where they did not make the earlier cut. A
            per-agent history is a different report, not this one's baseline.
            Compared against `totals`, never against a row of `agents`.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [chats, closed, manual, assisted, automated]
              properties:
                chats: { type: integer }
                closed: { type: integer }
                manual: { type: integer }
                assisted: { type: integer }
                automated: { type: integer }
        agents:
          type: array
          description: |
            One row per agent with at least one thread created in the window,
            most chats first, capped at 20 — the same set, order and limit
            `ReportsBreakdown.by_agent` uses.
          items:
            type: object
            required:
              - agent_id
              - chats
              - closed
              - manual
              - assisted
              - automated
              - avg_first_response_seconds
              - avg_duration_seconds
              - csat
              - transfers
            properties:
              agent_id: { type: string, format: uuid }
              name: { type: string, nullable: true }
              chats: { type: integer }
              closed: { type: integer }
              manual: { type: integer }
              assisted: { type: integer }
              automated: { type: integer }
              avg_first_response_seconds: { type: integer, nullable: true }
              avg_duration_seconds: { type: integer, nullable: true }
              csat:
                type: object
                required: [good, bad, responses, score]
                properties:
                  good: { type: integer }
                  bad: { type: integer }
                  responses: { type: integer }
                  score:
                    type: number
                    nullable: true
                    description: Null when nobody rated this agent in the window.
              transfers:
                type: integer
                description: |
                  AI→human hand-offs (chat_transferred events) landing on a
                  thread this agent currently holds.

    ReportsSales:
      type: object
      description: |
        The Sales report (FR-MOD-07.7, v2 payload; FR-MOD-13.5 dependency): the
        same tracked-sales data as the Reviews report's `ecommerce` block, as a
        report of its own, plus `conversions`. `configured` is `true` and every
        figure real once a workspace has turned FR-MOD-13.5's Sales tracker on;
        an honest "not set up" state — `configured: false`, every figure
        `null`, never a fabricated zero — while it is off or never configured.
      required:
        [
          range,
          previous_period,
          configured,
          tracked_sales,
          attributed_revenue_cents,
          currency,
          conversions,
        ]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        previous_period:
          description: |
            The benchmark window, as honest as the report itself: real figures
            over the baseline window once the Sales tracker is configured, so a
            "vs previous" comparison is possible. Otherwise every figure is
            `null` here too — with no sales source there is nothing to have
            been better or worse than, and zeros would let a surface render a
            "0 → 0, no change" badge that reads as a measurement.
          allOf:
            - $ref: "#/components/schemas/BenchmarkWindow"
            - type: object
              required: [configured, tracked_sales, attributed_revenue_cents, currency, conversions]
              properties:
                configured: { type: boolean }
                tracked_sales: { type: integer, nullable: true }
                attributed_revenue_cents: { type: integer, nullable: true }
                currency: { type: string, nullable: true }
                conversions: { type: integer, nullable: true }
        configured:
          type: boolean
          description: Whether a sales-tracking source is wired and turned on.
        tracked_sales:
          type: integer
          nullable: true
          description: Attributed orders. Null until configured.
        attributed_revenue_cents:
          type: integer
          nullable: true
          description: Revenue attributed to supported conversations. Null until configured.
        currency:
          type: string
          nullable: true
          description: ISO 4217 code for the revenue figure. Null until configured.
        conversions:
          type: integer
          nullable: true
          description: Goal achievements in the window (FR-MOD-13.3). Null until configured.

    StaffingForecast:
      type: object
      description: |
        The work-scheduler forecast (PRD §5.3-Vardiya): a fixed 7 × 24 grid of
        `required` / `scheduled` / `rostered` agents per UTC weekday-hour,
        derived deterministically from the observed window — historical chat
        volume, the presence event log and the stored work schedules. Nothing is
        persisted; the grid is recomputed per request.

        Read `null` as "not known", never as zero — see the operation
        description for each of the four unknowns and why a fabricated zero
        would be worse than an absent number in every one of them.
      required: [range, inputs, coverage_known, roster_known, low_confidence, cells]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        inputs:
          type: object
          description: |
            The figures every cell was derived from, echoed so a recommendation
            can be argued with rather than only believed.
          required: [concurrent_chats_limit, average_chat_minutes, minimum_sample_chats, agents]
          properties:
            concurrent_chats_limit:
              type: number
              nullable: true
              description: |
                Mean `concurrent_chats_limit` across the workspace's active
                (non-suspended) agents — how many chats one agent holds at
                once. Null when the workspace has no active agent, which leaves
                every `required_agents` null.
            average_chat_minutes:
              type: number
              nullable: true
              description: |
                Mean handling time of a conversation closed in the window, in
                minutes — the same duration `GET /reports/overview` reports in
                seconds. Null when nothing closed in the window, which leaves
                every `required_agents` null.
            minimum_sample_chats:
              type: integer
              description: |
                How many chats a cell must have observed before it reports a
                number instead of `null`.
            agents:
              type: integer
              description: Active agents the `concurrent_chats_limit` mean was taken over.
        coverage_known:
          type: boolean
          description: |
            False when the presence log says nothing about this window: every
            `scheduled_agents` and `gap` is null.
        roster_known:
          type: boolean
          description: |
            False when no agent in the workspace has a saved work schedule:
            every `rostered_agents` is null.
        low_confidence:
          type: boolean
          description: |
            True when *no* cell cleared `inputs.minimum_sample_chats` — the
            window forecasts nothing, and the whole grid is advisory at best.
        cells:
          type: array
          description: |
            Exactly 168 cells (7 × 24), ordered `day_of_week` 0-6 then `hour`
            0-23. Dense by construction: a week always has every hour.
          items:
            type: object
            required:
              [
                day_of_week,
                hour,
                observed_chats,
                required_agents,
                scheduled_agents,
                rostered_agents,
                gap,
                low_confidence,
              ]
            properties:
              day_of_week:
                type: integer
                minimum: 0
                maximum: 6
                description: "UTC weekday, 0 = Sunday … 6 = Saturday."
              hour: { type: integer, minimum: 0, maximum: 23, description: "UTC hour of day." }
              observed_chats:
                type: integer
                description: |
                  Chats that started in this cell across every occurrence of it
                  in the window — the evidence the verdict rests on, and the
                  same count `GET /reports/breakdown` gives per hour (ADR-09).
              required_agents:
                type: integer
                nullable: true
                description: |
                  Whole agents this hour's mean load needs. Null when the cell
                  has too little history, or when an input the model divides by
                  is unknown (see `inputs`).
              scheduled_agents:
                type: number
                nullable: true
                description: |
                  Mean agents actually online (`accepting_chats`) during this
                  hour, from the presence log. Null when `coverage_known` is
                  false.
              rostered_agents:
                type: number
                nullable: true
                description: |
                  Mean agents whose saved work schedule plans them onto this
                  hour, over a standing week. Fractional when a shift starts or
                  ends mid-hour. Null when `roster_known` is false.
              gap:
                type: number
                nullable: true
                description: |
                  `required_agents − scheduled_agents`: positive is a shortfall,
                  negative is spare capacity. Null when either side is null —
                  the plan is compared against what happened, never against an
                  assumed zero.
              low_confidence:
                type: boolean
                description: True exactly when `required_agents` is null.

    ReportGroups:
      type: object
      description: |
        The report groups a caller may see (FR-MOD-07.7 permission-based
        visibility) — filtered to the groups this token's scopes satisfy, so the
        list may be empty. Each id doubles as the `group` query the export
        endpoint accepts and the tab the web client renders.
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id:
                type: string
                description: "Group id: `overview`, `breakdown`, `ai-agent` or `reviews`."
              label: { type: string, description: Human-readable tab name. }

    ReportShareLink:
      type: object
      description: |
        A time-limited, scope-limited link that lets someone without a SiyahTuş
        account read **one** report group over **one** fixed window
        (FR-MOD-07.3.1 "Share export/link").

        The token itself is **never** in this shape. It is returned exactly once,
        by `POST /reports/share-links`, and only its SHA-256 digest is stored —
        the personal-access-token pattern. `token_last_four` is the only part of
        it a row ever shows again, so a workspace can tell two links apart
        without the row being able to reconstruct either.

        `from`/`to` are pinned at creation rather than resolved per view: a link
        is a snapshot definition, and a relative window would quietly start
        exposing data that did not exist when the link was handed out.
      required: [id, group, from, to, token_last_four, created_at, expires_at, revoked_at, expired]
      properties:
        id: { type: string, format: uuid }
        group:
          type: string
          description: "A report group id — the same vocabulary `GET /reports/export?group=` uses."
        from: { type: string, format: date-time, description: Start of the pinned window. }
        to: { type: string, format: date-time, description: End of the pinned window. }
        token_last_four:
          type: string
          description: |
            The last four characters of the token, for telling rows apart. Four
            characters of a 256-bit secret narrow a guess by nothing worth
            measuring, and without them a list of links is unlabelled.
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: Never null — a share link that never expires is not one this API can mint.
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When the link was cancelled, or null while it stands.
        expired:
          type: boolean
          description: |
            Whether `expires_at` is already in the past, as the server sees the
            clock. Derived rather than left to the client so a browser with a
            skewed clock cannot show a dead link as live.

    ReportShareLinkCreated:
      allOf:
        - $ref: "#/components/schemas/ReportShareLink"
        - type: object
          description: |
            The creation response, and the **only** time the token exists outside
            the recipient's URL. Sent with `Cache-Control: no-store`; losing it
            means minting a new link, exactly as with a personal access token.
          required: [token]
          properties:
            token:
              type: string
              description: The opaque share token, shown once and never retrievable.

    SharedReport:
      type: object
      description: |
        What a share link resolves to (FR-MOD-07.3.1): one report group's table,
        over the window the link pinned.

        Deliberately the **same** `headers`/`rows` table `GET /reports/export`
        serialises to CSV and PDF, not a second rendering of the same figures. A
        share can therefore never expose more than an export of the same group
        would, and the two cannot drift apart into disagreeing about a number.

        Nothing here identifies the workspace, its agents' accounts or its
        licence: the payload is the report, and the report only.
      required: [group, label, from, to, generated_at, expires_at, headers, rows]
      properties:
        group: { type: string, description: The report group this link was minted for. }
        label: { type: string, description: The group's human-readable name. }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        generated_at:
          type: string
          format: date-time
          description: When these figures were computed — a share link is read live, not cached.
        expires_at:
          { type: string, format: date-time, description: When this link stops resolving. }
        headers:
          type: array
          items: { type: string }
          description: The table's header row, identical to the export's.
        rows:
          type: array
          description: The table's data rows, identical to the export's.
          items:
            type: array
            items:
              nullable: true
              oneOf:
                - { type: string }
                - { type: number }

    AccessReviewReport:
      type: object
      description: |
        Access review evidence for SOC 2 CC6.1 (NFR-C6 · C6-e) — a point-in-time
        snapshot of who and what can reach this workspace.

        The report **produces evidence and makes no judgement** (§C-A23): there
        is no risk score, no staleness flag and no recommendation, because
        "is this access appropriate" is the human control the report exists to
        feed. Every field is read off a row or derived by a rule stated here.
      required: [generated_at, audit_trail_starts_at, members, credentials]
      properties:
        generated_at:
          type: string
          format: date-time
          description: The instant the snapshot was taken.
        audit_trail_starts_at:
          type: string
          format: date-time
          nullable: true
          description: |
            The oldest entry still in this workspace's audit trail, or null when
            the trail is empty. A member's `last_login_at` of null means "nothing
            recorded since this instant", **not** "never signed in" — the trail is
            pruned on retention, so absence past this point carries no
            information.
        members:
          type: array
          description: Every membership of the workspace, oldest grant first.
          items:
            type: object
            required:
              [
                account_id,
                name,
                email,
                role,
                status,
                suspended,
                awaiting_approval,
                two_factor_enabled,
                provisioned_via,
                member_since,
                last_login_at,
                last_login_method,
              ]
            properties:
              account_id: { type: string, format: uuid }
              name: { type: string }
              email: { type: string }
              role: { $ref: "#/components/schemas/AgentRole" }
              status:
                type: string
                enum: [active, awaiting_approval, suspended]
                description: |
                  The two flags below collapsed into one value, `suspended`
                  winning — a suspended member cannot get in whatever else is
                  true of them. Both raw flags travel alongside, so nothing is
                  lost in the collapse.
              suspended: { type: boolean }
              awaiting_approval: { type: boolean }
              two_factor_enabled: { type: boolean }
              provisioned_via:
                type: string
                enum: [manual, scim]
                description: |
                  Whether an admin invited this member or the workspace's
                  directory provisioned them over SCIM. CC6.1 asks how access is
                  removed as well as granted, and the two answers differ: a
                  directory-managed member is deprovisioned by the IdP.
              member_since:
                type: string
                format: date-time
                description: When the membership was created — when access was granted.
              last_login_at:
                type: string
                format: date-time
                nullable: true
                description: |
                  The newest `auth.login` / `auth.sso_login` for this person **in
                  this workspace**, from the audit trail. Per-licence on purpose:
                  the same person may sign into another workspace daily and this
                  one never. Read together with `audit_trail_starts_at`.
              last_login_method:
                type: string
                enum: [password, sso]
                nullable: true
                description: |
                  How that sign-in was made. Separated because after an incident
                  the two imply different containment: `password` means a secret
                  SiyahTuş holds was known, `sso` means an external system vouched.
        credentials:
          type: array
          description: |
            Every bearer credential that can open this workspace's door **today**
            — personal access tokens, OAuth access tokens, SCIM provisioning
            tokens and bot tokens. Revoked and expired rows are omitted: the
            claim is present-tense. Bot tokens are included even though the item
            names only the other three, because an inventory that omits a kind of
            credential is not an inventory.

            No token value and no digest is ever returned. This names
            credentials; it does not help anyone present one.
          items:
            type: object
            required:
              [
                id,
                kind,
                name,
                scopes,
                owner_id,
                owner_name,
                owner_email,
                owner_is_member,
                created_at,
                last_used_at,
                expires_at,
              ]
            properties:
              id: { type: string, format: uuid }
              kind:
                type: string
                enum: [pat, oauth, bot, scim]
              name: { type: string, nullable: true }
              scopes:
                type: array
                items: { type: string }
                description: |
                  Empty for a SCIM token by construction — its authority comes
                  from the route's principal list, not from a scope list.
              owner_id:
                type: string
                description: |
                  The owner reference as stored: an account uuid for
                  `pat`/`oauth`/`scim`, a bot id for `bot`, or the `system:scim`
                  sentinel for a provisioning token minted by something that was
                  not a person.
              owner_name: { type: string, nullable: true }
              owner_email:
                type: string
                nullable: true
                description: Resolved only when `owner_id` is a current member of this workspace.
              owner_is_member:
                type: boolean
                description: |
                  False for a bot or system credential — and, more interestingly,
                  for a token whose human owner is no longer a member. Revoking a
                  membership does not revoke that person's personal access token,
                  and that orphan is exactly what CC6.1 asks after, so it is a
                  column rather than a join the reader has to make.
              created_at: { type: string, format: date-time }
              last_used_at: { type: string, format: date-time, nullable: true }
              expires_at: { type: string, format: date-time, nullable: true }

    ScheduledExportFrequency:
      type: string
      enum: [daily, weekly, monthly]
      description: |
        How often a scheduled export runs. Not cosmetic: the scheduler derives
        the period key it deduplicates deliveries on *from* this value
        (`2026-07-31` daily, `2026-W31` weekly, `2026-07` monthly), so an unknown
        frequency would mean an undefined period and no "already delivered"
        answer.

    ScheduledExport:
      type: object
      description: |
        A standing instruction to mail one report group on a schedule
        (PRD §5.3-Reports) — the definition only; each delivery attempt is a run,
        read separately.
      required: [id, group, frequency, format, recipients, enabled, created_at, last_run_at]
      properties:
        id: { type: string, format: uuid }
        group:
          type: string
          description: A report group id — the same vocabulary `GET /reports/export?group=` uses.
        frequency: { $ref: "#/components/schemas/ScheduledExportFrequency" }
        format:
          type: string
          enum: [csv]
          description: The shape each delivery is rendered in.
        recipients:
          type: array
          items: { type: string, format: email }
          description: |
            Mailboxes each run is delivered to. Always agents of this same
            license — the destination list is bounded by the team roster, never
            free text.
        enabled:
          type: boolean
          description: Whether the scheduler picks this definition up.
        created_at: { type: string, format: date-time }
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: Last successful delivery, or `null` while none has happened.

    ScheduledExportRun:
      type: object
      description: |
        One delivery attempt of a scheduled export (PRD §5.3-Reports). The
        period is claimed before anything is mailed, so every attempt leaves one
        of these behind — failures included, with their reason.

        No recipient addresses, deliberately: `recipient_count` is how many
        mailboxes the run reached. The addresses belong to the definition, read
        under the stricter `reports_manage`.
      required:
        - id
        - period_key
        - period_from
        - period_to
        - status
        - row_count
        - recipient_count
        - error
        - created_at
      properties:
        id: { type: string, format: uuid }
        period_key:
          type: string
          description: |
            The period covered, as the deterministic label the single-delivery
            claim is keyed on: `2026-07-31` (daily), `2026-W31` (weekly),
            `2026-07` (monthly).
        period_from: { type: string, format: date-time }
        period_to: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, delivered, failed]
          description: |
            `pending` is a claimed period not yet resolved — normally a flash,
            but a process killed mid-delivery leaves one, and the history says
            so rather than pretending the run never happened. `failed` keeps its
            period: an unrecallable e-mail is not re-sent on the guess that the
            first one never left.
        row_count:
          type: integer
          description: Data rows in the CSV that was sent, excluding the header.
        recipient_count:
          type: integer
          description: Mailboxes the run actually reached — not the number configured.
        error:
          type: string
          nullable: true
          description: "Why the delivery failed: one bounded, sanitised line, or `null`."
        created_at:
          type: string
          format: date-time
          description: When the period was claimed — i.e. when the attempt started.

    CsatSummary:
      type: object
      description: |
        A satisfaction tally over some span: the donut's `good` / `bad` counts,
        their total `responses`, and `score` = good / responses. `score` is `null`
        (not `0`) when `responses` is 0 — an unrated span is unknown, not a zero.
      required: [good, bad, responses, score]
      properties:
        good: { type: integer }
        bad: { type: integer }
        responses:
          type: integer
          description: good + bad — how many ratings the span had.
        score:
          type: number
          nullable: true
          description: good / responses, rounded to three decimals. Null when unrated.

    CustomerChatState:
      type: object
      required: [online, can_start_chat, answered_by, customer, chat, events]
      properties:
        online:
          type: boolean
          description: Whether any agent is currently accepting chats.
        can_start_chat:
          type: boolean
          description: |
            Whether the widget offers a chat (WG-09) rather than the offline
            form. True while an AI would answer (an active agent with something
            to run, today's AI allowance and the visitor's own not spent), while
            anyone accepts chats, and always under the `always` availability
            mode; false only under `agents_only` with neither. True while the
            visitor has an open conversation.
        answered_by:
          type: string
          enum: [human, ai, none]
          description: |
            Who answers the visitor now (WG-09): with an open conversation its
            owner (`queue` reads `human` while anyone accepts chats, else
            `none`); without one, `ai` when an AI would answer a new chat,
            else `human` while anyone accepts chats, else `none`.
        customer:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            email: { type: string, nullable: true }
        agent:
          type: object
          nullable: true
          description: |
            Who the visitor is talking to, for the widget header (FR-MOD-11.3): a
            human assignee if there is one, otherwise the active AI persona. Null
            until either exists.
          required: [name]
          properties:
            name: { type: string }
            avatar_url: { type: string, nullable: true }
        agent_typing:
          type: boolean
          description: |
            Whether an agent is currently typing a reply (FR-MOD-02.9). The widget
            polls rather than holding a socket, so this is how the agent's live
            typing reaches the visitor. Reflects a short-lived flag the RTM gateway
            refreshes on each keystroke; false once it lapses.
        chat:
          type: object
          nullable: true
          required: [id]
          properties:
            id: { type: string }
            thread_id: { type: string, nullable: true }
            queue_position: { type: integer, nullable: true }
            estimated_wait:
              $ref: "#/components/schemas/EstimatedWait"
        campaign:
          type: object
          nullable: true
          description: |
            A proactive campaign message owed to this visitor (FR-MOD-03.3.2),
            handed over on the poll that carries it. Null on every poll with
            nothing owed, which is nearly all of them.

            At most one per poll, oldest first. A visitor matching three
            campaigns is nudged across three polls rather than shown three cards
            at once — the widget has one proactive slot, and a stack of
            unsolicited messages is what makes people install blockers.

            **Delivery is at-most-once.** The send is stamped `delivered_at` in
            the same transaction that reads it, so a response lost in transit
            takes the message with it and the visitor never sees that campaign.
            Chosen over an acknowledged, at-least-once delivery because "at
            least once" against a 4-second poll means a card that reappears
            every 4 seconds until the ack lands, and for a message nobody asked
            for a duplicate is worse than a miss.

            The consequence lands on the reporting rather than the visitor:
            delivery means "handed to the widget", the strongest claim available
            without an ack, so it can over-count by the occasional dropped
            response. Nothing here should be read as "a human saw it".

            Only delivered while the campaign is running at this moment and the
            visitor has no conversation open. A campaign switched off, or past
            its end date, stops reaching people even if the send was queued
            while it was still live; a visitor already talking to somebody has
            already done what the campaign was for.
          required: [id, message]
          properties:
            id:
              type: string
              format: uuid
              description: >-
                The campaign. Stable per visitor, so the widget can key a
                dismissal on it. Its internal name is not included — the owner
                named it for their own list, not for the visitor.
            message:
              type: string
              description: The message the campaign's author wrote.
        events:
          type: array
          description: Customer-visible events only. Internal notes never appear.
          items: { $ref: "#/components/schemas/Event" }
        owner:
          type: string
          nullable: true
          enum: [ai, human, queue, null]
          description: |
            Who has the open connection (AI-29): `human` a person is assigned,
            `queue` it waits for one, `ai` the AI answers it. The widget shows
            "Talk to an agent" while it is `ai`; the workspace cannot hide it.
            Null with no open connection.
        human_available:
          type: boolean
          description: |
            Whether anyone in the workspace is accepting chats now — what a
            press of the button would be told (AI-29-S2).
        human_button_label:
          type: string
          nullable: true
          maxLength: 40
          description: |
            The words on the button: the workspace's own, else the default in
            the language the visitor opened the conversation in. Null with no
            open connection.

    CustomerHumanRequest:
      type: object
      required: [owner, human_available, requested]
      properties:
        owner:
          type: string
          enum: [ai, human, queue]
          description: Who has the connection now.
        human_available:
          type: boolean
          description: Whether anyone at the hand-over's team is accepting chats; false is after hours.
        requested:
          type: boolean
          description: |
            True when this request handed the connection over; false when a
            person or the queue had it already (or another press was doing it).

    TrackSaleRequest:
      type: object
      description: |
        One completed order, as the widget snippet reports it (FR-MOD-13.5).

        Deliberately three fields. Everything else the record needs — which
        workspace, which visitor, which conversation — is derived server-side
        from the customer token, because the caller is a page in the visitor's
        browser and anything it can name it can also forge.

        Unknown properties are ignored rather than rejected, which is what makes
        a `license_id` sent by a hostile page a no-op instead of an error worth
        probing. A typo in one of the three fields below is still a 400: all
        three are required, so a mistyped name leaves a required field missing.
      required: [external_order_id, amount_cents, currency]
      properties:
        external_order_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:#/-]+$"
          description: >-
            The merchant's own order reference. The idempotency key: reporting
            the same one twice records one sale, not two.
        amount_cents:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000000
          description: >-
            Order total in minor units (cents). An integer so no rounding
            happens between the shop and the report. Zero is allowed — a fully
            discounted order is still a conversion.
        currency:
          $ref: "#/components/schemas/SalesTrackerCurrency"

    TrackedSale:
      type: object
      description: |
        A recorded order (`tracked_sales`). `attributed` is the field the report
        divides on: an unattributed sale still counts toward total revenue, but
        only an attributed one is revenue chat can be credited for.
      required: [id, external_order_id, amount_cents, currency, attributed, chat_id, created_at]
      properties:
        id: { type: string, format: uuid }
        external_order_id: { type: string }
        amount_cents: { type: integer, format: int32 }
        currency:
          $ref: "#/components/schemas/SalesTrackerCurrency"
        attributed:
          type: boolean
          description: >-
            Whether the visitor had a conversation inside the workspace's
            attribution window before this order.
        chat_id:
          type: string
          nullable: true
          description: The conversation credited with the sale, or null when there is none.
        created_at: { type: string, format: date-time }

    CustomerMessageResult:
      type: object
      required: [chat_id]
      properties:
        chat_id: { type: string }
        queue_position: { type: integer, nullable: true }
        event:
          oneOf:
            - $ref: "#/components/schemas/Event"
            - type: "null"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message, request_id]
          properties:
            type:
              $ref: "#/components/schemas/ErrorType"
            message:
              type: string
              description: Human-readable; never contains secrets or raw SQL.
            request_id:
              type: string
              description: Correlates with server logs and traces.
            details:
              type: object
              additionalProperties: true

    CaptchaMode:
      type: string
      enum: ["off", risk, always_on_chat_start]
      description: >-
        When the widget asks a visitor for a human check (tm 339.2 · GV-01):
        never, only when the risk signals fire (the default), or on every
        conversation a visitor opens without a pass in the last 12 hours.
        A member whose member token this workspace signed is never asked.

    ChallengeRequiredDetails:
      type: object
      description: |
        `details` of a `403 challenge_required` (tm 339.2 · GV-01): why the
        request was flagged and which check to show. The widget loads the
        provider's check with `site_key`, then repeats the request with the
        check's answer as `challenge_token`. `challenge_failed` means the
        token sent was refused — show the check again.
      required: [reason, provider, site_key]
      properties:
        reason:
          type: string
          enum:
            [
              new_customers_per_ip,
              messages_per_minute,
              ai_turns_today,
              always_on_chat_start,
              challenge_failed,
            ]
        provider:
          type: string
          enum: [turnstile, mock]
          description: >-
            `turnstile` is Cloudflare Turnstile; `mock` is the offline
            stand-in development and the tests run, which accepts the token
            `mock-captcha-pass`.
        site_key: { type: string }

    ErrorType:
      type: string
      description: Machine-readable error category (v2-03 §1.8).
      enum:
        - ai_agent_exists
        - ai_config_revision_conflict
        - ai_config_version_state
        - ai_guardrail_setup_incomplete
        - ai_mode_transition_refused
        - ai_return_blocked
        - ai_suggestion_state
        - qa_review_state
        - ai_test_run_in_progress
        - authentication
        - authorization
        - brand_exists
        - brand_not_found
        - challenge_required
        - chat_anonymized
        - chat_claim_refused
        - chat_inactive
        - customer_banned
        - greeting_not_found
        - group_expertise_missing
        - group_not_found
        - group_offline
        - group_protected
        - group_topic_role_taken
        - group_unavailable
        - groups_offline
        - impersonation_forbidden_path
        - impersonation_read_only
        - internal
        - knowledge_job_in_progress
        - knowledge_source_exists
        - license_expired
        - limit_reached
        - maintenance
        - message_rejected
        - misdirected_request
        - not_allowed
        - not_found
        - pending_requests_limit_reached
        - recipient_not_allowed
        - request_timeout
        - service_unavailable
        - takeover_conflict
        - template_locked
        - ticket_merged
        - ticket_no_recipient
        - too_many_requests
        - unsupported_version
        - users_limit_reached
        - validation
        - website_exists
        - wrong_product_version

  responses:
    BadRequest:
      description: Malformed or failing validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        Missing, malformed or expired credentials. When the bearer credential
        itself was refused — expired, revoked or never issued, the three told
        apart nowhere but the server's log — `error.details.oauth_error` is
        `invalid_token` (RFC 6750 §3.1), and renewing the access token may help.
        A 401 without it was raised about something inside the request (a wrong
        password or code), and a renewal would not.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but lacking the required scope or role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        Resource does not exist, or exists in another tenant. Both cases return
        404 so IDs cannot be enumerated (NFR-S5).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with current resource state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MisdirectedRequest:
      description: |
        This deployment does not serve the region the workspace lives in
        (NFR-C4). Nothing is wrong with the credential and no permission is
        missing; `error.details.region` names the region to retry against.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PaymentRequired:
      description: |
        The trial has expired and the workspace is read-only (ADR-10). Reads
        still succeed and nothing has been deleted; writes resume on subscribing.
        `error.details.access` is `read_only`; on a public-pilot deployment
        (`GET /deployment` → `pilot_mode`) `error.details.reason` is also
        `pilot_trial_ended` — nothing can be bought there, the way on is the
        contact address (tm 257.15).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EmbeddingUnavailable:
      description: |
        The embedding provider could not index the text (`service_unavailable`,
        tm 255.7): it timed out, refused the request, or its circuit breaker is
        open after repeated failures. The text is embedded before anything is
        written, so nothing was — a new source was not created, and an existing
        one keeps its previous text and chunks. `error.details.kind` names the
        failure class; the request can simply be repeated.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AppProviderUnavailable:
      description: |
        The live Apps provider did not answer in time, or answered with an
        error of its own (`service_unavailable`, tm 263):
        `error.details.reason` is `app_provider_unavailable` and
        `details.provider_reason` names the class (`unreachable`,
        `provider_error`). Nothing was written; an earlier connection stays,
        and the request can simply be repeated.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MessageSearchTimedOut:
      description: |
        The message text search ran out of time (`service_unavailable`,
        ID-07): `error.details.reason` is `search_timeout`. Nothing was
        written. A narrower search — another word, a shorter date range — is
        likelier to answer than the same one repeated.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LlmUnavailable:
      description: |
        The language model did not write the text (`service_unavailable`,
        tm 257.5): it timed out, refused or cut off its answer, the provider
        failed, or its circuit breaker is open after repeated failures.
        `error.details.kind` names the failure class (`timeout`, `no_answer`,
        `circuit_open`, …). Nothing was written; the request can simply be
        repeated. On the draft rewrite (tm 257.6) `kind: no_answer` also
        carries `error.details.reason` (`length`, `refusal`, `empty`, …); with
        `length` the same draft will be cut off again, so it should be
        shortened rather than retried.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequestsOrAiDailyCap:
      description: |
        Either the rate limit (`too_many_requests`, as everywhere), or today's
        AI allowance is used up (`limit_reached`, tm 257.8):
        `error.details.reason` is `ai_daily_cap`, `error.details.meter` the
        counter (`llm` for a model's writing, `embedding` for indexing and
        searching text — tm 257.20; `llm_test` / `embedding_test` for a
        simulation's, a fifth of the live allowance — tm 283.2) and
        `error.details.scope` whose allowance it was — `workspace` (this
        workspace's: its own when the platform set one, else the
        deployment's default) or `global` (the whole deployment's). No
        provider was called and nothing was written.
        Allowances are counted in provider tokens per UTC day and renew at
        00:00 UTC, which `Retry-After` counts down to; retrying sooner gets the
        same answer. Only a deployment with a real model counts; the
        in-process stub never returns the cap.
      headers:
        Retry-After:
          description: Seconds until the caller may retry — for the AI cap, until the next 00:00 UTC.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the caller may retry.
          schema: { type: integer }
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          description: Unix timestamp (seconds) when the window resets.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  parameters:
    AiConfigAgentId:
      name: ai_agent_id
      in: query
      required: true
      description: The customer-facing AI agent.
      schema: { type: string, format: uuid }
    AiConfigVersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AiConfigIfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The draft revision the caller loaded (`"12"`), as the `ETag` of
        `GET /ai/config/draft/diff` gave it. A draft moved past it is
        `409 ai_config_revision_conflict`; absent or `*`, no condition.
      schema: { type: string, maxLength: 24 }
    AiConfigChangeEntityType:
      name: entity_type
      in: query
      schema: { $ref: "#/components/schemas/AiConfigEntityType" }
    AiConfigChangeEntityId:
      name: entity_id
      in: query
      schema: { type: string, format: uuid }
    AiConfigChangeAction:
      name: action
      in: query
      schema: { $ref: "#/components/schemas/AiConfigChangeAction" }
    AiConfigChangeActorId:
      name: actor_id
      in: query
      description: An account id, or a system job's name.
      schema: { type: string, maxLength: 200 }
    AiConfigChangeVersionId:
      name: version_id
      in: query
      schema: { type: string, format: uuid }
    AiConfigChangeFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    AiConfigChangeTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
    PageId:
      name: page_id
      in: query
      required: false
      description: Opaque keyset cursor from the previous page.
      schema: { type: string }
    ChatId:
      name: chatId
      in: path
      required: true
      description: "Short base32 chat token. Panelde: Thread ID (günlük)."
      schema: { type: string, minLength: 10, maxLength: 12 }
    ChannelTypePath:
      name: type
      in: path
      required: true
      description: The adapter channel.
      schema: { $ref: "#/components/schemas/ChannelType" }
    EmailAddressIdPath:
      name: addressId
      in: path
      required: true
      description: The forwarding address's id, as `GET /channels/email/addresses` returns it.
      schema: { type: string, format: uuid }
    GroupIdPath:
      name: groupId
      in: path
      required: true
      description: The team's numeric id, as `GET /groups` returns it.
      schema: { type: integer, format: int64, minimum: 1 }
    AgentIdPath:
      name: agentId
      in: path
      required: true
      description: The agent account's uuid.
      schema: { type: string, format: uuid }
    BrandHeader:
      name: X-SiyahTus-Brand
      in: header
      required: false
      description: |
        Scope the request to one brand of the caller's license (Multibrand,
        PRD §5.3 · NFR-S4). Omitted means every brand of the license — the
        single-brand default, so a workspace that never uses Multibrand is
        unaffected. A brand id that is not one of the caller's own is answered
        404, never 403, so brand ids stay un-enumerable across licenses (NFR-S5).
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    BenchmarkBaseline:
      name: baseline
      in: query
      required: false
      description: |
        Which of **this license's own** past windows the report is benchmarked
        against (FR-MOD-07.7 "benchmark comparison"). Defaults to
        `previous_period`, the comparison the Overview and Reviews reports made
        before this parameter existed, so omitting it changes nothing.

        - `previous_period` — the equal-length window immediately before the
          requested one, ending a millisecond short of `from` so no instant
          falls in both.
        - `previous_year` — the same window shifted back 365 days: the
          comparison for a seasonal figure, where the period immediately before
          is the wrong yardstick. A fixed 365 days rather than calendar-year
          arithmetic, so a leap day cannot make the two windows different
          lengths.

        There is deliberately **no** cross-license baseline — no industry
        average, peer cohort or anonymised pool. Every report figure comes from
        a license-scoped query under RLS (NFR-S4); a benchmark against other
        licenses would have to read rows this tenant may not see, and
        aggregation does not make that safe when the cohort can be narrowed to
        one. An unrecognised value is a 400, not a silent fallback, so
        `baseline=industry` fails loudly rather than appearing supported.
      schema: { type: string, enum: [previous_period, previous_year] }
    AiMetricsTeam:
      name: team_id
      in: query
      required: false
      description: Only this team's connections (AI-25 filters).
      schema: { type: string, pattern: "^[0-9]{1,18}$" }
    AiMetricsBrand:
      name: brand_id
      in: query
      required: false
      description: Only the connections that came in through this brand.
      schema: { type: string, format: uuid }
    AiMetricsIntent:
      name: intent
      in: query
      required: false
      description: Only the connections about this topic (the procedure's key).
      schema: { type: string, minLength: 1, maxLength: 200 }
    AiMetricsVersion:
      name: config_version_id
      in: query
      required: false
      description: Only the connections this AI configuration version answered.
      schema: { type: string, format: uuid }
    AiMetricsLanguage:
      name: language
      in: query
      required: false
      description: Only the connections in this language.
      schema: { type: string, minLength: 2, maxLength: 16 }
    ReportRangeFrom:
      name: from
      in: query
      required: false
      description: |
        Start of the reporting window. Defaults to 30 days before `to`.

        **A report covers at most 366 days.** A wider `from`/`to` span is a 400,
        not a slow request (NFR-P7): the "heavy reports" answer the PRD gives is
        a read replica or a column-store analytics warehouse, neither of which
        this deployment has, so the window a single query may scan is bounded
        instead. 366 rather than 365 so a twelve-month window that spans a leap
        day is not the one that fails. The limit applies to the group endpoints
        and to `/reports/export` alike — both run the same aggregation, so
        capping only the download would leave the identical scan one query
        string away.
      schema: { type: string, format: date-time }
    ReportRangeTo:
      name: to
      in: query
      required: false
      description: |
        End of the reporting window. Defaults to now. The 366-day span limit
        described on `from` is measured across this pair.
      schema: { type: string, format: date-time }

security:
  - bearerAuth: []
  - basicPat: []
