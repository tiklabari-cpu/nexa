components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.1 access token or customer token.
    basicPat:
      type: http
      scheme: basic
      description: "Personal Access Token — `base64(account_id:pat)`."

  schemas:
    NotificationPreferences:
      type: object
      description: |
        Every channel the product can reach one person through, for one
        workspace (FR-MOD-13.8, FR-MOD-08.2).

        `enabled` is a master switch over the *interruptive* channels — `sound`,
        `desktop`, `push` — and deliberately not over `email`. Those three
        announce something now; e-mail is the fallback for somebody who is not
        at a screen at all, and "stop interrupting me" was never a request to
        stop the fallback as well.

        All five default to on. The failure this product cannot afford is an
        agent who never learns a visitor is waiting, so a new member is
        reachable and opts out rather than in.
      required: [enabled, sound, desktop, push, email]
      properties:
        enabled: { type: boolean }
        sound: { type: boolean }
        desktop: { type: boolean }
        push: { type: boolean }
        email: { type: boolean }
    UiPreferences:
      type: object
      description: |
        How one person has arranged the console, for one workspace
        (FR-MOD-08.1).

        `settings_nav_pinned` is the Settings side navigation's "Unpin side
        navigation" switch. It defaults to `true` — the navigation is the only
        way between Settings sections, so a new member sees it and folds it away
        rather than having to discover it.
      required: [settings_nav_pinned, font_preset, font_preset_set_at]
      properties:
        settings_nav_pinned: { type: boolean }
        font_preset:
          allOf:
            - $ref: "#/components/schemas/PanelFontPreset"
          nullable: true
          description: |
            The panel font this member chose; `null` follows the workspace
            default. Whether it applies is `GET /auth/me`'s `appearance`: the
            later of this choice and the workspace default wins.
        font_preset_set_at:
          type: string
          format: date-time
          nullable: true
          description: When `font_preset` was chosen. Read-only; `null` with no choice.
    PanelFontPreset:
      type: string
      description: |
        One of the panel's five font presets (owner, 2026-10-13;
        `@siyahtus/types` · `PANEL_FONT_PRESETS`). `inter` is the panel's
        built-in look.
      enum: [inter, plus-jakarta, manrope-dm-sans, nunito, figtree]
    WorkspaceAppearanceSettings:
      type: object
      description: |
        The workspace's default panel font (`workspace_appearance_settings`),
        set by the owner only. `null` = no default: members see the built-in
        Inter unless they chose a font of their own. License-scoped, not
        brand-scoped.
      required: [font_preset, font_preset_set_at]
      properties:
        font_preset:
          allOf:
            - $ref: "#/components/schemas/PanelFontPreset"
          nullable: true
        font_preset_set_at:
          type: string
          format: date-time
          nullable: true
          description: When the owner last set the default; `null` with none.
    UpdateWorkspaceAppearanceSettings:
      type: object
      additionalProperties: false
      required: [font_preset]
      properties:
        font_preset:
          allOf:
            - $ref: "#/components/schemas/PanelFontPreset"
          nullable: true
          description: The new default, or `null` to remove it.
    PanelAppearance:
      type: object
      description: |
        What the panel paints, resolved on the server: the later of the
        workspace default and the caller's own choice, or the built-in Inter
        when neither exists. Both layers ride along so the account menu can
        say where the font comes from.
      required:
        [
          effective_font_preset,
          source,
          workspace_font_preset,
          workspace_font_preset_set_at,
          user_font_preset,
          user_font_preset_set_at,
        ]
      properties:
        effective_font_preset:
          $ref: "#/components/schemas/PanelFontPreset"
        source:
          type: string
          enum: [builtin, workspace, user]
        workspace_font_preset:
          allOf:
            - $ref: "#/components/schemas/PanelFontPreset"
          nullable: true
        workspace_font_preset_set_at: { type: string, format: date-time, nullable: true }
        user_font_preset:
          allOf:
            - $ref: "#/components/schemas/PanelFontPreset"
          nullable: true
        user_font_preset_set_at: { type: string, format: date-time, nullable: true }
    Health:
      type: object
      description: |
        `status` + `service` are always present. Every other field is
        admin-only (M-SEC-b2) — absent for an anonymous or non-admin caller,
        present together for an admin-role one.
      required: [status, service]
      properties:
        status:
          type: string
          description: |
            `ok` every dependency is reachable · `degraded` at least one is not
            (503) · `draining` the process is shutting down and has taken
            itself out of rotation on purpose (503, M-OPS-b). The last two share
            a status code because an orchestrator should stop routing either
            way, and are told apart here because the responses a human owes them
            are opposite ones.
          enum: [ok, degraded, draining]
        service:
          type: string
          examples: [api]
        version:
          type: string
        region:
          type: string
          enum: [eu]
        uptime_s:
          type: number
        dependencies:
          type: object
          required: [database, redis]
          properties:
            database: { $ref: "#/components/schemas/DependencyHealth" }
            redis: { $ref: "#/components/schemas/DependencyHealth" }
        scheduler: { $ref: "#/components/schemas/SchedulerHealth" }
        event_partitions: { $ref: "#/components/schemas/EventPartitionsHealth" }
        ai_jobs:
          description: Null when the queue could not be read.
          allOf:
            - $ref: "#/components/schemas/AiJobsHealth"
          nullable: true
        providers: { $ref: "#/components/schemas/HealthProviders" }

    DeploymentConfig:
      type: object
      description: |
        Deployment-wide settings (tm 257.13), the same for every caller and
        never about a workspace. Each field the panel reads to hide something
        is also enforced by the API itself.
      required:
        [
          pilot_mode,
          contact_email,
          signup_enabled,
          email_verification_required,
          privacy_policy_url,
          terms_url,
          terms_version,
        ]
      additionalProperties: false
      properties:
        pilot_mode:
          type: boolean
          description: |
            This deployment is the public pilot (`PILOT_MODE`). Surfaces that
            are mocks are hidden in the panel and refused by the API with
            `403 not_allowed`, `error.details.reason: "pilot_mode"`.
        contact_email:
          type: string
          nullable: true
          format: email
          description: |
            Where pilot users write to (`PILOT_CONTACT_EMAIL`); `null` when the
            deployment names none. Always set on a production pilot.
        signup_enabled:
          type: boolean
          description: |
            Whether `POST /auth/signup` creates workspaces here
            (`SIGNUP_ENABLED`); off, it answers `403` with `signup_closed`.
        email_verification_required:
          type: boolean
          description: |
            Whether a new owner must prove the address before the first
            sign-in (`SIGNUP_EMAIL_VERIFICATION`, tm 257.7): sign-up then
            answers `202` with no session, and `/auth/authorize` refuses the
            owner with `403` `email_unverified` until `POST /auth/verify-email`.
        privacy_policy_url:
          type: string
          nullable: true
          format: uri
          description: |
            This deployment's privacy policy (`PRIVACY_POLICY_URL`, tm 257.9),
            an `https` address; `null` when the deployment names none. One
            policy for the whole deployment — the panel's users and the widget's
            visitors alike.
        terms_url:
          type: string
          nullable: true
          format: uri
          description: |
            This deployment's terms of service (`TERMS_URL`), an `https`
            address; `null` when the deployment names none. Set, sign-up
            requires accepting them: `POST /auth/signup` must carry
            `terms_version` equal to the one below.
        terms_version:
          type: string
          nullable: true
          maxLength: 64
          description: |
            The version of the terms at `terms_url` (`TERMS_VERSION`), the value
            a sign-up form sends back as `terms_version`. Never `null` while
            `terms_url` is set.
        live_apps:
          type: array
          items: { type: string, enum: [brevo, freshdesk, telegram] }
          description: |
            The Apps cards and channels this deployment connects to their real
            provider (tm 263, `APPS_LIVE_PROVIDERS`). Under `pilot_mode` these
            are the only ones served. Names only — never a key.

    DeploymentNotice:
      type: object
      description: |
        What the root panel's operators want every panel user to see (tm
        389.13 · FR-ADMIN-15): an announcement, and maintenance mode while it
        is on. `null` for either means nothing to show.
      required: [announcement, maintenance]
      additionalProperties: false
      properties:
        announcement:
          oneOf:
            - $ref: "#/components/schemas/DeploymentAnnouncement"
            - type: "null"
        maintenance:
          oneOf:
            - $ref: "#/components/schemas/DeploymentMaintenance"
            - type: "null"

    DeploymentAnnouncement:
      type: object
      description: |
        The operator's announcement, in both languages the panel ships. It
        stops being served once `until` has passed.
      required: [level, en, tr, until]
      additionalProperties: false
      properties:
        level: { type: string, enum: [info, warning, critical] }
        en: { type: string, minLength: 1, maxLength: 500 }
        tr: { type: string, minLength: 1, maxLength: 500 }
        until:
          type: string
          nullable: true
          format: date-time
          description: When it comes down by itself; `null` keeps it up.

    DeploymentMaintenance:
      type: object
      description: |
        Maintenance mode. `full`: every request but health, this notice,
        `/deployment` and signing out answers `503 maintenance`, and the
        realtime gateway refuses sockets. `read_only`: reads and signing in
        work, every other write answers `503 maintenance`.
      required: [mode, message]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [read_only, full] }
        message:
          type: object
          nullable: true
          description: The operator's words; `null` uses the panel's own sentence.
          required: [en, tr]
          additionalProperties: false
          properties:
            en: { type: string, minLength: 1, maxLength: 500 }
            tr: { type: string, minLength: 1, maxLength: 500 }

    DependencyHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        latency_ms:
          type: number
        error:
          type: string

    SchedulerHealth:
      type: object
      description: |
        The in-process background scheduler (M-SCHED · §D113/K1) — idle-chat
        auto-close, SLA breach marking, the SIEM export, scheduled reports and
        retention. `enabled` false means this process runs none of them (every
        job below is still listed, each `disabled`); a deployment that would
        rather drive the sweeps from a host cron leaves it off and uses each
        job's own `pnpm --filter @siyahtus/api <job>:run` script instead.
      required: [enabled, jobs]
      properties:
        enabled:
          type: boolean
        jobs:
          type: array
          items: { $ref: "#/components/schemas/SchedulerJob" }

    SchedulerJob:
      type: object
      required: [name, interval_ms, enabled, last_run_at, last_status]
      properties:
        name:
          type: string
          examples: [chat_timeout, sla, siem, scheduled_reports, retention]
        interval_ms:
          type: integer
        enabled:
          type: boolean
          description: |
            False for a job registered but switched off from the moment it was
            registered — `retention`, gated by `RETENTION_ENABLED` because it
            hard-deletes data, and `unverified_signups`, which runs only while
            `SIGNUP_EMAIL_VERIFICATION` is on: with it off an unverified account
            signs in like any other, so there is nothing to delete it for.
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: When the job last ticked, whatever came of it. Null before its first pass.
        last_status:
          type: string
          nullable: true
          enum: [ok, skipped, error, disabled]
        last_error_class:
          type: string
          description: The error's class, never its message — driver messages can carry connection strings.

    EventPartitionsHealth:
      type: object
      description: |
        The `events` monthly partition maintenance (SEMA-MIMARI.8.4c · PLAN
        §D187). Not a scheduler job: every API process runs it at boot and
        every `interval_ms`, whatever `SCHEDULER_ENABLED` says, opening each
        month from `months_behind` before the current one to `months_ahead`
        after it. A month that has no partition when its first event arrives
        sends every event of that month to the unindexed `events_default`
        catch-all, so a failing pass is worth noticing three months early —
        which is what this block is for. It never changes the status code:
        the process still serves, and restarting it fixes nothing.
      required:
        [
          interval_ms,
          months_ahead,
          months_behind,
          last_run_at,
          last_status,
          consecutive_errors,
          failed_months,
        ]
      properties:
        interval_ms:
          type: integer
        months_ahead:
          type: integer
        months_behind:
          type: integer
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: When the last pass finished, whatever came of it. Null only before the boot pass.
        last_status:
          type: string
          nullable: true
          enum: [ok, error]
          description: "`error` when at least one month of the last pass failed."
        consecutive_errors:
          type: integer
          description: Failed passes in a row; back to 0 on the first clean one.
        failed_months:
          type: array
          description: The months the last pass could not open or secure. Empty when it was clean.
          items:
            type: object
            required: [month, error_code]
            properties:
              month:
                type: string
                pattern: "^[0-9]{4}-[0-9]{2}$"
                examples: ["2026-12"]
              error_code:
                type: string
                description: |
                  The SQLSTATE the database answered with — `42501` the
                  runtime role lacks the owner's rights (the maintenance
                  functions lost SECURITY DEFINER), `23514` rows for that
                  month already sit in `events_default` (the owner releases
                  them — `docs/runbooks/event-partitions.md`), `55P03` a lock
                  was not free within a second (retried next pass). When the
                  database never answered, the error's class. Never the
                  message.
                examples: ["42501", "23514", "55P03"]

    AiJobsHealth:
      type: object
      description: |
        The durable AI job queue (tm 289.5 · ADR-11a · GV-02), across every
        workspace: the replies visitor messages are still owed. A queue that
        grows, or whose oldest job keeps ageing, means no worker is taking
        jobs; past 120 s a job is handed to a person instead of answered.
        Body only, never the status code.
      required: [pending, running, oldest_age_s]
      properties:
        pending:
          type: integer
          description: Jobs waiting for a worker, those handed back for a retry included.
        running:
          type: integer
          description: Jobs a worker holds right now.
        oldest_age_s:
          type: number
          nullable: true
          description: |
            Seconds since the oldest unfinished (`pending` or `running`) job
            was written, by the database's clock. Null when there is none.

    HealthProviders:
      type: object
      description: |
        Which implementation each mockable dependency (M-ENV-b · §D113/K3)
        currently runs, read straight off the validated environment — so an
        operator can tell "mail is really SMTP" from "mail writes to disk"
        without reading `.env` on the box. Every dependency here is mocked or
        file-backed by default (MASTER-PROMPT "dış servisler mock'lanır");
        none of these becoming a real provider changes this endpoint's shape.
      required: [mail, push, storage, payment, siem, llm, virus_scanner]
      properties:
        mail:
          type: string
          examples: [file]
        push:
          type: string
          examples: [file]
        storage:
          type: string
          examples: [local]
        payment:
          type: string
          examples: [mock]
        siem:
          type: string
          examples: [file]
        llm:
          type: string
          examples: [mock]
        virus_scanner:
          type: string
          examples: [mock]

    TokenGrant:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope, account_id, license_id]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          description: Seconds. Capped at 3600 — the source platform used 28800.
        refresh_token:
          type: string
          description: Rotates on every use; the previous value stops working.
        scope: { type: string, description: Comma-separated. }
        account_id: { type: string, format: uuid }
        license_id: { type: string }
        organization_id: { type: string, format: uuid }

    ImpersonationState:
      type: object
      description: |
        A SiyahTuş operator signed in as this member from the root panel
        (FR-ADMIN-21 · tm 389.15). Who the operator is stays in the audit
        trail (`actor_type: platform`); the console needs only the terms.
      required: [session_id, mode, ends_at]
      properties:
        session_id: { type: string, format: uuid }
        mode:
          type: string
          enum: [read_only, full]
          description: |
            `read_only` refuses every write but signing out and ending the
            session; `full` acts as the member. Neither reaches past the
            member's role.
        ends_at:
          type: string
          format: date-time
          description: When the session, and every token traded for it, stops working.

    ImpersonationGrant:
      type: object
      required:
        [
          access_token,
          token_type,
          expires_in,
          account_id,
          license_id,
          organization_id,
          impersonation,
        ]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          description: Seconds until `impersonation.ends_at`. There is no refresh token.
        account_id:
          type: string
          format: uuid
          description: The member the operator is signed in as.
        license_id: { type: string }
        organization_id: { type: string, format: uuid }
        impersonation: { $ref: "#/components/schemas/ImpersonationState" }

    Chat:
      type: object
      required: [id, license_id, customer_id, active, created_at, access, users]
      properties:
        id:
          type: string
          description: |
            Short base32 token, e.g. TJ1H8CFKRV. Panelde: Thread ID (günlük) —
            the member's conversation container for the day; every connection
            (`Thread`) of that day sits under it. The field name does not change;
            only the panel's label does (docs/adr/conversation-day-ids.md).
        license_id: { type: string }
        customer_id: { type: string, format: uuid }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        access:
          type: object
          properties:
            group_ids:
              type: array
              items: { type: integer, format: int64 }
        users:
          type: array
          items: { $ref: "#/components/schemas/ChatUser" }
        thread:
          description: The newest connection — the open one while the chat is active.
          allOf:
            - $ref: "#/components/schemas/Thread"
        local_day:
          type: string
          format: date
          nullable: true
          description: |
            The conversation day this chat is filed under (`YYYY-MM-DD`, ID-02):
            one chat per member per day, counted in the workspace's day
            boundary (`day_boundary_timezone` / `day_boundary_hour` of
            `/settings/chat-timeout`) as it stood when the chat opened. Written
            once and never recomputed, so a later change of the setting does
            not move it. Null for a chat that is not filed under a day — every
            chat opened before the daily model; such a chat spans the whole
            relationship rather than one day.
        connections:
          type: array
          items: { $ref: "#/components/schemas/ChatConnection" }
          description: |
            The connections (`Thread`s, "Panelde: Chat ID") this chat holds
            for its day, oldest first; read any one's transcript with
            `GET /chats/{chatId}/events?thread_id=`. A chat with a `local_day`
            lists every connection of that day. A chat without one lists only
            its newest connection: it is not a day, and its older threads are
            earlier visits rather than today's connections.
        latest_ai_handoff:
          description: |
            The newest card the AI wrote in this chat (AI-10) — on the agent's
            fetch of a single chat (`GET /chats/{chatId}`) only; null when the AI
            handed nothing over. Never on the customer's view.
          allOf:
            - $ref: "#/components/schemas/AiHandoffCard"
          nullable: true
        visitor:
          description: |
            The customer's most recent visit for this license, projected onto
            the chat so the Details panel can show where the visitor came from
            without a second call (FR-MOD-02.4). Null when nothing was recorded,
            and omitted entirely on the customer's own view — the IP in
            particular is personal data the widget never receives (NFR-S9).
          allOf:
            - $ref: "#/components/schemas/ChatVisitor"
          nullable: true

    ChatTransferResult:
      description: |
        The chat after a hand-off (`POST /chats/{chatId}/transfer`), with what
        became of it (IN-04).
      allOf:
        - $ref: "#/components/schemas/Chat"
        - type: object
          required: [outcome, visible_to_caller]
          properties:
            outcome:
              type: string
              enum: [assigned, queued]
              description: |
                `assigned` — someone has it (the named agent, or a member of
                the team); `queued` — nobody in the team was free, so it waits
                in that team's queue for the next member who is.
            visible_to_caller:
              type: boolean
              description: |
                Whether the caller can still open the conversation. False after
                a team hand-off by someone outside the receiving team who never
                joined the conversation: the console moves on instead of
                re-reading a chat it would be refused.

    ChatSummary:
      type: object
      required: [id, customer_id, active, created_at]
      properties:
        id:
          type: string
          description: "Panelde: Thread ID (günlük) — the same `chat_id` token as `Chat.id`."
        customer_id: { type: string, format: uuid }
        customer_name: { type: string, nullable: true }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        thread_id:
          type: string
          nullable: true
          description: "Panelde: Chat ID (bağlantı) — the most recent connection of this day."
        assignee_id: { type: string, format: uuid, nullable: true }
        queue_position: { type: integer, nullable: true }
        queue_group_id:
          type: integer
          format: int64
          nullable: true
          description: |
            The team whose queue the newest connection waits in (AU-01 ·
            ADR-08a §2.1) — null while it waits in none (`queue_position`
            null). The `queue_position` is that team's number.
        priority:
          description: How pressing the newest connection is; `normal` for a chat with none.
          allOf:
            - $ref: "#/components/schemas/ThreadPriority"
        inactive:
          type: boolean
          description: |
            The newest connection is open and inactive (WG-03): quiet for the
            workspace's `inactive_after_seconds`, so it does not count against
            its agent's concurrent limit until the next message. The inbox
            shows the row dimmed. False for a closed or a lively one.
        unread_count: { type: integer }
        connection_count:
          type: integer
          minimum: 0
          description: |
            How many connections `Chat.connections` lists for this chat — the
            day's connections when the chat has a `local_day`, otherwise at most
            one (its newest). The list row's "N connections".
        last_event:
          allOf:
            - $ref: "#/components/schemas/Event"
          nullable: true
        tags:
          type: array
          items: { type: string }
        match:
          description: |
            Present only on a text search (`GET /chats?query=`, ID-07): the
            message this conversation was found by.
          allOf:
            - $ref: "#/components/schemas/MessageSearchMatch"

    MessageSearchMatch:
      type: object
      required: [event_id, thread_id, created_at, snippet, highlights, match_count, internal]
      description: |
        A conversation's newest message containing every word of the query
        (ID-07). `created_at` is to the millisecond.
      properties:
        event_id: { type: string, description: The message. }
        thread_id: { type: string, description: 'Its connection (panel "Chat ID").' }
        created_at: { type: string, format: date-time }
        snippet:
          type: string
          description: |
            The message around its first match: up to 60 characters either
            side, `…` where the text was cut.
        highlights:
          type: array
          description: Where the query's words sit in `snippet` — character ranges, in order, never overlapping.
          items: { $ref: "#/components/schemas/TextRange" }
        match_count:
          type: integer
          minimum: 1
          description: Matching messages in the conversation, this one included.
        internal:
          type: boolean
          description: The message is an internal note, which the visitor never saw.

    TextRange:
      type: object
      required: [start, end]
      description: A character range `[start, end)` (UTF-16 code units, as JavaScript indexes a string).
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }

    ChatUser:
      type: object
      required: [user_id, user_type, present]
      properties:
        user_id: { type: string }
        user_type: { type: string, enum: [agent, customer] }
        present: { type: boolean }
        seen_up_to: { type: string, format: date-time, nullable: true }
        name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }

    Thread:
      type: object
      required: [id, chat_id, active, created_at]
      properties:
        id:
          type: string
          description: "Panelde: Chat ID (bağlantı) — one connection (`thread_id`)."
        chat_id:
          type: string
          description: "Panelde: Thread ID (günlük) — the day container this connection sits under."
        active: { type: boolean }
        assignee_id: { type: string, format: uuid, nullable: true }
        queue_position: { type: integer, nullable: true }
        summary: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        opened_via:
          description: How this connection came to exist; null on a thread opened before ID-02.
          allOf:
            - $ref: "#/components/schemas/ConnectionOpenedVia"
          nullable: true
        ai_mode:
          type: string
          enum: [ai, human, paused]
          nullable: true
          description: |
            Who answers the connection (AI-11). `ai`: the AI agent; `human`: a
            person has it and the AI stays silent; `paused`: the AI is held
            back without a person having taken it. Null until the AI or a
            person takes part — the AI may still answer. Changes are pushed to
            agents as `chat_ai_mode_changed`.
        priority:
          description: |
            How pressing the connection is (AI-12 · ADR-08a §2.3); `normal`
            until a hand-over or a route raises it. Never lowered.
          allOf:
            - $ref: "#/components/schemas/ThreadPriority"
        priority_reason:
          type: string
          nullable: true
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: |
            The hand-over reason (a catalogue code such as
            `guardrail_self_harm`) that last raised `priority`; null while
            nothing has.
        ai_took_part:
          type: boolean
          description: |
            Whether the AI has answered in this connection — what tells a
            `human` connection the AI was taken off from one a person answered
            from the start. Present only on the agent's fetch of a single chat
            (`GET /chats/{chatId}`).
        tags:
          type: array
          items: { type: string }
        rating:
          allOf:
            - $ref: "#/components/schemas/ThreadRating"
          nullable: true
          description: |
            The player's rating of this connection (AR-03 · WG-11), with its
            comment. Null when it is not rated, or when the caller may not see
            it (`ratings.view`: an Ekip Üyesi reads the ratings of their own
            connections). Present only on the agent's fetch of a single chat
            (`GET /chats/{chatId}`); a change is pushed as `chat_rated`.

    ThreadRating:
      type: object
      required: [value, has_comment, comment, rated_at]
      properties:
        value: { type: string, enum: [good, bad] }
        has_comment: { type: boolean }
        comment:
          type: string
          nullable: true
          description: Plain text as the player wrote it, sensitive values masked.
        rated_at: { type: string, format: date-time }

    ReviewComment:
      type: object
      required: [rating_id, chat_id, thread_id, value, comment, rated_at, customer, assignee]
      description: One rating with a comment, as the Reviews report lists it (WG-11).
      properties:
        rating_id: { type: string, format: uuid }
        chat_id: { type: string, description: The day (panel "Thread ID"). }
        thread_id: { type: string, description: The connection (panel "Chat ID"). }
        value: { type: string, enum: [good, bad] }
        comment: { type: string, description: Plain text, sensitive values masked. }
        rated_at: { type: string, format: date-time }
        customer:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
        assignee:
          type: object
          nullable: true
          description: Who had the connection — at the close, for a closed one.
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }

    ReviewCommentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewComment" }
        next_page_id: { type: string }

    ChatConnection:
      type: object
      required: [id, active, created_at, closed_at, assignee_id, opened_via, group_id]
      description: |
        One connection of a chat's day (ID-02), as `Chat.connections` lists it —
        enough to draw the separators between connections and to fetch each
        transcript, without the transcript itself.
      properties:
        id:
          type: string
          description: "Panelde: Chat ID (bağlantı) — the `thread_id` to read its events with."
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        assignee_id: { type: string, format: uuid, nullable: true }
        opened_via:
          allOf:
            - $ref: "#/components/schemas/ConnectionOpenedVia"
          nullable: true
        group_id:
          type: integer
          format: int64
          nullable: true
          description: |
            The team this connection went to: the one routing chose, the one
            it was opened in, or the one a transfer handed it to. Null when it
            went to no single team (none, or several named at once) and on a
            connection opened before the team was recorded. The chat's
            `access` is the union over its connections — a team that handled
            one connection of the day reads the whole day (ID-02-S7).

    ConnectionOpenedVia:
      type: string
      description: |
        How a connection (`thread`) came to exist (ID-02):
        `first_of_day` — the member's first connection of the day, which opens
        the day's chat · `same_day_return` — the member came back the same day,
        a new connection under the same chat · `agent_start` — an agent started
        the conversation · `agent_reopen` — an agent reopened an archived
        conversation · `day_rollover` — opened as yesterday's silent connection
        was closed at the turn of the day. Null (on `Thread` and
        `ChatConnection`) for a connection opened before ID-02.
      enum: [first_of_day, same_day_return, agent_start, agent_reopen, day_rollover]

    ChatVisitor:
      type: object
      required: [visited_pages, visit_info]
      description: |
        A visit projected onto the chat surface (FR-MOD-02.4.1-.6): the pages the
        visitor saw and a short summary of the session.
      properties:
        visited_pages:
          type: array
          description: Pages seen during the visit, in order.
          items:
            type: object
            required: [url]
            properties:
              url: { type: string }
              at: { type: string, format: date-time }
        visit_info:
          type: object
          required: [device, referrer, duration_seconds, ip, country_code, city, ongoing]
          properties:
            device:
              type: string
              nullable: true
              description: Browser and operating system, e.g. "Chrome on macOS".
            referrer:
              type: string
              nullable: true
              description: Referring URL, when the browser sent one.
            duration_seconds:
              type: integer
              nullable: true
              description: Elapsed time of the visit in seconds; null if unknown.
            ip:
              type: string
              nullable: true
              description: Visitor IP (NFR-S9 personal data; agents only).
            country_code:
              type: string
              nullable: true
              description: |
                ISO 3166-1 alpha-2 country the visit came from (GEOIP-COUNTRY ·
                tm 330), resolved once at the visit's start from the address,
                inside the API against an offline database. Null when no
                database is configured or the address is not in it.
            city:
              type: string
              nullable: true
              description: City the visit came from, on the same terms as `country_code`. No coordinates are kept.
            ongoing:
              type: boolean
              description: |
                True while the visit is still open (no recorded end). The PRD
                asks for a live duration, and `duration_seconds` is only a
                measurement taken when the response was written: a client may
                tick it forward while this is true, and must not while it is
                false — a finished visit has a fixed length, and a counter
                climbing past it would be an invented number.

    ChatSupervision:
      type: object
      required: [chat_id, agent_id, started_at, last_seen_at]
      description: |
        One agent watching one conversation they do not own (FR-MOD-13.2).
        `started_at` is when they began and survives every heartbeat;
        `last_seen_at` is the heartbeat itself, and once it falls outside the
        liveness window the row is treated as a closed tab rather than a watcher.
      properties:
        chat_id: { type: string }
        agent_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    Event:
      type: object
      required: [id, chat_id, thread_id, type, author_type, recipients, created_at]
      properties:
        id:
          type: string
          description: "`<thread_id>_<sequence>` — ordering is decidable from the id alone."
        chat_id:
          type: string
          description: "Panelde: Thread ID (günlük)."
        thread_id:
          type: string
          description: "Panelde: Chat ID (bağlantı)."
        type:
          type: string
          enum: [message, system_message, rich_message, file, filled_form]
        text: { type: string, nullable: true }
        author_id: { type: string, nullable: true }
        author_type: { type: string, enum: [agent, customer, bot, system] }
        recipients:
          type: string
          enum: [all, agents]
          description: "`agents` is an internal note and never reaches the customer."
        attachment_url: { type: string, nullable: true }
        properties:
          type: object
          additionalProperties: true
          description: |
            Free-form, with three reserved keys the server owns: `edited_at`
            (ISO-8601, present once the message has been corrected after
            sending), `edited_by` (the account that corrected it) and
            `sensitive_types` (tm 300.2 · AI-26: the kinds of value masked out
            of `text` before it was stored — `card`, `cvv`, `otp`, `password`,
            `iban`, `seed_phrase`, `private_key`, `banking_credential` — in that
            order). All three are stripped from a caller-supplied `properties`
            on send, so a client cannot make a fresh message claim it was
            edited or masked. The warning a visitor is shown after sharing a
            secret is a `system_message` addressed to `all` with
            `system_event: sensitive_data_warning`, once per chat per type; its
            `sensitive_types` are the types it is the first warning for.
        created_at: { type: string, format: date-time }

    EventEdit:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
          description: |
            The corrected wording. Replaces the original outright — there is no
            partial edit, and an empty string is refused rather than treated as
            a delete, which is a different operation with different rules.

    NewEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [message, system_message, rich_message, file, filled_form]
          default: message
        text: { type: string, maxLength: 10000 }
        recipients:
          type: string
          enum: [all, agents]
          default: all
        attachment_url: { type: string, format: uri }
        properties:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
          maxLength: 128
          description: Retrying with the same key returns the original event.

    PersonalAccessToken:
      type: object
      required: [id, name, scopes, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        kind: { type: string, enum: [pat, oauth, bot] }
        scopes:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }

    AiAgent:
      type: object
      required: [id, name, kind, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [ai_agent, copilot] }
        tone: { type: string, nullable: true }
        avatar_url:
          { type: string, nullable: true, description: The face shown next to the persona. }
        languages:
          type: array
          description: Locale codes the persona answers in (FR-MOD-06.4).
          items: { type: string }
        answer_length:
          type: string
          nullable: true
          enum: [short, medium, long, null]
          description: How long an answer the persona aims for.
        batch_window_seconds:
          type: integer
          minimum: 0
          maximum: 10
          nullable: true
          description: |
            How long the agent waits for a visitor to stop typing before it
            answers, so messages sent in quick succession get one reply. 0
            answers at once. Null: the workspace default (the server's
            `AI_BATCH_WINDOW_MS`).
        daily_memory: { $ref: "#/components/schemas/AiDailyMemorySettings" }
        clarify_thresholds: { $ref: "#/components/schemas/AiClarifyThresholds" }
        address_form:
          type: string
          nullable: true
          enum: [siz, sen, null]
          description: How the agent addresses the player (AI-07) — formal `siz` or familiar `sen`. Null is not set.
        emoji:
          type: string
          nullable: true
          enum: [none, few, null]
          description: Whether the agent's messages carry emoji (AI-07). Null is not set.
        max_questions_per_message:
          type: integer
          minimum: 1
          maximum: 3
          nullable: true
          description: |
            How many questions one message of a procedure may ask (AI-07),
            applied by the procedure itself. Null: the default, 2.
        welcome_message:
          type: string
          nullable: true
          maxLength: 500
          description: |
            The agent's opening words, said before its first reply on a
            connection (AI-29 · A-11). The disclosure "{name}, {brand}'s AI
            assistant" goes first whatever this says — added when the text
            does not carry it — and cannot be removed (G16). Null: the
            disclosure alone.
        human_button_label:
          type: string
          nullable: true
          maxLength: 40
          description: |
            The widget's "Talk to an agent" button in the workspace's words
            (AI-29-S1). The button itself cannot be hidden. Null: the widget's.
        active: { type: boolean }
        skills_count: { type: integer }

    AiAgentDetail:
      description: One agent (`GET /ai-agents/{aiAgentId}`, `POST /ai-agents`) — the list's fields plus `readiness`.
      allOf:
        - $ref: "#/components/schemas/AiAgent"
        - type: object
          required: [readiness]
          properties:
            readiness: { $ref: "#/components/schemas/AiAgentReadiness" }

    AiAgentReadiness:
      type: object
      required: [ready, has_knowledge, has_skill, guardrail_problem]
      description: |
        What the agent still needs (tm 390.1). `ready` is the panel's rule
        (FR-MOD-06.1, PRD KK4): indexed knowledge it may answer from AND an
        active skill with steps. `guardrail_problem` is the separate gate on
        switching a customer-facing agent on (AI-08-S1, `409
        ai_guardrail_setup_incomplete`); null when the crisis text is
        approved, and always null for Copilot.
      properties:
        ready: { type: boolean }
        has_knowledge:
          type: boolean
          description: A knowledge source this agent may answer players from has at least one indexed chunk.
        has_skill:
          type: boolean
          description: One of this agent's skills is active and has at least one step.
        guardrail_problem:
          type: string
          nullable: true
          enum: [crisis_text_missing, crisis_text_not_approved, null]

    AiGuidanceCategory:
      type: string
      enum: [communication, clarification, sensitive, prohibition, other]
      description: What a behaviour rule is about (AI-07); the editor groups by it.

    AiGuidanceScope:
      description: |
        Where a rule applies — exactly one of: every conversation, the turns
        of some procedures (skill ids), the conversations of some brands.
      oneOf:
        - type: object
          additionalProperties: false
          required: [all]
          properties:
            all: { type: boolean, enum: [true] }
        - type: object
          additionalProperties: false
          required: [skill_ids]
          properties:
            skill_ids:
              type: array
              minItems: 1
              maxItems: 50
              items: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [brand_ids]
          properties:
            brand_ids:
              type: array
              minItems: 1
              maxItems: 50
              items: { type: string, format: uuid }

    AiGuidanceRule:
      type: object
      required:
        [id, ai_agent_id, title, body, category, scope, priority, active, created_at, updated_at]
      description: |
        One behaviour rule (AI-07). `priority` 1 goes first; at most 30 rules
        and 6 000 characters reach one turn, the lowest priorities giving way.
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, maxLength: 600 }
        category: { $ref: "#/components/schemas/AiGuidanceCategory" }
        scope: { $ref: "#/components/schemas/AiGuidanceScope" }
        priority: { type: integer, minimum: 1, maximum: 1000 }
        active: { type: boolean }
        owner_id: { type: string, format: uuid, nullable: true }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AiGuidanceCheck:
      type: object
      required: [locked, conflicts, duplicates, vague, compared, checked_by]
      description: |
        What the conflict check found (AI-07 §4). Warnings only; `locked` is
        the one a save refuses.
      properties:
        locked:
          type: object
          nullable: true
          required: [locked_rule, explanation]
          description: The locked platform rule the draft goes against — it would not be applied.
          properties:
            locked_rule: { type: string, enum: [credentials, mandatory_bonus, disable_locked] }
            explanation: { type: string }
        conflicts:
          type: array
          items:
            type: object
            required: [rule_id, explanation, severity]
            properties:
              rule_id: { type: string, format: uuid }
              explanation: { type: string }
              severity: { type: string, enum: [warning, error] }
        duplicates:
          type: array
          items:
            type: object
            required: [rule_id, explanation]
            properties:
              rule_id: { type: string, format: uuid }
              explanation: { type: string }
        vague:
          type: array
          items:
            type: object
            required: [explanation]
            properties:
              explanation: { type: string }
        compared:
          type: integer
          description: How many of the agent's rules overlap the draft's scope and were read.
        checked_by: { type: string, enum: [model, rules] }

    AiGuardrailCategory:
      type: string
      enum: [responsible_gaming, money, data_security, legal, transparency]
      description: What a guardrail protects — the five groups of the platform catalogue (AI-08).

    AiPlatformGuardrail:
      type: object
      required:
        [
          id,
          title,
          prompt,
          category,
          action,
          target,
          priority,
          handoff_reason,
          risk_flag,
          understand_risks,
          lexicon_alone,
          applies_when,
          tenant_text,
          warnings_before_handoff,
          stages,
          locked,
        ]
      description: |
        One locked platform rule. `prompt` is the line every written call's
        system prompt opens with; `stages` says where it is checked — the
        player's message (`input`), the AI's draft (`output`).
      properties:
        id: { type: string, pattern: "^G([1-9]|1[0-9])$" }
        title:
          type: object
          required: [tr, en]
          properties:
            tr: { type: string }
            en: { type: string }
        prompt:
          type: object
          required: [tr, en]
          properties:
            tr: { type: string }
            en: { type: string }
        category: { $ref: "#/components/schemas/AiGuardrailCategory" }
        action: { type: string, enum: [force_handoff, block_output, block_promo, warn] }
        target:
          type: string
          nullable: true
          enum: [responsible_gaming, kyc_risk, complaints, null]
          description: The hand-over's topic; null follows the procedure's own routing.
        priority: { type: string, enum: [urgent, high, normal] }
        handoff_reason: { type: string, nullable: true }
        risk_flag: { type: string, nullable: true }
        understand_risks: { type: array, items: { type: string } }
        lexicon_alone:
          type: boolean
          description: Whether a lexicon hit on the player's message triggers the rule on its own.
        applies_when: { type: string, enum: [always, risk_flagged] }
        tenant_text:
          type: string
          nullable: true
          enum: [crisis, complaint, access_info, null]
          description: The workspace text the rule sends or answers from.
        warnings_before_handoff: { type: integer, nullable: true }
        stages:
          type: array
          items: { type: string, enum: [input, output] }
        locked: { type: boolean, enum: [true] }

    AiPlatformGuardrails:
      type: object
      required: [version, rules]
      properties:
        version:
          type: string
          description: "`PLATFORM_GUARDRAILS_VERSION` — what every turn records."
        rules:
          type: array
          items: { $ref: "#/components/schemas/AiPlatformGuardrail" }

    AiGuardrailSettings:
      type: object
      required:
        [
          ai_agent_id,
          crisis_text,
          complaint_text,
          judge_enabled,
          crisis_text_approved,
          approved_by,
          approved_at,
          crisis_text_draft,
          setup_problem,
          updated_by,
          updated_at,
        ]
      description: |
        A customer-facing agent's guardrail settings (AI-08). `setup_problem`
        is what keeps the agent from being switched on — null once the owner
        has approved the crisis text as it stands.
      properties:
        ai_agent_id: { type: string, format: uuid }
        crisis_text:
          type: string
          nullable: true
          description: Sent verbatim, whatever the hour, before G3 hands a player at risk over.
        complaint_text:
          type: string
          nullable: true
          description: The complaint procedure G15 gives before its hand-over.
        judge_enabled:
          type: boolean
          description: Whether a third model call checks drafts in money, account, bonus and responsible-gaming procedures.
        crisis_text_approved: { type: boolean }
        approved_by: { type: string, format: uuid, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        crisis_text_draft:
          type: string
          nullable: true
          description: The platform's suggested crisis text for the workspace's country; null when it has none.
        setup_problem:
          type: string
          nullable: true
          enum: [crisis_text_missing, crisis_text_not_approved, null]
        updated_by: { type: string, format: uuid, nullable: true }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Null while nothing has been written.

    AiGuardrailRuleAction:
      type: string
      enum: [prompt_only, block_output, force_handoff]
      description: |
        What a compliance rule makes the turn do besides standing in the
        prompt: nothing more, block a draft that breaks it (rewritten once,
        then the safe text), or hand over a player message that falls under it.

    AiGuardrailRule:
      type: object
      required:
        [id, ai_agent_id, title, body, category, action, scope, active, created_at, updated_at]
      description: A workspace's compliance rule — stricter than the platform's, never looser.
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, maxLength: 600 }
        category: { $ref: "#/components/schemas/AiGuardrailCategory" }
        action: { $ref: "#/components/schemas/AiGuardrailRuleAction" }
        scope: { $ref: "#/components/schemas/AiGuidanceScope" }
        active: { type: boolean }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AiForbiddenPhraseMatch:
      type: string
      enum: [exact, word, regex]
      description: |
        How a phrase matches the reply, both folded (lower-case ASCII, Turkish
        letters folded, punctuation a space, a sentence end a line break):
        `exact` anywhere, inside a word too; `word` as whole words; `regex` a
        pattern of at most 120 characters, case-insensitive, `^`/`$` at a
        sentence's edges — no back-references, look-arounds or named groups,
        only `?` after a group, every repetition capped at 30 (`*` reads as
        `{0,30}`), and repetition ranges × optional parts × alternatives at
        most 256 (`.*` is 31, `\d{1,3} .*` 93, `\d+ .*` is refused).

    AiForbiddenPhrase:
      type: object
      required:
        [id, ai_agent_id, phrase, match, lang, scope, action, active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        phrase: { type: string }
        match: { $ref: "#/components/schemas/AiForbiddenPhraseMatch" }
        lang:
          type: string
          nullable: true
          description: The reply language it applies to; null is every language.
        scope: { $ref: "#/components/schemas/AiGuidanceScope" }
        action:
          type: string
          enum: [block, warn]
          description: "`block` rewrites the reply once, then sends the safe text and hands over; `warn` records it."
        active: { type: boolean }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RiskFlagType:
      type: string
      description: |
        AI-27's flag types (`RISK_FLAG_TYPES`). The first three are the
        player's as well as the conversation's.
      enum:
        - rg_signal
        - self_exclusion_request
        - underage_suspected
        - self_harm
        - complaint_formal
        - fraud_suspected
        - account_takeover_suspected
        - multi_account
        - abusive
        - account_security

    RiskFlagStatus:
      type: string
      enum: [active, cleared]

    AiHandoffCard:
      type: object
      description: |
        The AI's hand-over card (AI-10): built from the conversation's state
        when the AI handed the connection to a person, never by a model. Its
        `id` is the hand-over's `handoff_id`, which the transfer and AI-mode
        events carry. `reason_codes`, `primary_reason` and `risk_flags` are
        closed vocabularies of `@siyahtus/types` (`HANDOFF_REASONS`,
        `RISK_FLAG_TYPES`). A `sensitive` slot was given and is kept off the
        card (`text` null).
      required:
        [
          id,
          chat_id,
          thread_id,
          skill_id,
          procedure_key,
          procedure_snapshot_hash,
          topic,
          summary,
          question,
          player,
          slots,
          decision_facts,
          checks,
          ai_statements,
          output_check_flags,
          reason_codes,
          primary_reason,
          risk_flags,
          sentiment,
          suggested_next_step,
          attachments,
          target_group_id,
          priority,
          card_text,
          created_at,
          accepted_by,
          accepted_at,
          feedback,
          feedback_reason,
          feedback_by,
          feedback_at,
        ]
      properties:
        id: { type: string, format: uuid }
        chat_id:
          type: string
          description: "Panelde: Thread ID (günlük)."
        thread_id:
          type: string
          description: "Panelde: Chat ID (bağlantı) — the connection handed over."
        skill_id: { type: string, format: uuid, nullable: true }
        procedure_key: { type: string, nullable: true }
        procedure_snapshot_hash: { type: string, nullable: true }
        topic:
          type: string
          nullable: true
          description: The procedure's name; null when no procedure ran.
        summary:
          type: string
          description: |
            One sentence: the procedure's name and what was collected, or
            "Soru: <the player's first message>" when no procedure ran. Also
            the connection's `Thread.summary`.
        question:
          type: string
          nullable: true
          description: The player's question, on a hand-over no procedure ran.
        player:
          type: object
          required: [username, name, email, basis, recognized_device]
          properties:
            username:
              type: string
              nullable: true
              description: Null when the caller's role may not see a player's contact details (`customers.contact.view`).
            name: { type: string, nullable: true }
            email:
              type: string
              nullable: true
              description: Null when the caller's role may not see a player's contact details (`customers.contact.view`).
            basis:
              type: string
              enum: [declared]
              description: The player's own claim — not verified in F1.
            recognized_device:
              type: boolean
              description: A member token this workspace signed came with the message.
        slots:
          type: array
          description: The procedure's `show_in_card` slots, in its order, once there is something to say.
          items:
            type: object
            required: [slot, label, status, text, source]
            properties:
              slot: { type: string }
              label: { type: string }
              status:
                type: string
                enum: [missing, partial, filled, refused, unknown, invalid, carried]
              text: { type: string, nullable: true }
              source: { type: string, enum: [player, carried, inferred], nullable: true }
              sensitive: { type: boolean, enum: [true] }
              out_of_range: { type: string, enum: [below_min, above_max] }
        decision_facts:
          type: array
          description: The procedure's `handoff.card_fields`, filled — null when unknown.
          items:
            type: object
            required: [field, text]
            properties:
              field: { type: string }
              text: { type: string, nullable: true }
        checks:
          type: array
          description: What a person must check, since no tool could (AI-28).
          items: { type: string }
        ai_statements:
          type: array
          description: The AI's last messages to the player in the connection (at most 5), oldest first.
          items:
            type: object
            required: [event_id, text, created_at]
            properties:
              event_id: { type: string }
              text: { type: string }
              created_at: { type: string, format: date-time }
        output_check_flags:
          type: array
          description: |
            What the draft checks found on the AI's replies (AI-08). Empty: no
            promise was caught.
          items: { type: string, enum: [draft_rewritten, draft_blocked, draft_warned] }
        reason_codes:
          type: array
          description: Every reason the AI handed over for, most severe first.
          items: { type: string }
        primary_reason: { type: string }
        requested_via:
          type: string
          nullable: true
          enum: [button, null]
          description: |
            `button`: the player pressed "Talk to an agent" (AI-29). Null: the
            AI's own decision, or what the player wrote.
        risk_flags:
          type: array
          items: { type: string }
        sentiment:
          type: string
          enum: [positive, neutral, negative, angry]
          nullable: true
        suggested_next_step:
          type: string
          nullable: true
          description: The procedure's `handoff.next_step_hint`, filled; null without one.
        attachments:
          type: array
          items:
            type: object
            required: [event_id, name, created_at]
            properties:
              event_id: { type: string }
              name: { type: string, nullable: true }
              created_at: { type: string, format: date-time }
        target_group_id: { type: integer, format: int64, nullable: true }
        priority: { type: string, enum: [urgent, high, normal] }
        card_text:
          type: string
          description: |
            The card as plain text. The agents-only line in the transcript is
            this text without the player's username and email — one event every
            viewer reads — and here both are blanked out (`•••`) for a caller
            whose role may not see a player's contact details
            (`customers.contact.view`).
        created_at: { type: string, format: date-time }
        accepted_by:
          type: string
          format: uuid
          nullable: true
          description: The agent whose first message after the hand-over took it up.
        accepted_at: { type: string, format: date-time, nullable: true }
        feedback: { type: string, enum: [sufficient, insufficient], nullable: true }
        feedback_reason: { type: string, nullable: true }
        feedback_by: { type: string, format: uuid, nullable: true }
        feedback_at: { type: string, format: date-time, nullable: true }

    RiskFlag:
      type: object
      description: |
        A risk flag (AI-27). `note`, `evidence_event_ids` and `clear_reason`
        are for the Responsible Gaming team and a Team Lead and up; for anyone
        else they are null and `details_visible` is false.
      required:
        [
          id,
          scope,
          chat_id,
          thread_id,
          customer_id,
          member_key,
          type,
          severity,
          source,
          rule_ref,
          basis,
          status,
          raised_by,
          raised_at,
          cleared_by,
          cleared_at,
          note,
          evidence_event_ids,
          clear_reason,
          details_visible,
        ]
      properties:
        id: { type: string, format: uuid }
        scope:
          type: string
          enum: [chat, member]
          description: "`member`: the player's too, in every later conversation, until cleared."
        chat_id:
          type: string
          nullable: true
          description: The conversation it was raised in (panel "Thread ID"); null once it is gone.
        thread_id:
          type: string
          nullable: true
          description: The connection (panel "Chat ID").
        customer_id: { type: string, format: uuid, nullable: true }
        member_key:
          type: string
          nullable: true
          description: |
            The player's key on the operator's site (the folded pre-chat
            username in F1). Null when the caller's role may not see a player's
            contact details (`customers.contact.view`); never in the realtime
            push.
        type: { $ref: "#/components/schemas/RiskFlagType" }
        severity: { type: string, enum: [info, high, urgent] }
        source:
          type: string
          enum: [ai_rule, ai_classifier, agent, qa]
          description: "A guardrail rule's hit (`rule_ref` names it), the AI's risk signal, a person, or QA."
        rule_ref:
          type: string
          nullable: true
          description: "`G1` … `G19` when a guardrail rule raised it."
        basis:
          type: string
          enum: [declared, verified]
          description: "`declared`: on the player's own claim of who they are (F1) — a warning, not a fact."
        status: { $ref: "#/components/schemas/RiskFlagStatus" }
        raised_by:
          type: string
          format: uuid
          nullable: true
          description: The account that raised it; null when the AI did.
        raised_at: { type: string, format: date-time }
        cleared_by: { type: string, format: uuid, nullable: true }
        cleared_at: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        evidence_event_ids:
          type: array
          nullable: true
          items: { type: string }
          description: The messages that raised it.
        clear_reason: { type: string, nullable: true }
        details_visible:
          type: boolean
          description: Whether the caller reads the note, the evidence and the clear reason.

    RiskFlagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RiskFlag" }
        next_page_id:
          type: string
          description: The next page's cursor; absent on the last page.

    CustomerRiskFlagList:
      description: |
        A player's flags, and whether they are kept from promotions (EN-01):
        by every active flag of theirs and of the records an agent linked as
        the same person (ID-03), under the workspace's promotion policy —
        including flags of conversations the caller does not see.
      allOf:
        - $ref: "#/components/schemas/RiskFlagList"
        - type: object
          required: [promo_suppressed, promo_suppressed_reason]
          properties:
            promo_suppressed:
              type: boolean
              description: The player is shown no campaign.
            promo_suppressed_reason:
              description: The flag type that keeps them from promotions; null when none does.
              nullable: true
              allOf:
                - $ref: "#/components/schemas/RiskFlagType"

    RiskFlagPromoBlock:
      type: object
      description: |
        Which flag types keep a player from campaigns (EN-01). Responsible
        gaming's four (`LOCKED_PROMO_FLAGS`: `rg_signal`,
        `self_exclusion_request`, `underage_suspected`, `self_harm`) always
        do and are not listed here; these two are the workspace's choice.
      required: [fraud_suspected, complaint_formal]
      properties:
        fraud_suspected: { type: boolean, description: "Default true." }
        complaint_formal: { type: boolean, description: "Default false." }

    RiskFlagSettings:
      type: object
      required: [rg_group_id, notify_emails, promo_block, updated_by, updated_at]
      properties:
        rg_group_id:
          type: integer
          nullable: true
          description: |
            The Responsible Gaming team: its members read a flag's note and
            evidence and hear of an urgent flag. Null: none.
        notify_emails:
          type: array
          maxItems: 5
          items: { type: string }
          description: Addresses an urgent flag is mailed to as well (AI-27-S4).
        promo_block: { $ref: "#/components/schemas/RiskFlagPromoBlock" }
        updated_by: { type: string, format: uuid, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    AiGuardrailHit:
      type: object
      required:
        [
          id,
          chat_id,
          thread_id,
          turn_id,
          rule_key,
          stage,
          action_taken,
          evidence,
          pattern_index,
          catalog_version,
          created_at,
        ]
      description: One rule a turn found broken, and what the turn did about it.
      properties:
        id: { type: string, format: uuid }
        chat_id: { type: string, description: The day container (panel "Thread ID"). }
        thread_id: { type: string, description: The connection (panel "Chat ID"). }
        turn_id:
          type: string
          format: uuid
          description: The turn's decision record (`ai_decision_logs.id`).
        rule_key:
          type: string
          description: "`G1` … `G19`, `rule:<id>` or `phrase:<id>`."
        stage: { type: string, enum: [input, output] }
        action_taken:
          type: string
          enum: [handoff, crisis_text, rewrite, safe_text, prompt_block, warn, evidence]
        evidence:
          type: string
          nullable: true
          maxLength: 200
          description: The words that matched, masked.
        pattern_index: { type: integer, nullable: true, minimum: 0 }
        catalog_version: { type: string }
        created_at: { type: string, format: date-time }

    AiClarifyThresholds:
      type: object
      required: [high, low]
      description: |
        How sure the agent must be of a procedure (AI-05). The understanding
        call rates each message 0–1 against the agent's procedures: at `high`
        or above the procedure starts; between `low` and `high` the agent asks
        one either-or question between the two likeliest — never twice in a
        row; below `low` it answers from knowledge, then the fallback.
      properties:
        high:
          type: number
          minimum: 0.01
          maximum: 1
          description: Default 0.70.
        low:
          type: number
          minimum: 0.01
          maximum: 1
          description: Below `high`. Default 0.40.

    AiDailyMemorySettings:
      type: object
      required: [enabled, recall]
      description: |
        Same-day memory (AI-02): on a member's later connection of the day the
        agent reads short summaries of their earlier ones — the topic, what was
        collected, how it ended. It recalls the topic, never an amount, an IBAN
        or a transaction id (K5), and a visitor whose identity is not proven by
        a member token gets no detail at all (K4). Earlier days are never read.
      properties:
        enabled:
          type: boolean
          description: Read the day's earlier connections. Default on.
        recall:
          type: string
          enum: [auto_if_unresolved, on_topic_only]
          description: |
            When the agent brings the earlier conversation up itself:
            `auto_if_unresolved` (default) in its first answer when the day's
            latest conversation was handed over, left unfinished or is waiting
            on something; `on_topic_only` only when the visitor is back on the
            same topic.

    AiDailyDigest:
      type: object
      required:
        [
          connection,
          started_at,
          ended_at,
          procedure_key,
          procedure_name,
          intent_label,
          slots,
          outcome,
          awaiting_answer,
          handoff,
          risk_flags,
          last_ai_excerpt,
        ]
      description: |
        One connection's summary as the AI keeps it (AI-02), built from the
        conversation's state without a model on every turn and settled when the
        connection closes.
      properties:
        connection:
          type: object
          required: [chat_id, thread_id]
          properties:
            chat_id: { type: string, description: The day (panel "Thread ID"). }
            thread_id: { type: string, description: The connection (panel "Chat ID"). }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        procedure_key:
          type: string
          nullable: true
          description: The procedure the AI ran (today the skill's id).
        procedure_name: { type: string, nullable: true }
        intent_label: { type: string, nullable: true }
        slots:
          type: object
          description: What the AI collected, by slot name. Personal data.
          additionalProperties:
            type: object
            required: [display, status]
            properties:
              display: { type: string }
              status: { type: string, description: "`filled`, `carried`, …" }
        outcome:
          type: string
          nullable: true
          enum: [resolved, resolved_waiting, handed_off, abandoned, no_ai, null]
          description: How it ended; null while it is open and nothing is settled.
        awaiting_answer:
          type: boolean
          description: The AI's newest message was a question the visitor has not answered.
        handoff:
          type: object
          nullable: true
          required: [id, team_id, team_name, reason_codes, agent_replied]
          properties:
            id: { type: string, nullable: true }
            team_id: { type: string, nullable: true }
            team_name: { type: string, nullable: true }
            reason_codes:
              type: array
              items: { type: string }
            agent_replied: { type: boolean }
        risk_flags:
          type: array
          items: { type: string }
        last_ai_excerpt:
          type: string
          nullable: true
          maxLength: 200

    TimelineItem:
      type: object
      required: [id, at, kind, actor, chat_id, thread_id, details]
      description: |
        One row of a conversation's timeline (ID-09). `chat_id` is the day
        (Panelde: Thread ID), `thread_id` the connection (Panelde: Chat ID) —
        null for a row about the day as a whole.
      properties:
        id:
          type: string
          description: The row's id in its own source (event, AI decision, audit entry, rating…).
        at: { type: string, format: date-time }
        kind:
          type: string
          enum:
            [
              message,
              note,
              ai_decision,
              system,
              assignment,
              transfer,
              tag,
              rating,
              sla_breach,
              ticket,
              audit,
            ]
          description: |
            Rows of the same millisecond are listed in this order. `note` is an
            internal note; `system` the transcript's system lines (closing,
            reopening, the AI's mode); `ai_decision` a turn the AI recorded
            (procedure, step, sources, hand-over reason) or a procedure run.
        actor:
          type: object
          required: [type, id, name]
          properties:
            type: { type: string, enum: [agent, customer, bot, system, ai] }
            id: { type: string, nullable: true }
            name: { type: string, nullable: true }
        chat_id: { type: string }
        thread_id: { type: string, nullable: true }
        event_id:
          type: string
          description: The transcript event the row is, or answers.
        text: { type: string }
        details:
          type: object
          additionalProperties: true
          description: The row's source fields — ids and codes.

    TimelinePage:
      type: object
      required: [chat_id, thread_id, items, audit, audit_retained_since, audit_expired]
      properties:
        chat_id: { type: string, description: The day (panel "Thread ID"). }
        thread_id:
          type: string
          nullable: true
          description: The connection asked for (panel "Chat ID"); null for the whole day.
        items:
          type: array
          items: { $ref: "#/components/schemas/TimelineItem" }
        next_page_id:
          type: string
          description: |
            Present while rows remain. A page filtered by `kinds` may hold
            fewer than `limit` rows before it.
        audit:
          type: string
          enum: [included, not_permitted]
          description: Whether the audit trail is among the rows — only for a caller who may read the audit log.
        audit_retained_since:
          type: string
          format: date-time
          description: How far back the audit trail is kept.
        audit_expired:
          type: boolean
          description: |
            The conversation began before `audit_retained_since`: its earlier
            audit rows were removed by retention, and the panel says "kayıt
            saklama süresi dolmuş" instead of showing nothing.

    CustomerContext:
      type: object
      required: [chat_id, customer, contact_visible, pre_chat, today, history, restricted_count]
      description: |
        The player card (IN-02): `GET /chats/{chatId}/customer-context`.
      properties:
        chat_id: { type: string, description: The day it was read for (panel "Thread ID"). }
        customer:
          type: object
          required: [id, name, username, email, country_code, country, city, banned]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            username:
              type: string
              nullable: true
              description: Typed by the player, unverified. Null when not given or not visible.
            email:
              { type: string, nullable: true, description: Null when not given or not visible. }
            country_code: { type: string, nullable: true, minLength: 2, maxLength: 2 }
            country: { type: string, nullable: true }
            city: { type: string, nullable: true, description: The newest visit's. }
            banned: { type: boolean }
        contact_visible:
          type: boolean
          description: |
            Whether the caller may see the player's email and username
            (`customers.contact.view`). False: both are null whatever the
            player gave.
        pre_chat:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
        today:
          type: array
          description: The day's other connections, the newest 20, newest first.
          items: { $ref: "#/components/schemas/ConversationRef" }
        history:
          type: object
          required: [items]
          properties:
            items:
              type: array
              description: Earlier days of the last 90, newest first, one row each.
              items: { $ref: "#/components/schemas/ConversationRef" }
            next_page_id: { type: string }
        restricted_count:
          type: integer
          minimum: 0
          description: Restricted days in the whole 90-day window.

    SearchResult:
      type: object
      required: [kind, title, subtitle, at, matched_on]
      description: |
        One match of `GET /search`. The ids present depend on `kind`: a `chat`
        carries `chat_id`; a `connection` also `thread_id`; an `event` also
        `event_id`; a `customer` carries `customer_id`; a `ticket` carries
        `ticket_id` (and `customer_id` when it has a member); a `message`
        carries `chat_id`, `thread_id` and `event_id`, its snippet as
        `subtitle` and `highlights`.
      properties:
        kind: { type: string, enum: [chat, connection, event, customer, ticket, message] }
        chat_id: { type: string, description: The day (panel "Thread ID"). }
        thread_id: { type: string, description: The connection (panel "Chat ID"). }
        event_id: { type: string, description: The message. }
        customer_id: { type: string, format: uuid }
        ticket_id: { type: string }
        title:
          type: string
          nullable: true
          description: The member's name, or the ticket's subject; null when the member left no name.
        subtitle:
          type: string
          nullable: true
          description: |
            A member's e-mail (else phone), a ticket's member name, or a
            message's snippet. Null when there is none or the caller may not
            see it.
        at:
          type: string
          format: date-time
          nullable: true
          description: When the day, connection or message started, or the member was last active.
        matched_on:
          type: string
          enum:
            [
              chat_id,
              thread_id,
              event_id,
              customer_id,
              ticket_id,
              email,
              username,
              name,
              phone,
              subject,
              text,
            ]
          description: Which field the query matched.
        highlights:
          type: array
          description: "`message` only: where the query's words sit in `subtitle`."
          items: { $ref: "#/components/schemas/TextRange" }

    ConversationRef:
      type: object
      required:
        [
          accessible,
          chat_id,
          thread_id,
          started_at,
          ended_at,
          connections_count,
          assignee,
          teams,
          topics,
          tags,
          summary,
          outcome,
          rating,
          ai_handoff,
        ]
      description: |
        One connection of the day (`today`) or one earlier day (`history`) on
        the player card. `accessible: false` — another team's conversation —
        carries `started_at` and `topics` and nothing else: every other field
        is null or empty.
      properties:
        accessible: { type: boolean }
        chat_id: { type: string, nullable: true, description: The day (panel "Thread ID"). }
        thread_id:
          type: string
          nullable: true
          description: The connection (panel "Chat ID") — a day's newest on a history row.
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        connections_count: { type: integer, nullable: true, minimum: 1 }
        assignee:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        teams:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
        topics:
          type: array
          description: The teams' queue topics (`QUEUE_TOPIC_ROLES`).
          items:
            type: string
            enum: [finance, kyc_risk, bonus, responsible_gambling, technical, complaint]
        tags:
          type: array
          items: { type: string }
        summary: { type: string, nullable: true }
        outcome:
          type: string
          nullable: true
          enum: [resolved, resolved_waiting, handed_off, abandoned, no_ai, null]
        rating: { type: string, nullable: true, enum: [good, bad, null] }
        ai_handoff:
          allOf:
            - $ref: "#/components/schemas/AiHandoffCard"
          nullable: true

    ArchiveConversation:
      type: object
      required:
        [
          thread_id,
          chat_id,
          customer,
          started_at,
          ended_at,
          assignee,
          group_ids,
          tags,
          rating,
          handled_by,
          risk_flags,
          first_customer_message,
          message_count,
        ]
      description: |
        One archive row (AR-01): one connection. `thread_id` is the row's id
        (panel "Chat ID"), `chat_id` the day it belongs to (panel "Thread ID").
      properties:
        thread_id: { type: string, description: The connection (panel "Chat ID"). }
        chat_id: { type: string, description: The day (panel "Thread ID"). }
        customer:
          type: object
          required: [id, name, username]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            username:
              type: string
              nullable: true
              description: |
                Typed by the player, unverified. Null when not given or the
                caller may not see it (`customers.contact.view`).
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true, description: Null while open. }
        assignee:
          type: object
          nullable: true
          description: Who had the connection — at the close, for a closed one.
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        group_ids:
          type: array
          description: |
            The team the connection went to; for one opened before that was
            recorded, the day's teams.
          items: { type: integer }
        tags:
          type: array
          description: This connection's tags.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        rating:
          type: object
          nullable: true
          description: The player's newest rating of this connection (AR-03).
          required: [value, has_comment]
          properties:
            value: { type: string, enum: [good, bad] }
            has_comment: { type: boolean }
        handled_by:
          type: string
          nullable: true
          enum: [ai, human, mixed, null]
          description: |
            Who answered it, written as it closed. `ai` is ADR-09a's AI
            resolution (the one the invoice counts); `human` a person and no
            bot; `mixed` the rest. Null while open and for a connection closed
            before this was recorded.
        risk_flags:
          type: array
          description: The kinds of risk flag raised in this connection, cleared ones included.
          items: { $ref: "#/components/schemas/RiskFlagType" }
        first_customer_message:
          type: string
          nullable: true
          maxLength: 140
          description: The player's first message, shortened, sensitive values masked.
        message_count:
          { type: integer, minimum: 0, description: Messages in it, internal notes included. }

    ArchiveConversationDetail:
      description: |
        One connection in the archive (AR-01): its row, with the rating in
        full and the connection's summary.
      allOf:
        - $ref: "#/components/schemas/ArchiveConversation"
        - type: object
          required: [rating, summary]
          properties:
            rating:
              type: object
              nullable: true
              required: [value, has_comment, comment, rated_at]
              properties:
                value: { type: string, enum: [good, bad] }
                has_comment: { type: boolean }
                comment: { type: string, nullable: true }
                rated_at: { type: string, format: date-time }
            summary: { type: string, nullable: true }

    AiHandoffSettings:
      type: object
      required:
        [
          ai_agent_id,
          assignment_mode,
          ai_stall_timeout_seconds,
          no_answer,
          triggers,
          messages,
          after_hours,
          resolution_criteria,
        ]
      properties:
        ai_agent_id: { type: string, format: uuid }
        assignment_mode:
          type: string
          enum: [ai_first, parallel]
          description: |
            When a visitor's conversation gets a person (AI-11). `ai_first`:
            the agent answers first — the conversation opens unassigned, in
            the AI view rather than the unassigned or queued ones, and is routed
            when the agent hands it over or a person takes it. `parallel`:
            routing assigns it on open and the agent answers until a person
            writes to the visitor. Default `parallel`.
        ai_stall_timeout_seconds:
          type: integer
          minimum: 15
          maximum: 600
          description: |
            How long a visitor may wait on the agent before a person is sent
            (AI-11). An unassigned conversation the agent is answering, whose
            oldest unanswered visitor message is older than this, is routed to
            a person as an `ai_failure` hand-over. Default 60.
        no_answer: { $ref: "#/components/schemas/AiNoAnswerSettings" }
        triggers: { $ref: "#/components/schemas/AiHandoffTriggers" }
        messages: { $ref: "#/components/schemas/AiHandoffMessages" }
        after_hours: { $ref: "#/components/schemas/AiHandoffAfterHours" }
        resolution_criteria:
          allOf:
            - $ref: "#/components/schemas/ProcedureCondition"
          nullable: true
          description: |
            The agent's default "resolved" criteria (K9, tm 303.4): what must
            hold before the agent says a matter is solved, for a procedure that
            has no `resolution_criteria` of its own. A condition over no
            procedure's slots — `player_confirmed()`, an `ai` question and
            `all` / `any` / `not` of them. `null`: the platform's, the
            player's explicit yes (`{ fn: { name: player_confirmed, args: [] } }`).

    AiHandoffTriggers:
      type: object
      required:
        [not_understood, negative_sentiment, abuse, loop_detected, max_turns, repeat_same_day]
      additionalProperties: false
      description: |
        When the agent hands a conversation to a person on its own (AI-09),
        beside a procedure's hand-over step and the guardrails. These are the
        triggers a workspace tunes; the compliance ones (G1–G5, G13, G15,
        G19), a person asked for (G16) and the agent never going silent are
        locked on and not listed — `@siyahtus/types` `LOCKED_HANDOFF_REASONS`.
        Defaults: 2 turns not understood (asked about first), 2 negative turns,
        2 warnings for abuse, 12 turns per procedure.
      properties:
        not_understood:
          type: object
          required: [enabled, turns, ask_first]
          additionalProperties: false
          description: |
            `turns` turns in a row the agent could not tell what the player
            wants; then it asks once whether to pass them to an agent
            (`ask_first`) or hands over.
          properties:
            enabled: { type: boolean }
            turns: { type: integer, minimum: 1, maximum: 10 }
            ask_first: { type: boolean }
        negative_sentiment:
          type: object
          required: [enabled, consecutive, ask_first]
          additionalProperties: false
          description: An angry player, or negative turns in a row (`consecutive`).
          properties:
            enabled: { type: boolean }
            consecutive: { type: integer, minimum: 1, maximum: 10 }
            ask_first: { type: boolean }
        abuse:
          type: object
          required: [warnings]
          additionalProperties: false
          description: Locked on (G19); the calm warnings before the hand-over are the workspace's.
          properties:
            warnings: { type: integer, minimum: 1, maximum: 5 }
        loop_detected:
          type: object
          required: [enabled]
          additionalProperties: false
          description: The same agent question twice in a row, or the same player message three times.
          properties:
            enabled: { type: boolean }
        max_turns:
          type: object
          required: [enabled, turns]
          additionalProperties: false
          description: The agent turns one procedure may take before it hands over (`turns`).
          properties:
            enabled: { type: boolean }
            turns: { type: integer, minimum: 2, maximum: 50 }
        repeat_same_day:
          type: object
          required: [enabled]
          additionalProperties: false
          description: |
            The same problem again the same day: the diagnosis is skipped,
            only missing required answers are asked, then a person.
          properties:
            enabled: { type: boolean }

    AiHandoffMessages:
      type: object
      additionalProperties: false
      description: |
        What the player is told as the agent hands over, by reason — the
        workspace's own sentence, said as written (no model). Null: the
        default for that reason (`DEFAULT_HANDOFF_MESSAGES`) in the reply's
        language. `no_knowledge` is not here: its sentence is
        `no_answer.text`.
      properties:
        guardrail_self_harm: { type: string, nullable: true, maxLength: 500 }
        guardrail_minor: { type: string, nullable: true, maxLength: 500 }
        guardrail_rg: { type: string, nullable: true, maxLength: 500 }
        risk_flag: { type: string, nullable: true, maxLength: 500 }
        guardrail_account_security: { type: string, nullable: true, maxLength: 500 }
        guardrail_complaint: { type: string, nullable: true, maxLength: 500 }
        guardrail_output_block: { type: string, nullable: true, maxLength: 500 }
        guardrail_workspace_rule: { type: string, nullable: true, maxLength: 500 }
        abuse: { type: string, nullable: true, maxLength: 500 }
        player_request: { type: string, nullable: true, maxLength: 500 }
        tenant_rule: { type: string, nullable: true, maxLength: 500 }
        procedure_rule: { type: string, nullable: true, maxLength: 500 }
        missing_required_info: { type: string, nullable: true, maxLength: 500 }
        repeat_same_day: { type: string, nullable: true, maxLength: 500 }
        negative_sentiment: { type: string, nullable: true, maxLength: 500 }
        player_said_unresolved: { type: string, nullable: true, maxLength: 500 }
        not_understood: { type: string, nullable: true, maxLength: 500 }
        loop_detected: { type: string, nullable: true, maxLength: 500 }
        max_turns: { type: string, nullable: true, maxLength: 500 }
        unsupported_language: { type: string, nullable: true, maxLength: 500 }
        ai_failure: { type: string, nullable: true, maxLength: 500 }

    AiHandoffRulePriority:
      type: string
      enum: [urgent, high, normal]
      description: How urgent the hand-over is (AI-12). Default `normal`.

    AiHandoffRuleTrigger:
      type: object
      required: [type, value]
      additionalProperties: false
      description: |
        What sets the rule off (AI-09, K9). `topic` — the player's message is
        about one of the topics (`deposit`, `withdrawal`, `account_recovery`,
        `bonus`, `verification`); `procedure` — the understanding names this
        procedure skill (its id), or it is the one in progress; `phrase` —
        the message holds these words (case, accents and word endings
        ignored); `risk_flag` — the conversation carries an active flag of
        this type. These four hand the conversation over themselves, reason
        `tenant_rule`. `ai_unresolved` (the AI could not solve it) and
        `player_request` (the player asked for a person) take no value: the
        AI hands over for its own reasons, and the rule says where to and how
        urgently.
      properties:
        type:
          type: string
          enum: [topic, procedure, phrase, ai_unresolved, player_request, risk_flag]
        value:
          type: string
          nullable: true
          maxLength: 100

    AiHandoffRuleTarget:
      nullable: true
      description: |
        Where the hand-over goes: a team (`group_id`) or a routing topic
        (`topic`, ADR-08a). Null: the usual routing.
      oneOf:
        - type: object
          required: [group_id]
          additionalProperties: false
          properties:
            group_id: { type: integer, minimum: 1 }
        - type: object
          required: [topic]
          additionalProperties: false
          properties:
            topic: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }

    AiHandoffRule:
      type: object
      required:
        [
          id,
          ai_agent_id,
          position,
          active,
          title,
          trigger,
          target,
          priority,
          created_by,
          updated_by,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        position: { type: integer, minimum: 1, description: "1 is tried first." }
        active: { type: boolean }
        title: { type: string }
        trigger: { $ref: "#/components/schemas/AiHandoffRuleTrigger" }
        target: { $ref: "#/components/schemas/AiHandoffRuleTarget" }
        priority: { $ref: "#/components/schemas/AiHandoffRulePriority" }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AiHandoffLockedRule:
      type: object
      required: [id, title, reason, target, priority]
      description: |
        A platform compliance rule (AI-08) the list shows greyed out: always
        on, above the workspace's rules, never moved.
      properties:
        id: { type: string, enum: [G1, G2, G3, G4, G5, G13, G15] }
        title:
          type: object
          required: [tr, en]
          properties:
            tr: { type: string }
            en: { type: string }
        reason:
          type: string
          nullable: true
          description: The hand-over reason; null for G4, which hands nothing over.
        target: { $ref: "#/components/schemas/AiHandoffRuleTarget" }
        priority: { $ref: "#/components/schemas/AiHandoffRulePriority" }

    AiHandoffRuleExample:
      type: object
      required: [key, title, trigger, target, priority]
      properties:
        key: { type: string, enum: [ai_unresolved, account_recovery, deposit] }
        title:
          type: object
          required: [tr, en]
          properties:
            tr: { type: string }
            en: { type: string }
        trigger: { $ref: "#/components/schemas/AiHandoffRuleTrigger" }
        target: { $ref: "#/components/schemas/AiHandoffRuleTarget" }
        priority: { $ref: "#/components/schemas/AiHandoffRulePriority" }

    AiHandoffRuleList:
      type: object
      required: [ai_agent_id, locked, items, examples]
      properties:
        ai_agent_id: { type: string, format: uuid }
        locked:
          type: array
          items: { $ref: "#/components/schemas/AiHandoffLockedRule" }
        items:
          type: array
          description: The workspace's rules, in the order they are tried.
          items: { $ref: "#/components/schemas/AiHandoffRule" }
        examples:
          type: array
          items: { $ref: "#/components/schemas/AiHandoffRuleExample" }

    AiHandoffAfterHours:
      type: object
      required: [text]
      additionalProperties: false
      description: |
        What the player is told when the hand-over lands where nobody is
        accepting chats (AI-12): the conversation waits in the team's queue.
      properties:
        text:
          type: string
          nullable: true
          maxLength: 500
          description: |
            The workspace's own text — it may say when the team is back. Null:
            "Ekibimiz şu anda müsait değil. Mesajınız sırada; ekibimiz
            döndüğünde size yazacak." in the reply's language.

    AiNoAnswerSettings:
      type: object
      required: [policy_by_category, text]
      additionalProperties: false
      description: |
        What the agent does when the knowledge base has no answer to a
        question no procedure takes (AI-06). It says so — it never stays
        silent and never guesses — and then, by what the question is about,
        either hands the conversation to a person at once (`handoff`) or asks
        once whether to (`ask`; a second miss hands over without asking).
        Defaults: money, account, bonus and responsible gaming `handoff`,
        anything else `ask`.
      properties:
        policy_by_category:
          type: object
          required: [money, account, bonus, rg, other]
          additionalProperties: false
          properties:
            money: { $ref: "#/components/schemas/AiNoAnswerPolicy" }
            account: { $ref: "#/components/schemas/AiNoAnswerPolicy" }
            bonus: { $ref: "#/components/schemas/AiNoAnswerPolicy" }
            rg: { $ref: "#/components/schemas/AiNoAnswerPolicy" }
            other: { $ref: "#/components/schemas/AiNoAnswerPolicy" }
        text:
          type: string
          nullable: true
          maxLength: 500
          description: |
            The workspace's own sentence for a hand-over at once, said as
            written. Null: "Bu konuda size kesin bilgi veremiyorum. Sizi bir
            temsilcimize aktarıyorum." in the reply's language.

    AiNoAnswerPolicy:
      type: string
      enum: [handoff, ask]

    AiConversationState:
      type: object
      required: [mode, procedure, slots, suspended, turns, outcome]
      description: |
        Where the AI stands on a connection (AI-03 · tm 296.4), read from
        `ai_conversations`: `GET /chats/{chatId}/ai-conversation`, and the state
        a `POST /skills/preview` turn would leave. The procedure is the one the
        connection pinned when it started, not the skill as it is now.
      properties:
        mode:
          type: string
          enum: [ai, human, paused]
          description: Who answers the connection (AI-11).
        procedure:
          allOf:
            - $ref: "#/components/schemas/AiConversationProcedure"
          nullable: true
          description: The procedure in progress; null when none is.
        slots:
          type: array
          description: |
            Every slot the procedure collects, in its order — one nothing was
            said about is `missing` — then any other slot the state holds, by
            name. Personal data.
          items: { $ref: "#/components/schemas/AiConversationSlot" }
        suspended:
          description: The topic set aside for the one in progress (at most one, AI-03 §7).
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AiConversationProcedure"
            - type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  items: { $ref: "#/components/schemas/AiConversationSlot" }
        turns: { type: integer, minimum: 0, description: AI turns taken on the connection. }
        outcome:
          type: string
          enum: [resolved, resolved_waiting, handed_off, abandoned, no_ai]
          nullable: true
        updated_at:
          type: string
          format: date-time
          description: When the state last changed. Absent on a preview's state.
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: When the connection closed. Absent on a preview's state.

    AiConversationProcedure:
      type: object
      required: [skill_id, skill_name, snapshot_hash, step_id, step_status]
      properties:
        skill_id:
          type: string
          description: The skill the procedure is; `preview` in a preview's state.
        skill_name:
          type: string
          nullable: true
          description: Its name when the connection started it.
        snapshot_hash:
          type: string
          nullable: true
          description: sha256 of the pinned definition (ADR-14b §2.9).
        step_id: { type: string, nullable: true }
        step_status:
          type: string
          enum: [awaiting_answer, ready, done]
          nullable: true
          description: |
            `awaiting_answer` — a question is out; `ready` — it goes on with
            the next message; `done` — it ended in a hand-over.

    AiConversationSlot:
      type: object
      required: [name, label, type, status, display, source, attempts, sensitive]
      properties:
        name: { type: string }
        label:
          {
            type: string,
            description: The procedure's label; the name for a slot it does not define.,
          }
        type:
          type: string
          nullable: true
          description: The slot's type (AI-04); null for a slot the procedure does not define.
        status:
          type: string
          enum: [missing, filled, partial, invalid, refused, unknown, carried]
        display:
          type: string
          nullable: true
          description: What the visitor gave, read back; null while nothing usable was.
        source:
          type: string
          enum: [player, carried, inferred]
        attempts: { type: integer, minimum: 0, description: How many times the AI asked for it. }
        sensitive:
          type: boolean
          description: "A `pii: high` slot — the console hides it until asked."

    ChatAiMode:
      type: object
      description: |
        Who answers a chat's open connection after `return-to-ai` or
        `pause-ai` (AI-11). `ai`: the AI agent; `human`: a person has it and
        the AI stays silent; `paused`: the AI is held back without a person
        having taken it.
      required: [chat_id, thread_id, ai_mode, previous_ai_mode, changed, assignee_id]
      properties:
        chat_id: { type: string }
        thread_id: { type: string, description: The open connection. }
        ai_mode:
          type: string
          enum: [ai, human, paused]
        previous_ai_mode:
          type: string
          enum: [ai, human, paused]
          nullable: true
          description: Null when the AI had not taken part in the connection.
        changed:
          type: boolean
          description: False when the connection was already in `ai_mode`; nothing was written.
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The connection's assignee after the change — null once an AI-first
            connection is the AI's again.

    SkillStep:
      type: object
      required: [type]
      description: |
        A discriminated union on `type`. Steps are validated before they are
        stored, so a step the engine cannot run is refused at save time rather
        than skipped silently when a customer is waiting.
      properties:
        type:
          type: string
          enum: [detect_intent, request_info, tag, summarize, send_message, transfer_to_team]
        intent: { type: string, description: "detect_intent: the intent name." }
        phrases:
          type: array
          items: { type: string }
          description: "detect_intent: phrases to look for."
        field: { type: string, description: "request_info: what to collect." }
        prompt: { type: string, description: "request_info: what to ask." }
        tag: { type: string, description: "tag: the tag to apply." }
        source:
          type: string
          enum: [text, knowledge]
          description: "send_message: a fixed reply, or one retrieved from knowledge."
        text: { type: string, description: "send_message with source=text." }
        group_id:
          type: integer
          format: int64
          minimum: 1
          description: |
            transfer_to_team: the team (AI-12), so renaming it keeps the skill
            working. A team the workspace does not have is 400 `validation`
            with `transfer_to_team_unknown_team`. Filled by the API on save
            from `group` when only the name is sent.
        group:
          type: string
          description: |
            transfer_to_team: the team's name. The API writes the team's
            current name beside `group_id`; a step sent with the name only is
            given the id of the team of that name (the lowest id when two
            share it), and keeps the name alone when no team has it.

    Skill:
      type: object
      required:
        - id
        - name
        - kind
        - steps
        - active
        - runs_count
        - created_by_name
        - created_by_id
        - mode
        - when_to_use
        - examples
        - priority
        - slots
        - procedure
        - locked
        - template_key
        - template_version
        - is_fallback
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        kind: { type: string, enum: [ai_agent, workspace] }
        instruction: { type: string, nullable: true }
        steps:
          type: array
          description: The one-message step list — what a `single` skill runs.
          items: { $ref: "#/components/schemas/SkillStep" }
        mode:
          type: string
          enum: [single, procedure]
          description: |
            `single` — the one-message step list in `steps`, every skill's mode
            before procedures existed. `procedure` — a multi-turn procedure
            (ADR-14a): `slots` and `procedure` define it, `steps` is not run.
        when_to_use:
          type: string
          nullable: true
          description: |
            When the skill applies, in plain words — what the AI selects a skill
            by (AI-05). Required for a procedure.
        examples:
          type: array
          description: Customer sentences the skill should match.
          items: { type: string }
        priority:
          type: integer
          minimum: 1
          maximum: 1000
          description: Between two equally likely skills the smaller number wins. Default 100.
        slots:
          type: array
          description: What a procedure collects (AI-04); empty on a `single` skill.
          items: { $ref: "#/components/schemas/SlotDef" }
        procedure:
          allOf:
            - $ref: "#/components/schemas/SkillProcedure"
          nullable: true
          description: The rest of a procedure's definition; null on a `single` skill.
        locked:
          type: boolean
          description: |
            An installed template copy whose structure is fixed (AI-15): only
            its texts and its team may change. Set by the server, never by a
            request.
        template_key:
          type: string
          nullable: true
          description: The template this skill was installed from (AI-15); null when written by hand.
        template_version:
          type: integer
          nullable: true
          description: The installed template's version.
        is_fallback:
          type: boolean
          description: |
            The skill that answers when nothing else does (AI-05): no procedure
            reached the agent's `clarify_thresholds.low` and no other skill took
            the message. At most one per agent. A one-message skill with no
            `detect_intent` step was moved onto it when procedures arrived, so
            it no longer answers before the skills that do match.
        active: { type: boolean }
        runs_count: { type: integer }
        updated_at: { type: string, format: date-time }
        created_by_name:
          type: string
          nullable: true
          description: |
            The account name of whoever created this skill, resolved server-side
            from the soft `created_by` reference. Null for a system/seed skill
            with no author, or if the authoring account was later deleted.
        created_by_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The stable identity behind `created_by_name` (soft reference to
            `accounts.id`, no FK). This is the human-owner filter key
            (FR-MOD-05.4) — the name alone is not a safe filter axis, since two
            accounts can share a name or one can be renamed. Null exactly when
            `created_by_name` would resolve to null (no author, or the author
            account was deleted).

    SkillPreview:
      type: object
      required: [outcome, log, errors, state]
      properties:
        state:
          description: The state the turn would leave on a new connection (tm 296.4).
          allOf:
            - $ref: "#/components/schemas/AiConversationState"
        procedure_problems:
          type: array
          description: |
            Why a procedure preview was not run — what a save of the definition
            would refuse, one entry per problem. Empty or absent otherwise.
          items: { $ref: "#/components/schemas/ProcedureProblemDetails" }
        outcome:
          type: string
          enum: [answered, handed_off, skipped]
          description: |
            `skipped` means the intent did not match, or nothing produced a
            reply — in which case a human takes the conversation.
        reply: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        transfer_to: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        log:
          type: array
          items: { $ref: "#/components/schemas/SkillLogEntry" }
        errors:
          type: array
          description: Reasons the step list could not be run at all.
          items: { type: string }
        error_details:
          type: array
          description: |
            The same refusals as `errors`, one entry each and in the same order,
            as codes a console can word in its own language (tm 261). `errors`
            keeps the English sentence.
          items: { $ref: "#/components/schemas/StepProblem" }

    StepProblem:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum:
            - steps_not_array
            - step_not_object
            - unknown_step_type
            - detect_intent_needs_intent
            - detect_intent_bad_phrases
            - request_info_needs_field
            - request_info_needs_prompt
            - tag_needs_tag
            - send_message_bad_source
            - send_message_needs_text
            - transfer_to_team_needs_team
            - transfer_to_team_unknown_team
        step:
          type: integer
          minimum: 1
          description: The 1-based position of the step; absent when the list as a whole was refused.
        type:
          type: string
          description: The unrecognised type, for `unknown_step_type`.

    SkillProcedure:
      type: object
      description: |
        A procedure's steps, reply templates, hand-over and limits (tm 296 ·
        ADR-14a; `Procedure` in @siyahtus/types `procedure.ts`). Its
        `when_to_use`, `examples`, `priority` and `slots` are the skill's own
        fields. Validated as a whole before it is stored (`validateProcedure`);
        a refusal is a `400 validation` whose `details` is a
        `ProcedureProblemDetails`. Omitted fields take their defaults.
      required: [steps]
      properties:
        steps:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: "#/components/schemas/ProcedureStep" }
        templates:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/ProcedureTemplate" }
        handoff: { $ref: "#/components/schemas/ProcedureHandoff" }
        resolution_criteria:
          allOf:
            - $ref: "#/components/schemas/ProcedureCondition"
          nullable: true
          description: |
            When the matter counts as solved (K9, tm 303.4): a `resolve` step
            says so only once this holds — "these slots are filled and the
            player said yes" (`player_confirmed()`). When it does not, the
            agent asks "is it solved?" if the player's yes is all that is
            missing, and otherwise hands over. Absent or `null`: the agent's
            default (`AiHandoffSettings.resolution_criteria`), else the
            player's explicit yes.
        limits:
          type: object
          required: [max_turns]
          properties:
            max_turns:
              type: integer
              minimum: 1
              maximum: 50
              description: AI turns before the procedure hands over with reason `max_turns`. Default 12.

    ProcedureStep:
      type: object
      required: [id, type]
      description: |
        A discriminated union on `type` (`ProcStep`):

          - `say` — `template_key` and/or `instruction`.
          - `collect` — ask for whichever of `slots` (one or two) are required
            and missing, and wait for the answer.
          - `check` — `when` is the branch condition: `then` when it holds,
            `else` (or the next step) when it does not.
          - `answer_from_knowledge` — answer from the knowledge base; `query_hint`.
          - `handoff` — hand over with `reason_code`, to `target` or the routes' team.
          - `resolve` — mark `outcome`; `followup_template` goes with it.
          - `tag` — tag the conversation.
          - `tool` — a system lookup's place (AI-28); `active` is always false
            in this release: skipped and logged.

        On any step but `check`, `when` is a guard: the step runs only when it holds.
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
          description: Unique in the procedure — what a `goto` and the run log name.
        type:
          type: string
          enum: [say, collect, check, answer_from_knowledge, handoff, resolve, tag, tool]
        instruction: { type: string, maxLength: 1000 }
        when: { $ref: "#/components/schemas/ProcedureCondition" }
        template_key: { type: string, description: "say: the template sent." }
        slots:
          type: array
          minItems: 1
          maxItems: 2
          items: { type: string }
          description: "collect: the slot names asked for."
        then: { $ref: "#/components/schemas/ProcedureBranch" }
        else: { $ref: "#/components/schemas/ProcedureBranch" }
        query_hint: { type: string, maxLength: 300 }
        reason_code:
          { type: string, description: "handoff: the procedure's own reason, shown on the card." }
        target: { $ref: "#/components/schemas/ProcedureHandoffTarget" }
        outcome:
          type: string
          enum: [resolved, resolved_waiting]
        followup_template: { type: string }
        tag: { type: string, maxLength: 64 }
        tool_key: { type: string }
        inputs:
          type: object
          additionalProperties: { type: string }
          description: "tool: the tool's input names mapped to slot names."
        active:
          type: boolean
          enum: [false]
          description: "tool: always false — no tool runs in this release."

    ProcedureBranch:
      type: object
      description: |
        Where a `check` goes: `{goto: <step id>}`, or a step written in place —
        a `say`, `answer_from_knowledge`, `handoff`, `resolve` or `tag` with no
        `id` and no `when`. A step in place that does not end the procedure
        goes on after the check.
      properties:
        goto: { type: string }
        type:
          type: string
          enum: [say, answer_from_knowledge, handoff, resolve, tag]
        instruction: { type: string, maxLength: 1000 }
        template_key: { type: string }
        query_hint: { type: string, maxLength: 300 }
        reason_code: { type: string }
        target: { $ref: "#/components/schemas/ProcedureHandoffTarget" }
        outcome:
          type: string
          enum: [resolved, resolved_waiting]
        followup_template: { type: string }
        tag: { type: string, maxLength: 64 }

    ProcedureHandoffTarget:
      description: A team by id, or a routing topic the license's routes resolve (`finance`, `kyc_risk`).
      oneOf:
        - type: object
          required: [group_id]
          properties:
            group_id: { type: integer }
        - type: object
          required: [topic]
          properties:
            topic: { type: string }

    ProcedureCondition:
      type: object
      minProperties: 1
      maxProperties: 1
      description: |
        A condition (`Cond`): exactly one key. A fixed language — no free
        expression. `all` / `any` / `not` combine; `slot` and `fact` compare a
        collected value or an AI-13 table value; `fn` is one of the fixed
        functions (`elapsed_minutes`, `within_working_hours`, `next_window`,
        `player_confirmed` — the player's yes to "is it solved?") — without
        `op`, a yes/no function's own answer; `ai` is a yes/no question the
        understanding call answers (`unknown` counts as false).
      properties:
        all:
          type: array
          items: { $ref: "#/components/schemas/ProcedureCondition" }
        any:
          type: array
          items: { $ref: "#/components/schemas/ProcedureCondition" }
        not: { $ref: "#/components/schemas/ProcedureCondition" }
        slot:
          type: object
          required: [name, op]
          properties:
            name: { type: string }
            op: { $ref: "#/components/schemas/ProcedureConditionOp" }
            value: { $ref: "#/components/schemas/ProcedureConditionOperand" }
        fact:
          type: object
          required: [path, op]
          properties:
            path: { type: string, description: "An AI-13 fact path: `method.expected_minutes`." }
            op: { $ref: "#/components/schemas/ProcedureConditionOp" }
            value: { $ref: "#/components/schemas/ProcedureConditionOperand" }
        fn:
          type: object
          required: [name, args]
          properties:
            name:
              type: string
              enum: [elapsed_minutes, within_working_hours, next_window, player_confirmed]
            args:
              type: array
              items: { type: string }
            op: { $ref: "#/components/schemas/ProcedureConditionOp" }
            value: { $ref: "#/components/schemas/ProcedureConditionOperand" }
        ai:
          type: object
          required: [question]
          properties:
            question: { type: string, maxLength: 300 }

    ProcedureConditionOp:
      type: string
      description: "`exists` / `missing` take no value; `in` / `not_in` take a list."
      enum: [eq, neq, lt, lte, gt, gte, in, not_in, exists, missing, matches]

    ProcedureConditionOperand:
      description: A literal, a list for `in` / `not_in`, or another slot's or fact's value.
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        - type: object
          required: [slot]
          properties:
            slot: { type: string }
        - type: object
          required: [fact]
          properties:
            fact: { type: string }

    ProcedureTemplate:
      type: object
      required: [key, text]
      description: |
        A reply text. `{name}` is replaced by a slot, a fact
        (`{method.expected_minutes}`) or a function
        (`{elapsed_minutes(islem_zamani)}`); a template with a variable the
        conversation cannot fill is not sent. `verbatim` text goes out as written.
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
        text: { type: string, maxLength: 2000 }
        verbatim: { type: boolean }

    ProcedureHandoff:
      type: object
      required: [conditions, card_fields]
      properties:
        conditions:
          type: array
          maxItems: 10
          description: Checked every turn — any one holding hands the conversation over.
          items: { $ref: "#/components/schemas/ProcedureCondition" }
        target: { $ref: "#/components/schemas/ProcedureHandoffTarget" }
        card_fields:
          type: array
          maxItems: 20
          description: What the hand-over card shows as the basis — a slot, fact or function, no braces.
          items: { type: string }
        next_step_hint:
          type: string
          maxLength: 500
          description: The card's suggested next step for the agent (template text).

    SlotDef:
      type: object
      required: [name, label, type, ask]
      description: |
        One piece of information a procedure collects (AI-04; `SlotDef` in
        @siyahtus/types `slots.ts`). A slot asking for a password, a one-time
        code, a card number or CVC, a seed phrase, online-banking credentials or
        a full IBAN is refused, as is a file slot asking for an identity
        document. Omitted fields take their defaults.
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
        label: { type: string, maxLength: 80 }
        type:
          type: string
          enum:
            - text
            - enum
            - number
            - money
            - datetime
            - date
            - duration
            - boolean
            - username
            - email
            - phone
            - txid
            - crypto_network
            - iban_last4
            - reference_code
            - file
            - url
        required:
          description: "`always` (default), `never`, or `{when: <condition>}`."
          oneOf:
            - type: string
              enum: [always, never]
            - type: object
              required: [when]
              properties:
                when: { $ref: "#/components/schemas/ProcedureCondition" }
        ask: { type: string, maxLength: 300, description: The question. }
        ask_variants:
          type: array
          maxItems: 3
          description: How the later attempts word it.
          items: { type: string, maxLength: 300 }
        validate:
          type: object
          properties:
            min: { type: number }
            max: { type: number }
            enum_source:
              type: string
              enum: [payment_methods.deposit, payment_methods.withdrawal, bonuses, kyc_documents]
            enum_values:
              type: array
              maxItems: 50
              items: { type: string }
            regex: { type: string, maxLength: 200 }
            network_aware: { type: boolean }
        pii:
          type: string
          enum: [none, low, high]
        show_in_card: { type: boolean }
        card_label: { type: string, maxLength: 80 }
        max_attempts: { type: integer, minimum: 1, maximum: 5 }
        confirm:
          type: string
          enum: [never, if_inferred, always]

    ProcedureProblemDetails:
      type: object
      required: [reason, section]
      description: |
        Why a procedure was refused (`procedureProblemDetails`), as a code a
        console words in its own language — the `details` of the `400
        validation`. Slot problems keep their `slot_*` codes.
      properties:
        reason:
          type: string
          enum:
            - procedure_not_object
            - procedure_unknown_field
            - procedure_needs_when_to_use
            - procedure_bad_examples
            - procedure_bad_priority
            - procedure_bad_limits
            - procedure_needs_steps
            - procedure_too_many_steps
            - procedure_step_not_object
            - procedure_step_bad_id
            - procedure_step_duplicate_id
            - procedure_step_unknown_type
            - procedure_step_bad_option
            - procedure_say_needs_content
            - procedure_collect_needs_slots
            - procedure_collect_too_many_slots
            - procedure_check_incomplete
            - procedure_unknown_goto
            - procedure_loop_without_collect
            - procedure_tool_must_be_inactive
            - procedure_bad_condition
            - procedure_condition_too_deep
            - procedure_bad_comparison
            - procedure_unknown_fact
            - procedure_fact_without_source
            - procedure_unknown_function
            - procedure_bad_function_args
            - procedure_ai_condition_repeated
            - procedure_bad_template
            - procedure_duplicate_template
            - procedure_unknown_template
            - procedure_unknown_variable
            - procedure_bad_handoff
            - procedure_bad_target
            - procedure_unknown_target
            - procedure_locked_change
            - procedure_fallback_taken
            - slots_not_array
            - slots_too_many
            - slot_not_object
            - slot_unknown_field
            - slot_bad_name
            - slot_duplicate_name
            - slot_needs_label
            - slot_unknown_type
            - slot_bad_required
            - slot_needs_ask
            - slot_bad_option
            - slot_bad_validate
            - slot_enum_needs_values
            - slot_unknown_enum_source
            - slot_sensitive_forbidden
            - slot_identity_document_forbidden
            - slot_unknown_reference
            - procedure_unreachable_step
        section:
          type: string
          enum: [procedure, slots, steps, templates, handoff, limits]
        position:
          type: integer
          minimum: 1
          description: The 1-based position in the section's list (slot, step, template, hand-over condition).
        step_id: { type: string }
        slot: { type: string }
        template_key: { type: string }
        field:
          { type: string, description: "The field at fault: `then`, `when`, `required`, `target`." }
        path: { type: string, description: "Where inside a condition: `when.all[1].slot`." }
        category:
          type: string
          description: "For `slot_sensitive_forbidden`: what the text reads as asking for."
          enum:
            - password
            - one_time_code
            - card_number
            - card_security_code
            - seed_or_private_key
            - online_banking
            - full_iban
        reference:
          type: string
          description: What was named and not found or not allowed — a goto target, a variable, a team.

    SkillProcedureDraft:
      type: object
      required:
        [name, when_to_use, examples, priority, slots, procedure, source, problems, warnings]
      description: |
        A procedure drafted from an SOP (`POST /skills/compile`, tm 296.4): the
        fields `POST /skills` takes with `mode: procedure`, and the save-time
        validator's verdict on them. A draft with problems may break the rules
        those problems name — that is what they are for. No conditions: the
        author writes them.
      properties:
        name: { type: string }
        when_to_use: { type: string }
        examples:
          type: array
          items: { type: string }
        priority: { type: integer }
        slots:
          type: array
          items: { $ref: "#/components/schemas/SlotDef" }
        procedure: { $ref: "#/components/schemas/SkillProcedure" }
        source:
          type: string
          enum: [rules, model]
          description: "`rules` — the rule-based skeleton; `model` — the configured model wrote it."
        problems:
          type: array
          description: What a save would refuse; empty when it would store the draft as it is.
          items: { $ref: "#/components/schemas/ProcedureProblemDetails" }
        warnings:
          type: array
          description: What a save allows but flags (`procedure_unreachable_step`).
          items: { $ref: "#/components/schemas/ProcedureProblemDetails" }

    SkillValidationError:
      description: |
        A `400 validation` from a skill write. `details` says why, as codes: a
        `StepProblem` for the one-message step list, a
        `ProcedureProblemDetails` for a procedure (the first problem found).
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  anyOf:
                    - $ref: "#/components/schemas/StepProblem"
                    - $ref: "#/components/schemas/ProcedureProblemDetails"
                    - $ref: "#/components/schemas/TemplatePublishProblem"

    TemplatePublishProblem:
      type: object
      required: [reason]
      description: |
        Why an installed template copy cannot be switched on (AI-15): a
        placeholder the workspace has not replaced yet (`template_unfilled`,
        `placeholders` names their keys), or a topic it hands over to that
        neither a hand-over route nor a team's topic role sends anywhere
        (`template_unmapped`, `topics`).
      properties:
        reason: { type: string, enum: [template_unfilled, template_unmapped] }
        placeholders:
          type: array
          items: { type: string }
        topics:
          type: array
          items: { type: string }

    AiTemplateTenantMustFill:
      type: object
      required: [kind, label]
      description: |
        One item of "Kiracının doldurması gerekenler" (AI-15-S1):
        `placeholder` — a `{key}` left in a reply text, with the "örnek —
        doğrulayın" value the scenarios run with (never installed); publishing
        with one left is `template_unfilled`. `table` — the structured
        knowledge table and the columns the procedure reads. `setting` — a
        workspace text it relies on (the crisis text, the complaint procedure,
        the access information).
      properties:
        kind: { type: string, enum: [placeholder, table, setting] }
        label: { type: string }
        key: { type: string, description: "placeholder: the key, without braces." }
        example: { type: string, description: "placeholder: an example value." }
        table:
          type: string
          description: "table: the table, and for payment methods the direction (`payment_methods.deposit`)."
        columns:
          type: array
          description: "table: the procedure facts it reads (`method.expected_minutes`)."
          items: { type: string }
        setting: { type: string, enum: [crisis, complaint, access_info] }

    AiTemplateSummary:
      type: object
      required:
        - key
        - name
        - summary
        - industry
        - lang
        - version
        - locked
        - topics
        - tenant_must_fill_count
        - installed_version
      properties:
        key: { type: string }
        name: { type: string, maxLength: 80 }
        summary: { type: string, maxLength: 300 }
        industry: { type: string, enum: [igaming] }
        lang: { type: string, enum: [tr] }
        version:
          type: integer
          minimum: 1
          description: Raised when the platform changes the template; an installed copy keeps its own.
        locked:
          type: boolean
          description: A copy can be neither switched off nor deleted; only its texts and team change.
        topics:
          type: array
          description: The routing topics it hands over to — what `route_mapping` maps.
          items: { $ref: "#/components/schemas/QueueTopicRole" }
        tenant_must_fill_count: { type: integer, minimum: 0 }
        installed_version:
          type: integer
          nullable: true
          description: |
            The newest version of it among this workspace's copies; null when it
            has none. Below `version`: a newer template is out ("yeni sürüm var").

    AiTemplatePackSummary:
      type: object
      required:
        [key, version, industry, lang, template_keys, default_rules_count, sample_rows_count]
      properties:
        key: { type: string, enum: [igaming_core] }
        version: { type: string, description: The package's version. }
        industry: { type: string, enum: [igaming] }
        lang: { type: string, enum: [tr] }
        template_keys:
          type: array
          items: { type: string }
        default_rules_count: { type: integer, minimum: 0 }
        sample_rows_count: { type: integer, minimum: 0 }

    AiTemplateList:
      type: object
      required: [items, packs]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AiTemplateSummary" }
        packs:
          type: array
          items: { $ref: "#/components/schemas/AiTemplatePackSummary" }

    AiTemplate:
      description: |
        A whole template (AI-15): the summary, the procedure in the shape a
        skill stores it (hand-overs name a topic, never a team), the phrases
        its replies must never carry, the checklist, its scenarios (AI-19
        seeds) and the hand-over card it leaves.
      allOf:
        - $ref: "#/components/schemas/AiTemplateSummary"
        - type: object
          required:
            [
              when_to_use,
              examples,
              priority,
              slots,
              procedure,
              forbidden_phrases,
              tenant_must_fill,
              scenarios,
            ]
          properties:
            when_to_use: { type: string }
            examples:
              type: array
              items: { type: string }
            priority: { type: integer, minimum: 1, maximum: 1000 }
            slots:
              type: array
              items: { $ref: "#/components/schemas/SlotDef" }
            procedure: { $ref: "#/components/schemas/SkillProcedure" }
            forbidden_phrases:
              type: array
              items:
                type: object
                required: [phrase, match, why]
                properties:
                  phrase: { type: string }
                  match: { type: string, enum: [exact, word, regex] }
                  why: { type: string }
            tenant_must_fill:
              type: array
              items: { $ref: "#/components/schemas/AiTemplateTenantMustFill" }
            scenarios:
              type: array
              description: Scripted test conversations — the player's turns and how the conversation must end.
              items:
                type: object
                required: [key, name, persona, turns, expect]
                additionalProperties: true
                properties:
                  key: { type: string }
                  name: { type: string }
                  persona: { type: string }
                  turns:
                    type: array
                    items: { type: string }
                  expect:
                    type: object
                    additionalProperties: true
            card_example:
              type: string
              nullable: true
              description: The hand-over card an agent sees for this topic, for the preview.

    AiTemplateInstallRequest:
      type: object
      additionalProperties: false
      required: [ai_agent_id]
      properties:
        ai_agent_id: { type: string, format: uuid }
        brand_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: The brands `route_mapping`'s routes are for; omitted, every brand.
          items: { type: string, format: uuid }
        route_mapping:
          type: object
          description: "`{ <topic>: <team id> }` — a hand-over route per topic (AI-12)."
          additionalProperties: { type: integer, minimum: 1 }
        force_copy:
          type: boolean
          description: Make another copy even when the agent has one.

    AiTemplateInstallResult:
      type: object
      required: [created, skill, tenant_must_fill, unfilled_placeholders, unmapped_topics]
      properties:
        created: { type: boolean }
        skill: { $ref: "#/components/schemas/Skill" }
        tenant_must_fill:
          type: array
          items: { $ref: "#/components/schemas/AiTemplateTenantMustFill" }
        unfilled_placeholders:
          type: array
          description: The copy's `{key}`s still to replace; publishing waits for none.
          items: { type: string }
        unmapped_topics:
          type: array
          description: The copy's topics no route or team serves; publishing waits for none.
          items: { type: string }

    AiTemplatePackInstallRequest:
      type: object
      additionalProperties: false
      required: [ai_agent_id]
      properties:
        ai_agent_id: { type: string, format: uuid }
        brand_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
        route_mapping:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
        create_groups:
          type: boolean
          description: Make the teams for the topics nothing serves yet. Default false.

    AiTemplatePackInstallResult:
      type: object
      required:
        - pack
        - version
        - templates
        - rules
        - sample_rows
        - groups_created
        - persona_style
        - unmapped_topics
      properties:
        pack: { type: string }
        version: { type: string }
        templates:
          type: array
          items:
            type: object
            required:
              [
                template_key,
                skill_id,
                created,
                tenant_must_fill,
                unfilled_placeholders,
                unmapped_topics,
              ]
            properties:
              template_key: { type: string }
              skill_id: { type: string, format: uuid }
              created: { type: boolean }
              tenant_must_fill:
                type: array
                items: { $ref: "#/components/schemas/AiTemplateTenantMustFill" }
              unfilled_placeholders:
                type: array
                items: { type: string }
              unmapped_topics:
                type: array
                items: { type: string }
        rules:
          type: object
          required: [created, existing]
          properties:
            created:
              type: array
              description: The behaviour rules written, switched off.
              items: { $ref: "#/components/schemas/AiGuidanceRule" }
            existing: { type: integer, minimum: 0 }
        sample_rows:
          type: object
          required: [created, skipped]
          description: |
            The "örnek — doğrulayın" rows (`source: sample`); skipped ones the
            table had by name.
          properties:
            created: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0 }
        groups_created:
          type: array
          items:
            type: object
            required: [id, name, topic_role]
            properties:
              id: { type: integer }
              name: { type: string }
              topic_role: { $ref: "#/components/schemas/QueueTopicRole" }
        persona_style:
          type: object
          required: [address_form, emoji, max_questions_per_message]
          description: A suggestion the console shows; the agent's persona is not changed.
          properties:
            address_form: { type: string }
            emoji: { type: string }
            max_questions_per_message: { type: integer }
        unmapped_topics:
          type: array
          items: { type: string }

    # --- The AI test bench (tm 314.1 · AI-19) ------------------------------
    # `@siyahtus/types` `ai-testing.ts` holds the same lists and bounds
    # (`ai-testing-schema.test.ts` compares them).

    ScenarioPersona:
      type: string
      description: The player a scenario plays (`SCENARIO_PERSONAS`).
      enum:
        - normal
        - sabirsiz
        - kizgin
        - eksik_bilgi
        - sorumlu_oyun_sinyali
        - resit_olmayan
        - insan_istiyor
        - yabanci_dil

    ScenarioOutcome:
      type: string
      description: How a conversation ended, or must end (`SCENARIO_OUTCOMES`).
      enum: [resolved, resolved_waiting, handoff]

    AiTestScenarioOrigin:
      type: string
      enum: [template, manual, generated, from_chat, from_qa]

    AiTestScenarioMode:
      type: string
      description: |
        `scripted` — the player's messages, in order; `simulated` — a model
        plays the persona, knowing `facts` and wanting `goal`.
      enum: [scripted, simulated]

    AiTestRunTarget:
      type: string
      description: The draft, the published configuration, or a named version (tm 316).
      enum: [draft, published, version]

    AiTestRunTrigger:
      type: string
      enum: [manual, pre_publish, nightly]

    AiTestRunStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled]

    AiTestResultStatus:
      type: string
      description: |
        `passed` — every hard check held; `failed` — one did not; `errored` —
        the scenario could not be played (`stop_reason` `timeout` or `error`).
      enum: [passed, failed, errored]

    AiTestStopReason:
      type: string
      enum: [resolved, handoff, max_turns, script_end, timeout, error]

    AiTestCheckKind:
      type: string
      enum:
        - outcome
        - team
        - topic
        - procedure
        - reason_code
        - required_slots
        - values
        - forbidden_phrase
        - sensitive_request
        - must_flags
        - must_not_flags
        - turn_count
        - language

    AiTestExpectations:
      type: object
      additionalProperties: false
      required: [outcome, max_turns]
      description: |
        What must come out of a scenario. `outcome` and `max_turns` are always
        checked, every other key only when given; `team_id`, `topic` and
        `reason_code` belong to a hand-over.
      properties:
        outcome: { $ref: "#/components/schemas/ScenarioOutcome" }
        team_id: { type: integer, format: int64, minimum: 1 }
        topic: { $ref: "#/components/schemas/QueueTopicRole" }
        procedure_id:
          { type: string, format: uuid, description: The procedure (skill) the AI must pick. }
        reason_code: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
        required_slots:
          type: array
          maxItems: 30
          items: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
        values:
          type: object
          maxProperties: 30
          description: What some slots hold, as the hand-over card shows it.
          additionalProperties: { type: string, minLength: 1, maxLength: 500 }
        forbidden_phrases:
          type: array
          maxItems: 30
          description: Phrases no AI message may carry, beyond the workspace's own (AI-08).
          items: { type: string, minLength: 1, maxLength: 500 }
        must_flags:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/RiskFlagType" }
        must_not_flags:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/RiskFlagType" }
        max_turns: { type: integer, minimum: 1, maximum: 30, default: 12 }
        language: { type: string, pattern: "^[a-z]{2}$" }

    AiTestScenarioInput:
      type: object
      additionalProperties: false
      required: [ai_agent_id, name, expectations]
      description: |
        A scenario as the workspace writes it. Scenario text is synthetic by
        rule: the API masks personal data in it (AI-26) before it is stored.
      properties:
        ai_agent_id: { type: string, format: uuid }
        brand_id:
          type: string
          format: uuid
          nullable: true
          description: The brand the conversation comes in through; null — not known.
        name: { type: string, minLength: 1, maxLength: 120 }
        mode: { allOf: [{ $ref: "#/components/schemas/AiTestScenarioMode" }], default: scripted }
        persona: { allOf: [{ $ref: "#/components/schemas/ScenarioPersona" }], default: normal }
        language: { type: string, pattern: "^[a-z]{2}$", default: tr }
        simulated_now:
          type: string
          format: date-time
          nullable: true
          description: The frozen clock's start, with its offset; it moves 30 s per turn. Null — when the run starts.
        goal:
          type: string
          minLength: 1
          maxLength: 500
          nullable: true
          description: What the simulated player wants; required for `simulated`.
        turns:
          type: array
          maxItems: 30
          description: The player's messages; at least one for `scripted`.
          items: { type: string, minLength: 1, maxLength: 2000 }
        facts:
          type: object
          maxProperties: 40
          description: "What the player knows: `{ yontem: Papara, tutar: 2500 }`."
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 500 }
              - { type: number }
              - { type: boolean }
        tool_outputs:
          type: object
          maxProperties: 20
          description: What a tool step would have returned, by tool key (AI-28).
          additionalProperties: { type: object, additionalProperties: true }
        expectations: { $ref: "#/components/schemas/AiTestExpectations" }
        active: { type: boolean, default: true }

    AiTestScenarioPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Any field of the input but the agent; the merged scenario is validated whole.
      properties:
        brand_id: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1, maxLength: 120 }
        mode: { $ref: "#/components/schemas/AiTestScenarioMode" }
        persona: { $ref: "#/components/schemas/ScenarioPersona" }
        language: { type: string, pattern: "^[a-z]{2}$" }
        simulated_now: { type: string, format: date-time, nullable: true }
        goal: { type: string, minLength: 1, maxLength: 500, nullable: true }
        turns:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 2000 }
        facts:
          type: object
          maxProperties: 40
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 500 }
              - { type: number }
              - { type: boolean }
        tool_outputs:
          type: object
          maxProperties: 20
          additionalProperties: { type: object, additionalProperties: true }
        expectations: { $ref: "#/components/schemas/AiTestExpectations" }
        active: { type: boolean }

    AiTestScenario:
      type: object
      required:
        [
          id,
          ai_agent_id,
          brand_id,
          name,
          origin,
          origin_ref,
          mode,
          persona,
          language,
          simulated_now,
          goal,
          turns,
          facts,
          tool_outputs,
          expectations,
          active,
          created_by,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        origin: { $ref: "#/components/schemas/AiTestScenarioOrigin" }
        origin_ref:
          type: string
          nullable: true
          description: What `origin` came from — a template key, a chat id, a QA finding id.
        mode: { $ref: "#/components/schemas/AiTestScenarioMode" }
        persona: { $ref: "#/components/schemas/ScenarioPersona" }
        language: { type: string }
        simulated_now: { type: string, format: date-time, nullable: true }
        goal: { type: string, nullable: true }
        turns: { type: array, items: { type: string } }
        facts:
          type: object
          additionalProperties:
            oneOf: [{ type: string }, { type: number }, { type: boolean }]
        tool_outputs:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        expectations: { $ref: "#/components/schemas/AiTestExpectations" }
        active: { type: boolean }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AiTestScenarioList:
      type: object
      required: [scenarios]
      properties:
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/AiTestScenario" }

    AiTestTurnTrace:
      type: object
      required: [decision, procedure, slots, sources, guardrails, handoff, flags, tokens]
      description: |
        Why the AI said what it said on one turn: the procedure and why, what
        it collected, the knowledge it used, the guardrails that fired, the
        hand-over, the flags it raised, and what the turn cost.
      properties:
        decision:
          type: string
          enum: [answered, asked, handoff, silent, blocked, expired, cap_reached]
        procedure:
          type: object
          nullable: true
          required: [skill_id, name, reason]
          properties:
            skill_id: { type: string, format: uuid }
            name: { type: string }
            reason: { type: string }
        slots:
          type: object
          additionalProperties: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [source_id, title, page]
            properties:
              source_id: { type: string }
              title: { type: string }
              page: { type: integer, nullable: true }
        guardrails:
          type: array
          items:
            type: object
            required: [rule_key, action]
            properties:
              rule_key: { type: string }
              action: { type: string }
        handoff:
          type: object
          nullable: true
          required: [reason, topic, team_id]
          properties:
            reason: { type: string }
            topic: { allOf: [{ $ref: "#/components/schemas/QueueTopicRole" }], nullable: true }
            team_id: { type: integer, format: int64, nullable: true }
        flags:
          type: array
          items: { $ref: "#/components/schemas/RiskFlagType" }
        tokens: { type: integer, minimum: 0 }

    AiTestTranscriptEntry:
      type: object
      required: [role, text, at]
      properties:
        role: { type: string, enum: [player, ai, system] }
        text: { type: string }
        at: { type: string, format: date-time, description: The frozen clock's moment. }
        trace: { $ref: "#/components/schemas/AiTestTurnTrace" }

    AiTestCheck:
      type: object
      required: [kind, passed]
      properties:
        kind: { $ref: "#/components/schemas/AiTestCheckKind" }
        passed: { type: boolean }
        expected: {}
        actual: {}
        turn_index: { type: integer, minimum: 0 }
        detail: { type: string }

    AiTestJudgeVerdict:
      type: object
      required: [score, comment]
      description: |
        The judge's advice (AI-19-S3, tm 314.3): the fast model's score on the
        platform's QA rubric (AI-24 a–g) — it never changes a result's status.
        Counted on the test meter (`llm_test`). Null on a result that was not
        judged: errored, the AI never answered, or the judge could not answer.
      properties:
        score: { type: integer, minimum: 1, maximum: 5, description: The conversation overall. }
        comment: { type: string, maxLength: 500, description: Masked (AI-26). }
        criteria:
          type: object
          additionalProperties: false
          description: |
            The criteria it scored (`AI_TEST_JUDGE_CRITERIA`): the right path for
            what the player wanted, the information the matter needs, nothing the
            knowledge or the procedure did not support, within responsible gaming
            and the site rules, the hand-over's moment and its summary (only after
            a hand-over), the tone.
          properties:
            topic: { type: integer, minimum: 1, maximum: 5 }
            required_info: { type: integer, minimum: 1, maximum: 5 }
            faithfulness: { type: integer, minimum: 1, maximum: 5 }
            guardrails: { type: integer, minimum: 1, maximum: 5 }
            handoff_timing: { type: integer, minimum: 1, maximum: 5 }
            handoff_summary: { type: integer, minimum: 1, maximum: 5 }
            tone: { type: integer, minimum: 1, maximum: 5 }

    AiTestRunCreate:
      type: object
      additionalProperties: false
      required: [ai_agent_id, target]
      properties:
        ai_agent_id: { type: string, format: uuid }
        target: { $ref: "#/components/schemas/AiTestRunTarget" }
        config_version_id:
          type: string
          format: uuid
          description: Required exactly when `target` is `version`.
        trigger:
          type: string
          enum: [manual, pre_publish]
          default: manual
          description: |
            `pre_publish` — the run before a publish (AI-19-S1): the draft
            only, no `scenario_ids` — the platform's compliance pack first,
            then every active scenario of the agent's, at most 186 of them.
            The nightly run is the scheduler's.
        scenario_ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          description: The scenarios to play; omitted — every active one of the agent.
          items: { type: string, format: uuid }

    AiTestRun:
      type: object
      required:
        [
          id,
          ai_agent_id,
          target,
          config_version_id,
          draft_revision,
          trigger,
          status,
          scenario_count,
          passed,
          failed,
          errored,
          tokens,
          compliance,
          error,
          started_by,
          created_at,
          started_at,
          finished_at,
        ]
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        target: { $ref: "#/components/schemas/AiTestRunTarget" }
        config_version_id: { type: string, format: uuid, nullable: true }
        draft_revision: { type: integer, minimum: 0, nullable: true }
        trigger: { $ref: "#/components/schemas/AiTestRunTrigger" }
        status: { $ref: "#/components/schemas/AiTestRunStatus" }
        scenario_count: { type: integer, minimum: 0, maximum: 200 }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        errored: { type: integer, minimum: 0 }
        tokens:
          type: integer
          format: int64
          minimum: 0
          description: Counted on the test meter (`llm_test`), never the live one.
        compliance:
          type: object
          nullable: true
          description: The platform's locked compliance pack's share of the run (AI-19-S1); null — the run did not play it.
          required: [pack_version, passed, failed]
          properties:
            pack_version: { type: string }
            passed: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0, description: Failed or errored. }
        error: { type: string, nullable: true, description: What stopped a `failed` run. }
        started_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    AiComplianceGateState:
      type: string
      enum: [passed, failed, pending, stale, missing]
      description: |
        What the agent's latest pre-publish run of the draft says of
        publishing: the whole compliance pack passed under its current
        version; a pack scenario failed or errored, or the run stopped short;
        the run is still queued or playing; it played another version of the
        pack; there is no such run. Only `passed` opens publishing.

    AiComplianceExpectations:
      type: object
      additionalProperties: false
      required: [outcome, max_turns]
      description: |
        As a scenario's expectations (`AiTestExpectations`), except that
        `outcome` may be null — any ending: the output rules (G7, G11) hold
        whatever the conversation came to.
      properties:
        outcome:
          allOf: [{ $ref: "#/components/schemas/ScenarioOutcome" }]
          nullable: true
        topic: { $ref: "#/components/schemas/QueueTopicRole" }
        reason_code: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
        forbidden_phrases:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 500 }
        must_flags:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/RiskFlagType" }
        max_turns: { type: integer, minimum: 1, maximum: 30 }

    AiComplianceScenario:
      type: object
      required: [key, guardrail, language, name, persona, turns, expectations]
      description: One locked scenario of the platform's compliance pack — code, not a row.
      properties:
        key:
          type: string
          pattern: "^compliance:G([1-9]|1[0-9]):[a-z]{2}$"
          description: The results' `scenario_key`.
        guardrail: { type: string, enum: [G1, G2, G3, G5, G7, G11, G16] }
        language: { type: string, enum: [tr, en] }
        name: { type: string, minLength: 1, maxLength: 120 }
        persona: { $ref: "#/components/schemas/ScenarioPersona" }
        turns:
          type: array
          minItems: 1
          description: The player's messages, in order — every pack scenario is scripted.
          items: { type: string, minLength: 1, maxLength: 2000 }
        expectations: { $ref: "#/components/schemas/AiComplianceExpectations" }

    AiComplianceGate:
      type: object
      required: [state, open, run_id, run_pack_version, passed, failed, failing, workspace_failed]
      properties:
        state: { $ref: "#/components/schemas/AiComplianceGateState" }
        open: { type: boolean, description: True only when `state` is `passed`. }
        run_id:
          type: string
          format: uuid
          nullable: true
          description: The pre-publish run it read; null — there is none.
        run_pack_version: { type: string, nullable: true }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0, description: Failed or errored. }
        failing:
          type: array
          description: The pack scenarios that did not pass, in the pack's order.
          items: { type: string, pattern: "^compliance:G([1-9]|1[0-9]):[a-z]{2}$" }
        workspace_failed:
          type: integer
          minimum: 0
          description: The workspace's own scenarios that failed or errored in that run — never the pack's.

    AiCompliancePack:
      type: object
      required: [pack_version, scenarios, gate]
      properties:
        pack_version: { type: string, minLength: 1, maxLength: 40 }
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/AiComplianceScenario" }
        gate: { $ref: "#/components/schemas/AiComplianceGate" }

    AiTestRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/AiTestRun" }

    AiTestRunResult:
      type: object
      required:
        [
          id,
          run_id,
          scenario_id,
          scenario_key,
          scenario_name,
          status,
          stop_reason,
          outcome,
          handoff_team_id,
          transcript,
          checks,
          judge,
          tokens,
          duration_ms,
          regression,
        ]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid, nullable: true }
        scenario_key:
          type: string
          description: The scenario's id, or `compliance:G<n>:<lang>` for the platform's pack.
        scenario_name: { type: string }
        status: { $ref: "#/components/schemas/AiTestResultStatus" }
        stop_reason: { $ref: "#/components/schemas/AiTestStopReason" }
        outcome: { allOf: [{ $ref: "#/components/schemas/ScenarioOutcome" }], nullable: true }
        handoff_team_id: { type: integer, format: int64, nullable: true }
        transcript:
          type: array
          items: { $ref: "#/components/schemas/AiTestTranscriptEntry" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/AiTestCheck" }
        judge: { allOf: [{ $ref: "#/components/schemas/AiTestJudgeVerdict" }], nullable: true }
        tokens: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
        regression:
          type: string
          nullable: true
          description: |
            Against the same scenario (by `scenario_key`) in the previous published
            version's last run — until versions exist (tm 316), the agent's last
            completed run against the published configuration queued before this
            one: `newly_failing` (passed → fails or errors, listed first),
            `outcome_changed`, `team_changed`, `newly_passing`; null — nothing
            changed, or no earlier result.
          enum: [newly_failing, outcome_changed, team_changed, newly_passing, null]

    AiTestRunResultList:
      type: object
      required: [results, compared_run_id]
      properties:
        compared_run_id:
          type: string
          format: uuid
          nullable: true
          description: The earlier run `regression` compares against; null — none.
        results:
          type: array
          description: Newly failing first, then changed outcome or team, then the rest.
          items: { $ref: "#/components/schemas/AiTestRunResult" }

    AiSandboxSessionCreate:
      type: object
      additionalProperties: false
      required: [ai_agent_id]
      properties:
        ai_agent_id: { type: string, format: uuid }
        target: { allOf: [{ $ref: "#/components/schemas/AiTestRunTarget" }], default: draft }
        config_version_id: { type: string, format: uuid }

    AiSandboxSession:
      type: object
      required:
        [id, ai_agent_id, target, config_version_id, transcript, tokens, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        target: { $ref: "#/components/schemas/AiTestRunTarget" }
        config_version_id: { type: string, format: uuid, nullable: true }
        transcript:
          type: array
          items: { $ref: "#/components/schemas/AiTestTranscriptEntry" }
        tokens: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: 24 hours after the last turn.

    AiSandboxTurnRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }

    AiSandboxTurnResponse:
      type: object
      required: [session, reply, trace]
      properties:
        session: { $ref: "#/components/schemas/AiSandboxSession" }
        reply:
          type: string
          nullable: true
          description: What the AI said; null — it said nothing (a hand-over without a message).
        trace: { $ref: "#/components/schemas/AiTestTurnTrace" }

    AiSandboxSaveAsScenario:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        The session's player messages become a scripted scenario; the
        expectations are suggested from the session's last state and may be
        overridden here.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        expectations: { $ref: "#/components/schemas/AiTestExpectations" }

    AiUnresolvedReason:
      type: string
      description: |
        Why a message is on the list (`UNRESOLVED_REASONS`, one definition with
        AI-25's hand-over metrics).
      enum:
        - no_procedure_match
        - no_knowledge
        - low_confidence
        - said_dont_know
        - unsupported_language
        - not_understood_handoff
        - player_abandoned
        - asked_human_after_ai
        - agent_flagged

    AiUnresolvedReasonCount:
      type: object
      required: [reason, count]
      properties:
        reason: { $ref: "#/components/schemas/AiUnresolvedReason" }
        count: { type: integer, minimum: 0 }

    AiUnresolvedCluster:
      type: object
      required:
        - id
        - ai_agent_id
        - label
        - label_source
        - suggested_action
        - status
        - ignore_reason
        - item_count
        - count_7d
        - handoff_count
        - abandon_count
        - handoff_rate
        - abandon_rate
        - post_fix_count
        - is_new
        - first_seen
        - last_seen
        - resolved_at
        - linked_change_id
        - reasons
        - matching_count
      description: |
        A group of messages that ask the same thing. The counts are the
        clustering job's and outlive the messages' words (90 days).
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        label:
          type: string
          description: At most eight words; the lexical labeller's where no model ran. A summary — read the examples.
        label_source: { type: string, enum: [llm, lexical] }
        suggested_action:
          type: string
          nullable: true
          enum: [add_knowledge, add_examples, new_procedure, review, null]
        status: { type: string, enum: [open, ignored, resolved] }
        ignore_reason: { type: string, nullable: true }
        item_count: { type: integer, minimum: 0 }
        count_7d: { type: integer, minimum: 0 }
        handoff_count: { type: integer, minimum: 0 }
        abandon_count: { type: integer, minimum: 0 }
        handoff_rate: { type: number, minimum: 0, maximum: 1 }
        abandon_rate: { type: number, minimum: 0, maximum: 1 }
        post_fix_count:
          type: integer
          minimum: 0
          description: Items that arrived after `resolved_at` ("düzeltmeden sonra").
        is_new: { type: boolean, description: First seen less than 48 hours ago. }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        linked_change_id: { type: string, format: uuid, nullable: true }
        reasons:
          type: array
          description: The reasons of the items still kept, most frequent first.
          items: { $ref: "#/components/schemas/AiUnresolvedReasonCount" }
        matching_count:
          type: integer
          nullable: true
          description: Items matching the list's `from`/`to`/`brand_id`/`reason`/`language`; null — none was given.

    AiUnresolvedClusterList:
      type: object
      required: [clusters, total, unclustered_count, spike_threshold]
      properties:
        clusters:
          type: array
          items: { $ref: "#/components/schemas/AiUnresolvedCluster" }
        total:
          { type: integer, minimum: 0, description: Clusters matching, before `limit`/`offset`. }
        unclustered_count:
          type: integer
          minimum: 0
          description: This agent's items not in any cluster yet (the 15-minute job, or no embedding allowed).
        spike_threshold:
          type: integer
          description: Items in an hour that alarm; the workspace's own or the default.

    AiUnresolvedExample:
      type: object
      required: [id, text, context, reason, language, brand_id, chat_id, thread_id, created_at]
      description: One masked message. `chat_id` is the panel's "Thread ID", `thread_id` its "Chat ID".
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        context:
          { type: string, nullable: true, description: The player's message before it, masked. }
        reason: { $ref: "#/components/schemas/AiUnresolvedReason" }
        language: { type: string, nullable: true }
        brand_id: { type: string, format: uuid, nullable: true }
        chat_id: { type: string }
        thread_id: { type: string }
        created_at: { type: string, format: date-time }

    AiUnresolvedTrendPoint:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date, description: UTC day. }
        count: { type: integer, minimum: 0 }

    AiUnresolvedLanguageCount:
      type: object
      required: [language, count]
      properties:
        language: { type: string, nullable: true }
        count: { type: integer, minimum: 0 }

    AiUnresolvedClusterDetail:
      allOf:
        - $ref: "#/components/schemas/AiUnresolvedCluster"
        - type: object
          required: [examples, trend, languages]
          properties:
            examples:
              type: array
              description: The newest first, at most 50.
              items: { $ref: "#/components/schemas/AiUnresolvedExample" }
            trend:
              type: array
              description: The last 14 days, oldest first, a day with none as 0.
              items: { $ref: "#/components/schemas/AiUnresolvedTrendPoint" }
            languages:
              type: array
              items: { $ref: "#/components/schemas/AiUnresolvedLanguageCount" }

    AiUnresolvedIgnoreRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    AiUnresolvedResolveRequest:
      type: object
      additionalProperties: false
      properties:
        linked_change_id: { type: string, format: uuid }

    AiUnresolvedMergeRequest:
      type: object
      additionalProperties: false
      required: [source_ids]
      properties:
        source_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }

    AiUnresolvedMergeResponse:
      type: object
      required: [cluster, absorbed]
      properties:
        cluster: { $ref: "#/components/schemas/AiUnresolvedCluster" }
        absorbed: { type: integer, minimum: 0 }

    AiUnresolvedKnowledgeSuggestion:
      type: object
      required: [cluster_id, ai_agent_id, target, title, questions, body]
      properties:
        cluster_id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        target: { type: string, enum: [knowledge_snippet] }
        title: { type: string }
        questions:
          type: array
          items: { type: string }
        body: { type: string, description: The outline the answer is written in. }

    AiUnresolvedAddExamplesRequest:
      type: object
      additionalProperties: false
      required: [skill_id, sentences]
      properties:
        skill_id: { type: string, format: uuid }
        sentences:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 300 }

    AiUnresolvedAddExamplesResponse:
      type: object
      required: [skill_id, added, skipped, examples_count]
      properties:
        skill_id: { type: string, format: uuid }
        added:
          type: array
          items: { type: string }
        skipped: { type: integer, minimum: 0, description: Sentences the procedure already had. }
        examples_count: { type: integer, minimum: 0 }

    AiSuggestionKind:
      type: string
      description: What the suggestion says (`@siyahtus/types` `SUGGESTION_KINDS`).
      enum:
        [
          wrong_answer,
          missing_info,
          should_have_handed_off,
          should_not_have_handed_off,
          tone,
          promote_agent_answer,
          other,
        ]

    AiSuggestionProposedChange:
      type: object
      additionalProperties: false
      required: [target, title, body, source_id]
      description: |
        What accepting writes into the AI-20 draft. `source_id` names the
        `faq` knowledge source or behaviour rule it corrects, or the
        procedure it adds an example or a note to; null writes a new snippet
        or rule.
      properties:
        target:
          type: string
          enum: [knowledge_snippet, guidance_rule, procedure_example, procedure_note]
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 4000 }
        source_id: { type: string, format: uuid, nullable: true }

    AiSuggestionExcerptMessage:
      type: object
      required: [event_id, author_type, is_ai, text, created_at, marked]
      properties:
        event_id: { type: string }
        author_type: { type: string, enum: [customer, agent, bot] }
        is_ai: { type: boolean, description: The model's message, not a rule bot's. }
        text: { type: string, description: Masked when the suggestion was made (AI-26). }
        created_at: { type: string, format: date-time }
        marked: { type: boolean, description: The message the suggestion is about. }

    AiSuggestionSimilarSource:
      type: object
      required: [chunk_id, source_id, source_name]
      properties:
        chunk_id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        source_name: { type: string }

    AiSuggestion:
      type: object
      required:
        - id
        - ai_agent_id
        - kind
        - source
        - status
        - chat_id
        - thread_id
        - event_ids
        - excerpt
        - note
        - team_id
        - proposed_change
        - removed_specifics
        - drafted_by
        - duplicate_of
        - cluster_id
        - already_known
        - similar_sources
        - reviewer_id
        - reviewed_at
        - review_note
        - resulting_change_id
        - created_by
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/AiSuggestionKind" }
        source: { type: string, enum: [agent_flag, qa_finding, unresolved_cluster] }
        status: { type: string, enum: [new, drafting, in_review, accepted, rejected, merged] }
        chat_id:
          { type: string, nullable: true, description: The day container (panel "Thread ID"). }
        thread_id: { type: string, nullable: true, description: The connection (panel "Chat ID"). }
        event_ids: { type: array, items: { type: string } }
        excerpt:
          type: array
          description: The last messages up to the marked one, masked when made.
          items: { $ref: "#/components/schemas/AiSuggestionExcerptMessage" }
        note: { type: string, nullable: true }
        team_id:
          type: integer
          nullable: true
          description: The conversation's team when the suggestion was made.
        proposed_change:
          allOf: [{ $ref: "#/components/schemas/AiSuggestionProposedChange" }]
          nullable: true
        removed_specifics:
          type: array
          description: What the drafting job took out of the agent's words, by kind.
          items:
            type: string
            enum: [name, username, email, phone, amount, date, time, reference]
        drafted_by: { type: string, nullable: true, enum: [llm, lexical, null] }
        duplicate_of: { type: string, format: uuid, nullable: true }
        cluster_id: { type: string, format: uuid, nullable: true }
        already_known:
          type: boolean
          description: The knowledge base has a passage at τ or above — "the information is there; why did the AI not find it?"
        similar_sources:
          type: array
          items: { $ref: "#/components/schemas/AiSuggestionSimilarSource" }
        reviewer_id: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        review_note: { type: string, nullable: true }
        resulting_change_id:
          type: string
          format: uuid
          nullable: true
          description: The AI-21 change accepting it wrote.
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AiSuggestionList:
      type: object
      required: [suggestions, total, open_count]
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/AiSuggestion" }
        total: { type: integer, minimum: 0 }
        open_count:
          type: integer
          minimum: 0
          description: The open suggestions the caller may review — the badge.

    QaReason:
      type: string
      description: Why a connection is in the QA queue (`@siyahtus/types` `QA_REASONS`).
      enum:
        [
          random,
          risk_flag,
          low_bsat,
          repeat_72h,
          guardrail_scan,
          mandatory_handoff,
          handoff_insufficient,
          consistency,
          manual,
        ]

    QaRubricCriterion:
      type: object
      additionalProperties: false
      required: [key, label, type, weight, critical, locked]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
        label: { type: string, minLength: 1, maxLength: 80 }
        type: { type: string, enum: [pass_fail, score_1_5] }
        weight: { type: integer, minimum: 1, maximum: 10 }
        critical:
          type: boolean
          description: Failing it fails the review; each one is confirmed on its own.
        locked:
          type: boolean
          description: The platform's — a workspace may not remove, retype or soften it.

    QaRubric:
      type: object
      required: [id, version, criteria, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        criteria:
          type: array
          items: { $ref: "#/components/schemas/QaRubricCriterion" }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    QaScoreValue:
      description: pass / fail, or 1–5; null — does not apply (never for a critical criterion).
      nullable: true
      oneOf:
        - { type: string, enum: [pass, fail] }
        - { type: integer, minimum: 1, maximum: 5 }

    QaCriterionScore:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { $ref: "#/components/schemas/QaScoreValue" }
        confirmed:
          type: boolean
          description: The reviewer confirmed this critical criterion on its own (AI-24 §4).

    QaExcerptMessage:
      type: object
      required: [event_id, author_type, is_ai, text, created_at]
      properties:
        event_id: { type: string }
        author_type: { type: string, enum: [customer, agent, bot] }
        is_ai: { type: boolean, description: The model's message, not a rule bot's. }
        text:
          type: string
          description: Masked when queued (AI-26); empty when the caller may not read a responsible-gaming conversation.
        created_at: { type: string, format: date-time }

    QaPrescore:
      type: object
      required: [criteria, critical_candidates, overall, scored_at]
      description: The model's reading — a suggestion, never a verdict.
      properties:
        criteria:
          type: array
          items:
            type: object
            required: [key, value, evidence_event_ids, rationale]
            properties:
              key: { type: string }
              value: { $ref: "#/components/schemas/QaScoreValue" }
              evidence_event_ids:
                type: array
                items: { type: string }
                description: This connection's events only — any other dropped the whole pre-score.
              rationale: { type: string }
        critical_candidates: { type: array, items: { type: string } }
        overall: { type: string, enum: [pass, fail] }
        scored_at: { type: string, format: date-time }

    QaReview:
      type: object
      required:
        - id
        - chat_id
        - thread_id
        - ai_agent_id
        - config_version_id
        - team_id
        - brand_id
        - reasons
        - priority
        - status
        - sample_day
        - assigned_to
        - claimed_at
        - due_at
        - overdue
        - rubric_id
        - prescored
        - final
        - critical_fail
        - reviewer_id
        - reviewed_at
        - comments
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        chat_id: { type: string, description: The day container (panel "Thread ID"). }
        thread_id: { type: string, description: The connection (panel "Chat ID"). }
        ai_agent_id: { type: string, format: uuid }
        config_version_id: { type: string, format: uuid, nullable: true }
        team_id:
          type: integer
          nullable: true
          description: The connection's team when it was queued — whose Team Lead reviews it.
        brand_id: { type: string, format: uuid, nullable: true }
        reasons: { type: array, items: { $ref: "#/components/schemas/QaReason" } }
        priority: { type: string, enum: [normal, guardrail, risk] }
        status: { type: string, enum: [pending_prescore, ready, in_review, completed] }
        sample_day: { type: string, format: date, nullable: true }
        assigned_to: { type: string, format: uuid, nullable: true }
        claimed_at: { type: string, format: date-time, nullable: true }
        due_at: { type: string, format: date-time }
        overdue: { type: boolean }
        rubric_id: { type: string, format: uuid }
        prescored: { type: boolean }
        final: { type: string, enum: [pass, fail], nullable: true }
        critical_fail: { type: boolean }
        reviewer_id: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        comments: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    QaReviewDetail:
      allOf:
        - { $ref: "#/components/schemas/QaReview" }
        - type: object
          required: [rubric, prescore, scores, excerpt, excerpt_restricted, trace, follow_ups]
          properties:
            rubric:
              type: object
              required: [id, version, criteria]
              properties:
                id: { type: string, format: uuid }
                version: { type: integer, nullable: true }
                criteria:
                  type: array
                  items: { $ref: "#/components/schemas/QaRubricCriterion" }
            prescore:
              allOf: [{ $ref: "#/components/schemas/QaPrescore" }]
              nullable: true
            scores:
              type: object
              additionalProperties: { $ref: "#/components/schemas/QaCriterionScore" }
            excerpt:
              type: array
              items: { $ref: "#/components/schemas/QaExcerptMessage" }
            excerpt_restricted: { type: boolean }
            trace:
              type: object
              description: The connection's decision trail while it exists (ID-08) — ids and codes, no text.
              required: [decisions, guardrail_hits, handoffs, risk_flags]
              properties:
                decisions:
                  type: array
                  items: { type: object, additionalProperties: true }
                guardrail_hits:
                  type: array
                  items: { type: object, additionalProperties: true }
                handoffs:
                  type: array
                  items: { type: object, additionalProperties: true }
                risk_flags:
                  type: array
                  items: { type: object, additionalProperties: true }
            follow_ups:
              type: object
              required: [suggestion_id, scenario_id]
              properties:
                suggestion_id: { type: string, format: uuid, nullable: true }
                scenario_id: { type: string, format: uuid, nullable: true }
                mandatory_handoff_violation:
                  type: boolean
                  description: On a completion — the AI missed a hand-over it had to make.

    QaReviewList:
      type: object
      required: [reviews, total, open_count]
      properties:
        reviews:
          type: array
          items: { $ref: "#/components/schemas/QaReview" }
        total: { type: integer, minimum: 0 }
        open_count: { type: integer, minimum: 0 }

    QaReviewCreateRequest:
      type: object
      additionalProperties: false
      required: [chat_id, thread_id]
      properties:
        chat_id: { type: string }
        thread_id: { type: string }
        note: { type: string, minLength: 1, maxLength: 1000 }

    QaReviewUpdateRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [save, complete, release] }
        scores:
          type: object
          additionalProperties: { $ref: "#/components/schemas/QaCriterionScore" }
        final: { type: string, enum: [pass, fail] }
        comments: { type: string, maxLength: 4000, nullable: true }

    QaSettings:
      type: object
      required:
        [sample_percent, sample_percent_min, sample_percent_max, prescore_enabled, conflict_check]
      properties:
        sample_percent: { type: integer, minimum: 1, maximum: 20 }
        sample_percent_min: { type: integer }
        sample_percent_max: { type: integer }
        prescore_enabled: { type: boolean }
        conflict_check:
          type: boolean
          description: A reviewer who took the conversation over may not review it.

    QaSettingsUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        sample_percent: { type: integer, minimum: 1, maximum: 20 }
        prescore_enabled: { type: boolean }
        conflict_check: { type: boolean }

    QaCalibration:
      type: object
      required:
        [id, period, rubric_id, status, reviews, my_scored, created_by, created_at, closed_at]
      properties:
        id: { type: string, format: uuid }
        period: { type: string, description: The month, YYYY-MM. }
        rubric_id: { type: string, format: uuid }
        status: { type: string, enum: [open, closed] }
        reviews: { type: integer, minimum: 1, maximum: 20 }
        my_scored: { type: integer, minimum: 0 }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }

    QaCalibrationReport:
      type: object
      required: [criteria, reviewers]
      properties:
        criteria:
          type: array
          items:
            type: object
            required: [key, label, agreement_percent, scored]
            properties:
              key: { type: string }
              label: { type: string }
              agreement_percent:
                type: number
                nullable: true
                description: The share of values equal to their conversation's majority.
              scored: { type: integer, minimum: 0 }
        reviewers:
          type: array
          items:
            type: object
            required: [reviewer_id, scored, deviation_percent, outlier]
            properties:
              reviewer_id: { type: string, format: uuid }
              scored: { type: integer, minimum: 0 }
              deviation_percent: { type: number, nullable: true }
              outlier: { type: boolean }

    QaCalibrationDetail:
      allOf:
        - { $ref: "#/components/schemas/QaCalibration" }
        - type: object
          required: [rubric, items, report]
          properties:
            rubric:
              type: object
              required: [id, version, criteria]
              properties:
                id: { type: string, format: uuid }
                version: { type: integer, nullable: true }
                criteria:
                  type: array
                  items: { $ref: "#/components/schemas/QaRubricCriterion" }
            items:
              type: array
              items:
                type: object
                required:
                  [
                    review_id,
                    chat_id,
                    thread_id,
                    reasons,
                    excerpt,
                    excerpt_restricted,
                    my_scores,
                    my_final,
                  ]
                properties:
                  review_id: { type: string, format: uuid }
                  chat_id: { type: string }
                  thread_id: { type: string }
                  reasons: { type: array, items: { $ref: "#/components/schemas/QaReason" } }
                  excerpt:
                    type: array
                    items: { $ref: "#/components/schemas/QaExcerptMessage" }
                  excerpt_restricted: { type: boolean }
                  my_scores:
                    type: object
                    nullable: true
                    additionalProperties: { $ref: "#/components/schemas/QaCriterionScore" }
                  my_final: { type: string, enum: [pass, fail], nullable: true }
            report:
              allOf: [{ $ref: "#/components/schemas/QaCalibrationReport" }]
              nullable: true

    QaCalibrationScoreRequest:
      type: object
      additionalProperties: false
      required: [review_id, scores, final]
      properties:
        review_id: { type: string, format: uuid }
        scores:
          type: object
          additionalProperties: { $ref: "#/components/schemas/QaCriterionScore" }
        final: { type: string, enum: [pass, fail] }

    QaSummary:
      type: object
      required:
        - from
        - to
        - open
        - overdue
        - completed
        - passed
        - failed
        - critical_failed
        - by_reason
        - criteria_failed
        - mandatory_handoff
        - guardrail_violations_confirmed
        - false_resolutions
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        open: { type: integer, minimum: 0 }
        overdue: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        critical_failed: { type: integer, minimum: 0 }
        by_reason:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        criteria_failed:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        mandatory_handoff:
          type: object
          required: [reviewed, violations]
          properties:
            reviewed: { type: integer, minimum: 0 }
            violations: { type: integer, minimum: 0 }
        guardrail_violations_confirmed: { type: integer, minimum: 0 }
        false_resolutions: { type: integer, minimum: 0 }

    AiSuggestionCreateRequest:
      type: object
      additionalProperties: false
      required: [chat_id, thread_id, kind]
      properties:
        chat_id: { type: string }
        thread_id: { type: string }
        event_id: { type: string, description: The message the suggestion is about. }
        kind: { $ref: "#/components/schemas/AiSuggestionKind" }
        note: { type: string, minLength: 1, maxLength: 1000 }
        ai_agent_id:
          type: string
          format: uuid
          description: The workspace's AI agent when absent.
        proposed_change: { $ref: "#/components/schemas/AiSuggestionProposedChange" }

    AiSuggestionReviewRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [edit, accept, reject, merge] }
        proposed_change: { $ref: "#/components/schemas/AiSuggestionProposedChange" }
        review_note: { type: string, minLength: 1, maxLength: 1000 }
        duplicate_of: { type: string, format: uuid }
        cluster_id: { type: string, format: uuid }

    AiSuggestionToScenarioRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }

    AiConfigEntityType:
      type: string
      description: What changed (`@siyahtus/types` `AI_CONFIG_ENTITY_TYPES`); `config_version` is versioning's (tm 316).
      enum:
        [
          persona,
          guidance_rule,
          procedure,
          skill,
          knowledge_source,
          knowledge_table_row,
          handoff_rule,
          handoff_route,
          guardrail,
          risk_policy,
          access_info,
          config_version,
        ]

    AiConfigChangeAction:
      type: string
      enum:
        [
          created,
          updated,
          deleted,
          submitted,
          approved,
          rejected,
          published,
          rolled_back,
          paused,
          resumed,
          crawled,
        ]

    AiConfigDiffEntry:
      type: object
      required: [path, kind]
      description: |
        One leaf of the difference, on the row's column names — `persona.welcome`,
        `procedure.steps[2].target`. A value over 20 KB is `{omitted: too_large,
        sha256, length}`.
      properties:
        path: { type: string }
        kind: { type: string, enum: [added, removed, changed] }
        before: { description: Absent for `added`. }
        after: { description: Absent for `removed`. }

    AiConfigChangeActor:
      type: object
      required: [id, type, role, name]
      properties:
        id:
          type: string
          nullable: true
          description: An account id, or a system job's name when `type` is `system`.
        type: { type: string, enum: [agent, bot, system, platform] }
        role:
          type: string
          nullable: true
          description: The member's role at the moment of the change.
        name: { type: string, nullable: true }

    AiConfigChange:
      type: object
      required:
        [
          id,
          ai_agent_id,
          entity_type,
          entity_id,
          entity_name,
          action,
          actor,
          at,
          version_id,
          draft_revision,
          note,
          fields,
          diff,
        ]
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid, nullable: true }
        entity_type: { $ref: "#/components/schemas/AiConfigEntityType" }
        entity_id: { type: string, format: uuid }
        entity_name:
          type: string
          nullable: true
          description: The entity's name, title or label as it was.
        action: { $ref: "#/components/schemas/AiConfigChangeAction" }
        actor: { $ref: "#/components/schemas/AiConfigChangeActor" }
        at: { type: string, format: date-time }
        version_id: { type: string, format: uuid, nullable: true }
        draft_revision: { type: integer, nullable: true }
        note:
          type: string
          nullable: true
          description: What the save was when it is not an edit (`reindex`, `reorder`).
        fields:
          type: array
          items: { type: string }
          description: The top-level fields the change touches.
        diff:
          type: array
          items: { $ref: "#/components/schemas/AiConfigDiffEntry" }

    AiConfigChangeDetail:
      allOf:
        - $ref: "#/components/schemas/AiConfigChange"
        - type: object
          required: [before, after, request_id]
          properties:
            before:
              type: object
              nullable: true
              additionalProperties: true
              description: The entity before (masked); null for a creation.
            after:
              type: object
              nullable: true
              additionalProperties: true
              description: The entity after (masked); null for a deletion.
            request_id: { type: string, nullable: true }

    AiConfigChangeList:
      type: object
      required: [items, next_cursor, visibility]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AiConfigChange" }
        next_cursor: { type: string, nullable: true }
        visibility:
          type: string
          enum: [all, own]
          description: "`own`: a Team Lead's view — their changes and the publish history."

    AiConfigVersionStatus:
      type: string
      enum: [in_review, approved, published, superseded, rejected]
      description: |
        Submitted and awaiting review; approved and waiting for `scheduled_at`;
        the one the AI answers from; replaced by a later publication; rejected
        (by a reviewer, by a newer submission — `superseded_by_submit` — or
        because another version was published over its base — `stale_base`).

    AiConfigFinding:
      type: object
      required: [code, section, key, message]
      description: One problem that stops a draft from being submitted, or a warning that does not.
      properties:
        code: { type: string }
        section:
          type: string
          nullable: true
          enum: [agent, skills, guidance, guardrails, handoff, knowledge, null]
        key:
          type: string
          nullable: true
          description: The item, as the difference names it (a skill's id, `rule:<id>`, …).
        message: { type: string }
        details:
          type: object
          additionalProperties: true

    AiConfigSectionDiff:
      type: object
      required: [section, added, removed, changed, items]
      properties:
        section: { type: string, enum: [agent, skills, guidance, guardrails, handoff, knowledge] }
        added: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        changed: { type: integer, minimum: 0 }
        items:
          type: array
          maxItems: 200
          description: Ordered by key; the counts are always whole.
          items:
            type: object
            required: [key, kind]
            properties:
              key: { type: string }
              kind: { type: string, enum: [added, removed, changed] }

    AiConfigDiffSummary:
      type: object
      required: [base_version_id, from_baseline, changes, sections, touches_compliance, compliance]
      properties:
        base_version_id:
          type: string
          format: uuid
          nullable: true
          description: The version compared against; null — nothing was published.
        from_baseline:
          type: boolean
          description: The base was the first version recorded before versioning; every item reads as added.
        changes:
          type: integer
          minimum: 0
          description: Items added, removed or changed, all sections together ("Taslak 7 değişiklik").
        sections:
          type: array
          items: { $ref: "#/components/schemas/AiConfigSectionDiff" }
        touches_compliance:
          type: boolean
          description: Only the Founder approves such a version.
        compliance:
          type: array
          items: { type: string, enum: [guardrails, locked_procedure] }

    AiConfigVersion:
      type: object
      required:
        [
          id,
          ai_agent_id,
          number,
          minor,
          label,
          seq,
          status,
          package_format,
          snapshot_hash,
          draft_revision,
          base_version_id,
          rollback_of,
          test_run_id,
          touches_compliance,
          diff_summary,
          knowledge_sources,
          submitted_by,
          submitted_at,
          reviewed_by,
          reviewed_at,
          review_note,
          published_by,
          published_at,
          scheduled_at,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        ai_agent_id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        minor: { type: integer, minimum: 0 }
        label:
          type: string
          description: The name on screen — v12, or v12.1 for a minor version.
        seq:
          type: integer
          nullable: true
          description: The workspace's publication order; null until published.
        status: { $ref: "#/components/schemas/AiConfigVersionStatus" }
        package_format:
          type: integer
          minimum: 0
          description: 0 — the first version recorded before versioning, which holds no package.
        snapshot_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        draft_revision:
          type: integer
          minimum: 0
          description: The draft revision it was compiled from.
        base_version_id: { type: string, format: uuid, nullable: true }
        rollback_of:
          type: string
          format: uuid
          nullable: true
          description: The version a rollback copied.
        test_run_id:
          type: string
          format: uuid
          nullable: true
          description: The pre-publish run whose compliance pack passed for its revision.
        touches_compliance: { type: boolean }
        diff_summary:
          allOf: [{ $ref: "#/components/schemas/AiConfigDiffSummary" }]
          nullable: true
        knowledge_sources:
          type: integer
          minimum: 0
          description: Sources in its knowledge manifest.
        submitted_by: { type: string, format: uuid, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        reviewed_by:
          type: string
          format: uuid
          nullable: true
          description: The reviewer; null when the system rejected it.
        reviewed_at: { type: string, format: date-time, nullable: true }
        review_note:
          type: string
          nullable: true
          description: The reviewer's (or a rollback's) note, or the system's - `superseded_by_submit`, `stale_base`, or a scheduled publication's `approval_lapsed` / `compliance_pack`.
        published_by: { type: string, format: uuid, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AiConfigVersionList:
      type: object
      required: [versions, next_cursor]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/AiConfigVersion" }
        next_cursor: { type: string, nullable: true }

    AiConfigDraft:
      type: object
      required:
        [
          ai_agent_id,
          draft_revision,
          active,
          published,
