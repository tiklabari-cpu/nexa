openapi: 3.1.0

info:
  title: Nexa Platform API
  version: 1.0.0
  description: |
    Nexa live support + AI customer service platform.

    **Resource-based REST** (ADR-04). Actions that are not plain CRUD live as a
    POST sub-path under the resource they act on — `POST /chats/{chatId}/transfer`,
    not `POST /action/transfer_chat`.

    **Errors** always use the envelope `{ error: { type, message, request_id } }`.
    The `type` field is the machine-readable category; the HTTP status is derived
    from it and the two never disagree.

    **Auth** is OAuth 2.1 (authorization code + PKCE) for agents, Personal Access
    Tokens for server-to-server, and a short-lived customer token for the widget.
    Every route additionally declares the scopes it requires.

    **Region** (NFR-C4). A workspace names the region it lives in when it is
    created and can never move afterwards, so each deployment answers only for
    the workspaces kept in its own region. *Any* authenticated route may
    therefore return `421 misdirected_request`, whatever else it documents: the
    credential is genuine and no permission is missing — the request arrived at
    the wrong address. `error.details.region` names the region that does hold
    the workspace, which is the one to retry against. This is not listed per
    operation, because it is decided before routing and applies to all of them.

    One *anonymous* route answers the same way and is documented on its own:
    `POST /auth/signup` creates the workspace, so it decides residency before
    there is a credential to decide it from, and it refuses a region this
    deployment does not serve **before writing anything** (C4-h). It is the
    single exception to "authenticated", and the only place `error.details`
    also carries `served_region`.

    Send `X-Region: <eu|us>` to state which region you believe you are talking
    to; a value that is not the caller's own workspace region is refused the
    same way, so a client working from a stale address finds out at once rather
    than after its data has been served from the wrong place. The realtime
    gateway enforces the identical rule on `login` and answers with the same
    `misdirected_request` type and `details.region`.

    **HIPAA scope** (NFR-C4). A workspace that has accepted the Business
    Associate Agreement takes on constraints rather than gaining permissions,
    and one of them is visible through this API: any operation that runs model
    inference over workspace content — the Copilot assists and BI question, the
    command palette query, skill compile/preview, and indexing a knowledge
    source — returns `403 not_allowed` when the deployment's model provider sits
    outside the workspace's region. `error.details` names both regions. This is
    a property of the deployment, not of the request, so it is not listed per
    operation; a workspace with no signed agreement is unaffected, and the
    in-chat AI agent simply does not answer, leaving the conversation for a
    human. Retention windows are capped for such a workspace as well, which no
    endpoint exposes yet.

servers:
  - url: http://localhost:4000/api/v1
    description: Local development
  - url: https://api.nexa.example/api/v1
    description: Production (eu region; the us deployment serves us workspaces)

tags:
  - name: System
    description: Health and metadata.
  - name: Auth
    description: OAuth 2.1, personal access tokens, customer tokens.
  - name: Chats
    description: Conversations — chat → thread → event.
  - name: Customer
    description: The widget-facing surface. Customer token only.
  - name: Customers
    description: CRM — people who have contacted the workspace.
  - name: Tickets
    description: Asynchronous follow-up work — the other half of "total cases".
  - name: Configuration
    description: Groups, agents, tags, canned responses, routing, channels.
  - name: Apps
    description: Marketplace of third-party integrations, connected through a (mock) OAuth flow.
  - name: Playbook
    description: AI agents, skills and the knowledge they answer from.
  - name: Knowledge Base
    description: The reader-facing "SEO'lu self-servis" public KB — articles, categories, publish state.
  - name: Copilot
    description: Agent-assist — a separate knowledge base and in-chat help (summary, reply draft, rewrite).
  - name: Command Palette
    description: ⌘K palette — the account/team-wide natural-language query result type.
  - name: Settings
    description: Workspace configuration — trusted domains, saved replies, routing.
  - name: Onboarding
    description: First-run setup wizard for a freshly signed-up workspace.
  - name: Reports
    description: Aggregate analytics.
  - name: Billing
    description: Subscription, usage metering, trial.
  - name: Webhooks
    description: Outbound webhooks — signed, SSRF-guarded event delivery.
  - name: Partner
    description: Build-your-own-app — self-service registration of OAuth 2.1 clients.
  - name: Mcp
    description: MCP server — tool catalogue an AI client discovers and calls.
  - name: Audit
    description: The security trail — who did what, read-only, Owner/Admin only.
  - name: Notifications
    description: Where a person is reachable — registered handsets for push delivery.

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness and dependency check
      description: |
        Reports the process plus each backing store. Returns 200 only when every
        dependency is reachable, so it is safe to use as a readiness probe.
      security: []
      responses:
        "200":
          description: All dependencies reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: At least one dependency is unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

