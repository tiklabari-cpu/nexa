# Configuration — agents, availability and teams.
#
# Availability is not a cosmetic flag. Going `accepting_chats` is one of only two
# moments capacity appears (the other being a chat closing), so the routing queue
# drains on this call. That is why it returns what it assigned rather than 204.

routingStatus:
  put:
    tags: [Configuration]
    operationId: setMyRoutingStatus
    summary: Set the caller's availability
    description: |
      Switching to `accepting_chats` drains the queue: any waiting conversation
      the caller can now take is assigned before the response returns, and the
      chat ids appear in `assigned_from_queue`.

      Without that, an agent who comes online to an empty screen sits idle while
      customers wait for the next arrival to trigger assignment.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [routing_status]
            properties:
              routing_status:
                type: string
                enum: [accepting_chats, not_accepting_chats, offline]
    responses:
      "200":
        description: Availability updated
        content:
          application/json:
            schema:
              type: object
              required: [routing_status, assigned_from_queue]
              properties:
                routing_status:
                  type: string
                  enum: [accepting_chats, not_accepting_chats, offline]
                assigned_from_queue:
                  type: array
                  description: |
                    Chats taken off the queue and assigned to the caller as a
                    direct result of this call. Empty for any status other than
                    `accepting_chats`.
                  items: { type: string }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

notificationPreferences:
  get:
    tags: [Configuration]
    operationId: getMyNotificationPreferences
    summary: Read the caller's notification channel preferences
    description: |
      The same object `PUT` returns and `/auth/me` ships with the profile. Worth
      having on its own for a client that wants to re-read the current state
      without re-fetching a profile — a settings screen opened in a second tab,
      or the mobile app checking what it may deliver.
    responses:
      "200":
        description: The caller's preferences
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/NotificationPreferences" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  put:
    tags: [Configuration]
    operationId: setMyNotificationPreferences
    summary: Set the caller's notification channel preferences
    description: |
      Every channel the product can reach a person through, in one place
      (FR-MOD-13.8).

      Sound, desktop and the tab badge used to live in one `localStorage` key per
      browser, which was reasonable while everything they governed was also
      per-browser — a speaker, an OS permission. Push (FR-MOD-13.7) broke that:
      the *server* chooses the delivery target, so a preference the server cannot
      read does not apply to the one channel that reaches somebody who has closed
      their laptop. All five now live on the account.

      **`enabled` is a master switch over the interruptive channels — sound,
      desktop and push — and not over `email`.** Those three announce something
      now; e-mail is the fallback for a person who is not there at all, and
      asking not to be interrupted has never been a request to stop the fallback
      as well.

      The preference is per user and per license, so the same person can stay
      reachable on one workspace and go quiet on another (FR-MOD-08.2).

      The body is a partial update: send only the channels that changed. At least
      one is required — an empty body would be a `GET` wearing the wrong verb —
      and an unrecognised key is a `400` rather than a silently dropped toggle,
      which is the failure mode where the switch on screen says "off" while the
      server goes on interrupting. The response is always the complete set, so a
      client that toggled one channel also learns of any change it had not seen.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
              enabled:
                type: boolean
                description: Master switch over sound, desktop and push.
              sound:
                type: boolean
                description: A chime in the console when a visitor writes in.
              desktop:
                type: boolean
                description: An OS notification from the console — still gated on browser permission.
              push:
                type: boolean
                description: A push notification to your registered handsets.
              email:
                type: boolean
                description: An e-mail when a chat assigned to you has new activity.
    responses:
      "200":
        description: Preferences updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/NotificationPreferences" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

agents:
  get:
    tags: [Configuration]
    operationId: listAgents
    summary: List agents on the license
    description: |
      Defaults to the active roster: suspended agents are omitted, because they
      cannot be assigned work and offering them in an assignee picker only
      produces a failed transfer.

      Pass `status=suspended` for the Suspended tab (FR-MOD-04.6), or
      `status=all` to see everyone regardless of state. Each item carries a
      `suspended` flag so a combined list can be split client-side.
    parameters:
      - name: status
        in: query
        required: false
        description: Which slice of the roster to return.
        schema:
          type: string
          enum: [active, suspended, all]
          default: active
    responses:
      "200":
        description: Agents on the license
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/Agent" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

agentSuspension:
  parameters:
    - name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  put:
    tags: [Configuration]
    operationId: setAgentSuspension
    summary: Suspend or reinstate an agent
    description: |
      Suspending an agent takes effect immediately on their existing sessions
      (FR-MOD-04.6): the change lives on the membership, not the token, so the
      next request any of their tokens makes is rejected, and routing stops
      assigning them work from that moment. Reinstating (`suspended: false`) is
      the exact reverse — nothing is deleted in between, so their teams,
      capacity and history are all still there.

      A suspended agent frees the seat they held: billing counts only
      non-suspended agents, so this is also how a workspace stops paying for
      someone who has left. Bots are not agents and never occupy a seat.

      Admin or owner only (both the scope and the role are checked). The owner
      cannot be suspended, and an admin cannot suspend themselves — either would
      be a way to lock the workspace's last key inside it.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [suspended]
            properties:
              suspended:
                type: boolean
                description: True to suspend, false to reinstate.
    responses:
      "200":
        description: The agent, with its new suspension state.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Agent" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

agentRole:
  parameters:
    - name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  put:
    tags: [Configuration]
    operationId: setAgentRole
    summary: Change a teammate's role
    description: |
      Moves a teammate between roles (NFR-S12 — the "rol değişimi" the audit
      requirement names by hand). Admin or owner only: both the scope and the
      role are checked, and the change is bounded by a privilege ceiling so it
      can never grant more power than the caller holds.

      An admin or owner may only assign a role at or below their own rank, and
      may only change a teammate whose current role is at or below theirs — an
      admin cannot promote anyone to owner, nor touch a vice-owner. The owner's
      own role is immutable here, and no one may change their own role: both
      would be a way to seize or surrender the workspace. Ownership transfer is
      a separate, heavier operation and is refused (`403`) by this endpoint.

      A change to the role the teammate already holds is a no-op: it returns the
      unchanged agent and writes nothing to the audit log. A real change writes
      exactly one `member.role_changed` entry recording only the `from`/`to`
      roles.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [role]
            properties:
              role:
                type: string
                enum: [owner, viceowner, admin, agent]
                description: |
                  The role to assign. `owner` is accepted by the schema but
                  always refused (ownership transfer is out of scope here), and
                  any role above the caller's own rank is refused — both as
                  `403`, not `400`.
    responses:
      "200":
        description: The agent, with its new role.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Agent" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

agentExpertise:
  parameters:
    - name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  put:
    tags: [Configuration]
    operationId: setAgentExpertise
    summary: Set an agent's expertise areas
    description: |
      Replaces the agent's expertise set wholesale (FR-MOD-08.6.3 — skill-based
      routing). The body is the *complete* list, so sending the same body twice
      leaves the same result (idempotent) and an empty list clears every area.

      Every id must name an expertise area on the caller's licence; an unknown or
      cross-tenant id is a `404` that keeps ids un-enumerable across tenants
      (NFR-S5). Admin or owner only — both the scope and the role are checked.

      The response is the agent with its updated `expertise`, the same shape
      `GET /agents` returns.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [expertise_ids]
            properties:
              expertise_ids:
                type: array
                description: The complete set of expertise-area ids to assign.
                items: { type: integer, format: int64 }
    responses:
      "200":
        description: The agent, with its updated expertise.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Agent" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

workSchedule:
  # Wired into the root `paths:` map by WORKSCHED-c, in the same change that
  # landed the two handlers in `routes/agents.ts` — an operation documented
  # with no matching Fastify route fails contract-parity.test.ts ("documented
  # but not served"), which is why WORKSCHED-a froze the shape here without
  # connecting it.
  parameters:
    - name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Configuration]
    operationId: getAgentWorkSchedule
    summary: Get an agent's weekly work schedule
    description: |
      The agent's declared availability (PRD §5.3-Vardiya): a timezone plus one
      start/end/enabled slot per weekday. Distinct from `routing_status`
      (`PUT /agents/me/routing-status`), which is the agent's live toggle —
      this is the standing plan the staffing forecast reads to predict
      coverage gaps.
    responses:
      "200":
        description: The agent's work schedule.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WorkSchedule" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  put:
    tags: [Configuration]
    operationId: setAgentWorkSchedule
    summary: Replace an agent's weekly work schedule
    description: |
      Replaces the schedule wholesale — the body is the complete week, the same
      replace-not-patch shape `setAgentExpertise` uses. An invalid `HH:MM`, a
      start not before its end, an unknown weekday name or the same day listed
      twice is a `400`: `@nexa/types` `normalizeWorkSchedule` is the single
      gate this route and the settings form both validate against, so the two
      can never disagree about what a valid schedule looks like.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/WorkSchedule" }
    responses:
      "200":
        description: The agent's work schedule, as stored.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WorkSchedule" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

groups:
  get:
    tags: [Configuration]
    operationId: listGroups
    summary: List teams and their members
    description: |
      Teams are the unit of chat visibility: an agent sees a conversation because
      a team they belong to has access to it. Membership carries the priority
      that routing uses to pick between available agents (ADR-08).
    responses:
      "200":
        description: Teams on the license
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/Group" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  post:
    tags: [Configuration]
    operationId: createGroup
    summary: Create a team
    description: |
      Routing resolves an agent through team membership (ADR-08 step 2), so a
      workspace with no team cannot route a conversation to anyone. Signup seeds
      a `General` team with the owner in it; this is how the rest are made.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/GroupWrite" }
    responses:
      "201":
        description: The team, as created
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Group" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

group:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/GroupIdPath"
  patch:
    tags: [Configuration]
    operationId: updateGroup
    summary: Rename a team or change its language
    description: |
      Send the field that changed; at least one is required. An empty body is a
      400 rather than a no-op, so a client cannot believe it saved something.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../openapi.yaml#/components/schemas/GroupWrite"
            required: []
            minProperties: 1
    responses:
      "200":
        description: The team, as updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Group" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  delete:
    tags: [Configuration]
    operationId: deleteGroup
    summary: Delete a team
    description: |
      Refused (409 `group_in_use`) while a routing rule targets the team, or
      while any conversation reachable only through it is still open. Neither
      reference carries a foreign key, so this refusal — not the database — is
      what stops a delete from stranding them. Memberships are removed with the
      team.
    responses:
      "204": { description: Deleted }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

groupMember:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/GroupIdPath"
    - $ref: "../openapi.yaml#/components/parameters/AgentIdPath"
  put:
    tags: [Configuration]
    operationId: setGroupMember
    summary: Add an agent to a team, or change their priority
    description: |
      Idempotent: the same call adds the member and later moves their tier. The
      priority is what routing picks between available agents with (ADR-08) —
      `primary` is the PRD's "Primary agent" tier.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              priority:
                type: string
                enum: [primary, first, normal, last]
                default: normal
    responses:
      "200":
        description: The team, with the membership applied
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Group" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  delete:
    tags: [Configuration]
    operationId: removeGroupMember
    summary: Remove an agent from a team
    responses:
      "204": { description: Removed }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
