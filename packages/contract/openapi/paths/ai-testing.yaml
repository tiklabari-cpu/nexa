# The AI test bench (tm 314 · SiyahTuş analysis AI-19).
#
# A workspace writes scenarios — scripted player messages, or a persona a
# model plays — with what must come out of them, and plays them against the
# draft, the published configuration or a named version. The engine is the
# live one (`runTurn`, side-effect free): a run writes no chat, thread,
# event, customer, rating, usage counter or webhook, only its own results,
# and its tokens are counted on the test meter (`llm_test`, AI-19-S2), never
# the live allowance. Hard checks decide each scenario's verdict; the judge
# only advises (AI-19-S3). The platform's locked compliance pack joins every
# pre-publish run (AI-19-S1). "Talk like a player" is a sandbox session on
# the same turn, with each reply's decision trace.
#
# ---------------------------------------------------------------------------
# Served by `apps/api/src/routes/ai-testing.ts` (tm 314.2); the judge's advice
# (`judge`) and the regression against the previous published version's last
# run (`regression`, `compared_run_id`) since tm 314.3; the compliance pack on
# a pre-publish run (`trigger: pre_publish`, `compliance`) and its gate
# (`/ai/compliance-pack`) since tm 314.4. Still to come: named versions
# (`target: version`, tm 316 — until then no version is found, 404). The component schemas (`AiTestScenario`,
# `AiTestRun`, …) are in `openapi.yaml`; `@siyahtus/types` `ai-testing.ts`
# holds the same lists and bounds.
# ---------------------------------------------------------------------------

testScenarios:
  get:
    tags: [Playbook]
    operationId: listAiTestScenarios
    summary: An AI agent's test scenarios
    description: Every brand's, newest first. The platform's compliance pack is not listed — it is code.
    parameters:
      - name: ai_agent_id
        in: query
        required: true
        schema: { type: string, format: uuid }
      - name: active
        in: query
        schema: { type: boolean }
    responses:
      "200":
        description: The scenarios
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiTestScenarioList" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Playbook]
    operationId: createAiTestScenario
    summary: Write a test scenario
    description: |
      `origin` is `manual`. A refused field answers `validation` with
      `details.problems` (`{ field, code }`, `validateAiTestScenario`).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/AiTestScenarioInput" }
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiTestScenario" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

testScenario:
  parameters:
    - name: scenarioId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Playbook]
    operationId: getAiTestScenario
    summary: One test scenario
    responses:
      "200":
        description: The scenario
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiTestScenario" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  patch:
    tags: [Playbook]
    operationId: updateAiTestScenario
    summary: Change a test scenario
    description: The change is merged over the scenario and the result validated whole.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/AiTestScenarioPatch" }
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiTestScenario" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  delete:
    tags: [Playbook]
    operationId: deleteAiTestScenario
    summary: Delete a test scenario
    description: Earlier results keep its key and name; the regression still pairs them.
    responses:
      "204": { description: Deleted }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

testRuns:
  get:
    tags: [Playbook]
    operationId: listAiTestRuns
    summary: An AI agent's run history
    description: Newest first.
    parameters:
      - name: ai_agent_id
        in: query
        required: true
        schema: { type: string, format: uuid }
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200":
        description: The runs
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiTestRunList" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Playbook]
    operationId: createAiTestRun
    summary: Play scenarios against a configuration
    description: |
      Queues the run and answers at once (`status: queued`); it is played in
      the background, two scenarios of the workspace at a time, each within
      60 s, at most 200 per run. A manual run with no scenario to play is
      `validation`. A pre-publish run (`trigger: pre_publish`) plays the
      draft: the platform's locked compliance pack first — its version and
      share of the counts on the run (`compliance`) — then every active
      scenario; it takes no `scenario_ids` and no other target. The test
      allowance spent answers 429 `ai_daily_cap` with `details.meter:
      llm_test`; the live allowance is never touched.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/AiTestRunCreate" }
    responses:
      "202":
        description: Queued
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiTestRun" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }

testRun:
  parameters:
    - name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Playbook]
    operationId: getAiTestRun
    summary: One run and its counts
    responses:
      "200":
        description: The run
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiTestRun" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

testRunResults:
  parameters:
    - name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Playbook]
    operationId: listAiTestRunResults
    summary: A run's results, regressions first
    description: |
      Each scenario's verdict, transcript with the decision trace of every AI
      turn, hard checks and the judge's advice, compared with the same
      scenario in the previous published version's last run.
    responses:
      "200":
        description: The results
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiTestRunResultList" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

compliancePack:
  get:
    tags: [Playbook]
    operationId: getAiCompliancePack
    summary: The locked compliance pack and the publish gate it sets
    description: |
      The platform's compliance pack (AI-19-S1: G1, G2, G3, G5, G7, G11 and
      G16, in Turkish and English) — code, so no scenario route edits or
      deletes it — and what the agent's latest pre-publish run of the draft
      says of publishing: open only when that run completed under the
      current pack version with every pack scenario passed. The workspace's
      own failures are counted beside it.
    parameters:
      - name: ai_agent_id
        in: query
        required: true
        schema: { type: string, format: uuid }
    responses:
      "200":
        description: The pack and the gate
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiCompliancePack" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

sandboxSessions:
  post:
    tags: [Playbook]
    operationId: createAiSandboxSession
    summary: Start talking to the AI like a player
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/AiSandboxSessionCreate" }
    responses:
      "201":
        description: Started
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiSandboxSession" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

sandboxSession:
  parameters:
    - name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Playbook]
    operationId: getAiSandboxSession
    summary: A sandbox session, to pick it up again
    description: Its starter's only; an expired session is 404.
    responses:
      "200":
        description: The session
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiSandboxSession" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

sandboxSessionTurns:
  parameters:
    - name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  post:
    tags: [Playbook]
    operationId: createAiSandboxTurn
    summary: Say something as the player
    description: |
      One turn of the live engine on the session's configuration. The reply
      comes with its decision trace — the procedure and why, what was
      collected, the knowledge used, guardrails, hand-over, flags, tokens —
      and pushes `expires_at` 24 hours on. Counted on the test meter. A
      session takes at most 100 messages; the next is `validation`
      (`details.problems`: `message` `too_many`) — start another session.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/AiSandboxTurnRequest" }
    responses:
      "200":
        description: The AI's turn
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiSandboxTurnResponse" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }
      "503": { $ref: "../openapi.yaml#/components/responses/LlmUnavailable" }

sandboxSessionSaveAsScenario:
  parameters:
    - name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  post:
    tags: [Playbook]
    operationId: saveAiSandboxSessionAsScenario
    summary: Keep the session as a scripted scenario
    description: |
      The player's messages become the script (`origin: from_chat`,
      `origin_ref`: the session); the expectations are suggested from the
      session's last state unless the body gives them. A session with no
      player message is `validation`.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/AiSandboxSaveAsScenario" }
    responses:
      "201":
        description: Saved
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiTestScenario" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
