conversations:
  get:
    tags: [Archive]
    operationId: listArchiveConversations
    summary: List past conversations, one row per connection
    description: |
      The archive screen's list (AR-01). A row is one **connection** — panel
      "Chat ID", `thread_id` — not a day: a player who wrote three times is
      three rows, each with its own tags, assignee and rating. `chat_id` is the
      day the connection belongs to (panel "Thread ID"); a reopened
      conversation is a new connection and leaves the earlier one here as it
      was.

      Closed connections by default, the most recently ended first
      (`status=closed`). `status=all` puts the connections still open first,
      then the closed ones; `status=open` lists only those.

      What the caller may see is part of the query, not a filter applied to a
      page afterwards: a Team Member and a Team Lead see the conversations of
      their teams and the ones they took part in, a Manager and the Founder
      every one (RL-02). A connection past the workspace's retention window is
      not listed — the sweep deletes it — and a member who was erased has no
      rows at all.

      Not live: no push keeps the list current, and nothing here writes.
      Searching by number or by message text is `GET /search` and
      `GET /chats?query=`; their results carry the `thread_id` that is a row
      here.

      **Filters (AR-02).** Different filters combine with AND, the values of
      one filter with OR (`agent_id=a&agent_id=b` is "a or b"); tags combine
      as `tag_mode` says. `total` counts the filtered list. Every filter
      carries ids, never a name or an e-mail address, so a filtered address
      can be shared without carrying anyone's personal data. Filters that
      cannot both hold (`untagged` with `tag_mode=any`, `handled_by=ai` with
      an agent) are applied as asked and give an empty list; the screen warns.
    parameters:
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [closed, open, all], default: closed }
      - name: customer_id
        in: query
        required: false
        description: One member's connections — the player card's "All".
        schema: { type: string, format: uuid }
      - name: date_from
        in: query
        required: false
        description: |
          The first conversation day, `YYYY-MM-DD`, on the workspace's own
          calendar — the zone and start hour of its conversation day (ID-04),
          not UTC. A connection is in the range by when it **started**
          (AR-02-S1): at or after the first instant of `date_from`, before the
          first instant of the day after `date_to`. Either end may be left
          open. Not together with `from`/`to` (400 `reason: date_mixed`); a
          `date_to` before `date_from` is 400 `reason: range_order`.
        schema: { type: string, format: date }
      - name: date_to
        in: query
        required: false
        description: The last conversation day, `YYYY-MM-DD`, included. See `date_from`.
        schema: { type: string, format: date }
      - name: from
        in: query
        required: false
        description: |
          Connections that started at or after this instant — the exact-time
          form of `date_from`, for a range that is not whole days.
        schema: { type: string, format: date-time }
      - name: to
        in: query
        required: false
        description: Connections that started before this instant (excluded).
        schema: { type: string, format: date-time }
      - name: agent_id
        in: query
        required: false
        description: |
          Connections one of these agents wrote in to the player — internal
          notes do not count — repeated once per agent. Recorded as the
          connection closes (`threads.agent_ids`); an open one is read live.
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
      - name: group_id
        in: query
        required: false
        description: |
          Connections of these teams — the team a connection went to, and for
          one opened before that was recorded, the teams its day was given:
          the same teams the row's `group_ids` lists.
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: integer, format: int64 }
      - name: rating
        in: query
        required: false
        description: |
          The connection's **newest** rating — the one the row shows. `any`:
          rated; `not_rated`: never rated; `commented`: a rating with a
          comment, either value.
        schema:
          type: string
          enum: [any, not_rated, good, bad, commented, good_commented, bad_commented]
      - name: tag
        in: query
        required: false
        description: Tags, repeated once per tag, at most 20. How they combine is `tag_mode`.
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }
      - name: tag_mode
        in: query
        required: false
        description: |
          `any` — at least one of the tags; `all` — every one of them;
          `exclude` — none of them (an untagged connection is kept).
        schema: { type: string, enum: [any, all, exclude], default: any }
      - name: untagged
        in: query
        required: false
        description: "`true`: only connections with no tag at all."
        schema: { type: boolean }
      - name: handled_by
        in: query
        required: false
        description: |
          Who answered it (`ArchiveConversation.handled_by`). `ai` is "AI
          solved": the invoice's AI resolution (ADR-09a), so its count over a
          range is the AI report's `resolutions` for the same range.
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, enum: [ai, human, mixed] }
      - name: risk_flag
        in: query
        required: false
        description: Connections where one of these risk flags was raised, cleared ones included (AI-27).
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "../openapi.yaml#/components/schemas/RiskFlagType" }
      - name: channel
        in: query
        required: false
        description: |
          Connections of the days that arrived over one messaging channel — the
          inbox's definition (`GET /chats?channel=`): the channel of the day's
          oldest inbound adapter message.
        schema: { $ref: "../openapi.yaml#/components/schemas/ChannelType" }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      - $ref: "../openapi.yaml#/components/parameters/PageId"
    responses:
      "200":
        description: |
          One page. `total` counts the whole list up to 1 000; past that
          `total_capped` is true and the count stops there.
        content:
          application/json:
            schema:
              type: object
              required: [items, total, total_capped]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/ArchiveConversation" }
                total: { type: integer, minimum: 0, maximum: 1000 }
                total_capped: { type: boolean }
                next_page_id: { type: string }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

conversation:
  get:
    tags: [Archive]
    operationId: getArchiveConversation
    summary: One past connection
    description: |
      The archive's detail for one connection: its row, the rating with its
      comment, and its summary. The tags, the assignee and the rating are
      this connection's — never the day's newest connection's. The transcript
      is `GET /chats/{chat_id}/events?thread_id=`.

      A connection the caller may not see, of another workspace, or erased is
      a 404. So is one past the workspace's retention window, with
      `error.details.reason: retention_expired` — its transcript is deleted
      or about to be.
    parameters:
      - name: threadId
        in: path
        required: true
        description: "The connection. Panelde: Chat ID."
        schema: { type: string, minLength: 10, maxLength: 12 }
    responses:
      "200":
        description: The connection.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ArchiveConversationDetail" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
