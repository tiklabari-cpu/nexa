# Audit log — the security trail (NFR-S12).
#
# The `audit_log` table has had a single writer since slice 23 (every
# security-relevant action funnels through `writeAuditEntry`); this is its first
# reader. The trail records who did what — logins, role changes, data deletion,
# webhook and security changes — and the PRD keeps "temel audit … son 30 gün"
# in every plan. The read surface itself, though, is derived, not stated: the KK
# says the log is *kept*, not who may read it. It is gated to Owner/Admin
# (v2-04 §RBAC: Audit log → Owner ✓, Admin ✓) and, like every tenant surface,
# scoped by RLS so a workspace only ever sees its own entries (NFR-S5).
#
# Read-only and append-only: there is no write, edit or delete here — an actor
# who could rewrite the log could erase the evidence of what they did.

auditLog:
  get:
    tags: [Audit]
    operationId: listAuditLog
    summary: List audit log entries
    description: |
      The workspace's security trail, newest first. Owner/Admin only, and each
      workspace sees only its own entries (RLS) — a cross-tenant entry is never
      returned, by id or otherwise.

      Defaults to the last 30 days, the window the PRD keeps in every plan.
      `action`, `actor_id`, `date_from` and `date_to` narrow the same list,
      additively — combine them freely. `date_from`/`date_to` replace the
      30-day default when given; omitting one leaves that side open. Paginated
      by opaque keyset cursor rather than offset: entries arrive constantly and
      an offset page would shift under the reader and silently skip rows.
      `limit` above the maximum is clamped, not rejected.
    parameters:
      - name: action
        in: query
        description: |
          One action from the closed audit vocabulary (e.g. `auth.login`,
          `member.suspended`). An unrecognised value is a 400, not an empty
          list. Uses the `(license_id, action, created_at DESC)` index.
        schema: { type: string }
      - name: actor_id
        in: query
        description: The acting account/bot id, exact match.
        schema: { type: string, format: uuid }
      - name: date_from
        in: query
        description: Replaces the 30-day default lower bound when given.
        schema: { type: string, format: date-time }
      - name: date_to
        in: query
        description: Open-ended (now) when omitted.
        schema: { type: string, format: date-time }
      - $ref: "../openapi.yaml#/components/parameters/PageId"
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200":
        description: A page of audit log entries, newest first.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/AuditLogEntry" }
                next_page_id:
                  type: string
                  description: Opaque cursor for the next page; absent on the last.
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

# The SIEM feed (NFR-C6 · C6-b).
#
# The same trail as the list above, read the other way round and for a different
# reader. SOC 2 CC7.2 and ISO 27001 A.8.15 are not satisfied by a log that only
# exists inside the system it audits: the first thing an attacker with access
# does is stop producing evidence somewhere the defender can still read it. So
# the trail has to be able to leave, continuously, into somewhere else.
#
# Gated on `audit_log--export:ro`, which `audit_log--all:ro` does not imply.
# Paging through a log on a screen and streaming all of it into a third-party
# system are different authorities, and an integration granted the first should
# not acquire the second by implication.

auditLogExport:
  get:
    tags: [Audit]
    operationId: exportAuditLog
    summary: Stream audit log entries to a SIEM
    description: |
      The workspace's security trail as NDJSON — one complete JSON object per
      line, oldest first — for continuous export to a SIEM. Owner/Admin only,
      and RLS confines it to the caller's own workspace like every other tenant
      surface.

      **Resuming.** Every response carries `x-nexa-export-cursor`: the position
      after the last record it contained, or the position you passed in when the
      page was empty. Store it and pass it back as `page_id` to continue.
      `x-nexa-export-has-more` says whether more entries are already waiting, so
      a consumer knows whether to poll again immediately or wait for its next
      tick.

      **Redelivery, never gaps.** Replaying a cursor returns the same records
      again — the position is exclusive and the order is total, so a consumer
      that crashed before committing its cursor loses nothing by starting over.
      Duplicates in a SIEM are noise; a gap is a missing security event that
      nothing downstream can tell apart from a quiet period. Everything here
      trades the first away to prevent the second.

      **A short delay is deliberate.** An entry becomes exportable a few seconds
      after it is written, not instantly. An entry's timestamp is fixed when its
      transaction *starts*, so reading right up to the present would step over
      entries written by transactions still in flight — permanently, since the
      cursor only moves forward.

      **No filters.** Unlike the list endpoint there is no `action`, `actor_id`
      or date range. A filtered export is a selective record of what happened,
      and the point of the copy in the SIEM is that it is complete.
    parameters:
      - name: page_id
        in: query
        description: >-
          Resume after this position — the `x-nexa-export-cursor` value from a
          previous export. Omit to start from the beginning of the retained
          trail. A cursor this endpoint cannot read is a 400, not a silent
          restart: both silent answers (re-sending everything, skipping
          everything) are wrong and invisible to the consumer. Cursors from the
          list endpoint are rejected here — they run the other way.
        schema: { type: string, maxLength: 512 }
      - name: limit
        in: query
        description: >-
          Records per response. Defaults to 1000, maximum 5000; above the
          maximum is clamped, not rejected.
        schema: { type: integer, minimum: 1 }
    responses:
      "200":
        description: |
          A page of entries as NDJSON, oldest first. Empty body when the feed
          has caught up — the cursor header is still present and still valid.
        headers:
          x-nexa-export-cursor:
            description: >-
              Opaque position to resume from. Empty only when the workspace's
              trail is empty and no cursor was supplied.
            schema: { type: string }
          x-nexa-export-count:
            description: Records in this response.
            schema: { type: integer }
          x-nexa-export-has-more:
            description: >-
              `true` when more entries are already exportable — poll again
              rather than waiting.
            schema: { type: string, enum: ["true", "false"] }
        content:
          application/x-ndjson:
            schema:
              type: string
              description: >-
                Newline-delimited `AuditLogExportRecord` objects, one per line,
                every line terminated — so pages concatenate into a valid file.
            example: |
              {"id":"6f1c…","license_id":"1","action":"auth.login","actor_id":"a1…","actor_type":"agent","target":null,"metadata":{},"ip":null,"created_at":"2026-08-15T09:00:00.000Z"}
              {"id":"7a2d…","license_id":"1","action":"member.role_changed","actor_id":"a1…","actor_type":"agent","target":"account:b2…","metadata":{"from":"agent","to":"admin"},"ip":null,"created_at":"2026-08-15T09:01:00.000Z"}
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
