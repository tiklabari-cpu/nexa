# Authentication surface — OAuth 2.1 + PKCE, personal access tokens, customer tokens.
#
# The authorization step is a JSON POST rather than the classic browser redirect
# because Nexa's agent app is a first-party client: there is no third party to
# show a consent screen to, and a redirect round-trip would add a full page load
# to every sign-in. The security-relevant parts of the flow are unchanged —
# single-use codes, mandatory S256 PKCE, exact redirect matching, rotation.

login:
  post:
    tags: [Auth]
    operationId: login
    summary: Verify credentials and list available workspaces
    description: |
      Returns the licenses this account may sign in to. Issues no tokens — the
      caller picks a workspace and continues with `/auth/authorize`.

      Responds identically whether the email is unknown or the password is
      wrong, and always spends the same time, so registered addresses cannot be
      enumerated.

      A workspace that requires single sign-on (NFR-S11) still appears in the
      list, annotated rather than hidden: `password_login_available` is false and
      `sso_enforced_connection_id` names the connection to continue with.
      Removing it would read to the person as "you have been removed" and leave
      them nothing to click. Enforcement itself is applied by `/auth/authorize`,
      which is where a credential becomes a session — this call selects no
      workspace and is not a gate.

      Two-factor authentication is annotated the same way (NFR-S11 ·
      FR-MOD-00.1): `account.two_factor_enabled` says a code will be demanded at
      `/auth/authorize`, and `memberships[].two_factor_required` says which
      workspaces insist their members hold a factor at all. Read together they
      tell the sign-in screen which of three things to do — go straight through,
      ask for a code, or send the person to set one up.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email, maxLength: 320 }
              password: { type: string, minLength: 1, maxLength: 512 }
    responses:
      "200":
        description: Credentials accepted
        content:
          application/json:
            schema:
              type: object
              required: [account, memberships]
              properties:
                account:
                  type: object
                  required: [id, email, name]
                  properties:
                    id: { type: string, format: uuid }
                    email: { type: string }
                    name: { type: string }
                    two_factor_enabled:
                      type: boolean
                      description: >-
                        Whether this account holds an active second factor, so
                        `/auth/authorize` will require `code`. An account fact,
                        not a workspace one — one authenticator covers every
                        membership — which is why it sits here rather than being
                        repeated down the list. No disclosure: the caller has
                        just proved this account's password, and the next call
                        would say so anyway.
                memberships:
                  type: array
                  items:
                    type: object
                    required: [license_id, organization_id, organization_name, role]
                    properties:
                      license_id: { type: string }
                      organization_id: { type: string, format: uuid }
                      organization_name: { type: string }
                      role: { type: string, enum: [owner, viceowner, admin, agent] }
                      license_status: { type: string }
                      client_id: { type: string, nullable: true }
                      sso_enforced_connection_id:
                        type: string
                        format: uuid
                        nullable: true
                        description: >-
                          The SAML connection that has closed this workspace's
                          password door, or null while passwords still work.
                          Present so the sign-in screen can offer the right door;
                          the caller has already proved this account's password
                          and this membership.
                      two_factor_required:
                        type: boolean
                        description: >-
                          Whether this workspace requires its members to hold a
                          second factor (`security_settings.require_two_factor`).
                          The policy alone: combined with a false
                          `account.two_factor_enabled` it means the sign-in will
                          be refused until the person enrolls, which is a
                          different screen from "type your code".
                      password_login_available:
                        type: boolean
                        description: >-
                          Whether `/auth/authorize` will accept a password for
                          this workspace. False for a member of an SSO-enforced
                          license; true for its owners, who keep a break-glass
                          door so a broken identity provider is not terminal.
                          Server-derived so the rule has one home.
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

authorize:
  post:
    tags: [Auth]
    operationId: authorize
    summary: Issue a single-use authorization code
    description: |
      Verifies the password against the named workspace and returns a single-use
      code the caller redeems at `/auth/token`.

      This is where single sign-on enforcement bites (NFR-S11): a correct
      password against a workspace that requires SSO is refused with
      `not_allowed`, carrying `details.sso_connection_id` so the client can send
      the person to their identity provider instead. Owners are exempt — the
      break-glass door that keeps a broken identity provider from locking a
      workspace out of its own account — and their sign-in is marked in the
      audit trail. Refusals are recorded as `auth.login_failed` with the reason
      `sso_enforced`.

      It is also where the second factor bites (NFR-S11 · FR-MOD-00.1). An
      account with an active enrollment must send `code` — a TOTP code or one of
      its recovery codes — whatever the workspace's policy says; a workspace with
      `require_two_factor` refuses an account that has none at all, carrying
      `details.enrollment_required` so the client routes to setup rather than to
      a code box. Both refusals are `two_factor_required` (401); a code that is
      simply wrong is `authentication`, so a client can tell "ask again" from
      "ask for something else". Attempts are budgeted per account
      (`RATE_LIMIT_TWO_FACTOR_PER_HOUR`), and running out is a 429.

      The `enrollment_required` refusal also carries `details.enrollment_ticket`
      (S11-2FA-k): a short-lived bearer credential that reaches
      `POST /auth/2fa/enroll` and `POST /auth/2fa/activate` and **nothing else**,
      so somebody whose only membership is in an enforcing workspace can set a
      factor up from the sign-in screen instead of needing a session they cannot
      obtain. It is not a session — every other endpoint answers it 404 — it is
      minted only when the account holds no active factor, and it is spent by the
      activation it exists for. Sign-in is then repeated with the new `code`.

      The SAML assertion path is deliberately exempt: a federated sign-in has
      already been vouched for by the identity provider, which is where the
      workspace's MFA lives. Refresh-token rotation and personal access tokens
      are untouched — neither is a sign-in.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [client_id, redirect_uri, code_challenge, email, password, license_id]
            properties:
              client_id: { type: string }
              redirect_uri:
                type: string
                description: Must match a registered URI exactly.
              code_challenge:
                type: string
                minLength: 43
                maxLength: 128
                description: BASE64URL(SHA256(code_verifier)).
              code_challenge_method:
                type: string
                enum: [S256]
                default: S256
                description: S256 only — OAuth 2.1 removes `plain`.
              scope:
                type: string
                description: Comma-separated. Defaults to the client's registered scopes.
              state: { type: string, maxLength: 512 }
              email: { type: string, format: email }
              password: { type: string }
              license_id: { type: string }
              code:
                type: string
                maxLength: 64
                description: >-
                  The second factor, when the account holds one — a six-digit
                  TOTP code or a `ABCDE-FGHJK` recovery code. One field for both:
                  the person is answering one question, and the two shapes cannot
                  be confused. Required by the account rather than by the schema,
                  so omitting it when one is needed is a `two_factor_required`
                  refusal that says what is missing, not a validation error.
    responses:
      "200":
        description: Authorization code issued
        content:
          application/json:
            schema:
              type: object
              required: [code, redirect_uri, expires_in]
              properties:
                code: { type: string }
                redirect_uri: { type: string }
                state: { type: string }
                expires_in: { type: integer }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401":
        description: >-
          The credentials were refused, or a second factor is missing or wrong.
          `two_factor_required` means present a code — or, with
          `details.enrollment_required`, that this workspace will not admit an
          account that has not set one up. That refusal also carries
          `details.enrollment_ticket` (an opaque bearer credential for the two
          enrollment endpoints, and only those) and
          `details.enrollment_ticket_expires_in` (seconds). `authentication` on
          its own means the code was wrong, expired or already spent; which of
          the three is deliberately not said. Sent `Cache-Control: no-store`,
          because a credential is in the body.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "403":
        description: >-
          The requested scopes are unavailable, or the workspace requires single
          sign-on and the caller is not an owner. The latter carries
          `details.sso_connection_id`.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

token:
  post:
    tags: [Auth]
    operationId: exchangeToken
    summary: Exchange an authorization code, or rotate a refresh token
    description: |
      Refresh tokens rotate on every use. Presenting one that has already been
      rotated revokes the entire token family — the standard response to a
      captured refresh token (OAuth 2.1 §4.3.1).
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                title: Authorization code grant
                required: [grant_type, code, code_verifier, client_id, redirect_uri]
                properties:
                  grant_type: { type: string, enum: [authorization_code] }
                  code: { type: string }
                  code_verifier: { type: string, minLength: 43, maxLength: 128 }
                  client_id: { type: string }
                  client_secret: { type: string }
                  redirect_uri: { type: string }
              - type: object
                title: Refresh token grant
                required: [grant_type, refresh_token, client_id]
                properties:
                  grant_type: { type: string, enum: [refresh_token] }
                  refresh_token: { type: string }
                  client_id: { type: string }
                  client_secret: { type: string }
    responses:
      "200":
        description: Tokens issued
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/TokenGrant" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

revoke:
  post:
    tags: [Auth]
    operationId: revokeToken
    summary: Revoke an access or refresh token
    description: |
      Always returns 200, even for a token that never existed — per RFC 7009 the
      caller's goal is "this token must not work", and reporting whether it was
      real would turn the endpoint into an oracle.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
              token_type_hint: { type: string, enum: [access_token, refresh_token] }
    responses:
      "200":
        description: Token is no longer valid
        content:
          application/json:
            schema:
              type: object
              properties:
                revoked: { type: boolean }

me:
  get:
    tags: [Auth]
    operationId: getCurrentPrincipal
    summary: Describe the caller
    responses:
      "200":
        description: Caller identity, tenant and effective scopes
        content:
          application/json:
            schema:
              type: object
              required: [kind, organization_id, license_id, scopes]
              properties:
                kind: { type: string, enum: [agent, bot, customer] }
                account_id: { type: string, format: uuid }
                email: { type: string }
                name: { type: string }
                role: { type: string, enum: [owner, viceowner, admin, agent] }
                organization_id: { type: string, format: uuid }
                organization_name:
                  type: string
                  description: |
                    Agent principals only. The workspace's display name — shipped
                    with the profile the app already fetches on load, rather than a
                    second request, for a caller that has nowhere else to read it
                    (the mobile Settings → Account card, 13.7-r; the console reads
                    it from `/auth/login`'s membership list instead, which a
                    long-lived session never revisits).
                license_id: { type: string }
                region:
                  type: string
                  enum: [eu, us]
                  description: |
                    Where the caller's **workspace** keeps its data — the region
                    it named at signup and can never leave (NFR-C4). Since a
                    deployment refuses anything else with 421, this is also
                    always the region answering the request.
                scopes:
                  type: array
                  items: { type: string }
                routing_status:
                  type: string
                  enum: [accepting_chats, not_accepting_chats, offline]
                onboarding_completed:
                  type: boolean
                  description: |
                    Agent principals only. Whether the workspace has finished (or
                    skipped) first-run setup — the shell gates the onboarding
                    wizard on this without a second request (FR-MOD-00.4).
                notification_preferences:
                  allOf:
                    - $ref: "../openapi.yaml#/components/schemas/NotificationPreferences"
                  description: |
                    Agent principals only. Every channel the caller can be reached
                    through — per user, per license (FR-MOD-13.8 / 08.2). Shipped
                    with the profile because the console's alerting decision runs
                    on every incoming message and cannot afford a fetch;
                    `/agents/me/notification-preferences` is the same object on
                    its own.
                two_factor:
                  type: object
                  required: [enabled, pending, recovery_codes_remaining]
                  description: |
                    Agent principals only. The caller's own second factor
                    (NFR-S11 · FR-MOD-00.1). Carried here rather than on an
                    endpoint of its own: it is a property of the caller, which is
                    what this route describes, and the account settings screen
                    has nowhere else to read "it is on, and three recovery codes
                    are left". Never carries the secret or any code.
                  properties:
                    enabled:
                      type: boolean
                      description: An enrollment exists and has been confirmed with a code.
                    pending:
                      type: boolean
                      description: |
                        A secret has been issued but no code has confirmed it
                        yet — `POST /auth/2fa/enroll` was called and
                        `POST /auth/2fa/activate` was not.
                    recovery_codes_remaining:
                      type: integer
                      description: Unused codes left. Which ones is never retrievable.
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }

twoFactorEnroll:
  post:
    tags: [Auth]
    operationId: enrollTwoFactor
    summary: Start two-factor enrollment
    description: |
      Mints a TOTP secret for the caller's own account and returns the
      `otpauth://` URI an authenticator app imports (NFR-S11 · FR-MOD-00.1).

      Nothing is enabled yet — `activated_at` stays unset until
      `POST /auth/2fa/activate` proves the app and the server agree about the
      time. Calling this again before that happens **replaces** the pending
      secret rather than refusing, so an abandoned attempt (a closed tab, a
      phone reset halfway through) is not a state anybody gets stuck in.

      Calling it against an already-active factor answers 409
      `two_factor_already_enabled`: replacing a live second factor without
      proving anything is what a stolen session would do, and the owner would
      only find out when their own app started being rejected.

      The secret is in this response and nowhere else it can be read back from.

      Two credentials open this endpoint: an ordinary session carrying
      `accounts--my:rw`, and the `enrollment_ticket` a `two_factor_required` ·
      `enrollment_required` refusal from `POST /auth/authorize` hands back
      (S11-2FA-k). The ticket reaches this endpoint and `/auth/2fa/activate`
      only.

      **A session is not enough on its own** (M-SEC-d2). A second factor is
      account-global — one secret covers every workspace the account belongs to
      — while a session is minted by one workspace, including from a SAML
      assertion its identity provider signed. So this endpoint proves the
      *account*, in the same way and for the same reason `DELETE /auth/2fa`
      does in the other direction:

      * an `enrollment_ticket` is accepted on its own — it was minted one call
        after `POST /auth/authorize` verified a password;
      * otherwise, an account that has a password must send it, and nothing
        else will do;
      * an account with no password (SSO-provisioned) that belongs to exactly
        one workspace needs neither — that workspace's identity provider is its
        only authority, and there is no second workspace to be shut out of. With
        a second membership it is refused 403 `not_allowed`
        (`details.password_required`), and the way out is to set a password.
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: "#/twoFactorEnrollmentProof" }
    responses:
      "200":
        description: Enrollment started
        content:
          application/json:
            schema:
              type: object
              required: [secret, otpauth_uri, issuer, account_name]
              properties:
                secret:
                  type: string
                  description: |
                    RFC 4648 base32, unpadded. Offered as copyable text for
                    manual entry, which is also why no QR code is generated.
                otpauth_uri:
                  type: string
                  description: |
                    `otpauth://totp/…`. Its `algorithm`, `digits` and `period`
                    are fixed to what verification computes — a URI disagreeing
                    with the server would enroll an app producing plausible
                    codes that never match.
                issuer:
                  type: string
                  description: What the authenticator app lists the entry under.
                account_name:
                  type: string
                  description: |
                    The caller's e-mail address — what distinguishes two entries
                    for somebody holding a personal and a work account.
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }

twoFactorActivate:
  post:
    tags: [Auth]
    operationId: activateTwoFactor
    summary: Confirm two-factor enrollment with a code
    description: |
      Verifies a code against the pending secret, switches the factor on, and
      returns the recovery sheet — the only response in the API that carries
      recovery codes in the clear. They are stored hashed and are never
      retrievable again; `POST /auth/2fa/recovery-codes` issues a new sheet
      rather than re-showing this one.

      The accepted code's RFC 6238 step becomes the replay floor, so the code
      just typed cannot be turned around into a session in the seconds it
      remains valid.

      Activation also sets `two_factor_enabled` on **every** membership the
      account holds — that flag is a derived copy of this fact, not a second
      source of truth for it.

      Accepts the same two credentials as `POST /auth/2fa/enroll`, and proves the
      account the same way (M-SEC-d2) — `password` is required here too whenever
      the account holds one. Gating the enrollment endpoint is what makes the
      chain unwalkable; the rule is repeated here so it cannot drift between two
      endpoints that write the same account-global state.

      An `enrollment_ticket` is **spent** by a successful activation: it exists
      to finish one enrollment, and the session that follows comes from repeating
      `POST /auth/authorize` with a code the new factor produces.

      Activation also e-mails the account holder at the address the factor now
      guards. It names the workspace it was done from and carries neither the
      secret nor a recovery code.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/twoFactorEnrollmentProof"
              - type: object
                required: [code]
                properties:
                  code:
                    type: string
                    description: The six digits the authenticator app is showing.
    responses:
      "200":
        description: Two-factor authentication is now active
        content:
          application/json:
            schema:
              type: object
              required: [enabled, recovery_codes, recovery_codes_remaining]
              properties:
                enabled: { type: boolean, enum: [true] }
                recovery_codes:
                  type: array
                  description: |
                    Ten single-use codes, `ABCDE-FGHJK`. Shown once. Store them
                    now — nothing can show them again.
                  items: { type: string }
                recovery_codes_remaining: { type: integer }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401":
        description: |
          The code was wrong, expired or already spent (`authentication`), or the
          account has no pending enrollment to confirm (`two_factor_required`).
          One answer covers wrong, expired and already-spent: which it was is
          exactly what somebody guessing would like to know.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }

twoFactor:
  delete:
    tags: [Auth]
    operationId: disableTwoFactor
    summary: Turn two-factor authentication off
    description: |
      Removes the factor and the recovery sheet together, and clears
      `two_factor_enabled` on every membership the account holds.

      **Requires the account password in the body**, not just a session. A
      session token that has been stolen is exactly the thing that would
      otherwise be used to remove the control protecting the account it came
      from, so this asks for the credential a thief is least likely to hold.

      An account provisioned through SSO has no password. Those callers send
      `code` instead — a current TOTP code or a recovery code — because
      otherwise they could enable the factor and never switch it off. It is a
      weaker step and it is the strongest one that account has.

      Refused with 403 `not_allowed` while the caller belongs to any workspace
      whose `require_two_factor` policy is on; the refusal names them. Every
      workspace is considered, not just the one the session is in — an account
      is global, so a member of a strict workspace could otherwise sign in to a
      lax one to escape its policy.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/twoFactorReauthentication" }
    responses:
      "204": { description: Two-factor authentication removed }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404":
        description: The account has no two-factor authentication to remove
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

twoFactorRecoveryCodes:
  post:
    tags: [Auth]
    operationId: regenerateTwoFactorRecoveryCodes
    summary: Issue a new two-factor recovery sheet
    description: |
      Replaces the previous sheet **whole**, unused codes included: somebody
      asking for a new one is saying the old one is no longer trustworthy, and
      leaving half of it live would quietly disagree with them.

      Carries the same re-authentication requirement as removing the factor — a
      fresh sheet is ten standalone second factors, so a stolen session must not
      be able to print itself one. Requires an already-active factor.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/twoFactorReauthentication" }
    responses:
      "200":
        description: A new sheet, shown once
        content:
          application/json:
            schema:
              type: object
              required: [recovery_codes, recovery_codes_remaining]
              properties:
                recovery_codes:
                  type: array
                  items: { type: string }
                recovery_codes_remaining: { type: integer }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }

# Shared by the two endpoints that *install* a second factor (M-SEC-d2). One
# field, optional in the schema and required by the account rather than by the
# request — the same reading `twoFactorReauthentication` gets, and for the same
# reason: whether a password is owed depends on state the caller cannot see, so
# a missing one is a refusal naming what is missing rather than a shape error.
twoFactorEnrollmentProof:
  type: object
  properties:
    password:
      type: string
      description: |
        The caller's own account password. Required whenever the account has
        one; ignored for an `enrollment_ticket`, which already carries a
        password proof.

# Shared by the two endpoints that change a live second factor. Both fields are
# optional in the schema because which one is required depends on the account
# rather than on the request: an account with a password must send `password`
# and nothing else will do; an account without one (SSO-provisioned) sends
# `code`.
twoFactorReauthentication:
  type: object
  properties:
    password:
      type: string
      description: The caller's own account password.
    code:
      type: string
      description: |
        A current TOTP code or a recovery code. Accepted **only** for accounts
        with no password — for everyone else the factor cannot re-authenticate
        its own removal, since the phone is one of the things stolen along with
        a laptop.

personalAccessTokens:
  get:
    tags: [Auth]
    operationId: listPersonalAccessTokens
    summary: List the caller's personal access tokens
    responses:
      "200":
        description: Tokens (metadata only — the secret is never retrievable)
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/PersonalAccessToken" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
  post:
    tags: [Auth]
    operationId: createPersonalAccessToken
    summary: Create a personal access token
    description: |
      The plaintext token is in this response and nowhere else — only its hash
      is stored. A token cannot be granted scopes the creating session does not
      already hold.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              scopes:
                type: array
                items: { type: string }
              expires_in_days: { type: integer, minimum: 1, maximum: 365 }
    responses:
      "201":
        description: Token created
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../openapi.yaml#/components/schemas/PersonalAccessToken"
                - type: object
                  required: [token]
                  properties:
                    token:
                      type: string
                      description: Shown once. Not recoverable.
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }

personalAccessToken:
  delete:
    tags: [Auth]
    operationId: deletePersonalAccessToken
    summary: Revoke a personal access token
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "204": { description: Revoked }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

customerToken:
  post:
    tags: [Auth]
    operationId: issueCustomerToken
    summary: Mint a widget (customer) token
    description: |
      Called by the widget on load. The token is scoped to one organization and
      grants nothing outside the Customer Chat API.

      The embedding page's origin must be a trusted domain for the organization
      (NFR-S6). It arrives as `host_origin`, because the request is made from
      inside the widget iframe and that frame's own `Origin` is Nexa's — the
      same value for every customer, and so unable to say which site opened the
      chat. Only code running on the host page knows that, which is why the
      loader passes it through.

      Being client-supplied makes this a **configuration** control rather than
      an authentication boundary: anyone calling this endpoint directly can
      claim any host. It stops a copied snippet from working on an unauthorised
      site; it does not stop a deliberate attacker. What contains the damage is
      that the resulting token only ever reaches one visitor's own conversation
      within one organization.

      `host_origin` is optional so server-side integrations can call this
      directly, in which case the request's own `Origin` header is used.

      A deployment mints only for workspaces of its own region (NFR-C4) and
      answers 421 otherwise — before creating the visitor, so a workspace kept
      elsewhere gains no rows here. The issued token carries its workspace's
      region, so presenting it to another deployment, or to that deployment's
      realtime gateway, is refused the same way.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [organization_id]
            properties:
              organization_id: { type: string, format: uuid }
              customer_id:
                type: string
                format: uuid
                description: Returning visitor. A new customer is created when omitted.
              host_origin:
                type: string
                maxLength: 2048
                description: |
                  Origin of the page the widget is embedded in, e.g.
                  `https://shop.example`. Falls back to the `Origin` header.
    responses:
      "200":
        description: Customer token issued
        content:
          application/json:
            schema:
              type: object
              required: [token, expires_in, customer_id, organization_id]
              properties:
                token: { type: string }
                expires_in: { type: integer }
                customer_id: { type: string, format: uuid }
                organization_id: { type: string, format: uuid }
                pre_chat_form:
                  type: array
                  description: |
                    The workspace's pre-chat form (FR-MOD-08.7.7) — the fields
                    the widget asks before the conversation starts. Empty when
                    none are configured; the answers ride the first message as
                    `custom_fields` on `/customer/chat/events`.
                  items: { $ref: "../openapi.yaml#/components/schemas/WidgetFormField" }
                post_chat_form:
                  type: array
                  description: |
                    The workspace's post-chat form (FR-MOD-08.7.7) — the fields
                    the widget asks once the conversation ends, on the same
                    screen as the rating prompt. Delivered here rather than
                    fetched at closing time, so the widget already has it; the
                    answers go to `/customer/chat/form-response`.
                  items: { $ref: "../openapi.yaml#/components/schemas/WidgetFormField" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "421": { $ref: "../openapi.yaml#/components/responses/MisdirectedRequest" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
