# Campaigns — proactive, targeted messages (FR-MOD-03.3).
#
# A campaign is a trigger plus a message. While it is running, the trigger
# engine delivers the message to the visitors on the site who match the trigger
# right now (FR-MOD-03.3.2). The card's Displayed / Chats / Conversion numbers
# (FR-MOD-03.3.3) are counted from those sends, so they can never drift from what
# actually went out.
#
# Reads take `customers:ro`, writes `customers:rw`: campaigns target the same
# people the CRM and the live board cover, so they ride the customer scopes
# rather than a scope the source platform never had.

campaigns:
  get:
    tags: [Customers]
    operationId: listCampaigns
    summary: List campaigns
    description: |
      Newest first. `status` filters by the derived lifecycle bucket
      (FR-MOD-03.3.1): `ongoing`, `scheduled` (active but not started yet),
      `inactive` (off, or past its end), or `all`.

      The bucket is re-derived from each campaign's schedule as the list is
      read, so one whose start time has passed appears under `ongoing` rather
      than staying where its last save left it.

      Archived campaigns (`DELETE /campaigns/{campaignId}`) are not listed in any
      bucket; their history stays in `GET /reports/campaigns`.
    parameters:
      - name: status
        in: query
        description: Which lifecycle bucket to return.
        schema:
          type: string
          enum: [all, ongoing, scheduled, inactive]
          default: all
    responses:
      "200":
        description: The campaigns
        content:
          application/json:
            schema:
              type: object
              required: [items, total]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/Campaign" }
                total: { type: integer }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Customers]
    operationId: createCampaign
    summary: Create a campaign
    description: |
      Both a trigger and a message are required (FR-MOD-03.3.2): a campaign that
      could not target or say anything is rejected, not saved inert. When the new
      campaign is running, it fires immediately at the matching live visitors —
      the returned `matched` is how many it just targeted (`performance.displayed`
      stays `0` until the widget's poll actually delivers to them).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, conditions, content]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              active:
                type: boolean
                description: On/off intent; defaults to true — a new campaign is meant to run.
              conditions: { $ref: "../openapi.yaml#/components/schemas/CampaignConditions" }
              content: { $ref: "../openapi.yaml#/components/schemas/CampaignContent" }
              starts_at: { type: string, format: date-time, nullable: true }
              ends_at: { type: string, format: date-time, nullable: true }
              recurring: { type: boolean }
    responses:
      "201":
        description: Created (and fired, if running)
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CampaignWriteResult" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

campaign:
  parameters:
    - name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }

  patch:
    tags: [Customers]
    operationId: updateCampaign
    summary: Edit a campaign or toggle it active
    description: |
      Only the fields present in the body change (FR-MOD-03.3.3). Sending `null`
      on a schedule field clears it; omitting a field leaves it alone. An edit
      cannot strip the trigger or message out of a campaign that stays active.
      Toggling one active fires it at the matching visitors, exactly as create
      does — idempotently, so no one already reached is messaged twice, and
      `matched` on a re-fire counts only the newly-targeted ones.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              active:
                type: boolean
                description: Toggle the campaign on or off (FR-MOD-03.3.3).
              conditions: { $ref: "../openapi.yaml#/components/schemas/CampaignConditions" }
              content: { $ref: "../openapi.yaml#/components/schemas/CampaignContent" }
              starts_at: { type: string, format: date-time, nullable: true }
              ends_at: { type: string, format: date-time, nullable: true }
              recurring: { type: boolean }
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CampaignWriteResult" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  delete:
    tags: [Customers]
    operationId: archiveCampaign
    summary: Delete (archive) a campaign
    description: |
      A soft delete (EN-05). The campaign leaves the list, never fires again and
      is never delivered again — a send it had queued but the visitor's widget
      had not yet shown is dropped with it — and it cannot be switched back on
      (an edit to an archived campaign is a 404; make a copy instead, see
      `POST /campaigns/{campaignId}/duplicate`, which accepts an archived
      source). Its sends are kept, so `GET /reports/campaigns` still reports
      the history, and a customer erasure still removes them.

      Archiving an already-archived or unknown campaign is a 404.
    responses:
      "204": { description: Archived }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

campaignDuplicate:
  parameters:
    - name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }

  post:
    tags: [Customers]
    operationId: duplicateCampaign
    summary: Copy a campaign
    description: |
      Creates a new campaign with the source's trigger, content, schedule and
      recurrence — **inactive**, so nothing is sent until its owner switches it
      on, and with no sends of its own (the copy starts a fresh report). The
      source may be archived: a copy is the only way back from an archive.

      `name` defaults to the source's name followed by ` (copy)`, cut to 120
      characters.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
    responses:
      "201":
        description: The copy
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CampaignWriteResult" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
