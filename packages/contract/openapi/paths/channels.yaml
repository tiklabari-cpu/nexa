emailInbound:
  post:
    tags: [Configuration]
    operationId: ingestInboundEmail
    summary: Ingest a forwarded support email
    description: |
      The webhook a mail provider calls when a message arrives at a workspace's
      forwarding address, `<organization_id>@<inbound-domain>` (FR-MOD-08.5.3).

      The recipient address routes the message to a workspace: its local part is
      the organization id, resolved to a licence the same SECURITY DEFINER way
      the hosted Chat page resolves one, because no session exists yet. The
      sender is matched to an existing customer by email, so a returning writer
      does not spawn a duplicate record; an unknown sender becomes a new one.

      When the workspace keeps the spam filter on (the default) and the provider
      flagged the message as spam, no ticket is created — the call still
      succeeds, so the provider does not retry a message that was dropped on
      purpose.

      Delivery itself is mocked in this build (PLAN A4); a production deployment
      authenticates the provider at the edge. When `INBOUND_EMAIL_SECRET` is
      configured the caller must present it as the `X-Inbound-Secret` header.
    security: []
    parameters:
      - in: header
        name: X-Inbound-Secret
        required: false
        schema: { type: string }
        description: |
          Shared secret, checked only when `INBOUND_EMAIL_SECRET` is configured.
          Lets the mock provider stand in for a signed webhook.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [to, from, subject]
            properties:
              to:
                type: string
                maxLength: 320
                description: The workspace forwarding address the mail was sent to.
              from:
                type: string
                maxLength: 320
                description: Sender, bare or `Name <addr>`. Matched to a customer by email.
              subject:
                type: string
                maxLength: 998
                description: Becomes the ticket subject.
              text:
                type: string
                maxLength: 100000
                description: Message body. Not persisted — the ticket core carries no body.
              spam:
                type: boolean
                description: The provider's spam verdict, honoured when the workspace filter is on.
    responses:
      "200":
        description: |
          The message was processed. `created` carries the new ticket id;
          `ignored` means the spam filter dropped it.
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [created, ignored]
                ticket_id:
                  type: string
                  description: Present when `status` is `created`.
                reason:
                  type: string
                  enum: [spam]
                  description: Present when `status` is `ignored`.
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

# --- Omnichannel adapters (MOCK) — FR-MOD-08.5.4/.5/.6 (v1, Must) -------------
#
# Messenger, Twilio SMS and WhatsApp behind one adapter shape. Connecting a
# channel is the mock provider handshake (OAuth exchange / number provisioning /
# business linking); inbound is a provider webhook that becomes an inbox chat;
# outbound is an agent reply leaving through the channel. Providers are mocked in
# this build (MASTER-PROMPT §5) — no network leaves the process.

channels:
  get:
    tags: [Configuration]
    operationId: listChannels
    summary: Channels the workspace has connected
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
    description: |
      Every adapter channel (Messenger/SMS/WhatsApp) the workspace has connected,
      each with whether it is currently on and the channel address it answers at.
    responses:
      "200":
        description: The workspace's channels
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/ConnectedChannel" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

channelConnect:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ChannelTypePath"
    - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
  post:
    tags: [Configuration]
    operationId: connectChannel
    summary: Connect a channel (mock)
    description: |
      Runs the channel's mock connect step and marks it on. The body differs by
      channel — a Messenger OAuth `code` + `page_id`, a Twilio `account_sid` +
      `auth_token` + `phone_number`, a WhatsApp `waba_id` + `phone_number`, an
      Instagram OAuth `code` + `ig_user_id`, or a Telegram `bot_token` +
      `bot_username` — and the resulting channel *address* (page id / phone
      number / IG user id / bot username) becomes the key inbound webhooks
      resolve to this workspace. A credential in the body (Twilio's
      `auth_token`, Telegram's `bot_token`) is verified but never stored back
      on the channel — unlike the other channels' mock OAuth exchange, a
      Telegram `bot_token` is supplied by the caller rather than minted by
      this mock, so it is real-shaped and must never be echoed into the
      stored config.

      Idempotent on the channel type: connecting again re-configures the existing
      channel rather than creating a second.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Channel-specific connect fields (see description).
            additionalProperties: true
    responses:
      "200":
        description: Connected
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ConnectedChannel" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

channelDisconnect:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ChannelTypePath"
    - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
  post:
    tags: [Configuration]
    operationId: disconnectChannel
    summary: Disconnect a channel
    description: |
      Turns the channel off. Inbound webhooks for it stop resolving at once. The
      channel row and its message-log history are kept, so re-connecting later
      keeps the trail.
    responses:
      "204": { description: Disconnected }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

channelMessages:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ChannelTypePath"
    - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
  get:
    tags: [Configuration]
    operationId: listChannelMessages
    summary: The channel's message log
    description: |
      What actually crossed this channel, newest first — the read side of the
      log the adapter has been writing since the channels landed. Until it
      existed nothing could answer "did that reply really go out": an agent's
      console message is dispatched to the provider after the event is
      committed, and the only record of the send was a row no endpoint read.

      `direction`, `chat_id`, `date_from` and `date_to` narrow the same list,
      additively. Paginated by opaque keyset cursor rather than offset —
      messages arrive continuously, so an offset page would shift under the
      reader and silently skip rows. `limit` above the maximum is clamped, not
      rejected.

      Gated on `channels--all:ro` because, unlike the channel list, these rows
      carry the customer's own words. Scoped to the caller's workspace by RLS:
      another workspace's messages are never returned, and an `external_id` or
      `chat_id` from one is simply an empty page (NFR-S5). `X-Nexa-Brand` does
      not narrow it — the log is keyed by licence and channel, not by brand.
    parameters:
      - name: direction
        in: query
        description: Restrict to one direction. Both when omitted.
        schema: { $ref: "../openapi.yaml#/components/schemas/ChannelMessageDirection" }
      - name: chat_id
        in: query
        description: |
          Only messages belonging to this chat. Uses the
          `(license_id, chat_id)` index.
        schema: { type: string }
      - name: date_from
        in: query
        description: Lower bound on `created_at`. Open-ended when omitted.
        schema: { type: string, format: date-time }
      - name: date_to
        in: query
        description: Upper bound on `created_at`. Open-ended (now) when omitted.
        schema: { type: string, format: date-time }
      - $ref: "../openapi.yaml#/components/parameters/PageId"
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200":
        description: A page of channel messages, newest first.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/ChannelMessage" }
                next_page_id:
                  type: string
                  description: Opaque cursor for the next page; absent on the last.
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  post:
    tags: [Configuration]
    operationId: sendChannelMessage
    summary: Send an outbound message through a channel (mock)
    description: |
      Delivers a message out through a connected channel and records it. Address
      the recipient either by the `chat_id` the reply belongs to (their channel
      identity is looked up) or directly by `external_id` — exactly one. Refused
      if the channel is not connected, or if a `chat_id` has no identity on this
      channel.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [text]
            properties:
              text: { type: string, minLength: 1, maxLength: 10000 }
              chat_id:
                type: string
                description: The chat the reply belongs to. Mutually exclusive with external_id.
              external_id:
                type: string
                description: The recipient's channel identity. Mutually exclusive with chat_id.
    responses:
      "200":
        description: Sent — the mock provider accepted it
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ChannelSendResult" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

channelWebhook:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ChannelTypePath"
  post:
    tags: [Configuration]
    operationId: ingestChannelWebhook
    summary: Ingest an inbound channel message (mock provider webhook)
    description: |
      The webhook a channel provider calls when a message arrives. The body's
      channel address (the recipient page id / number) routes it to a workspace —
      the same SECURITY DEFINER resolve the e-mail and hosted-chat paths use,
      because no session exists yet. The sender is matched to a customer by their
      per-channel identity (reused on return), then the message opens or continues
      a chat exactly as the widget does.

      Instagram mirrors the Messenger shape: `recipient.id` is the connected
      channel's `ig_user_id`, `sender.id` is the IGSID (an Instagram-scoped id,
      the sender's stable identity for that account), and `message.text` is the
      DM body.

      Telegram mirrors the same flattened shape rather than the provider's real
      `update` envelope (consistent with the other three adapters): `recipient.id`
      is the connected bot's `bot_username`, `sender.id` is the Telegram user id
      of the writer, and `message.text` is the message body.

      A card number in the message is masked before anything stores or reads it
      (FR-MOD-08.9.5), and a first contact is screened by the workspace's spam
      filter (FR-MOD-08.9.3) — the same two gates the widget and e-mail paths
      apply. As on the e-mail path, a dropped message is still a 200, so the
      provider does not retry something refused on purpose.

      Public and unsigned in this build (the provider is mocked, MASTER-PROMPT
      §5); a real deployment verifies the provider signature at the edge.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: The provider's inbound webhook body (shape differs per channel).
            additionalProperties: true
    responses:
      "200":
        description: |
          The message was processed. `accepted` carries the chat it became;
          `ignored` means the spam filter dropped it and nothing was persisted.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [status, chat_id, customer_id]
                  properties:
                    status: { type: string, enum: [accepted] }
                    chat_id: { type: string }
                    customer_id: { type: string, format: uuid }
                - type: object
                  required: [status, reason]
                  properties:
                    status: { type: string, enum: [ignored] }
                    reason: { type: string, enum: [spam] }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

emailAddresses:
  get:
    tags: [Configuration]
    operationId: listInboundEmailAddresses
    summary: The workspace's e-mail forwarding addresses
    description: |
      Every address support mail may be forwarded to (FR-MOD-08.5.3). The first
      is always the workspace's default, `<organization_id>@<domain>` — the one
      that has always existed and keeps working unchanged. Any further address
      carries a label: `<organization_id>+support@<domain>`.

      Each row reports its own activity — how many tickets have arrived at it and
      when the last one did. That is the acceptance criterion's verification
      half: an address a workspace has just pasted into a mail provider is either
      receiving or it is not, and this is where that shows. `POST
      /channels/email/addresses/{addressId}/test` produces the same evidence on
      demand.

      Gated on `channels--all:ro` (or the write scope, which subsumes it) — the
      same channel-administration door `GET /channels` sits behind. RLS confines
      the result to the caller's workspace.
    responses:
      "200":
        description: The workspace's forwarding addresses, default first.
        content:
          application/json:
            schema:
              type: object
              required: [domain, items]
              properties:
                domain:
                  type: string
                  description: |
                    The inbound domain the deployment answers at
                    (`INBOUND_EMAIL_DOMAIN`). Returned so the console shows the
                    address the API will actually route, not one it guessed.
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/InboundEmailAddress" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  post:
    tags: [Configuration]
    operationId: createInboundEmailAddress
    summary: Define another forwarding address
    description: |
      Adds `<organization_id>+<label>@<domain>` to the workspace. The label is a
      conservative slug (lowercase letters, digits, interior hyphens) because it
      becomes part of an e-mail local part.

      The organization id stays in front of the label, so an address belongs to
      exactly one workspace by construction; the database enforces the same rule
      independently through a unique key on the whole local part. A label already
      taken in this workspace is a 400 that says only that the address is taken —
      never who holds it (NFR-S5).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [label]
            properties:
              label:
                type: string
                minLength: 1
                maxLength: 32
                pattern: "^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$"
                description: The part that follows the `+`, e.g. `support`.
    responses:
      "201":
        description: The new address.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/InboundEmailAddress" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

emailAddress:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/EmailAddressIdPath"
  delete:
    tags: [Configuration]
    operationId: deleteInboundEmailAddress
    summary: Stop accepting mail at a forwarding address
    description: |
      Mail sent to the address stops resolving at once. The tickets it already
      produced are kept and simply stop naming an address — the conversation
      outlives the mailbox it arrived through.

      The workspace's default address cannot be deleted: it is the address every
      existing forwarding rule points at, and removing it would silently drop
      support mail. That refusal is a 400.
    responses:
      "204": { description: Deleted }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

emailAddressTest:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/EmailAddressIdPath"
  post:
    tags: [Configuration]
    operationId: testInboundEmailAddress
    summary: Send a test message to a forwarding address
    description: |
      The acceptance criterion's "test doğrulama" (FR-MOD-08.5.3): an action that
      proves an address really works, rather than a screen asserting it does.

      A message addressed to this address is put through the very same pipeline a
      forwarded mail takes — the recipient resolves to this workspace, the sender
      becomes (or is matched to) a customer, and a ticket is opened carrying the
      address. It is a real ticket, not a simulation with the assertions removed;
      that is what makes it evidence. Delivery itself is the mocked half in this
      build (MASTER-PROMPT §5), so what this proves is everything from the
      address inward.

      The reply names the ticket that was created, and the address's
      `last_received_at` moves — so the console can show the result immediately
      and `GET /channels/email/addresses` reports it afterwards.
    responses:
      "200":
        description: The ticket the test message produced.
        content:
          application/json:
            schema:
              type: object
              required: [ticket_id, address]
              properties:
                ticket_id:
                  type: string
                  description: The ticket the test message opened.
                address:
                  type: string
                  description: The address the message was sent to.
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
