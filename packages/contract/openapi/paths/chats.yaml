# Agent Chat API — the conversation core.
#
# Resource-based (ADR-04): actions that are not plain CRUD live as a POST
# sub-path under the chat they act on, rather than as `/action/<verb>` calls.
#
# The model is chat → thread → event:
#   chat   the member's conversation container ("Thread ID" in the panel). At
#          most one active per license+customer, and one per member per
#          conversation day once filed under a day (`local_day`, ID-02) — both
#          enforced by partial unique indexes
#   thread one connection ("Chat ID" in the panel); closing it archives the
#          conversation, and reopening it opens a new thread on the same chat
#          (`Chat.connections` lists a day's threads)
#   event  everything that happened — messages, system notices, internal notes

chats:
  get:
    tags: [Chats]
    operationId: listChats
    summary: List conversations
    description: |
      Returns chats the caller may see. An agent sees a chat only through a team
      they belong to unless their token carries `chats--all:ro`. A member whose
      role the workspace's permission matrix sets to `own` for `chats.view`
      sees only the chats they are assigned to or have joined, whatever their
      token carries; at `none` the request is a 403 (RL-02 · tm 325.3).

      Paginated by opaque keyset cursor rather than offset: an offset page shifts
      under you every time a new message arrives, which in an active inbox means
      silently skipped conversations.

      **Text search (ID-07).** With `query` the list is a search of message
      text: the conversations the caller may see — open and archived — that
      hold a message containing every word of the query, newest match first,
      each item carrying `match` (its newest matching message, cut to a
      snippet). Case and Turkish letters are folded ("İSTANBUL" finds
      "istanbul", "cagri" finds "çağrı"), words match anywhere and in any order
      ("papara 5000" finds "Papara ile 5000 TL"), `%` and `_` mean
      themselves, and there is no stemming. Visitor and agent messages, AI
      replies and internal notes are searched; system lines are not. A card
      number was masked when it was written, so its digits find nothing.

      A search reads messages from `date_from` (default: 90 days before
      `date_to`) up to but not including `date_to` (default: now), at most
      400 days. It composes with `date_from`, `date_to`, `limit` (default
      50) and `page_id` only — any other filter, or `sort=oldest`, is a 400 —
      and `total` is the number of matching conversations across all pages.
      A query needs three letters or digits in a row in one of its words, at
      most eight words and 1000 bytes; one that matches more than 20 000
      messages is refused as too broad (400, `details.reason: too_broad`) —
      add a word or narrow the dates. A search that runs out of time is a 503.
      The request log masks `query`; it is never put in a browser address.
    parameters:
      - name: view
        in: query
        description: |
          `my` — assigned to the caller · `queued` — waiting for an agent ·
          `unassigned` — routed but unclaimed · `supervised` — open and being
          watched by the caller (a `chat_supervisions` row of theirs), which is
          not the same question the Traffic board's `supervised` state asks —
          that one is "is anybody watching this visitor right now" and is
          bounded by the heartbeat window · `archived` — closed ·
          `ai` — the AI agent is handling it (a bot has replied and no human
          has), kept out of the human queue · `ai_solved` — closed with no
          human reply and not handed off by the AI or a rule bot, i.e. an AI
          resolution (ADR-09a, the same line billing counts) · `team` — open
          and routed to a team the caller leads (`group_agents.is_lead`,
          RL-03), whoever holds it, the AI included; empty for someone who
          leads no team · `all` — every chat the caller may see.
        schema:
          type: string
          enum: [all, my, queued, unassigned, supervised, archived, ai, ai_solved, team]
          default: all
      - name: channel
        in: query
        description: |
          Narrows to the conversations that arrived over one messaging channel
          — the inbox's channel views (FR-MOD-02.1.4). An axis of its own, at
          right angles to `view`: `view=my&channel=whatsapp` is the caller's
          own WhatsApp conversations, and `total` counts the same intersection
          the rows come from.

          A chat's channel is the `channel_type` of its *oldest inbound*
          `channel_messages` row — the definition Reports' channel split
          already uses (FR-MOD-07.5), so the rail and the report can never
          disagree about which channel a conversation belongs to. Only adapter
          channels can answer it: a conversation that arrived through the
          website widget, a chat page or e-mail crossed no adapter and so
          belongs to none of these values.
        schema:
          type: string
          enum: [messenger, twilio, whatsapp, instagram, telegram]
      - name: customer_id
        in: query
        schema: { type: string, format: uuid }
      - name: group_id
        in: query
        schema: { type: integer, format: int64 }
      - name: queue_group_id
        in: query
        description: |
          Narrows to the conversations waiting in one team's queue (AU-01 ·
          ADR-08a) — the inbox's queue tabs. A chat matches while its open
          connection is queued for that team (`ChatSummary.queue_group_id`);
          the team that merely grants access to it (`group_id`) is a different
          question. Composes with `view` and `channel`, and `total` counts the
          same intersection.
        schema: { type: integer, format: int64 }
      - name: priority
        in: query
        description: |
          Narrows to the chats whose open connection has this priority
          (AI-12 · `ChatSummary.priority`) — an archived chat has none and
          never matches. Composes with the other filters, and `total` counts
          the same intersection.
        schema: { $ref: "../openapi.yaml#/components/schemas/ThreadPriority" }
      - name: sort
        in: query
        schema: { type: string, enum: [newest, oldest], default: newest }
      - name: query
        in: query
        description: |
          Words to find in message text (see above). Surrounding and repeated
          whitespace is ignored.
        schema: { type: string, minLength: 3, maxLength: 1000 }
      - name: date_from
        in: query
        description: With `query`, the earliest message time searched (inclusive).
        schema: { type: string, format: date-time }
      - name: date_to
        in: query
        description: With `query`, the end of the searched range (exclusive).
        schema: { type: string, format: date-time }
      - $ref: "../openapi.yaml#/components/parameters/PageId"
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200":
        description: A page of chats
        content:
          application/json:
            schema:
              type: object
              required: [items, total]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/ChatSummary" }
                total:
                  type: integer
                  description: |
                    Matching the current view, across all pages — the same
                    envelope `/tickets` and `/customers` return.

                    It is a field on the list rather than a separate count
                    endpoint because the number and the rows have to describe
                    the same instant: both are read inside one tenant
                    transaction, so a chat closing between them cannot make the
                    counter disagree with the list beside it. A second endpoint
                    would also double the console's rail from seven requests to
                    fourteen — the sidebar mounts one list per view.

                    For `ai_solved` this is the AI-resolution count (ADR-09a), so
                    it is the same predicate the invoice meters. Counting the
                    rows the browser happened to load instead — the console did,
                    up to `limit` — is silently wrong from the 51st resolution
                    on, and gets quieter the larger the workspace.
                waiting_thresholds:
                  type: object
                  required: [warn_seconds, alert_seconds]
                  description: |
                    The seconds after which a row's waiting counter turns to a
                    warning and to an alert (IN-03): the workspace's setting
                    for the active brand (`/settings/chat-timeout`), else 120
                    and 300. Sent with the list because the settings endpoint
                    is the admins' and every agent's inbox draws the counter.
                  properties:
                    warn_seconds: { type: integer, minimum: 1 }
                    alert_seconds: { type: integer, minimum: 1 }
                next_page_id: { type: string }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
      "503": { $ref: "../openapi.yaml#/components/responses/MessageSearchTimedOut" }

  post:
    tags: [Chats]
    operationId: startChat
    summary: Start a conversation with a customer
    description: |
      Reuses the customer's existing active chat if there is one — a second
      active chat for the same person is refused by the database, and silently
      returning the existing one is what the caller almost always wants.

      Otherwise the conversation opens in the customer's day (ID-02): a chat
      is one customer's day, so if the customer already has a chat for today
      it gains a further connection (`opened_via: agent_start`) and is
      returned with the same `id`; only the day's first connection creates a
      chat. The connection's team joins the chat's `access` without removing
      any. An active chat left over from an earlier day and silent for longer
      than the workspace's idle window is closed at the turn of the day
      (`day_rollover`), exactly as the visitor's next message would close it.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [customer_id]
            properties:
              customer_id: { type: string, format: uuid }
              group_ids:
                type: array
                items: { type: integer, format: int64 }
                description: Teams granted access. Defaults to the routing fallback.
              assign_to_me: { type: boolean, default: true }
              initial_event:
                $ref: "../openapi.yaml#/components/schemas/NewEvent"
    responses:
      "201":
        description: |
          A connection was opened — a new chat for the customer's day, or a
          further connection under the day's existing chat (same `id`).
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Chat" }
      "200":
        description: An active chat already existed and was returned unchanged
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Chat" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

chat:
  get:
    tags: [Chats]
    operationId: getChat
    summary: Fetch one conversation with its current thread
    description: |
      `thread` is the newest connection; `connections` lists the day's
      connections oldest first (ID-02) so a reader can draw the whole day and
      fetch each transcript by `thread_id`.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    responses:
      "200":
        description: The chat
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Chat" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

events:
  get:
    tags: [Chats]
    operationId: listEvents
    summary: Read the transcript
    description: |
      Ordered oldest-first within a thread by default. `after_event_id` replays
      everything since a known event — the same primitive the realtime layer
      uses to recover missed messages after a reconnect.

      A transcript that opens at the newest message and loads history as the
      reader scrolls up asks the opposite question, so `sort: newest` answers
      it: the tail of the thread first, then `before_event_id` walks backwards
      a page at a time. Both directions page on the sequence embedded in the
      event id rather than on `created_at`, because several events can share a
      millisecond and an offset page shifts under an active conversation.

      `next_page_id` is always the id of the last item returned: feed it back
      as `after_event_id` when sorting oldest-first and as `before_event_id`
      when sorting newest-first.

      Internal notes are included for agents and omitted for customers.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
      - name: thread_id
        in: query
        description: |
          Which connection's transcript to read — any id `Chat.connections`
          lists (Panelde: Chat ID, bağlantı). Defaults to the most recent
          thread. A thread of another chat is `404`, never a way into it.
        schema: { type: string }
      - name: after_event_id
        in: query
        description: Return only events following this one, in the same thread.
        schema: { type: string }
      - name: before_event_id
        in: query
        description: Return only events preceding this one, in the same thread.
        schema: { type: string }
      - name: sort
        in: query
        description: |
          `oldest` — ascending from the start of the thread (the default, and
          what a replay wants) · `newest` — descending from the end of it,
          which is what a transcript that scrolls backwards wants.
        schema:
          type: string
          enum: [oldest, newest]
          default: oldest
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200":
        description: A page of events
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/Event" }
                next_page_id: { type: string }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

  post:
    tags: [Chats]
    operationId: sendEvent
    summary: Send a message, internal note or system event
    description: |
      Idempotent when `idempotency_key` is supplied: retrying after a timeout
      returns the original event rather than posting a duplicate. Without it, a
      flaky connection turns one message into several.

      Refuses to write to a closed conversation (`chat_inactive`) — resume it
      first, which starts a new thread.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/NewEvent" }
    responses:
      "201":
        description: Event recorded
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Event" }
      "200":
        description: Replay of an idempotent request; the original event
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Event" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: The conversation is not active
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

event:
  put:
    tags: [Chats]
    operationId: updateEvent
    summary: Correct a message after it was sent
    description: |
      Rewrites the text of a message the caller sent themselves, within
      fifteen minutes of sending it (PRD §5.2 "Güvenlik" · FR-MOD-02.3.7). The
      corrected text replaces the original **in place**: the requirement is
      that the wrong sentence stops being readable, so a correction that left
      the original quoted in reports, exports and the transcript e-mail would
      not meet it.

      Nothing about the event log's shape changes. No event is deleted, no id
      is reused and no sequence number moves, so `after_event_id` and the
      realtime replay still have exactly one answer. Subscribers are told
      through the `event_updated` push, which carries the whole event rather
      than a diff.

      `audit_log` records `chat.message_edited` — actor, chat and event id,
      never the retracted text. The old wording is not retained anywhere; that
      is the point of the operation.

      Refused (403 `not_allowed`, with `details.reason`) when the caller did
      not write the message (`not_author`), when the fifteen minutes have
      passed (`edit_window_expired`), when the event is not a plain message
      (`not_editable_type`), or when the reply has already been handed to an
      external channel (`channel_delivered`) — a message delivered as an SMS or
      a Messenger reply cannot be recalled from the provider, and rewriting the
      local transcript would make our record disagree with what the customer
      actually received.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
      - name: eventId
        in: path
        required: true
        description: "`<thread_id>_<sequence>`, as returned by the send."
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/EventEdit" }
    responses:
      "200":
        description: The event, carrying its new text and its `edited_at` marker
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Event" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      # Also the answer for an event in another workspace or in a chat the
      # caller's teams do not reach: a 403 would confirm the id is real (NFR-S5).
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: The conversation is not active
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

deactivate:
  post:
    tags: [Chats]
    operationId: deactivateChat
    summary: Close the active thread
    description: |
      Archives the conversation. The chat itself persists so the customer's
      history stays intact and `resume` can continue it.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    responses:
      "200":
        description: Closed
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Chat" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: Already closed
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

resume:
  post:
    tags: [Chats]
    operationId: resumeChat
    summary: Reopen an archived conversation
    description: |
      Opens a **new thread** (`opened_via: agent_reopen`), assigned to the
      caller, rather than reviving the closed one, so the archived exchange
      stays exactly as it was.

      Where the new thread goes depends on the conversation's day (ID-02 ·
      ID-02-S6). A chat filed under today — or under no day, a chat opened
      before the daily model — is reopened in place. A chat filed under an
      **earlier day** is not: a day that has ended gains no connection, so the
      conversation continues under the customer's chat for today (found, or
      opened), and the response is **that** chat — a different `id` the
      caller should move to. The new thread's opening event ("Chat reopened")
      carries `properties.continued_from_chat_id` naming the chat that was
      reopened, and the reopened chat's teams join today's `access`.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    responses:
      "200":
        description: |
          Reopened, with a new active thread — the requested chat, or, for an
          earlier day's chat, the customer's chat for today.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Chat" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: Already active, or the customer already has another active chat
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

transfer:
  post:
    tags: [Chats]
    operationId: transferChat
    summary: Hand the conversation to another team or agent
    description: |
      A hand-off to a team replaces the chat's `access` with that team and
      records it as the open connection's `group_id`; a hand-off to an agent
      changes neither. (A customer returning the same day adds a team instead
      — ID-02-S7 — because a return is not a hand-off.)

      A hand-off to a team gives the conversation to one of its members by
      the usual routing order (`outcome: assigned`) — not the caller, nor the
      agent who held it — and with nobody free it waits in that team's queue
      (`outcome: queued`) for the next member who is (IN-04 · IN-04-S1); it is
      never refused for being unstaffed, and never overflows to the fallback
      team. A team with no members at all is a 409 `group_unavailable`. A
      `note` is written into the conversation as a line only agents see; a
      person handing to the Responsible Gambling or the Complaints team must
      give one (IN-04-S2, 400 `validation`). A queued hand-off to the
      Responsible Gambling team is also announced to the workspace's
      supervisors. `visible_to_caller` says whether the caller can still open
      the conversation: a team hand-off narrows its access to the receiving
      team.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Exactly one of `group_id` or `agent_id`.
            properties:
              group_id: { type: integer, format: int64 }
              agent_id: { type: string, format: uuid }
              note:
                type: string
                maxLength: 500
                description: |
                  What the receiving side should know, written as an internal
                  note (`recipients: agents`) — never shown to the customer.
              reason:
                type: string
                enum:
                  [manual, routing, agent_disconnected, ai_handoff, bot_handoff, agent_unresponsive]
                default: manual
                description: |
                  Who handed the conversation over. `ai_handoff` is the AI
                  Agent's and is what the AI report attributes a transfer to;
                  `bot_handoff` is the deterministic rule bot's (FR-MOD-06.6),
                  separate so a rule firing never reads as a model deciding.
                  `agent_unresponsive` is the inactivity sweep's (WG-03): the
                  assigned agent did not answer within
                  `unanswered_transfer_seconds`.
    responses:
      "200":
        description: Transferred
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ChatTransferResult" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: |
          The chat is closed (`chat_inactive`), the target agent is offline or
          the target team has no members (`group_unavailable`)
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

takeover:
  post:
    tags: [Chats]
    operationId: takeoverChat
    summary: Forcibly take a chat over as a supervisor
    description: >-
      Reassigns the chat to the calling supervisor, whoever held it. Unlike
      `transfer` (a consented, rule-driven hand-off), takeover is an authority
      act decided by the caller's `chats.takeover` capability (RL-02 matrix ·
      RL-03): `all` (the Founder and administrators by default) takes over any
      chat the caller may see; `team` (a Team Lead by default) only a chat
      routed to a team the caller leads — any one of the chat's teams is
      enough — and any other chat answers 404; `none` (a Team Member, and
      every bot) is 403. Recorded in the audit log (`chat.taken_over`). A
      second supervisor racing for the same chat loses and receives `409
      takeover_conflict`.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                {
                  type: string,
                  maxLength: 500,
                  description: Optional supervisory justification,
                  recorded in the audit trail.,
                }
    responses:
      "200":
        description: Taken over
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Chat" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: The chat is closed, or another supervisor took it over first
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

claim:
  post:
    tags: [Chats]
    operationId: claimChat
    summary: Take a conversation waiting in a manual team's queue
    description: >-
      "Take" in the Queued view (WG-07). The conversation's open connection
      must be waiting in the queue of a team whose `assignment_mode` is
      `manual`, and the caller must be a member of that team holding every
      area of expertise it (and the connection) requires. The first caller
      has it — a compare-and-set on the unassigned connection — and every
      later one receives `409 chat_claim_refused` with `details.reason:
      claimed`. A caller at their concurrent chat limit is refused with
      `details.reason: limit`; a conversation no longer waiting in such a
      queue (assigned, closed, moved to an automatic team) with
      `not_waiting`. The caller's routing status is not asked: choosing a
      conversation is the caller's own act. The taken connection leaves the
      queue (`queue_entries` outcome `assigned`), its assignment moment is
      written; `incoming_chat` tells the caller and `chat_transferred`
      (reason `manual`, `outcome: assigned`) the team, whose Queued view drops
      the row.
      A bot token is 403.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    responses:
      "200":
        description: Taken — the conversation, now the caller's
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Chat" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: Another agent took it first, the caller is at their limit, or it no longer waits
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

returnToAi:
  post:
    tags: [Chats]
    operationId: returnChatToAi
    summary: Give the open connection back to the AI agent
    description: |
      Moves the chat's open connection from a person (`human`) or a held-back
      AI (`paused`) back to the AI agent (`ai`), which answers the visitor's
      next message (AI-11). The change leaves an agents-only line in the
      transcript and an audit entry.

      **Who may.** A signed-in teammate who is the connection's assignee, or
      an admin or owner for any chat they can reach. Anyone else is refused
      with `403` — a team member cannot give a colleague's chat back.

      **Blocked by risk.** A connection flagged for responsible gaming,
      self-harm or a suspected minor never goes back to the AI: `409
      ai_return_blocked`, whoever asks.

      **AI-first workspaces.** When the AI agent answers before anyone is
      assigned (`assignment_mode: ai_first`), the connection also leaves its
      assignee and the queue — it is the AI's again, routed to a person at the
      next hand-over — and the caller is registered as its supervisor so it
      stays on their Supervised list.

      `note` is told to the AI with the conversation. `resume: continue`
      (default) keeps the procedure the AI was in and what it collected;
      `fresh` ends the procedure, keeping what was collected.

      Already the AI's: `200` with `changed: false`, nothing written.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              note:
                type: string
                maxLength: 500
                description: >-
                  What the AI should know taking the conversation back. Agents
                  see it in the transcript; the visitor never does.
              resume:
                type: string
                enum: [continue, fresh]
                default: continue
    responses:
      "200":
        description: The connection is the AI's
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ChatAiMode" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: |
          The chat is closed (`chat_inactive`), or a risk flag keeps it from the
          AI (`ai_return_blocked`).
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

pauseAi:
  post:
    tags: [Chats]
    operationId: pauseChatAi
    summary: Hold the AI agent back on the open connection
    description: |
      Moves the chat's open connection from the AI (`ai`) to `paused`: the AI
      stops answering, nobody is routed and the assignment stays as it was
      (AI-11). Giving it back is `POST /chats/{chatId}/return-to-ai`; a person
      writing to the visitor takes it (`human`).

      Who may: as for `return-to-ai` — the assignee, or an admin or owner.
      A connection the AI is not answering (a person has it, or the AI has not
      spoken in it yet) cannot be paused: `409 ai_mode_transition_refused`.
      Already paused: `200` with `changed: false`.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              note:
                type: string
                maxLength: 500
                description: Why, for the agents. The visitor never sees it.
    responses:
      "200":
        description: The AI is held back on the connection
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ChatAiMode" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: |
          The chat is closed (`chat_inactive`), or the AI is not answering the
          connection (`ai_mode_transition_refused`).
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

aiDigests:
  get:
    tags: [Chats]
    operationId: listChatAiDigests
    summary: What the AI recalls of the member's day
    description: |
      One summary per connection of the chat's day the AI took part in, newest
      first, the open one included (AI-02): the topic, what was collected, how
      it ended. The AI reads the newest three on a later connection's first
      turn, cut to what the visitor's identity allows; agents see them whole.
      A chat filed under no day offers its newest connection only.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    responses:
      "200":
        description: The summaries
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/AiDailyDigest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

aiConversation:
  get:
    tags: [Chats]
    operationId: getChatAiConversation
    summary: Where the AI stands on a connection
    description: |
      The AI's state on one connection (AI-03): the procedure in progress as
      the connection pinned it, its step and whether it waits for the visitor,
      every slot the procedure collects with what the AI has of it, the topic
      set aside, the turn count and the outcome. What the inbox's "AI'ın
      topladıkları" list and the timeline viewer read.

      Agents and bots only, behind the chat's visibility like its transcript:
      a chat the caller may not see is `404`. The slots are what the visitor
      told the AI; a `sensitive` one is shown to the console to hide behind a
      reveal. Never served to the widget.

      `conversation` is null when the AI never took part in the connection.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
      - name: thread_id
        in: query
        description: |
          Which connection — any id `Chat.connections` lists (Panelde: Chat
          ID, bağlantı). Defaults to the most recent one. A thread of another
          chat is `404`.
        schema: { type: string, minLength: 1, maxLength: 64 }
    responses:
      "200":
        description: The AI's state on the connection
        content:
          application/json:
            schema:
              type: object
              required: [chat_id, thread_id, conversation]
              properties:
                chat_id: { type: string, description: The day (panel "Thread ID"). }
                thread_id:
                  type: string
                  nullable: true
                  description: The connection read (panel "Chat ID"); null for a chat with none.
                conversation:
                  allOf:
                    - $ref: "../openapi.yaml#/components/schemas/AiConversationState"
                  nullable: true
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

customerContext:
  get:
    tags: [Chats]
    operationId: getChatCustomerContext
    summary: The player card beside a chat
    description: |
      Who the chat's player is, what they answered before the chat started,
      the day's other connections and the days before it (IN-02) — what the
      inbox's player card reads in one call.

      - `customer`: the record's name, username, email, country, the city of
        the newest visit. Email and username are null for a caller without
        `customers.contact.view` (RL-02-S2), and `contact_visible` says so.
      - `pre_chat`: the connection's `filled_form` answers, else the contact
        fields of the pre-chat form the player filled in.
      - `today`: the chat's other connections, the newest 20, newest first
        (the open or newest one is the chat itself). Empty for a chat filed
        under no day.
      - `history`: the player's other chats of the last 90 days, one row per
        day, newest first, 20 a page (`page_id`). A day the caller may not
        open — no team of theirs and not theirs — is a restricted row
        (`accessible: false`): when it started and its teams' queue topics
        only; id, end, assignee, teams, tags, summary, rating and card are
        empty.
        `restricted_count` counts them over the whole window.

      Agents and bots only, behind the chat's visibility like its transcript:
      a chat the caller may not see, or another workspace's, is `404`.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
      - $ref: "../openapi.yaml#/components/parameters/PageId"
    responses:
      "200":
        description: The player card
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CustomerContext" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

timeline:
  get:
    tags: [Chats]
    operationId: getChatTimeline
    summary: Everything that happened in a conversation, in one list
    description: |
      The conversation's timeline (ID-09): its messages and internal notes,
      the AI's decisions (procedure, step, sources, hand-over reason) and
      procedure runs, assignment and the queue, transfers, tags, the closing
      and reopening lines, the rating, SLA misses, tickets opened from it and
      the audit rows whose target is the chat — oldest first, ordered by
      `(at, kind, id)`, 200 rows a page (`page_id`).

      Who may open it is the permission matrix's `timeline.view`, inside
      `chats.view` (ID-09-S1): `own` — a chat the person is assigned to or has
      joined; `team` — one routed to a team of theirs; `all` — any chat they
      may see. A chat outside that reach, or another workspace's, is `404`
      (NFR-S5); a role at `none` is `403` `capability_required`. The audit rows
      are only for a caller who may read the audit log (`audit`). The player's
      email and username are blanked out of the text for a caller without
      `customers.contact.view`.

      Agents and bots only.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
      - name: thread_id
        in: query
        description: |
          One connection of the day (Panelde: Chat ID) — any id
          `Chat.connections` lists. Absent: the whole day (Panelde: Thread
          ID). A thread of another chat is `404`.
        schema: { type: string, minLength: 1, maxLength: 64 }
      - name: kinds
        in: query
        description: Comma-separated kinds to keep; absent keeps every kind.
        schema: { type: string, maxLength: 200 }
      - $ref: "../openapi.yaml#/components/parameters/PageId"
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
    responses:
      "200":
        description: One page of the timeline
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/TimelinePage" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

timelineExport:
  post:
    tags: [Chats]
    operationId: exportChatTimeline
    summary: Download a conversation's timeline
    description: |
      The timeline as a file (ID-09 §5), streamed, at most 20,000 rows:
      `csv` (headers "Thread ID (chat_id)" and "Chat ID (thread_id)"),
      `ndjson` (one `TimelineItem` a line) or `txt` (one line a row, a
      separator between connections).

      Masked by default (`mask_pii`): the player's email, username and name
      and every email, phone and card pattern in the text are blanked.
      Exporting is `timeline.export` (ID-09-S2, Yönetici and Kurucu by
      default); `mask_pii: false` is `timeline.export_unmasked`, the
      Founder's alone (ID-09-S3) — either missing is `403`
      `capability_required`. The reach is the timeline's (`404` outside it).
      Every export writes `chat.timeline_exported` to the audit log before
      the first byte.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [format]
            additionalProperties: false
            properties:
              format: { type: string, enum: [csv, ndjson, txt] }
              thread_id:
                type: string
                minLength: 1
                maxLength: 64
                description: "One connection (Panelde: Chat ID); absent exports the whole day."
              mask_pii: { type: boolean, default: true }
    responses:
      "200":
        description: The file
        content:
          text/csv:
            schema: { type: string }
          application/x-ndjson:
            schema: { type: string }
          text/plain:
            schema: { type: string }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

transcript:
  get:
    tags: [Chats]
    operationId: getThreadTranscript
    summary: Download one connection's transcript
    description: |
      One connection's transcript as a file (AR-04), streamed:
      `txt` (plain text) or `html` (a printable page — the browser's "Save
      as PDF" keeps every Turkish letter). Headed with the workspace, the
      Thread ID (`chat_id`) and the Chat ID (`thread_id`), the player's
      username, the start and end in the workspace's time zone, the agents,
      and who exported it when. A file is listed by its name with a note to
      open it in the panel — no link to it.

      `audience=customer` is the player's copy: no internal note.
      `audience=internal` carries them, marked as notes (AR-04-S2).

      Who may: the permission matrix's `transcripts.export`, inside
      `chats.view` (AR-04-S1, Ekip Lideri and up by default): `own` — a
      connection the person was assigned, wrote on or joined; `team` — one
      routed to a team of theirs; `all` — any they may see. A role at `none`
      is `403` `capability_required`; a chat or connection outside the reach,
      or another workspace's, is `404` (NFR-S5). At most 10 downloads,
      prints and mails a person a minute (`429`). Every download writes
      `chat.transcript_exported` (format and copy, no text) to the audit log
      before the first byte.

      Agents only.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
      - name: threadId
        in: path
        required: true
        description: "One connection of the day (Panelde: Chat ID)."
        schema: { type: string, minLength: 1, maxLength: 64 }
      - name: format
        in: query
        schema: { type: string, enum: [txt, html], default: txt }
      - name: audience
        in: query
        schema: { type: string, enum: [customer, internal], default: customer }
    responses:
      "200":
        description: The file (`Content-Disposition` attachment)
        content:
          text/plain:
            schema: { type: string }
          text/html:
            schema: { type: string }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

transcriptEmail:
  post:
    tags: [Chats]
    operationId: emailThreadTranscript
    summary: Mail the player's copy of one connection's transcript
    description: |
      Mails the player's copy (no internal note) of one connection (AR-04),
      in the template the closing transcript uses, to `to`: the player's own
      address, or one at a domain the workspace allows
      (`transcript_allowed_domains`, AR-04-S3). Any other address is `403`
      `recipient_not_allowed`. The internal copy is never mailed.

      Who may: `transcripts.export` as for the download — or, for anyone who
      can see the connection, the player's own address on a connection the
      person was assigned, wrote on or joined (AR-04-S1). Counted against
      the workspace's daily outbound mail cap; the same 10 a minute as the
      download. Answers `202` once the mail is handed to the carrier and
      writes `chat.transcript_emailed` (the recipient's domain, whether it
      was the player's address — no address, no text).

      Agents only.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
      - name: threadId
        in: path
        required: true
        description: "One connection of the day (Panelde: Chat ID)."
        schema: { type: string, minLength: 1, maxLength: 64 }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              to:
                type: string
                format: email
                maxLength: 254
                description: >-
                  The recipient. Absent: the player's registered address — for
                  a caller who may not see it (`customers.contact.view`). A
                  player with no address is `400`.
              audience:
                type: string
                enum: [customer]
                default: customer
                description: Only the player's copy is mailed.
    responses:
      "202":
        description: Accepted for delivery
        content:
          application/json:
            schema:
              type: object
              required: [accepted]
              properties:
                accepted: { type: boolean, enum: [true] }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

supervise:
  post:
    tags: [Chats]
    operationId: superviseChat
    summary: Register (or refresh) the caller as a supervisor of this chat
    description: |
      Records that the caller is *watching* a conversation someone else is
      handling — the state the Traffic board reports as `supervised`
      (FR-MOD-13.2). Supervising is not assignment: nothing about the thread,
      its assignee or its routing changes.

      **Read scopes, deliberately.** Watching is a read, so a token that may
      already open the transcript may register as a watcher; no chat *write*
      scope is asked for. What a `chats--access:ro` token may watch is exactly
      what it may open — a conversation reachable through one of the caller's
      teams, or one handed to them personally.

      **Idempotent heartbeat.** A second call from the same agent updates
      `last_seen_at` on the one existing row instead of adding another, so the
      client can simply repeat the call on a timer. A row whose `last_seen_at`
      has fallen outside the liveness window is a closed tab, not a watcher, and
      stops counting as live — which is why the refresh matters. Two different
      agents watching one chat are two rows.

      Always `200`: registering and heart-beating are the same call, and the
      caller has no use for the distinction.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    responses:
      "200":
        description: Watching, with the heartbeat refreshed
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ChatSupervision" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      # Also the answer for a chat in another workspace, and for one the
      # caller's teams do not reach: a 403 would confirm the id is real
      # (NFR-S5).
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

  delete:
    tags: [Chats]
    operationId: stopSupervisingChat
    summary: Stop supervising this chat
    description: |
      Removes **the caller's own** watch on the conversation and nothing else.
      One supervisor closing their tab never clears another's row. Releasing a
      chat that was not being watched succeeds too — stopping something that is
      already stopped is not an error.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    responses:
      "204": { description: No longer watching }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

tags:
  post:
    tags: [Chats]
    operationId: tagThread
    summary: Tag the current thread
    description: Tags describe a thread, not a chat — what a conversation is about can change between visits.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tag]
            properties:
              tag: { type: string, minLength: 1, maxLength: 64 }
    responses:
      "200":
        description: Applied (or already present)
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items: { type: string }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

tag:
  delete:
    tags: [Chats]
    operationId: untagThread
    summary: Remove a tag from the current thread
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
      - name: tagName
        in: path
        required: true
        schema: { type: string }
    responses:
      "204": { description: Removed }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }

seen:
  post:
    tags: [Chats]
    operationId: markEventsAsSeen
    summary: Record how far the caller has read
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ChatId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [seen_up_to]
            properties:
              seen_up_to: { type: string, format: date-time }
    responses:
      "204": { description: Recorded }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
