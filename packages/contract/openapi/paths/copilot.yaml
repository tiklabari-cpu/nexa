knowledge:
  get:
    tags: [Copilot]
    operationId: listCopilotKnowledge
    summary: Copilot's own knowledge sources
    deprecated: true
    description: |
      The knowledge sources for agents only (FR-MOD-12.2): the part of the
      workspace's single knowledge store whose audience is Copilot alone
      (tm 309 · AI-14, owner decision K11; `docs/adr/single-knowledge-store.md`).
      None of them ever reaches a player. Copilot itself drafts from these and
      from every source the AI agent answers from.

      **Deprecated:** kept as a filtered view of the one store, listing the
      same sources before and after the store became one —
      `audiences = [copilot]` exactly, the ones added for agents; a published
      KB article's source is its article's to manage and is not listed here.
      The store's single list, `GET /knowledge-sources?audience=all`
      (tm 309.2), takes its place. Reachable only by an agent/bot token. A
      customer token gets a 404, not a 403, so the widget surface cannot be
      used to probe for it.
    responses:
      "200":
        description: Sources
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/KnowledgeSource" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Copilot]
    operationId: createCopilotKnowledge
    summary: Add a source to the copilot knowledge base and index it
    deprecated: true
    description: |
      Adds a source for agents only — Copilot uses it, the AI agent's answers
      to players never do (tm 309 · AI-14). Chunked and embedded on save,
      answerable immediately. A `website` source is crawled from `source_url`
      (guarded against private/internal targets, SSRF — NFR-S7); every other
      type indexes `content`. Exactly one is required. When the embedding
      provider cannot index the text the answer is a 503 and nothing is
      created. **Deprecated** with `GET /copilot/knowledge`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 200 }
              content: { type: string, minLength: 1, maxLength: 100000 }
              source_url:
                {
                  type: string,
                  minLength: 1,
                  maxLength: 2048,
                  description: "Required when type is website.",
                }
              type: { type: string, enum: [website, file, article, faq], default: article }
    responses:
      "201":
        description: Indexed
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/KnowledgeSource" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }
      "503": { $ref: "../openapi.yaml#/components/responses/EmbeddingUnavailable" }

knowledgeSource:
  parameters:
    - name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }

  delete:
    tags: [Copilot]
    operationId: deleteCopilotKnowledge
    summary: Remove a copilot source and everything indexed from it
    deprecated: true
    description: |
      Removes a source for agents only; any other source of the store is a
      404 here, even given its id. **Deprecated** with `GET /copilot/knowledge`.
    responses:
      "204": { description: Deleted }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

summary:
  parameters:
    - name: chatId
      in: path
      required: true
      schema: { type: string }

  post:
    tags: [Copilot]
    operationId: copilotSummary
    summary: Summarise a conversation, as an internal note when the chat is active
    description: |
      On an active chat, writes the summary as an internal note (FR-MOD-12.3 /
      02.5) — visible to the team, never to the customer, and preserved in the
      archived transcript. Records a copilot assist either way, so the chat
      counts as "assisted" in Reports (07.3.2).

      On an archived chat (FR-MOD-02.8), the summary is still produced — that is
      the moment an agent is most likely to want one — but archive is read-only,
      so no internal note is written and `note_event_id` comes back null.

      Who writes it is the deployment's `LLM_PROVIDER` (tm 257.5). On `mock`
      it is the deterministic stub's summary, in English, whatever `language`
      asks for. On a model, the conversation (card numbers masked, long ones
      shortened to fit `LLM_MAX_PROMPT_CHARS`, oldest middle messages first) is
      summarised in `language`; when the model does not answer, the response is
      a 503 and nothing is written — no note and no assist. A model call counts
      against today's AI allowance (tm 257.8); once that is used up the
      response is a 429 with `error.details.reason: ai_daily_cap`, the model is
      not called and nothing is written.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              language:
                type: string
                enum: [en, tr]
                default: en
                description: The panel language the summary is written in. Ignored by the `mock` provider.
    responses:
      "201":
        description: Summary produced, written as an internal note when the chat is active
        content:
          application/json:
            schema:
              type: object
              required: [summary, note_event_id]
              properties:
                summary: { type: string }
                note_event_id:
                  type: string
                  nullable: true
                  description: Null when the chat is archived — no internal note is written.
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }
      "503": { $ref: "../openapi.yaml#/components/responses/LlmUnavailable" }

reply:
  parameters:
    - name: chatId
      in: path
      required: true
      schema: { type: string }

  post:
    tags: [Copilot]
    operationId: copilotReply
    summary: Draft a reply from the knowledge store
    description: |
      Retrieves from the workspace's knowledge store using the customer's
      latest message and returns a suggested reply for the agent to edit and
      send (FR-MOD-12.3). Copilot draws on every source it may use (tm 309.2 ·
      AI-14): what the AI agent answers players from and what is for agents
      only, for this chat's brand or every brand — a chat whose brand is not
      known draws on the every-brand sources only, so a draft for one brand's
      player never quotes another brand's rule. Returns an empty draft when nothing relevant is found rather
      than inventing an answer — and equally when the search could not run
      because the embedding provider did not answer: the agent writes the reply
      themselves, and no draft is better than one from a search that failed.
      The question's embedding is counted against the workspace's daily AI
      allowance (tm 257.20); when today's cap cannot take it the draft is empty
      too, and `reason` says so, so the panel can tell the agent the allowance
      is used up rather than that nothing matched.
    responses:
      "200":
        description: A suggested reply
        content:
          application/json:
            schema:
              type: object
              required: [draft, sources]
              properties:
                draft: { type: string }
                sources:
                  type: array
                  items:
                    type: object
                    required: [name, score]
                    properties:
                      name: { type: string }
                      score: { type: number }
                reason:
                  type: string
                  enum: [ai_daily_cap]
                  description: |
                    Present only when the draft is empty because today's AI
                    allowance (the workspace's or the deployment's) is used up;
                    it renews at 00:00 UTC.
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

ask:
  post:
    tags: [Copilot]
    operationId: copilotAsk
    summary: Ask Copilot a knowledge or report question from any screen
    description: |
      The Copilot drawer's one question (IN-09, tm 366.1): asked from any
      page of the console — Reports, Settings, the archive — not only from a
      chat. Every agent may ask; nothing here is sent to a player.

      The question is first told apart: a **report** question (`kind: bi`) or
      a **knowledge** question. The BI dictionary decides when it places a
      report figure; otherwise the model is asked which of the two it is
      (`tier: fast`; on the `mock` provider a fixed word rule answers, and so
      it does when the model does not). The model only says which way to
      answer — it never answers a report question.

      - **Report** (`kind: bi`): answered the way `POST /copilot/bi` answers,
        from the figures `GET /reports/overview` serves (ADR-09). Asking one
        needs `reports_read`: without it `reason` is `not_permitted`, the
        answer says so and no report is read. A question about a figure the
        BI command does not know is `not_understood`; a known figure with
        nothing in the window, `no_data`.
      - **Knowledge**: searched in the workspace's one knowledge store, in
        every source Copilot may use (`audiences` names `ai_agent` or
        `copilot`, tm 309), and written up from the passages found as a
        cited answer (the `knowledge_answer` object, ADR LLM §6a). `kind: kb`
        with the sources it is drawn from — each with when a person last
        reviewed it, so a stale source is visible. When nothing answers it
        Copilot says it does not know: `kind: unknown`, `reason: no_answer`,
        no sources — an answer is never invented.

      With `context.chat_id` the question is asked about that conversation:
      the chat must be one the caller can see (404 otherwise), and the
      knowledge searched is the chat's brand's and every brand's, as a reply
      draft's is. Without it every brand's sources are searched.
      `context.route` is the page the drawer was opened on; it is logged,
      never stored.

      Not kept: the question and the answer live in the drawer for the
      session only. The server writes one `copilot.ask` audit entry per
      question with its `kind` and no words, and the model calls count
      against today's AI allowance (tm 257.8): once that is used up the
      response is a 429 with `error.details.reason: ai_daily_cap`, before
      anything is read. When the model or the embedding provider does not
      answer, a 503 — nothing to retry but the question.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [question]
            properties:
              question: { type: string, minLength: 1, maxLength: 2000 }
              context:
                type: object
                properties:
                  route:
                    type: string
                    maxLength: 200
                    description: The console path the drawer was opened on, e.g. `/reports`.
                  chat_id:
                    type: string
                    description: The conversation open in the inbox, when there is one.
    responses:
      "200":
        description: |
          Always 200 once the question was asked — a question Copilot cannot
          answer is a `kind` and a `reason`, not a 4xx.
        content:
          application/json:
            schema:
              type: object
              required: [answer, sources, kind]
              properties:
                answer: { type: string }
                sources:
                  type: array
                  description: The knowledge sources a `kb` answer is drawn from; empty otherwise.
                  items:
                    type: object
                    required: [id, title, reviewed_at]
                    properties:
                      id: { type: string, format: uuid }
                      title: { type: string }
                      reviewed_at: { type: string, format: date-time }
                kind:
                  type: string
                  enum: [kb, bi, unknown]
                  description: |
                    `kb` — answered from the knowledge store. `bi` — a report
                    question, answered or refused (see `reason`). `unknown` —
                    nothing in the knowledge store answers it.
                reason:
                  type: string
                  enum: [not_permitted, not_understood, no_data, no_answer]
                  description: |
                    Present when there is no answer to show as one:
                    `not_permitted` — a report question asked without
                    `reports_read`; `not_understood` — a report question
                    about no figure Copilot knows; `no_data` — a known figure
                    with nothing to report in the window; `no_answer` — the
                    knowledge store does not answer it.
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }
      "503": { $ref: "../openapi.yaml#/components/responses/LlmUnavailable" }

bi:
  post:
    tags: [Copilot]
    operationId: copilotBi
    summary: Answer a report/metric question about the workspace's own activity
    description: |
      Copilot's BI command (FR-MOD-12, §5.5 "BI komutu") — the chat-context
      counterpart to the palette's account-wide AI query (FR-MOD-01.1.3,
      `POST /palette/ai-query`). The two surfaces are deliberately separate:
      one endpoint never has to serve two different authorization contexts.

      Deterministic (`@siyahtus/ai-mock`, no real LLM): the question is matched
      against a small set of known report metrics and, on a match, reads the
      figure straight out of the same builder `GET /reports/overview` uses
      (ADR-09) — Copilot never computes its own number, so it can never
      disagree with Reports. An unrecognised question is not an error —
      `kind: 'not_understood'` comes back with a 200, the same way an
      unmatched skill intent or an empty knowledge match elsewhere in this
      API is a 200 with an empty/negative result rather than a 4xx.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [question]
            properties:
              question: { type: string, minLength: 1, maxLength: 500 }
    responses:
      "200":
        description: |
          Always 200 once the request itself is valid — an unmatched question
          or a matched metric with nothing to report is a `kind`, not a 4xx.
        content:
          application/json:
            schema:
              type: object
              required: [answer, kind, metric, value, range]
              properties:
                answer: { type: string }
                kind:
                  type: string
                  enum: [metric, no_data, not_understood]
                  description: |
                    `metric` — a figure was found and `answer` quotes it.
                    `no_data` — the metric was understood but the window has
                    nothing to report yet (e.g. no ratings, so no satisfaction
                    score). `not_understood` — the question matched no known
                    metric.
                metric:
                  type: string
                  nullable: true
                  description: |
                    Which report field `answer` quotes, e.g. `totals.chats`.
                    Null unless `kind` is `metric` or `no_data`.
                value:
                  type: number
                  nullable: true
                  description: |
                    The same number `GET /reports/overview` would return for
                    this window (ADR-09). Null unless `kind` is `metric`.
                range:
                  type: object
                  nullable: true
                  description: The window `value` was computed over. Null unless `kind` is `metric`.
                  required: [from, to]
                  properties:
                    from: { type: string, format: date-time }
                    to: { type: string, format: date-time }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

enhance:
  parameters:
    - name: chatId
      in: path
      required: true
      schema: { type: string }

  post:
    tags: [Copilot]
    operationId: copilotEnhance
    summary: Rewrite a draft in a chosen register
    description: |
      Improves the grammar or tone of a draft reply (FR-MOD-12.3) — rephrase,
      friendlier, more formal, or a plain grammar tidy.

      Who writes it is the deployment's `LLM_PROVIDER` (tm 257.6). It is
      deterministic only with the stub (`mock`, the default): the same draft then
      always yields the same rewrite. With a configured model the output can
      differ between calls, the draft is rewritten in its own language (not
      translated), and card numbers are masked in what is sent and what comes
      back. When the model does not answer — or answers with more than 10 000
      characters, which could not be sent — the response is a 503 and nothing is
      recorded. In the public pilot (`GET /deployment` `pilot_mode`) a draft
      longer than 2 000 characters is refused with a 400 whose
      `error.details.reason` is `enhance_too_long`, before any model call. A
      model call counts against today's AI allowance (tm 257.8); once that is
      used up the response is a 429 with `error.details.reason: ai_daily_cap`
      and nothing is recorded.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [text]
            properties:
              text: { type: string, minLength: 1, maxLength: 10000 }
              mode: { type: string, enum: [rephrase, friendly, formal, grammar], default: rephrase }
    responses:
      "200":
        description: The rewritten draft
        content:
          application/json:
            schema:
              type: object
              required: [text, mode]
              properties:
                text: { type: string }
                mode: { type: string, enum: [rephrase, friendly, formal, grammar] }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }
      "503": { $ref: "../openapi.yaml#/components/responses/LlmUnavailable" }
