# Custom field definitions (FR-MOD-08.7.6).
#
# A workspace declares extra fields on tickets or contacts — a player id, a KYC
# status, an account balance — each with a `type` (how a value is validated) and
# a `required` flag (KK "Tip/zorunluluk"). Managed under /settings on the
# workspace-admin scopes (`access_rules:ro`/`:rw`), because a definition spans
# both entities and is an admin act. The values themselves are set on the ticket
# and customer resources.

customFields:
  get:
    tags: [Settings]
    operationId: listCustomFields
    summary: List custom field definitions
    description: |
      In `position` order (oldest first among equals). Optionally filtered to
      one entity.
    parameters:
      - name: entity
        in: query
        required: false
        schema: { type: string, enum: [ticket, contact] }
    responses:
      "200":
        description: The custom field definitions
        content:
          application/json:
            schema:
              type: object
              required: [items, total]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/CustomFieldDefinition" }
                total: { type: integer }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Settings]
    operationId: createCustomField
    summary: Define a custom field
    description: |
      A label is unique per (workspace, entity): defining a second field with
      the same label on the same entity is a 400. The `type` is immutable once
      set — a re-typed field is a new field.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [entity, label, type]
            properties:
              entity: { type: string, enum: [ticket, contact] }
              label: { type: string, minLength: 1, maxLength: 120 }
              type:
                { type: string, enum: [text, number, boolean, date, select, multiselect, topic] }
              required:
                type: boolean
                description: Whether a value may be left blank. Defaults to false.
              form_placement:
                type: string
                enum: [pre_chat, post_chat, ticket, prospect]
                nullable: true
                description: |
                  Also ask this field as a widget form (FR-MOD-08.7.7). The
                  placement decides the entity (`ticket` on a ticket field,
                  the rest on a contact field); a mismatch is a 400. A `topic`
                  must be `pre_chat`.
              options:
                type: array
                maxItems: 50
                items: { $ref: "../openapi.yaml#/components/schemas/CustomFieldOption" }
                description: |
                  Required (1–50) for `select`, `multiselect` and `topic`,
                  refused for any other type. Only a topic option may name a
                  `target_group_id`, and it must be one of the workspace's
                  teams. A second topic in the workspace is a 400.
              show_in_table:
                type: boolean
                description: |
                  Also render this field as a row-inline column on the
                  Contacts table (FR-MOD-03.2.3). Only a `contact` field may
                  set this; a `ticket` one is a 400. Defaults to false.
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CustomFieldDefinition" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

customField:
  parameters:
    - name: fieldId
      in: path
      required: true
      schema: { type: string, format: uuid }

  patch:
    tags: [Settings]
    operationId: updateCustomField
    summary: Edit a custom field — label, required, placement, options, order
    description: |
      Only the fields present in the body change. The `entity` and `type` are
      immutable — changing a field's type would leave stored values validated
      against a rule that no longer holds. `position` moves the field within
      its form (WG-04): the others of that form shift to make room.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              label: { type: string, minLength: 1, maxLength: 120 }
              required: { type: boolean }
              form_placement:
                type: string
                enum: [pre_chat, post_chat, ticket, prospect]
                nullable: true
                description: |
                  Move the field between the widget forms, or null to stop
                  asking it and keep it as a CRM-only field (FR-MOD-08.7.7).
                  It joins the end of its new form. A `topic` stays `pre_chat`.
              options:
                type: array
                maxItems: 50
                items: { $ref: "../openapi.yaml#/components/schemas/CustomFieldOption" }
                description: Replace a choice field's options (same rules as on create).
              position:
                type: integer
                minimum: 0
                description: |
                  The field's new place in its form, 0 first; past the end
                  means last.
              show_in_table:
                type: boolean
                description: |
                  Show or hide this field as a Contacts table column
                  (FR-MOD-03.2.3). Setting it true on a `ticket` field is a 400.
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CustomFieldDefinition" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  delete:
    tags: [Settings]
    operationId: deleteCustomField
    summary: Delete a custom field
    description: Its stored values on every ticket or contact are removed with it.
    responses:
      "204": { description: Deleted }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
