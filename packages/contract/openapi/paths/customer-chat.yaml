# Customer Chat API — the surface the widget talks to.
#
# Deliberately separate from the agent routes rather than the same endpoints with
# fields filtered out. A customer has one conversation and no concept of teams,
# assignment or internal notes; reusing the agent surface would mean every field
# added there is exposed to the widget until someone remembers to hide it.
#
# Every route requires a customer token. An agent token is refused with 404 — not
# 403 — so the surface cannot be probed.

state:
  get:
    tags: [Customer]
    operationId: getCustomerChatState
    summary: The widget's entire conversation state
    description: |
      One round-trip on load rather than three. On a slow connection that is the
      difference between the panel opening with the conversation already in it
      and opening empty.

      `online` reflects whether any agent is currently accepting chats, so the
      widget can say nobody is available instead of implying an instant reply.
      Internal notes are excluded in SQL, not filtered afterwards — a short page
      that dropped them later would still leak that something was hidden.

      This is also how a campaign reaches a visitor (FR-MOD-03.3.2): the widget
      polls this, and a poll that finds a proactive message owed carries it in
      `campaign` and records the delivery in the same transaction. That makes
      this GET non-idempotent, which is only acceptable because it needs a
      customer token — no crawler or speculative fetch can consume a campaign.
      See the `campaign` field for the delivery guarantee.
    responses:
      "200":
        description: Current state for this visitor
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CustomerChatState" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

events:
  post:
    tags: [Customer]
    operationId: sendCustomerMessage
    summary: Send a message, opening a conversation if there is not one
    description: |
      A single endpoint because from the widget's side there is no difference: a
      visitor types and presses enter. Making the client choose between "start"
      and "send" invites a race where two first messages each try to start a
      conversation.

      Returns 201 when the message was recorded, 200 when an `idempotency_key`
      replayed an earlier one.

      **The member's day (ID-02).** `chat_id` is the member's conversation for
      the day ("Thread ID" in the panel), and each visit is a connection inside
      it ("Chat ID", the event's `thread_id`). A message goes into the open
      connection; with none open it opens one — the day's first opens the chat,
      a later one the same day opens a further connection under the *same*
      `chat_id`, and the next day starts a new chat. Days follow the
      workspace's day boundary (`/settings/chat-timeout`). A connection still
      open from an earlier day keeps taking messages while it is live, so a
      conversation crossing midnight is not split; once it has been silent for
      the idle window it is closed and the message opens today's. Two first
      messages sent at once land in one connection. `queue_position` is present
      when the message opened a connection.

      A customer cannot write an internal note. The field is not accepted here at
      all, rather than accepted and downgraded silently.

      A message must carry text, an `attachment_url`, or both — an attachment may
      stand alone (FR-MOD-11.4). A `postback` (a card's `send_message`
      button, EN-02) is a message too: its text is the button's label. The attachment must be a file this workspace
      uploaded through `/uploads`; any other value is refused.

      **Pre-chat requirements (WG-01).** A message that would *open* a
      connection is refused with 400 `validation_error` — nothing written,
      not even the other pre-chat values — when the brand's saved pre-chat form
      (`/settings/prechat`) is on and requires `name`, `username` or `email`
      and the request neither carries it nor finds it already on the contact.
      `details.fields` names each missing one. The brand is the one whose
      website minted the token. A workspace that has never saved the setting
      is not checked here, and a message into an existing conversation never
      is.

      **The human check (tm 339.2 · GV-01).** A message that would *open* a
      connection is answered `403 challenge_required` — nothing written — when
      the workspace's `captcha_mode` is `always_on_chat_start`, or it is
      `risk` and a risk signal fires: many new visitors from this address in
      the last 10 minutes, more messages from this visitor in the last minute
      than the deployment allows, or many AI turns for this member today.
      `details` (`ChallengeRequiredDetails`) names the reason and the check to
      show; the widget repeats the message with the check's answer as
      `challenge_token`. Never asked of a visitor whose member token this
      workspace signed (ID-03 · K4), nor of one who passed a check in the last
      12 hours. When the provider cannot be reached the conversation opens,
      but the AI does not answer this visitor for an hour.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: At least one of `text` or `attachment_url` is required.
            properties:
              text: { type: string, minLength: 1, maxLength: 10000 }
              attachment_url:
                type: string
                maxLength: 2048
                description: A `file_url` from `/uploads`. May be sent without text.
              url:
                type: string
                maxLength: 2048
                description: Page the visitor is on. Feeds the routing rules.
              referrer:
                type: string
                maxLength: 2048
                description: |
                  Where the visitor arrived from, recorded once as the visit's
                  `came_from` (FR-MOD-13.2). Only the loader can supply it: a
                  cross-origin frame's own `document.referrer` is the embedding
                  page, not the page before it.

                  Stored as origin + path — the query string and fragment are
                  dropped server-side whatever is sent, because a referrer's
                  query string is where reset tokens and e-mail addresses live
                  (NFR-S9). Omit it for a direct arrival; `came_from` then stays
                  null and the agent's panel simply says nothing.
              name: { type: string, maxLength: 120, description: Pre-chat form value. }
              username:
                type: string
                maxLength: 120
                description: |
                  Pre-chat form value: the visitor's username on the embedding
                  site, stored on the contact as typed. Free text — the widget
                  cannot verify it, so it is a hint for the agent, not an identity.
              email: { type: string, format: email, maxLength: 320 }
              locale:
                type: string
                enum: [en, tr, de, fr, es, it, pt, ar]
                description: |
                  The language the widget is showing (WG-02). Recorded on the
                  contact when this message opens a conversation, and used for
                  the visitor's transcript e-mail. Optional: an older widget
                  omits it and the e-mail reads in English.
              custom_fields:
                type: object
                description: |
                  Answers to the workspace's pre-chat form (FR-MOD-08.7.7):
                  contact custom-field id → value, as delivered in the token
                  response's `pre_chat_form`. Each is validated against its
                  definition (type + required) and written to the contact; a
                  bad answer is a 400 and no conversation is opened. A null
                  clears a field. The post-chat half posts separately, to
                  `/customer/chat/form-response`.
                additionalProperties:
                  type: string
                  nullable: true
                  maxLength: 5000
              idempotency_key: { type: string, maxLength: 128 }
              challenge_token:
                type: string
                maxLength: 2048
                description: |
                  The human check's answer (tm 339.2), sent only after an
                  opening message was answered `403 challenge_required`.
                  Verified only when the message opens a conversation and is
                  flagged; otherwise ignored.
              postback:
                $ref: "../openapi.yaml#/components/schemas/CardPostbackInput"
    responses:
      "200":
        description: Idempotent replay — the original event, no new message
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CustomerMessageResult" }
      "201":
        description: Message recorded
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CustomerMessageResult" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "402":
        description: |
          The license is read-only (expired trial). Existing conversations stay
          readable; new messages are refused.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "403":
        description: |
          `customer_banned`, `message_rejected` (the spam filter), or
          `challenge_required` (tm 339.2) with `ChallengeRequiredDetails` as
          `details`.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

typing:
  post:
    tags: [Customer]
    operationId: sendCustomerTyping
    summary: Tell the agent the visitor is typing (sneak-peek)
    description: |
      Live typing preview (FR-MOD-02.9 / 11.8). While the visitor types, the
      widget sends this — debounced — so the agent sees "the visitor is typing"
      and, when `text` is included, a preview of the in-progress message before it
      is sent. On stop or send it is called once with `is_typing: false`.

      Ephemeral by design: nothing is persisted. The preview reaches agents only,
      never the visitor's own side, and is capped in length. A call with no open
      conversation succeeds and does nothing — a visitor typing into an empty
      panel is not an error.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [is_typing]
            properties:
              is_typing: { type: boolean }
              text:
                type: string
                maxLength: 500
                description: |
                  The in-progress text, shown to the agent as a sneak-peek. Only
                  meaningful when `is_typing` is true; capped and never stored.
    responses:
      "204":
        description: Accepted — typing state fanned out to the agents on the chat
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

visit:
  post:
    tags: [Customer]
    operationId: recordCustomerVisit
    summary: Report the page the visitor is on, and the site's session variables
    description: |
      Campaign targeting (EN-03). The widget calls this when the host page
      changes without a reload (a single-page site's `pushState` /
      `popstate`) and when the site calls `siyahtus('setSessionVariables')`.
      The page is recorded as a page view of the visitor's visit — the same
      record the first message and the token mint write — and the running
      campaigns are evaluated against it in the same transaction.

      Sent only while the mint said `campaign_tracking` (the workspace has a
      campaign running), debounced by the widget, and inside the customer
      token's rate limit (60 per minute). A repeated page is not written again
      but is evaluated again: a campaign can start while the visitor stands
      still.

      `variables` replaces the visit's set. They come from the visitor's
      browser and are not verified: they are used for campaign targeting only
      (`custom_var` rules), never returned by any API, never shown to the AI.
      A card number in a key or a value is masked before it is stored.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url]
            additionalProperties: false
            properties:
              url:
                type: string
                maxLength: 2048
                description: The host page's URL (http or https).
              referrer:
                type: string
                maxLength: 2048
                description: |
                  Where the visitor came from; kept as the visit's origin only
                  when this page view opens the visit.
              variables:
                type: object
                maxProperties: 20
                description: |
                  The site's session variables: at most 20, each key and value
                  at most 100 characters. A number or a boolean is kept as its
                  text.
                additionalProperties:
                  oneOf:
                    - { type: string, maxLength: 100 }
                    - { type: number }
                    - { type: boolean }
    responses:
      "204":
        description: Recorded and evaluated.
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

campaignShown:
  post:
    tags: [Customer]
    operationId: markCustomerCampaignShown
    summary: The widget showed a campaign card that waited for the browser
    description: |
      For a campaign that reached the widget with `show_when` (EN-03): the
      card has just been shown, so the send counts as displayed now — not on
      the poll that carried it, which would count every visitor who never
      reached the exit intent or the time on the page. Stamped once; a repeat
      answers 204 and changes nothing. A campaign shown without `show_when`
      was already counted by its poll.

      404 when this visitor has no send of that campaign, or it was held back
      for a risk flag.
    parameters:
      - name: campaignId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "204":
        description: Counted as displayed (or already was).
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

campaignClicked:
  post:
    tags: [Customer]
    operationId: markCustomerCampaignClicked
    summary: The visitor pressed a button on a campaign card
    description: |
      For a card's `open_url` and `copy_coupon` buttons (EN-02), which
      write nothing into a conversation: the send's `clicked_at` is
      stamped, once. A `send_message` button needs no call of its own — its
      message (`postback` on `POST /customer/chat/events`) stamps it.

      404 when this visitor has no send of that campaign, it was held back
      for a risk flag, or the campaign shows no card with that button.
    parameters:
      - name: campaignId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [button]
            properties:
              button:
                type: integer
                minimum: 0
                maximum: 4
                description: The button's position on the card, from 0.
    responses:
      "204":
        description: Counted (or already was).
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

requestHuman:
  post:
    tags: [Customer]
    operationId: requestCustomerHuman
    summary: Ask for a person instead of the AI ("Talk to an agent")
    description: |
      The widget's always-visible button while the AI answers the connection
      (AI-29 · G16). The AI hands the connection over at once — no clarifying
      question, the press is the request — with reason `player_request`, to
      the team its routes give (AI-12), and says nothing more (AI-11). The
      player is told a person is coming, or, when nobody at the target is
      accepting chats, the after-hours text; the conversation waits in the
      queue either way and is never dropped.

      Idempotent: a connection a person or the queue has already is answered
      with its owner and `requested: false`, and two presses at once hand it
      over once. Limited per visitor (GV-01): 429 with `Retry-After`.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason:
                type: string
                enum: [button]
                description: How the player asked; the button is the only way today.
    responses:
      "200":
        description: The connection's owner after the request
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CustomerHumanRequest" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: There is no open conversation to hand over
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

contactEmail:
  post:
    tags: [Customer]
    operationId: submitCustomerContactEmail
    summary: Answer the widget's "leave your e-mail" card
    description: |
      WG-08 (tm 342). While nobody answers, the server writes one system event
      with `properties.system_event` = `ask_email` to the open connection and
      the widget draws an inline card with an e-mail box. The address typed
      there comes back here: it is stored on the contact (`customers.email`,
      which makes them a lead the way the pre-chat form does), and the
      connection gets an `ask_email_answered` system event carrying no address,
      so the card reads as answered from then on — on a reload too.

      Only an open connection that was actually asked takes it: no open
      conversation is a 409 `chat_inactive`, a connection nobody asked is a
      404. Sending it again is harmless: the address is replaced and the
      answered event is written once. Limited per visitor (GV-01): 429 with
      `Retry-After`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email:
                type: string
                format: email
                maxLength: 254
    responses:
      "204":
        description: The address is stored and the card is answered
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: There is no open conversation
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

transcriptRequest:
  post:
    tags: [Customer]
    operationId: requestCustomerTranscript
    summary: E-mail the player a copy of their latest conversation
    description: |
      WG-06 (tm 345). A closing chat no longer mails the player (K26); the
      widget's "E-mail me the transcript" asks for the copy here instead. The
      copy is the visitor's latest connection — open or closed, never another
      one — in the player's copy of the AR-04 template: the language their
      widget showed (the mails speak English and Turkish), no internal note.

      `email` is where it goes; left out, the address the player gave before
      (`customers.email`). Neither is a 400 with `reason: no_player_address`;
      a connection with no message yet is a 400 `empty_transcript`; a visitor
      with no conversation is a 404. The address is not stored on the contact.
      The mail leaves the workspace, so it counts against the external daily
      cap; it is sent after the answer. Limited to three copies a connection
      and five an hour a visitor: 429 with `Retry-After`.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              email:
                type: string
                format: email
                maxLength: 254
    responses:
      "202":
        description: The copy is handed to the mail carrier
        content:
          application/json:
            schema:
              type: object
              required: [accepted]
              properties:
                accepted: { type: boolean, enum: [true] }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

resolution:
  post:
    tags: [Customer]
    operationId: answerCustomerResolution
    summary: Answer "Is it solved?" with the widget's Yes / No buttons
    description: |
      The buttons under the AI's message that asks "is it solved?" or says it
      is (AI-25-S2, event property `resolution_prompt`). The answer is kept
      on the connection's AI outcome (`resolution_confirmation`, K9 — what
      the player confirmed, apart from what the AI claimed).

      `yes`: the AI thanks the player in its persona's language, and the
      connection counts as confirmed resolved. `no`: the AI hands the
      connection to a person at once with reason `player_said_unresolved`,
      the way "Talk to an agent" does (`requestHuman`), and the player is told
      a person is coming or the after-hours text.

      Only while the AI answers the open connection: a connection a person or
      the queue has already is answered with its owner and `recorded: false`.
      Limited per visitor with "Talk to an agent" (GV-01): 429 with
      `Retry-After`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [answer]
            properties:
              answer: { type: string, enum: [yes, "no"] }
    responses:
      "200":
        description: The answer as kept, and the connection's owner after it
        content:
          application/json:
            schema:
              type: object
              required: [answer, recorded, owner, human_available]
              properties:
                answer: { type: string, enum: [yes, "no"] }
                recorded:
                  type: boolean
                  description: False when the AI no longer answered the connection.
                owner: { type: string, enum: [ai, human, queue] }
                human_available: { type: boolean }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: There is no open conversation to answer on
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

close:
  post:
    tags: [Customer]
    operationId: closeCustomerChat
    summary: Close the conversation from the visitor's side
    description: |
      Ends the current thread. The chat itself continues to exist, so the visitor
      returning opens a new thread on it rather than losing their history.
    responses:
      "204":
        description: Conversation closed
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: There is no open conversation to close
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

formResponse:
  post:
    tags: [Customer]
    operationId: submitCustomerFormResponse
    summary: Answer the post-chat form
    description: |
      The second half of the forms builder (FR-MOD-08.7.7). The fields to ask
      arrive as `post_chat_form` on the token response; the answers come back
      here and are stored on the contact, where an agent reads them in the CRM
      alongside every other custom field — there is no parallel form store.

      Its own endpoint because by this point the visitor sends nothing else to
      hang the answers off: the pre-chat ones ride the first message, but the
      post-chat form is answered after the conversation has ended.

      Only a field the workspace actually asks *after* the chat may be written.
      An id that is CRM-only, another workspace's, or invented is refused with
      the same 400 either way, so the surface says nothing about what exists.
      Values are validated against their definition — a wrong type or a blank
      on a required field is a 400 and nothing is stored.

      Not tied to a conversation: the answers belong to the contact, so this
      works the same whether the visitor ended the chat themselves or an agent
      archived it a moment earlier.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [custom_fields]
            properties:
              custom_fields:
                type: object
                description: Contact custom-field id → value; null clears a field.
                additionalProperties:
                  type: string
                  nullable: true
                  maxLength: 5000
    responses:
      "204":
        description: Answers stored on the contact
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

sale:
  post:
    tags: [Customer]
    operationId: trackCustomerSale
    summary: Report a completed order for revenue attribution
    description: |
      The write side of the sales tracker (FR-MOD-13.5): the merchant's
      confirmation page calls this — through the widget snippet — once an order
      completes, and the Ecommerce report is built from what lands here.

      The caller is a visitor's browser, so nothing about *whose* sale this is
      may come from the body. The workspace is taken from the customer token;
      a `license_id`, `chat_id` or `customer_id` sent in the body is ignored,
      never honoured (NFR-S5).

      Refused with 403 unless the workspace has turned tracking on, and with
      400 unless `currency` matches the configured one exactly — revenue in a
      second currency cannot be added to the first, so it is rejected at the
      edge rather than silently summed into a meaningless total.

      Idempotent on `external_order_id`: a merchant's retry, a double-fired
      snippet or a visitor refreshing the confirmation page all report the same
      order, and counting it twice would overstate revenue. The first call
      returns 201; every repeat returns 200 with the row already recorded, and
      writes nothing.

      A sale is recorded whether or not it can be attributed. `attributed` is
      true only when the visitor had a conversation within the workspace's
      attribution window, in which case `chat_id` names the most recent one;
      otherwise the order is stored with `attributed: false`, which is how the
      report can show total revenue alongside the part chat is credited for.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/TrackSaleRequest" }
    responses:
      "200":
        description: This order was already reported — the existing record, nothing written
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/TrackedSale" }
      "201":
        description: Sale recorded
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/TrackedSale" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "402":
        description: The license is read-only (expired trial); no new sales are recorded.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "403":
        description: Sales tracking is not enabled for this workspace
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

rating:
  post:
    tags: [Customer]
    operationId: rateCustomerChat
    summary: Rate a connection, or add a comment to its rating
    description: |
      One rating per connection (AR-03 · WG-11). `thread_id` names the
      connection being rated — the widget sends the one its prompt is for, so
      a player who has opened a new conversation since still rates the old one.
      Without it the visitor's most recent connection is rated, open or not,
      because ratings usually arrive just after one closes.

      A connection already rated is not rated twice: the call writes onto its
      rating (the newest, for one rated twice before this rule) and answers
      `200` — a changed `value` replaces the old one and moves `rated_at`,
      a `comment` is added to it, and neither adds to the rating count. A
      first rating answers `201`. The comment is plain text, its card numbers,
      IBANs and passwords masked before it is stored.

      Only the player rates: no agent route writes or changes a rating. The
      agents who have the conversation are told (`chat_rated`).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [value]
            properties:
              value: { type: string, enum: [good, bad] }
              comment: { type: string, maxLength: 1000 }
              thread_id:
                type: string
                minLength: 1
                maxLength: 12
                description: |
                  "Panelde: Chat ID (bağlantı)." One of this visitor's
                  connections; any other is a 404.
    responses:
      "200":
        description: The connection's rating, changed or commented
        content:
          application/json:
            schema: { $ref: "#/ratingRecorded" }
      "201":
        description: Rating recorded
        content:
          application/json:
            schema: { $ref: "#/ratingRecorded" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

ratingRecorded:
  type: object
  required: [id, value, chat_id, thread_id, has_comment]
  properties:
    id: { type: string, format: uuid }
    value: { type: string, enum: [good, bad] }
    chat_id:
      type: string
      description: "Panelde: Thread ID (günlük)."
    thread_id:
      type: string
      nullable: true
      description: "Panelde: Chat ID (bağlantı) — the connection rated."
    has_comment: { type: boolean }

leaveTicket:
  post:
    tags: [Customer]
    operationId: leaveCustomerTicket
    summary: Leave a message when nobody is available
    description: |
      The `ticket` and `prospect` halves of the forms builder (FR-MOD-08.7.7),
      and the only path by which a widget answer reaches a **ticket** rather
      than a contact (KK "widget'ta gösterim → contact/ticket'a yazma").

      Not a `/customer/chat/…` route, because it opens a ticket precisely when
      there is no conversation to have: the visitor's words become the ticket's
      subject, `ticket_fields` become custom fields on that ticket, and
      `prospect_fields` become custom fields on the contact who left it. One
      screen, two destinations — one set of questions is about the request, the
      other about the person.

      **Opt-in.** Until the workspace has built at least one `ticket` or
      `prospect` field there is no form, and this refuses with a 400. The widget
      applies the same rule from the other side (it shows no panel), so the
      server is not trusting it to.

      Screened exactly as the chat path is: the address ban (FR-MOD-08.9.2),
      card masking at the source (FR-MOD-08.9.5) and the same deterministic spam
      engine (FR-MOD-08.9.3) the widget and the e-mail channel share.

      Everything happens in one transaction: the ticket is created before the
      answers are written, so an ill-typed answer takes the ticket down with it.
      A workspace never ends up with a message whose questions were silently
      dropped, and a visitor is never told the message failed while a ticket sits
      in the queue.

      `email` is required here and optional on the chat path. A chat is answered
      in the widget the visitor is looking at; a message left when nobody is
      available can only be answered somewhere else. Supplying it also makes the
      visitor a lead by the funnel's own predicate (FR-MOD-13.3
      `lead_captured`) — this endpoint adds no second one.

      Note what the body does not accept: no assignee, group, priority or
      status. A visitor says what they need, never who should work on it. Triage
      is left to the ticket rules (FR-MOD-08.6.2), which see this ticket with an
      origin no `source` condition can name — so a subject rule still fires on
      it while a rule scoped to chats or forwarded mail correctly does not.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [subject, email]
            additionalProperties: false
            properties:
              subject:
                type: string
                minLength: 1
                maxLength: 200
                description: |
                  What the visitor needs, in their own words — stored as the
                  ticket's subject. Capped at the subject's own limit rather
                  than accepting a longer body that would be silently
                  truncated.
              name: { type: string, maxLength: 120 }
              email:
                type: string
                format: email
                maxLength: 320
                description: Where the reply goes. Also stored on the contact.
              ticket_fields:
                type: object
                description: |
                  `ticket` form answers: custom-field id → value, stored on the
                  ticket this opens. An id the workspace does not ask on *this*
                  form — a prospect question, an agent-only field, another
                  workspace's, or invented — is refused with the same 400 either
                  way, so the surface says nothing about what exists.
                additionalProperties:
                  type: string
                  nullable: true
                  maxLength: 5000
              prospect_fields:
                type: object
                description: |
                  `prospect` form answers: custom-field id → value, stored on the
                  contact. Judged against its own placement, which is what stops
                  a question about the person being written onto the request.
                additionalProperties:
                  type: string
                  nullable: true
                  maxLength: 5000
    responses:
      "201":
        description: Ticket opened
        content:
          application/json:
            schema:
              type: object
              required: [ticket_id]
              properties:
                ticket_id: { type: string }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
