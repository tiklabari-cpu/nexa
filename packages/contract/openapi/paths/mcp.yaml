# MCP server — FR-MOD-08.8.3 (v2). A discovery surface an MCP client (Claude,
# ChatGPT, …) reads to learn which tools this workspace exposes and where to
# call them.
#
# Only the discovery endpoint lives here. It is authenticated (any agent/bot
# token) but scope-free: the catalogue is a single static list, identical for
# every caller, and carries no tenant data — no license or organization id
# appears in the response. Per-tool authorization and the tool-call surface
# (`POST /mcp/tools/{tool}`) are a later slice (08.8.3-c); documenting them here
# would promise an endpoint nothing serves, which contract-parity rejects.

manifest:
  get:
    tags: [Mcp]
    operationId: getMcpManifest
    summary: MCP tool catalogue and server info
    description: |
      What an MCP client discovers before it calls anything: the base URL it
      should point at, the protocol revision this server targets, and the static
      catalogue of tools (`search_tickets`, `list_chats`, `get_report`,
      `summarize_chat`) with their argument schemas and the scopes each needs.

      Authenticated with any agent or bot token; **no scope is required**, because
      the catalogue is the same list for everyone and whether a caller may run a
      given tool is decided at call time against that tool's `required_scopes`
      (08.8.3-c). A customer (widget) token is answered `404`, not `403` — the
      agent surface stays un-enumerable from the widget (NFR-S5). The response
      contains no tenant identifier.
    responses:
      "200":
        description: The tool catalogue plus server URL and protocol version
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/McpManifest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

# The single generic tool-call surface (08.8.3-c). Every tool the manifest lists
# is invoked here — the tool name is the path segment, its arguments the body —
# rather than one path per tool, so adding a tool later needs no contract change.
#
# Authorization is *per tool*: the caller must hold one of that tool's
# `required_scopes` (the same list the manifest advertises), checked at call time
# against the token's own scopes. A tool this server does not serve — an unknown
# name, or one not yet wired — answers 404, never 403, so the tool surface cannot
# be enumerated by probing (NFR-S5). Execution is tenant-isolated: a tool only
# ever reaches the caller's own workspace, and no license or organization id
# appears in the result.
toolCall:
  parameters:
    - name: tool
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
      description: The tool to invoke, e.g. `search_tickets` — a `name` from the manifest.
  post:
    tags: [Mcp]
    operationId: callMcpTool
    summary: Call an MCP tool
    description: |
      Invoke the tool named in the path with the arguments in the body. The
      arguments are validated against that tool's `input_schema` (400 on a
      mismatch). The caller must hold one of the tool's `required_scopes` (403
      otherwise); an unknown or unserved tool is 404, not 403, so the surface
      stays un-enumerable (NFR-S5). The tool runs only against the caller's own
      workspace, and the result carries no tenant identifier.

      Read-only: these tools read tickets, chats and reports; they never write,
      so they keep working while a licence is in read-only mode (ADR-10).
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/McpToolCallRequest" }
    responses:
      "200":
        description: The tool ran; `result` holds its output
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/McpToolCallResult" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
