# Playbook — AI agents, skills and knowledge.
#
# A skill is an ordered list of steps run against an incoming customer message.
# Steps are authored two ways and both end in the same place: an admin writes an
# instruction in plain language and compiles it, or edits the step list
# directly. `POST /skills/preview` runs the real engine without writing
# anything, because a preview that runs different logic is worse than none.

aiAgents:
  get:
    tags: [Playbook]
    operationId: listAiAgents
    summary: AI agents on the licence
    responses:
      "200":
        description: AI agents
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/AiAgent" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

aiAgent:
  parameters:
    - name: aiAgentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  patch:
    tags: [Playbook]
    operationId: updateAiAgent
    summary: Edit the persona, or turn the agent on and off
    description: |
      Sets the customer-facing persona (name, avatar, tone, languages, answer
      length) the widget shows (FR-MOD-06.4), how long the agent waits for a
      visitor to stop typing, its same-day memory, how sure it must be of a
      procedure (`clarify_thresholds`, AI-05), how it addresses the player,
      its emoji and how many questions one message may ask (AI-07), and the
      on/off switch.

      Deactivating an agent stops every skill under it at once, which is what an
      admin reaches for when automation is misbehaving. It does not delete
      anything.

      Switching a customer-facing agent on needs its crisis text written and
      approved by the owner (`/ai-guardrails/settings`, AI-08): otherwise 409
      `ai_guardrail_setup_incomplete` with `details.reason`
      `crisis_text_missing` or `crisis_text_not_approved`. An agent already on
      is not affected.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              active: { type: boolean }
              tone: { type: string, maxLength: 40, nullable: true }
              avatar_url: { type: string, maxLength: 2048, nullable: true }
              languages:
                type: array
                maxItems: 20
                items: { type: string, minLength: 1, maxLength: 20 }
              answer_length: { type: string, enum: [short, medium, long], nullable: true }
              batch_window_seconds:
                type: integer
                minimum: 0
                maximum: 10
                nullable: true
                description: |
                  Seconds the agent waits for the visitor to stop typing before
                  it answers (0 answers at once). Null goes back to the
                  workspace default.
              daily_memory:
                type: object
                minProperties: 1
                additionalProperties: false
                description: Either field alone; the one left out keeps its value.
                properties:
                  enabled: { type: boolean }
                  recall: { type: string, enum: [auto_if_unresolved, on_topic_only] }
              clarify_thresholds:
                type: object
                minProperties: 1
                additionalProperties: false
                description: |
                  Either field alone; the one left out keeps its value. The
                  pair must keep `low` below `high`.
                properties:
                  high: { type: number, minimum: 0.01, maximum: 1 }
                  low: { type: number, minimum: 0.01, maximum: 1 }
              address_form:
                type: string
                enum: [siz, sen, null]
                nullable: true
                description: How the player is addressed (AI-07). Null clears it.
              emoji:
                type: string
                enum: [none, few, null]
                nullable: true
                description: Whether messages carry emoji (AI-07). Null clears it.
              max_questions_per_message:
                type: integer
                minimum: 1
                maximum: 3
                nullable: true
                description: Questions one procedure message may ask (AI-07). Null goes back to 2.
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiAgent" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

aiAgentHandoffSettings:
  parameters:
    - name: aiAgentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Playbook]
    operationId: getAiAgentHandoffSettings
    summary: When a person takes the agent's conversations
    description: |
      The customer-facing agent's hand-over settings (AI-11). An agent nobody
      has configured answers with the defaults. Copilot has none: it never
      talks to a visitor.
    responses:
      "200":
        description: Hand-over settings
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiHandoffSettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  put:
    tags: [Playbook]
    operationId: updateAiAgentHandoffSettings
    summary: Choose when a person takes the agent's conversations
    description: |
      `ai_first` lets the agent answer a visitor's conversation before anyone
      is assigned: it opens unassigned and outside the queue, consumes no
      agent's concurrent-chat limit, and is routed to a person when it leaves
      the AI. `parallel` assigns it when it opens, as before. Applies to
      conversations that open after the change.

      `ai_stall_timeout_seconds` is how long a visitor may wait on the agent
      in such a conversation before a person is sent.

      `no_answer` is what the agent does when the knowledge base has no
      answer (AI-06): the groups it names change, the others keep their
      policy; `text: null` goes back to the default sentence.

      `triggers` tunes the agent's own hand-over triggers (AI-09): the
      triggers and fields named change, the others keep their value. A locked
      trigger may only be named with `enabled: true`; turning one off is
      400 `validation` with `details.reason: handoff_trigger_locked` (and
      `details.trigger`). `messages` writes the hand-over sentence per
      reason; `null` goes back to the default. `after_hours` is the text
      for a hand-over nobody can take now.

      `resolution_criteria` is the default "resolved" criteria (K9): a
      condition the procedures without their own are held to; `null` goes
      back to the platform's, the player's explicit yes. A condition that
      names a slot, a fact or a function needing one is 400 `validation`
      with `details` a `ProcedureProblemDetails` (section `handoff`, field
      `resolution_criteria`).

      Any field may be sent alone; the others keep their value.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
              assignment_mode: { type: string, enum: [ai_first, parallel] }
              ai_stall_timeout_seconds: { type: integer, minimum: 15, maximum: 600 }
              no_answer:
                type: object
                minProperties: 1
                additionalProperties: false
                properties:
                  policy_by_category:
                    type: object
                    minProperties: 1
                    additionalProperties: false
                    properties:
                      money: { $ref: "../openapi.yaml#/components/schemas/AiNoAnswerPolicy" }
                      account: { $ref: "../openapi.yaml#/components/schemas/AiNoAnswerPolicy" }
                      bonus: { $ref: "../openapi.yaml#/components/schemas/AiNoAnswerPolicy" }
                      rg: { $ref: "../openapi.yaml#/components/schemas/AiNoAnswerPolicy" }
                      other: { $ref: "../openapi.yaml#/components/schemas/AiNoAnswerPolicy" }
                  text: { type: string, nullable: true, maxLength: 500 }
              triggers:
                type: object
                minProperties: 1
                additionalProperties: false
                properties:
                  not_understood:
                    type: object
                    minProperties: 1
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean }
                      turns: { type: integer, minimum: 1, maximum: 10 }
                      ask_first: { type: boolean }
                  negative_sentiment:
                    type: object
                    minProperties: 1
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean }
                      consecutive: { type: integer, minimum: 1, maximum: 10 }
                      ask_first: { type: boolean }
                  abuse:
                    type: object
                    minProperties: 1
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
                      warnings: { type: integer, minimum: 1, maximum: 5 }
                  loop_detected:
                    type: object
                    minProperties: 1
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean }
                  max_turns:
                    type: object
                    minProperties: 1
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean }
                      turns: { type: integer, minimum: 2, maximum: 50 }
                  repeat_same_day:
                    type: object
                    minProperties: 1
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean }
                  guardrail_self_harm:
                    type: object
                    required: [enabled]
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
                  guardrail_minor:
                    type: object
                    required: [enabled]
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
                  guardrail_rg:
                    type: object
                    required: [enabled]
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
                  risk_flag:
                    type: object
                    required: [enabled]
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
                  guardrail_account_security:
                    type: object
                    required: [enabled]
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
                  guardrail_complaint:
                    type: object
                    required: [enabled]
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
                  guardrail_output_block:
                    type: object
                    required: [enabled]
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
                  player_request:
                    type: object
                    required: [enabled]
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
                  missing_required_info:
                    type: object
                    required: [enabled]
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
                  unsupported_language:
                    type: object
                    required: [enabled]
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
                  ai_failure:
                    type: object
                    required: [enabled]
                    additionalProperties: false
                    properties:
                      enabled: { type: boolean, enum: [true] }
              messages:
                type: object
                minProperties: 1
                additionalProperties: false
                properties:
                  guardrail_self_harm:
                    { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  guardrail_minor: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  guardrail_rg: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  risk_flag: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  guardrail_account_security:
                    { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  guardrail_complaint:
                    { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  guardrail_output_block:
                    { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  guardrail_workspace_rule:
                    { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  abuse: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  player_request: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  tenant_rule: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  procedure_rule: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  missing_required_info:
                    { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  repeat_same_day: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  negative_sentiment: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  player_said_unresolved:
                    { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  not_understood: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  loop_detected: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  max_turns: { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  unsupported_language:
                    { type: string, nullable: true, minLength: 1, maxLength: 500 }
                  ai_failure: { type: string, nullable: true, minLength: 1, maxLength: 500 }
              after_hours:
                type: object
                required: [text]
                additionalProperties: false
                properties:
                  text: { type: string, nullable: true, minLength: 1, maxLength: 500 }
              resolution_criteria:
                allOf:
                  - $ref: "../openapi.yaml#/components/schemas/ProcedureCondition"
                nullable: true
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiHandoffSettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

aiAgentHandoffRules:
  parameters:
    - name: aiAgentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Playbook]
    operationId: listAiAgentHandoffRules
    summary: The agent's hand-over rules
    description: |
      The workspace's hand-over rules (AI-09, K9), in the order they are
      tried: the first active rule that matches decides. `locked` are the
      platform's compliance rules (G1–G5, G13, G15) — shown above the list,
      always on, never moved. `examples` are the ready-made rules a workspace
      may add ("AI çözemedi", "Hesap ve şifre kurtarma", "Para yatırma"); none
      is installed until it is posted.
    responses:
      "200":
        description: Hand-over rules
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiHandoffRuleList" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Playbook]
    operationId: createAiAgentHandoffRule
    summary: Add a hand-over rule
    description: |
      Added at the end of the list. A `procedure` trigger names a procedure
      skill of this agent; a `group_id` target a team of this workspace.
      At most 50 rules per agent (400 `details.reason: handoff_rules_limit`).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, trigger]
            additionalProperties: false
            properties:
              title: { type: string, minLength: 1, maxLength: 80 }
              trigger: { $ref: "../openapi.yaml#/components/schemas/AiHandoffRuleTrigger" }
              target: { $ref: "../openapi.yaml#/components/schemas/AiHandoffRuleTarget" }
              priority: { $ref: "../openapi.yaml#/components/schemas/AiHandoffRulePriority" }
              active: { type: boolean }
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiHandoffRule" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

aiAgentHandoffRulesOrder:
  parameters:
    - name: aiAgentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  put:
    tags: [Playbook]
    operationId: reorderAiAgentHandoffRules
    summary: Reorder the hand-over rules
    description: |
      `rule_ids` is every rule of the agent, once, in the new order. A locked
      rule's id (`G1` …) is 400 `validation` with `details.reason:
      handoff_trigger_locked`: the locked rules always come first.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [rule_ids]
            additionalProperties: false
            properties:
              rule_ids:
                type: array
                maxItems: 50
                items: { type: string }
    responses:
      "200":
        description: The list in its new order
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiHandoffRuleList" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

aiAgentHandoffRule:
  parameters:
    - name: aiAgentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    - name: ruleId
      in: path
      required: true
      description: A rule's id; a locked rule's (`G1` …) is refused.
      schema: { type: string }

  patch:
    tags: [Playbook]
    operationId: updateAiAgentHandoffRule
    summary: Edit, turn on or turn off a hand-over rule
    description: |
      Any field alone; the others keep their value. A locked rule (`G1` …)
      cannot be changed or turned off: 400 `validation` with
      `details.reason: handoff_trigger_locked`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
              title: { type: string, minLength: 1, maxLength: 80 }
              trigger: { $ref: "../openapi.yaml#/components/schemas/AiHandoffRuleTrigger" }
              target: { $ref: "../openapi.yaml#/components/schemas/AiHandoffRuleTarget" }
              priority: { $ref: "../openapi.yaml#/components/schemas/AiHandoffRulePriority" }
              active: { type: boolean }
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AiHandoffRule" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  delete:
    tags: [Playbook]
    operationId: deleteAiAgentHandoffRule
    summary: Delete a hand-over rule
    description: The rules after it move up. A locked rule is 400 `handoff_trigger_locked`.
    responses:
      "204": { description: Deleted }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

skills:
  get:
    tags: [Playbook]
    operationId: listSkills
    summary: Skills, with how often each has run
    responses:
      "200":
        description: Skills
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/Skill" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Playbook]
    operationId: createSkill
    summary: Create a skill
    description: |
      Created inactive. A skill goes live only when someone turns it on, so an
      unfinished step list cannot start answering customers the moment it is
      saved.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              ai_agent_id: { type: string, format: uuid }
              instruction: { type: string, maxLength: 10000 }
              steps:
                type: array
                items: { $ref: "../openapi.yaml#/components/schemas/SkillStep" }
              mode:
                type: string
                enum: [single, procedure]
                description: Default `single`. A procedure needs `when_to_use` and `procedure`.
              when_to_use: { type: string, maxLength: 1000 }
              examples:
                type: array
                maxItems: 30
                items: { type: string, maxLength: 300 }
              priority: { type: integer, minimum: 1, maximum: 1000 }
              slots:
                type: array
                maxItems: 20
                description: A procedure's only.
                items: { $ref: "../openapi.yaml#/components/schemas/SlotDef" }
              procedure: { $ref: "../openapi.yaml#/components/schemas/SkillProcedure" }
              is_fallback:
                type: boolean
                description: |
                  The agent's fallback (AI-05). Refused with
                  `procedure_fallback_taken` while another of its skills is.
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Skill" }
      "400":
        description: Malformed, or a step list or procedure that cannot run
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SkillValidationError" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

skill:
  parameters:
    - name: skillId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Playbook]
    operationId: getSkill
    summary: One skill
    responses:
      "200":
        description: The skill
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Skill" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  patch:
    tags: [Playbook]
    operationId: updateSkill
    summary: Edit a skill
    description: |
      Steps are validated before they are stored. A skill saved with a step the
      engine cannot run would be skipped silently at the moment it mattered, and
      an admin would have no way to know why nothing happened.

      Activating a single skill with no steps is refused for the same reason. A
      procedure skill always holds a procedure that passed this check, so it
      may be turned on; conversations already in it keep the definition they
      started with (tm 296.3).

      A procedure is judged whole — the fields sent over the ones stored — so
      changing one slot re-checks every step that names it. `procedure`
      replaces the stored one; it is not merged. A locked template copy
      (`locked`) may change only its texts and its team, never its mode, and
      is never switched off: `active: false` is a 409 `template_locked`.

      An installed template copy (`template_key`) is switched on only once its
      placeholders are replaced (400 `template_unfilled`, `details.placeholders`)
      and every topic it hands over to reaches a team — a hand-over route or a
      team's topic role (400 `template_unmapped`, `details.topics`). The same
      holds for an edit to a copy that is on.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              instruction: { type: string, maxLength: 10000 }
              steps:
                type: array
                items: { $ref: "../openapi.yaml#/components/schemas/SkillStep" }
              mode:
                type: string
                enum: [single, procedure]
                description: Default `single`. A procedure needs `when_to_use` and `procedure`.
              when_to_use: { type: string, maxLength: 1000 }
              examples:
                type: array
                maxItems: 30
                items: { type: string, maxLength: 300 }
              priority: { type: integer, minimum: 1, maximum: 1000 }
              slots:
                type: array
                maxItems: 20
                description: A procedure's only.
                items: { $ref: "../openapi.yaml#/components/schemas/SlotDef" }
              procedure: { $ref: "../openapi.yaml#/components/schemas/SkillProcedure" }
              is_fallback:
                type: boolean
                description: |
                  The agent's fallback (AI-05). Refused with
                  `procedure_fallback_taken` while another of its skills is.
              active: { type: boolean }
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Skill" }
      "400":
        description: Malformed, or a step list or procedure that cannot run
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SkillValidationError" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403":
        description: |
          Missing scope — or `not_allowed`: turning on a single skill with no
          steps.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: "`template_locked`: switching off a locked template copy."
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  delete:
    tags: [Playbook]
    operationId: deleteSkill
    summary: Delete a skill
    description: |
      A locked template copy (`self_exclusion`, `responsible_gambling_signal`)
      is never deleted, switched on or not: 409 `template_locked`.
    responses:
      "204": { description: Deleted }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: "`template_locked`: a locked template copy."
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

compile:
  post:
    tags: [Playbook]
    operationId: compileSkillInstruction
    summary: Turn a plain-language instruction into steps, or an SOP into a draft procedure
    description: |
      Two kinds of input, one answer shape.

      **`instruction`** — a one-message skill: returns the steps it produced
      *and* the lines it could not understand, rather than inventing something
      for them. A skill that plausibly does the wrong thing to a customer is
      worse than one that refuses to compile, so the editor shows the leftovers
      and lets the admin rewrite them. Deterministic; no model is called.

      **`mode: procedure` + `sop_text`** (AI-03 · tm 296.4) — a multi-turn
      procedure drafted from an SOP written for people. `draft` is the
      definition `POST /skills` takes, already judged by the save-time
      validator: `draft.problems` is what a save would refuse, empty when it
      would store the draft as it is. With a model configured the SOP goes to
      it as a structured-output call, counted against today's AI allowance (a
      429 with `error.details.reason: ai_daily_cap` once that is used up); a
      model that cannot answer falls back to the rules. With the `mock`
      provider a rule-based skeleton is written. `draft.source` says which.
      Neither writes a condition: a line that branches ("eğer…", "ya da",
      "karşılaştır") comes back in `unrecognised`, for the author to write as
      one.

      Compiles only — nothing is saved, and a skill created from a draft is off
      until someone turns it on.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                required: [instruction]
                properties:
                  mode: { type: string, enum: [single] }
                  instruction: { type: string, minLength: 1, maxLength: 10000 }
              - type: object
                required: [mode, sop_text]
                properties:
                  mode: { type: string, enum: [procedure] }
                  sop_text: { type: string, minLength: 1, maxLength: 20000 }
    responses:
      "200":
        description: Compiled
        content:
          application/json:
            schema:
              type: object
              required: [mode, steps, unrecognised]
              properties:
                mode:
                  type: string
                  enum: [single, procedure]
                  description: Which input was compiled.
                steps:
                  type: array
                  description: The one-message steps; empty for a procedure.
                  items: { $ref: "../openapi.yaml#/components/schemas/SkillStep" }
                unrecognised:
                  type: array
                  description: Instruction or SOP lines that produced no step.
                  items: { type: string }
                draft:
                  $ref: "../openapi.yaml#/components/schemas/SkillProcedureDraft"
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }

preview:
  post:
    tags: [Playbook]
    operationId: previewSkill
    summary: Run a step list against a sample message without saving anything
    description: |
      Uses the same engine that serves customers, including knowledge
      retrieval — a preview running different logic would be worse than none.
      Nothing is written: no events, no tags, no run record. A preview is a
      real model call on the deployment's key and counts against today's AI
      allowance (tm 257.8); once that is used up the answer is a 429 with
      `error.details.reason: ai_daily_cap` instead of a result.

      **A procedure** (`mode: procedure`, tm 296.4) is previewed from the
      unsaved definition — the fields `POST /skills` takes — judged as a save
      would judge it: a definition a save would refuse is not run, and
      `procedure_problems` says why. The message has to select the procedure
      (its `when_to_use` and `examples`), as it would on the live path.

      **`conversation`** is the exchange before `message`, oldest first, as the
      live path's history: what the reply is written and answered with. It is
      not replayed — the turn starts from an empty state, and `state` is the
      state that one turn would leave (a full multi-turn run is AI-19's).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              mode:
                type: string
                enum: [single, procedure]
                description: "`single` (the default) runs `steps`; `procedure` the definition."
              steps:
                type: array
                description: Required for a `single` preview.
                items: { $ref: "../openapi.yaml#/components/schemas/SkillStep" }
              when_to_use: { type: string, nullable: true }
              examples:
                type: array
                items: { type: string }
              priority: { type: integer, minimum: 1, maximum: 1000 }
              slots:
                type: array
                items: { $ref: "../openapi.yaml#/components/schemas/SlotDef" }
              procedure: { $ref: "../openapi.yaml#/components/schemas/SkillProcedure" }
              message: { type: string, minLength: 1, maxLength: 10000 }
              conversation:
                type: array
                maxItems: 40
                description: The earlier exchange, oldest first.
                items:
                  type: object
                  required: [role, text]
                  properties:
                    role:
                      type: string
                      enum: [visitor, ai, agent]
                      description: "`visitor` wrote it, the AI (`ai`) or a person (`agent`) answered."
                    text: { type: string, minLength: 1, maxLength: 10000 }
              ai_agent_id: { type: string, format: uuid, nullable: true }
    responses:
      "200":
        description: What the skill would have done
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SkillPreview" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }

runs:
  parameters:
    - name: skillId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Playbook]
    operationId: listSkillRuns
    summary: Recent runs, newest first
    description: |
      The audit an admin reads when a customer got an answer nobody expected.
      Each entry records the steps that executed and what each one decided.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200":
        description: Runs
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/SkillRun" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

knowledgeSources:
  get:
    tags: [Playbook]
    operationId: listKnowledgeSources
    summary: Knowledge the AI answers from
    description: |
      The workspace's one knowledge store (tm 309 · AI-14,
      `docs/adr/single-knowledge-store.md`), newest edit first. Without
      `audience` it lists the sources the AI agent answers players from —
      what this list has always meant to the apps already installed;
      `audience=all` is the whole store, the sources for agents only and the
      published KB articles' included. Unpaged: a workspace's sources are a
      reference set an admin curates, not a stream.
    parameters:
      - name: audience
        in: query
        description: |
          `ai_agent` (the default) — sources whose audiences name the AI
          agent; `copilot` — those that name Copilot; `all` — every source.
        schema: { type: string, enum: [all, ai_agent, copilot], default: ai_agent }
      - name: brand_id
        in: query
        description: |
          What this brand's conversations draw on: the sources for this brand
          and those for every brand (`brand_ids` empty).
        schema: { type: string, format: uuid }
      - name: owner_id
        in: query
        description: Only the sources this member owns (`KnowledgeSource.owner_id`).
        schema: { type: string, format: uuid }
      - name: stale
        in: query
        description: |
          `true` lists only the sources due a review (`review_due_at` has
          passed, AI-14-S3), `false` only the rest. Composes with `owner_id` —
          "my sources that need a look" is both.
        schema: { type: boolean }
    responses:
      "200":
        description: Sources
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/KnowledgeSource" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Playbook]
    operationId: createKnowledgeSource
    summary: Add a source and index it
    description: |
      Chunked and embedded on save, so it is answerable immediately rather than
      after a background job an admin cannot see. The text is embedded before
      the transaction opens and the source is written together with its chunks,
      so a source that exists is a source that can answer; when the embedding
      provider cannot index it the answer is a 503 and nothing is created.

      A `website` source is crawled from `source_url` (the fetch is guarded
      against private/internal targets — SSRF, NFR-S7); an `article` or a `faq`
      indexes the `content` supplied. Exactly one of the two is required, per
      `type`.

      `type: file` is refused here with a 400. A file source carries bytes to
      check, a type to check them against and a budget to measure them by, none
      of which a pasted string has — so it is created through
      `POST /knowledge-sources/file` and nowhere else.

      A new source counts as reviewed when it is added (`reviewed_at`).
      `owner_id` must name a member of this workspace; anyone else is a 400.

      **Who the source is for (tm 309.2).** Without `audiences` and
      `ai_agent_ids` it is for whoever the agent record `ai_agent_id` names
      answers: an AI agent's source is for the AI's answers and Copilot, that
      agent alone; Copilot's is for agents only. `ai_agent_ids` must name AI
      agents of this workspace and `brand_ids` its brands — anything else is a
      400 with `details.reason` `knowledge_source_unknown_ai_agent` or
      `knowledge_source_unknown_brand`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, ai_agent_id]
            properties:
              ai_agent_id:
                type: string
                format: uuid
                description: |
                  The agent record whose scope a source takes when the body
                  names none (`audiences`, `ai_agent_ids`).
              name: { type: string, minLength: 1, maxLength: 200 }
              content: { type: string, minLength: 1, maxLength: 100000 }
              source_url:
                {
                  type: string,
                  minLength: 1,
                  maxLength: 2048,
                  description: "Required when type is website.",
                }
              type: { type: string, enum: [website, file, article, faq], default: article }
              owner_id:
                type: string
                format: uuid
                nullable: true
                description: The member who keeps the source true. Omitted or null — unowned.
              language:
                type: string
                nullable: true
                maxLength: 35
                description: |
                  A language tag (`tr`, `en-GB`); its primary subtag is kept.
                  Omitted or null — not said.
              review_interval_days:
                type: integer
                minimum: 1
                maximum: 365
                default: 90
                description: How many days a review holds (AI-14-S3).
              audiences:
                type: array
                minItems: 1
                maxItems: 2
                items: { $ref: "../openapi.yaml#/components/schemas/KnowledgeAudience" }
                description: |
                  Who may use the source (`KnowledgeSource.audiences`);
                  never empty, repeats folded. Omitted — as the agent record `ai_agent_id` names.
              ai_agent_ids:
                type: array
                maxItems: 100
                items: { type: string, format: uuid }
                description: |
                  AI agents of this workspace the source is for; empty — every
                  one. Omitted — as the agent record names.
              brand_ids:
                type: array
                maxItems: 100
                items: { type: string, format: uuid }
                description: |
                  Brands of this workspace whose conversations may use the
                  source; empty — every brand. Omitted — every brand.
              valid_until:
                type: string
                format: date-time
                nullable: true
                description: |
                  Past this moment the source answers nothing; null — no end.
    responses:
      "201":
        description: Indexed
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/KnowledgeSource" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }
      "503": { $ref: "../openapi.yaml#/components/responses/EmbeddingUnavailable" }

knowledgeSourcesBulk:
  post:
    tags: [Playbook]
    operationId: bulkImportKnowledgeSources
    summary: Import many sources from one CSV
    description: |
      The multi-row counterpart of `POST /knowledge-sources` (FR-MOD-06.3.2,
      "bulk/CSV import"). Same columns as that endpoint's body — `name`, `type`,
      `content`, `source_url` — one source per CSV row, imported into the one
      `ai_agent_id` the request names. The file cannot pick its own target: an
      `ai_agent_id` column is not part of the schema and is ignored like any
      other unrecognised column, so ownership is checked once and every row
      lands on the agent that check approved.

      **Partial success is the normal outcome, and it is a 200.** A spreadsheet
      with 200 correct rows and one typo must not lose all 200, so each row gets
      its own verdict in `results` and its own short transaction; a row that
      fails validation, fails to write, or whose text the embedding provider
      could not index (nothing is written for that row) is reported and the
      import continues.
      The ADR-06 error envelope is reserved for a request refused *as a whole*
      — malformed CSV, a header missing a required column, or a budget overrun
      (row/cell/byte limits, refused rather than silently truncated). Each of
      those carries `error.details.reason` (tm 261): `csv_file_too_large`,
      `csv_too_many_rows`, `csv_cell_too_long`, `csv_unclosed_quote`,
      `csv_text_after_closing_quote` (with `line`, `column` and the limits
      `max_rows`, `max_cell_chars`, `max_bytes`), `csv_header_missing`
      (`columns`, the missing ones comma-separated), `csv_too_many_website_rows`
      (`rows`, `max`) and `ai_agent_not_found`.

      Today's AI allowance is one of those budgets (tm 257.20): the embedding
      of every pasted-text row is reserved before the first row is imported,
      and a file the day cannot afford is a 429 `ai_daily_cap` with nothing
      written — never a list of rows skipped one by one. A `website` row's
      text exists only once it is crawled, so it reserves its own share then;
      if that does not fit, that row is skipped with the reason. What the rows
      did not use is handed back when the import ends.

      `dry_run: true` runs everything except the writes and the fetches, and
      returns the same `results` — which is where the preview in the UI comes
      from: the rule shown in the preview is the same code that will run on
      import, not a second implementation of it in the client. A `website`
      row's URL is still checked against the SSRF guard during a preview (that
      is the verdict a preview exists to give), but no page is fetched, so a
      dry run never makes an outbound request.

      A `website` row is crawled with the same guard the one-at-a-time endpoint
      uses, applied per row: the URL is refused before any fetch if it names a
      private, loopback, link-local or non-http target. Because one request
      here becomes one outbound fetch per website row, those rows carry their
      own budget on top of the row ceiling — at most 20 per file, crawled one
      at a time against a wall-clock limit the whole file shares. Over the
      ceiling the request is refused whole, with nothing fetched.

      Every refused `website` row comes back with the same sentence whatever
      the reason was — an unparseable URL, a loopback address and a metadata
      endpoint are indistinguishable in the reply. That is deliberate: across
      200 rows, a reply that named the reason would map the network it was
      refusing to reach.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ai_agent_id, csv]
            properties:
              ai_agent_id:
                type: string
                format: uuid
                description: The agent every row is imported into. Verified once, before any row is written.
              csv:
                type: string
                minLength: 1
                description: |
                  The file's text, sent as a JSON string rather than
                  multipart — parsing stays on the server, where the row,
                  cell and byte budgets cannot be bypassed by calling the
                  API directly. Capped at 5 MiB, 200 data rows and 100000
                  characters per cell, and separately at 20 `website` rows,
                  since those are the rows that cost an outbound request.
              dry_run:
                type: boolean
                default: false
                description: |
                  Validate and report without writing anything — and, for
                  `website` rows, without fetching anything either.
    responses:
      "200":
        description: |
          The per-row report. 200 covers full success, partial success and
          "every row failed" alike — the request itself was understood in all
          three, and `imported`/`failed` say which happened.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/KnowledgeBulkResult" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }

knowledgeSourcesFile:
  post:
    tags: [Playbook]
    operationId: uploadKnowledgeSourceFile
    summary: Upload a file as a knowledge source
    description: |
      The only way a `file` source is created (FR-MOD-06.3.2, "File").
      `POST /knowledge-sources` refuses `type: file` and points here, because a
      file source that could also be typed into a box would make "File" a label
      rather than a fact: there would be nothing to check the type of, nothing
      to measure and nothing to parse.

      **The bytes travel base64-encoded inside the JSON body, not as
      multipart.** That follows `/knowledge-sources/bulk`, where the file's text
      is a JSON string for the same reason — parsing stays on the server, behind
      budgets a caller cannot bypass, with one body-parsing surface and one
      error shape. Base64 rather than a plain string because a file must arrive
      *undecoded*: a JSON string has already been decoded by the browser, so a
      UTF-16 export or a PDF renamed `.txt` would turn up as replacement
      characters that read as valid text, and the byte budget would be counting
      characters instead of bytes.

      **`content_type` chooses the parser; `filename` never does.** Only
      `text/plain`, `text/markdown` and `text/csv` are accepted — text formats a
      pure function can turn into indexable text with no dependency, no
      subprocess and no network. PDF and the Office formats are absent
      deliberately: each is a parser with a CVE history reachable from an
      admin-supplied byte string. Anything else is a 400.

      A declared type is only a claim, so it is not where binary is stopped: the
      bytes must decode as strict UTF-8 and carry no control characters beyond
      tab, newline and carriage return. A `.png` declared `text/plain` is
      refused by that check, not by the allow-list.

      `filename` is used as the source's title when `name` is omitted, and for
      nothing else — never as a path, and nothing here writes to disk. Two
      budgets bound the request (2 MiB of decoded bytes, 100000 characters of
      parsed text); exceeding either refuses the upload rather than indexing a
      prefix of it, because a knowledge base holding half a policy answers
      confidently from the half it kept.

      On success the file is chunked and embedded, then written together with
      its chunks in one transaction, so a source that exists is a source that
      can answer. When the embedding provider cannot index the text the answer
      is a 503 and nothing is created.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ai_agent_id, filename, content_type, data]
            properties:
              ai_agent_id:
                type: string
                format: uuid
                description: The agent this source belongs to. Verified before anything is written.
              name:
                type: string
                minLength: 1
                maxLength: 200
                description: The source's title. Defaults to the file's own name, stripped of any directory segments.
              filename:
                type: string
                minLength: 1
                maxLength: 255
                description: The file's name, used as a title and never as a path.
              content_type:
                type: string
                enum: [text/plain, text/markdown, text/csv]
                description: |
                  The media type the bytes are parsed as. A `; charset=...`
                  parameter is accepted and ignored. Anything outside this list
                  is refused with a 400.
              data:
                type: string
                format: byte
                minLength: 1
                description: |
                  The file's bytes, base64-encoded. Capped at 2 MiB decoded;
                  the parsed text is separately capped at 100000 characters,
                  the same ceiling `POST /knowledge-sources` puts on pasted
                  content.
              owner_id:
                type: string
                format: uuid
                nullable: true
                description: As on `POST /knowledge-sources` — a member of this workspace, or unowned.
              language:
                type: string
                nullable: true
                maxLength: 35
                description: As on `POST /knowledge-sources`.
              review_interval_days:
                type: integer
                minimum: 1
                maximum: 365
                default: 90
                description: As on `POST /knowledge-sources`.
              audiences:
                type: array
                minItems: 1
                maxItems: 2
                items: { $ref: "../openapi.yaml#/components/schemas/KnowledgeAudience" }
                description: |
                  Who may use the source (`KnowledgeSource.audiences`);
                  never empty, repeats folded. As on `POST /knowledge-sources`.
              ai_agent_ids:
                type: array
                maxItems: 100
                items: { type: string, format: uuid }
                description: |
                  AI agents of this workspace the source is for; empty — every
                  one. As on `POST /knowledge-sources`.
              brand_ids:
                type: array
                maxItems: 100
                items: { type: string, format: uuid }
                description: |
                  Brands of this workspace whose conversations may use the
                  source; empty — every brand. As on `POST /knowledge-sources`.
              valid_until:
                type: string
                format: date-time
                nullable: true
                description: |
                  Past this moment the source answers nothing; null — no end.
    responses:
      "201":
        description: Uploaded, parsed and indexed
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/KnowledgeSource" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }
      "503": { $ref: "../openapi.yaml#/components/responses/EmbeddingUnavailable" }

knowledgeSource:
  parameters:
    - name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }

  patch:
    tags: [Playbook]
    operationId: updateKnowledgeSource
    summary: Rename a source, or change what it says
    description: |
      Edits the source itself (FR-MOD-06.3.3). At least one field is required;
      an empty body is a 400 rather than a silent no-op.

      **What may be edited follows from where the source's text came from.**
      `name` is a title and is editable for every type. `content` is editable
      only for `article` and `faq` — the two types whose text the admin typed.
      A `website` is edited through `source_url`, because its text is the crawl
      and not something to hand-write over; a `file`'s text is the bytes that
      were uploaded, so it takes neither, and re-uploading is
      `POST /knowledge-sources/file` (a new source) rather than a pasted string
      that would make "File" a label again. Sending a field a type does not own
      is refused, not ignored.

      **Changed text is re-indexed in the same transaction as the update.**
      Leaving the old chunks would make the edit cosmetic: the source would read
      as changed in the table and keep answering customers from the text the
      admin believes they replaced. This is the same reasoning that makes a
      delete cascade to its chunks. The new text is embedded before that
      transaction opens; when the embedding provider cannot index it the edit
      is refused whole with a 503 and the source keeps its old text and chunks.

      A new `source_url` is crawled through the same SSRF guard `POST
      /knowledge-sources` uses (NFR-S7), before the transaction opens — a
      refused URL leaves the source exactly as it was.

      **`refresh_after_days` (FR-MOD-06.3.3, tm 198.4) schedules automatic
      re-crawls of a `website` source** — refused, like `source_url`, for
      every other type, since there is nothing to re-fetch. Setting it (or
      changing it) restarts the countdown from now; setting it to `null` turns
      automatic refresh back off. It never touches `content` or `chunk_count`
      by itself — only the freshness sweep or a real crawl does that.

      **`owner_id`, `language` and `review_interval_days` (tm 309.1) belong to
      every type.** None of them is re-indexed or changes what the AI says.
      An edit is not a review: `reviewed_at` moves only through
      `POST /knowledge-sources/{sourceId}/review`, and a new interval counts
      from the last review rather than from now.

      **Who the source is for — `audiences`, `ai_agent_ids`, `brand_ids`,
      `valid_until` (tm 309.2) — belongs to every type too**, and is what
      retrieval reads from the next question on; nothing is re-indexed for
      it. Any source of the store is edited here, the ones for agents only
      included. A published KB article's source (`kb_article_id`) takes its
      title, text, audiences and reach from the article: changing one of
      those here is a 400 with `details.reason` `knowledge_source_from_kb_article`
      and the article's id — only its meta fields are edited here.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              name: { type: string, minLength: 1, maxLength: 200 }
              content:
                type: string
                minLength: 1
                maxLength: 100000
                description: "Only for article and faq sources; refused for website and file."
              source_url:
                type: string
                minLength: 1
                maxLength: 2048
                description: "Only for website sources; refused for the rest. Re-crawled on change."
              refresh_after_days:
                type: integer
                minimum: 1
                maximum: 365
                nullable: true
                description: |
                  Only for website sources; refused for the rest. Null turns
                  automatic refresh off.
              owner_id:
                type: string
                format: uuid
                nullable: true
                description: A member of this workspace; null makes the source unowned.
              language:
                type: string
                nullable: true
                maxLength: 35
                description: A language tag, kept as its primary subtag; null clears it.
              review_interval_days:
                type: integer
                minimum: 1
                maximum: 365
                description: How many days a review holds (AI-14-S3).
              audiences:
                type: array
                minItems: 1
                maxItems: 2
                items: { $ref: "../openapi.yaml#/components/schemas/KnowledgeAudience" }
                description: |
                  Who may use the source (`KnowledgeSource.audiences`);
                  never empty, repeats folded. Not for a KB article's source.
              ai_agent_ids:
                type: array
                maxItems: 100
                items: { type: string, format: uuid }
                description: |
                  AI agents of this workspace the source is for; empty — every
                  one. Not for a KB article's source.
              brand_ids:
                type: array
                maxItems: 100
                items: { type: string, format: uuid }
                description: |
                  Brands of this workspace whose conversations may use the
                  source; empty — every brand. Not for a KB article's source.
              valid_until:
                type: string
                format: date-time
                nullable: true
                description: |
                  Past this moment the source answers nothing; null — no end.
    responses:
      "200":
        description: Updated, and re-indexed if the text changed
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/KnowledgeSource" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }
      "503": { $ref: "../openapi.yaml#/components/responses/EmbeddingUnavailable" }

  delete:
    tags: [Playbook]
    operationId: deleteKnowledgeSource
    summary: Remove a source and everything indexed from it
    description: |
      Any source of the store. A published KB article's source is refused
      with a 400 (`details.reason` `knowledge_source_from_kb_article`, with
      the article's id): it goes when the article is unpublished or its AI
      audiences are switched off, and deleted here it would come back with
      the article's next save.
    responses:
      "204": { description: Deleted }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

knowledgeSourceReindex:
  parameters:
    - name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }

  post:
    tags: [Playbook]
    operationId: reindexKnowledgeSource
    summary: Refresh a source from where its text came from
    description: |
      Re-fetches and re-indexes an existing source (FR-MOD-06.3.3, "reindex"),
      any of the store's (tm 309.2). No body: what is refreshed is the source
      as stored.

      **A separate endpoint from `PATCH`, not a flag on it, because the two ask
      different questions.** A PATCH says *this source is now something else*;
      a reindex says *this source is unchanged — go and get it again*. For a
      `website` that difference is the whole point: nothing about the row
      changes, but the site behind it has, and without this the source stays
      stale until someone deletes and re-adds it. It is a POST rather than a
      PUT/PATCH because it is an action with an outbound effect, not the
      assignment of a state a caller could have named.

      For a `website` the stored URL is crawled again. For every other type the
      text already held is chunked and embedded again — which is what makes a
      source that indexed to nothing (an empty crawl, a chunker change)
      recoverable without retyping it.

      **The SSRF guard runs again on the stored URL** (NFR-S7). "It was checked
      when it was added" is exactly the assumption to refuse: the row is not the
      request that created it, and a stored `source_url` naming a private,
      loopback, link-local or non-http target must be refused here, before any
      fetch. A refused reindex is a 400 that leaves the source, its text and its
      chunks untouched — the stale answer is kept rather than replaced by
      nothing. (The DNS half of the guard — a public *name* that resolves to a
      private address — belongs with a real fetcher and lives in
      `assertPublicHttpUrlResolved`, where the webhook sender uses it; the crawl
      in this build is a deterministic in-process stub that opens no socket, so
      there is no resolved address to pin.)

      A successful reindex also restarts `next_refresh_at`'s countdown from
      now, using whatever `refresh_after_days` the source already has (FR-MOD-06.3.3,
      tm 198.4) — the freshness sweep and this endpoint are the same refresh,
      whichever triggered it. A refresh the embedding provider cannot index is
      a 503 that likewise leaves the source, its text and its chunks as they
      were.
    responses:
      "200":
        description: Re-fetched and re-indexed
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/KnowledgeSource" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequestsOrAiDailyCap" }
      "503": { $ref: "../openapi.yaml#/components/responses/EmbeddingUnavailable" }

knowledgeSourceReview:
  parameters:
    - name: sourceId
      in: path
      required: true
      schema: { type: string, format: uuid }

  post:
    tags: [Playbook]
    operationId: reviewKnowledgeSource
    summary: Confirm a source is still right
    description: |
      Records that a person looked at the source and it still holds
      (tm 309.1 · AI-14-S3): `reviewed_at` becomes now, so the source is next
      due `review_interval_days` from now. No body — a review confirms the
      source as it stands; changing it is `PATCH`. Any source of the store
      (tm 309.2); a KB article's source is reviewed by its article's every
      save as well.

      Nothing is fetched or re-indexed, and nothing the AI says changes: a
      review is the only thing that clears "review needed", and it is never
      done for anybody — an edit, a reindex or the freshness sweep's re-crawl
      leaves `reviewed_at` where it was.
    responses:
      "200":
        description: Reviewed
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/KnowledgeSource" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
