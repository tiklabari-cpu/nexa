# Reports and billing.
#
# The "automated" figure here and the AI-resolution counter on the invoice are
# the same query (ADR-09): a thread that closed with no agent-authored event.
# Two independent counters would drift, and the first person to notice would be
# a customer disputing a bill.

overview:
  get:
    tags: [Reports]
    operationId: getReportsOverview
    summary: Headline conversation metrics
    description: |
      Defaults to the last 30 days when no range is given.

      Two rates deliberately return `null` rather than zero:

      - `automated_rate` when nothing closed in the window. It is a share of
        *closed* conversations, not all of them — an open chat has not resolved
        either way, and counting it would make the number fall whenever the
        inbox gets busy.
      - `satisfaction.score` when nobody rated. An unrated period is unknown,
        not bad, and 0% reads as a catastrophe.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
      - $ref: "../openapi.yaml#/components/parameters/BenchmarkBaseline"
    responses:
      "200":
        description: Metrics for the requested window
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ReportsOverview" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

breakdown:
  get:
    tags: [Reports]
    operationId: getReportsBreakdown
    summary: Resolution split by day, agent, hour, team and channel
    description: |
      The Overview's manual / assisted / automated split (FR-MOD-07.3.2) resolved
      over up to four dimensions — each UTC day in the window, each assigned
      agent, each hour of day and each team and channel — for the Metrics
      breakdown tab (FR-MOD-07.5). Defaults to the last 30 days.

      `by_day` and `by_agent` are always present; `by_hour`, `by_team` and
      `by_channel` are optional and appear once their aggregation is wired up.

      `automated` keeps ADR-09's definition in every row, so a breakdown never
      disagrees with the Overview or the invoice.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
      - $ref: "../openapi.yaml#/components/parameters/BenchmarkBaseline"
    responses:
      "200":
        description: Breakdown for the requested window
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ReportsBreakdown" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

aiAgent:
  get:
    tags: [Reports]
    operationId: getReportsAiAgent
    summary: AI Agent performance
    description: |
      AI-specific metrics for the AI Agent tab (FR-MOD-07.4): resolutions (ADR-09,
      the invoice's number), the share of closed chats resolved without a human,
      hand-offs to a human and how many skills ran. Defaults to the last 30 days.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
      - $ref: "../openapi.yaml#/components/parameters/BenchmarkBaseline"
    responses:
      "200":
        description: AI Agent metrics for the requested window
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ReportsAiAgent" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

reviews:
  get:
    tags: [Reports]
    operationId: getReportsReviews
    summary: Reviews / Ratings — CSAT and daily rating volume
    description: |
      The Reviews report (FR-MOD-07.8): customer satisfaction read back from the
      ratings the widget writes (§8 only wrote them until now). It gives the CSAT
      donut its `good` / `bad` split, a per-UTC-day series for the daily bar, and
      the same equal-length previous window the Overview uses, so the tab can show
      the two-period comparison the PRD calls for (the reference "67% vs 57%").

      `score` is `null`, never `0`, when nobody rated — in the window, in the
      previous window, or on a given day. An unrated span is unknown, not a zero
      score, and 0% would read as a catastrophe. This mirrors `satisfaction.score`
      on the Overview.

      `ecommerce` is the tracked-sales skeleton. Sales tracking (FR-MOD-13.5) is a
      v2 capability with no data source wired yet, so `configured` is `false` and
      the figures are `null` — the shape is present for the surface to render an
      honest "not set up" state rather than a fabricated zero.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
      - $ref: "../openapi.yaml#/components/parameters/BenchmarkBaseline"
    responses:
      "200":
        description: Reviews metrics for the requested window
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ReportsReviews" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

topics:
  get:
    tags: [Reports]
    operationId: getReportsTopics
    summary: Chat topics — conversation clusters with volume and trend
    description: |
      The Chat topics report (FR-MOD-07.6): conversations in the window grouped
      into topics by deterministic, on-the-fly clustering (`@nexa/ai-mock`, no
      real LLM), each with its volume, share and vs-previous trend, for the
      Reports "Chat topics" tab. Nothing is persisted — the clustering is
      recomputed per request. Defaults to the last 30 days.

      Clustering needs a floor of conversations before it says anything honest,
      so a window with fewer than `min_conversations` clusterable chats returns
      `sufficient_data: false` and an empty `topics` — a plain "not enough
      conversations yet" state, never a single fabricated topic. This is a
      state, not an error: the response is a 200, never a 4xx. `analyzed` is how
      many clusterable conversations the window actually held.

      `share` and `trend` are `null`, not `0`, when undefined — a topic with no
      previous-window volume has an unknown trend, not a 100% rise. This mirrors
      the Overview's `automated_rate` and the Reviews `score`: an unknown is not
      a zero.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
      - $ref: "../openapi.yaml#/components/parameters/BenchmarkBaseline"
    responses:
      "200":
        description: Chat topics for the requested window
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ReportsTopics" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

cases:
  get:
    tags: [Reports]
    operationId: getReportsCases
    summary: Cases — ticket volume by day, status and priority
    description: |
      The Cases report (FR-MOD-07.7, v2 payload — the asynchronous half of the
      inbox, FR-MOD-02.6): tickets counted by day of creation, current status
      and queue priority (FR-MOD-13.6). Defaults to the last 30 days.

      Aggregate counts only (§V3) — no ticket subject or customer identity
      crosses into this report.

      `by_day` splits each UTC day's created tickets into `open` and `closed`
      by their *current* status (`solved`/`closed` count as closed; there is
      no per-day status history to bucket against instead — the same
      non-historical convention the Breakdown report's `closed` count
      follows). `by_status` and `by_priority` group the whole window by the
      ticket's current status and stored queue priority. A merged ticket
      (`merged_into_id` set) is excluded from every bucket, so a merge never
      double-counts toward both the primary ticket and the one merged into it.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
      - $ref: "../openapi.yaml#/components/parameters/BenchmarkBaseline"
    responses:
      "200":
        description: Case counts for the requested window
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ReportsCases" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

leads:
  get:
    tags: [Reports]
    operationId: getReportsLeads
    summary: Leads — new leads acquired by day
    description: |
      The Leads report (FR-MOD-07.7, v2 payload): customers flagged as leads
      (`is_lead`) counted per UTC day of their first contact with THIS license.
      Defaults to the last 30 days.

      Aggregate counts only (§V3) — no lead name, email or phone crosses into
      this report.

      ISOLATION (NFR-S4): `customers` is organization-scoped and carries no
      `license_id`, and one organization may hold several licenses. A lead is
      bound to this license only when it has actually touched the license —
      through a chat or a ticket — so a sibling license's leads never leak into
      this report. The organization-wide `is_lead` count is deliberately *not*
      used; which boundary is correct is an access-control decision, and the
      wrong side of it would expose another license's leads.

      `by_day` counts each lead once, on the UTC day of its first touch on this
      license, so a lead already acquired before the window is not counted
      again inside it; `totals.leads` is the distinct leads first seen in the
      window and equals the sum of the `by_day` counts.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
      - $ref: "../openapi.yaml#/components/parameters/BenchmarkBaseline"
    responses:
      "200":
        description: Lead counts for the requested window
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ReportsLeads" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

teamPerformance:
  get:
    tags: [Reports]
    operationId: getReportsTeamPerformance
    summary: Team performance — per-agent KPIs
    description: |
      Team performance (FR-MOD-07.7, v2 payload): the Breakdown tab's by-agent
      chat split (FR-MOD-07.5), extended per agent with average first-response
      and duration, CSAT and AI→human transfer hand-offs. Defaults to the last
      30 days.

      Same agent set, order and `LIMIT 20` as `ReportsBreakdown.by_agent` — an
      agent needs at least one thread *created* in the window to appear here.
      `csat` and `transfers` are windowed by their own timestamp (the rating's
      or the transfer event's `created_at`), the same convention the Reviews
      report and the AI Agent report's `transfers` figure follow — not by the
      thread's creation date.

      `csat.score` is `null`, never `0`, for an agent nobody rated in the
      window — the same rule the Reviews report's `score` follows.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
      - $ref: "../openapi.yaml#/components/parameters/BenchmarkBaseline"
    responses:
      "200":
        description: Per-agent KPIs for the requested window
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ReportsTeamPerformance" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

sales:
  get:
    tags: [Reports]
    operationId: getReportsSales
    summary: Sales — tracked-sales skeleton pending the Sales tracker
    description: |
      The Sales report (FR-MOD-07.7, v2 payload). Depends on FR-MOD-13.5's Sales
      tracker, which has no data source wired yet: `configured` is `false` and
      every figure is `null`, the same honest "not set up" contract the Reviews
      report's `ecommerce` block uses. Defaults to the last 30 days.

      This is a deliberate skeleton, not a partial implementation — the schema
      has no order/sale model (FR-MOD-13.5 is out of scope here), so nothing is
      queried. Once 13.5 lands, this is the single place the figures get filled
      in; the route, its scope and its response shape do not change.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
      - $ref: "../openapi.yaml#/components/parameters/BenchmarkBaseline"
    responses:
      "200":
        description: Sales metrics for the requested window (always `configured:false` in v1)
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ReportsSales" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

goals:
  get:
    tags: [Reports]
    operationId: getReportsGoals
    summary: Goals — the visitor → chat → conversion funnel
    description: |
      The Goals report (FR-MOD-13.3): the three-stage funnel over the window,
      plus what each goal contributed. Defaults to the last 30 days.

      `funnel` is genuinely nested — each stage is a subset of the one before,
      so `visitors >= chats >= conversions` always holds:

      - `visitors` — distinct customers with a visit in the window, workspace
        wide. Not per goal: nothing records which visitors a goal was *eligible*
        to catch, so a per-goal denominator would be invented rather than
        measured.
      - `chats` — of those visitors, the ones who also opened a conversation in
        the window.
      - `conversions` — of those, the ones who reached at least one goal in the
        window. A visitor who reached three goals counts once: this stage counts
        people through the funnel, not goal hits.

      `conversion_rate` is `conversions / chats`, and `null` — never `0` — when
      the window held no chats to convert, the same "unknown is not a failure"
      rule `automated_rate` and `satisfaction.score` follow.

      `by_goal` answers a different question and is deliberately *not* filtered
      through the funnel: it counts every achievement in the window per goal,
      workspace wide, so it agrees with the Overview's `totals.achieved_goals`
      (their sum) rather than with `funnel.conversions`. The two differ whenever
      a visitor converts without ever chatting, or reaches more than one goal.
      Every goal the workspace has defined appears, active or not, including
      those with `conversions: 0` — a goal nobody reached is a reportable
      result, and a retired goal keeps the conversions it already earned.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
      - $ref: "../openapi.yaml#/components/parameters/BenchmarkBaseline"
    responses:
      "200":
        description: The funnel and the per-goal breakdown for the requested window
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/GoalsReport" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

staffingForecast:
  get:
    tags: [Reports]
    operationId: getReportsStaffingForecast
    summary: Staffing forecast — required / scheduled / rostered agents per weekday-hour
    description: |
      The work-scheduler forecast (PRD §5.3-Vardiya): for every hour of a week,
      how many agents the observed load needed, how many were actually online,
      how many the stored work schedules plan for, and the shortfall between the
      first two. Defaults to the last 30 days.

      `cells` is always the full 7 × 24 grid, ordered `day_of_week` 0-6 then
      `hour` 0-23, both **UTC** (`day_of_week` 0 = Sunday, the convention
      `EXTRACT(DOW …)` and `Date.getUTCDay()` share). Every hour of the week is
      present whether or not anything happened in it, so a client never has to
      fill gaps.

      Deterministic arithmetic, no model and no LLM: `required_agents` is
      Little's law over the window —
      `ceil(chats-per-hour × average_chat_minutes / 60 / concurrent_chats_limit)`
      — recomputed per request and never persisted (comparing a stored forecast
      against what happened is separate, deferred work).

      **Unknown is never reported as zero.** Four separate unknowns, each `null`:

      - `required_agents` (and with it `gap` and `low_confidence: true`) when the
        cell observed fewer than `inputs.minimum_sample_chats` chats — a rate
        from a handful of chats is noise, and zero observed chats is not the
        stronger claim that nobody will ever write in that hour.
      - `inputs.average_chat_minutes` when no conversation closed in the window,
        and `inputs.concurrent_chats_limit` when the workspace has no active
        agent. Either one leaves the model without a divisor, so **every**
        `required_agents` is `null` rather than sized against an invented
        figure; `coverage_known` and the volume in `observed_chats` still hold.
      - `scheduled_agents` (and with it `gap`) when the presence log says
        nothing about the window — `coverage_known: false`. Subtracting a 0 that
        means "we don't know" would report a full staffing shortfall for every
        hour of a week nobody has data about. Once a log exists, an hour with no
        online minutes is a real `0`.
      - `rostered_agents` when no agent in the workspace has a stored work
        schedule — `roster_known: false`.

      `scheduled_agents` counts only `accepting_chats` presence, the exact
      condition routing assigns on, and `rostered_agents` counts only schedules
      that were actually saved — an agent who never opened the schedule screen
      contributes nothing here, even though reading their schedule individually
      returns the default week. Both err downward on purpose: over-stating
      coverage hides understaffing instead of showing it.

      No `baseline` / `previous_period` block, unlike the other report groups:
      this response *is* a projection from its window, and a second projection
      over an earlier window is not the comparison anyone means by "vs previous"
      — that is forecast-vs-actual, which needs stored forecasts.

      `observed_chats` is the same count, over the same window predicate, that
      `GET /reports/breakdown` reports in `by_hour` (ADR-09 — one definition, so
      a staffing figure can never disagree with the volume report beside it):
      summing `observed_chats` across the seven days of one `hour` equals that
      hour's `chats` there.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
    responses:
      "200":
        description: The staffing forecast for the requested window
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/StaffingForecast" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

groups:
  get:
    tags: [Reports]
    operationId: getReportGroups
    summary: Report groups this caller may see
    description: |
      Permission-based visibility (FR-MOD-07.7): a report is a group with a
      required scope, and the caller sees only the groups their token satisfies.

      Deliberately not scope-gated — a token without `reports_read` gets an empty
      list, **not** a 403. "Here is what you can see" answers honestly with
      nothing rather than refusing to answer; the 403 belongs to the export
      endpoint, where a caller is asking for data rather than a menu.
    responses:
      "200":
        description: The groups visible to this token (possibly empty)
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ReportGroups" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

export:
  get:
    tags: [Reports]
    operationId: exportReport
    summary: Export a report group as CSV or PDF
    description: |
      CSV or PDF export of one report group (FR-MOD-07.7). Gated on the union of
      every group's scope, so a token holding none is refused; a group whose own
      scope the token lacks is refused too — `format` picks a serialiser for the
      same, already-authorised table and grants nothing on its own. Defaults to
      the last 30 days.

      `reviews` serialises one row per UTC day; `breakdown` serialises all four
      Breakdown-tab dimensions (day, hour, team, channel) in one long-format
      table — `dimension,key,chats,closed,manual,assisted,automated` — rather
      than four files; `topics` serialises one row per cluster —
      `label,volume,share,previous_volume,trend` — below the Chat topics
      sufficiency floor only the header row, never a fabricated zero-row;
      `cases` serialises one row per UTC day — `date,open,closed,total`;
      `leads` serialises one row per UTC day — `date,count`; `team-performance`
      serialises one row per agent —
      `agent_id,name,chats,closed,manual,assisted,automated,avg_first_response_seconds,avg_duration_seconds,csat_good,csat_bad,csat_responses,csat_score,transfers`;
      `goals` serialises the funnel and the per-goal breakdown in one
      long-format table — `section,key,name,value`, where `section` is `funnel`
      (one row per funnel figure) or `goal` (one row per defined goal, `key`
      being its id);
      the two window summaries (`overview`, `ai-agent`) serialise as
      `metric,value` pairs. `sales` also serialises as `metric,value` pairs, and
      until FR-MOD-13.5 lands every value but `configured` (`false`) is an empty
      cell — the honest skeleton, not a query the license has no data for. Every
      figure is the same one the group's JSON report exposes — and the same
      `headers`/`rows` table both formats render from — so a download never
      disagrees with the screen it came from, and CSV and PDF never disagree
      with each other.

      User-influenced fields (tags, agent names) are neutralised against
      spreadsheet formula injection in the CSV body; a PDF has no formula
      evaluator, so that guard is CSV-only by design and would only corrupt PDF
      text if applied there. Both bodies are `no-store`: a report is a
      point-in-time snapshot, never served from a shared cache.

      `baseline` appends the benchmark block as trailing `benchmark_<key>,value`
      rows — the same figures the group's JSON `previous_period` carries, padded
      to the table's width — in both formats. It is opt-in here, unlike the JSON
      reports which always carry a benchmark: a JSON object gains a key
      harmlessly, but the export tables are positional, and a trailing block
      would change what a script (or a PDF's fixed column layout) reading column
      1 as a date sees. Omit it and the CSV file is byte-for-byte what this
      endpoint produced before `format` existed.

      The PDF is a paginated table, deterministic byte-for-byte given the same
      arguments — no embedded fonts, no wall-clock timestamp — set in a core
      font, so non-Latin-1 text degrades to `?` rather than failing the export.
    parameters:
      - name: group
        in: query
        required: true
        description: "Group id: one of `overview`, `breakdown`, `ai-agent`, `reviews`, `topics`, `cases`, `leads`, `team-performance`, `sales`, `goals`."
        schema: { type: string }
      - name: format
        in: query
        description: |
          Download format. Defaults to `csv` — the only format v1 shipped, so a
          caller that never passes this parameter keeps getting exactly what it
          always got, byte-for-byte.
        schema: { type: string, enum: [csv, pdf], default: csv }
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeFrom"
      - $ref: "../openapi.yaml#/components/parameters/ReportRangeTo"
      - $ref: "../openapi.yaml#/components/parameters/BenchmarkBaseline"
    responses:
      "200":
        description: The group rendered as CSV (default) or PDF, per `format`
        content:
          text/csv:
            schema: { type: string }
          application/pdf:
            schema: { type: string, format: binary }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

accessReview:
  get:
    tags: [Reports]
    operationId: getAccessReview
    summary: Access review — who and what can reach this workspace (SOC 2 CC6.1)
    description: |
      Evidence for SOC 2 CC6.1 "logical access" (NFR-C6 · C6-e): every membership
      of the workspace with its role, standing, two-factor state and last
      recorded sign-in, plus every live bearer credential with its owner, scopes
      and last use.

      **It produces evidence and makes no judgement** (§C-A23). There is no risk
      score, no "stale — consider revoking" and no highlighting: whether a dormant
      admin or an old integration token is *appropriate* is the human control this
      report feeds, and pre-answering it would substitute a guess for the review
      an auditor must see performed.

      **Gated on `audit_log--all:ro`, not `reports_read`, plus the `admin` role.**
      It lives under `/reports` because that is where a workspace looks for a
      report, but the authority it needs is the security-evidence one:
      `reports_read` is held by every dashboard integration that charts chat
      volume, and granting those the roster and the credential inventory would
      widen a broad, freely-given scope into the workspace's access model. The
      pairing is the same one `/audit-log` uses — the scope says the token may,
      the role says the person may.

      Two properties of the data are worth knowing before reading it. **Last
      sign-in comes from the audit trail**, which retention prunes, so a null
      `last_login_at` means "nothing since `audit_trail_starts_at`", never
      "never". And **only credentials that can open the door today are listed** —
      revoked and expired rows are omitted, each surviving row carrying its own
      `expires_at` so a reviewer sees which are about to lapse without the list
      being padded with ones that already have.

      No token value and no digest appears anywhere in the response, in either
      format.

      With `format=csv` the response is one of the two tables instead — `section`
      picks which. They are separate files rather than one because they are
      separate tables: a person has a role and a last sign-in, a credential has
      scopes and a last use, and merging them would force every row of each to
      carry the other's empty columns. Both bodies are `no-store`; a snapshot of
      who holds the keys is never served from a shared cache.
    parameters:
      - name: format
        in: query
        description: |
          `json` (default) returns the whole review — both tables — in one round
          trip. `csv` returns the single table named by `section`.
        schema: { type: string, enum: [json, csv], default: json }
      - name: section
        in: query
        description: |
          Which table `format=csv` renders. Ignored for JSON, which always carries
          both.
        schema: { type: string, enum: [members, credentials], default: members }
    responses:
      "200":
        description: The review as JSON (default), or the chosen section as CSV
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AccessReviewReport" }
          text/csv:
            schema: { type: string }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

scheduledExports:
  get:
    tags: [Reports]
    operationId: listScheduledExports
    summary: Scheduled report exports defined for the workspace
    description: |
      The workspace's standing instructions to mail a report group on a timer
      (PRD §5.3-Reports) — definitions only; delivery history is read per
      definition.

      Gated on `reports_manage`, the same scope that creates one, rather than the
      read-only `reports_read`. A definition carries the mailboxes its reports
      are sent to, so listing it exposes who receives workspace data — that is
      part of the management surface, not part of reading a report.
    responses:
      "200":
        description: The workspace's scheduled exports (possibly empty)
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/ScheduledExport" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Reports]
    operationId: createScheduledExport
    summary: Schedule a report group for recurring delivery
    description: |
      Defines a recurring export: a report group, how often it runs, and the
      mailboxes each run is delivered to.

      `group` must name a group in the report catalogue — the same vocabulary
      `GET /reports/export?group=` accepts — and an unknown id is a 400, not a
      404: the group is a request parameter the caller got wrong, not a resource
      whose existence is a tenant secret.

      Every address in `recipients` must belong to an active agent on this same
      license, and the list may not be empty. A schedule is the one place report
      data leaves the workspace unattended, so its destinations are bounded by
      the team roster rather than free text; an outside address is refused with a
      400. An empty list would still claim its delivery period and mail nobody,
      silently, forever.

      `format` accepts only `csv` today — the shape the scheduler produces.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [group, frequency, recipients]
            properties:
              group:
                type: string
                description: "Report group id: one of `overview`, `breakdown`, `ai-agent`, `reviews`, `topics`, `cases`, `leads`, `team-performance`, `sales`, `goals`."
              frequency: { $ref: "../openapi.yaml#/components/schemas/ScheduledExportFrequency" }
              format:
                type: string
                enum: [csv]
                default: csv
              recipients:
                type: array
                minItems: 1
                maxItems: 20
                items: { type: string, format: email }
                description: Mailboxes of active agents on this license.
              enabled:
                type: boolean
                default: true
                description: Create the definition switched off by passing `false`.
    responses:
      "201":
        description: Scheduled
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScheduledExport" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

scheduledExport:
  parameters:
    - name: scheduledExportId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Reports]
    operationId: getScheduledExport
    summary: One scheduled export definition
    description: |
      The definition behind an id. Same shape the list returns, and the same
      scope: it carries the mailboxes the report is delivered to.

      An id belonging to another license answers 404, not 403 — a 403 would
      confirm the schedule exists, and that alone tells one workspace something
      about another's.
    responses:
      "200":
        description: The scheduled export
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScheduledExport" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  patch:
    tags: [Reports]
    operationId: updateScheduledExport
    summary: Change a scheduled export's group, cadence, recipients or state
    description: |
      Only the fields supplied change; an empty body is a 400 rather than a
      no-op, so a client that sent nothing hears about it.

      Every value goes through the same gate `POST /reports/scheduled-exports`
      applies. A changed `group` is resolved against the report catalogue, and a
      changed `recipients` list must still be mailboxes of active agents on this
      license — otherwise editing a schedule would be a way around the boundary
      creating one respects, and the validation would only ever hold on the
      surface nobody has to use twice.

      `enabled: false` is the pause: the scheduler stops picking the definition
      up, and the delivery history is kept. To remove it outright, use DELETE.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            description: At least one field. Unsupplied fields keep their current value.
            properties:
              group:
                type: string
                description: A report group id, from the same catalogue create accepts.
              frequency: { $ref: "../openapi.yaml#/components/schemas/ScheduledExportFrequency" }
              format:
                type: string
                enum: [csv]
              recipients:
                type: array
                minItems: 1
                maxItems: 20
                items: { type: string, format: email }
                description: Replaces the list. Mailboxes of active agents on this license.
              enabled:
                type: boolean
                description: "`false` pauses delivery without discarding the definition."
    responses:
      "200":
        description: The updated scheduled export
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScheduledExport" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  delete:
    tags: [Reports]
    operationId: deleteScheduledExport
    summary: Cancel a scheduled export
    description: |
      Cancels the schedule for good: the definition is removed and never runs
      again, and its delivery history goes with it. To stop deliveries while
      keeping the definition and its history, PATCH `enabled: false` instead.
    responses:
      "204": { description: Cancelled }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

scheduledExportRuns:
  parameters:
    - name: scheduledExportId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Reports]
    operationId: listScheduledExportRuns
    summary: Delivery history of one scheduled export
    description: |
      What actually happened each time this schedule ran — the period covered,
      whether it was delivered, how many rows and mailboxes it reached, and why
      it failed if it did (NFR-M5). Newest first.

      A period is claimed before anything is mailed, so every attempt leaves a
      run behind: a failed delivery is recorded as `failed` with its reason
      rather than disappearing, and the period is *consumed* rather than retried
      — an unrecallable e-mail cannot be safely re-sent on the guess that the
      first one never left.

      Gated on `reports_read`, not the `reports_manage` the definition itself
      takes. A run carries `recipient_count`, never the addresses: who receives
      the workspace's numbers stays with the definition, while "did last week's
      report go out?" is part of reading reports.

      An id belonging to another license answers 404, not 403 — a 403 would
      confirm the schedule exists, and that alone tells one workspace something
      about another's.
    parameters:
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        description: |
          How many runs to return, newest first. Above 100 is a 400 rather than
          a silent clamp, so a caller that asked for more than it gets hears so.
    responses:
      "200":
        description: The schedule's delivery history (possibly empty)
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/ScheduledExportRun" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

subscription:
  get:
    tags: [Billing]
    operationId: getSubscription
    summary: Plan, trial state and estimated charge
    description: |
      `access` states plainly what the workspace can still do, so a client never
      has to infer read-only from a status string.

      An expired trial is `read_only`, not locked (ADR-10): data stays readable
      and exportable, and nothing is deleted. `estimated_total_cents` is 0 while
      trialing.

      Billing is mocked — no external provider is called — but the usage figures
      and the arithmetic are real.
    responses:
      "200":
        description: Current subscription
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SubscriptionView" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  patch:
    tags: [Billing]
    operationId: updateSubscription
    summary: Change plan, billing cycle or seats
    description: |
      The self-serve checkout levers (FR-MOD-10.1.1–.3). Nexa keeps a single,
      transparent price (ADR-13, $99/user/month), so `plan` has one option today
      (`growth`); the endpoint still validates it and is shaped for future tiers,
      including the downgrade guard that refuses a plan whose included quota is
      below what the workspace has already used this month.

      `seats` is the purchased count; its floor is the number of non-suspended
      agents (`min_seats`) — you cannot buy fewer seats than you have people.
      `billing_cycle: annual` recomputes the total as ten monthly charges (two
      months free) and reports the saving in `annual_savings_cents`.

      Billing is mocked (ADR-13): nothing is charged and no external provider is
      called. Writable even while the workspace is read-only — subscribing is how
      an expired trial comes back.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              plan: { type: string, description: "Plan id. Today: `growth`." }
              billing_cycle: { type: string, enum: [monthly, annual] }
              seats:
                type: integer
                minimum: 1
                description: Purchased seats. Must be at least `min_seats`.
    responses:
      "200":
        description: Updated subscription
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SubscriptionView" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

usage:
  get:
    tags: [Billing]
    operationId: getUsage
    summary: Metered usage for the current period
    description: |
      `quota_warning` turns true at 80% of the included AI resolutions
      (PRD §8.3 flow 5). A quota that only surprises you at 100% is a support
      ticket.
    responses:
      "200":
        description: Usage for the current billing period
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../openapi.yaml#/components/schemas/UsageSummary"
                - type: object
                  required: [quota_warning, period_label]
                  properties:
                    quota_warning:
                      type: boolean
                      description: True from 80% of the included allowance.
                    period_label:
                      type: string
                      description: "Billing period as `yyyymm`."
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

invoices:
  get:
    tags: [Billing]
    operationId: listInvoices
    summary: List invoices
    description: |
      Invoices for the workspace, newest period first (FR-MOD-10.3). Billing is
      mocked (ADR-13): these are derived from the subscription and the per-period
      usage records rather than issued by an external provider, so the current
      invoice's total is exactly the `estimated_total_cents` the subscription
      view quotes.

      The current period always appears as an `open` invoice — the standing plan
      charge is visible before the period closes. While the workspace is on a
      trial the statement is `trial` and owes nothing.
    responses:
      "200":
        description: The workspace's invoices
        content:
          application/json:
            schema:
              type: object
              required: [invoices]
              properties:
                invoices:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/Invoice" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

invoiceDownload:
  get:
    tags: [Billing]
    operationId: downloadInvoice
    summary: Download one invoice as CSV
    description: |
      The invoice for one period (`yyyymm`) as an injection-safe CSV download
      (FR-MOD-10.3, "indirme"). 404 if the workspace has no invoice for that
      period. Mocked billing — a real provider would hand back a PDF here.
    parameters:
      - name: period
        in: path
        required: true
        description: "Billing period as `yyyymm`."
        schema: { type: string, pattern: "^[0-9]{6}$" }
    responses:
      "200":
        description: The invoice rendered as CSV
        content:
          text/csv:
            schema: { type: string }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

paymentMethod:
  get:
    tags: [Billing]
    operationId: getPaymentMethod
    summary: The payment method on file
    description: |
      The masked payment method on file, or `null` when none is set
      (FR-MOD-10.3). Billing is mocked (ADR-13) and real card entry is out of
      scope (PRD §11.1/1), so this is only the brand, last four, expiry and
      holder a processor would return after tokenising a card — never a full
      card number.
    responses:
      "200":
        description: The payment method, or null when none is on file
        content:
          application/json:
            schema:
              type: object
              required: [payment_method]
              properties:
                payment_method:
                  oneOf:
                    - $ref: "../openapi.yaml#/components/schemas/PaymentMethod"
                    - type: "null"
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  put:
    tags: [Billing]
    operationId: updatePaymentMethod
    summary: Set or replace the payment method
    description: |
      Store the masked payment method (FR-MOD-10.3, "ödeme yöntemi güncelleme").
      No card is charged and no full card number is accepted — only the brand,
      last four, expiry and holder. An expired card is rejected.

      Writable even while the workspace is read-only: putting a card on file is
      part of how an expired trial comes back, so this is never blocked by the
      trial gate.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/PaymentMethodInput" }
    responses:
      "200":
        description: The stored payment method
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PaymentMethod" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

apiPackages:
  get:
    tags: [Billing]
    operationId: listApiPackages
    summary: The purchasable API-call packages
    description: |
      The API request packages a workspace can buy on top of its plan's included
      calls (FR-MOD-09.3). The catalogue is static and global — the same three
      packages for every workspace, never filtered or repriced per tenant — so
      this read touches no tenant data.

      Billing is mocked (ADR-13): the prices here are what a purchase *would*
      cost, and buying a package charges no card.
    responses:
      "200":
        description: The package catalogue
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/ApiPackage" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  post:
    tags: [Billing]
    operationId: purchaseApiPackage
    summary: Buy an API-call package
    description: |
      Buys one catalogue package and credits its calls to the current period's
      allowance (FR-MOD-09.3), returning the receipt together with usage as it
      stands *after* the purchase — a client never has to re-read
      `/billing/usage` to show the raised quota.

      Payment is mocked (ADR-13): no card is charged, no payment method has to be
      on file and no external provider is called. The quota it buys is real.

      A package is a one-off top-up, not a subscription. Nothing renews, and the
      calls land in the period they were bought into rather than carrying over —
      `period` on the receipt says which one. Buying the same package twice adds
      its quota twice; there is no idempotency key, so a client that cannot
      tolerate a double submit must prevent one.

      Writable while the workspace is read-only, like the subscription PATCH:
      buying capacity is one of the ways an expired trial comes back. It still
      takes a billing scope — `reports_read` may see the prices, not spend money.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [package_id]
            properties:
              package_id:
                type: string
                description: "A catalogue id — `essential`, `pro`, `pro-plus`."
    responses:
      "200":
        description: The recorded purchase, and the period's usage after it
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ApiPackagePurchaseResult" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

apiPackagePurchases:
  get:
    tags: [Billing]
    operationId: listApiPackagePurchases
    summary: API packages this workspace has bought
    description: |
      The workspace's own API-package purchases, newest first (FR-MOD-09.3).
      Each row carries the quota and price the catalogue charged at the time of
      sale, so a later catalogue change never rewrites history.

      A workspace that has bought nothing gets an empty list, not a 404 — "you
      have no purchases" is an answer, not a failure.
    responses:
      "200":
        description: The workspace's purchases, newest first
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/ApiPackagePurchase" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
