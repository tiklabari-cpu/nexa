# SCIM 2.0 provisioning endpoints (NFR-S11 · S11-e).
#
# The surface an identity provider's provisioning connector calls to keep a
# workspace's member list in step with its directory. Unlike the rest of this
# API these endpoints follow somebody else's specification, and three things
# follow from that — each a deliberate exception, each recorded here so a reader
# does not have to work out whether it was an oversight:
#
#   1. **The error envelope is RFC 7644 §3.12, not ADR-06.** See `ScimError`.
#   2. **The media type is `application/scim+json`** (RFC 7644 §3.1), on the way
#      in and on the way out. `application/json` is accepted on the way in too,
#      because several connectors send it.
#   3. **Attribute names are camelCase** (`userName`, `externalId`,
#      `startIndex`), not the snake_case the rest of this document uses. They are
#      the specification's names; renaming them would produce a document that
#      describes a different protocol.
#
# ## Authentication
#
# A SCIM bearer token, minted at `POST /settings/scim-tokens` and stored only as
# a digest. It is not an agent credential: it reaches `/scim/v2` and nothing
# else, and an agent/PAT/bot/customer token reaching `/scim/v2` gets 404 for the
# same reason a widget token reaching the agent API does — a boundary violation
# is not a permission shortfall (NFR-S5).
#
# Every request is scoped to the single workspace the token belongs to. The
# licence is read off the token row, never from a path, header or body field, so
# there is no request shape that reaches another workspace's members.

users:
  get:
    tags: [Settings]
    operationId: listScimUsers
    summary: List the workspace's members (SCIM)
    description: |
      Paged with `startIndex`/`count` (RFC 7644 §3.4.2.4). `count=0` is a
      legitimate "how many are there?" probe and answers `totalResults` without
      reading anybody.

      Ordering is stable across pages — a sync that pages through an unstable
      order silently skips people.
    parameters:
      - name: filter
        in: query
        schema: { type: string }
        description: |
          `attribute eq "value"` on `userName`, `externalId`, `id`, or
          `active eq true|false`. **Deliberately a small slice of the SCIM filter
          grammar.** The full grammar (`and`/`or`/`not`, grouping, value paths,
          nine operators) would mean translating arbitrary client input into SQL
          for a caller that in practice sends two filters: `userName eq` before a
          create, and `externalId eq` when a rename has broken the userName
          match. Anything richer is refused with `invalidFilter` rather than
          silently mis-answered — a refused filter is a bug report, a
          mis-answered one is somebody else's user getting patched.
      - name: startIndex
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
        description: 1-based. A value below 1 is read as 1, per RFC 7644.
      - name: count
        in: query
        schema: { type: integer, minimum: 0, default: 100, maximum: 200 }
        description: Capped at 200; a larger request gets 200 rather than an error.
    responses:
      "200":
        description: The matching members
        content:
          application/scim+json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScimListResponse" }
      "400": { $ref: "#/scimBadRequest" }
      "401": { $ref: "#/scimUnauthorized" }
      "429": { $ref: "#/scimTooManyRequests" }

  post:
    tags: [Settings]
    operationId: createScimUser
    summary: Provision a member (SCIM)
    description: |
      Creates the membership, and the account behind it if this person has no
      Nexa account anywhere yet.

      **An account that already exists is adopted, never modified.** A person may
      work for more than one workspace (PRD §8.4), so one workspace's directory
      asserting their address must not rename them everywhere or clear the
      password they sign in to the other workspace with. All this endpoint may
      add is a membership in its own licence — which its admin could do by
      sending an invitation anyway, so the integration grants no power the
      workspace lacked.

      The new member gets the `agent` role, always. A directory that could choose
      the role could create an owner, which is a power the admin who minted the
      token does not have themselves.

      They are provisioned **offline**, not into chat rotation: a member created
      by a nightly directory sync is not at their desk, and routing a waiting
      customer to an empty chair is worse than making somebody click "available".

      `userName` must be an e-mail address — this product identifies a person by
      their address. A duplicate is `409` with `scimType: uniqueness`, which is
      what tells a connector to look the existing resource up and patch it
      instead.

      **Seats follow the directory upwards.** A create that takes the workspace
      past its purchased seat count raises that count to match, so the bill
      reflects the people who can actually sign in. It is never lowered here —
      reducing a plan is a commercial decision the workspace makes at checkout,
      not one a directory makes unattended (`PATCH /billing/subscription`). A
      workspace still on trial has no purchased count and is unaffected.

      The provisioning is recorded as `member.invited` in the audit trail —
      the existing action for "somebody joined this workspace", with metadata
      naming the credential that did it.
    requestBody:
      required: true
      content:
        application/scim+json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ScimUser" }
    responses:
      "201":
        description: The provisioned member
        headers:
          Location:
            schema: { type: string, format: uri }
        content:
          application/scim+json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScimUser" }
      "400": { $ref: "#/scimBadRequest" }
      "401": { $ref: "#/scimUnauthorized" }
      "402": { $ref: "#/scimPaymentRequired" }
      "409": { $ref: "#/scimConflict" }
      "429": { $ref: "#/scimTooManyRequests" }

user:
  get:
    tags: [Settings]
    operationId: getScimUser
    summary: Read one member (SCIM)
    description: |
      A member of another workspace is not "forbidden", it is invisible: row
      level security means the row is simply not there, so a foreign id and an
      id that never existed get the same 404 (NFR-S5).
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "200":
        description: The member
        content:
          application/scim+json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScimUser" }
      "401": { $ref: "#/scimUnauthorized" }
      "404": { $ref: "#/scimNotFound" }
      "429": { $ref: "#/scimTooManyRequests" }

  patch:
    tags: [Settings]
    operationId: patchScimUser
    summary: Update a member (SCIM PatchOp)
    description: |
      RFC 7644 §3.5.2. Three shapes are accepted, because all three are in the
      wild: `{op, path, value}` (the specification's), `{op, value: {attr: …}}`
      (path omitted), and differently-cased `op`/boolean values (`"Replace"`,
      `"False"`). Refusing any of them would be defensible and would break
      deprovisioning — the most important operation here — for one of the two
      identity providers that matter most.

      **`active` and `externalId` are the writable attributes.** Others are
      accepted and not applied; the response shows what is actually stored, so a
      client that compares sees the truth.

      One exception: a `userName` that *differs* from the stored address is
      refused with `scimType: mutability` rather than ignored. A stale display
      name is cosmetic; an identity provider believing somebody's sign-in address
      moved when it did not is a divergence with consequences. Repeating the
      current address — what a nightly full-profile sync does — is not a change
      and passes.

      **`active: false` suspends, `active: true` reinstates**, and each real
      transition is recorded as `member.suspended` / `member.unsuspended` — the
      same actions and the same effects an admin's suspension produces, because
      it is the same code. A patch that restates the state already stored writes
      nothing: a nightly reconciliation must not fill the trail with entries for
      changes that did not happen. Reinstating raises the purchased seat count if
      the workspace is now past it (see the create).

      **The owner cannot be deactivated** — `403`. Suspending them is how a
      workspace would be locked out of its own administration, and a directory
      that has dropped the owner (or has been told to) must not be able to do
      that unattended. Every other role, including `admin`, is deactivatable:
      that is exactly the reach of the admin who minted the credential.
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/scim+json:
          schema:
            type: object
            required: [Operations]
            properties:
              schemas:
                type: array
                items: { type: string }
                example: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
              Operations:
                type: array
                maxItems: 50
                items:
                  type: object
                  required: [op]
                  properties:
                    op: { type: string, enum: [add, replace, remove] }
                    path: { type: string }
                    value: {}
    responses:
      "200":
        description: The member as stored after the patch
        content:
          application/scim+json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScimUser" }
      "400": { $ref: "#/scimBadRequest" }
      "401": { $ref: "#/scimUnauthorized" }
      "402": { $ref: "#/scimPaymentRequired" }
      "403": { $ref: "#/scimForbidden" }
      "404": { $ref: "#/scimNotFound" }
      "409": { $ref: "#/scimConflict" }
      "429": { $ref: "#/scimTooManyRequests" }

  delete:
    tags: [Settings]
    operationId: deleteScimUser
    summary: Deprovision a member (SCIM)
    description: |
      **Suspends the membership; it does not delete the person.** Chats, tickets,
      presence history and the audit trail all reference a membership, so
      removing the row would either cascade a workspace's conversation history
      away or fail on a foreign key — and a directory saying "this employee has
      left" is not a request to erase what they did. Suspension is already this
      product's phrase for "may no longer sign in or be routed work", so a leaver
      loses access the moment this returns.

      Repeating it is not an error: a connector retrying after a timeout must
      converge, not alarm — and a repeat writes no second audit entry, because
      nothing changed the second time.

      Everything the suspension does, it does here too: the member disappears
      from routing, their live access tokens stop resolving on their next
      request (the membership is re-read every time, so there is no window in
      which a leaver keeps a working session), and the transition is recorded as
      `member.suspended`. The seat count is **not** reduced — see the create.

      **The owner cannot be deprovisioned** — `403`. See the patch.
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "204": { description: Deprovisioned }
      "401": { $ref: "#/scimUnauthorized" }
      "402": { $ref: "#/scimPaymentRequired" }
      "403": { $ref: "#/scimForbidden" }
      "404": { $ref: "#/scimNotFound" }
      "429": { $ref: "#/scimTooManyRequests" }

# ## Teams over SCIM
#
# A team here is what chat routing resolves an agent through (ADR-08 step 2) and
# what makes a conversation visible to them (`chat_access.group_id`), so a
# directory writing this surface is a real claim — which is why it shipped
# read-only. It is writable now for the reason that made it read-only, read the
# other way round: the workspaces that provision over SCIM are the ones whose
# team structure lives in the directory, and a console-only write path leaves
# their teams maintained by hand beside a user list that maintains itself. What
# that produces is not a missing feature but an agent still on a team they left.
#
# The constraint moved rather than lifted: **the provisioning path is not looser
# than the console.** Every write below runs the same service the console's
# `/groups` endpoints run — the same two delete refusals, the same
# workspace-membership check, the same five `group.*` audit actions.
#
# Two things a directory still cannot do:
#
#   - **Choose a routing priority.** RFC 7643's Group has no such attribute. A
#     member added here lands on `normal`, and a member already on the team keeps
#     the tier an admin gave them — a nightly re-assertion of the membership set
#     must not quietly demote every `primary` agent in the workspace.
#   - **Map a group to a role.** A connector that could grant `admin` by adding
#     somebody to a directory group would hold a power the admin who minted its
#     token does not, which is the same reason a provisioned user is always
#     `agent`.

groups:
  get:
    tags: [Settings]
    operationId: listScimGroups
    summary: List the workspace's teams (SCIM)
    description: |
      The teams this workspace has, each with its members. Paged and filtered
      like `/Users`; the member list of each team is ordered, so a connector
      diffing what it pushed against what it reads back sees a difference only
      when there is one.
    parameters:
      - name: filter
        in: query
        schema: { type: string }
        description: '`displayName eq "value"` or `id eq "value"`.'
      - name: startIndex
        in: query
        schema: { type: integer, minimum: 1, default: 1 }
      - name: count
        in: query
        schema: { type: integer, minimum: 0, default: 100, maximum: 200 }
    responses:
      "200":
        description: The matching teams, with their members
        content:
          application/scim+json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScimListResponse" }
      "400": { $ref: "#/scimBadRequest" }
      "401": { $ref: "#/scimUnauthorized" }
      "429": { $ref: "#/scimTooManyRequests" }

  post:
    tags: [Settings]
    operationId: createScimGroup
    summary: Create a team (SCIM)
    description: |
      `displayName` becomes the team's name; each `members[].value` must be the
      id of somebody already provisioned in this workspace.

      **An unknown member id refuses the whole request** with `400`
      `invalidValue`, before anything is written. A `group_agents` row for a
      non-member matches nobody in routing, so accepting one would create a grant
      that shows on every screen and does nothing — and a partly-applied create
      is a state neither side asked for.

      Team names are **not unique** in this product (two shifts may both be
      called "Weekend"), so a create is never answered with `uniqueness`. A
      connector that reconciles by name looks first with
      `?filter=displayName eq "…"`.

      `externalId` is accepted and not stored: a team has no column for a
      directory's own identifier, and adding one would be a schema change made by
      a protocol. Re-match on the returned `id`.

      Recorded as `group.created`, plus one `group.member_set` per member.
    requestBody:
      required: true
      content:
        application/scim+json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ScimGroup" }
    responses:
      "201":
        description: The created team
        headers:
          Location:
            schema: { type: string, format: uri }
        content:
          application/scim+json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScimGroup" }
      "400": { $ref: "#/scimBadRequest" }
      "401": { $ref: "#/scimUnauthorized" }
      "402": { $ref: "#/scimPaymentRequired" }
      "429": { $ref: "#/scimTooManyRequests" }

group:
  get:
    tags: [Settings]
    operationId: getScimGroup
    summary: Read one team with its members (SCIM)
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
        description: The team's per-license integer id, as text.
    responses:
      "200":
        description: The team
        content:
          application/scim+json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScimGroup" }
      "401": { $ref: "#/scimUnauthorized" }
      "404": { $ref: "#/scimNotFound" }
      "429": { $ref: "#/scimTooManyRequests" }

  put:
    tags: [Settings]
    operationId: replaceScimGroup
    summary: Replace a team and its membership (SCIM)
    description: |
      A whole-resource write — the shape a "push groups" configuration sends.

      **An absent `members` empties the team.** That is what replacing a resource
      means, and the softer reading is the dangerous one: the connector would go
      on believing the team it pushed is the team that exists, and the
      disagreement would surface as conversations reaching people the directory
      thinks were removed. Use `PATCH` to leave the membership alone.

      A member already on the team keeps their routing priority; one being added
      arrives at `normal`. Restating the name and membership already stored
      writes nothing — no rows, no audit entries — so a nightly reconciliation
      does not fill the trail with changes that did not happen.

      Unlike `PUT /Users/{id}`, which is deliberately not implemented: a User's
      writable surface is two fields, a team's writable surface *is* the
      resource.
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/scim+json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ScimGroup" }
    responses:
      "200":
        description: The team as stored after the write
        content:
          application/scim+json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScimGroup" }
      "400": { $ref: "#/scimBadRequest" }
      "401": { $ref: "#/scimUnauthorized" }
      "402": { $ref: "#/scimPaymentRequired" }
      "404": { $ref: "#/scimNotFound" }
      "429": { $ref: "#/scimTooManyRequests" }

  patch:
    tags: [Settings]
    operationId: patchScimGroup
    summary: Add or remove members, or rename a team (SCIM PatchOp)
    description: |
      RFC 7644 §3.5.2, and **operations are applied in the order they were
      sent** — replacing the membership and then adding one person means
      something different from the same two operations reversed, so they are not
      merged.

      The shapes accepted, all of them because all of them are in the wild:

      - `{op: "add"|"remove", path: "members", value: [{value: "<id>"}, …]}`
      - `{op: "remove", path: "members[value eq \"<id>\"]"}` — a member named by
        the path with no `value` at all. Reading this one matters more than the
        others: a removal that parsed as "nothing to do" would leave a former
        member holding sight of the team's conversations.
      - `{op: "remove", path: "members"}` — clears the team.
      - `{op: "replace", path: "members", value: […]}` — names the whole set.
      - `{op: "replace", value: {displayName: "…"}}` — path omitted.
      - Differently-cased `op` values (`"Replace"`, `"Add"`).

      **Removing somebody who is not on the team succeeds**, writing nothing: a
      connector retrying after a timeout must converge. **Adding somebody who is
      not a member of this workspace is refused** with `400` `invalidValue` — see
      the create.

      Attributes this server does not own (`externalId`, `meta`, vendor
      extensions) are accepted and not applied; the response shows what is
      actually stored. `displayName` cannot be removed — a nameless team is not a
      state the product has.
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/scim+json:
          schema:
            type: object
            required: [Operations]
            properties:
              schemas:
                type: array
                items: { type: string }
                example: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
              Operations:
                type: array
                maxItems: 50
                items:
                  type: object
                  required: [op]
                  properties:
                    op: { type: string, enum: [add, replace, remove] }
                    path: { type: string }
                    value: {}
    responses:
      "200":
        description: The team as stored after the patch
        content:
          application/scim+json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScimGroup" }
      "400": { $ref: "#/scimBadRequest" }
      "401": { $ref: "#/scimUnauthorized" }
      "402": { $ref: "#/scimPaymentRequired" }
      "404": { $ref: "#/scimNotFound" }
      "429": { $ref: "#/scimTooManyRequests" }

  delete:
    tags: [Settings]
    operationId: deleteScimGroup
    summary: Delete a team (SCIM)
    description: |
      Unlike `DELETE /Users/{id}`, which suspends, this really deletes: a team is
      workspace configuration rather than a person, nothing in it records what
      somebody did, and memberships cascade with it.

      **Refused with `409` while anything still depends on it** — the same two
      checks the console's `DELETE /groups/{groupId}` makes, because it is the
      same code:

      - a routing rule still targets the team, or
      - a conversation reachable through it is still open.

      Neither `routing_rules.target_group_id` nor `chat_access.group_id` carries
      a foreign key, so nothing else would stop the delete: a rule pointing at a
      deleted team routes nothing and says nothing, and a live chat reachable
      only through it becomes invisible to every agent at once. Which team should
      inherit the work is an operator's decision, and least of all one taken
      unattended by a sync at three in the morning. Point the rule elsewhere or
      close the conversations, then retry.

      The `409` carries no `scimType`: RFC 7644 §3.12 defines only `uniqueness`
      for that status, and this is not a uniqueness failure. The `detail` names
      which of the two conditions held.

      Recorded as `group.deleted`. A repeat is `404` — the team is genuinely
      gone.
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string }
    responses:
      "204": { description: Deleted }
      "401": { $ref: "#/scimUnauthorized" }
      "402": { $ref: "#/scimPaymentRequired" }
      "404": { $ref: "#/scimNotFound" }
      "409": { $ref: "#/scimGroupInUse" }
      "429": { $ref: "#/scimTooManyRequests" }

# --- Responses -------------------------------------------------------------
# Local rather than shared: every failure on this path answers in RFC 7644's
# envelope, so the document's own `#/components/responses/*` (which carry the
# ADR-06 `Error`) would describe the wrong body.

scimBadRequest:
  description: Malformed request, unsupported filter, or an immutable attribute
  content:
    application/scim+json:
      schema: { $ref: "../openapi.yaml#/components/schemas/ScimError" }

scimUnauthorized:
  description: Missing, unknown, revoked or expired SCIM token
  content:
    application/scim+json:
      schema: { $ref: "../openapi.yaml#/components/schemas/ScimError" }

scimForbidden:
  description: |
    The member exists in this workspace and the operation is refused anyway —
    today, only deactivating the owner. Deliberately a 403 and not the 404 the
    cross-tenant cases get: the resource is one this token may legitimately see,
    so hiding it would tell a connector to keep retrying against something it
    can read.
  content:
    application/scim+json:
      schema: { $ref: "../openapi.yaml#/components/schemas/ScimError" }

scimNotFound:
  description: |
    No such resource for this token's workspace. A resource belonging to another
    workspace answers identically, so ids stay un-enumerable (NFR-S5).
  content:
    application/scim+json:
      schema: { $ref: "../openapi.yaml#/components/schemas/ScimError" }

scimConflict:
  description: |
    The userName or externalId is already taken in this workspace
    (`scimType: uniqueness`).
  content:
    application/scim+json:
      schema: { $ref: "../openapi.yaml#/components/schemas/ScimError" }

scimGroupInUse:
  description: |
    The team still has a routing rule pointing at it, or an open conversation
    reachable through it. No `scimType`: RFC 7644 §3.12 defines only `uniqueness`
    for a 409 and this is not one, so the `detail` carries which condition held.
  content:
    application/scim+json:
      schema: { $ref: "../openapi.yaml#/components/schemas/ScimError" }

scimPaymentRequired:
  description: |
    The workspace is read-only (an expired trial, ADR-10). Reads still succeed;
    provisioning writes resume on subscribing.
  content:
    application/scim+json:
      schema: { $ref: "../openapi.yaml#/components/schemas/ScimError" }

scimTooManyRequests:
  description: |
    The token's provisioning bucket is exhausted (ADR-07). SCIM has its own
    per-token limit, so a full directory reconciliation cannot throttle anything
    else.
  headers:
    Retry-After:
      schema: { type: integer }
  content:
    application/scim+json:
      schema: { $ref: "../openapi.yaml#/components/schemas/ScimError" }
