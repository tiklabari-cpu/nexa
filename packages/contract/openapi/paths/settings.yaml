# Settings — workspace configuration.
#
# Everything here already existed in the schema and could previously only be
# changed by editing the database. Trusted domains matter most: a customer
# cannot install the widget on their own site until their domain is on this
# list, so shipping the widget without this screen shipped a product nobody
# could actually deploy.

trustedDomains:
  get:
    tags: [Settings]
    operationId: listTrustedDomains
    summary: Domains allowed to embed the widget
    responses:
      "200":
        description: The allowlist
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/TrustedDomain" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Settings]
    operationId: addTrustedDomain
    summary: Allow a domain to embed the widget
    description: |
      Accepts a bare hostname (`shop.example`) or a URL to take one from. The
      hostname is stored lowercased, without port or path, because that is what
      an `Origin` header reduces to when it is checked.

      `include_subdomains` matches on a leading dot, so a rule for
      `example.com` covers `shop.example.com` but never `evil-example.com`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [domain]
            properties:
              domain: { type: string, minLength: 1, maxLength: 253 }
              include_subdomains: { type: boolean, default: false }
    responses:
      "201":
        description: Added
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/TrustedDomain" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409":
        description: Already on the allowlist
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

trustedDomain:
  parameters:
    - name: domainId
      in: path
      required: true
      schema: { type: string, format: uuid }

  delete:
    tags: [Settings]
    operationId: removeTrustedDomain
    summary: Stop allowing a domain
    description: |
      Takes effect on the next widget load: existing conversations continue, but
      no new customer token will be minted for that site.
    responses:
      "204": { description: Removed }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

ipAllowlist:
  get:
    tags: [Settings]
    operationId: listIpAllowlist
    summary: Sources allowed to reach the agent/admin panel
    description: |
      The allow-side counterpart to a security setting's `banned_customer_ips`
      (FR-MOD-08.9.6): a license lists the addresses and CIDR ranges it trusts for
      its own staff. Managing the list does not by itself refuse anyone —
      enforcement is a separate control. Ordered by entry.
    responses:
      "200":
        description: The allowlist
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/IpAllowlistEntry" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Settings]
    operationId: addIpAllowlistEntry
    summary: Allow a source to reach the agent/admin panel
    description: |
      Accepts a single IPv4/IPv6 address or a CIDR range (`10.0.0.0/24`). The
      value is validated and stored in canonical form — host bits masked, a bare
      address kept as itself, IPv6 compressed — so two spellings of one range
      cannot both sit in the list. A duplicate is refused (403).

      A configuration that would exclude the address the request is made from is
      rejected (400): the list must always keep the caller admitted, so a first
      typo cannot lock a workspace out of its own console.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [entry]
            properties:
              entry:
                type: string
                minLength: 1
                maxLength: 49
                description: A single IPv4/IPv6 address or a CIDR range.
              label:
                type: string
                nullable: true
                maxLength: 100
                description: Optional human label for the entry, e.g. `Office VPN`.
    responses:
      "201":
        description: Added
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/IpAllowlistEntry" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

ipAllowlistEntry:
  parameters:
    - name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }

  delete:
    tags: [Settings]
    operationId: removeIpAllowlistEntry
    summary: Stop allowing a source
    responses:
      "204": { description: Removed }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

sso:
  get:
    tags: [Settings]
    operationId: listSsoConnections
    summary: SAML identity providers this workspace federates sign-in to
    description: |
      The federation configuration a workspace has saved (NFR-S11). Listing it
      signs nobody in: no assertion is accepted and no session is minted from a
      connection yet — the SP endpoints are a separate control.

      Gated twice, like the audit log read. The scope says the *token* may read
      access rules; `admin` says the *person* behind it may. What the rows name
      is the workspace's identity provider, which is reconnaissance for a
      targeted phish long before it is useful to an attacker in any other way.

      Ordered by name.
    responses:
      "200":
        description: The connections
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/SsoConnection" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Settings]
    operationId: createSsoConnection
    summary: Federate sign-in to a SAML identity provider
    description: |
      **Enterprise only** (`sso` entitlement, FR-MOD-11.5). A plan without it is
      refused with `not_allowed`, naming the entitlement and the plan in
      `details`. Listing connections is *not* gated — a workspace can always see
      what it has and what it would be buying — and neither is signing in
      through a connection configured earlier, because a commercial change must
      not lock a workspace's people out of their own accounts.

      **Owner only** — an admin is not enough, and that is the point. Whoever
      writes `idp_certificate_pem` chooses the key assertions are verified
      against, and can therefore mint a signed assertion for any colleague in the
      workspace and sign in as them. That is a strictly larger power than an
      admin otherwise holds, so it sits one rank above every other setting here.

      The certificate is parsed, not pattern-matched: it must be a single X.509
      certificate (a chain is refused — see the rotation controls on `PATCH` for
      trusting two at once), currently within its validity window, and carrying
      an RSA/DSA key of at least 2048 bits.

      The sign-on URL must be https. It becomes a redirect target for a browser,
      so the scheme is a security boundary; plain http is accepted only for a
      loopback address, which is how a local identity-provider harness is tested.

      `verified_domains` is required, and it is what confines just-in-time
      provisioning. Without it an identity provider could assert any address on
      the internet and have it provisioned — pulling a stranger's existing
      account into this workspace, or occupying the account row of somebody who
      never signed up and could then never register. A workspace's own SCIM
      connector reads the union of these lists for the same reason.

      Sending it **claims** those domains; it does not prove them, and a claim
      provisions nobody. Each one comes back in `domains` as unproved, and has to
      answer a challenge mailed to a reserved mailbox at the domain itself
      (`POST /settings/sso/{connectionId}/domains/{domain}/challenge`) before it
      appears in the response's `verified_domains`. A consumer mailbox provider —
      `gmail.com`, `outlook.com` and the like — is refused outright: no identity
      provider can be authoritative for one.

      `enabled` defaults to off. Saving the configuration and opening the door
      are two decisions.

      `enforced` defaults to off too, and is accepted here only so the field has
      one meaning on both verbs — a connection nobody has ever signed in through
      is the worst moment to close the password door. Either way it is refused
      unless the workspace still has an owner who holds a password: with SSO
      required, that owner is the only way back in when the identity provider
      cannot answer.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, idp_entity_id, idp_sso_url, idp_certificate_pem, verified_domains]
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
                description: Human label for the connection, e.g. `Okta (corp)`.
              idp_entity_id:
                type: string
                minLength: 1
                maxLength: 1024
                description: The IdP's SAML EntityID — what an assertion's `Issuer` must equal.
              idp_sso_url:
                type: string
                minLength: 1
                maxLength: 2048
                description: The IdP's sign-on endpoint (HTTP-Redirect binding). Stored normalised.
              idp_certificate_pem:
                type: string
                minLength: 1
                maxLength: 16384
                description: The IdP's public signing certificate, PEM-encoded.
              verified_domains:
                type: array
                minItems: 1
                maxItems: 20
                items: { type: string, minLength: 1, maxLength: 253 }
                description: >-
                  The e-mail domains this identity provider claims to be
                  authoritative for. Just-in-time provisioning is confined to the
                  ones whose ownership is then proved, so a connection cannot
                  adopt a stranger's account or occupy an address that never
                  signed up. Bare domains only — no scheme, port, path or `@` —
                  normalised to lowercase and deduplicated. A `*.` wildcard is
                  refused rather than expanded: proving `acme.test` says nothing
                  about who controls `payroll.acme.test`, and one form of suffix
                  matching is all it takes for "verified" to stop meaning "we
                  checked this exact name". A consumer mailbox provider is
                  refused by name. At least one is required — an empty list would
                  configure a federation that silently refuses every first
                  sign-in.
              attribute_mapping: { $ref: "../openapi.yaml#/components/schemas/SsoAttributeMapping" }
              allow_idp_initiated:
                type: boolean
                default: false
              enabled:
                type: boolean
                default: false
              enforced:
                type: boolean
                default: false
                description: >-
                  Refuse password sign-in for this license while this connection
                  is also enabled. Owners keep a password door regardless, and
                  the request is refused if none of them holds a password.
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SsoConnection" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403":
        description: >-
          The caller is not the owner, the token lacks `access_rules:rw`, or a
          connection for that EntityID already exists.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

ssoConnection:
  parameters:
    - name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  patch:
    tags: [Settings]
    operationId: updateSsoConnection
    summary: Change a SAML connection, or rotate its certificate
    description: |
      **Enterprise only** and **owner only**, for the reasons given on `POST`.
      `DELETE` is deliberately neither: a downgraded workspace must not be left
      holding a federation it may neither change nor remove.

      **Certificate rotation.** Writing a new `idp_certificate_pem` revokes the
      old one the moment the change commits. That is the default because the
      rotation that matters most is the one answering a compromised IdP key, and
      an overlap there would keep the attacker's certificate valid for exactly as
      long as it is convenient.

      A planned key roll is the other case: an IdP signs with either key for a
      period, and refusing to bridge that turns every scheduled rotation into a
      sign-in outage. So an overlap is available, but only by asking —
      `retain_previous_certificate_hours` keeps the outgoing certificate trusted
      for up to 7 days. It requires a new certificate to rotate to, refuses to
      "retain" the certificate already in use, and refuses to bridge one that is
      not itself usable.

      `revoke_previous_certificate` closes an open overlap early — the "we have
      since learned the old key was compromised" case. It cannot be combined with
      a new certificate, where the rotation already decides the old one's fate.

      A connection cannot be switched on behind an unusable certificate:
      `enabled: true` is refused unless the stored certificate (or the one being
      written in the same request) is currently valid.

      **Requiring SSO.** `enforced: true` closes the password door for the whole
      license once the connection is also `enabled` — the two are read as a pair,
      so switching the connection off reopens passwords without a second call,
      which is how a workspace recovers from a broken identity provider.

      The change is refused when it would leave nobody able to get back in: the
      license must still have an active owner whose account holds a password.
      That owner is the break-glass door — enforcement narrows password sign-in
      from every member to the one role that can undo the enforcement, rather
      than minting a recovery code that would live outside the identity provider
      forever. Every break-glass sign-in is marked in the audit trail.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              idp_entity_id: { type: string, minLength: 1, maxLength: 1024 }
              idp_sso_url: { type: string, minLength: 1, maxLength: 2048 }
              idp_certificate_pem: { type: string, minLength: 1, maxLength: 16384 }
              verified_domains:
                type: array
                minItems: 1
                maxItems: 20
                items: { type: string, minLength: 1, maxLength: 253 }
                description: >-
                  Replaces the whole list. Still at least one: a workspace that
                  wants this connection to provision nobody switches it off,
                  rather than reaching the same state by emptying a field.
                  A domain already in the list keeps whatever proof it has; one
                  that is new starts unproved; one dropped from the list loses
                  its proof, so a domain cannot be removed from view and quietly
                  keep provisioning.
              attribute_mapping: { $ref: "../openapi.yaml#/components/schemas/SsoAttributeMapping" }
              allow_idp_initiated: { type: boolean }
              enabled: { type: boolean }
              enforced: { type: boolean }
              retain_previous_certificate_hours:
                type: integer
                minimum: 1
                maximum: 168
                description: >-
                  Keep the certificate being replaced trusted for this many hours.
                  Only valid alongside a new `idp_certificate_pem`. Omit it and
                  the old certificate stops being trusted immediately.
              revoke_previous_certificate:
                type: boolean
                enum: [true]
                description: >-
                  Close an open rotation overlap now. Cannot be sent with a new
                  `idp_certificate_pem`.
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SsoConnection" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  delete:
    tags: [Settings]
    operationId: deleteSsoConnection
    summary: Stop federating sign-in to an identity provider
    description: |
      **Owner only**, for the reason given on `POST`. Removing a connection
      closes a door rather than opening one, but it is recorded the same way —
      a federation that quietly disappears is as much an incident as one that
      quietly appears.
    responses:
      "204": { description: Removed }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

ssoDomainChallenge:
  parameters:
    - name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    - name: domain
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 253 }
      description: >-
        One of the connection's claimed domains. Normalised before it is looked
        up, so `ACME.test.` finds `acme.test`.

  post:
    tags: [Settings]
    operationId: sendSsoDomainChallenge
    summary: Mail an ownership challenge to a claimed domain
    description: |
      **Enterprise only** and **owner only**, for the reasons given on
      `POST /settings/sso`.

      Claiming a domain does not prove it. `verified_domains` is a list a
      workspace writes about itself, so on its own it says only that this
      workspace would like to speak for that domain — and the actor who worries
      us most is the workspace's own owner, who holds the narrowest role gate in
      the product and is not constrained by it (PLAN §D134). This endpoint is
      where the claim becomes a fact.

      A random token is mailed to a **reserved mailbox at the domain being
      claimed**: `postmaster@`, `admin@`, `administrator@`, `hostmaster@` or
      `webmaster@`, the local parts RFC 2142 sets aside for whoever operates a
      domain. The caller may choose which of those five, and nothing else —
      nominating an arbitrary mailbox would let the claimant pick one they
      already control, which is the vulnerability with an extra step.

      The token never appears in a response. It is answerable for 72 hours,
      one challenge per domain at a time, and another may be sent a minute after
      the last — the endpoint sends mail to an address the *caller* names, so it
      is bounded whether or not a cache is up.

      Refused for a domain that is already proved: there is nothing left to
      prove, and re-sending would mail a stranger's postmaster for no reason.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              mailbox:
                type: string
                enum: [postmaster, admin, administrator, hostmaster, webmaster]
                default: postmaster
                description: >-
                  Which reserved local part to send to. Defaults to `postmaster`,
                  the one RFC 5321 requires every mail-receiving domain to have.
    responses:
      "202":
        description: Sent
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SsoDomain" }
      "400":
        description: >-
          Already proved, or another challenge was sent less than a minute ago.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404":
        description: No such connection, or the connection does not claim that domain.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429":
        description: |
          Either the rate limit (`too_many_requests`, as everywhere), or
          today's email allowance is used up (`limit_reached`, tm 257.14):
          `error.details.reason` is `mail_daily_cap` and `error.details.scope`
          whose allowance it was (`workspace`, or `global` for the whole
          deployment). The challenge was recorded but its message was not
          sent; the allowances renew at 00:00 UTC, which `Retry-After` counts
          down to.
        headers:
          Retry-After:
            description: Seconds until the caller may retry — for the mail cap, until the next 00:00 UTC.
            schema: { type: integer }
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "503":
        description: >-
          The challenge was recorded but its message could not be sent
          (`service_unavailable`). The owner is the only person who can learn
          that, so it is not hidden; another challenge may be sent a minute
          later. A message whose delivery was handed over but never confirmed
          is answered as sent (202) — it may already be in the mailbox.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

ssoDomainVerify:
  parameters:
    - name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    - name: domain
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 253 }

  post:
    tags: [Settings]
    operationId: verifySsoDomain
    summary: Answer a domain's ownership challenge
    description: |
      **Enterprise only** and **owner only**. Present the token from the message
      sent to the domain's reserved mailbox. Whoever read that mailbox speaks for
      the domain; that is what makes this a proof rather than a second claim.

      On success the domain joins `verified_domains` and just-in-time
      provisioning may create accounts and memberships for addresses inside it.
      The stored digest is discarded at the same moment, so the token cannot be
      presented twice.

      A wrong or expired token is refused with `validation` and changes nothing
      — including the challenge, which stays answerable until it expires, because
      invalidating it would let anyone holding a stale token lock the workspace
      out of proving its own domain by guessing wrong on purpose.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            additionalProperties: false
            properties:
              token:
                type: string
                minLength: 1
                maxLength: 512
                description: The token from the challenge message.
    responses:
      "200":
        description: Proved
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SsoDomain" }
      "400":
        description: No challenge outstanding, the token has expired, or it does not match.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404":
        description: No such connection, or the connection does not claim that domain.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

scimTokens:
  get:
    tags: [Settings]
    operationId: listScimTokens
    summary: Provisioning credentials this workspace has issued
    description: |
      The SCIM bearer tokens a workspace has pasted into its identity provider's
      provisioning connector (NFR-S11). Live tokens only — a revoked one is gone,
      not listed as revoked, because the question this answers is "what can still
      reach my directory surface today".

      The credential itself is never here. It is stored as a SHA-256 digest and
      the plaintext existed once, in the response that created it.
    responses:
      "200":
        description: The live provisioning tokens
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/ScimToken" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Settings]
    operationId: createScimToken
    summary: Mint a SCIM provisioning credential
    description: |
      **Owner or admin.** Deliberately not owner-only, unlike `POST
      /settings/sso`, and the difference is what the credential can do: a SCIM
      token creates members with the `agent` role, suspends them and
      deprovisions them — every one of which an admin may already do by hand. It
      therefore grants no power its minter lacks. Writing an IdP certificate
      does: it lets the writer sign in *as* any colleague, which is why that one
      sits a rank higher.

      The token is returned **once**, in this response, and is unrecoverable
      afterwards — only its digest is stored. Naming it is required: a workspace
      running two connectors through a migration has to be able to tell which is
      which, and "Token 2" is what an unnamed one becomes the moment a rotation
      goes wrong.

      A workspace may hold a small number of live tokens (enough for one
      directory plus a rotation). Beyond that the request is refused rather than
      the oldest being pruned — silently revoking one would be indistinguishable
      from an outage to whichever connector was using it.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              expires_in_days:
                type: integer
                minimum: 1
                maximum: 365
                description: >-
                  Omit for a token that does not expire — a provisioning
                  connector is meant to run unattended for years. Capped at a
                  year so "unattended" cannot quietly mean "forever, unreviewed".
    responses:
      "201":
        description: The credential, in the only response that carries it
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ScimTokenCreated" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429":
        description: |
          Either the per-workspace cap on live provisioning tokens
          (`limit_reached`) or the ordinary rate limit.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

scimToken:
  delete:
    tags: [Settings]
    operationId: revokeScimToken
    summary: Revoke a SCIM provisioning credential
    description: |
      Takes effect on the next request the connector makes — the token is
      resolved from the database every time, never cached.

      Only provisioning tokens. A personal access token id here is a 404, so this
      cannot become a second way to revoke a colleague's credential that skips
      the ownership check on `/auth/personal-access-tokens`.
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "204": { description: Revoked }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

cannedResponses:
  get:
    tags: [Settings]
    operationId: listCannedResponses
    summary: Saved replies
    description: |
      Also read by the composer, which offers them behind `#`. Ordered by
      shortcut so the picker is predictable.

      **Filtered to the caller.** A token holding `canned_responses--all:ro`
      curates the library and sees all of it. A token holding only
      `canned_responses--groups:ro` — what an ordinary agent's session carries —
      sees the workspace-wide replies (`visibility: all`) plus those scoped to a
      team they belong to. The narrowing happens here rather than in the client:
      filtering a paged list after the fact returns short pages, and a private
      reply that reaches the browser before being hidden has already left the
      workspace.
    parameters:
      - name: scope
        in: query
        schema: { type: string, enum: [chat, ticket] }
    responses:
      "200":
        description: Saved replies
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/CannedResponse" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Settings]
    operationId: createCannedResponse
    summary: Save a reply
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [shortcut, text]
            properties:
              shortcut:
                type: string
                pattern: "^[A-Za-z0-9_-]{1,40}$"
                description: Typed after `#` in the composer. Letters, digits, `_` and `-`.
              text: { type: string, minLength: 1, maxLength: 10000 }
              scope: { type: string, enum: [chat, ticket], default: chat }
              visibility:
                type: string
                enum: [all, group]
                default: all
                description: |
                  `group` requires `group_id`; `all` refuses one. Omitting both
                  saves a workspace-wide reply, which is what every reply saved
                  before this field existed is.
              group_id:
                type: integer
                format: int64
                nullable: true
                description: The team the reply belongs to. Required when `visibility` is `group`.
    responses:
      "201":
        description: Saved
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CannedResponse" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409":
        description: That shortcut is already used in this scope
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

cannedResponse:
  parameters:
    - name: cannedResponseId
      in: path
      required: true
      schema: { type: string, format: uuid }

  patch:
    tags: [Settings]
    operationId: updateCannedResponse
    summary: Edit a saved reply
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              shortcut: { type: string, pattern: "^[A-Za-z0-9_-]{1,40}$" }
              text: { type: string, minLength: 1, maxLength: 10000 }
              visibility: { type: string, enum: [all, group] }
              group_id:
                type: integer
                format: int64
                nullable: true
                description: |
                  Re-scoping is a pair, so the two fields are read together: the
                  values sent are merged over the stored ones and the result has
                  to be a legal pairing. Narrowing an existing reply to a team is
                  therefore `{"visibility": "group", "group_id": 7}`, and
                  widening it back is `{"visibility": "all"}` — which clears the
                  team on its own.
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CannedResponse" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: That shortcut is already used in this scope
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  delete:
    tags: [Settings]
    operationId: deleteCannedResponse
    summary: Delete a saved reply
    responses:
      "204": { description: Deleted }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

securitySettings:
  get:
    tags: [Settings]
    operationId: getSecuritySettings
    summary: File sharing and security rules
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
    description: |
      The file-sharing fields are what FR-MOD-08.9.4 enforces on every upload.
      They existed in the schema from the start but could only be changed by
      editing the database, so the shipped defaults were the only rules any
      workspace ever had.

      A workspace that has never saved these settings has no row: signup does
      not create one. The defaults from the schema are returned in that case,
      which is what the server enforces anyway — reading has no side effect.
    responses:
      "200":
        description: The current rules
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SecuritySettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  patch:
    tags: [Settings]
    operationId: updateSecuritySettings
    summary: Change the file sharing and security rules
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
    description: |
      Creates the row on first write. `allowed_file_types` is validated as MIME
      types (`type/subtype`) and stored lowercased: an entry like `.pdf` or
      `pdf` would sit in the list looking like a rule while matching no upload
      the browser ever labels.

      `ip_allowlist_enforced`, `session_idle_timeout_seconds` and
      `max_concurrent_sessions` (FR-MOD-08.9.6) are validated and stored here
      but not yet enforced — idle-timeout and concurrent-session enforcement
      is FR-MOD-08.9.6-g. A zero or negative value is rejected for the two
      limits; `null` is how a limit is turned off.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              banned_customer_ips:
                type: array
                description: >-
                  Visitor IPs to refuse (FR-MOD-08.9.2). Each must be a valid
                  IPv4 or IPv6 address; entries are normalised and deduped.
                maxItems: 1000
                items: { type: string, maxLength: 45 }
              file_sharing_enabled: { type: boolean }
              allowed_file_types:
                type: array
                maxItems: 50
                items: { type: string, maxLength: 255 }
              max_file_size_bytes: { type: integer, minimum: 1, maximum: 104857600 }
              spam_filter_enabled: { type: boolean }
              require_two_factor: { type: boolean }
              ip_allowlist_enforced: { type: boolean }
              session_idle_timeout_seconds:
                type: integer
                nullable: true
                minimum: 1
                maximum: 2592000
              max_concurrent_sessions:
                type: integer
                nullable: true
                minimum: 1
                maximum: 25
              ai_turns_per_customer_day:
                type: integer
                minimum: 0
                maximum: 10000
                description: >-
                  The per-member daily AI allowance (GV-01); 0 turns it off.
              captcha_mode:
                $ref: "../openapi.yaml#/components/schemas/CaptchaMode"
              inbound_attachments_sensitive:
                type: boolean
                description: >-
                  Treat every file a player e-mails as sensitive (HD-02), not
                  only the ones whose name or subject names an ID document.
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SecuritySettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

# --- Data retention (NFR-C8) -----------------------------------------------
#
# PRD §7 NFR-C8 asks for a *configurable* retention window — 30/60/365/unlimited
# — with a real hard-delete once it lapses. The hard-delete has shipped since
# tm 24 (`services/retention/`); the configurability had not, because the
# windows were read only from the environment and were therefore one number per
# deployment rather than one per workspace. This pair is that half.
#
# Licence-scoped, not brand-scoped: the data these windows govern (`threads`,
# `visits`) is keyed by licence and has no brand, so a per-brand window would
# have needed an invented rule for which of three brands decides a
# conversation's fate.

retention:
  get:
    tags: [Settings]
    operationId: getRetentionSettings
    summary: How long this workspace keeps its data
    description: |
      The workspace's own retention windows, the deployment defaults they fall
      back to, and the windows the sweep will **actually** apply once a HIPAA
      ceiling has been taken into account (NFR-C4 · C4-e).

      All three are returned because the third is not derivable from the first
      two by anyone outside the deployment: a covered workspace that chose
      `unlimited` is swept at 365 days, and the only honest answer to "when will
      this conversation be deleted" is the one the server computes.

      `access_rules:ro` (or `:rw`) plus `minimumRole: admin`, the same gate
      `GET /settings/compliance` carries — and for the same reason, since the
      two settings interlock.
    responses:
      "200":
        description: The current retention settings
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/RetentionSettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  patch:
    tags: [Settings]
    operationId: updateRetentionSettings
    summary: Choose how long this workspace keeps its data
    description: |
      Sets one or both windows, or clears a choice back to the deployment
      default with an explicit `null`.

      **A window above the HIPAA ceiling is refused, not clamped** (403,
      `details.reason = "hipaa_ceiling"`, with `details.max_days`). Silently
      storing a longer window and applying a shorter one would leave the screen
      claiming a retention period the workspace does not have — and this is the
      one setting where the gap between what was saved and what happens is the
      difference between a kept agreement and a broken one. `unlimited` is
      refused on a covered workspace at any value: indefinite retention of PHI
      is what a BAA is signed to prevent.

      Writes `settings.security_updated` to the audit trail with the field names
      touched, never their values — the same shape `/settings/security` and
      `/settings/siem` use.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/RetentionSettingsInput" }
    responses:
      "200":
        description: The settings after the change
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/RetentionSettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

# The permission matrix (RL-02 · tm 325.2): which role may do what in this
# workspace, on top of the catalogue's defaults (`@siyahtus/types`
# `CAPABILITIES`). Licence-scoped like retention: the matrix is the workspace's,
# not a brand's.
permissions:
  get:
    tags: [Settings]
    operationId: getPermissionMatrix
    summary: Who may do what in this workspace
    description: |
      Every capability, its values, the lowest role that may hold it, and for
      each matrix column what the role holds here, what it would hold by
      default, and whether the cell is locked (RL-02).

      `access_rules:ro` (or `:rw`) plus `minimumRole: admin`: a Yönetici reads
      the matrix, only the Kurucu changes it. A member reads their own
      capabilities on `GET /auth/me` (`capabilities`).
    responses:
      "200":
        description: The workspace's matrix
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PermissionMatrix" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  put:
    tags: [Settings]
    operationId: updatePermissionMatrix
    summary: Change who may do what in this workspace
    description: |
      Sets the listed cells, with the reason (RL-02-S5). **Kurucu only**
      (`exactRole: owner`, `access_rules:rw`).

      Refused whole, with nothing stored, when any change is not allowed —
      400 with `details.reason`, `details.role` and `details.capability`:
      `unknown_role`, `unknown_capability`, `invalid_value`, `locked` (the
      Kurucu column, a Founder-only row), `below_floor` (more than the weakest
      value for a role below the row's floor), `duplicate_change` (one cell
      twice). Floors and route gates are platform safety: a role a route
      refuses stays refused whatever the matrix says.

      A change that moves a cell writes `permissions.changed` to the audit
      trail — every cell that moved, `from` and `to`, with the reason — and
      mails the workspace's Yöneticiler. A request that moves nothing writes
      nothing and keeps the version.

      Sessions pick a change up within a minute, without signing in again: the
      servers cache each workspace's matrix by its `version` and are told of a
      change after it commits.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/PermissionMatrixUpdate" }
    responses:
      "200":
        description: The matrix after the change
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PermissionMatrix" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

compliance:
  get:
    tags: [Settings]
    operationId: getComplianceSettings
    summary: HIPAA cover and where this workspace lives
    description: |
      The two facts NFR-C4 makes HIPAA cover conditional on: the region the
      workspace lives in, and whether its Business Associate Agreement has been
      accepted.

      `baa_available` is the server's answer to "may this workspace accept one
      at all" — true only in `us`, because HIPAA cover is conditional on US
      hosting. It is returned rather than left for the caller to derive from
      `region`, so the rule is stated in one place and a screen cannot offer a
      button the endpoint will refuse.
    responses:
      "200":
        description: The current compliance state
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ComplianceSettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

complianceBaa:
  post:
    tags: [Settings]
    operationId: acceptHipaaBaa
    summary: Accept the HIPAA Business Associate Agreement
    description: |
      Records that this workspace accepted the BAA (NFR-C4), stamping
      `hipaa_baa_signed_at` with the moment of the first acceptance.

      **The signature is mocked.** There is no contract text, no signature
      provider and no legal workflow here — this endpoint records the single
      fact "a BAA was accepted for this licence", which is what the HIPAA scope
      constraints later read. No external service is called.

      Three gates, all 403:

      * **Enterprise only.** NFR-C4 makes HIPAA cover "conditional —
        Enterprise", so the `hipaa` entitlement (FR-MOD-11.5) is the first of
        the conditions. Reading `/settings/compliance` is not gated: an admin
        has to be able to see that their workspace is US-hosted and holds no
        agreement, which is the question upgrading answers.
      * **Owner only.** An admin cannot accept on the workspace's behalf; this
        commits the organisation to a compliance obligation.
      * **`us` only.** A workspace hosted in `eu` has no HIPAA cover to sign
        into, so the endpoint refuses rather than storing an agreement that
        claims something untrue about where the data is.

      And in the public pilot (`pilot_mode` on `GET /deployment`) not at all:
      the owner gets `403 not_allowed` with `error.details.reason:
      "pilot_mode"` whatever the plan and region — the pilot provides no HIPAA
      cover to accept.

      Idempotent: accepting again returns the state unchanged, keeping the
      original timestamp. The first acceptance is the record, and a second
      click is not a second agreement — so it also writes no second audit entry.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [accepted]
            properties:
              accepted:
                type: boolean
                enum: [true]
                description: >-
                  Must be `true`. An explicit affirmative, so an empty or
                  stray POST cannot record an agreement nobody made. `false`
                  is rejected rather than treated as a withdrawal — there is
                  no withdrawal here.
    responses:
      "200":
        description: Accepted (or already accepted)
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ComplianceSettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

# --- Company details (FR-MOD-08.3 · M-CO-a · FR-MOD-00.4) -------------------
#
# Name, sector, address, timezone and size — PRD §8.4's "fatura/marka/rapor
# temeli" (billing/brand/report basis). Organization-scoped rather than
# license- or brand-scoped: one workspace may hold several licenses and
# brands, and this is one set of facts about the company behind all of them.
# Unlike most of `/settings/*` the row always exists — `organizations` is
# created at signup — so there is no upsert-on-first-write and no "no row yet"
# default state. `company_size` is also where the onboarding wizard's
# "şirket büyüklüğü" step writes (FR-MOD-00.4) — one surface, not a second.

company:
  get:
    tags: [Settings]
    operationId: getCompanyDetails
    summary: Company name, sector, address, timezone and size
    description: |
      A workspace that has never opened this screen still reads real values:
      `name` from signup, `timezone` defaulting to `UTC`, and
      `sector`/`address`/`company_size` `null` until set.
    responses:
      "200":
        description: The current company details
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CompanyDetails" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  patch:
    tags: [Settings]
    operationId: updateCompanyDetails
    summary: Change the company name, sector, address, timezone or size
    description: |
      **Owner or admin.**

      `sector` must be one of the closed list `CompanyDetails` documents — a
      value reports can group by, not free text (PRD §8.4 "rapor temeli").
      Send `null` to clear it. `address` is free text, bounded, and `null`
      clears it too. `timezone` must name a zone the runtime's own tz database
      recognises; unlike the other fields there is no way to unset it,
      only replace it — the column is `NOT NULL` and defaults to `UTC`, so
      every workspace always has one. `company_size` (FR-MOD-00.4's
      onboarding "şirket büyüklüğü" step writes through here) follows
      `sector`'s own rule — one of the closed list, `null` clears it.

      Records `settings.company_updated` in the audit trail, naming the
      fields that changed.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1, maxLength: 200 }
              sector:
                type: string
                nullable: true
                enum:
                  [
                    ecommerce_retail,
                    saas_technology,
                    financial_services,
                    healthcare,
                    travel_hospitality,
                    education,
                    real_estate,
                    telecommunications,
                    media_entertainment,
                    gaming_gambling,
                    nonprofit_government,
                    professional_services,
                    manufacturing_logistics,
                    other,
                  ]
              address: { type: string, maxLength: 500, nullable: true }
              timezone:
                type: string
                minLength: 1
                maxLength: 100
                description: An IANA zone name, e.g. `Europe/Istanbul`.
              company_size:
                type: string
                nullable: true
                enum: [1_10, 11_50, 51_200, 201_1000, 1000_plus]
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CompanyDetails" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

# SIEM export configuration (NFR-C6 · C6-b).
#
# Where the workspace's audit trail is shipped, and how the feed is doing. Part
# of the security family — `access_rules` plus Owner/Admin — because deciding
# that a copy of every security event leaves for a system SiyahTuş does not control
# is a workspace-security decision, not an inbox preference.
#
# The data itself is `GET /audit-log/export`; these two describe the standing
# instruction and its state. The Settings → Security screen (C6-f) is built on
# exactly these and opens nothing of its own.

# --- SLA targets (FR-MOD-11.5 · 11.5-d) --------------------------------------
#
# The read is open on every plan and the write is Enterprise-only, the same
# split `/settings/siem` makes: a workspace must be able to see what it would be
# buying, and a settings page that 403s where the upsell belongs is a worse
# product and no more secure.
#
# The measurement side applies the entitlement from the other end. Targets saved
# while the licence held `sla` stay on the row after a downgrade (§C-A26) but
# stop being measured — `active` is how a screen tells the two apart. The breach
# rows themselves are read by Reports (11.5-e), not from here; this is
# configuration, not data.

slaPolicy:
  get:
    tags: [Settings]
    operationId: getSlaPolicy
    summary: First-response and resolution targets
    description: |
      A workspace that has never saved targets has no row and reads as two
      nulls with business hours off — reading has no side effect and creates
      nothing.
    responses:
      "200":
        description: The current targets
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SlaPolicy" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  put:
    tags: [Settings]
    operationId: setSlaPolicy
    summary: Set the SLA targets
    description: |
      **Enterprise only** (`sla` entitlement, FR-MOD-11.5).

      A full replacement rather than a patch: the three fields are one policy,
      and reading back what you sent is what makes "no first-response target"
      expressible at all. Send `null` for a clock you do not want measured.

      Setting a target does not re-evaluate history. Breaches are marked as
      clocks stop (a first reply lands, a case is closed) and by the sweep for
      cases still running past their target, so a target saved today applies to
      what happens from today.

      Records `settings.sla_updated` in the audit trail with the saved values.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [first_response_minutes, resolution_minutes, business_hours_only]
            properties:
              first_response_minutes:
                type: integer
                nullable: true
                minimum: 1
                maximum: 129600
                description: >-
                  Minutes allowed before the first agent reply, or null for no
                  target. The upper bound is 90 days — a target past that could
                  never be breached by anything retention still holds, so
                  saving one would switch the feature off while the screen
                  showed it on.
              resolution_minutes:
                type: integer
                nullable: true
                minimum: 1
                maximum: 129600
                description: Minutes allowed before the case is finished, or null.
              business_hours_only:
                type: boolean
                description: >-
                  Count only hours the workspace is open, from the agents'
                  saved work schedules. With no saved schedule anywhere there is
                  no calendar to subtract and the clocks run continuously.
    responses:
      "200":
        description: The saved targets
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SlaPolicy" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

siemSettings:
  get:
    tags: [Settings]
    operationId: getSiemSettings
    summary: Where the audit trail is exported
    description: |
      A workspace that has never configured an export has no row, and reads as
      off with no destination. Reading has no side effect and creates nothing.
    responses:
      "200":
        description: The current export configuration
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SiemExportSettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  patch:
    tags: [Settings]
    operationId: updateSiemSettings
    summary: Configure the audit trail export
    description: |
      **Enterprise only** (`siem_export` entitlement, FR-MOD-11.5). NFR-S12
      gives every plan the audit log and sells shipping it out, so reading this
      configuration and `GET /audit-log` stay open while this and
      `GET /audit-log/export` do not. The scheduled sink applies the same rule:
      a workspace that downgrades stops being delivered without its
      configuration being erased.

      Creates the configuration on first write. Naming a destination and turning
      the feed on are two decisions — `enabled` defaults to off — so a workspace
      can set up the export before it starts shipping.

      Neither switching the feed off nor repointing it moves the delivery
      position: re-enabling resumes exactly where it stopped rather than
      re-sending the retained trail or, worse, skipping everything written while
      it was off. That is also why there is no delete — off is `enabled: false`,
      which keeps the position.

      Records `settings.security_updated` in the audit trail, naming the fields
      that changed and the destination.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              enabled:
                type: boolean
                description: Whether the scheduled export ships to the destination.
              target:
                type: string
                enum: [file]
                description: >-
                  Where to ship. `file` writes NDJSON under `.data/siem` —
                  real SIEM connectors (Splunk, Sentinel, Datadog) are a project
                  boundary, so this is the whole of what this deployment can
                  honestly offer. Omitted on a first write it takes the default;
                  omitted later it leaves the destination alone.
    responses:
      "200":
        description: The saved configuration
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SiemExportSettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

siemStatus:
  get:
    tags: [Settings]
    operationId: getSiemExportStatus
    summary: How the audit trail export is doing
    description: |
      The configuration plus its state: when a delivery last completed, how far
      through the trail it has got, how many entries are delivered and how many
      are waiting.

      `last_run_at` and `last_exported_at` answer different questions and can be
      far apart — a feed that ran a minute ago and found nothing new has a fresh
      run and an old position. A stale `last_run_at` means the export is not
      running; a growing `pending_count` means it is running and falling behind.
    responses:
      "200":
        description: The export's configuration and state
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SiemExportStatus" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

chatTimeout:
  get:
    tags: [Settings]
    operationId: getChatTimeout
    summary: Idle-chat auto-close window
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
    description: |
      The idle window before a conversation is auto-closed (FR-MOD-08.7.3).
      `chat_timeout_seconds` is null when the feature is off, which is also what
      a workspace that has never saved it reads — there is no row until then, so
      the read has no side effect. While it is null, widget conversations still
      close after 30 minutes without activity (K2, ID-02).
    responses:
      "200":
        description: The current window
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ChatTimeoutSettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  put:
    tags: [Settings]
    operationId: setChatTimeout
    summary: Set or disable the idle-chat auto-close window
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
    description: |
      Creates the row on first write. `chat_timeout_seconds` must be a positive
      integer (up to 30 days) or null to disable — a zero or negative window is
      rejected, since reaching the sweep it would close every live chat at once.
      A positive window covers every conversation; null leaves widget
      conversations on the 30-minute default (K2, ID-02) and conversations from
      messaging channels open.

      The conversation day boundary (ID-04) is saved here too, and is optional:
      leave a field out and the stored value stays. `day_boundary_timezone` must
      be a real IANA zone (`Mars/Olympus` → 400) and `day_boundary_hour` a whole
      number 0-23 (`24` → 400). Changing either affects only connections that
      start afterwards — chats already filed under a day keep it — and writes an
      audit entry (`settings.chat_timeout_updated`) carrying the old and new
      boundary.

      The two windows before auto-close (WG-03) are saved here too, and are
      optional the same way: `unanswered_transfer_seconds` (an assigned
      connection whose agent has not answered the player for this long goes to
      someone else in the team) and `inactive_after_seconds` (a connection
      quiet for this long stops counting against its agent's concurrent
      limit). Each is a positive integer (up to 30 days) or null for off.
      Between the windows that are on, the stored result must keep transfer <
      inactive < auto-close — compared after the save is applied, so a field
      left out counts with its stored value — or the save is refused with a
      400 and nothing changes. `pause_unresponsive_agents` is optional too:
      whether the agent a connection was taken from stops receiving chats.
      So is `ticket_reopen_window_days` (1-365, HD-03): how many days after
      its last activity a player's e-mail answer still reopens a solved ticket.
      And `transcript_allowed_domains` (AR-04-S3): where a transcript may be
      mailed besides the player's own address. `transcript_forward_to` and
      `transcript_forward_include_notes` (WG-06): where every closed
      connection is forwarded, and whether the copy carries internal notes.
      `ask_email_after_seconds` (WG-08) is a third window, before the
      transfer: ask the player for an e-mail once a connection has waited this
      long for a person's first reply. When on it must be below the transfer,
      inactive and auto-close windows that are on, or the save is a 400.
      `ask_email_when_offline` asks at once while nobody is accepting chats.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [chat_timeout_seconds]
            properties:
              chat_timeout_seconds:
                type: integer
                format: int32
                minimum: 1
                maximum: 2592000
                nullable: true
                description: >-
                  Seconds of inactivity before auto-close; null disables it, and
                  widget conversations then close after the 30-minute default (K2).
              day_boundary_timezone:
                type: string
                example: Europe/Istanbul
                description: IANA zone the conversation day is counted in.
              day_boundary_hour:
                type: integer
                format: int32
                minimum: 0
                maximum: 23
                description: The local hour a conversation day starts at.
              unanswered_transfer_seconds:
                type: integer
                format: int32
                minimum: 1
                maximum: 2592000
                nullable: true
                description: >-
                  Seconds an assigned connection may go without its agent's
                  first reply before it is transferred (`agent_unresponsive`);
                  null turns it off. Must be below `inactive_after_seconds` and
                  `chat_timeout_seconds` when those are on.
              inactive_after_seconds:
                type: integer
                format: int32
                minimum: 1
                maximum: 2592000
                nullable: true
                description: >-
                  Seconds without an event before a connection is inactive and
                  leaves its agent's concurrent limit; null turns it off. Must be
                  below `chat_timeout_seconds` when that is on.
              pause_unresponsive_agents:
                type: boolean
                description: >-
                  Whether an agent whose connection the unanswered transfer took
                  goes `not_accepting_chats`. Left out, the stored value stays.
              ask_email_after_seconds:
                type: integer
                format: int32
                minimum: 1
                maximum: 2592000
                nullable: true
                description: >-
                  Seconds a connection may wait for a person's first reply
                  before the player is asked for an e-mail (once; a player whose
                  e-mail or username is known is told the answer will come
                  here instead); null turns it off. Must be below
                  `unanswered_transfer_seconds`, `inactive_after_seconds` and
                  `chat_timeout_seconds` when those are on.
              ask_email_when_offline:
                type: boolean
                description: >-
                  Whether a connection waiting for a person while nobody is
                  accepting chats asks at once. With an AI answering, it asks
                  only after the AI hands over. Left out, the stored value stays.
              ticket_reopen_window_days:
                type: integer
                format: int32
                minimum: 1
                maximum: 365
                description: >-
                  Days after its last activity that a player's e-mail answer
                  still reopens a solved ticket (HD-03); later, a new related
                  ticket opens. Left out, the stored value stays.
              transcript_allowed_domains:
                type: array
                maxItems: 20
                items: { type: string, minLength: 1, maxLength: 254 }
                description: >-
                  Domains a transcript may be mailed to besides the player's
                  own address (AR-04-S3). Stored trimmed, lower-case and
                  without a leading `@`, duplicates dropped; a value that is
                  not a domain name is a 400. Left out, the stored list stays.
              transcript_forward_to:
                type: array
                maxItems: 5
                items: { type: string, minLength: 3, maxLength: 254 }
                description: >-
                  Addresses every closed connection is forwarded to (WG-06),
                  at most five. Stored trimmed with the domain lower-case,
                  duplicates dropped; a value that is not an address is a 400.
                  Left out, the stored list stays.
              transcript_forward_include_notes:
                type: boolean
                description: >-
                  Forward the team's copy, internal notes marked. Refused (400,
                  `reason: domain_not_verified`, nothing saved) while any
                  forwarding address — as this save leaves the list — is
                  outside the workspace's verified SSO domains. Left out, the
                  stored value stays.
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ChatTimeoutSettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

widgetSettings:
  get:
    tags: [Settings]
    operationId: getWidgetSettings
    summary: Widget appearance
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
    description: |
      The widget's appearance (FR-MOD-11.7): brand colour, corner, colour
      scheme, mobile-fullscreen and the removable "Powered by" footer. A
      workspace that has never customised it reads the shipped defaults, with no
      side effect — there is no row until the first save.
    responses:
      "200":
        description: The current appearance
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WidgetSettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  put:
    tags: [Settings]
    operationId: setWidgetSettings
    summary: Change the widget appearance
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
    description: |
      Creates the row on first write, filling unset fields from the defaults, so
      a partial save lands a complete, valid appearance. At least one field is
      required. The colour must be a `#rrggbb` hex; position and theme their
      enums. Takes effect on the next widget load and is baked into the snippet.

      **`powered_by: false` is Enterprise** (`white_label` entitlement,
      FR-MOD-11.5) and is the only field here that is: everything else is
      cosmetic and free on every plan. A plan without it is refused with
      `not_allowed` and nothing in the body is saved, not even the fields that
      would have been allowed on their own.

      A value stored while the entitlement was held is **not deleted** when a
      workspace downgrades, so a later upgrade restores the setting — but it
      stops being honoured immediately. `powered_by` in every response, in the
      install snippet, and in the appearance served to a visitor reads `true`
      until the plan includes `white_label` again.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              primary_color:
                type: string
                pattern: "^#[0-9a-fA-F]{6}$"
              position:
                type: string
                enum: [bottom-right, bottom-left]
              theme:
                type: string
                enum: [auto, light, dark]
              mobile_fullscreen: { type: boolean }
              powered_by: { type: boolean }
              welcome_title:
                type: string
                nullable: true
                maxLength: 120
                description: Trimmed; an empty string clears it (stored as null).
              welcome_text:
                type: string
                nullable: true
                maxLength: 500
                description: Trimmed; an empty string clears it (stored as null).
              language:
                type: string
                enum: [auto, en, tr, de, fr, es, it, pt, ar]
                description: |
                  The widget's language (WG-02). `auto` follows the visitor's
                  browser; any other value pins it. A `language` written into
                  the install snippet still wins over this.
              fallback_language:
                type: string
                enum: [en, tr, de, fr, es, it, pt, ar]
                description: What `auto` falls back to when the browser speaks none of the eight.
              availability_mode:
                type: string
                enum: [always, agents_only]
                description: |
                  When a visitor may start a chat (WG-09). `always`: a chat
                  opens whoever is there and waits unassigned when nobody is.
                  `agents_only`: with no AI to answer and nobody accepting
                  chats, the widget offers the offline form instead (name,
                  e-mail and message, plus any ticket/prospect questions). An
                  AI that would answer keeps the chat open in either mode.
              launcher_visibility:
                type: string
                enum: [always, until_opened, never]
                description: |
                  When the chat bubble is drawn (WG-10). `until_opened` hides it
                  until the host page calls `siyahtus('open')`; `never` hides it
                  for good — if the page's own button breaks, visitors cannot
                  reach support.
              show_logo:
                type: boolean
                description: Show the brand's logo in the panel header (WG-10).
              help_enabled:
                type: boolean
                description: Show the widget's "Help" tab, a search of published KB articles (WG-12).
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WidgetSettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

widgetPhrases:
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
    - name: locale
      in: query
      required: true
      description: Which of the widget's eight languages.
      schema:
        type: string
        enum: [en, tr, de, fr, es, it, pt, ar]
  get:
    tags: [Settings]
    operationId: getWidgetPhrases
    summary: The brand's own widget texts in one language
    description: |
      The widget texts the active brand rewrote in `locale` (WG-05) — the
      offline notice, the queue line, the message box placeholder and the
      rest of `WIDGET_PHRASE_KEYS`. A key that is absent shows the widget's
      own text for that language; the panel shows that text as the
      placeholder of the empty field.
    responses:
      "200":
        description: The language's custom texts
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WidgetPhrases" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
  put:
    tags: [Settings]
    operationId: setWidgetPhrases
    summary: Replace the brand's own widget texts in one language
    description: |
      Replaces every custom text of `locale`; a key left out goes back to
      the widget's own text. A key outside `WIDGET_PHRASE_KEYS`, a text over
      its key's limit, HTML, a line break or a placeholder the key does not
      allow (anything but `{n}` / `{minutes}` where listed) is refused 400
      and nothing is saved. Takes effect on each visitor's next token mint.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/WidgetPhrasesUpdate" }
    responses:
      "200":
        description: Saved
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WidgetPhrases" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

prechatSettings:
  get:
    tags: [Settings]
    operationId: getPrechatSettings
    summary: Built-in pre-chat form
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
    description: |
      The widget's built-in pre-chat form for the active brand (WG-01): whether
      it opens, and whether each of name, username, e-mail and message is
      shown and required. A brand that has never saved it reads today's form —
      open, all four required — with `configured: false`.
    responses:
      "200":
        description: The current form
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PrechatSettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  put:
    tags: [Settings]
    operationId: setPrechatSettings
    summary: Change the built-in pre-chat form
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/BrandHeader"
    description: |
      Replaces the whole form — all four fields are sent every time. A field
      may not be required while hidden (400). Takes effect on each visitor's
      next token mint; nothing needs reinstalling.

      Once saved, the server enforces it too: a message that would open a
      conversation without a required name, username or e-mail (sent or
      already on the contact) is refused on `/customer/chat/events`.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/PrechatConfig" }
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PrechatSettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

salesTracker:
  get:
    tags: [Settings]
    operationId: getSalesTrackerSettings
    summary: Sales tracker configuration
    description: |
      How the workspace tracks orders reported by the widget snippet
      (FR-MOD-13.5): whether tracking is on, the currency revenue is recorded
      in, and how many days after a chat a sale still counts as attributed to
      it. A workspace that has never configured it reads the shipped defaults
      (`enabled` false), with no side effect — there is no row until the first
      save. License-scoped, not brand-scoped: tracking does not vary by brand.
    responses:
      "200":
        description: The current configuration
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SalesTrackerSettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  put:
    tags: [Settings]
    operationId: setSalesTrackerSettings
    summary: Change the sales tracker configuration
    description: |
      Creates the row on first write, filling unset fields from the defaults, so
      a partial save lands a complete, valid configuration. At least one field
      is required and unknown fields are rejected — a mistyped name would
      otherwise be dropped silently while the screen reported a successful save.
      The currency must be one of the supported ISO 4217 codes and the
      attribution window an integer between 1 and 90 days.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/UpdateSalesTrackerSettings" }
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SalesTrackerSettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

appearance:
  get:
    tags: [Settings]
    operationId: getWorkspaceAppearanceSettings
    summary: The workspace's default panel font
    description: |
      Readable by every member (owner, 2026-10-13): the account menu and the
      Appearance section both say where the font comes from. A workspace that
      never set one reads `font_preset: null`, with no side effect.
    responses:
      "200":
        description: The current default
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WorkspaceAppearanceSettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  put:
    tags: [Settings]
    operationId: setWorkspaceAppearanceSettings
    summary: Set or remove the workspace's default panel font
    description: |
      **Owner only** — admin and vice-owner get `403`. A preset is stamped
      with the time of the write, which is what "latest wins" orders against
      each member's own choice; `null` removes the default and its time.
      Written to the audit log.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/UpdateWorkspaceAppearanceSettings" }
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WorkspaceAppearanceSettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

routingRules:
  get:
    tags: [Settings]
    operationId: listRoutingRules
    summary: Rules deciding which team receives a conversation
    description: |
      Evaluated in `priority` order; the first rule whose conditions *all* match
      wins. The fallback rule has no conditions and catches everything else —
      exactly one exists per kind, enforced by a partial unique index, because a
      workspace with no fallback silently drops conversations nobody has claimed.
    responses:
      "200":
        description: The rules
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/RoutingRule" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Settings]
    operationId: createRoutingRule
    summary: Add a routing rule
    description: |
      Admin or owner only.

      Two shapes, and the difference is `is_fallback`:

      * A **conditional** rule must name a `target_group_id` — one that routes
        nowhere can never send a conversation anywhere, and would sit in the
        list looking configured.
      * The **fallback** catches everything the conditional rules missed. At
        most one exists per `kind`, so asking for a second is a 409
        (`fallback_rule_exists`): with two of them, which team receives an
        unmatched conversation would depend on row order, and nothing on the
        screen would say so.

      `conditions` are the match predicates (`url_contains`, `url_equals`,
      `country_codes`), plus `expertise_ids`, which is not a match predicate —
      it narrows the eligible agent pool (FR-MOD-08.6.3). An id naming no
      expertise area on this workspace is a 404, and a `target_group_id` naming
      no team here is a 400.

      Records `settings.routing_rule_created`.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/RoutingRuleInput" }
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/RoutingRule" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: This workspace already has a fallback rule for that kind (`fallback_rule_exists`)
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

routingRule:
  parameters:
    - name: ruleId
      in: path
      required: true
      schema: { type: string, format: uuid }

  patch:
    tags: [Settings]
    operationId: updateRoutingRule
    summary: Enable, disable or retarget a rule
    description: |
      The fallback rule cannot be disabled. Turning it off would leave
      conversations that match nothing with nowhere to go, and they would sit
      unassigned with no indication anything was wrong.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              enabled: { type: boolean }
              target_group_id: { type: integer, format: int64, nullable: true }
              priority: { type: integer, minimum: 0, maximum: 1000 }
              conditions:
                type: object
                description: |
                  Replaces the rule's conditions wholesale. `expertise_ids` lists
                  the areas of expertise an agent must *all* hold to receive
                  chats this rule routes (FR-MOD-08.6.3); an id naming no
                  expertise on this workspace is rejected (404). Not a match
                  condition — see `RoutingRule.conditions`.
                additionalProperties: true
                properties:
                  expertise_ids:
                    type: array
                    items: { type: integer, format: int64 }
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/RoutingRule" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: The fallback rule cannot be disabled
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  delete:
    tags: [Settings]
    operationId: deleteRoutingRule
    summary: Remove a routing rule
    description: |
      Admin or owner only.

      The fallback rule cannot be deleted, for the reason it cannot be disabled:
      conversations matching nothing would have nowhere to go, and the
      configuration would still look healthy. A delete that was allowed would
      also be a way around the disable refusal. Retarget it instead
      (`PATCH … { target_group_id }`).

      A team the deleted rule was the last one pointing at becomes deletable
      again — `DELETE /groups/{groupId}` refuses while any rule targets it.

      Records `settings.routing_rule_deleted`.
    responses:
      "204": { description: Deleted }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

# Expertise catalogue — the areas skill-based routing draws on (FR-MOD-08.6.3).
# Named "expertise" at the data layer because "skills" is already the
# AI-automation Skill (ADR-14, a different concept); the product surface may
# still call these skills. Reads are open to any `access_rules` holder; writes
# are admin/owner only — both the scope and the role are checked.
expertise:
  get:
    tags: [Settings]
    operationId: listExpertise
    summary: Expertise areas for skill-based routing
    description: |
      The catalogue of expertise areas a licence defines (FR-MOD-08.6.3),
      ordered by name. Also read by the assignment UI to offer areas per agent.
    responses:
      "200":
        description: Expertise areas
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/Expertise" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Settings]
    operationId: createExpertise
    summary: Add an expertise area
    description: |
      Admin or owner only (both the scope and the role are checked). The slug is
      derived from the name and is unique within the licence, so two areas whose
      names differ only by case or spacing are refused as a duplicate (`409`).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Expertise" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409":
        description: An expertise area with a similar name already exists
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

expertiseItem:
  parameters:
    - name: expertiseId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  delete:
    tags: [Settings]
    operationId: deleteExpertise
    summary: Remove an expertise area
    description: |
      Admin or owner only. Deleting an area also removes it from every agent it
      was assigned to and from every team that required it (the rows cascade),
      so routing stops drawing on it immediately. The one area the
      `responsible_gambling` team still requires — its training — is refused
      (409 `group_protected`, `details.reason: required_expertise`): that team
      never goes without one (K14).
    responses:
      "204": { description: Deleted }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409": { $ref: "../openapi.yaml#/components/responses/Conflict" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

tags:
  get:
    tags: [Settings]
    operationId: listTags
    summary: The workspace tag library
    description: |
      Curated labels for conversations (FR-MOD-08.7.1). The inbox reads the same
      list to suggest tags as an agent types, so a name here is the vocabulary a
      team has agreed on. Ordered by name. `usage_count` is how many
      conversations currently carry each tag.
    responses:
      "200":
        description: The library
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/Tag" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Settings]
    operationId: createTag
    summary: Add a tag to the library
    description: |
      The name is stored lowercased and trimmed, and must be unique within the
      workspace — the same normalisation the inbox applies when an agent tags a
      conversation, so the library and live tagging never diverge into two
      spellings of one label. `group_ids` scopes the tag to specific teams; an
      empty list makes it available workspace-wide.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 64 }
              group_ids:
                type: array
                maxItems: 50
                items: { type: integer, format: int64 }
    responses:
      "201":
        description: Added
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Tag" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409":
        description: A tag with that name already exists
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

tag:
  parameters:
    - name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }

  patch:
    tags: [Settings]
    operationId: updateTag
    summary: Rename a tag or change its team scope
    description: |
      Renaming updates every conversation already carrying the tag — the label
      is a single row threads point at, not a copied string — so a fixed typo is
      corrected everywhere at once.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              name: { type: string, minLength: 1, maxLength: 64 }
              group_ids:
                type: array
                maxItems: 50
                items: { type: integer, format: int64 }
    responses:
      "200":
        description: Updated
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Tag" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "409":
        description: A tag with that name already exists
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  delete:
    tags: [Settings]
    operationId: deleteTag
    summary: Remove a tag from the library
    description: |
      Removes the tag from every conversation that carries it. Retiring a label
      is deliberate: the conversations remain, they simply lose that tag.
    responses:
      "204": { description: Deleted }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

# --- Sandbox workspace (FR-MOD-11.5 · 11.5-f) --------------------------------
#
# A sandbox is a **second tenant**, not a mode: its own organization, its own
# licence, its own row level security scope. It is never metered, never
# invoiced, and its members are never seats on the parent's bill.
#
# The read is open on every plan (the split `/settings/siem` and `/settings/sla`
# established — a workspace must be able to see what it would be buying).
# Creating is Enterprise-only and owner-only. Resetting is owner-only and
# refused anywhere but *inside* a sandbox, so a production credential cannot
# wipe anything however it is obtained.
#
# What a sandbox does not inherit is its plan: it holds no subscription, so the
# Enterprise controls (SSO, SIEM export, white label, SLA targets, HIPAA) are
# refused inside it exactly as on any unpaid workspace. That is also what stops
# a sandbox creating a sandbox.

sandbox:
  get:
    tags: [Settings]
    operationId: getSandbox
    summary: This workspace's sandbox
    description: |
      Answers from either end. From a production workspace: whether the plan
      includes a sandbox, and the one it has if any. From inside a sandbox:
      `is_sandbox` is true and nothing else is populated — the parent licence is
      not named, and no credential for a sandbox can reach it.

      Creates nothing. A workspace that has never made a sandbox reads as
      `sandbox: null`.
    responses:
      "200":
        description: Where the caller stands
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SandboxView" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Settings]
    operationId: createSandbox
    summary: Create the sandbox workspace
    description: |
      **Enterprise only** (`sandbox` entitlement, FR-MOD-11.5), and owner only.

      Creates a whole second workspace: its own organization, licence, default
      brand, OAuth client and an owner membership for the caller. The region is
      inherited from this workspace and cannot be chosen — a sandbox holds data
      shaped exactly like production's, so letting it land elsewhere would move
      that data across the border residency exists to draw (C4-a).

      Sign in to it by calling `POST /auth/login`, which now lists it as a
      second membership, and then `POST /auth/authorize` with its `license_id`
      and `client_id`.

      A licence may hold at most one sandbox; asking for a second is a 409.
      Asking from inside a sandbox is a 403 — sandboxes do not nest.

      Records `settings.sandbox_created` in **this** workspace's audit trail.
      The sandbox's own trail starts empty, as a fresh workspace's does.

      Nothing about the new workspace is billable: no subscription, no card, no
      usage packages, and every write under `/billing/` is refused inside it.
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/SandboxView" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "409":
        description: This workspace already has a sandbox (`sandbox_exists`)
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

sandboxReset:
  post:
    tags: [Settings]
    operationId: resetSandbox
    summary: Empty the sandbox you are signed in to
    description: |
      Deletes everything the sandbox holds — chats, tickets, customers,
      settings, members' credentials — and leaves the workspace itself in place
      with the same licence id and the same members.

      **Only reachable from inside a sandbox.** Called with a credential for a
      production workspace it answers 403 and deletes nothing, so a stolen
      production token cannot wipe a workspace at all. There is no way to reset
      *someone else's* workspace, including your own sandbox from outside it.

      Every credential issued inside the sandbox is deleted with it, including
      the one making this call — `signed_out` says so. Sign in again to
      continue.

      No `sandbox` entitlement is required: a sandbox holds no subscription, so
      requiring one would refuse every reset. The entitlement guards creating a
      sandbox, which is the commercial act.
    responses:
      "200":
        description: Emptied
        content:
          application/json:
            schema:
              type: object
              required: [reset_at, signed_out]
              properties:
                reset_at:
                  type: string
                  format: date-time
                  description: >-
                    The moment it was emptied. Also readable afterwards by the
                    parent workspace as `sandbox.reset_at`.
                signed_out:
                  type: boolean
                  description: >-
                    Always true. The credential that made this call was deleted
                    with the workspace's data.
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

# --- Member recognition (ID-03 · decision K4 · tm 287) -----------------------
#
# Settings › Security › Member recognition: how a returning visitor is
# recognised by the member token the widget keeps (docs/adr/member-recognition.md).
# Written by tm 287.1, served by `routes/member-recognition.ts` since tm 287.2.
#
# Licence-scoped, not brand-scoped — no `X-SiyahTus-Brand`: the member token and
# its key are the licence's, and a member is the same person on every brand's
# site.

memberRecognition:
  get:
    tags: [Settings]
    operationId: getMemberRecognitionSettings
    summary: How returning visitors are recognised
    description: |
      The member-token lifetime, whether agents see possible matches, the
      signing key's version and rotation state (never the key itself) and the
      latest bulk revocation (ID-03 · decision K4). A workspace that never saved
      these reads the defaults; reading creates nothing.

      `access_rules:ro` (or `:rw`) plus `minimumRole: admin`, like the other
      Security settings.
    responses:
      "200":
        description: The current settings
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/MemberRecognitionSettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  patch:
    tags: [Settings]
    operationId: updateMemberRecognitionSettings
    summary: Change the token lifetime or the possible-match switch
    description: |
      Creates the row on first write; only the fields sent change. A new
      lifetime applies to the tokens signed from then on — every visit
      re-signs, so a returning member picks it up on their next visit — and
      does not cut short a token already issued.

      `access_rules:rw` plus `minimumRole: admin`. Writes an audit entry naming
      the fields changed and their old and new values.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/MemberRecognitionSettingsInput" }
    responses:
      "200":
        description: The settings after the change
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/MemberRecognitionSettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

memberRecognitionRotateKey:
  post:
    tags: [Settings]
    operationId: rotateMemberTokenKey
    summary: Replace the member-token signing key
    description: |
      Generates a new signing key. The replaced key stays accepted for
      `grace_period_seconds` (default 7 days): a member who visits in that time
      is re-signed under the new key and notices nothing, and a token the old
      key signed is refused once the window closes — that browser starts again
      as a new visitor. `0` retires the old key at once, the rotation for a key
      that may have leaked. One previous key at a time: rotating again inside
      the window drops the oldest key immediately.

      The key is never returned, by this or any endpoint. `access_rules:rw`
      plus `minimumRole: admin`; audited.
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/MemberKeyRotationInput" }
    responses:
      "200":
        description: The settings, with the new key's version
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/MemberRecognitionSettings" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

memberRecognitionRevokeAll:
  post:
    tags: [Settings]
    operationId: revokeAllMemberTokens
    summary: Forget every returning visitor at once
    description: |
      Refuses every member token this licence has issued so far, and every
      re-signing of them: each browser's next visit is a new anonymous
      customer, and nobody is recognised until they come back and are given a
      new token. The one-time trade of an id from before member tokens closes
      for the whole organization as well. Earlier conversations stay with
      their customer records, and agents can still link a member to them.

      `access_rules:rw` plus `minimumRole: admin`; audited.
    responses:
      "200":
        description: The settings, `tokens_revoked_before` now this moment
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/MemberRecognitionSettings" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
