# Real-time traffic — the live-visitor side of Customers (FR-MOD-03.1).
#
# A different question from `GET /customers`: not "who has ever contacted us"
# but "who is on the site right now, and what are they doing". A row is a person
# with either an active conversation or a visit inside the live window, and its
# headline fact is the **Chatting with** column — the human agent or the AI
# persona the visitor is currently talking to (FR-MOD-03.1.3). That column is
# what lets a supervisor decide, at a glance, whether to step in.

traffic:
  get:
    tags: [Customers]
    operationId: listTraffic
    summary: Live visitors on the site right now
    description: |
      Everyone with an active conversation, plus everyone whose most recent
      visit falls inside the live window (30 minutes) — the union, one row per
      person, ordered by most recent activity.

      `activity` is where they are in the funnel:
        - `browsing`   — on the site, no conversation yet.
        - `queued`     — wrote in, still waiting in the routing queue.
        - `waiting`    — an agent has the chat, the visitor's last message is unanswered.
        - `chatting`   — mid-conversation, the ball is not in the visitor's court.
        - `supervised` — an agent is watching the conversation without being the respondent yet.
        - `invited`    — proactively invited to chat, hasn't replied yet.

      `chatting_with` is who is answering: a human assignee wins over the AI
      persona, exactly as the widget header resolves it (FR-MOD-11.3). Null while
      nobody is (a browsing or freshly queued visitor).

      **Filtering (FR-MOD-13.2 "Match all filters" / "Add filter").** Every
      parameter below is optional and independent: adding one is "Add filter",
      and a visitor has to satisfy *all* the ones you sent to stay on the board
      ("Match all filters"). Omitting a parameter places no restriction, so
      sending none returns the whole board. There is no OR mode.

      A condition a row cannot answer is a condition it fails. `group_id` is
      carried by a conversation, so browsing and invited visitors never match
      it; `page_url_contains` / `came_from_contains` are carried by a visit
      inside the live window, so a visitor with no such visit never matches
      them. An unknown key is rejected (400) rather than ignored — a silently
      dropped filter would show more people than the caller asked for.
    parameters:
      - name: activity
        in: query
        description: |
          Funnel states to keep, repeated once per state
          (`?activity=queued&activity=waiting`). Omitted means every state.
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            enum: [browsing, queued, waiting, chatting, supervised, invited]
      - name: page_url_contains
        in: query
        description: |
          Case-insensitive substring of any page URL recorded on the visitor's
          most recent visit inside the live window.
        schema: { type: string, minLength: 1, maxLength: 2048 }
      - name: came_from_contains
        in: query
        description: |
          Case-insensitive substring of the referrer on that same visit.
        schema: { type: string, minLength: 1, maxLength: 2048 }
      - name: country_code
        in: query
        description: ISO 3166-1 alpha-2, matched case-insensitively.
        schema: { type: string, minLength: 2, maxLength: 2 }
      - name: is_lead
        in: query
        description: Keep only leads (`true`) or only non-leads (`false`).
        schema: { type: boolean }
      - name: group_id
        in: query
        description: |
          Keep only visitors whose conversation is routed to this team. A group
          id that is not one of the caller's own returns an empty board rather
          than a 404, so group ids stay un-enumerable across licenses (NFR-S5).
        schema: { type: integer, format: int64 }
      - $ref: "../openapi.yaml#/components/parameters/Limit"
    responses:
      "200":
        description: The live visitors
        content:
          application/json:
            schema:
              type: object
              required: [items, total]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/TrafficVisitor" }
                total:
                  type: integer
                  description: Live visitors returned — capped at `limit`.
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
