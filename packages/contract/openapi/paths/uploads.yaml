issueUpload:
  post:
    tags: [Uploads]
    operationId: createUpload
    summary: Ask permission to upload an attachment
    description: |
      The rules from `security_settings` (FR-MOD-08.9.4) are enforced here,
      before any bytes move: file sharing switched off, a type outside
      `allowed_file_types`, or a size above `max_file_size_bytes` all fail at
      this step and no URL is issued. A grant that never exists is a file that
      can never be stored, which is why this is the enforcement point rather
      than the PUT alone.

      The returned `upload_url` carries its own signature and is good for one
      file of exactly the declared type and length, for `UPLOAD_URL_TTL`
      seconds. `file_url` is what belongs on the event as `attachment_url`; it
      does not expire and is authorised by session instead.

      **`purpose: knowledge_document`** (tm 313 · AI-18) asks for a PDF or Word
      document for the knowledge base instead. The conversation's file-sharing
      rules do not apply to it — they govern what a chat may carry; this is
      the knowledge editor's own upload, so it needs the
      `agents-bot--all:rw` scope, and a customer or a member without that
      scope is refused (403). Only `application/pdf` and the DOCX type are
      granted (400, `details.reason` `unsupported_type`), up to 20 MiB (400,
      `file_too_large`). The grant carries `upload_id` and no `file_url`: the
      document is stored under a key `GET /uploads/{key}` never serves, and
      `POST /knowledge-sources/document` is what takes `upload_id`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content_type, size_bytes]
            properties:
              filename:
                type: string
                maxLength: 255
                description: |
                  Advisory only. The stored key is `<licence>/<uuid><ext>` with
                  the extension rebuilt from `content_type`; the supplied name
                  never becomes a path segment.
              content_type: { type: string, maxLength: 255, example: image/png }
              size_bytes: { type: integer, minimum: 1, example: 20480 }
              purpose:
                type: string
                enum: [attachment, knowledge_document]
                default: attachment
                description: |
                  `attachment` — a file in a conversation (the default);
                  `knowledge_document` — a PDF or DOCX for the knowledge base.
    responses:
      "201":
        description: Permission granted
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/UploadGrant" }
      "400":
        description: |
          The type is not in `allowed_file_types`, or the size is above the
          licence ceiling. `details` carries the rule that refused it. For a
          `knowledge_document`, `details.reason` is `unsupported_type` or
          `file_too_large`.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403":
        description: |
          File sharing is switched off for this licence; or, for a
          `knowledge_document`, the caller is not a member holding
          `agents-bot--all:rw`.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

uploadPolicy:
  get:
    tags: [Uploads]
    operationId: getUploadPolicy
    summary: Whether file sharing is on for this licence
    description: |
      Just the on/off switch from `security_settings` (FR-MOD-08.9.4) — not the
      allowed types or size ceiling, which stay server-only (a client-side
      pre-check of those would only duplicate what `POST /uploads` already
      refuses). Reachable by every agent role, unlike `GET /settings/security`
      (`access_rules:ro`, admin-only): the composer needs this to decide
      whether to show the attachment button at all, before the agent has
      picked a file and hit the refusal.
    responses:
      "200":
        description: The licence's file-sharing switch
        content:
          application/json:
            schema:
              type: object
              required: [file_sharing_enabled]
              properties:
                file_sharing_enabled: { type: boolean }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

uploadObject:
  parameters:
    - name: key
      in: path
      required: true
      schema: { type: string }
      description: The opaque `<licence>/<uuid><ext>` key from the grant.
  put:
    tags: [Uploads]
    operationId: putUpload
    summary: Send the bytes for a granted upload
    description: |
      Authorised by the signature in the query string, not by a session — it is
      narrower than one: a single key, type and length, inside a short window.
      The declared type and length are compared against what the request
      actually carries, so a grant for a small PNG cannot deliver a large
      anything-else.

      Every rejection answers the same way. Telling a caller which part of a
      forgery failed is how a forgery gets refined.

      The bytes are virus-scanned before anything is stored; a scanner that
      cannot be reached refuses the upload (503) rather than storing it
      unscanned. A `knowledge_document`'s type is then read from its bytes —
      `%PDF-` at the first byte, or a ZIP listing `word/document.xml` and no
      VBA project — and must be the type the grant was for: anything else
      (a renamed executable, a `.docm`) is a 400 with `details.reason`
      `unsupported_type`, and nothing is stored.
    security: []
    parameters:
      - { name: content_type, in: query, required: true, schema: { type: string } }
      - { name: size_bytes, in: query, required: true, schema: { type: integer } }
      - { name: expires_at, in: query, required: true, schema: { type: integer } }
      - { name: signature, in: query, required: true, schema: { type: string } }
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    responses:
      "201":
        description: Stored
        content:
          application/json:
            schema:
              type: object
              required: [upload_id, size_bytes, checksum_sha256]
              properties:
                upload_id: { type: string, description: The stored key, as in the grant. }
                file_url:
                  type: string
                  description: Where an attachment is readable; absent for a `knowledge_document`.
                size_bytes: { type: integer }
                checksum_sha256: { type: string }
      "400":
        description: |
          The virus scan refused the file (`details.reason` `virus_detected`),
          or a `knowledge_document`'s bytes are not the document type granted
          (`unsupported_type`). Nothing was stored.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "403":
        description: The URL is expired, forged, or does not match the bytes sent
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "503":
        description: The virus scanner could not be reached; nothing was stored.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }

  get:
    tags: [Uploads]
    operationId: getUpload
    summary: Fetch a stored attachment
    description: |
      Authorised by session, and the licence inside the key has to match the
      caller's. A key belonging to another licence answers `404`, not `403`:
      whether it exists is not something this caller gets to learn.

      Served as `content-disposition: attachment` with `nosniff`. An allowed
      `text/plain` rendered inline in our own origin would be stored XSS given
      away for free.

      A knowledge document's key (`purpose: knowledge_document`) is not an
      attachment and answers `404` here, for every caller: its original is
      reached only through `GET /knowledge-sources/{sourceId}/file`.
    responses:
      "200":
        description: The file
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

knowledgeFile:
  parameters:
    - name: key
      in: path
      required: true
      schema: { type: string }
      description: A knowledge document's key, from the link `GET /knowledge-sources/{sourceId}/file` issued.
  get:
    tags: [Uploads]
    operationId: getKnowledgeFile
    summary: Download a knowledge document's original through a signed link
    description: |
      Follows a link `GET /knowledge-sources/{sourceId}/file` issued (tm 313 ·
      AI-18-S2). Authorised by the signature, not a session — a browser
      following a link sends no bearer token — and narrower than one: one
      document, one filename, five minutes. Every refusal (a forged or changed
      link, an expired one, a key that is not a knowledge document's) is the
      same 403; an object that is no longer stored is a 404.

      Served as `content-disposition: attachment` with `nosniff` and
      `cache-control: no-store`, never inline.
    security: []
    parameters:
      - { name: filename, in: query, required: true, schema: { type: string } }
      - { name: expires_at, in: query, required: true, schema: { type: integer } }
      - { name: signature, in: query, required: true, schema: { type: string } }
    responses:
      "200":
        description: The original file
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      "403":
        description: The link is forged, changed or expired
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Error" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
