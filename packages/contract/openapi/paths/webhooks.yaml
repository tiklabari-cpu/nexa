# Outbound webhooks — FR-MOD-08.8.4 (v1, Must).
#
# A workspace registers a URL to be POSTed when something happens in SiyahTuş
# (a chat starts, a thread closes, …). This is the platform's highest-risk
# egress surface (NFR-S7, risk R1/R2): the *server* makes a request to a
# customer-supplied URL, so registration and delivery are both guarded against
# SSRF, and every delivery is signed with HMAC-SHA256 (v2-04 §6.2/§6.3).
#
# The signing secret is returned exactly once, from the register call. It is
# stored to sign later deliveries but never echoed back by list — a secret a
# list endpoint re-exposed would turn read access into the ability to forge
# signatures.

webhooks:
  get:
    tags: [Webhooks]
    operationId: listWebhooks
    x-public: true
    summary: Webhooks registered for the workspace
    description: |
      Never includes the signing secret — that is shown only once, when the
      webhook is registered.
    responses:
      "200":
        description: The workspace's webhooks
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "../openapi.yaml#/components/schemas/Webhook" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  post:
    tags: [Webhooks]
    operationId: registerWebhook
    x-public: true
    summary: Register an outbound webhook
    description: |
      The `url` must be a public `http(s)` address; a private, loopback or
      link-local target is rejected at registration (SSRF, NFR-S7), and checked
      again at delivery in case DNS changes underneath it.

      A refused `url` carries `error.details.reason` (tm 261): `url_invalid`,
      `url_scheme`, `url_credentials` or `url_private_host`. A refused `app_id`
      carries `app_not_automation` or `app_not_connected` (with `app_name`).

      The response carries the signing `secret` **once**. Store it: every
      delivery is signed `HMAC-SHA256(secret, "{timestamp}.{nonce}.{body}")` in
      the `X-Webhook-Signature` header, and there is no way to retrieve the
      secret again — a lost secret means deleting and re-registering.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url, action]
            properties:
              url:
                type: string
                format: uri
                maxLength: 2048
                description: Public http(s) endpoint that receives the POST.
              action:
                $ref: "../openapi.yaml#/components/schemas/WebhookAction"
              type:
                type: string
                enum: [license, bot]
                default: license
                description: |
                  `license` for a workspace integration, `bot` for one scoped to
                  a single bot client. Defaults to `license`.
              app_id:
                type: string
                maxLength: 64
                description: |
                  Attach this subscription to a connected automation card
                  (FR-MOD-09.4) — `zapier` or `make`. This is the Zapier REST
                  Hooks leg: a zap's catch hook is registered here like any
                  other subscriber, and the card then reports how many triggers
                  it owns and when one last fired.

                  Two refusals, both 400: the id must name an automation card
                  (no other kind of app may own a subscription), and that card
                  must already be connected in this workspace. Disconnecting it
                  removes every subscription registered this way, so a
                  workspace event cannot reach an integration nobody agreed to.

                  Omit it for an ordinary webhook — the default, and what every
                  subscription registered before 09.4 is.
    responses:
      "201":
        description: Registered — the secret is present on this response only
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WebhookRegistration" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

webhook:
  parameters:
    - name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }

  delete:
    tags: [Webhooks]
    operationId: unregisterWebhook
    x-public: true
    summary: Unregister a webhook
    description: |
      Stops all future deliveries to this endpoint. Past delivery log entries
      are removed with it.
    responses:
      "204": { description: Unregistered }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

  patch:
    tags: [Webhooks]
    operationId: updateWebhook
    x-public: true
    summary: Switch a webhook on or off
    description: |
      Only `enabled` can change (KN-03): a switched-off webhook receives no new
      events, and a delivery still queued for it is given up rather than sent
      (consent withdrawn). The URL, event and secret are fixed at registration —
      to change one, register a new webhook.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [enabled]
            additionalProperties: false
            properties:
              enabled: { type: boolean }
    responses:
      "200":
        description: The webhook as it is now
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Webhook" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

webhookDeliveries:
  parameters:
    - name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }

  get:
    tags: [Webhooks]
    operationId: listWebhookDeliveries
    x-public: true
    summary: The delivery log of one webhook
    description: |
      One row per **attempt**, newest first, by `next_cursor` (KN-03). A row
      says what happened to one send: the HTTP status the receiver answered
      with and a short, cleaned error (`http_503`, `ssrf_blocked`,
      `ECONNREFUSED`, `AbortError` — never a response body, a URL or a secret;
      at most 500 characters).

      `state` filters: `pending` (another try is queued), `delivered`,
      `failed` (an attempt a later one superseded) or `exhausted` (gave up).
      `can_redeliver` says whether "Redeliver" would work on the row — the
      payload of an exhausted delivery is kept 72 hours, a delivered one is
      never kept.
    parameters:
      - name: state
        in: query
        schema:
          type: string
          enum: [pending, delivered, failed, exhausted]
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      - name: cursor
        in: query
        schema: { type: string, maxLength: 512 }
    responses:
      "200":
        description: A page of delivery attempts
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WebhookDeliveryList" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

webhookRedeliver:
  parameters:
    - name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    - name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }

  post:
    tags: [Webhooks]
    operationId: redeliverWebhookDelivery
    x-public: true
    summary: Send a delivery again
    description: |
      Re-sends the stored payload of a queued or exhausted delivery through the
      normal sender — the SSRF check, the signature and a fresh nonce included —
      and returns the **new attempt row**, which is also the newest row of the
      log. The row it replaces becomes `failed` (superseded).

      A refused redelivery is a `400` validation error whose
      `error.details.reason` is `not_redeliverable` (a delivered attempt, a test
      ping, a row whose payload has aged out, or one that is no longer the
      newest attempt) or `webhook_disabled`.
    responses:
      "200":
        description: The new attempt
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WebhookDelivery" }
      "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

webhookTest:
  parameters:
    - name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }

  post:
    tags: [Webhooks]
    operationId: testWebhook
    x-public: true
    summary: Send a signed test event
    description: |
      POSTs a signed ping to the webhook — `{"action": …, "test": true, "data":
      {…}}` with the same headers a real delivery carries — and returns what the
      receiver answered. The attempt is logged with `test: true`, is never
      queued for a retry, and does not count toward an automation card's "last
      run". Works on a switched-off webhook too (check it before switching on).
      A few per minute per webhook; `429` beyond that.
    responses:
      "200":
        description: The attempt
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WebhookDelivery" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "404": { $ref: "../openapi.yaml#/components/responses/NotFound" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }

integrationManifest:
  get:
    tags: [Webhooks]
    operationId: getIntegrationManifest
    summary: Trigger + action catalogue for building a Zapier/Make app
    description: |
      A static, machine-readable description of this webhook surface (FR-MOD-09.4):
      every event a subscriber can register for (`triggers`, one per
      `WebhookAction`, each with a sample delivery body) and a hand-picked
      subset of existing write endpoints an automation platform's "action" step
      may call (`actions`), plus where to `subscribe`/`unsubscribe` — the
      existing `POST /webhooks` / `DELETE /webhooks/{webhookId}` pair (Zapier's
      REST Hooks model).

      Identical for every caller: the response carries no tenant data, reads
      nothing from storage and calls nothing. Gated on the same scope as
      `GET /webhooks` — no new scope is introduced.
    responses:
      "200":
        description: The trigger + action catalogue
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/IntegrationManifest" }
      "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
      "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
      "429": { $ref: "../openapi.yaml#/components/responses/TooManyRequests" }
