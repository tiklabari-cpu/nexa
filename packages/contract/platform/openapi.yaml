        disabled_at: { type: ["string", "null"], format: date-time }
        invited_by: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }
        active_sessions: { type: integer }
        last_seen_at: { type: ["string", "null"], format: date-time }

    PlatformAdminList:
