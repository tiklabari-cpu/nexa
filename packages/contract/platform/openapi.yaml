components:
  securitySchemes:
    platformSession:
      type: http
      scheme: bearer
      description: Opaque operator session token from the platform sign-in (tm 389.4).

  parameters:
    AdminId:
      name: adminId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      description: The account's id. Anything else is a 404, like an unknown one.
      schema: { type: string }
    LicenseId:
      name: licenseId
      in: path
      required: true
      description: The workspace's licence number. Anything else is a 404, like an unknown one.
      schema: { type: string, pattern: "^[1-9][0-9]{0,18}$" }
    BlocklistEntryId:
      name: entryId
      in: path
      required: true
      description: The blocklist entry's id. Anything else is a 404, like an unknown one.
      schema: { type: string }
    ImpersonationId:
      name: impersonationId
      in: path
      required: true
      description: The session's id. Anything else is a 404, like an unknown one.
      schema: { type: string }

  schemas:
    PlatformRole:
      type: string
      description: The operator roles (`PLATFORM_ROLES`, @siyahtus/types).
      enum: [superadmin, support, billing, readonly]

    PlatformPermission:
      type: string
      description: |
        A key of `PLATFORM_PERMISSIONS` (@siyahtus/types) — the matrix the
        server enforces and the admin SPA hides its menu by.
      enum:
        - dashboard.read
        - workspaces.read
        - accounts.read
        - billing.read
        - usage.read
        - settings.read
        - ai.read
        - operations.read
        - audit.read
        - security.read
        - admins.read
        - workspaces.support
        - workspaces.billing
        - workspaces.lifecycle
        - accounts.support
        - accounts.manage
        - billing.manage
        - usage.manage
        - settings.manage
        - ai.manage
        - operations.trigger
        - operations.run
        - security.manage
        - support.impersonate
        - support.impersonate_full
        - admins.manage

    PlatformLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 512 }

    PlatformCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The six digits from the authenticator app; spaces and dashes are forgiven.
          maxLength: 32

    PlatformVerifyRequest:
      description: Exactly one of the two.
      oneOf:
        - type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { type: string, maxLength: 32 }
        - type: object
          additionalProperties: false
          required: [recovery_code]
          properties:
            recovery_code:
              type: string
              description: One of the ten printed codes (`ABCDE-FGHJK`); each works once.
              maxLength: 32

    PlatformInviteAcceptRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: From the invitation link's fragment (`#token=…`).
          maxLength: 128
        password: { type: string, minLength: 12, maxLength: 200 }

    PlatformReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Why — recorded in the platform audit chain (tm 389.5).
          minLength: 3
          maxLength: 500

    PlatformRoleChangeRequest:
      type: object
      required: [role, reason]
      properties:
        role: { $ref: "#/components/schemas/PlatformRole" }
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformInviteRequest:
      type: object
      required: [email, role, reason]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { $ref: "#/components/schemas/PlatformRole" }
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformSession:
      type: object
      description: A session's clocks. Never its token.
      required:
        [
          id,
          stage,
          created_at,
          expires_at,
          last_seen_at,
          totp_verified_at,
          idle_timeout_s,
          recent_totp_until,
        ]
      properties:
        id: { type: string, format: uuid }
        stage:
          type: string
          description: "`password` until the second factor is shown, then `active`."
          enum: [password, active]
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: The absolute end (`PLATFORM_SESSION_TTL` after sign-in, 8 h).
        last_seen_at:
          type: string
          format: date-time
          description: The session ends `idle_timeout_s` after this without a request.
        totp_verified_at:
          type: ["string", "null"]
          format: date-time
        idle_timeout_s: { type: integer }
        recent_totp_until:
          type: ["string", "null"]
          format: date-time
          description: Until when `x-platform-recent-totp` routes accept this session.

    PlatformSessionEnvelope:
      type: object
      required: [session]
      properties:
        session: { $ref: "#/components/schemas/PlatformSession" }

    PlatformSignIn:
      type: object
      required: [token, next, session]
      properties:
        token:
          type: string
          description: "The opaque session token, shown once. Send it as `Authorization: Bearer <token>`."
        next:
          type: string
          enum: [totp_enroll, totp_verify]
        session: { $ref: "#/components/schemas/PlatformSession" }

    PlatformTotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32, for typing in by hand. }
        otpauth_uri: { type: string, description: The `otpauth://totp/…` URI to show as a QR code. }

    PlatformTotpActivation:
      type: object
      required: [token, session, recovery_codes]
      properties:
        token:
          { type: string, description: The new token; the password-stage one has stopped working. }
        session: { $ref: "#/components/schemas/PlatformSession" }
        recovery_codes:
          type: array
          description: Ten single-use codes, shown this once.
          items: { type: string }

    PlatformTotpVerification:
      type: object
      required: [token, session, method, recovery_codes_remaining]
      properties:
        token:
          { type: string, description: The new token; the password-stage one has stopped working. }
        session: { $ref: "#/components/schemas/PlatformSession" }
        method: { type: string, enum: [totp, recovery_code] }
        recovery_codes_remaining: { type: integer }

    PlatformRecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }

    PlatformMe:
      type: object
      required: [admin, permissions, session, recovery_codes_remaining]
      properties:
        admin:
          type: object
          required: [id, email, role, totp_enrolled_at, created_at]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            role: { $ref: "#/components/schemas/PlatformRole" }
            totp_enrolled_at: { type: ["string", "null"], format: date-time }
            created_at: { type: string, format: date-time }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/PlatformPermission" }
        session: { $ref: "#/components/schemas/PlatformSession" }
        recovery_codes_remaining: { type: integer }

    PlatformSessionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/PlatformSession"
              - type: object
                required: [ip, user_agent, current]
                properties:
                  ip: { type: ["string", "null"] }
                  user_agent: { type: ["string", "null"] }
                  current: { type: boolean }

    PlatformEndedCount:
      type: object
      required: [ended]
      properties:
        ended: { type: integer, description: How many sessions ended. }

    PlatformAlertKind:
      type: string
      description: |
        What the platform scan mails operators about (tm 389.20): a trial that ends
        within three days, a payment request waiting over 24 hours, a workspace at
        its daily AI cap, a red or stale health snapshot, a platform audit chain that
        no longer verifies, a workspace deleted tomorrow.
      enum:
        - trial_ending
        - payment_request_waiting
        - ai_cap_reached
        - health_red
        - audit_chain_broken
        - purge_tomorrow

    PlatformAlertPrefs:
      type: object
      required: [kinds, locale, customized, available]
      properties:
        kinds:
          type: array
          description: |
            The kinds this operator is mailed. Until they save a choice a superadmin
            gets every kind and the other roles none (`customized` is false).
          items: { $ref: "#/components/schemas/PlatformAlertKind" }
        locale:
          type: string
          enum: [en, tr]
          description: The language of the alert mail.
        customized: { type: boolean }
        available:
          type: array
          items: { $ref: "#/components/schemas/PlatformAlertKind" }

    PlatformAlertPrefsUpdate:
      type: object
      required: [kinds, locale]
      additionalProperties: false
      properties:
        kinds:
          type: array
          maxItems: 6
          uniqueItems: true
          items: { $ref: "#/components/schemas/PlatformAlertKind" }
        locale:
          type: string
          enum: [en, tr]

    PlatformAdmin:
      type: object
      required:
        [
          id,
          email,
          role,
          totp_enrolled,
          totp_enrolled_at,
          disabled_at,
          invited_by,
          created_at,
          active_sessions,
          last_seen_at,
        ]
      properties:
