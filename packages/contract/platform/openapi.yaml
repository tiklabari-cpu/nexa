openapi: 3.1.0

info:
  title: SiyahTuş Platform (root panel) API
  version: 1.0.0
  description: |
    The back office of a SiyahTuş deployment (tm 389 · `docs/platform-admin/design.md`).
    Served by its own process, `platform-api` (`node dist/src/platform.js`, port
    4002), under `/platform/v1` — never by the tenant API, which answers 404 for
    every path here. Its callers are SiyahTuş operators (`platform_admins`), not
    workspace members, and it connects to Postgres as `siyahtus_platform`.

    **A separate document on purpose.** Nothing here is part of the tenant
    contract (`packages/contract/openapi/openapi.yaml`): no tenant client
    generates types from it, nothing in it is `x-public`, and the tenant
    document never names a `/platform` path.

    **Errors** use the same envelope as the tenant API —
    `{ error: { type, message, request_id } }` (ADR-06). Types this surface
    adds are `platform_`-prefixed in `@siyahtus/types`.

    **Conventions every later module follows:** keyset paging `?cursor&limit`,
    free-text `?q`, and every mutation takes a `{reason}` that lands in the
    platform audit chain.

servers:
  - url: http://localhost:4002/platform/v1
    description: Local development (`pnpm --filter @siyahtus/api platform:dev`)

tags:
  - name: System
    description: Health and metadata.
  - name: Auth
    description: |
      Operator sign-in (tm 389.4): password, then a mandatory TOTP code; one
      opaque session token, `password` stage until the code, `active` after.
  - name: Admins
    description: Operator management — invitations, roles, disabling, second-factor resets.
  - name: Dashboard
    description: |
      The operator's landing screen (tm 389.8): workspace counts, the sign-up
      timeline, the tenant API's published health snapshot and the component record.
  - name: Audit
    description: |
      The platform audit chain (tm 389.5): every operator mutation and sign-in
      event, HMAC-chained, signed on export; a workspace's own trail, read-only.

# The operator session (tm 389.4) — an opaque bearer token, not a JWT. Every
# operation needs it unless it says `security: []`. What else it needs is in
# `x-platform-permission` (a `PLATFORM_PERMISSIONS` key, or `self`),
# `x-platform-stage` (when a `password`-stage session may call it) and
# `x-platform-recent-totp` (a code younger than five minutes). Every mutation
# names the audit entry it writes in `x-platform-audit` (tm 389.5); a POST that
# changes nothing says `x-platform-safe` instead.
security:
  - platformSession: []

paths:
  /health:
    $ref: "./paths/health.yaml#/narrow"
  /health/live:
    $ref: "./paths/health.yaml#/live"
  /health/ready:
    $ref: "./paths/health.yaml#/ready"
  /meta:
    $ref: "./paths/meta.yaml#/meta"
  /auth/login:
    $ref: "./paths/auth.yaml#/login"
  /auth/totp/enroll:
    $ref: "./paths/auth.yaml#/totpEnroll"
  /auth/totp/activate:
    $ref: "./paths/auth.yaml#/totpActivate"
  /auth/totp/verify:
    $ref: "./paths/auth.yaml#/totpVerify"
  /auth/totp/reverify:
    $ref: "./paths/auth.yaml#/totpReverify"
  /auth/recovery/regenerate:
    $ref: "./paths/auth.yaml#/recoveryRegenerate"
  /auth/me:
    $ref: "./paths/auth.yaml#/me"
  /auth/sessions:
    $ref: "./paths/auth.yaml#/sessions"
  /auth/logout:
    $ref: "./paths/auth.yaml#/logout"
  /auth/invite/accept:
    $ref: "./paths/auth.yaml#/inviteAccept"
  /admins:
    $ref: "./paths/admins.yaml#/admins"
  /admins/invites:
    $ref: "./paths/admins.yaml#/invites"
  /admins/invites/{inviteId}/revoke:
    $ref: "./paths/admins.yaml#/inviteRevoke"
  /admins/{adminId}:
    $ref: "./paths/admins.yaml#/admin"
  /admins/{adminId}/role:
    $ref: "./paths/admins.yaml#/role"
  /admins/{adminId}/disable:
    $ref: "./paths/admins.yaml#/disable"
  /admins/{adminId}/enable:
    $ref: "./paths/admins.yaml#/enable"
  /admins/{adminId}/reset-two-factor:
    $ref: "./paths/admins.yaml#/resetTwoFactor"
  /admins/{adminId}/revoke-sessions:
    $ref: "./paths/admins.yaml#/revokeSessions"
  /dashboard/kpis:
    $ref: "./paths/dashboard.yaml#/kpis"
  /dashboard/signups:
    $ref: "./paths/dashboard.yaml#/signups"
  /dashboard/health:
    $ref: "./paths/dashboard.yaml#/health"
  /audit:
    $ref: "./paths/audit.yaml#/audit"
  /audit/export:
    $ref: "./paths/audit.yaml#/export"
  /audit/verify:
    $ref: "./paths/audit.yaml#/verify"
  /audit/workspaces/{licenseId}:
    $ref: "./paths/audit.yaml#/workspace"

components:
  securitySchemes:
    platformSession:
      type: http
      scheme: bearer
      description: Opaque operator session token from the platform sign-in (tm 389.4).

  parameters:
    AdminId:
      name: adminId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    PlatformRole:
      type: string
      description: The operator roles (`PLATFORM_ROLES`, @siyahtus/types).
      enum: [superadmin, support, billing, readonly]

    PlatformPermission:
      type: string
      description: |
        A key of `PLATFORM_PERMISSIONS` (@siyahtus/types) — the matrix the
        server enforces and the admin SPA hides its menu by.
      enum:
        - dashboard.read
        - workspaces.read
        - accounts.read
        - billing.read
        - usage.read
        - settings.read
        - ai.read
        - operations.read
        - audit.read
        - security.read
        - admins.read
        - workspaces.support
        - workspaces.billing
        - workspaces.lifecycle
        - accounts.support
        - accounts.manage
        - billing.manage
        - usage.manage
        - settings.manage
        - ai.manage
        - operations.run
        - security.manage
        - support.impersonate
        - support.impersonate_full
        - admins.manage

    PlatformLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 512 }

    PlatformCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The six digits from the authenticator app; spaces and dashes are forgiven.
          maxLength: 32

    PlatformVerifyRequest:
      description: Exactly one of the two.
      oneOf:
        - type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { type: string, maxLength: 32 }
        - type: object
          additionalProperties: false
          required: [recovery_code]
          properties:
            recovery_code:
              type: string
              description: One of the ten printed codes (`ABCDE-FGHJK`); each works once.
              maxLength: 32

    PlatformInviteAcceptRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: From the invitation link's fragment (`#token=…`).
          maxLength: 128
        password: { type: string, minLength: 12, maxLength: 200 }

    PlatformReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Why — recorded in the platform audit chain (tm 389.5).
          minLength: 3
          maxLength: 500

    PlatformRoleChangeRequest:
      type: object
      required: [role, reason]
      properties:
        role: { $ref: "#/components/schemas/PlatformRole" }
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformInviteRequest:
      type: object
      required: [email, role, reason]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { $ref: "#/components/schemas/PlatformRole" }
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformSession:
      type: object
      description: A session's clocks. Never its token.
      required:
        [
          id,
          stage,
          created_at,
          expires_at,
          last_seen_at,
          totp_verified_at,
          idle_timeout_s,
          recent_totp_until,
        ]
      properties:
        id: { type: string, format: uuid }
        stage:
          type: string
          description: "`password` until the second factor is shown, then `active`."
          enum: [password, active]
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: The absolute end (`PLATFORM_SESSION_TTL` after sign-in, 8 h).
        last_seen_at:
          type: string
          format: date-time
          description: The session ends `idle_timeout_s` after this without a request.
        totp_verified_at:
          type: ["string", "null"]
          format: date-time
        idle_timeout_s: { type: integer }
        recent_totp_until:
          type: ["string", "null"]
          format: date-time
          description: Until when `x-platform-recent-totp` routes accept this session.

    PlatformSessionEnvelope:
      type: object
      required: [session]
      properties:
        session: { $ref: "#/components/schemas/PlatformSession" }

    PlatformSignIn:
      type: object
      required: [token, next, session]
      properties:
        token:
          type: string
          description: "The opaque session token, shown once. Send it as `Authorization: Bearer <token>`."
        next:
          type: string
          enum: [totp_enroll, totp_verify]
        session: { $ref: "#/components/schemas/PlatformSession" }

    PlatformTotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32, for typing in by hand. }
        otpauth_uri: { type: string, description: The `otpauth://totp/…` URI to show as a QR code. }

    PlatformTotpActivation:
      type: object
      required: [token, session, recovery_codes]
      properties:
        token:
          { type: string, description: The new token; the password-stage one has stopped working. }
        session: { $ref: "#/components/schemas/PlatformSession" }
        recovery_codes:
          type: array
          description: Ten single-use codes, shown this once.
          items: { type: string }

    PlatformTotpVerification:
      type: object
      required: [token, session, method, recovery_codes_remaining]
      properties:
        token:
          { type: string, description: The new token; the password-stage one has stopped working. }
        session: { $ref: "#/components/schemas/PlatformSession" }
        method: { type: string, enum: [totp, recovery_code] }
        recovery_codes_remaining: { type: integer }

    PlatformRecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }

    PlatformMe:
      type: object
      required: [admin, permissions, session, recovery_codes_remaining]
      properties:
        admin:
          type: object
          required: [id, email, role, totp_enrolled_at, created_at]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            role: { $ref: "#/components/schemas/PlatformRole" }
            totp_enrolled_at: { type: ["string", "null"], format: date-time }
            created_at: { type: string, format: date-time }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/PlatformPermission" }
        session: { $ref: "#/components/schemas/PlatformSession" }
        recovery_codes_remaining: { type: integer }

    PlatformSessionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/PlatformSession"
              - type: object
                required: [ip, user_agent, current]
                properties:
                  ip: { type: ["string", "null"] }
                  user_agent: { type: ["string", "null"] }
                  current: { type: boolean }

    PlatformEndedCount:
      type: object
      required: [ended]
      properties:
        ended: { type: integer, description: How many sessions ended. }

    PlatformAdmin:
      type: object
      required:
        [
          id,
          email,
          role,
          totp_enrolled,
          totp_enrolled_at,
          disabled_at,
          invited_by,
          created_at,
          active_sessions,
          last_seen_at,
        ]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/PlatformRole" }
        totp_enrolled: { type: boolean }
        totp_enrolled_at: { type: ["string", "null"], format: date-time }
        disabled_at: { type: ["string", "null"], format: date-time }
        invited_by: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }
        active_sessions: { type: integer }
        last_seen_at: { type: ["string", "null"], format: date-time }

    PlatformAdminList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformAdmin" }

    PlatformInvite:
      type: object
      required: [id, email, role, invited_by, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/PlatformRole" }
        invited_by: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    PlatformInviteList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformInvite" }

    PlatformInviteCreated:
      type: object
      required: [invite, mail]
      properties:
        invite: { $ref: "#/components/schemas/PlatformInvite" }
        mail: { type: string, enum: [sent, failed] }
        accept_url:
          type: string
          description: Only when `mail` is `failed` — hand the link over another way.

    PlatformAuditAction:
      type: string
      description: |
        The closed list of what the platform audit chain records
        (`PLATFORM_AUDIT_ACTIONS`, `services/platform/platform-audit.ts`).
        `<module>.<verb>`; the `admin.*` session events are the only ones
        recorded without a reason.
      enum:
        - admin.bootstrapped
        - admin.signed_in
        - admin.sign_in_failed
        - admin.invite_accepted
        - admin.totp_enrollment_started
        - admin.totp_enrolled
        - admin.totp_verified
        - admin.totp_failed
        - admin.totp_reverified
        - admin.recovery_codes_regenerated
        - admin.other_sessions_ended
        - admin.signed_out
        - admin.invited
        - admin.invite_revoked
        - admin.role_changed
        - admin.disabled
        - admin.enabled
        - admin.two_factor_reset
        - admin.sessions_revoked
        - workspace.note_added
        - workspace.trial_extended
        - workspace.activated
        - workspace.plan_changed
        - workspace.suspended
        - workspace.unsuspended
        - workspace.read_only_set
        - workspace.active_set
        - workspace.cancelled
        - workspace.resumed
        - workspace.overrides_changed
        - workspace.ai_caps_changed
        - workspace.owner_verification_resent
        - workspace.sandbox_reset
        - workspace.ownership_transferred
        - workspace.deletion_scheduled
        - workspace.deletion_cancelled
        - account.verification_resent
        - account.password_reset_forced
        - account.sessions_revoked
        - account.tokens_revoked
        - account.two_factor_reset
        - account.suspended
        - account.unsuspended
        - account.exported
        - account.erased
        - billing.plan_saved
        - billing.package_saved
        - billing.credit_granted
        - billing.manual_subscription_created
        - billing.payment_address_sent
        - billing.payment_confirmed
        - billing.payment_request_cancelled
        - billing.swift_marked_paid
        - billing.providers_updated
        - billing.bank_details_updated
        - billing.issuer_profile_updated
        - settings.updated
        - settings.maintenance_changed
        - ai_settings.updated
        - ai_settings.connection_tested
        - ai_settings.reembed_started
        - impersonation.started
        - impersonation.ended
        - security.blocklist_added
        - security.blocklist_removed
        - security.unverified_signups_purged

    PlatformAuditTarget:
      type: string
      description: What an entry is about (`target_type`).
      enum:
        - admin
        - invite
        - session
        - workspace
        - account
        - plan
        - package
        - invoice
        - payment_request
        - credit
        - settings
        - blocklist
        - impersonation

    PlatformAuditEntry:
      type: object
      required:
        [
          chain_seq,
          admin_id,
          action,
          target_type,
          target_id,
          license_id,
          reason,
          payload,
          ip,
          created_at,
        ]
      properties:
        chain_seq:
          type: string
          description: The entry's gapless position in the chain (a decimal integer).
        admin_id:
          type: ["string", "null"]
          format: uuid
          description: The operator; null for a sign-in nobody could be matched to.
        action: { $ref: "#/components/schemas/PlatformAuditAction" }
        target_type: { $ref: "#/components/schemas/PlatformAuditTarget" }
        target_id: { type: ["string", "null"] }
        license_id:
          type: ["string", "null"]
          description: The workspace the action concerns — it has its own `platform.*` entry too.
        reason:
          type: ["string", "null"]
          description: Why, in the operator's words; null only on `admin.*` session events.
        payload:
          type: object
          additionalProperties: true
          description: Identifiers, counts, changed field names — never values of secrets.
        ip: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }

    PlatformAuditList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformAuditEntry" }
        next_cursor: { type: ["string", "null"] }

    PlatformAuditExportRecord:
      description: One line of `GET /audit/export` — the entry and its two hashes.
      allOf:
        - $ref: "#/components/schemas/PlatformAuditEntry"
        - type: object
          required: [prev_hash, hash]
          properties:
            prev_hash: { type: ["string", "null"] }
            hash: { type: string }

    PlatformAuditVerification:
      type: object
      required: [ok, checked, first_seq, last_seq, head_seq, findings, findings_total]
      properties:
        ok: { type: boolean }
        checked: { type: integer, description: Entries recomputed and linked. }
        first_seq: { type: ["string", "null"] }
        last_seq: { type: ["string", "null"] }
        head_seq:
          type: ["string", "null"]
          description: The last position the chain head handed out.
        findings:
          type: array
          items:
            type: object
            required: [kind, seq, detail]
            properties:
              kind:
                type: string
                enum:
                  [
                    sequence_gap,
                    start_mismatch,
                    broken_link,
                    hash_mismatch,
                    unchained_entry,
                    head_mismatch,
                  ]
              seq:
                type: ["string", "null"]
                description: The position the finding is about (the first missing one for a gap).
              detail: { type: string }
        findings_total: { type: integer }

    PlatformWorkspaceAuditList:
      type: object
      description: The tenant API's `GET /audit-log` page, for one workspace.
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, action, actor_id, actor_type, target, metadata, ip, created_at]
            properties:
              id: { type: string, format: uuid }
              action: { type: string }
              actor_id: { type: ["string", "null"] }
              actor_type:
                type: string
                enum: [agent, bot, customer, system, platform]
              on_behalf_of: { type: string }
              target: { type: ["string", "null"] }
              metadata: { type: object, additionalProperties: true }
              ip: { type: ["string", "null"] }
              created_at: { type: string, format: date-time }
        next_page_id: { type: string }

    PlatformHealth:
      type: object
      description: |
        The narrow body — never version, latencies or provider names, which
        would be infrastructure detail for an anonymous caller. The detailed
        view is the dashboard's (`GET /dashboard/health`, tm 389.8), behind an
        operator session.
      required: [status, service]
      properties:
        status:
          type: string
          description: |
            `ok` every dependency is reachable · `degraded` at least one is not
            (503) · `draining` the process is shutting down (503, M-OPS-b).
          enum: [ok, degraded, draining]
        service:
          type: string
          enum: [platform]
        uptime_s:
          type: number
          description: Present on the liveness answer only.

    PlatformMeta:
      type: object
      description: What the admin SPA's permanent "PLATFORM · <region>" strip shows.
      required: [version, region]
      properties:
        version:
          type: string
          examples: [0.1.0]
        region:
          type: string
          enum: [eu, us]

    PlatformDashboardKpis:
      type: object
      required:
        - generated_at
        - workspaces
        - trials_ending_7d
        - active_operator_sessions
        - pending_payment_requests
        - usage
      properties:
        generated_at: { type: string, format: date-time }
        workspaces:
          type: object
          required: [total, by_status]
          properties:
            total: { type: integer }
            by_status:
              type: object
              description: Every licence status, `0` where there is none.
              required: [trialing, active, past_due, read_only, canceled, suspended]
              properties:
                trialing: { type: integer }
                active: { type: integer }
                past_due: { type: integer }
                read_only: { type: integer }
                canceled: { type: integer }
                suspended: { type: integer }
        trials_ending_7d: { type: integer }
        active_operator_sessions: { type: integer }
        pending_payment_requests: { type: integer }
        usage:
          type: object
          required: [day, ai_tokens_today, period, ai_resolutions_month, api_calls_month]
          properties:
            day: { type: string, pattern: "^[0-9]{8}$", description: "`yyyymmdd`, UTC." }
            ai_tokens_today:
              type: object
              required: [llm, embedding]
              properties:
                llm: { type: integer }
                embedding: { type: integer }
            period: { type: string, pattern: "^[0-9]{6}$", description: "`yyyymm`, UTC." }
            ai_resolutions_month: { type: integer }
            api_calls_month: { type: integer }

    PlatformDashboardSignups:
      type: object
      required: [days, total, data]
      properties:
        days: { type: integer }
        total: { type: integer }
        data:
          type: array
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string, format: date }
              count: { type: integer }

    PlatformDashboardDependency:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [up, down] }
        latency_ms: { type: number }
        error: { type: string }

    PlatformHealthSnapshot:
      type: object
      description: |
        The tenant API's admin `GET /health` body as its scheduler leader last
        published it (`buildHealthSnapshot`).
      required:
        - status
        - service
        - version
        - region
        - uptime_s
        - dependencies
        - scheduler
        - event_partitions
        - ai_jobs
        - providers
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, enum: [api] }
        version: { type: string }
        region: { type: string }
        uptime_s: { type: number }
        dependencies:
          type: object
          required: [database, redis]
          properties:
            database: { $ref: "#/components/schemas/PlatformDashboardDependency" }
            redis: { $ref: "#/components/schemas/PlatformDashboardDependency" }
        scheduler:
          type: object
          required: [enabled, jobs]
          properties:
            enabled: { type: boolean }
            jobs:
              type: array
              items:
                type: object
                required: [name, interval_ms, enabled, last_run_at, last_status]
                properties:
                  name: { type: string }
                  interval_ms: { type: integer }
                  enabled: { type: boolean }
                  last_run_at: { type: ["string", "null"], format: date-time }
                  last_status:
                    { type: ["string", "null"], enum: [ok, skipped, error, disabled, null] }
                  last_error_class: { type: string }
        event_partitions:
          type: object
          additionalProperties: true
        ai_jobs:
          type: ["object", "null"]
          required: [pending, running, oldest_age_s]
          properties:
            pending: { type: integer }
            running: { type: integer }
            oldest_age_s: { type: ["number", "null"] }
        providers:
          type: object
          additionalProperties: { type: string }

    PlatformComponentStatus:
      type: object
      required: [key, state, detail, updated_at]
      properties:
        key:
          type: string
          description: A key of `OPS_COMPONENTS` (@siyahtus/types).
          enum:
            - mail
            - redis
            - db
            - scheduler
            - ai_jobs
            - knowledge_jobs
            - doc_worker
            - captcha
            - geoip
            - channel_whatsapp
            - channel_meta
            - webhooks
        state:
          type: string
          description: |
            `not_installed` — the module is not part of this deployment, not a
            fault · `unknown` — nothing has reported it yet.
          enum: [ok, degraded, down, not_installed, unknown]
        detail: { type: ["string", "null"] }
        updated_at: { type: ["string", "null"], format: date-time }

    PlatformDashboardHealth:
      type: object
      required: [stale, generated_at, age_s, snapshot, components]
      properties:
        stale:
          type: boolean
          description: No snapshot, or one older than 90 seconds.
        generated_at: { type: ["string", "null"], format: date-time }
        age_s: { type: ["number", "null"] }
        snapshot:
          oneOf:
            - { $ref: "#/components/schemas/PlatformHealthSnapshot" }
            - { type: "null" }
        components:
          type: array
          items: { $ref: "#/components/schemas/PlatformComponentStatus" }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message, request_id]
          properties:
            type:
              type: string
              description: One of `ERROR_TYPES` (`@siyahtus/types`).
            message:
              type: string
              description: Human-readable; never contains secrets or raw SQL.
            request_id:
              type: string
              description: Correlates with server logs and traces.
            details:
              type: object
              additionalProperties: true

  responses:
    BadRequest:
      description: |
        Malformed body, or a value failing validation (`validation`);
        `platform_reason_required` — a mutation without a 3–500 character
        `reason` (tm 389.5).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        No session, an unknown token, or a session past its absolute lifetime or
        its idle timeout (`authentication`) — sign in again. Also a wrong,
        expired or replayed code.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        `platform_totp_required` — the session has shown a password but no code
        (`details.next`: `totp_enroll` | `totp_verify`); `authorization` — the
        operator's role lacks `details.permission`; `platform_recent_totp_required`
        — re-verify (`/auth/totp/reverify`) and retry; `not_allowed` — the
        address is outside `PLATFORM_IP_ALLOWLIST` (`details.reason`
        `ip_not_allowed`) or the session is already verified.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        `platform_last_superadmin`, `account_exists` or
        `two_factor_already_enabled` — the request was fine, the state refused it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: |
        The per-address platform bucket is spent (`RATE_LIMIT_PLATFORM_PER_MIN`,
        Redis `rl:platform:*`). `Retry-After` says when to try again.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
