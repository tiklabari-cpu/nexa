openapi: 3.1.0

info:
  title: SiyahTuş Platform (root panel) API
  version: 1.0.0
  description: |
    The back office of a SiyahTuş deployment (tm 389 · `docs/platform-admin/design.md`).
    Served by its own process, `platform-api` (`node dist/src/platform.js`, port
    4002), under `/platform/v1` — never by the tenant API, which answers 404 for
    every path here. Its callers are SiyahTuş operators (`platform_admins`), not
    workspace members, and it connects to Postgres as `siyahtus_platform`.

    **A separate document on purpose.** Nothing here is part of the tenant
    contract (`packages/contract/openapi/openapi.yaml`): no tenant client
    generates types from it, nothing in it is `x-public`, and the tenant
    document never names a `/platform` path.

    **Errors** use the same envelope as the tenant API —
    `{ error: { type, message, request_id } }` (ADR-06). Types this surface
    adds are `platform_`-prefixed in `@siyahtus/types`.

    **Conventions every later module follows:** keyset paging `?cursor&limit`,
    free-text `?q`, and every mutation takes a `{reason}` that lands in the
    platform audit chain.

servers:
  - url: http://localhost:4002/platform/v1
    description: Local development (`pnpm --filter @siyahtus/api platform:dev`)

tags:
  - name: System
    description: Health and metadata.
  - name: Auth
    description: |
      Operator sign-in (tm 389.4): password, then a mandatory TOTP code; one
      opaque session token, `password` stage until the code, `active` after.
  - name: Admins
    description: Operator management — invitations, roles, disabling, second-factor resets.
  - name: Dashboard
    description: |
      The operator's landing screen (tm 389.8): workspace counts, the sign-up
      timeline, the tenant API's published health snapshot and the component record.
  - name: Audit
    description: |
      The platform audit chain (tm 389.5): every operator mutation and sign-in
      event, HMAC-chained, signed on export; a workspace's own trail, read-only.
  - name: Workspaces
    description: |
      Every workspace and everything about it except its content (tm 389.9):
      organization, licence, members, brands, usage, subscription, invoices,
      sandbox, operator notes, impersonation history, AI counts.
  - name: AI catalogues
    description: |
      What the platform ships for the AI and how workspaces use it (tm 389.19):
      the G1-G19 rules, the crisis-text drafts, the iGaming template pack and
      its installs, the compliance scenario pack, the QA rubric, the tool
      catalogue. Keys, versions and counts - never a workspace's content.
  - name: Accounts
    description: |
      The people behind the memberships (tm 389.11): search, detail, a new
      verification link, a forced password reset, ending sessions and tokens,
      a second-factor reset, a suspension in every workspace, an export of
      their data, erasure.
  - name: Billing
    description: |
      Billing across every workspace (tm 389.12): plans, subscriptions, issued
      statements, packages, revenue by month, credits and a subscription by hand.
  - name: Usage
    description: |
      Usage across every workspace (tm 389.12) and the daily AI allowance: the
      deployment's counters, the heaviest workspaces, one workspace's caps and
      their override, each plan's default.
  - name: Settings
    description: |
      Deployment settings (tm 389.13): sign-up, the trial length, the
      announcement, maintenance mode, and the tenant API's effective configuration.
      The AI provider settings (tm 389.17): model, embedding model, API keys
      (write-only), daily caps, prices, a connection test and re-embedding.
  - name: Operations
    description: |
      The Operations page (tm 389.14): the scheduler's jobs and "run now", the
      webhook backlog, SIEM export status, the `events` partitions, expired
      unverified sign-ups, the job queues and the component record. Counts and
      states only.
  - name: Support
    description: |
      The support desk (tm 389.9): which workspace an identifier a customer
      quoted belongs to; and "enter as the customer" (tm 389.15) — a
      time-boxed session as one member, read-only unless a superadmin asks
      otherwise, mailed to the workspace's Founders.
  - name: Security
    description: |
      The Security page (tm 389.16): the sign-up blocklist, failed sign-ins,
      sign-ups by address, impersonation sessions and the abuse counters of the
      tenant API's guards. Addresses, identifiers and counts only.

# The operator session (tm 389.4) — an opaque bearer token, not a JWT. Every
# operation needs it unless it says `security: []`. What else it needs is in
# `x-platform-permission` (a `PLATFORM_PERMISSIONS` key, or `self`),
# `x-platform-stage` (when a `password`-stage session may call it) and
# `x-platform-recent-totp` (a code younger than five minutes). Every mutation
# names the audit entry it writes in `x-platform-audit` (tm 389.5); a POST that
# changes nothing says `x-platform-safe` instead.
security:
  - platformSession: []

