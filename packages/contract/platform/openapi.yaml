        invite: { $ref: "#/components/schemas/PlatformInvite" }
        mail: { type: string, enum: [sent, failed] }
        accept_url:
          type: string
          description: Only when `mail` is `failed` — hand the link over another way.

    PlatformAuditAction:
      type: string
      description: |
        The closed list of what the platform audit chain records
        (`PLATFORM_AUDIT_ACTIONS`, `services/platform/platform-audit.ts`).
        `<module>.<verb>`; the `admin.*` session events are the only ones
        recorded without a reason.
      enum:
        - admin.bootstrapped
        - admin.signed_in
        - admin.sign_in_failed
        - admin.invite_accepted
        - admin.totp_enrollment_started
        - admin.totp_enrolled
        - admin.totp_verified
        - admin.totp_failed
        - admin.totp_reverified
        - admin.recovery_codes_regenerated
        - admin.other_sessions_ended
        - admin.alert_prefs_changed
        - admin.signed_out
        - admin.invited
        - admin.invite_revoked
        - admin.role_changed
        - admin.disabled
        - admin.enabled
        - admin.two_factor_reset
        - admin.sessions_revoked
        - workspace.note_added
        - workspace.trial_extended
        - workspace.activated
        - workspace.plan_changed
        - workspace.suspended
        - workspace.unsuspended
        - workspace.read_only_set
        - workspace.active_set
        - workspace.cancelled
        - workspace.resumed
        - workspace.overrides_changed
        - workspace.ai_caps_changed
        - workspace.owner_verification_resent
        - workspace.sandbox_reset
        - workspace.ownership_transferred
        - workspace.deletion_scheduled
        - workspace.deletion_cancelled
        - workspace.purged
        - account.verification_resent
        - account.password_reset_forced
        - account.sessions_revoked
        - account.tokens_revoked
        - account.two_factor_reset
        - account.suspended
        - account.unsuspended
        - account.exported
        - account.erased
        - billing.plan_saved
        - billing.package_saved
        - billing.credit_granted
        - billing.manual_subscription_created
        - billing.payment_address_sent
        - billing.payment_confirmed
        - billing.payment_request_cancelled
        - billing.swift_marked_paid
        - billing.providers_updated
        - billing.bank_details_updated
        - billing.issuer_profile_updated
        - settings.updated
        - settings.maintenance_changed
        - ai_settings.updated
        - ai_settings.connection_tested
        - ai_settings.reembed_started
        - ai_settings.crisis_drafts_updated
        - impersonation.started
        - impersonation.ended
        - security.blocklist_added
        - security.blocklist_removed
        - security.unverified_signups_purged
        - operations.job_run_requested
        - operations.partition_ensured

    PlatformAuditTarget:
      type: string
      description: What an entry is about (`target_type`).
      enum:
        - admin
        - invite
        - session
        - workspace
        - account
        - plan
        - package
        - invoice
        - payment_request
        - credit
        - settings
        - blocklist
        - impersonation
        - job
        - partition
        - signup

    PlatformAuditEntry:
      type: object
      required:
        [
          chain_seq,
          admin_id,
          action,
          target_type,
          target_id,
          license_id,
          reason,
          payload,
          ip,
          created_at,
        ]
      properties:
        chain_seq:
          type: string
          description: The entry's gapless position in the chain (a decimal integer).
        admin_id:
          type: ["string", "null"]
          format: uuid
          description: The operator; null for a sign-in nobody could be matched to.
        action: { $ref: "#/components/schemas/PlatformAuditAction" }
        target_type: { $ref: "#/components/schemas/PlatformAuditTarget" }
        target_id: { type: ["string", "null"] }
        license_id:
          type: ["string", "null"]
          description: The workspace the action concerns — it has its own `platform.*` entry too.
        reason:
          type: ["string", "null"]
          description: Why, in the operator's words; null only on `admin.*` session events.
        payload:
          type: object
          additionalProperties: true
          description: Identifiers, counts, changed field names — never values of secrets.
        ip: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }

    PlatformAuditList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformAuditEntry" }
        next_cursor: { type: ["string", "null"] }

    PlatformAuditExportRecord:
      description: One line of `GET /audit/export` — the entry and its two hashes.
      allOf:
        - $ref: "#/components/schemas/PlatformAuditEntry"
        - type: object
          required: [prev_hash, hash]
          properties:
            prev_hash: { type: ["string", "null"] }
            hash: { type: string }

    PlatformAuditVerification:
      type: object
      required: [ok, checked, first_seq, last_seq, head_seq, findings, findings_total]
      properties:
        ok: { type: boolean }
        checked: { type: integer, description: Entries recomputed and linked. }
        first_seq: { type: ["string", "null"] }
        last_seq: { type: ["string", "null"] }
        head_seq:
          type: ["string", "null"]
          description: The last position the chain head handed out.
        findings:
          type: array
          items:
            type: object
            required: [kind, seq, detail]
            properties:
              kind:
                type: string
                enum:
                  [
                    sequence_gap,
                    start_mismatch,
                    broken_link,
                    hash_mismatch,
                    unchained_entry,
                    head_mismatch,
                  ]
              seq:
                type: ["string", "null"]
                description: The position the finding is about (the first missing one for a gap).
              detail: { type: string }
        findings_total: { type: integer }

    PlatformWorkspaceAuditList:
      type: object
      description: The tenant API's `GET /audit-log` page, for one workspace.
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, action, actor_id, actor_type, target, metadata, ip, created_at]
            properties:
              id: { type: string, format: uuid }
              action: { type: string }
              actor_id: { type: ["string", "null"] }
              actor_type:
                type: string
                enum: [agent, bot, customer, system, platform]
              on_behalf_of: { type: string }
              target: { type: ["string", "null"] }
              metadata: { type: object, additionalProperties: true }
              ip: { type: ["string", "null"] }
              created_at: { type: string, format: date-time }
        next_page_id: { type: string }

    PlatformHealth:
      type: object
      description: |
        The narrow body — never version, latencies or provider names, which
        would be infrastructure detail for an anonymous caller. The detailed
        view is the dashboard's (`GET /dashboard/health`, tm 389.8), behind an
        operator session.
      required: [status, service]
      properties:
        status:
          type: string
          description: |
            `ok` every dependency is reachable · `degraded` at least one is not
            (503) · `draining` the process is shutting down (503, M-OPS-b).
          enum: [ok, degraded, draining]
        service:
          type: string
          enum: [platform]
        uptime_s:
          type: number
          description: Present on the liveness answer only.

    PlatformMeta:
      type: object
      description: What the admin SPA's permanent "PLATFORM · <region>" strip shows.
      required: [version, region]
      properties:
        version:
          type: string
          examples: [0.1.0]
        region:
          type: string
          enum: [eu, us]

    PlatformDashboardKpis:
      type: object
      required:
        - generated_at
        - workspaces
        - trials_ending_7d
        - active_operator_sessions
        - pending_payment_requests
        - usage
      properties:
        generated_at: { type: string, format: date-time }
        workspaces:
          type: object
          required: [total, by_status]
          properties:
            total: { type: integer }
            by_status:
              type: object
              description: Every licence status, `0` where there is none.
              required: [trialing, active, past_due, read_only, canceled, suspended]
              properties:
                trialing: { type: integer }
                active: { type: integer }
                past_due: { type: integer }
                read_only: { type: integer }
                canceled: { type: integer }
                suspended: { type: integer }
        trials_ending_7d: { type: integer }
        active_operator_sessions: { type: integer }
        pending_payment_requests: { type: integer }
        usage:
          type: object
          required: [day, ai_tokens_today, period, ai_resolutions_month, api_calls_month]
          properties:
            day: { type: string, pattern: "^[0-9]{8}$", description: "`yyyymmdd`, UTC." }
            ai_tokens_today:
              type: object
              required: [llm, embedding]
              properties:
                llm: { type: integer }
                embedding: { type: integer }
            period: { type: string, pattern: "^[0-9]{6}$", description: "`yyyymm`, UTC." }
            ai_resolutions_month: { type: integer }
            api_calls_month: { type: integer }

    PlatformDashboardSignups:
      type: object
      required: [days, total, data]
      properties:
        days: { type: integer }
        total: { type: integer }
        data:
          type: array
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string, format: date }
              count: { type: integer }

    PlatformDashboardDependency:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [up, down] }
        latency_ms: { type: number }
        error: { type: string }

    PlatformHealthSnapshot:
      type: object
      description: |
        The tenant API's admin `GET /health` body as its scheduler leader last
        published it (`buildHealthSnapshot`).
      required:
        - status
        - service
        - version
        - region
        - uptime_s
        - dependencies
        - scheduler
        - event_partitions
        - ai_jobs
        - providers
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, enum: [api] }
        version: { type: string }
        region: { type: string }
        uptime_s: { type: number }
        dependencies:
          type: object
          required: [database, redis]
          properties:
            database: { $ref: "#/components/schemas/PlatformDashboardDependency" }
            redis: { $ref: "#/components/schemas/PlatformDashboardDependency" }
        scheduler:
          type: object
          required: [enabled, jobs]
          properties:
            enabled: { type: boolean }
            jobs:
              type: array
              items:
                type: object
                required: [name, interval_ms, enabled, last_run_at, last_status]
                properties:
                  name: { type: string }
                  interval_ms: { type: integer }
                  enabled: { type: boolean }
                  last_run_at: { type: ["string", "null"], format: date-time }
                  last_status:
                    { type: ["string", "null"], enum: [ok, skipped, error, disabled, null] }
                  last_error_class: { type: string }
        event_partitions:
          type: object
          additionalProperties: true
        ai_jobs:
          type: ["object", "null"]
          required: [pending, running, oldest_age_s]
          properties:
            pending: { type: integer }
            running: { type: integer }
            oldest_age_s: { type: ["number", "null"] }
        providers:
          type: object
          additionalProperties: { type: string }

    PlatformComponentStatus:
      type: object
      required: [key, state, detail, updated_at]
      properties:
        key:
          type: string
          description: A key of `OPS_COMPONENTS` (@siyahtus/types).
          enum:
            - mail
            - redis
            - db
            - scheduler
            - ai_jobs
            - knowledge_jobs
            - doc_worker
            - captcha
            - geoip
            - channel_whatsapp
            - channel_meta
            - webhooks
        state:
          type: string
          description: |
            `not_installed` — the module is not part of this deployment, not a
            fault · `unknown` — nothing has reported it yet.
          enum: [ok, degraded, down, not_installed, unknown]
        detail: { type: ["string", "null"] }
        updated_at: { type: ["string", "null"], format: date-time }

    PlatformDashboardHealth:
      type: object
      required: [stale, generated_at, age_s, snapshot, components]
      properties:
        stale:
          type: boolean
          description: No snapshot, or one older than 90 seconds.
        generated_at: { type: ["string", "null"], format: date-time }
        age_s: { type: ["number", "null"] }
        snapshot:
          oneOf:
            - { $ref: "#/components/schemas/PlatformHealthSnapshot" }
            - { type: "null" }
        components:
          type: array
          items: { $ref: "#/components/schemas/PlatformComponentStatus" }

    PlatformLicenseStatus:
      type: string
      description: A licence status (`SUBSCRIPTION_STATUSES`, @siyahtus/types).
      enum: [trialing, active, past_due, read_only, canceled, suspended]

    PlatformPlan:
      type: string
      description: A plan id (`PLAN_IDS`, `services/billing/subscription-service.ts`).
      enum: [growth, enterprise]

    PlatformMemberRole:
      type: string
      description: A member's role (`AGENT_ROLES`, @siyahtus/types).
      enum: [owner, viceowner, admin, team_lead, agent]

    PlatformWorkspaceOwner:
      type: object
      description: The Kurucu (the `owner` member).
      required: [account_id, name, email, email_verified_at]
      properties:
        account_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        email_verified_at: { type: ["string", "null"], format: date-time }

    PlatformWorkspaceSummary:
      type: object
      required:
        [
          license_id,
          organization_name,
          region,
          status,
          plan,
          trial_ends_at,
          created_at,
          owner_email,
          member_count,
        ]
      properties:
        license_id: { type: string }
        organization_name: { type: string }
        region: { type: string, enum: [eu, us] }
        status: { $ref: "#/components/schemas/PlatformLicenseStatus" }
        plan: { $ref: "#/components/schemas/PlatformPlan" }
        trial_ends_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }
        owner_email: { type: ["string", "null"] }
        member_count: { type: integer }

    PlatformWorkspaceList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformWorkspaceSummary" }
        next_cursor: { type: ["string", "null"] }

    PlatformWorkspaceDetail:
      type: object
      required: [workspace]
      properties:
        workspace: { $ref: "#/components/schemas/PlatformWorkspace" }

    PlatformWorkspace:
      type: object
      required: [license_id, organization, license, owner, counts, status_history]
      properties:
        license_id: { type: string }
        organization:
          type: object
          required: [id, name, region, timezone, sector, company_size, created_at]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            region: { type: string, enum: [eu, us] }
            timezone: { type: string }
            sector: { type: ["string", "null"] }
            company_size: { type: ["string", "null"] }
            created_at: { type: string, format: date-time }
        license:
          type: object
          required:
            [
              status,
              plan,
              billing_cycle,
              trial_ends_at,
              suspended_at,
              suspended_reason,
              purge_scheduled_at,
              onboarding_completed_at,
              terms_accepted_at,
              sandbox_of_license_id,
              created_at,
            ]
          properties:
            status: { $ref: "#/components/schemas/PlatformLicenseStatus" }
            plan: { $ref: "#/components/schemas/PlatformPlan" }
            billing_cycle: { type: string, enum: [monthly, annual] }
            trial_ends_at: { type: ["string", "null"], format: date-time }
            suspended_at: { type: ["string", "null"], format: date-time }
            suspended_reason: { type: ["string", "null"] }
            purge_scheduled_at: { type: ["string", "null"], format: date-time }
            onboarding_completed_at: { type: ["string", "null"], format: date-time }
            terms_accepted_at: { type: ["string", "null"], format: date-time }
            sandbox_of_license_id: { type: ["string", "null"] }
            created_at: { type: string, format: date-time }
        owner:
          oneOf:
            - { $ref: "#/components/schemas/PlatformWorkspaceOwner" }
            - { type: "null" }
        counts:
          type: object
          required: [members, brands, customers, chats, tickets, ai_agents]
          properties:
            members: { type: integer }
            brands: { type: integer }
            customers: { type: integer }
            chats: { type: integer }
            tickets: { type: integer }
            ai_agents: { type: integer }
        status_history:
          type: array
          items:
            type: object
            required: [action, at, admin_id, reason]
            properties:
              action:
                type: string
                description: "`created`, or the platform audit action (`workspace.suspended`, …)."
              at: { type: string, format: date-time }
              admin_id: { type: ["string", "null"], format: uuid }
              reason: { type: ["string", "null"] }

    PlatformWorkspaceMemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required:
              [
                account_id,
                name,
                email,
                role,
                suspended,
                two_factor_enabled,
                joined_at,
                last_seen_at,
              ]
            properties:
              account_id: { type: string, format: uuid }
              name: { type: string }
              email: { type: string }
              role: { $ref: "#/components/schemas/PlatformMemberRole" }
              suspended: { type: boolean }
              two_factor_enabled: { type: boolean }
              joined_at: { type: string, format: date-time }
              last_seen_at: { type: ["string", "null"], format: date-time }

    PlatformWorkspaceBrandList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, name, slug, is_default, created_at]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              is_default: { type: boolean }
              created_at: { type: string, format: date-time }

    PlatformUsageMeter:
      type: object
      required: [used, included, overage, overage_cents, overage_unit, overage_unit_price_cents]
      properties:
        used: { type: integer }
        included: { type: integer }
        overage: { type: integer }
        overage_cents: { type: integer }
        overage_unit: { type: integer }
        overage_unit_price_cents: { type: integer }

    PlatformUsageSummary:
      type: object
      description: The tenant API's `GET /billing/usage` meters (`usageSummary`).
      required: [period, ai_resolutions, api_calls]
      properties:
        period: { type: string, pattern: "^[0-9]{6}$" }
        ai_resolutions: { $ref: "#/components/schemas/PlatformUsageMeter" }
        api_calls: { $ref: "#/components/schemas/PlatformUsageMeter" }

    PlatformWorkspaceUsage:
