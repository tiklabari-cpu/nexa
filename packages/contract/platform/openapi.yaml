          items: { $ref: "#/components/schemas/PlatformAdmin" }

    PlatformInvite:
      type: object
      required: [id, email, role, invited_by, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/PlatformRole" }
        invited_by: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    PlatformInviteList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformInvite" }

    PlatformInviteCreated:
      type: object
      required: [invite, mail]
