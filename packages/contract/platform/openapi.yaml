        periods:
          type: array
          items:
            type: object
            required: [period, metric, quantity, included]
            properties:
              period: { type: string, pattern: "^[0-9]{6}$" }
              metric: { type: string }
              quantity: { type: integer }
              included: { type: integer }
        days: { type: integer }
        ai_daily:
          type: array
          items:
            type: object
            required: [date, llm, embedding]
            properties:
              date: { type: string, format: date }
              llm: { type: integer }
              embedding: { type: integer }

    PlatformWorkspaceSubscription:
      type: object
      description: The tenant API's `GET /billing/subscription` body (`buildSubscriptionView`).
      required:
        [
          plan,
          pricing,
          billing_cycle,
          status,
          access,
          trial,
          seats,
          min_seats,
          unit_price_cents,
          usage,
          estimated_total_cents,
          annual_savings_cents,
          provider,
