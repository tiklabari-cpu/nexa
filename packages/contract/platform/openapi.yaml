        seats: { type: integer }
        min_seats: { type: integer }
        unit_price_cents: { type: integer }
        usage: { $ref: "#/components/schemas/PlatformUsageSummary" }
        estimated_total_cents: { type: integer }
        annual_savings_cents: { type: integer }
        provider: { type: string }

    PlatformWorkspaceInvoiceList:
      type: object
      description: The tenant API's `GET /billing/invoices` body (`listInvoices`).
      required: [invoices]
      properties:
        invoices:
          type: array
          items:
            type: object
            required:
              [
                number,
                period,
                period_label,
                period_start,
                period_end,
                issued_at,
                origin,
                status,
                currency,
                line_items,
                subtotal_cents,
                total_cents,
              ]
            properties:
              number: { type: string }
              period: { type: string, pattern: "^[0-9]{6}$" }
              period_label: { type: string }
              period_start: { type: string, format: date-time }
              period_end: { type: string, format: date-time }
              issued_at: { type: string, format: date-time }
              origin: { type: string, enum: [issued, reconstructed, estimate] }
              status: { type: string, enum: [paid, open, trial] }
              currency: { type: string, enum: [usd] }
              line_items:
                type: array
                items:
                  type: object
                  required: [description, amount_cents]
                  additionalProperties: true
                  properties:
                    description: { type: string }
                    amount_cents: { type: integer }
              subtotal_cents: { type: integer }
              total_cents: { type: integer }

    PlatformWorkspaceSandbox:
      type: object
      required: [is_sandbox, sandbox_of_license_id, sandbox]
      properties:
        is_sandbox:
          type: boolean
          description: This licence is itself a sandbox (of `sandbox_of_license_id`).
        sandbox_of_license_id: { type: ["string", "null"] }
        sandbox:
          description: The workspace's own sandbox, if it has one.
          oneOf:
            - type: object
              required: [license_id, region, created_at, reset_at]
              properties:
                license_id: { type: string }
                region: { type: string, enum: [eu, us] }
                created_at: { type: string, format: date-time }
                reset_at: { type: ["string", "null"], format: date-time }
            - { type: "null" }

    PlatformWorkspaceActionResult:
      type: object
      description: |
        What a workspace action answers (tm 389.10): whether it changed
        anything and the workspace as it now reads. `mail` on the actions that
        send one (owner verification, ownership transfer, deletion) when they
        did; `overrides` on `PUT …/overrides`.
      required: [unchanged, workspace]
      properties:
        unchanged: { type: boolean }
        workspace: { $ref: "#/components/schemas/PlatformWorkspace" }
        mail: { type: string, enum: [sent, failed] }
        overrides: { $ref: "#/components/schemas/PlatformWorkspaceOverrides" }

    PlatformExtendTrialRequest:
      type: object
      required: [days, reason]
      properties:
        days: { type: integer, minimum: 1, maximum: 90 }
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformSetPlanRequest:
      type: object
      required: [plan, reason]
      properties:
        plan: { $ref: "#/components/schemas/PlatformPlan" }
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformEntitlementOverrides:
      type: object
      description: A key present replaces the plan's value; an absent key leaves it to the plan.
      additionalProperties: false
      properties:
        white_label: { type: boolean }
        sandbox: { type: boolean }
        sla: { type: boolean }
        sso: { type: boolean }
        hipaa: { type: boolean }
        siem_export: { type: boolean }

    PlatformWorkspaceOverrides:
      type: object
      required:
        [entitlements, seat_ceiling, mail_daily_cap, expires_at, in_force, updated_by, updated_at]
      properties:
        entitlements: { $ref: "#/components/schemas/PlatformEntitlementOverrides" }
        seat_ceiling: { type: ["integer", "null"] }
        mail_daily_cap: { type: ["integer", "null"] }
        expires_at: { type: ["string", "null"], format: date-time }
        in_force: { type: boolean }
        updated_by: { type: ["string", "null"], format: uuid }
        updated_at: { type: ["string", "null"], format: date-time }

    PlatformWorkspaceOverridesEnvelope:
      type: object
      required: [overrides]
      properties:
        overrides: { $ref: "#/components/schemas/PlatformWorkspaceOverrides" }

    PlatformWorkspaceOverridesRequest:
      type: object
      required: [reason]
      properties:
        entitlements: { $ref: "#/components/schemas/PlatformEntitlementOverrides" }
        seat_ceiling: { type: ["integer", "null"], minimum: 1, maximum: 100000 }
        mail_daily_cap: { type: ["integer", "null"], minimum: 1, maximum: 1000000 }
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: In the future; null for an override that does not lapse.
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformForceOwnershipTransferRequest:
      type: object
      required: [to_account_id, verification_checklist, reason]
      properties:
        to_account_id: { type: string, format: uuid }
        verification_checklist:
          type: object
          description: How the requester's identity was checked — every step, or no transfer.
          required: [ticket_id, signed_request, phone_verified]
          properties:
            ticket_id:
              type: string
              minLength: 1
              maxLength: 100
              description: The support ticket the request arrived on.
            signed_request:
              type: boolean
              enum: [true]
              description: A signed request from the organisation is on file.
            phone_verified:
              type: boolean
              enum: [true]
              description: The requester was called back on a number the workspace already had.
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformWorkspaceDeleteRequest:
      type: object
      required: [confirm_name, reason]
      properties:
        confirm_name:
          type: string
          maxLength: 255
          description: The workspace's name, typed — it must match.
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformWorkspacePurgeQueue:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [license_id, organization_name, status, suspended_at, purge_scheduled_at]
            properties:
              license_id: { type: string }
              organization_name: { type: string }
              status: { $ref: "#/components/schemas/PlatformLicenseStatus" }
              suspended_at: { type: ["string", "null"], format: date-time }
              purge_scheduled_at: { type: string, format: date-time }

    PlatformWorkspaceNoteRequest:
      type: object
      required: [body, reason]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformWorkspaceNote:
      type: object
      required: [id, license_id, admin_id, admin_email, body, created_at]
      properties:
        id: { type: string, format: uuid }
        license_id: { type: string }
        admin_id: { type: string, format: uuid }
        admin_email: { type: ["string", "null"] }
        body: { type: string }
        created_at: { type: string, format: date-time }

    PlatformWorkspaceNoteList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformWorkspaceNote" }
        next_cursor: { type: ["string", "null"] }

    PlatformWorkspaceImpersonationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required:
              [
                id,
                admin_id,
                admin_email,
                account_id,
                mode,
                started_at,
                ends_at,
                ended_at,
                end_reason,
              ]
            properties:
              id: { type: string, format: uuid }
              admin_id: { type: string, format: uuid }
              admin_email: { type: ["string", "null"] }
              account_id: { type: string, format: uuid }
              mode: { type: string, enum: [read_only, full] }
              started_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              ended_at: { type: ["string", "null"], format: date-time }
              end_reason: { type: ["string", "null"] }

    PlatformImpersonationStartRequest:
      type: object
      required: [license_id, account_id, reason]
      properties:
        license_id: { type: string, pattern: "^[1-9][0-9]{0,18}$" }
        account_id:
          type: string
          format: uuid
          description: The member to enter as — a live member of the workspace.
        mode:
          type: string
          enum: [read_only, full]
          default: read_only
        reason:
          type: string
          description: Why — recorded in the platform audit chain (tm 389.5).
          minLength: 3
          maxLength: 500

    PlatformImpersonation:
      type: object
      required:
        [
          id,
          license_id,
          organization_name,
          account_id,
          account_email,
          admin_id,
          admin_email,
          mode,
          started_at,
          ends_at,
          ended_at,
          end_reason,
          active,
        ]
      properties:
        id: { type: string, format: uuid }
        license_id: { type: string }
        organization_name: { type: ["string", "null"] }
        account_id: { type: string, format: uuid }
        account_email: { type: ["string", "null"] }
        admin_id: { type: string, format: uuid }
        admin_email: { type: ["string", "null"] }
        mode: { type: string, enum: [read_only, full] }
        started_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        ended_at: { type: ["string", "null"], format: date-time }
        end_reason:
          type: ["string", "null"]
          enum: [ended_by_operator, ended_in_workspace, null]
          description: Empty while open, and for a session whose window simply ran out.
        active:
          type: boolean
          description: Not ended and its window not run out.

    PlatformImpersonationStarted:
      type: object
      required: [impersonation, handoff_url, handoff_expires_at, mail]
      properties:
        impersonation: { $ref: "#/components/schemas/PlatformImpersonation" }
        handoff_url:
          type: string
          description: |
            `<WEB_APP_URL>/auth/impersonate#code=…` — open it in a new tab. Good
            once, until `handoff_expires_at`; shown here and nowhere else.
        handoff_expires_at: { type: string, format: date-time }
        mail:
          type: string
          enum: [sent, failed, none]
          description: The Founders' notice — `none` when the workspace has no Founder to tell.

    PlatformImpersonationEnded:
      type: object
      required: [unchanged, impersonation]
      properties:
        unchanged: { type: boolean }
        impersonation: { $ref: "#/components/schemas/PlatformImpersonation" }

    PlatformImpersonationList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformImpersonation" }
        next_cursor: { type: ["string", "null"] }

    PlatformWorkspaceAiSummary:
      type: object
      description: |
        The workspace's AI at a glance - counts and states, never a rule's
        text, a conversation or a scenario. A section whose table has not
        shipped is `status: not_installed`, not a zero.
      required: [ai_agents, guidance_rules, config_changes, guardrail_hits, qa, compliance_pack]
      properties:
        ai_agents:
          type: object
          required: [total, active]
          properties:
            total: { type: integer }
            active: { type: integer }
        guidance_rules:
          type: object
          required: [status, total, active]
          properties:
            status: { $ref: "#/components/schemas/PlatformAiCatalogStatus" }
            total: { type: integer }
            active: { type: integer }
        config_changes:
          type: object
          description: Changes to the AI configuration in the last 30 days (tm 315).
          required: [status, last_30_days]
          properties:
            status: { $ref: "#/components/schemas/PlatformAiCatalogStatus" }
            last_30_days: { type: integer }
        guardrail_hits:
          type: object
          description: |
            Guardrail triggers in the last 30 days, by rule: `G1`-`G19` for the
            platform's, `workspace_rule` and `forbidden_phrase` for the
            workspace's own.
          required: [status, last_30_days, by_rule]
          properties:
            status: { $ref: "#/components/schemas/PlatformAiCatalogStatus" }
            last_30_days: { type: integer }
            by_rule:
              type: object
              additionalProperties: { type: integer }
        qa:
          type: object
          description: The QA queue's counts (tm 319).
          required: [status, reviewed_30_days, awaiting_review]
          properties:
            status: { $ref: "#/components/schemas/PlatformAiCatalogStatus" }
            reviewed_30_days: { type: integer }
            awaiting_review: { type: integer }
        compliance_pack:
          type: object
          description: The workspace's latest run that played the compliance pack.
          required: [status, last_run]
          properties:
            status: { $ref: "#/components/schemas/PlatformAiCatalogStatus" }
            last_run:
              oneOf:
                - type: "null"
                - type: object
                  required: [version, run_status, passed, failed, finished_at]
                  properties:
                    version: { type: string }
                    run_status: { type: string }
                    passed: { type: ["integer", "null"] }
                    failed: { type: ["integer", "null"] }
                    finished_at: { type: ["string", "null"], format: date-time }

    PlatformAiCatalogStatus:
      type: string
      description: |
        `not_installed` - the table or catalogue behind it has not shipped yet
        (`AI_CATALOG_STATUSES`, @siyahtus/types).
      enum: [available, not_installed]

    PlatformGuardrailLang:
      type: object
      required: [tr, en]
      properties:
        tr: { type: string }
        en: { type: string }

    PlatformGuardrailPatternCounts:
      type: object
      description: Lexicon patterns per language (0 where the rule has none on that side).
      required: [tr, en]
      properties:
        tr: { type: integer }
        en: { type: integer }

    PlatformGuardrailCatalogItem:
      type: object
      required:
        - id
        - title
        - prompt
        - category
        - action
        - target
        - priority
        - handoff_reason
        - risk_flag
        - applies_when
        - tenant_text
        - lexicon_alone
        - stages
        - input_patterns
        - output_patterns
      properties:
        id: { type: string, pattern: "^G[0-9]{1,2}$" }
        title: { $ref: "#/components/schemas/PlatformGuardrailLang" }
        prompt: { $ref: "#/components/schemas/PlatformGuardrailLang" }
        category: { type: string }
        action: { type: string }
        target: { type: ["string", "null"] }
        priority: { type: string }
        handoff_reason: { type: ["string", "null"] }
        risk_flag: { type: ["string", "null"] }
        applies_when: { type: string, enum: [always, risk_flagged] }
        tenant_text: { type: ["string", "null"] }
        lexicon_alone: { type: boolean }
        stages:
          type: array
          items: { type: string, enum: [input, output] }
        input_patterns: { $ref: "#/components/schemas/PlatformGuardrailPatternCounts" }
        output_patterns: { $ref: "#/components/schemas/PlatformGuardrailPatternCounts" }

    PlatformGuardrailCatalog:
      type: object
      required: [version, count, items]
      properties:
        version: { type: string, description: PLATFORM_GUARDRAILS_VERSION }
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlatformGuardrailCatalogItem" }

    PlatformCrisisTextMap:
      type: object
      description: |
        Country (upper-case ISO 3166-1 alpha-2) to its texts, per language;
        a language may be missing.
      additionalProperties:
        type: object
        properties:
          en: { type: string, minLength: 1, maxLength: 1000 }
          tr: { type: string, minLength: 1, maxLength: 1000 }
        additionalProperties: false

    PlatformCrisisTextDrafts:
      type: object
      required: [drafts, version, updated_at, max_length]
      properties:
        drafts: { $ref: "#/components/schemas/PlatformCrisisTextMap" }
        version: { type: integer, minimum: 0 }
        updated_at: { type: ["string", "null"], format: date-time }
        max_length: { type: integer }

    PlatformCrisisTextDraftsRequest:
      type: object
      required: [reason, drafts]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        drafts: { $ref: "#/components/schemas/PlatformCrisisTextMap" }

    PlatformTemplateCatalogItem:
      type: object
      required: [key, name, version, locked, scenario_count, tenant_must_fill_count]
      properties:
        key: { type: string }
        name: { type: string }
        version: { type: integer }
        locked: { type: boolean }
        scenario_count: { type: integer }
        tenant_must_fill_count: { type: integer }

    PlatformTemplateCatalog:
      type: object
      required: [pack, items]
      properties:
        pack:
          type: object
          required: [key, version, industry, lang, template_count]
          properties:
            key: { type: string }
            version: { type: string, description: The templates package version. }
            industry: { type: string }
            lang: { type: string }
            template_count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlatformTemplateCatalogItem" }

    PlatformTemplateInstall:
      type: object
      required: [license_id, workspace_name, installed, active, outdated]
      properties:
        license_id: { type: string }
        workspace_name: { type: string }
        installed: { type: integer }
        active: { type: integer }
        outdated: { type: integer }

    PlatformTemplateInstallList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformTemplateInstall" }
        next_cursor: { type: ["string", "null"] }

    PlatformCompliancePack:
      type: object
      required: [version, size, items]
      properties:
        version: { type: string, description: AI_COMPLIANCE_PACK_VERSION }
        size: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [key, guardrail, language]
            properties:
              key: { type: string }
              guardrail: { type: string }
              language: { type: string }

    PlatformQaRubric:
      type: object
      required: [status, version, scale, items]
      properties:
        status: { $ref: "#/components/schemas/PlatformAiCatalogStatus" }
        version: { type: ["string", "null"] }
        scale:
          type: object
          required: [min, max]
          properties:
            min: { type: integer }
            max: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [key, handoff_only]
            properties:
              key: { type: string }
              handoff_only: { type: boolean }

    PlatformToolCatalog:
      type: object
      required: [status, version, items]
      properties:
        status: { $ref: "#/components/schemas/PlatformAiCatalogStatus" }
        version: { type: ["string", "null"] }
        items:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key: { type: string }

    PlatformAccountSummary:
      type: object
      required:
        [id, email, name, created_at, email_verified_at, platform_suspended_at, membership_count]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        email_verified_at: { type: ["string", "null"], format: date-time }
        platform_suspended_at: { type: ["string", "null"], format: date-time }
        membership_count: { type: integer }

    PlatformAccountList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformAccountSummary" }
        next_cursor: { type: ["string", "null"] }

    PlatformAccountMembership:
      type: object
      required:
        [
          license_id,
          organization_name,
          role,
          suspended,
          awaiting_approval,
          license_status,
          sandbox,
          two_factor_required,
          joined_at,
        ]
      properties:
        license_id: { type: string }
        organization_name: { type: string }
        role: { $ref: "#/components/schemas/PlatformMemberRole" }
        suspended: { type: boolean, description: The membership, suspended by the workspace. }
        awaiting_approval: { type: boolean }
        license_status: { $ref: "#/components/schemas/PlatformLicenseStatus" }
        sandbox: { type: boolean }
        two_factor_required: { type: boolean, description: The workspace requires a second factor. }
        joined_at: { type: string, format: date-time }

    PlatformAccount:
      type: object
      required:
        [
          id,
          email,
          name,
          created_at,
          email_verified_at,
          last_seen_at,
          last_sign_in_at,
          password_set,
          platform_suspended_at,
          platform_suspended_reason,
          two_factor,
          credentials,
          memberships,
        ]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        email_verified_at: { type: ["string", "null"], format: date-time }
        last_seen_at: { type: ["string", "null"], format: date-time }
        last_sign_in_at:
          type: ["string", "null"]
          format: date-time
          description: When a session was last opened for the account.
        password_set:
          { type: boolean, description: False for an account that only signs in by SSO. }
        platform_suspended_at: { type: ["string", "null"], format: date-time }
        platform_suspended_reason:
          type: ["string", "null"]
          description: The operator's words — for the panel, shown to nobody else.
        two_factor:
          type: object
          required: [enabled, enabled_at, recovery_codes_left]
          properties:
            enabled: { type: boolean }
            enabled_at: { type: ["string", "null"], format: date-time }
            recovery_codes_left: { type: integer }
        credentials:
          type: object
          description: Live credentials, counted — never the tokens.
          required: [sessions, personal_tokens]
          properties:
            sessions: { type: integer }
            personal_tokens: { type: integer }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/PlatformAccountMembership" }

    PlatformAccountDetail:
      type: object
      required: [account]
      properties:
        account: { $ref: "#/components/schemas/PlatformAccount" }

    PlatformAccountActionResult:
      type: object
      description: |
        What an account action answers (tm 389.11): whether it changed anything
        and the account as it now reads. `mail` on the actions that send one.
      required: [unchanged, account]
      properties:
        unchanged: { type: boolean }
        account: { $ref: "#/components/schemas/PlatformAccount" }
        mail: { type: string, enum: [sent, failed] }

    PlatformAccountEraseRequest:
      type: object
      required: [confirm_email, reason]
      properties:
        confirm_email:
          type: string
          maxLength: 320
          description: The account's address, typed — it must match.
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformAccountErased:
      type: object
      required: [erased, account_id, license_ids]
      properties:
        erased: { type: boolean, enum: [true] }
        account_id: { type: string, format: uuid }
        license_ids:
          type: array
          description: The workspaces the person was a member of — each trail records it.
          items: { type: string }

    PlatformAccountExport:
      type: object
      description: |
        The account's data (`format: siyahtus.account-export.v1`). No workspace
        content — a workspace exports its own.
      required: [format, generated_at, account, memberships, personal_tokens, audit_summary]
      properties:
        format: { type: string, enum: [siyahtus.account-export.v1] }
        generated_at: { type: string, format: date-time }
        account:
          type: object
          required:
            [
              id,
              email,
              name,
              avatar_url,
              created_at,
              email_verified_at,
              last_seen_at,
              password_set,
              suspended,
              two_factor,
            ]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            name: { type: string }
            avatar_url: { type: ["string", "null"] }
            created_at: { type: string, format: date-time }
            email_verified_at: { type: ["string", "null"], format: date-time }
            last_seen_at: { type: ["string", "null"], format: date-time }
            password_set: { type: boolean }
            suspended: { type: boolean }
            two_factor:
              type: object
              required: [enabled, enabled_at]
              properties:
                enabled: { type: boolean }
                enabled_at: { type: ["string", "null"], format: date-time }
        memberships:
          type: array
          items:
            type: object
            required:
              [license_id, organization_name, role, suspended, awaiting_approval, joined_at, locale]
            properties:
              license_id: { type: string }
              organization_name: { type: string }
              role: { type: string }
              suspended: { type: boolean }
              awaiting_approval: { type: boolean }
              joined_at: { type: string, format: date-time }
              locale: { type: ["string", "null"] }
        personal_tokens:
          type: array
          items:
            type: object
            required: [name, license_id, created_at, last_used_at, expires_at, revoked_at]
            properties:
              name: { type: ["string", "null"] }
              license_id: { type: string }
              created_at: { type: string, format: date-time }
              last_used_at: { type: ["string", "null"], format: date-time }
              expires_at: { type: ["string", "null"], format: date-time }
              revoked_at: { type: ["string", "null"], format: date-time }
        audit_summary:
          type: array
          description: How many entries the person's own actions left in each workspace's trail.
          items:
            type: object
            required: [license_id, entries, first_at, last_at]
            properties:
              license_id: { type: string }
              entries: { type: integer }
              first_at: { type: ["string", "null"], format: date-time }
              last_at: { type: ["string", "null"], format: date-time }

    PlatformSupportLookup:
      type: object
      required: [data]
      properties:
        data:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [kind, license_id, organization_name]
            properties:
              kind:
                type: string
                description: |
                  What `q` matched: `thread_id` (a Thread ID, `chats.id`),
                  `chat_id` (a Chat ID, `threads.id`), `ticket`, or
                  `customer_email`.
                enum: [thread_id, chat_id, ticket, customer_email]
              license_id: { type: string }
              organization_name: { type: string }

    PlatformAiDailyTokens:
      type: object
      description: A daily AI token figure per live meter; `null` inherits the next layer.
      required: [llm, embedding]
      properties:
        llm: { type: ["integer", "null"], minimum: 1 }
        embedding: { type: ["integer", "null"], minimum: 1 }

    PlatformBillingPlan:
      type: object
      required:
        [
          id,
          pricing,
          unit_price_cents,
          ai_resolutions_included,
          entitlements,
          ai_daily_tokens,
          workspaces,
        ]
      properties:
        id: { $ref: "#/components/schemas/PlatformPlan" }
        pricing: { type: string, enum: [listed, quoted] }
        unit_price_cents: { type: ["integer", "null"] }
        ai_resolutions_included: { type: ["integer", "null"] }
        entitlements: { type: array, items: { type: string } }
        ai_daily_tokens: { $ref: "#/components/schemas/PlatformAiDailyTokens" }
        workspaces:
          type: integer
          description: Workspaces (sandboxes excluded) whose latest subscription is on this plan.

    PlatformBillingPlanList:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PlatformBillingPlan" } }

    PlatformSubscriptionRow:
      type: object
      required:
        - license_id
        - organization_name
        - license_status
        - plan
        - status
        - billing_cycle
        - seats
        - unit_price_cents
        - current_period_end
        - cancel_at_period_end
        - created_at
      properties:
        license_id: { type: string }
        organization_name: { type: string }
        license_status: { $ref: "#/components/schemas/PlatformLicenseStatus" }
        plan: { type: string }
        status: { type: string }
        billing_cycle: { type: string, enum: [monthly, annual] }
        seats: { type: integer }
        unit_price_cents: { type: integer }
        current_period_end: { type: ["string", "null"], format: date-time }
        cancel_at_period_end: { type: boolean }
        created_at: { type: string, format: date-time }

    PlatformSubscriptionList:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PlatformSubscriptionRow" } }
        next_cursor: { type: ["string", "null"] }

    PlatformInvoiceRow:
      type: object
      required:
        - id
        - license_id
        - organization_name
        - number
        - period
        - origin
        - status
        - currency
        - subtotal_cents
        - credit_cents
        - total_cents
        - issued_at
      properties:
        id: { type: string, format: uuid }
        license_id: { type: string }
        organization_name: { type: string }
        number: { type: string }
        period: { type: string, pattern: "^[0-9]{6}$" }
        origin: { type: string, enum: [issued, reconstructed] }
        status: { type: string, enum: [paid, trial] }
        currency: { type: string }
        subtotal_cents: { type: integer }
        credit_cents:
          type: integer
          description: What the platform's credits took off the statement (a positive figure).
        total_cents: { type: integer }
        issued_at: { type: string, format: date-time }

    PlatformInvoiceList:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PlatformInvoiceRow" } }
        next_cursor: { type: ["string", "null"] }

    PlatformPackageSales:
      type: object
      required: [count, revenue_cents]
      properties:
        count: { type: integer }
        revenue_cents: { type: integer }

    PlatformBillingPackages:
      type: object
      required: [period, api_packages, ai_resolution_pack]
      properties:
        period: { type: string, pattern: "^[0-9]{6}$" }
        api_packages:
          type: array
          items:
            type: object
            required: [id, name, api_calls, price_cents, sold]
            properties:
              id: { type: string }
              name: { type: string }
              api_calls: { type: integer }
              price_cents: { type: integer }
              sold: { $ref: "#/components/schemas/PlatformPackageSales" }
        ai_resolution_pack:
          type: object
          required: [resolutions_per_pack, pack_price_cents, max_packs, sold]
          properties:
            resolutions_per_pack: { type: integer }
            pack_price_cents: { type: integer }
            max_packs: { type: integer }
            sold:
              allOf: [{ $ref: "#/components/schemas/PlatformPackageSales" }]
              description: "`count` is packs, not purchases."

    PlatformRevenueMonth:
      type: object
      required: [period, currency, invoices, subtotal_cents, credit_cents, total_cents]
      properties:
        period: { type: string, pattern: "^[0-9]{6}$" }
        currency: { type: string }
        invoices: { type: integer }
        subtotal_cents: { type: integer }
        credit_cents: { type: integer }
        total_cents: { type: integer }

    PlatformRevenue:
      type: object
      required: [months, open_period, open_credits]
      properties:
        months: { type: array, items: { $ref: "#/components/schemas/PlatformRevenueMonth" } }
        open_period:
          type: object
          description: The period still running — not a statement; only what was already bought in it.
          required: [period, package_purchases_cents]
          properties:
            period: { type: string, pattern: "^[0-9]{6}$" }
            package_purchases_cents: { type: integer }
        open_credits:
          type: array
          items:
            type: object
            required: [currency, amount_minor, credits]
            properties:
              currency: { type: string }
              amount_minor: { type: integer }
              credits: { type: integer }

    PlatformCredit:
      type: object
      required:
        - id
        - license_id
        - organization_name
        - amount_minor
        - currency
        - reason
        - admin_email
        - invoice_id
        - invoice_number
        - invoice_period
        - remainder_of
        - created_at
      properties:
        id: { type: string, format: uuid }
        license_id: { type: string }
        organization_name: { type: string }
        amount_minor: { type: integer }
        currency: { type: string }
        reason: { type: string }
        admin_email: { type: ["string", "null"] }
        invoice_id: { type: ["string", "null"], format: uuid }
        invoice_number: { type: ["string", "null"] }
        invoice_period: { type: ["string", "null"] }
        remainder_of: { type: ["string", "null"], format: uuid }
        created_at: { type: string, format: date-time }

    PlatformCreditList:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PlatformCredit" } }
        next_cursor: { type: ["string", "null"] }

    PlatformCreditEnvelope:
      type: object
      required: [credit]
      properties:
        credit: { $ref: "#/components/schemas/PlatformCredit" }

    PlatformCreditRequest:
      type: object
      required: [license_id, amount_minor, currency, reason]
      properties:
        license_id: { type: string, pattern: "^[1-9][0-9]{0,18}$" }
        amount_minor: { type: integer, minimum: 1, maximum: 100000000 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformManualSubscriptionRequest:
      type: object
      required: [license_id, plan, period_end, reason]
      properties:
        license_id: { type: string, pattern: "^[1-9][0-9]{0,18}$" }
        plan: { $ref: "#/components/schemas/PlatformPlan" }
        period_end: { type: string, format: date-time }
        seats: { type: integer, minimum: 1, maximum: 100000 }
        billing_cycle: { type: string, enum: [monthly, annual] }
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformUsageTopMeter:
      type: string
      enum: [llm, embedding, ai_resolutions, api_calls]

    PlatformAiCounter:
      type: object
      required: [used, reserved, cap]
      properties:
        used: { type: integer }
        reserved: { type: integer }
        cap: { type: integer }

    PlatformGlobalUsage:
      type: object
      required: [days, series, today, period]
      properties:
        days: { type: integer }
        series:
          type: array
          items:
            type: object
            required: [date, llm, embedding]
            properties:
              date: { type: string, format: date }
              llm: { type: integer }
              embedding: { type: integer }
        today:
          type: object
          description: The deployment's own counter today, against its cap.
          required: [llm, embedding]
          properties:
            llm: { $ref: "#/components/schemas/PlatformAiCounter" }
            embedding: { $ref: "#/components/schemas/PlatformAiCounter" }
        period:
          type: object
          required: [period, ai_resolutions, api_calls]
          properties:
            period: { type: string, pattern: "^[0-9]{6}$" }
            ai_resolutions: { type: integer }
            api_calls: { type: integer }

    PlatformTopUsage:
      type: object
      required: [meter, window, data]
      properties:
        meter: { $ref: "#/components/schemas/PlatformUsageTopMeter" }
        window:
          type: string
          description: "`YYYY-MM-DD` (today, UTC) for the token meters, `yyyymm` for the others."
        data:
          type: array
          items:
            type: object
            required: [license_id, organization_name, plan, used, limit, percent]
            properties:
              license_id: { type: string }
              organization_name: { type: string }
              plan: { type: string }
              used: { type: integer }
              limit:
                type: ["integer", "null"]
                description: The workspace's cap (token meters) or what its plan includes (the others).
              percent: { type: ["integer", "null"] }

    PlatformAiCapLayers:
      type: object
      required: [effective, source, override, plan, deployment]
      properties:
        effective: { type: integer }
        source: { type: string, enum: [override, plan, deployment] }
        override: { type: ["integer", "null"] }
        plan: { type: ["integer", "null"] }
        deployment: { type: integer }

    PlatformWorkspaceAiCaps:
      type: object
      required: [llm, embedding, expires_at, in_force]
      properties:
        llm: { $ref: "#/components/schemas/PlatformAiCapLayers" }
        embedding: { $ref: "#/components/schemas/PlatformAiCapLayers" }
        expires_at: { type: ["string", "null"], format: date-time }
        in_force:
          type: boolean
          description: False once `expires_at` has passed — the override then reads as unset.

    PlatformWorkspaceUsageDetail:
      type: object
      required: [license_id, organization_name, plan, caps, today, series]
      properties:
        license_id: { type: string }
        organization_name: { type: string }
        plan: { type: string }
        caps: { $ref: "#/components/schemas/PlatformWorkspaceAiCaps" }
        today:
          type: object
          required: [llm, embedding, llm_test, embedding_test]
          properties:
            llm: { $ref: "#/components/schemas/PlatformAiCounter" }
            embedding: { $ref: "#/components/schemas/PlatformAiCounter" }
            llm_test: { $ref: "#/components/schemas/PlatformAiCounter" }
            embedding_test: { $ref: "#/components/schemas/PlatformAiCounter" }
        series:
          type: array
          items:
            type: object
            required: [date, llm, embedding]
            properties:
              date: { type: string, format: date }
              llm: { type: integer }
              embedding: { type: integer }

    PlatformWorkspaceAiCapsRequest:
      type: object
      required: [llm_daily_tokens_cap, embedding_daily_tokens_cap, reason]
      properties:
        llm_daily_tokens_cap: { type: ["integer", "null"], minimum: 1, maximum: 10000000000 }
        embedding_daily_tokens_cap: { type: ["integer", "null"], minimum: 1, maximum: 10000000000 }
        expires_at: { type: ["string", "null"], format: date-time }
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformWorkspaceAiCapsResult:
      type: object
      required: [unchanged, usage]
      properties:
        unchanged: { type: boolean }
        usage: { $ref: "#/components/schemas/PlatformWorkspaceUsageDetail" }

    PlatformPlanAiCaps:
      type: object
      required: [plans, deployment, updated_at]
      properties:
        plans:
          type: array
          items:
            type: object
            required: [plan, set, catalogue]
            properties:
              plan: { $ref: "#/components/schemas/PlatformPlan" }
              set: { $ref: "#/components/schemas/PlatformAiDailyTokens" }
              catalogue: { $ref: "#/components/schemas/PlatformAiDailyTokens" }
        deployment:
          type: object
          required: [llm, embedding]
          properties:
            llm: { type: integer }
            embedding: { type: integer }
        updated_at: { type: ["string", "null"], format: date-time }

    PlatformPlanAiCapsRequest:
      type: object
      required: [plans, reason]
      properties:
        plans:
          type: object
          additionalProperties: false
          properties:
            growth: { $ref: "#/components/schemas/PlatformAiDailyTokens" }
            enterprise: { $ref: "#/components/schemas/PlatformAiDailyTokens" }
        reason: { type: string, minLength: 3, maxLength: 500 }

    PlatformPlanAiCapsResult:
      type: object
      required: [unchanged, caps]
      properties:
        unchanged: { type: boolean }
        caps: { $ref: "#/components/schemas/PlatformPlanAiCaps" }

    PlatformOperationsJob:
      type: object
      required:
        - name
        - interval_ms
        - enabled
        - last_run_at
        - last_status
        - last_duration_ms
        - next_run_at
        - running
        - last_manual
      properties:
        name: { type: string }
        interval_ms: { type: integer }
        enabled:
          type: boolean
          description: '`false`: registered but switched off — it never runs, and "run now" is refused.'
        last_run_at:
          type: ["string", "null"]
          format: date-time
          description: When the job last ticked on the publishing process, whatever came of it.
        last_status:
          type: ["string", "null"]
          enum: [ok, skipped, error, disabled, null]
        last_error_class:
          type: string
          description: The error's class, never its message.
        last_duration_ms: { type: ["integer", "null"] }
        next_run_at: { type: ["string", "null"], format: date-time }
        running:
          type: boolean
          description: A pass is executing right now, on some instance.
        last_manual:
          oneOf:
            - $ref: "#/components/schemas/PlatformOperationsManualRun"
            - { type: "null" }

    PlatformOperationsManualRun:
      type: object
      required: [at, result, status, duration_ms, error_class]
      properties:
        at: { type: string, format: date-time }
        result:
          type: string
          enum: [finished, already_running, disabled, unknown_job]
        status:
          type: ["string", "null"]
          enum: [ok, error, null]
        duration_ms: { type: ["integer", "null"] }
        error_class: { type: ["string", "null"] }

    PlatformOperationsScheduler:
      type: object
      required: [stale, generated_at, enabled, jobs]
      properties:
        stale: { type: boolean }
        generated_at: { type: ["string", "null"], format: date-time }
        enabled:
          type: ["boolean", "null"]
          description: Whether the publishing process runs its jobs (`SCHEDULER_ENABLED`).
        jobs:
          type: array
          items: { $ref: "#/components/schemas/PlatformOperationsJob" }

    PlatformOperationsRunResult:
      type: object
      required: [name, request_id, result]
      properties:
        name: { type: string }
        request_id: { type: string, format: uuid }
        result:
          type: string
          description: |
            `queued` — a process heard the request · `already_running` — the
            job's running marker is held · `disabled` — the job is switched off ·
            `no_listener` — no scheduler is subscribed.
          enum: [queued, already_running, disabled, no_listener]

    PlatformOperationsWebhooks:
      type: object
      required: [generated_at, window_hours, pending, overdue, oldest_pending_age_s, last_window]
      properties:
        generated_at: { type: string, format: date-time }
        window_hours: { type: integer }
        pending: { type: integer }
        overdue: { type: integer }
        oldest_pending_age_s: { type: ["number", "null"] }
        last_window:
          type: object
          required: [delivered, failed, exhausted, failure_rate, workspaces_failing]
          properties:
            delivered: { type: integer }
            failed: { type: integer }
            exhausted: { type: integer }
            failure_rate:
              type: ["number", "null"]
              description: (failed + exhausted) / (delivered + failed + exhausted); null with none.
            workspaces_failing: { type: integer }

    PlatformOperationsSiem:
      type: object
      required:
        - generated_at
        - provider
        - workspaces_enabled
        - workspaces_stalled
        - last_run_at
        - last_exported_at
        - exported_total
      properties:
        generated_at: { type: string, format: date-time }
        provider: { type: string }
        workspaces_enabled: { type: integer }
        workspaces_stalled: { type: integer }
        last_run_at: { type: ["string", "null"], format: date-time }
        last_exported_at: { type: ["string", "null"], format: date-time }
        exported_total: { type: integer }

    PlatformOperationsPartition:
      type: object
      required: [name, month, default, est_rows, size_bytes]
      properties:
        name: { type: string }
        month: { type: ["string", "null"], description: "`YYYY-MM`; null for the catch-all." }
        default: { type: boolean }
        est_rows: { type: integer }
        size_bytes: { type: integer }

    PlatformOperationsPartitions:
      type: object
      required: [generated_at, window, partitions, missing_months, default_has_rows]
      properties:
        generated_at: { type: string, format: date-time }
        window:
          type: object
          required: [behind, ahead]
          properties:
            behind: { type: integer }
            ahead: { type: integer }
        partitions:
          type: array
          items: { $ref: "#/components/schemas/PlatformOperationsPartition" }
        missing_months:
          type: array
          items: { type: string }
        default_has_rows:
          type: ["boolean", "null"]
          description: Null where the catch-all could not be read.

    PlatformOperationsEnsureRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
        month:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
          description: One month to open; the whole runtime window when absent.

    PlatformOperationsEnsureResult:
      type: object
      required: [ensured, failed]
      properties:
        ensured:
          type: array
          items:
            type: object
            required: [month, name]
            properties:
              month: { type: string }
              name: { type: string }
        failed:
          type: array
          items:
            type: object
            required: [month, error_code]
            properties:
              month: { type: string }
              error_code: { type: string, description: The SQLSTATE. }

    PlatformOperationsUnverifiedSignups:
      type: object
      required: [generated_at, ttl_hours, total, older_than_ttl, oldest_age_s]
      properties:
        generated_at: { type: string, format: date-time }
        ttl_hours: { type: integer }
        total: { type: integer }
        older_than_ttl: { type: integer }
        oldest_age_s: { type: ["integer", "null"] }

    PlatformOperationsPurgeResult:
      type: object
      required: [purged, batches, ttl_hours]
      properties:
        purged: { type: integer }
        batches: { type: integer }
        ttl_hours: { type: integer }

    PlatformOperationsQueue:
      type: object
      required: [key, state, counts, oldest_unfinished_age_s]
      properties:
        key:
          type: string
          enum: [ai_jobs, knowledge_jobs, doc_worker]
        state:
          type: string
          description: "`not_installed` — no table, no query · `unreadable` — the table exists but could not be read."
          enum: [ok, not_installed, unreadable]
        counts:
          type: ["object", "null"]
          additionalProperties: { type: integer }
        oldest_unfinished_age_s: { type: ["number", "null"] }

    PlatformOperationsJobs:
      type: object
      required: [generated_at, queues]
      properties:
        generated_at: { type: string, format: date-time }
        queues:
          type: array
          items: { $ref: "#/components/schemas/PlatformOperationsQueue" }

    PlatformOperationsComponents:
      type: object
      required: [generated_at, components]
      properties:
        generated_at: { type: string, format: date-time }
        components:
          type: array
          items: { $ref: "#/components/schemas/PlatformComponentStatus" }

    PlatformBlocklistKind:
      type: string
      description: What an entry matches (`PLATFORM_BLOCKLIST_KINDS`, @siyahtus/types).
      enum: [email, domain, ip]

    PlatformBlocklistEntry:
      type: object
      required: [id, kind, value, reason, created_by, created_by_email, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/PlatformBlocklistKind" }
        value:
          type: string
          description: Normalised — an address or domain in lower case, an IP in canonical form (a CIDR with its host bits zeroed).
        reason: { type: ["string", "null"] }
        created_by: { type: ["string", "null"], format: uuid }
        created_by_email: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }

    PlatformBlocklistList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformBlocklistEntry" }
        next_cursor: { type: ["string", "null"] }

    PlatformBlocklistCreateRequest:
      type: object
      required: [kind, value, reason]
      properties:
        kind: { $ref: "#/components/schemas/PlatformBlocklistKind" }
        value: { type: string, minLength: 1, maxLength: 320 }
        reason:
          type: string
          minLength: 3
          maxLength: 500

    PlatformCounted:
      type: object
      required: [key, count]
      properties:
        key: { type: string, description: An address or a licence number }
        count: { type: integer, minimum: 0 }

    PlatformFailedLogins:
      type: object
      required: [generated_at, hours, since, tenant, operator]
      properties:
        generated_at: { type: string, format: date-time }
        hours: { type: integer }
        since: { type: string, format: date-time }
        tenant:
          type: object
          required: [live, history]
          properties:
            live:
              type: object
              required:
                [status, window_seconds, limit, addresses_total, locked_total, addresses, truncated]
              properties:
                status:
                  type: string
                  description: "`unavailable` when Redis could not be read."
                  enum: [available, unavailable]
                window_seconds: { type: integer }
                limit:
                  { type: integer, description: Failures per window before the address is refused. }
                addresses_total: { type: integer }
                locked_total: { type: integer }
                addresses:
                  type: array
                  items:
                    type: object
                    required: [ip, failures, locked]
                    properties:
                      ip: { type: string }
                      failures: { type: integer }
                      locked: { type: boolean }
                truncated: { type: boolean }
            history:
              type: object
              required: [total, by_ip, by_workspace]
              properties:
                total: { type: integer }
                by_ip:
                  type: array
                  items: { $ref: "#/components/schemas/PlatformCounted" }
                by_workspace:
                  type: array
                  items: { $ref: "#/components/schemas/PlatformCounted" }
        operator:
          type: object
          required: [sign_in_failed, totp_failed, by_ip]
          properties:
            sign_in_failed: { type: integer }
            totp_failed: { type: integer }
            by_ip:
              type: array
              items: { $ref: "#/components/schemas/PlatformCounted" }

    PlatformSignupsByIp:
      type: object
      required: [status, days, reason, data]
      properties:
        status:
          type: string
          enum: [available, not_available]
        days: { type: integer }
        reason: { type: ["string", "null"] }
        data:
          type: array
          items: { $ref: "#/components/schemas/PlatformCounted" }

    PlatformAbuseCounterStatus:
      type: string
      description: |
        `available` — the source is there and counted; `not_installed` — the
        table it reads is not part of this database; `not_available` — the
        guard keeps no count to read.
      enum: [available, not_installed, not_available]

    PlatformAbuseCounters:
      type: object
      required: [generated_at, invites, widget_quota, widget_challenge]
      properties:
        generated_at: { type: string, format: date-time }
        invites:
          type: object
          required: [status, limit_per_day, workspaces_at_limit, workspaces]
          properties:
            status: { $ref: "#/components/schemas/PlatformAbuseCounterStatus" }
            limit_per_day: { type: integer }
            workspaces_at_limit: { type: integer }
            workspaces:
              type: array
              items: { $ref: "#/components/schemas/PlatformCounted" }
        widget_quota:
          type: object
          required: [status, day, members_at_cap, workspaces_affected, workspaces]
          properties:
            status: { $ref: "#/components/schemas/PlatformAbuseCounterStatus" }
            day: { type: string, description: The UTC day counted (YYYY-MM-DD). }
            members_at_cap: { type: integer }
            workspaces_affected: { type: integer }
            workspaces:
              type: array
              items: { $ref: "#/components/schemas/PlatformCounted" }
        widget_challenge:
          type: object
          required: [status, component]
          properties:
            status: { $ref: "#/components/schemas/PlatformAbuseCounterStatus" }
            component:
              oneOf:
                - { $ref: "#/components/schemas/PlatformComponentStatus" }
                - { type: "null" }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message, request_id]
          properties:
            type:
              type: string
              description: One of `ERROR_TYPES` (`@siyahtus/types`).
            message:
              type: string
              description: Human-readable; never contains secrets or raw SQL.
            request_id:
              type: string
              description: Correlates with server logs and traces.
            details:
              type: object
              additionalProperties: true

    PlatformNoticeText:
      type: object
      description: One sentence in English and Turkish — both, always.
      required: [en, tr]
      additionalProperties: false
      properties:
        en: { type: string, minLength: 1, maxLength: 500 }
        tr: { type: string, minLength: 1, maxLength: 500 }

    PlatformAnnouncement:
      type: object
      description: |
        The banner every panel user sees (`NoticeBar`). It stops being served
        once `until` has passed.
      required: [level, en, tr, until]
      additionalProperties: false
      properties:
        level: { type: string, enum: [info, warning, critical] }
        en: { type: string, minLength: 1, maxLength: 500 }
        tr: { type: string, minLength: 1, maxLength: 500 }
        until: { type: ["string", "null"], format: date-time }

    PlatformMaintenance:
      type: object
      required: [enabled, mode, message]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        mode: { type: string, enum: [read_only, full] }
        message:
          oneOf:
            - { $ref: "#/components/schemas/PlatformNoticeText" }
            - { type: "null" }

    PlatformDeploymentSettings:
      type: object
      description: |
        What `platform_settings` holds for the tenant API; `null` is "not set
        here". `updated_at` is the newest change among these keys.
      required: [signup_enabled, trial_days, announcement, maintenance, updated_at]
      properties:
        signup_enabled: { type: ["boolean", "null"] }
        trial_days: { type: ["integer", "null"], minimum: 1, maximum: 365 }
        announcement:
          oneOf:
            - { $ref: "#/components/schemas/PlatformAnnouncement" }
            - { type: "null" }
        maintenance:
          oneOf:
            - { $ref: "#/components/schemas/PlatformMaintenance" }
            - { type: "null" }
        updated_at: { type: ["string", "null"], format: date-time }

    PlatformSettingsPatchRequest:
      type: object
      description: At least one key besides `reason`; `null` removes the stored value.
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        signup_enabled: { type: ["boolean", "null"] }
        trial_days: { type: ["integer", "null"], minimum: 1, maximum: 365 }
        announcement:
          oneOf:
            - { $ref: "#/components/schemas/PlatformAnnouncement" }
            - { type: "null" }

    PlatformMaintenanceRequest:
      type: object
      required: [reason, enabled, mode]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        enabled: { type: boolean }
        mode: { type: string, enum: [read_only, full] }
        message:
          oneOf:
            - { $ref: "#/components/schemas/PlatformNoticeText" }
            - { type: "null" }

    PlatformEffectiveConfigEntry:
      type: object
      required: [key, value, source, redacted, panel]
      properties:
        key: { type: string, description: The environment variable's name. }
        value:
          type: ["string", "null"]
          description: |
            The value the tenant API runs with, as text; `set` / `unset` when
            `redacted`; `null` for an optional key with no value.
        source: { type: string, enum: [db, env, default] }
        redacted: { type: boolean, description: A secret — only whether it is set is shown. }
        panel:
          type: boolean
          description: This panel can override it (`PATCH /settings`).

    PlatformEffectiveConfig:
      type: object
      required: [stale, generated_at, age_s, entries]
      properties:
        stale:
          type: boolean
          description: No publication, or one older than 90 seconds.
        generated_at: { type: ["string", "null"], format: date-time }
        age_s: { type: ["number", "null"] }
        entries:
          type: array
          description: Alphabetical by key.
          items: { $ref: "#/components/schemas/PlatformEffectiveConfigEntry" }

    PlatformAiLlmSettings:
      type: object
      description: |
        The model settings as stored. `null` in a field is "not set here" —
        for `timeout_ms` and `max_output_tokens` the environment's value
        (`LLM_TIMEOUT_MS`, `LLM_MAX_OUTPUT_TOKENS`) applies. The key itself is
        never returned.
      required:
        [
          provider,
          base_url,
          model,
          model_fast,
          region,
          timeout_ms,
          max_output_tokens,
          api_key_last4,
        ]
      properties:
        provider: { type: string, enum: [mock, openai] }
        base_url: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        model_fast:
          type: ["string", "null"]
          description: The model a `fast` call uses (classifying, summarising); `null` — `model`.
        region: { type: ["string", "null"], enum: [eu, us, null] }
        timeout_ms: { type: ["integer", "null"], minimum: 1000, maximum: 120000 }
        max_output_tokens: { type: ["integer", "null"], minimum: 1, maximum: 16384 }
        api_key_last4:
          type: ["string", "null"]
          description: The stored key's last four characters; `null` — no key stored here.

    PlatformAiEmbeddingSettings:
      type: object
      description: The embedding provider as stored; `PlatformAiLlmSettings`' rules.
      required: [provider, base_url, model, region, dimensions, api_key_last4]
      properties:
        provider: { type: string, enum: [mock, openai] }
        base_url: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        region: { type: ["string", "null"], enum: [eu, us, null] }
        dimensions:
          type: integer
          enum: [1536]
          description: Fixed — `knowledge_chunks.embedding` is `vector(1536)`.
        api_key_last4: { type: ["string", "null"] }

    PlatformAiDailyCap:
      type: object
      required: [workspace, global]
      additionalProperties: false
      properties:
        workspace:
          type: integer
          minimum: 1
          description: Tokens a day for a workspace with no plan figure or override of its own.
        global:
          type: integer
          minimum: 1
          description: Tokens a day for the whole deployment.

    PlatformAiDeploymentCaps:
      type: object
      description: |
        The deployment's daily caps per meter, in place of the four
        `AI_DAILY_*` settings. Stored under `ai.caps` beside the plans'
        defaults (`plans`, tm 389.12), which this does not touch.
      required: [llm, embedding]
      additionalProperties: false
      properties:
        llm: { $ref: "#/components/schemas/PlatformAiDailyCap" }
        embedding: { $ref: "#/components/schemas/PlatformAiDailyCap" }

    PlatformAiPrices:
      type: object
      description: |
        What the provider charges, in US dollars per million tokens — the AI
        usage report's cost estimate, in place of the three `AI_PRICE_*`
        settings. `null` — no estimate for that meter.
      required: [llm_input_usd_per_mtok, llm_output_usd_per_mtok, embedding_usd_per_mtok]
      additionalProperties: false
      properties:
        llm_input_usd_per_mtok: { type: ["number", "null"], minimum: 0, maximum: 10000 }
        llm_output_usd_per_mtok: { type: ["number", "null"], minimum: 0, maximum: 10000 }
        embedding_usd_per_mtok: { type: ["number", "null"], minimum: 0, maximum: 10000 }

    PlatformAiReembedStatus:
      type: object
      description: |
        The last re-embedding this panel started. `idle` — none since Redis
        last lost the record.
      required: [state, started_at, finished_at, target, sources, chunks, failed, refused, capped]
      properties:
        state: { type: string, enum: [idle, running, finished, failed] }
        started_at: { type: ["string", "null"], format: date-time }
        finished_at: { type: ["string", "null"], format: date-time }
        target:
          type: ["string", "null"]
          description: The embedding space moved into (`<provider>:<model>`).
        sources: { type: integer, minimum: 0, description: Sources moved so far. }
        chunks: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        refused: { type: integer, minimum: 0, description: Workspaces the residency rule kept out. }
        capped:
          type: boolean
          description: The deployment's daily embedding allowance ran out; start again after 00:00 UTC.

    PlatformAiSettingsSource:
      type: object
      required: [llm, embedding]
      properties:
        llm: { type: string, enum: [db, env] }
        embedding: { type: string, enum: [db, env] }

    PlatformAiSettings:
      type: object
      required: [llm, embedding, caps, prices, source, reembed, updated_at]
      properties:
        llm:
          oneOf:
            - { $ref: "#/components/schemas/PlatformAiLlmSettings" }
            - { type: "null" }
        embedding:
          oneOf:
            - { $ref: "#/components/schemas/PlatformAiEmbeddingSettings" }
            - { type: "null" }
        caps:
          oneOf:
            - { $ref: "#/components/schemas/PlatformAiDeploymentCaps" }
            - { type: "null" }
        prices:
          oneOf:
            - { $ref: "#/components/schemas/PlatformAiPrices" }
            - { type: "null" }
        source: { $ref: "#/components/schemas/PlatformAiSettingsSource" }
        reembed: { $ref: "#/components/schemas/PlatformAiReembedStatus" }
        updated_at: { type: ["string", "null"], format: date-time }
        warning:
          type: string
          enum: [reembed_required]
          description: |
            `PUT` only — the embedding provider or model changed, so the stored
            knowledge has to be re-embedded (`POST /settings/ai/reembed`).

    PlatformAiLlmInput:
      type: object
      required: [provider]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [mock, openai] }
        base_url: { type: ["string", "null"], maxLength: 500 }
        model: { type: ["string", "null"], minLength: 1, maxLength: 200 }
        model_fast: { type: ["string", "null"], minLength: 1, maxLength: 200 }
        region: { type: ["string", "null"], enum: [eu, us, null] }
        timeout_ms: { type: ["integer", "null"], minimum: 1000, maximum: 120000 }
        max_output_tokens: { type: ["integer", "null"], minimum: 1, maximum: 16384 }
        api_key:
          type: ["string", "null"]
          minLength: 8
          maxLength: 500
          writeOnly: true
          description: Absent — keep the stored key; a string — replace it; `null` — remove it.

    PlatformAiEmbeddingInput:
      type: object
      required: [provider]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [mock, openai] }
        base_url: { type: ["string", "null"], maxLength: 500 }
        model: { type: ["string", "null"], minLength: 1, maxLength: 200 }
        region: { type: ["string", "null"], enum: [eu, us, null] }
        dimensions: { type: integer, enum: [1536] }
        api_key:
          type: ["string", "null"]
          minLength: 8
          maxLength: 500
          writeOnly: true

    PlatformAiSettingsRequest:
      type: object
      description: At least one key besides `reason`; `null` removes the stored value.
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        llm:
          oneOf:
            - { $ref: "#/components/schemas/PlatformAiLlmInput" }
            - { type: "null" }
        embedding:
          oneOf:
            - { $ref: "#/components/schemas/PlatformAiEmbeddingInput" }
            - { type: "null" }
        caps:
          oneOf:
            - { $ref: "#/components/schemas/PlatformAiDeploymentCaps" }
            - { type: "null" }
        prices:
          oneOf:
            - { $ref: "#/components/schemas/PlatformAiPrices" }
            - { type: "null" }

    PlatformAiConnectionTestRequest:
      type: object
      required: [reason, target]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        target: { type: string, enum: [llm, embedding] }

    PlatformAiConnectionTest:
      type: object
      required: [target, provider, source, model, ok, latency_ms, error]
      properties:
        target: { type: string, enum: [llm, embedding] }
        provider: { type: string, enum: [mock, openai] }
        source: { type: string, enum: [db, env] }
        model: { type: ["string", "null"] }
        ok: { type: boolean }
        latency_ms: { type: integer, minimum: 0 }
        error:
          type: ["string", "null"]
          description: |
            The failure's kind (`timeout`, `auth`, `rate_limited`, `network`,
            `bad_request`, `bad_response`, `provider_error`, `circuit_open`,
            `no_answer`, `ai_daily_cap`, `misconfigured`) — never the
            provider's message.

  responses:
    BadRequest:
      description: |
        Malformed body, or a value failing validation (`validation`);
        `platform_reason_required` — a mutation without a 3–500 character
        `reason` (tm 389.5).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        No session, an unknown token, or a session past its absolute lifetime or
        its idle timeout (`authentication`) — sign in again. Also a wrong,
        expired or replayed code.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        `platform_totp_required` — the session has shown a password but no code
        (`details.next`: `totp_enroll` | `totp_verify`); `authorization` — the
        operator's role lacks `details.permission`; `platform_recent_totp_required`
        — re-verify (`/auth/totp/reverify`) and retry; `not_allowed` — the
        address is outside `PLATFORM_IP_ALLOWLIST` (`details.reason`
        `ip_not_allowed`) or the session is already verified.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        `platform_last_superadmin`, `account_exists`, `two_factor_already_enabled` or
        `platform_workspace_state` (`details.reason`, tm 389.10) or
        `platform_account_state` (`details.reason`, tm 389.11) or
        `platform_operation_running` (tm 389.17) — the request was fine, the
        state refused it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: |
        The per-address platform bucket is spent (`RATE_LIMIT_PLATFORM_PER_MIN`,
        Redis `rl:platform:*`). `Retry-After` says when to try again.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
