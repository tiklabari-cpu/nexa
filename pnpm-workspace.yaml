packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 requires build scripts to be opted into explicitly. These four need
# theirs: Prisma downloads/produces its query engine, esbuild installs its
# platform binary. Nothing else in the tree runs install scripts.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true

# pnpm hoists one copy of every transitive package into `node_modules/.pnpm/node_modules/`
# as a fallback resolution root. That directory is visible to EVERY package in the virtual
# store, so a type package pulled in by one workspace silently changes what `tsc` sees in
# all the others.
#
# Measured when `apps/mobile` arrived (tm 90.1): `jest-expo` depends on
# `jest-environment-jsdom`, which depends on `@types/jsdom`. Hoisted, it made
# `vitest/optional-types.d.ts`'s `import('jsdom')` resolve for the first time, which pulled
# `lib.dom` into `apps/api`'s program — a Node-only service — and gave it a global DOM
# `Node`. `xml-crypto`'s `loadSignature(node: Node)` then meant the browser `Node` instead
# of degrading to `any`, and `apps/api/src/lib/saml.ts` stopped compiling on code nobody had
# touched. A server must not typecheck against browser globals, so the leak is closed here
# rather than papered over at the call site. `jest-environment-jsdom` declares
# `@types/jsdom` itself and still gets its own copy; only the repo-wide fallback is withdrawn.
hoistPattern:
  - "*"
  - "!@types/jsdom"

# Changing `hoistPattern` invalidates the whole `node_modules` layout, so the next install
# rebuilds it. pnpm normally stops and asks first, and a window running without a TTY gets
# `ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY` instead of an install — a gate failure with
# nothing actually broken.
confirmModulesPurge: false

# Security overrides (tm 256.2). Each one names its advisory and why a normal
# in-range update could not reach the fix; drop the entry once the parent ships it.
#
# deepmerge-ts < 8 — GHSA-ggr8-5vv4-36mx (stack exhaustion on self-referencing
# graphs). Every `@prisma/config` release up to 7.x pins exactly 7.1.5. Prisma
# calls only the plain `deepmerge` export, as c12's merger when it loads a
# config file; 8.0's breaking changes (Map merging, renamed custom-merge types,
# `deepmergeInto`) do not touch that call.
overrides:
  "@prisma/config>deepmerge-ts": "^8.0.2"
  # apps/mobile (tm 444, audit F37): in-range patches for the Expo / React Native tree. The
  # parents pin the vulnerable release (exact or a caret that resolves to it), so a normal
  # `pnpm update` cannot reach the fix. Only same-major bumps; drop an entry when its parent
  # ships the fixed range.
  # shell-quote 1.8.4–1.10.0 — GHSA-pqg4-j6r4-53mv (critical; react-devtools-core).
  "shell-quote@<1.11.0": "^1.11.0"
  # @xmldom/xmldom <= 0.8.14 — 6 advisories, high (@expo/plist, config-plugins).
  "@xmldom/xmldom@<0.8.15": "^0.8.15"
  # js-yaml 3.x < 3.15.2 / 4.x < 4.3.2 — GHSA-52cp-r559-cp3m and others, high
  # (@jest/transform via babel-jest; @expo/xcpretty).
  "js-yaml@^3.0.0": "^3.15.2"
  "js-yaml@^4.0.0": "^4.3.2"
  # brace-expansion 1.x < 1.1.21 and 5.x < 5.0.12 — 4 advisories, high (minimatch in jest
  # and in @expo/config-plugins' glob).
  "brace-expansion@^1.0.0": "^1.1.21"
  "brace-expansion@^5.0.0": "^5.0.12"
  # nanoid 3.x < 3.3.18 — GHSA-2v37-7h3g-55p8, high (@react-navigation/routers).
  "nanoid@^3.0.0": "^3.3.18"
  # node-forge <= 1.4.0 — 6 advisories, high (@expo/code-signing-certificates).
  "node-forge@<1.4.1": "^1.4.1"
  # source-map-js < 1.2.2 — GHSA-68fv-2mgg-jv7q, high (postcss).
  "source-map-js@<1.2.2": "^1.2.2"
  # compression < 1.8.2 — GHSA-vc2v-76pw-4v95, high (@expo/cli dev server).
  "compression@<1.8.2": "^1.8.2"

# pdfjs-dist (tm 313.2, the knowledge document worker) lists `@napi-rs/canvas` as optional:
# pdf.js loads it to render pages to a canvas. The worker only reads text — it never renders —
# so the native binary would be code a hostile PDF could reach and nothing ever needs. Without
# it pdf.js logs one "Cannot load @napi-rs/canvas" warning (to the worker's discarded stdout)
# and text extraction is unchanged.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
